name: Standards

# Praetor / HISS-16 governance gate (ADR-1249).
#
# Runs on every pull request with no `paths:` filter on purpose: the HISS scan
# reads source, the baseline ratchet has to see every change, and a required
# context that silently does not start would leave the aggregator waiting on a
# check that never reports.
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the whole workflow (ADR-0875).
permissions:
  contents: read

jobs:
  standards:
    # required-aggregator: Standards & Invariant Verification Gate
    name: Standards & Invariant Verification Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod  # single source of truth: the go directive in go.mod
          cache: true

      # praetor publishes no semver releases, only the moving tags
      # bleeding/edge/latest/lts, so the governance engine is pinned by commit
      # exactly like every other third-party dependency in this repo. Bumping it
      # is a deliberate PR: a newer praetor can tighten a policy and turn this
      # gate red on unrelated work.
      - name: Install praetorctl
        env:
          PRAETOR_REF: 846da5908d15b3cf5581ca6b0205cc644b249599  # praetor main, 2026-09-19; the baseline is recorded against this engine.
          # Bumped from e4b35cb3c7fe after proving both engines record byte-identical
          # infraction sets on master (1414 entries, same fingerprints) -- see PR body.
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # No hook toolchain is installed here. Under CI the audit's hook gate only
      # checks that lefthook.yml is present; the local hook installation it
      # verifies on a developer machine is skipped by the engine itself.

      - name: Report the governance engine version
        run: standardsctl version

      # The canonical AGENTS.md is compiled into six vendor context files. This
      # fails if any of them was hand-edited, if AGENTS.md grew past the
      # 300-line-per-target budget, if a persona copy under a vendor agents
      # directory differs from (or has no source in) .agents/agents, or if
      # AGENTS.md is written in prose rather than the internal register.
      - name: Verify agent context integrity (HISS-16)
        run: standardsctl compile-context --verify

      # ADR-1267: the baseline remains a mechanically generated migration
      # inventory, never permission for active debt. The audit proves the scan
      # matches that inventory; the second command requires the inventory itself
      # to be empty before this required job can pass.
      - name: Audit full-tree HISS invariants at zero debt
        run: |
          standardsctl audit
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path(".standards-baseline.json").read_text(encoding="utf-8"))
          total = baseline.get("total_infractions")
          entries = baseline.get("infractions")
          if total != 0 or entries != []:
              raise SystemExit(
                  "Praetor migration inventory is nonzero: "
                  f"total_infractions={total}, entries={len(entries or [])}"
              )
          PY
