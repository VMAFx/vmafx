name: CI

# ADR-1140 / BUG-098 — converted required consumer workflows always start and
# route work through scripts/ci/plan-ci-impact.py. Their exact-name gates are
# strictMustReport; absent-means-pass remains for contexts not yet under that contract.
# ADR-0313 — Permanent fix for the doc/Python-only-PR vs C-build-required-checks
# structural deadlock. This single workflow runs on every PR (no path filter)
# and verifies that each named required check on the head SHA reported an
# accepted result (with stricter success-only handling for strictMustReport). It becomes the
# single required-status-check that branch protection enforces. Required-context
# workflows route expensive work in-job; only non-required/advisory workflows may
# retain trigger path filters.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: required-aggregator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregator:
    name: Required Checks Aggregator
    runs-on: ubuntu-26.04
    timeout-minutes: 250
    steps:
      - name: Block draft PRs from satisfying the required check
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "::error::Draft PRs must not satisfy Required Checks Aggregator."
          echo "Mark the PR ready for review so this workflow reruns and waits for the real gates."
          exit 1

      - name: Wait for sibling workflows + verify required-check outcomes
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # ADR-1177 — operator switch for the Arc A380 self-hosted lane.
          SYCL_ARC_RUNNER_ENABLED: ${{ vars.SYCL_ARC_RUNNER_ENABLED }}
          # ADR-1319 — distinct switch for the unprovisioned multi-vendor lane.
          GPU_COVERAGE_ENABLED: ${{ vars.GPU_COVERAGE_ENABLED }}
        with:
          retries: 3
          script: |
            // Ordered by historical reliability. The note that used to sit
            // here said no Build matrix entries belonged in this list because
            // they path-filter-skip on doc/Python-only diffs. That was never a
            // reason to leave them out: ADR-0313 already makes "not reported"
            // an accepted outcome for every name below, so a path-filtered leg
            // costs nothing when it does not run and gates when it does.
            // ADR-1297 added them, along with every other check that was
            // reporting on the pull request and blocking nothing.
            const required = [
              'Ubuntu gcc+DNN',
              'Ubuntu clang+DNN',
              'Windows MinGW64',
              'Windows MSVC+CUDA',
              'Windows MSVC+SYCL',
              'CodeQL',
              'CodeQL (Actions)',
              'CodeQL (C/C++)',
              'CodeQL (Python)',
              'Pre-Commit',
              'Scorecard PR Gate',
              'Scorecard Master Gate',
              'Python Lint',
              // ADR-1238: scanner failures must not hide the Go test suite.
              'go vet + go test',
              'Semgrep',
              'Tidy Changed',
              'Tidy Ratchet',
              'Cppcheck',
              'Dependency Review',
              'Gitleaks',
              'Docs',
              'ShellCheck + shfmt',
              'Netflix CPU Golden',
              'Coverage GPU',
              'Sanitizers (address)',
              'Sanitizers (thread)',
              'Sanitizers (undefined)',
              'Assertion Density',
              'Twin Drift',
              'Tiny AI',
              'Ubuntu HIP',
              'SYCL Parity (Arc A380)',
              // ADR-1151 — the process gates in rule-enforcement.yml were
              // reporting but not required, so a red Release Script Contract
              // (or a missing deliverables checklist / doc-substance /
              // state.md touch / ffmpeg-patch sync / ADR collision) did not
              // block a merge and needed no admin bypass. All six trigger on
              // `pull_request` and carry the same draft gate as the jobs
              // above, so they genuinely report on every non-draft PR.
              // The four authoring-discipline gates among them disarm
              // themselves on a machine-generated release PR via
              // scripts/ci/release-pr-exempt.sh — release-please writes no
              // ADR-0108 checklist and its version-marker diff is path-mapped
              // to docs/ trees a bot never touches, so without that they would
              // be red on every release PR. `Release Script Contract` and
              // `ADR Number Collision Guard` stay armed there on purpose.
              // ADR-1249 / ADR-1274 — HISS-21 context, debt ratchet and
              // replayed evidence. All four contexts always report.
              'Standards & Invariant Verification Gate',
              'HISS Replay Evidence (Linux)',
              'HISS Replay Evidence (macOS)',
              'HISS Replay Evidence (Windows)',
              'Deliverables Checklist',
              'Doc-Substance Gate',
              'docs/state.md Gate',
              'FFmpeg-Patches Surface Sync',
              // ADR-1284 — a merge that removes target work nobody asked it
              // to remove is invisible in the PR diff, so the gate has to be
              // required rather than advisory.
              'Silent-Revert Guard',
              'FFmpeg Patch Stack',
              'ADR Collision Guard',
              'Release Script Contract',

              // ADR-1297 — everything below was reporting a check on the pull
              // request and blocking nothing. Branch protection requires a
              // single context (Required Checks Aggregator, ruleset
              // 22587111), so this array IS the merge gate in full: a name
              // missing from it is a leg that can be red while the merge
              // button stays green. On PR #1518, 44 of the 89 reported checks
              // were ungated and nine of those were red, including every
              // macOS leg, the plain (non-DNN) Ubuntu gcc and clang builds,
              // and Coverage Gate. scripts/ci/check-aggregator-names.sh read
              // OK throughout, because it checks this array against the
              // `# required-aggregator` markers and they agreed: the gap was
              // not drift, it was the declared state.
              //
              // NOTE for anyone editing the comments in this array: the
              // checker extracts names with a single-quote regex over the
              // whole block, so prose here must contain no apostrophes and no
              // single-quoted phrases. Write "the ADR-0313 rule", not
              // "ADR-0313" followed by an apostrophe.
              //
              // Platform build legs (libvmaf-build-matrix.yml). The shipped
              // library must compile on every platform and toolchain the
              // fork claims to support. Only the `+DNN` siblings were gated
              // before, so `Ubuntu gcc` itself could fail. `macOS clang` and
              // `macOS clang+DNN` also lost `experimental: true` in this
              // change: continue-on-error never neutralised the check-run
              // conclusion, so the flag only made the workflow claim the legs
              // were advisory while nothing acted on that claim.
              'Ubuntu gcc',
              'Ubuntu clang',
              'Ubuntu ARM clang',
              'Ubuntu gcc static',
              'macOS clang',
              'macOS clang+DNN',
              'macOS Metal',
              // Backend build legs — a backend that ships must not be able to
              // stop compiling without blocking a merge. All four are hosted
              // compile/link lanes; none needs a GPU.
              'Ubuntu CUDA',
              'Ubuntu CUDA static',
              'Ubuntu SYCL',
              'Ubuntu SYCL+CUDA',
              // build.yml rows. `Linux Intel LLVM` is the only leg that
              // builds every Linux backend at once under one icx/icpx
              // identity; `Windows MSVC+CUDA (full)` was deliberately renamed
              // apart from the required `Windows MSVC+CUDA`
              // (T-CI-MSVC-CUDA-SHARED-CHECK-NAME-2026-09-18) so the two
              // could not mask each other, and then never gated.
              'Linux Intel LLVM',
              'macOS Clang+Metal',
              'Windows MSVC+CUDA (full)',
              // ADR-1260 left this lane advisory until the maintainer
              // promoted it. This is that promotion. It is the only lane
              // that compiles the NEON tree with cl.exe and runs the fast
              // suite on ARM64 silicon.
              'Windows ARM64 MSVC',
              // Test and quality gates that always report.
              // `Coverage Gate` is the check whose `|| true` this branch
              // removed; leaving it ungated re-opens the same hole from the
              // other side, with `Coverage GPU` — the self-hosted sibling
              // that legitimately skips — gated and this one not.
              'Coverage Gate',
              'MCP Smoke',
              'Sanitizers ASan+UBSan',
              // Lint gates. ADR-0217 made `Tidy SYCL` advisory until one
              // green master run confirmed the wrapper; the last six Lint
              // runs on master all report it `success`, so the condition is
              // met, `continue-on-error` is gone, and the "(advisory)" suffix
              // is gone from the job name because it no longer describes the
              // job. ADR-1142 leaves no tier in which SYCL TUs are exempt
              // from clang-tidy.
              'Markdown Lint',
              'No Conflict Markers',
              'Tiny-Model Registry Validate',
              'Tidy SYCL',
              // Consumer and artifact contracts. BUG-098 removed their
              // workflow-level path filters: impact planners now skip only
              // expensive work, while exact-name gates always report.
              'FFmpeg Ubuntu gcc',
              'FFmpeg macOS clang',
              'FFmpeg SYCL',
              'Docker Image Build',
              'Dev Container Build',
              'vmafx-sys CI',
              'cargo-deny',
              // `helm lint + template` was missed by the first pass of
              // ADR-1297: that pass derived the ungated set from a single pull
              // request statusCheckRollup, and #1518 touches no
              // `deploy/helm/**` path, so the lane never appeared in it. The
              // chart is a user-discoverable surface — people run
              // `helm install` on it — and the header of helm-chart.yml
              // records that `helm lint` was failing on master for an unknown
              // length of time before that workflow existed. `E2E — kind +
              // kuttl` does not cover it: that lane is label-gated, so it does
              // not run on the pull request that breaks the chart. This does.
              // NOTE: no apostrophes in this block — check-aggregator-names.sh
              // extracts required[] by matching single-quoted literals.
              'helm lint + template',
              // Documentation surfaces. `Docs Site Build` was reported under
              // the bare job id `build` until this change renamed it; a
              // required context called `build` would be shared by any future
              // unnamed `build` job, which is the masking class above. Gating
              // it is what gives the ADR-1294 ref-scoped concurrency group
              // teeth, because `cancelled` is not in `accepted` below.
              // `Doxygen Public API` was likewise the bare job id `doxygen`.
              'Docs Site Build',
              'Doxygen Public API',
              // Code-scanning checks from the github-advanced-security app,
              // gated for the same reason `CodeQL` above already is: a
              // security verdict on the pull request that nothing blocks on
              // is not a verdict. Both are marked with bare
              // `# required-aggregator: <name>` comments in
              // security-scans.yml, because neither is produced by a job.
              'Semgrep OSS',
              'gitleaks',
            ];

            // ADR-1274 — these governance jobs have no path or event filter,
            // so absence or `skipped` is never a legitimate outcome. Keeping
            // this list separate from `required` makes that fail-closed
            // contract explicit instead of relying on the generic
            // absent-means-path-skip behavior below.
            const strictMustReport = [
              'Standards & Invariant Verification Gate',
              'HISS Replay Evidence (Linux)',
              'HISS Replay Evidence (macOS)',
              'HISS Replay Evidence (Windows)',
              // ADR-1297 — same contract, applied to the gates added in that
              // ADR that have no trigger path filter and no conditional skip,
              // and that report on `pull_request` AND on `push` to master
              // (this workflow runs on both). For these, "the check never
              // appeared" is a broken workflow or a vanished runner, not a
              // path skip. `Windows ARM64 MSVC` is the sharpest case: it pins
              // the `windows-11-vs2026-arm` label across the 2026-09-21..30
              // image migration, and if that label stops resolving the job
              // never registers — without this list, a vanished platform
              // would read as a pass.
              // Deliberately NOT here: `Sanitizers ASan+UBSan`, whose `if:`
              // excludes `push` so it never reports on a master push.
              'Coverage Gate',
              'MCP Smoke',
              'Markdown Lint',
              'No Conflict Markers',
              'Tiny-Model Registry Validate',
              // The Tidy SYCL job has no workflow or job-level path filter.
              // Its detect step may skip the expensive body, but the job still
              // reports success on every eligible PR and master push. Absence
              // therefore means the workflow failed to register, not that a
              // path filter legitimately omitted the context.
              'Tidy SYCL',
              'Windows ARM64 MSVC',
              // BUG-098 — these workflows now start for every pull request
              // and master push. The planner may skip their expensive work,
              // but an exact-name gate still reports. Absence therefore means
              // broken workflow registration, never "not applicable".
              'Linux Intel LLVM',
              'macOS Clang+Metal',
              'Windows MSVC+CUDA (full)',
              'FFmpeg Ubuntu gcc',
              'FFmpeg macOS clang',
              'FFmpeg SYCL',
              'Docker Image Build',
              'Dev Container Build',
              'vmafx-sys CI',
              'cargo-deny',
              'helm lint + template',
              'Doxygen Public API',
            ];

            // GitHub does not create a dependent job's check run until every
            // `needs` job has completed. The BUG-098 exact-name gates therefore
            // remain absent while their distinctly named work checks run. Keep
            // polling through that legitimate absence, plus a short propagation
            // window after the last dependency completes. Matrix gates depend on
            // the aggregate matrix result, so each maps every row in that matrix.
            // ADR-1319 extends the same rule to hosted hardware-admission probes.
            const delayedStrictDependencies = {
              "Coverage GPU": ["Probe GPU Full Runner"],
              "SYCL Parity (Arc A380)": ["Probe SYCL Runner"],
              "Linux Intel LLVM": [
                "Plan build impact",
                "Linux Intel LLVM work",
                "macOS Clang+Metal work",
                "Windows MSVC+CUDA (full) work"
              ],
              "macOS Clang+Metal": [
                "Plan build impact",
                "Linux Intel LLVM work",
                "macOS Clang+Metal work",
                "Windows MSVC+CUDA (full) work"
              ],
              "Windows MSVC+CUDA (full)": [
                "Plan build impact",
                "Linux Intel LLVM work",
                "macOS Clang+Metal work",
                "Windows MSVC+CUDA (full) work"
              ],
              "FFmpeg Ubuntu gcc": [
                "Plan FFmpeg impact",
                "FFmpeg Ubuntu gcc work",
                "FFmpeg macOS clang work"
              ],
              "FFmpeg macOS clang": [
                "Plan FFmpeg impact",
                "FFmpeg Ubuntu gcc work",
                "FFmpeg macOS clang work"
              ],
              "FFmpeg SYCL": ["Plan FFmpeg impact", "FFmpeg SYCL work"],
              "Docker Image Build": ["Plan Docker image impact", "Docker Image Build work"],
              "Dev Container Build": [
                "Plan dev-container impact",
                "Dev Container Build work"
              ],
              "vmafx-sys CI": ["Plan Rust impact", "vmafx-sys CI work"],
              "cargo-deny": ["Plan Rust impact", "cargo-deny work"],
              "helm lint + template": ["Plan Helm impact", "helm lint + template work"],
              "Doxygen Public API": ["Plan Doxygen impact", "Doxygen Public API work"]
            };

            // ADR-1151 — absent-means-pass (below) is correct ADR-0313
            // semantics for a doc-only PR and wrong for the one PR whose merge
            // creates a release: a release PR's diff is
            // `.release-please-manifest.json` plus the coordinated version
            // markers, so every path-routed gate can legitimately select
            // nothing and the whole required set resolves absent-or-skipped.
            // On a `release-please--` head ref these three must actually
            // report. `.release-please-manifest.json` and
            // `release-please-config.json` are in the `c_core` selector of
            // .github/ci-impact.json so the two build/test entries do real
            // work rather than reporting a no-op success.
            const releaseMustReport = [
              'Release Script Contract',
              'Netflix CPU Golden',
              'Ubuntu gcc+DNN',
            ];
            // ADR-1247: these scopes never wait for each other's future event.
            const scorecardGate = context.eventName === 'pull_request'
              ? 'Scorecard PR Gate' : 'Scorecard Master Gate';
            required.splice(required.indexOf(context.eventName === 'pull_request'
              ? 'Scorecard Master Gate' : 'Scorecard PR Gate'), 1);
            const headRef = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : '';
            const enforceMustReport = headRef.startsWith('release-please--');
            if (enforceMustReport) {
              core.info(`Release branch ${headRef}: absence is not acceptable for ` +
                        `${releaseMustReport.join(', ')}`);
            }
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            core.info(`Aggregating required checks for SHA ${sha}`);
            const currentRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.GITHUB_RUN_ID || context.runId),
            });
            const runCreatedMs = Date.parse(currentRun.data.created_at);
            const minCreatedMs = runCreatedMs - 2 * 60 * 1000;
            const registrationGraceDeadline = Date.now() + 2 * 60 * 1000;
            const registrationPropagationMs = 2 * 60 * 1000;
            const activeStatuses = new Set([
              'queued', 'in_progress', 'requested', 'waiting', 'pending',
            ]);

            function runTimestampMs(run) {
              return Date.parse(run.started_at || run.created_at || run.completed_at || 0);
            }

            function newestByName(checkRuns) {
              const byName = {};
              for (const run of checkRuns) {
                if (runTimestampMs(run) < minCreatedMs) continue;
                const previous = byName[run.name];
                if (!previous || runTimestampMs(run) > runTimestampMs(previous)) {
                  byName[run.name] = run;
                }
              }
              return byName;
            }

            async function listAllCheckRuns() {
              const checkRuns = [];
              for (let page = 1; page <= 20; page += 1) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                  page,
                });
                checkRuns.push(...data.check_runs);
                if (data.check_runs.length < 100) return checkRuns;
              }
              throw new Error('more than 2000 check runs reported for one SHA');
            }

            function delayedRegistrationStillExpected(name, nowMs) {
              return (delayedStrictDependencies[name] || []).some(dependency => {
                const run = byName[dependency];
                if (!run) return false;
                if (activeStatuses.has(run.status)) return true;
                const completedMs = Date.parse(run.completed_at || 0);
                return Number.isFinite(completedMs) &&
                  nowMs - completedMs <= registrationPropagationMs;
              });
            }

            // Poll up to 240 minutes for sibling workflows to register their
            // check_runs and reach a terminal state. A run that has never
            // appeared after a short registration grace period is treated as
            // path-filter-not-applicable (acceptable). Older draft-era
            // check_runs on the same SHA are ignored so a ready PR cannot
            // merge on skipped draft gates. A run still IN_PROGRESS at
            // deadline is treated as failure — extend `deadline` if your
            // matrix is slower. The Ubuntu gcc/clang DNN + Windows MSVC
            // builds can take 12+ minutes each; the deadline must also
            // account for GitHub Actions runner queue depth on free-tier
            // projects, where a job can wait 30+ minutes before starting on
            // a heavy queue (observed 2026-05-09 when ~80 CI jobs were
            // queued across the ~40 in-flight PRs and the previous
            // 30-minute deadline failed every PR with `queued` for two hours
            // straight). Bumped to 90 minutes; corresponding
            // `timeout-minutes` lifted to 100 to allow the polling job itself
            // to finish.
            //
            // 2026-08-30: the same starvation recurred at 90 minutes. A
            // two-month Renovate backlog opened ~44 concurrent dependency
            // PRs; every aggregator on that wave died on the deadline with
            // siblings still `queued`/`in_progress` and NO real check failure
            // (verified on #1083/#1087/#1089: e.g. job 89636653774 ran
            // 03:24:39 -> 04:54:53Z = 90m14s and expired on
            // `Build - Ubuntu gcc (CPU) + DNN: in_progress; CodeQL: queued;
            // ShellCheck + shfmt: queued`). Because the aggregator is a
            // required check, a timeout blocks the merge, which keeps the
            // queue deep, which causes the next timeout. Raised to 240
            // minutes with `timeout-minutes` at 250. This job only polls the
            // checks API, so a longer ceiling costs a runner slot rather
            // than compute; the hosted-runner hard cap is 360 minutes.
            const deadline = Date.now() + 240 * 60 * 1000;
            let byName = {};
            while (Date.now() < deadline) {
              const check_runs = await listAllCheckRuns();
              byName = newestByName(check_runs);
              const missing = required.filter(n => !byName[n]);
              const stillRunning = required.filter(n => {
                const run = byName[n];
                return run && activeStatuses.has(run.status);
              });
              const nowMs = Date.now();
              const delayedMissing = missing.filter(name =>
                delayedRegistrationStillExpected(name, nowMs));
              if (stillRunning.length === 0 && delayedMissing.length === 0 &&
                  (missing.length === 0 || nowMs > registrationGraceDeadline)) {
                break;
              }
              core.info(`Waiting on: ${stillRunning.slice(0, 3).join(', ')}` +
                        (stillRunning.length > 3 ? ` (+${stillRunning.length - 3} more)` : ''));
              if (delayedMissing.length > 0) {
                core.info(`Waiting for dependent gate registration: ` +
                          `${delayedMissing.slice(0, 3).join(', ')}` +
                          (delayedMissing.length > 3
                            ? ` (+${delayedMissing.length - 3} more)` : ''));
              }
              if (missing.length > 0 && Date.now() <= registrationGraceDeadline) {
                core.info(`Waiting for check registration: ${missing.slice(0, 3).join(', ')}` +
                          (missing.length > 3 ? ` (+${missing.length - 3} more)` : ''));
              }
              await new Promise(r => setTimeout(r, 30000));
            }

            // ADR-1177 / ADR-1319 — hardware lanes are admitted by an explicit
            // operator switch plus a hosted live-runner probe. Disabled means
            // absence or skip is permitted. Enabled means the hardware job must
            // report success; absence, skip, neutral or failure is blocking.
            const hardwareLanes = {
              'Coverage GPU': {
                enabled: (process.env.GPU_COVERAGE_ENABLED || '').trim() === 'true',
                switchName: 'GPU_COVERAGE_ENABLED',
              },
              'SYCL Parity (Arc A380)': {
                enabled: (process.env.SYCL_ARC_RUNNER_ENABLED || '').trim() === 'true',
                switchName: 'SYCL_ARC_RUNNER_ENABLED',
              },
            };
            for (const [name, lane] of Object.entries(hardwareLanes)) {
              core.info(`${lane.switchName}=${lane.enabled} (${name})`);
            }

            const failed = [];
            const accepted = ['success', 'skipped', 'neutral'];
            for (const name of required) {
              const run = byName[name];
              if (strictMustReport.includes(name)) {
                if (!run) {
                  failed.push(`${name}: never reported (strict required context)`);
                } else if (run.conclusion !== 'success') {
                  failed.push(`${name}: ${run.conclusion ?? run.status} (strict required context)`);
                } else {
                  core.info(`OK (strict success): ${name}`);
                }
                continue;
              }
              if (name === scorecardGate) {
                if (!run || run.conclusion !== 'success') {
                  failed.push(`${name}: ${run ? (run.conclusion ?? run.status) : 'never reported'}`);
                } else {
                  core.info(`OK (success): ${name}`);
                }
                continue;
              }
              const hardwareLane = hardwareLanes[name];
              if (hardwareLane) {
                if (hardwareLane.enabled) {
                  if (!run) {
                    failed.push(`${name}: ${hardwareLane.switchName}=true but the job never reported on SHA ${sha}`);
                    continue;
                  }
                  if (run.conclusion === 'skipped') {
                    failed.push(`${name}: ${hardwareLane.switchName}=true but the job was skipped (runner probe failed — runner not registered or offline)`);
                    continue;
                  }
                  if (run.conclusion !== 'success') {
                    failed.push(`${name}: ${run.conclusion ?? run.status}`);
                  } else {
                    core.info(`OK (hardware success): ${name}`);
                  }
                  continue;
                }
                if (!run || run.conclusion === 'skipped') {
                  core.info(`OK (${hardwareLane.switchName} disabled, absence/skip permitted): ${name}`);
                  continue;
                }
              }
              if (!run) {
                if (enforceMustReport && releaseMustReport.includes(name)) {
                  failed.push(`${name}: never reported on a release branch`);
                  continue;
                }
                core.info(`OK (not reported, treated as path-filter-skip): ${name}`);
                continue;
              }
              if (!accepted.includes(run.conclusion)) {
                failed.push(`${name}: ${run.conclusion ?? run.status}`);
              } else {
                core.info(`OK (${run.conclusion}): ${name}`);
              }
            }

            if (failed.length > 0) {
              core.setFailed(`Required checks did not pass:\n  - ${failed.join('\n  - ')}`);
            } else {
              core.info('All required checks reported success/skipped/neutral.');
            }
