# OpenSSF Scorecard — weekly supply-chain health scan.
#
# Publishes results to the OpenSSF public dashboard (Sigstore-signed attestation)
# and uploads SARIF into the GitHub Security tab so maintainers can see delta
# regressions on pinning, branch-protection, and dependency-review postures.
#
# ADR-1247: publisher stays restricted; the separate gate consumes its same-run JSON.
# ADR-1686: a run whose master moved on to a descendant during the scan ends cancelled
# (no verdict); the newer commit's own push run gives the verdict.

name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "19 4 * * 1"
  push:
    branches: [master]

permissions: read-all

# Prevent duplicate scorecard uploads for the same push/schedule fire.
# cancel-in-progress: false preserves the in-flight attestation publish step.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write     # upload SARIF to the Security tab
      id-token: write             # Sigstore attestation for the public dashboard
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact (debug / replay)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            results.sarif
            results.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload to GitHub Security tab
        # Keep a resolving immutable action pin; ADR-1247 preserves publishing restrictions.
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif

  gate:
    # required-aggregator
    name: Scorecard Master Gate
    needs: analysis
    # Not always(): GitHub keeps running a job whose `if` is still true when its run is
    # cancelled, and a superseded run must end cancelled (ADR-1686). A failed analysis
    # still reaches the gate, which then fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # ADR-1686: a superseded run cancels itself (POST .../actions/runs/{id}/cancel); a
      # job reaches no other conclusion that is neither success nor failure. Write also
      # grants the read the same-run artifact download needs. Scorecard's
      # Token-Permissions check warns on a job-level actions: write and keeps the score.
      actions: write  # cancel this run when superseded (ADR-1686)
    steps:
      - name: Require successful authenticated analysis
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
        run: test "$ANALYSIS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/scorecard-master
          digest-mismatch: error
      - name: Enforce exact-head full repository policy
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --hostname github.com "repos/$EXPECTED_REPOSITORY/git/ref/heads/master" \
            > "$RUNNER_TEMP/scorecard-master/final-master-ref.json"
          status=0
          python3 -B scripts/ci/scorecard_gate.py master \
            --sha "$EXPECTED_SHA" --repository "$EXPECTED_REPOSITORY" \
            --report "$RUNNER_TEMP/scorecard-master/results.json" \
            --master-ref "$RUNNER_TEMP/scorecard-master/final-master-ref.json" \
            --master-compare "$RUNNER_TEMP/scorecard-master/master-compare.json" \
            --receipt "$RUNNER_TEMP/scorecard-master/gate.json" \
            --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          # Exit 3 (ADR-1686): master moved on to a descendant; this run has no verdict.
          # Cancel it and wait to be stopped. A cancel that never lands ends the step red.
          gh api --hostname github.com --method POST \
            "repos/$EXPECTED_REPOSITORY/actions/runs/$RUN_ID/cancel"
          for _ in $(seq 1 24); do
            sleep 5
          done
          echo "::error::Run $RUN_ID was not cancelled within 120 s; a superseded run must not pass."
          exit 1
      - name: Verify live repository protection
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scorecard-master"
          python3 -B scripts/dev/check_repository_security.py \
            --report "$RUNNER_TEMP/scorecard-master/repository-security.json"
      - name: Preserve gate receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-master-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scorecard-master
          if-no-files-found: error
          retention-days: 14
