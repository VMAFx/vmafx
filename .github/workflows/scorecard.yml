# OpenSSF Scorecard — weekly supply-chain health scan.
#
# Publishes results to the OpenSSF public dashboard (Sigstore-signed attestation)
# and uploads SARIF into the GitHub Security tab so maintainers can see delta
# regressions on pinning, branch-protection, and dependency-review postures.
#
# Badge: README "OpenSSF Scorecard" links here.

name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "19 4 * * 1"
  push:
    branches: [master]

permissions: read-all

# Prevent duplicate scorecard uploads for the same push/schedule fire.
# cancel-in-progress: false preserves the in-flight attestation publish step.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write     # upload SARIF to the Security tab
      id-token: write             # Sigstore attestation for the public dashboard
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact (debug / replay)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - name: Upload to GitHub Security tab
        # SHA pinned to the head commit of github/codeql-action's v4 tag
        # (resolved 2026-05-03). The previous pin (b25d0ebf...) was an
        # "imposter commit" — a SHA that no longer exists in the action
        # repository — which made Scorecard's webapp publish step fail
        # with a workflow-verification 400 error. See
        # docs/research/0053-ossf-scorecard-investigation.md and
        # docs/adr/0253-ossf-scorecard-policy.md.
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          sarif_file: results.sarif
