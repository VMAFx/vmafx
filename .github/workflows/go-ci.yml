name: Go CI

on:
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-ci:
    name: go vet + go test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
          cache: true

      # ADR-0973 sibling — pkg/libvmaf uses cgo with -L core/build-cpu/src -lvmaf
      # so go test fails to link unless libvmaf is built first.
      - name: Install meson + ninja for libvmaf build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config

      - name: Build libvmaf (CPU only) for cgo link
        run: |
          meson setup core/build-cpu \
            -Denable_cuda=false \
            -Denable_sycl=false \
            -Denable_hip=false \
            -Denable_metal=false \
            -Denable_avx512=false
          ninja -C core/build-cpu

      - name: go vet
        run: go vet ./...

      - name: go test (skip operator envtest — requires kubebuilder/etcd)
        run: |
          # Skip cmd/vmafx-operator: needs /usr/local/kubebuilder/bin/etcd
          # which is not available on GitHub-hosted runners.
          # Tracked: T-GO-CI-OPERATOR-ENVTEST-2026-05-31.
          go test $(go list ./... | grep -v "cmd/vmafx-operator")
