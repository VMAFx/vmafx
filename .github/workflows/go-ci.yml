name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least-privilege default for the whole workflow (ADR-0875).
# Jobs widen only if they need to publish artefacts or push.
permissions:
  contents: read

jobs:
  tier:
    name: CI tier (Go)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  go-ci:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: go vet + go test
    runs-on: ubuntu-26.04
    env:
      # pkg/libvmaf intentionally has no implicit -lvmaf fallback: every build
      # selects the just-built fork library instead of a runner's distro copy.
      CGO_LDFLAGS: -L${{ github.workspace }}/core/build-cpu/src -lvmaf -lvmafx -lm
      LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-cpu/src
      # ADR-2828: the C of the cgo package (pkg/libvmaf) compiles with its
      # warnings on and fatal. Setting CGO_CFLAGS replaces Go's default -O2 -g,
      # so both are repeated.
      CGO_CFLAGS: -O2 -g -Wall -Werror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ADR-1238: Go links native libvmaf and loads shipped ONNX models.
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Go checks not impacted
        if: steps.impact.outputs.go_checks != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::Go/native inputs not impacted (mode=$MODE reason=$REASON)"

      - name: Set up Go
        if: steps.impact.outputs.go_checks == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod  # single source of truth: the go directive in go.mod (Renovate bumps it)
          cache: true

      # ADR-1622: cmd/vmafx-node embeds an eBPF object that is not committed.
      # Generate it with the pinned clang before anything loads the package.
      - name: Generate the vmafx-node eBPF object (pinned clang)
        if: steps.impact.outputs.go_checks == 'true'
        uses: ./.github/actions/gen-node-bpf

      # ADR-1338: fail before native setup when the pinned Go toolchain can
      # produce a reviewed source modernization that is not yet committed.
      - name: go fix (diff)
        if: steps.impact.outputs.go_checks == 'true'
        run: go fix -diff ./...

      # ADR-0973 sibling — pkg/libvmaf uses cgo with -L core/build-cpu/src -lvmaf
      # so go test fails to link unless libvmaf is built first.
      - name: Install meson + ninja for libvmaf build
        if: steps.impact.outputs.go_checks == 'true'
        run: |
          # The hosted runner ships pre-provisioned Microsoft/Azure apt
          # sources (packages.microsoft.com) that intermittently 403 /
          # "no longer signed", failing `apt-get update` with exit 100.
          # vmaf needs none of them — drop them first. See
          # T-CI-APT-MS-REPO-FLAKE (same fix as the Coverage Gate).
          sudo rm -f /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          # rclone and fuse3: pkg/storage and the node's end-to-end tests run
          # rclone serve http and a real rclone FUSE mount (ADR-1526).
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm rclone fuse3
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      # cmd/vmafx-ort-runner (ADR-1134) is a cgo shim over libvmaf's ONNX
      # session API, so this job builds libvmaf WITH ONNX Runtime: the
      # runner's smoke test and the real-ORT branches of pkg/libvmaf's
      # dnn_test.go then run for real instead of only the -ENOSYS stub.
      # Same tarball + pkg-config recipe as dev/Containerfile (ORT_VERSION
      # is tracked by renovate in both places).
      - name: Install ONNX Runtime (CPU)
        if: steps.impact.outputs.go_checks == 'true'
        env:
          ORT_VERSION: "1.30.0"
        run: |
          set -euo pipefail
          ort_name="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ort_archive="${RUNNER_TEMP}/${ort_name}"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_name}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --remove-on-error \
            --max-time 300 \
            --output "${ort_archive}" \
            "${ort_url}"
          sudo tar -xzf "${ort_archive}" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          # The tarball ships no pkg-config file; meson's enable_dnn needs one.
          sudo install -d /usr/local/lib/pkgconfig
          # prefix/exec_prefix/libdir/includedir are pkg-config template
          # variables that must reach the .pc file literally, so their dollars
          # are escaped inside a double-quoted format (same recipe as
          # dev/Containerfile) rather than hidden in single quotes.
          printf "prefix=/opt/onnxruntime\nexec_prefix=\${prefix}\nlibdir=\${exec_prefix}/lib\nincludedir=\${prefix}/include\n\nName: libonnxruntime\nDescription: ONNX Runtime C API\nVersion: %s\nLibs: -L\${libdir} -lonnxruntime\nCflags: -I\${includedir}\n" "${ORT_VERSION}" \
            | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
          pkg-config --modversion libonnxruntime

      - name: Build libvmaf (CPU + ONNX Runtime) for cgo link
        if: steps.impact.outputs.go_checks == 'true'
        # Post-ADR-0700: meson.build lives at core/meson.build, so the
        # source dir must be passed explicitly (or run from core/). Pre-rename
        # `meson setup core/build-cpu` worked because root had meson.build.
        run: |
          # ADR-2170: this build prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core/build-cpu core \
            -Denable_cuda=false \
            -Denable_sycl=false \
            -Denable_hip=false \
            -Denable_metal=disabled \
            -Denable_avx512=false \
            -Denable_dnn=enabled \
            -Dwerror=true \
            $(scripts/ci/werror-args.sh true)
          ninja -C core/build-cpu

      - name: go vet
        if: steps.impact.outputs.go_checks == 'true'
        run: go vet ./...

      # Symbol-level vulnerability scan (GOVULNCHECK_VERSION of build-config.env).
      # Fails on a called vulnerable symbol, or on an uncalled advisory without
      # a not_affected statement in security/vex/go.openvex.json.
      - name: govulncheck (symbol level, OpenVEX)
        if: steps.impact.outputs.go_checks == 'true'
        run: python3 scripts/ci/govulncheck-gate.py

      # ADR-2349: every generated Grafana dashboard passes Grafana's
      # dashboard-linter --strict with no exclusions; the release binary is
      # pinned and sha256-checked from build-config.env.
      - name: dashboard-linter (generated dashboards)
        if: steps.impact.outputs.go_checks == 'true'
        run: bash scripts/ci/lint-dashboards.sh

      # ADR-2349: promtool checks the generated rule file and runs its unit
      # tests (a firing and a non-firing case per alert).
      - name: promtool (generated rules)
        if: steps.impact.outputs.go_checks == 'true'
        run: bash scripts/ci/check-prometheus-rules.sh

      # The runner is what pkg/ai.Registry.Infer execs; putting it on PATH
      # lets pkg/ai's TestInfer_RealRunner drive the real subprocess path
      # instead of skipping. Built once here, reused by the smoke below.
      - name: Build vmafx-ort-runner and put it on PATH
        if: steps.impact.outputs.go_checks == 'true'
        run: |
          install -d "${RUNNER_TEMP}/vmafx-bin"
          go build -o "${RUNNER_TEMP}/vmafx-bin/vmafx-ort-runner" ./cmd/vmafx-ort-runner
          echo "${RUNNER_TEMP}/vmafx-bin" >> "${GITHUB_PATH}"

      - name: Smoke-test vmafx-ort-runner against the shipped predictor
        if: steps.impact.outputs.go_checks == 'true'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-cpu/src
        run: |
          # Expected value is onnxruntime 1.29.0's CPU-EP answer for this row;
          # see cmd/vmafx-ort-runner/main_test.go (predictorReference) for
          # how it was captured and why the row is deliberately unrealistic.
          out="$(vmafx-ort-runner --model model/predictor_libx264.onnx \
                   --inputs '[51,1,1,1,1,0,0,0,0,0,1,1,16,16]')"
          echo "vmafx-ort-runner: ${out}"
          python3 -c 'import json, sys; v = json.loads(sys.argv[1]); assert len(v) == 1 and abs(v[0] - 66.13961791992188) < 1e-2, v' "${out}"

      - name: Install gosec
        if: steps.impact.outputs.go_checks == 'true'
        # Go 1.27.2 writes export data version 5. The v2.29.0 release builds
        # with x/tools v0.49.0, which reads at most version 4, so it could not
        # type-check any package. This commit of gosec's main branch builds
        # with x/tools v0.50.0 and reports the same findings as v2.29.0 did on
        # Go 1.27.1. Go back to a release tag once one includes x/tools v0.50.0.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20260914113419-9e8e5d91f2f3

      - name: gosec (exclude generated)
        if: steps.impact.outputs.go_checks == 'true'
        # The flags and why each is there live with the target in the
        # Makefile, so `make lint` and this step run the same scan.
        run: make lint-go

      # Install the kubebuilder envtest control-plane binaries (etcd +
      # kube-apiserver + kubectl) so the vmafx-operator suite at
      # cmd/vmafx-operator/internal/controller/ runs for real instead of
      # skipping. Without KUBEBUILDER_ASSETS the suite panics in BeforeSuite
      # with a nil-pointer deref (PRs #330 / #341 / #362 all tripped this).
      - name: Install envtest binaries (kubebuilder)
        if: steps.impact.outputs.go_checks == 'true'
        run: |
          ASSETS="$(scripts/ci/setup-envtest.sh install)"
          echo "KUBEBUILDER_ASSETS=${ASSETS}" >> "${GITHUB_ENV}"

      - name: go test
        if: steps.impact.outputs.go_checks == 'true'
        run: go test ./...
