# docker-publish-tester -- build, test, push, sign and attest the VMAFx tester image.
#
# Triggers:
#   - push to master that touches the tester image inputs: build, run the
#     documented `docker run` line and validate the report; nothing is pushed
#   - workflow_dispatch on master with exactly one of `ref` (a master commit SHA, or
#     `master`) or `tag` (an existing published tag): the same, then publish; the
#     source is that commit with this ref's build recipe (ADR-1347)
#
# Produces (only on dispatch):
#   ghcr.io/vmafx/vmafx:<git describe of the source commit>-tester
#   (linux/amd64 + linux/arm64; `v1.0.0-rc.2-tester` for the tagged commit itself)
#   ghcr.io/vmafx/vmafx:<...>-tester-source: the corresponding source of the
#   image's copyleft parts (Dockerfile target source-export, ADR-1503)
#   ghcr.io/vmafx/vmafx:<git describe of the source commit>-tester-sycl,
#   -tester-cuda and -tester-hip (linux/amd64: the Intel, NVIDIA and AMD GPU kits,
#   targets final-sycl, final-cuda and final-hip of the same Dockerfile, jobs
#   build-gpu and publish-gpu, each with its source image <...>-tester-<kit>-source)
# tags of the existing, public package: a new package would start private.
# All are signed and carry build provenance; each platform image of the tester
# carries an attested SPDX SBOM (Syft). The image build itself fails when a file
# has no recorded licence (tools/rc1-tester/image/licensing.json).
#
# Each architecture builds on its own native runner; the arm64 build takes the
# x86_64 scalar scores from the amd64 build as its cross-architecture reference.
# The hosted runner has no GPU: a GPU image's run there must report
# `gpu.status` no_device with the missing docker run option; the device
# measurements happen on the tester's machine. Its build fails, like the
# tester's, on a file without a recorded licence (stage <kit>-licence-check).
# ADR-1492: tester image. ADR-1102: published artifacts are built in a container.

name: Publish Tester Image

on:
  push:
    branches: [master]
    paths:
      - docker/Dockerfile.tester
      - tools/rc1-tester/**
      - scripts/ci/install-intel-ocloc.sh
      - scripts/ci/install-cuda-toolkit.sh
      - scripts/ci/install-rocm-from-image.sh
      - build-config.env
      - dev/scripts/fetch-intel-neo.py
      - python/requirements-test-lock.txt
      - REUSE.toml
      - LICENSES/**
      - docs/hardware-reports/report.schema.json
      - .github/workflows/docker-publish-tester.yml
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA reachable from master, or `master`, to build and publish (give this or tag)"
        required: false
      tag:
        description: "Existing published vX.Y.Z[-rc.N] tag to build and publish (give this or ref)"
        required: false

permissions:
  contents: read

concurrency:
  group: docker-publish-tester-${{ github.event.inputs.ref || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vmafx/vmafx
  PUBLISH_TAG: ${{ github.event.inputs.tag }}
  SOURCE_REF: ${{ github.event.inputs.ref }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.src.outputs.publish }}
      ref: ${{ steps.src.outputs.ref }}
      source-sha: ${{ steps.src.outputs.source_sha }}
      recipe-sha: ${{ steps.src.outputs.recipe_sha }}
      image-tag: ${{ steps.src.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the source and refuse anything not on master
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --tags --force origin
          if [[ -z "$PUBLISH_TAG" && -z "$SOURCE_REF" ]]; then
            # A push to master: build and test only.
            source_sha="$GITHUB_SHA"
            publish=false
          elif [[ -n "$PUBLISH_TAG" && -n "$SOURCE_REF" ]]; then
            echo "ERROR: give exactly one of the inputs ref and tag" >&2
            exit 1
          elif [[ -n "$PUBLISH_TAG" ]]; then
            expected_ref="refs/tags/$PUBLISH_TAG"
            if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
              # Only a dispatch on the default branch may run away from the tag.
              if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                    "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                echo "ERROR: run this workflow at $expected_ref or dispatch it on $DEFAULT_BRANCH" >&2
                exit 1
              fi
            fi
            git checkout --detach "refs/tags/$PUBLISH_TAG"
            scripts/release/verify-release-version.sh "$PUBLISH_TAG"
            release_json="$RUNNER_TEMP/github-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PUBLISH_TAG" > "$release_json"
            if [[ "$(jq -r '.tag_name' "$release_json")" != "$PUBLISH_TAG" || \
                  "$(jq -r '.draft' "$release_json")" != "false" || \
                  "$(jq -r '.published_at != null' "$release_json")" != "true" ]]; then
              echo "ERROR: $PUBLISH_TAG must name a published release" >&2
              exit 1
            fi
            source_sha="$(git rev-parse HEAD)"
            publish=true
          else
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                  "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "ERROR: dispatch this workflow on $DEFAULT_BRANCH" >&2
              exit 1
            fi
            ref="$SOURCE_REF"
            [[ "$ref" == "$DEFAULT_BRANCH" ]] && ref="origin/$DEFAULT_BRANCH"
            source_sha="$(git rev-parse --verify "$ref^{commit}")"
            if ! git merge-base --is-ancestor "$source_sha" "origin/$DEFAULT_BRANCH"; then
              echo "ERROR: $source_sha is not reachable from $DEFAULT_BRANCH" >&2
              exit 1
            fi
            publish=true
          fi
          # Only v*.*.* tags name a version (see macos-tester-bundle.yml); a
          # tagged commit yields the bare tag, so its image is `<tag>-tester`.
          if ! describe="$(git describe --tags --match 'v*.*.*' "$source_sha")"; then
            echo "ERROR: no v*.*.* tag is reachable from $source_sha" >&2
            exit 1
          fi
          {
            echo "publish=$publish"
            echo "ref=$source_sha"
            echo "source_sha=$source_sha"
            echo "recipe_sha=$GITHUB_SHA"
            echo "image_tag=${describe}-tester"
          } >> "$GITHUB_OUTPUT"

  refs-x86:
    name: x86_64 reference scores
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Use this ref's build recipe
        env:
          RECIPE_SHA: ${{ needs.validate.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/Dockerfile.tester tools/rc1-tester \
            scripts/ci docs/hardware-reports python/requirements-test-lock.txt \
            REUSE.toml LICENSES LICENSE model/other_models/NOTICE-brisque
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Export the x86_64 scalar scores
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: refs-export
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/xref
          cache-from: type=gha,scope=tester-amd64
          cache-to: type=gha,scope=tester-amd64,mode=max
          build-args: |
            VMAF_BUILD_JOBS=4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tester-xref
          path: ${{ runner.temp }}/xref/x86_64-scalar.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and test (${{ matrix.arch }})
    needs: [validate, refs-x86]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: vmafx-tester:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Use this ref's build recipe
        env:
          RECIPE_SHA: ${{ needs.validate.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/Dockerfile.tester tools/rc1-tester \
            scripts/ci docs/hardware-reports python/requirements-test-lock.txt \
            REUSE.toml LICENSES LICENSE model/other_models/NOTICE-brisque
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tester-xref
          path: ${{ runner.temp }}/xref
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build into the local image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: final
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-contexts: |
            xref=${{ runner.temp }}/xref
          cache-from: type=gha,scope=tester-${{ matrix.arch }}
          cache-to: type=gha,scope=tester-${{ matrix.arch }},mode=max
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}
      - name: Image size
        run: docker image inspect "$LOCAL_IMAGE" --format 'size {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the documented command
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp \
            "$LOCAL_IMAGE" > report.json 2> report.stderr
          status=$?
          set -e
          cat report.stderr
          echo "report exit status: $status"
          echo "$status" > report.status
          exit "$status"
      - name: Validate the report against the schema
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements/locks/jsonschema.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/check-hardware-reports.py --report report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: tester-report-${{ matrix.arch }}
          path: |
            report.json
            report.stderr
          retention-days: 30
      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: needs.validate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: final
          platforms: ${{ matrix.platform }}
          build-contexts: |
            xref=${{ runner.temp }}/xref
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tester-${{ matrix.arch }}
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}
      - name: Record the platform digest
        if: needs.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.validate.outputs.publish == 'true'
        with:
          name: tester-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      # ADR-1503: an SPDX SBOM of exactly what was pushed, attested in the publish job.
      - name: Install syft
        id: syft
        if: needs.validate.outputs.publish == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.51.1
      - name: SPDX SBOM of the pushed platform image
        if: needs.validate.outputs.publish == 'true'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_TAG: ${{ needs.validate.outputs.image-tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          "$SYFT" scan "registry:${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --platform "linux/${ARCH}" \
            --source-name "${REGISTRY}/${IMAGE_NAME}" --source-version "${IMAGE_TAG}" \
            -o "spdx-json=${RUNNER_TEMP}/sbom/sbom.spdx.json"
          jq -e '.spdxVersion and ((.packages | length) > 100)' \
            "${RUNNER_TEMP}/sbom/sbom.spdx.json" > /dev/null
          echo "${DIGEST}" > "${RUNNER_TEMP}/sbom/digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.validate.outputs.publish == 'true'
        with:
          name: tester-sbom-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom/*
          if-no-files-found: error
          retention-days: 90
      # ADR-1503 rule 5: the corresponding source of the copyleft parts, published
      # next to the image as <tag>-source.
      - name: Push the source image by digest
        id: push-source
        if: needs.validate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: source-export
          platforms: ${{ matrix.platform }}
          build-contexts: |
            xref=${{ runner.temp }}/xref
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tester-${{ matrix.arch }}
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}
      - name: Record the source digest
        if: needs.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push-source.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/source-digests"
          touch "${RUNNER_TEMP}/source-digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.validate.outputs.publish == 'true'
        with:
          name: tester-source-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/source-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tester image
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tester-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: tester-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platform images into one index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.validate.outputs.image-tag }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, got ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:${IMAGE_TAG}" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${index}"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}"
      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Verify what was just signed
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/VMAFx/vmafx/\.github/workflows/docker-publish-tester\.yml@refs/(heads/master|tags/v.*)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}"
          {
            echo "### Tester image"
            echo
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.image-tag }}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # ADR-1503: the SPDX SBOM of each platform image, attested on its digest.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: tester-sbom-*
          path: ${{ runner.temp }}/sbom
      - name: Read the platform digests the SBOMs describe
        id: sbom
        working-directory: ${{ runner.temp }}/sbom
        run: |
          for arch in amd64 arm64; do
            digest="$(cat "tester-sbom-${arch}/digest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest for ${arch}" >&2; exit 1; }
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.sbom.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom/tester-sbom-amd64/sbom.spdx.json
          push-to-registry: true
      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.sbom.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom/tester-sbom-arm64/sbom.spdx.json
          push-to-registry: true
      # ADR-1503 rule 5: the source image, published at the same place.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: tester-source-digest-*
          path: ${{ runner.temp }}/source-digests
          merge-multiple: true
      - name: Merge the source images into one index
        id: source-index
        working-directory: ${{ runner.temp }}/source-digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.validate.outputs.image-tag }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 source digests, got ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:${IMAGE_TAG}-source" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}-source" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"
          echo "source image: ${IMAGE}:${IMAGE_TAG}-source (${index})" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the source image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.source-index.outputs.digest }}"
      - name: Attest the source image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.source-index.outputs.digest }}
          push-to-registry: true

  build-gpu:
    name: Build and test the ${{ matrix.vendor }} GPU image (amd64)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # `reason` is the docker run option the no-GPU run's report must name.
          - kit: sycl
            vendor: Intel
            reason: "--device /dev/dri"
          - kit: cuda
            vendor: NVIDIA
            reason: "--gpus all"
          - kit: hip
            vendor: AMD
            reason: "--device /dev/kfd"
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: vmafx-tester-${{ matrix.kit }}:ci
      KIT: ${{ matrix.kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Use this ref's build recipe
        env:
          RECIPE_SHA: ${{ needs.validate.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/Dockerfile.tester tools/rc1-tester \
            scripts/ci docs/hardware-reports python/requirements-test-lock.txt
      # The GPU SDK build stages need more disk than a hosted runner leaves free.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build into the local image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: final-${{ matrix.kit }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=tester-${{ matrix.kit }}
          cache-to: type=gha,scope=tester-${{ matrix.kit }},mode=max
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}-${{ matrix.kit }}
      - name: Image size
        run: docker image inspect "$LOCAL_IMAGE" --format 'size {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the documented command (no GPU on the runner)
        env:
          REASON: ${{ matrix.reason }}
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp \
            "$LOCAL_IMAGE" > report.json 2> report.stderr
          status=$?
          set -e
          cat report.stderr
          echo "report exit status: $status"
          # Every CPU check passes and the GPU section says why it measured nothing.
          jq -e --arg kit "$KIT" --arg reason "$REASON" \
            '.verdict == "pass" and .gpu.backend == $kit and .gpu.status == "no_device"
             and .gpu.access.path == "none" and (.gpu.reason | contains($reason))' report.json
          exit "$status"
      - name: Validate the report against the schema
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements/locks/jsonschema.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/check-hardware-reports.py --report report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: tester-${{ matrix.kit }}-report
          path: |
            report.json
            report.stderr
          retention-days: 30
      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: needs.validate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: final-${{ matrix.kit }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=tester-${{ matrix.kit }}
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}-${{ matrix.kit }}
      # ADR-1503 rule 5: the corresponding source of the copyleft parts
      # (Dockerfile targets sycl-, cuda- and hip-source-export).
      - name: Push the source image by digest
        id: push-source
        if: needs.validate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tester
          target: ${{ matrix.kit }}-source-export
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=tester-${{ matrix.kit }}
          build-args: |
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate.outputs.source-sha }}
            VMAFX_SOURCE_REF=${{ needs.validate.outputs.ref }}
            VMAFX_RECIPE_COMMIT=${{ needs.validate.outputs.recipe-sha }}
            VMAFX_BUILT_BY_WORKFLOW=true
            VMAFX_IMAGE_TAG=${{ needs.validate.outputs.image-tag }}-${{ matrix.kit }}
      # A matrix job has no per-leg outputs: the publish job reads both digests
      # from this artifact.
      - name: Record the pushed digests
        if: needs.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_DIGEST: ${{ steps.push-source.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gpu-digests"
          echo "$DIGEST" > "${RUNNER_TEMP}/gpu-digests/image"
          echo "$SOURCE_DIGEST" > "${RUNNER_TEMP}/gpu-digests/source"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.validate.outputs.publish == 'true'
        with:
          name: tester-${{ matrix.kit }}-digests
          path: ${{ runner.temp }}/gpu-digests/*
          if-no-files-found: error
          retention-days: 1

  publish-gpu:
    name: Publish the ${{ matrix.vendor }} GPU image
    needs: [validate, build-gpu]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tester-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - kit: sycl
            vendor: Intel
          - kit: cuda
            vendor: NVIDIA
          - kit: hip
            vendor: AMD
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_TAG: ${{ needs.validate.outputs.image-tag }}-${{ matrix.kit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tester-${{ matrix.kit }}-digests
          path: ${{ runner.temp }}/gpu-digests
      - name: Read the pushed digests
        id: digests
        working-directory: ${{ runner.temp }}/gpu-digests
        run: |
          for name in image source; do
            digest="$(cat "$name")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad ${name} digest" >&2; exit 1; }
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the pushed digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digests.outputs.image }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Sign image (keyless OIDC via Sigstore)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digests.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.image }}
          push-to-registry: true
      # The tester licensing rules: an SPDX SBOM of the published image, attested
      # on its digest (sbom-tester-<kit>.spdx.json).
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.51.1
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digests.outputs.image }}
          format: spdx-json
          output-file: sbom-tester-${{ matrix.kit }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.image }}
          sbom-path: sbom-tester-${{ matrix.kit }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-tester-${{ matrix.kit }}
          path: sbom-tester-${{ matrix.kit }}.spdx.json
          retention-days: 90
      # ADR-1503 rule 5: the corresponding source of the image's copyleft parts,
      # published at the same place as the image.
      - name: Tag, sign and attest the source image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digests.outputs.source }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${IMAGE_TAG}-source" "${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "source image: ${IMAGE}:${IMAGE_TAG}-source (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the source image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.source }}
          push-to-registry: true
      - name: Verify what was just signed
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digests.outputs.image }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/VMAFx/vmafx/\.github/workflows/docker-publish-tester\.yml@refs/(heads/master|tags/v.*)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          {
            echo "### ${VENDOR} GPU tester image"
            echo
            echo '```'
            echo "${IMAGE}:${IMAGE_TAG}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
