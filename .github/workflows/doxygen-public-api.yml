# Doxygen build of the libvmaf public C API (core/include/libvmaf/).
#
# On-demand only (workflow_dispatch + pull_request paths) — not a blocking
# gate yet. Publishes the generated HTML and the warnings log as build
# artifacts so a reviewer can either browse the rendered API or audit the
# warning count without re-running locally.
#
# Promotion path to a required gate is tracked in the accompanying ADR;
# the WARN_AS_ERROR flag in core/doc/Doxyfile.public-api flips ON when we
# add this workflow to required-aggregator.yml.

name: doxygen-public-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/include/libvmaf/**"
      - "core/doc/Doxyfile.public-api"
      - ".github/workflows/doxygen-public-api.yml"

permissions:
  contents: read

concurrency:
  group: doxygen-public-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Build public-API doxygen
        run: |
          mkdir -p build/doxygen-public-api
          doxygen core/doc/Doxyfile.public-api

      - name: Report warning count
        run: |
          warnings=$(wc -l < build/doxygen-public-api/warnings.log || echo 0)
          echo "doxygen warning count: ${warnings}"
          echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"
        id: report

      - name: Upload warnings log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doxygen-public-api-warnings
          path: build/doxygen-public-api/warnings.log
          if-no-files-found: warn

      - name: Upload generated HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doxygen-public-api-html
          path: build/doxygen-public-api/html/
          if-no-files-found: warn
