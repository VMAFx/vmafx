# Doxygen build of the libvmaf public C API (core/include/libvmaf/).
#
# Required check since ADR-1297. The workflow always emits its gate; the shared
# impact planner runs Doxygen only for the public-header surface. The work job
# publishes generated HTML and the warnings log so a reviewer can browse the
# rendered API or audit the warning count without re-running locally, and fails
# when the warning count exceeds the committed ceiling.
#
# WARN_AS_ERROR in core/doc/Doxyfile.public-api is still OFF. ADR-0953 planned
# to flip it the moment this workflow joined required-aggregator.yml, on the
# basis that the public headers were warning-clean (95 -> 0). They are not any
# more: run 35739609579 measured 228 warning-log lines. Flipping the flag in
# the same change would have made this gate red on arrival and blocked every
# PR that touches core/include/libvmaf/**. The ceiling step below is the
# intermediate ratchet — the count cannot grow — and the flip happens in the
# PR that drives it back to zero. See ADR-1297 "Consequences".

name: doxygen-public-api

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: doxygen-public-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Plan Doxygen impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.doxygen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  doxygen-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Keep the expensive work name distinct from the exact required gate name
    # below; otherwise one check can mask the other in the aggregator.
    name: Doxygen Public API work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Build public-API doxygen
        run: |
          mkdir -p build/doxygen-public-api
          doxygen core/doc/Doxyfile.public-api

      - name: Report warning count and enforce the ceiling
        # Ratchet, not a threshold: DOXYGEN_WARNING_CEILING is the measured
        # count on the run that introduced this step (35739609579), and it only
        # ever moves down. Lower it in the same PR that removes warnings.
        env:
          DOXYGEN_WARNING_CEILING: "228"
        run: |
          warnings=$(wc -l < build/doxygen-public-api/warnings.log || echo 0)
          echo "doxygen warning count: ${warnings} (ceiling ${DOXYGEN_WARNING_CEILING})"
          echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"
          if [ "${warnings}" -gt "${DOXYGEN_WARNING_CEILING}" ]; then
            echo "::error::doxygen public-API warnings rose to ${warnings}, above the ceiling of ${DOXYGEN_WARNING_CEILING}. Document the new public symbols, or justify and lower the ceiling in the same PR (ADR-1297)."
            exit 1
          fi
          if [ "${warnings}" -lt "${DOXYGEN_WARNING_CEILING}" ]; then
            echo "::notice::doxygen warnings fell to ${warnings}; lower DOXYGEN_WARNING_CEILING in .github/workflows/doxygen-public-api.yml to hold the gain."
          fi
        id: report

      - name: Upload warnings log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doxygen-public-api-warnings
          path: build/doxygen-public-api/warnings.log
          if-no-files-found: warn

      - name: Upload generated HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doxygen-public-api-html
          path: build/doxygen-public-api/html/
          if-no-files-found: warn

  doxygen:
    needs: [impact, doxygen-work]
    if: always()
    # required-aggregator
    name: Doxygen Public API
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected Doxygen work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.doxygen-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid Doxygen gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac
