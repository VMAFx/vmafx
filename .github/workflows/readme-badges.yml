name: README Badges

# Render the README status badges in one style (docs/development/readme-badges.md).
# scripts/ci/readme_badges.py reads the latest decisive push run of every badged
# workflow on master plus the OpenSSF Scorecard, OpenSSF Best Practices and
# Codacy public APIs; tools/badges/render.mjs draws the SVGs with the pinned
# shields.io renderer; the publish job commits them to the badges branch the
# README links. A source that fails keeps its last value for six hours, then
# reads "stale", and this run turns red so the failure is seen.

on:
  # Every 15 minutes: a badge lags a master run by at most that. A
  # workflow_run trigger would be faster, but zizmor rates it a dangerous
  # trigger, and its branch filter would also match a fork's branch named
  # master.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  render:
    name: Read the sources and render
    # github.com only: the job reads and the publish job writes through the
    # GitHub API, which a mirror's token cannot reach (as in supply-chain.yml).
    if: github.repository == 'VMAFx/vmafx' && github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.12.1"
      - name: Install the pinned badge renderer
        working-directory: tools/badges
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read the badge sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/readme_badges.py spec
          --spec build/badges-spec.json --state build/badges/state.json
      - name: Render the SVGs
        run: node tools/badges/render.mjs build/badges-spec.json build/badges
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: readme-badges
          path: build/badges/
          retention-days: 1
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: readme-badges
          path: build/badges/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to the badges branch
    needs: render
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # contents: write is the narrowest token right that can create a commit;
    # the job writes refs/heads/badges only, and the master ruleset refuses
    # this token on master.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: readme-badges
          path: build/badges
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with:
          name: readme-badges
          path: build/badges
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Commit the badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/readme_badges.py publish --dir build/badges
      - name: Fail the run when a source failed
        run: python3 scripts/ci/readme_badges.py verdict --state build/badges/state.json
