name: docs

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is per job, not workflow-wide. GitHub's Pages starter workflow
# puts the whole file in one global `pages` group, which is correct for the
# deployment (Pages permits one at a time) and wrong for the build: the group is
# not scoped by ref, so every open PR and every master push contend for one
# slot. A group holds at most one pending run, so a third arrival evicts the
# waiting one. Measured 2026-09-22: run 35739609377 (PR #1518 at 160ddfc3d,
# started 14:20) was cancelled at 14:30:20 inside upload-pages-artifact by run
# 35740184612 (a Renovate digest bump at 31a5f502b, started 14:25). Neither
# `mkdocs build --strict` nor `make docs-fragments-check` ran to completion for
# that PR, and the check reported `cancelled` rather than a failure — a gate
# that did not run, which HISS-18 forbids reporting as satisfied. See ADR-1294.
#
# ADR-1297 makes this check required, which is what gives ADR-1294 teeth:
# `cancelled` is not in the aggregator's accepted set, so a cross-PR
# cancellation is now a hard merge block instead of a green button. The two
# changes must travel together — a rebase that keeps the gate and drops the
# ref-scoped group below turns every contended docs build into a blocked merge.
#

jobs:
  tier:
    name: CI tier (docs)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  build:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1297 — required check. The job id `build` was the reported check
    # name, because the job had no `name:`; that name is ambiguous (build.yml's
    # job id is also `build`, saved only by its `name: ${{ matrix.name }}`) and
    # would let any future unnamed `build` job share the context and mask this
    # one. The explicit name below is the required context; the id stays
    # `build` so `needs: build` in `deploy` keeps resolving.
    # required-aggregator
    name: Docs Site Build
    outputs:
      docs: ${{ steps.impact.outputs.docs }}
    runs-on: ubuntu-26.04
    # 25, not 10. Every run that actually built docs hit the 10-minute ceiling,
    # and GitHub reports a timed-out job as `cancelled`, which reads like
    # contention rather than a budget. Measured 2026-09-22 at job level:
    #   48300e324  19:29:21 -> 19:39:31  10m10s  cancelled
    #   d9805a64f  18:05:31 -> 18:15:34  10m03s  cancelled
    #   2487da308  17:58:19 -> 17:58:39     20s  success
    # The one that passed is a dependency bump whose diff touches no docs, so
    # the ADR-1140 impact planner skipped the build -- it never ran mkdocs. In
    # the runs that did, `mkdocs build --strict` alone reported "Documentation
    # built in 562.22 seconds", leaving about 38 s of the 600 s budget for
    # checkout, setup-python, `pip install -r docs/requirements.txt` and
    # `make docs-fragments-check`. The site carries ~1300 ADRs and grows every
    # time one lands, so this ceiling was always going to be crossed. 25
    # minutes is about 2.5x the measured build, with room for the
    # hosted-runner spread (measured at up to 2.3x on the Coverage Gate).
    timeout-minutes: 25
    # Ref-scoped: one docs build per branch, superseded only by a newer push to
    # that same branch. No cross-PR contention.
    concurrency:
      group: docs-build-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Docs build skipped by plan
        if: steps.impact.outputs.docs != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::docs not impacted (mode=$MODE reason=$REASON) — Docs build satisfied without running (ADR-1140)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.impact.outputs.docs == 'true'
        with:
          python-version: "3.14.8"
      - name: Install MkDocs Material
        if: steps.impact.outputs.docs == 'true'
        run: |
          pip install --require-hashes -r requirements/locks/package-build.txt
          pip install --no-build-isolation --require-hashes -r docs/requirements-lock.txt
      - name: Install jsonschema
        if: steps.impact.outputs.docs == 'true'
        # make docs-fragments-check validates docs/hardware-reports against
        # their schema and exits 2 without it (check-hardware-reports.py).
        run: pip install --require-hashes -r requirements/locks/jsonschema.txt
      - name: Check generated documentation freshness
        if: steps.impact.outputs.docs == 'true'
        run: make docs-fragments-check
      - name: Check documentation charts against a fresh render
        if: steps.impact.outputs.docs == 'true'
        run: python3 scripts/docs/generate-charts.py --check --require-render
      - name: Build site
        if: steps.impact.outputs.docs == 'true'
        run: mkdocs build --strict
      # Linux only. Node.js is pinned (same action SHA and version as the
      # markdown lint job, HISS-11); check_math.py exits 3 without Node.js, so a
      # missing one fails the job. The script and its tests use pathlib and
      # subprocess only, so they also run under macOS and Windows with Node.js
      # on PATH (ADR-2705).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.impact.outputs.docs == 'true'
        with:
          node-version: "24.22.0"
      - name: Check every formula compiles with KaTeX (ADR-2705)
        if: steps.impact.outputs.docs == 'true'
        run: python3 scripts/docs/check_math.py --site build-docs/site
      - name: Check the search index covers user pages only (ADR-1512)
        if: steps.impact.outputs.docs == 'true'
        run: python3 scripts/docs/check_search_scope.py build-docs/site
      # Only `deploy` consumes this, and `deploy` runs on `push` to master
      # only, so a pull request uploading it gains nothing -- the artifact is
      # named `github-pages`, repository-unique, with no consumer on the other
      # end. Scoping it to deploying runs is right on its own terms, and it
      # also saves a minute of the build's budget. It is NOT what fixed the
      # cancellations; those were the 10-minute job timeout, see the note above.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.impact.outputs.docs == 'true' && github.event_name == 'push'
        with:
          path: build-docs/site

  deploy:
    if: github.event_name == 'push' && needs.build.outputs.docs == 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The global `pages` group belongs here and only here: GitHub Pages accepts
    # one concurrent deployment per repository. `cancel-in-progress: false` so a
    # deployment already writing to Pages is never torn down mid-write. This job
    # runs on `push` to master only, so it is not a source of PR contention.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Folded in from doxygen-public-api.yml (ADR-1297 gate, ADR-0953 ceiling):
  # Doxygen build of the libvmaf public C API (core/include/libvmaf/). The
  # gate is always emitted; the shared impact planner runs Doxygen only for the
  # public-header surface. The workflow grants Pages write for `deploy`, so
  # each of these jobs narrows its token to contents: read.
  impact:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Plan Doxygen impact
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.impact.outputs.doxygen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  doxygen-work:
    concurrency:
      group: doxygen-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Keep the expensive work name distinct from the exact required gate name
    # below; otherwise one check can mask the other in the aggregator.
    name: Doxygen Public API work
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Build public-API doxygen
        run: |
          mkdir -p build/doxygen-public-api
          doxygen core/doc/Doxyfile.public-api

      - name: Report warning count and enforce the ceiling
        # Ratchet, not a threshold: DOXYGEN_WARNING_CEILING is the measured
        # count on the run that introduced this step (35739609579), and it only
        # ever moves down. Lower it in the same PR that removes warnings.
        env:
          DOXYGEN_WARNING_CEILING: "0"
        run: |
          warnings=$(wc -l < build/doxygen-public-api/warnings.log || echo 0)
          echo "doxygen warning count: ${warnings} (ceiling ${DOXYGEN_WARNING_CEILING})"
          echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"
          if [ "${warnings}" -gt "${DOXYGEN_WARNING_CEILING}" ]; then
            echo "::error::doxygen public-API warnings rose to ${warnings}, above the ceiling of ${DOXYGEN_WARNING_CEILING}. Document the new public symbols, or justify and lower the ceiling in the same PR (ADR-1297)."
            exit 1
          fi
          if [ "${warnings}" -lt "${DOXYGEN_WARNING_CEILING}" ]; then
            echo "::notice::doxygen warnings fell to ${warnings}; lower DOXYGEN_WARNING_CEILING in .github/workflows/docs.yml to hold the gain."
          fi
        id: report

      - name: Upload warnings log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doxygen-public-api-warnings
          path: build/doxygen-public-api/warnings.log
          if-no-files-found: warn

      - name: Upload generated HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doxygen-public-api-html
          path: build/doxygen-public-api/html/
          if-no-files-found: warn

  doxygen:
    needs: [tier, impact, doxygen-work]
    if: always() && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Doxygen Public API
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Require selected Doxygen work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.doxygen-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid Doxygen gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac
