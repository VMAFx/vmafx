name: docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is per job, not workflow-wide. GitHub's Pages starter workflow
# puts the whole file in one global `pages` group, which is correct for the
# deployment (Pages permits one at a time) and wrong for the build: the group is
# not scoped by ref, so every open PR and every master push contend for one
# slot. A group holds at most one pending run, so a third arrival evicts the
# waiting one. Measured 2026-09-22: run 35739609377 (PR #1518 at 160ddfc3d,
# started 14:20) was cancelled at 14:30:20 inside upload-pages-artifact by run
# 35740184612 (a Renovate digest bump at 31a5f502b, started 14:25). Neither
# `mkdocs build --strict` nor `make docs-fragments-check` ran to completion for
# that PR, and the check reported `cancelled` rather than a failure — a gate
# that did not run, which HISS-18 forbids reporting as satisfied. See ADR-1294.
#
# ADR-1297 makes this check required, which is what gives ADR-1294 teeth:
# `cancelled` is not in the aggregator's accepted set, so a cross-PR
# cancellation is now a hard merge block instead of a green button. The two
# changes must travel together — a rebase that keeps the gate and drops the
# ref-scoped group below turns every contended docs build into a blocked merge.
#

jobs:
  build:
    # ADR-1297 — required check. The job id `build` was the reported check
    # name, because the job had no `name:`; that name is ambiguous (build.yml's
    # job id is also `build`, saved only by its `name: ${{ matrix.name }}`) and
    # would let any future unnamed `build` job share the context and mask this
    # one. The explicit name below is the required context; the id stays
    # `build` so `needs: build` in `deploy` keeps resolving.
    # required-aggregator
    name: Docs Site Build
    outputs:
      docs: ${{ steps.impact.outputs.docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ref-scoped: one docs build per branch, superseded only by a newer push to
    # that same branch. No cross-PR contention.
    concurrency:
      group: docs-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Docs build skipped by plan
        if: steps.impact.outputs.docs != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::docs not impacted (mode=$MODE reason=$REASON) — Docs build satisfied without running (ADR-1140)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.impact.outputs.docs == 'true'
        with:
          python-version: "3.14.7"
      - name: Install MkDocs Material
        if: steps.impact.outputs.docs == 'true'
        run: pip install -r docs/requirements.txt
      - name: Check generated documentation freshness
        if: steps.impact.outputs.docs == 'true'
        run: make docs-fragments-check
      - name: Build site
        if: steps.impact.outputs.docs == 'true'
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.impact.outputs.docs == 'true'
        with:
          path: build-docs/site

  deploy:
    if: github.event_name == 'push' && needs.build.outputs.docs == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The global `pages` group belongs here and only here: GitHub Pages accepts
    # one concurrent deployment per repository. `cancel-in-progress: false` so a
    # deployment already writing to Pages is never torn down mid-write. This job
    # runs on `push` to master only, so it is not a source of PR contention.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
