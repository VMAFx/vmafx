name: Helm Chart

# The chart is a user-discoverable surface (people `helm install` it), but
# nothing validated it: `helm lint` failed on master for an unknown length of
# time because a stale vendored subchart injected a values key the chart's own
# values.schema.json rejects. e2e-k8s exercises the chart, but it is label- and
# schedule-gated and builds container images first, so it is not a gate that
# catches a broken chart on the PR that breaks it. This is.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: helm-chart-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least-privilege default for the whole workflow (ADR-0875).
permissions:
  contents: read

# Keep in lockstep with .github/workflows/e2e-k8s.yml.
env:
  HELM_VERSION: "v4.2.4"
  # Official get.helm.sh digest for helm-v4.2.4-linux-amd64.tar.gz.
  HELM_SHA256: "c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3"

jobs:
  tier:
    name: CI tier (Helm Chart)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  impact:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Plan Helm impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  helm-chart-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: helm lint + template work
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Keep this verified install path in lockstep with e2e-k8s.yml.
      - name: Install helm ${{ env.HELM_VERSION }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/helm-${HELM_VERSION}/bin"
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --max-time 300 \
            --output "${archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${install_dir}/helm"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/helm" version --short

      # The vendored charts/*.tgz must match Chart.lock. They drifted once
      # (a 3.6.1 tarball under a ">=3.8.0" constraint with a 3.8.0 lock), which
      # is what broke `helm lint`. Compare before linting so the failure names
      # the cause instead of surfacing as a confusing schema error.
      - name: Vendored subcharts match Chart.lock
        run: |
          set -euo pipefail
          cd deploy/helm/vmafx
          fail=0
          while read -r name version; do
            [ -z "$name" ] && continue
            if [ ! -f "charts/${name}-${version}.tgz" ]; then
              echo "::error::Chart.lock pins ${name} ${version} but charts/${name}-${version}.tgz is absent."
              echo "  charts/ currently holds: $(find charts -maxdepth 1 -type f -printf '%f ' 2>/dev/null)"
              echo "  Fix with: helm dependency build deploy/helm/vmafx"
              fail=1
            fi
          done < <(python3 -c "
          import sys, yaml
          lock = yaml.safe_load(open('Chart.lock')) or {}
          for d in lock.get('dependencies', []):
              print(d['name'], d['version'])
          ")
          exit "$fail"

      - name: helm lint
        run: helm lint deploy/helm/vmafx

      # Render with both the shipped defaults and every optional subchart on,
      # so a template that only appears behind a feature flag is still parsed.
      - name: helm template (defaults)
        run: helm template vmafx deploy/helm/vmafx > /dev/null

      - name: helm template (all optional components enabled)
        run: |
          helm template vmafx deploy/helm/vmafx \
            --set pushgateway.enabled=true \
            --set monitoring.enabled=true > /dev/null

      # The node contract on real renders: the controller address the node's
      # controller client reads and the NetworkPolicy egress it needs (ADR-1524).
      - name: vmafx-node chart contract
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_node_contract.py' -v

      # ADR-1519: tenant-registry wiring (env, VmafxTenant RBAC, API-server
      # egress, rendered tenants) and the render failures for auth settings
      # the workload would not apply.
      - name: Controller auth and tenant registry renders
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_controller_auth.py' -v

      # ADR-1589: the controller workload (one replica, queue volume, Service
      # ports), the nodes' and operator's addresses and tokens, and the
      # NetworkPolicies between them.
      - name: Controller workload renders
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_controller_workload.py' -v

      # ADR-1592: only the controller's own service account reads VmafxTenants.
      # ADR-2647: the operator writes events in every namespace, nothing else.
      - name: Service accounts and tenant RBAC
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_service_accounts.py' -v

      # ADR-2350 D13: the chart grants the operator every rule controller-gen
      # derives from its +kubebuilder:rbac markers (config/rbac/role.yaml).
      - name: Operator RBAC covers the generated role
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_operator_rbac.py' -v

      # ADR-2350 D13: the values the chart copies into pod specs have the
      # Kubernetes 1.26 types; planted invalid values are refused, valid ones
      # render. A full clone also renders them with the schema before the types.
      - name: Values schema with Kubernetes types
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_values_schema.py' -v

      # ADR-2350 D13: every VMAFX_* entry of every workload comes from the
      # generated templates/_config.gen.tpl, and a definition edit changes the
      # render. A full clone also compares it with the hand-written lists.
      - name: Generated workload environment
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_config_env.py' -v

      # ADR-1593: node.fuse (FUSE device resource, the setuid helper's
      # capability bounding set) and node.ebpf (tracker env, UID 0 with BPF /
      # PERFMON / SYS_ADMIN, tracefs), and the combinations the chart refuses.
      - name: Node FUSE and eBPF renders
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_node_fuse_ebpf.py' -v

      # ADR-2349: the monitors, the PrometheusRule (the default render is the
      # generated rule file, an override is what obsgen -render-rules writes
      # for it, promtool accepts both), the dashboard ConfigMaps and the
      # scrape NetworkPolicy. Go runs the obsgen renderer; the test downloads
      # the promtool release pinned in build-config.env.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Monitoring renders
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_helm_observability.py' -v

      # ADR-1353: the server Deployment selected every Pod of the release, the
      # operator's and node's included. Render each server workload with every
      # other component on and require each selector to pick only its own Pods.
      - name: Workload selector isolation
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/ci/tests \
            -p 'test_check_helm_selector_isolation.py'
          for workload in Deployment StatefulSet Job; do
            rendered="$RUNNER_TEMP/selectors-${workload}.yaml"
            helm template vmafx deploy/helm/vmafx \
              --set "workload=${workload}" \
              --set operator.enabled=true \
              --set node.enabled=true \
              --set controller.enabled=true \
              --set auth.enabled=true \
              --set auth.disabled=true \
              --set podDisruptionBudget.enabled=true > "$rendered"
            python3 scripts/ci/check-helm-selector-isolation.py "$rendered"
          done

      # ADR-1119 removed the pre-fx operator flags. A plain Helm render stayed
      # syntactically valid while Kubernetes probed the now-unused :8082 port,
      # so pin the semantic env/port contract as well as YAML validity.
      - name: Operator env-only contract
        run: |
          for leader in false true; do
            rendered="$RUNNER_TEMP/operator-${leader}.yaml"
            helm template vmafx deploy/helm/vmafx \
              --set operator.enabled=true \
              --set "operator.leaderElect=${leader}" \
              --show-only templates/operator-deployment.yaml > "$rendered"
            python3 - "$rendered" "$leader" <<'PY'
          import sys

          import yaml

          manifest = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          expected_leader = sys.argv[2]
          container = manifest["spec"]["template"]["spec"]["containers"][0]
          chart = yaml.safe_load(
              open("deploy/helm/vmafx/Chart.yaml", encoding="utf-8")
          )
          expected_image = (
              "ghcr.io/vmafx/vmafx-operator:v"
              + str(chart["appVersion"]).removeprefix("v")
          )
          if container["image"] != expected_image:
              raise SystemExit(
                  f"operator image tag drifted: {container['image']!r} != {expected_image!r}"
              )
          if "args" in container:
              raise SystemExit("operator must not receive removed pre-fx CLI arguments")
          env = {item["name"]: item["value"] for item in container["env"]}
          expected_env = {
              "VMAFX_OPERATOR_METRICS_ADDR": ":8080",
              "VMAFX_OPERATOR_HEALTH_PROBE_ADDR": ":8081",
              "VMAFX_OPERATOR_LEADER_ELECTION": expected_leader,
              "VMAFX_LOG_LEVEL": "info",
          }
          if env != expected_env:
              raise SystemExit(f"operator env contract drifted: {env!r}")
          ports = {item["name"]: item["containerPort"] for item in container["ports"]}
          if ports != {"metrics": 8080, "healthz": 8081}:
              raise SystemExit(f"operator port contract drifted: {ports!r}")
          for probe in ("livenessProbe", "readinessProbe"):
              if container[probe]["httpGet"]["port"] != "healthz":
                  raise SystemExit(f"{probe} no longer targets the healthz port")
          PY

          done

          helm template vmafx deploy/helm/vmafx \
            --show-only templates/deployment.yaml \
            > "$RUNNER_TEMP/server.yaml"
          helm template vmafx deploy/helm/vmafx \
            --set node.enabled=true \
            --show-only templates/node.yaml \
            > "$RUNNER_TEMP/node.yaml"
          python3 - "$RUNNER_TEMP/server.yaml" "$RUNNER_TEMP/node.yaml" <<'PY'
          import sys

          import yaml

          chart = yaml.safe_load(
              open("deploy/helm/vmafx/Chart.yaml", encoding="utf-8")
          )
          tag = "v" + str(chart["appVersion"]).removeprefix("v")
          expected = (
              "ghcr.io/vmafx/vmafx-server:" + tag,
              "ghcr.io/vmafx/vmafx-node:" + tag,
          )
          for path, expected_image in zip(sys.argv[1:], expected, strict=True):
              manifests = yaml.safe_load_all(open(path, encoding="utf-8"))
              manifest = next(item for item in manifests if item["kind"] == "Deployment")
              container = manifest["spec"]["template"]["spec"]["containers"][0]
              if container["image"] != expected_image:
                  raise SystemExit(
                      f"release image drifted: {container['image']!r} != {expected_image!r}"
                  )
          PY

  helm-chart:
    needs: [tier, impact, helm-chart-work]
    if: always() && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: helm lint + template
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected Helm work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.helm-chart-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid Helm gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac
