name: "SYCL Parity (Arc A380)"

# required-aggregator: SYCL Parity (Arc A380)
# ADR-1177 — SYCL parity on the workstation's Intel Arc A380, executed by a
# containerised, ephemeral, repository-level self-hosted runner
# (dev/Containerfile.runner + dev/docker-compose.runner.yml; operator runbook
# in docs/development/ci-self-hosted-sycl.md).
#
# Lane switch: the repository variable SYCL_ARC_RUNNER_ENABLED.
#   unset / not "true"  -> the probe reports available=false, the self-hosted
#                          job is skipped, and the Required Checks Aggregator
#                          accepts the skip (lane not provisioned).
#   "true"              -> the probe must find an ONLINE runner labelled
#                          `sycl-arc`; otherwise it fails loudly, the job is
#                          skipped, and the aggregator rejects the skip.
# The probe needs the SYCL_RUNNER_PROBE_TOKEN secret (fine-grained PAT,
# Administration: read) because GITHUB_TOKEN cannot list self-hosted runners.
#
# Fork PRs never reach this workflow's jobs: the `if:` below requires the PR
# head to live in this repository. There is no pull_request_target here and
# must never be one.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sycl-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-available:
    name: "Probe SYCL Runner"
    runs-on: ubuntu-24.04
    # Security: never schedule anything from a fork PR onto self-hosted
    # infrastructure; drafts do not contend for the scarce runner (ADR-0331).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
      registered: ${{ steps.probe.outputs.registered }}
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check runner availability
        id: probe
        env:
          GH_TOKEN: ${{ secrets.SYCL_RUNNER_PROBE_TOKEN || github.token }}
          RUNNER_ENABLED: ${{ vars.SYCL_ARC_RUNNER_ENABLED }}
          RUNNER_LABEL: "sycl-arc"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/check-runner-available.sh

  sycl-parity:
    # required-aggregator: SYCL Parity (Arc A380)
    name: "SYCL Parity (Arc A380)"
    needs: [runner-available]
    if: needs.runner-available.outputs.available == 'true'
    runs-on: [self-hosted, linux, x64, sycl-arc]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify only the Intel Arc is visible
        # The container passes through one render node; anything else here
        # means the compose device list drifted (scripts/ci/AGENTS.md).
        run: |
          sycl-ls
          if sycl-ls | grep -Eiq 'nvidia|amd radeon|gfx[0-9]'; then
            echo "::error::a non-Intel GPU is visible inside the runner container"
            exit 1
          fi
          sycl-ls | grep -Eq 'level_zero:gpu.*Arc'
      - name: Build SYCL (float enabled)
        env:
          CC: icx
          CXX: icpx
        run: |
          meson setup core/build core \
            --buildtype=release \
            -Denable_cuda=false \
            -Denable_sycl=true \
            -Denable_float=true
          ninja -C core/build
      - name: Run SYCL unit and parity tests
        run: meson test -C core/build --suite sycl --print-errorlogs
      - name: Run cross-backend parity gate (calibrated features)
        run: |
          python3 scripts/ci/cross_backend_parity_gate.py \
            --vmaf-binary core/build/tools/vmaf \
            --reference testdata/ref_576x324_48f.yuv \
            --distorted testdata/dis_576x324_48f.yuv \
            --width 576 \
            --height 324 \
            --pixel-format 420 \
            --bitdepth 8 \
            --backends cpu sycl \
            --features float_ssim \
            --gpu-id sycl:0x8086:0x56a5 \
            --json-out sycl_parity.json \
            --md-out sycl_parity.md
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sycl-parity-report
          path: |
            sycl_parity.json
            sycl_parity.md
