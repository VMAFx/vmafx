# Supply-chain provenance: GitHub build-provenance attestations (SLSA v1
# provenance predicate, ADR-1356), Sigstore keyless signing, SBOM.
# Triggered when an operator publishes release-please's draft
# `vMAJOR.MINOR.PATCH` release. The authenticated publication emits the
# `release:published` event. Manual dispatch is an idempotent recovery path for
# an existing tag: release assets are overwritten, while PyPI skips files that
# the immutable index already accepted.

name: supply-chain
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to recover and republish idempotently"
        required: true

# Default to least-privilege at the workflow level; individual jobs that
# need `id-token: write` (Sigstore OIDC) or `contents: write` (upload release
# assets) opt in per-job so a newly added step can't silently inherit write
# scope. Addresses Scorecard
# TokenPermissionsID alerts on `contents` and `packages`.
permissions:
  contents: read

# Prevent duplicate signing runs for the same tag.
# cancel-in-progress: false — a partial sign/SBOM run is worse than queuing.
concurrency:
  group: supply-chain-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release versions
    # Release events also fire for tester prereleases (tester-*, tester-windows-*);
    # only version tags (v*) belong to this workflow. Dependent jobs skip with it.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      # PEP 440 spelling of `version` (ADR-1201): hatchling names the vmaf-mcp
      # wheel and sdist `vmaf_mcp-1.0.0rc1*`, not `vmaf_mcp-1.0.0-rc.1*`.
      # Every Python distribution FILENAME match (and the PyPI release URL)
      # uses this; SBOM identities keep `version`, because the wheel METADATA
      # and therefore Syft's package version and purl keep the SemVer spelling.
      pep440_version: ${{ steps.release.outputs.pep440_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false
      - name: Verify the tag, the release flags and every coordinated version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          # ADR-1201: release candidates are published, so a prerelease is no
          # longer rejected outright. What IS enforced is that the tag and the
          # GitHub release agree: an `-rc.N` tag must be marked prerelease and a
          # final tag must not. A mismatch either way is the dangerous case --
          # an RC marked stable becomes "latest" for every consumer, and a final
          # marked prerelease silently never does.
          case "$RELEASE_TAG" in
            *-rc.*) tag_is_rc=true ;;
            *)      tag_is_rc=false ;;
          esac
          if [[ "$RELEASE_IS_PRERELEASE" != "$tag_is_rc" ]]; then
            echo "ERROR: $RELEASE_TAG has prerelease=$RELEASE_IS_PRERELEASE but the tag says rc=$tag_is_rc" >&2
            echo "  An -rc.N tag must be published as a prerelease; a final tag must not." >&2
            exit 1
          fi
          echo "is_prerelease=$tag_is_rc" >> "$GITHUB_OUTPUT"
          expected_ref="refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "ERROR: run this workflow at $expected_ref, not $GITHUB_REF" >&2
            exit 1
          fi
          scripts/release/verify-release-version.sh "$RELEASE_TAG"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "ERROR: workflow source SHA $GITHUB_SHA does not match checked-out tag" >&2
            exit 1
          fi
          release_json="$RUNNER_TEMP/github-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json"
          if [[ "$(jq -r '.tag_name' "$release_json")" != "$RELEASE_TAG" || \
                "$(jq -r '.draft' "$release_json")" != "false" || \
                "$(jq -r '.prerelease' "$release_json")" != "$tag_is_rc" || \
                "$(jq -r '.published_at != null' "$release_json")" != "true" ]]; then
            echo "ERROR: $RELEASE_TAG must name a published GitHub release with prerelease=$tag_is_rc" >&2
            exit 1
          fi
          pep440_version="$(scripts/release/pep440-version.sh "${RELEASE_TAG#v}")"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "pep440_version=$pep440_version"
          } >> "$GITHUB_OUTPUT"
      - name: Require the protected publication environments to exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ADR-1151 / ADR-3399. Publication jobs across supply-chain.yml,
          # docker-publish-production.yml and docker-publish-operator-node.yml
          # declare `environment: release-publish` / `pypi-publish`. GitHub
          # AUTO-CREATES a referenced environment that does not exist, with an
          # empty rule set, so those jobs run straight through and the
          # documented "requires the release reviewer" gate is silently absent.
          # scripts/release/tests/test-publication-environment-binding.sh only
          # greps the YAML and cannot see that server-side drift. This preflight
          # is read-only, runs before any job holding write or OIDC scope, and
          # fails closed.
          rc=0
          for environment in release-publish pypi-publish; do
            response="$RUNNER_TEMP/env-$environment.json"
            if ! gh api "repos/$GITHUB_REPOSITORY/environments/$environment" \
                >"$response" 2>"$RUNNER_TEMP/env-$environment.err"; then
              echo "::error::deployment environment '$environment' is missing or unreadable"
              sed -n '1,5p' "$RUNNER_TEMP/env-$environment.err" >&2
              rc=1
              continue
            fi
            reviewers="$(jq -r \
              '[.protection_rules[]? | select(.type == "required_reviewers")] | length' \
              "$response")"
            if [[ "$reviewers" -lt 1 ]]; then
              echo "::error::deployment environment '$environment' has no required_reviewers rule"
              rc=1
              continue
            fi
            echo "OK: '$environment' carries a required_reviewers protection rule."
          done
          if [[ "$rc" -ne 0 ]]; then
            echo "Create each environment with a required reviewer and a 'v*' tag" >&2
            echo "deployment policy before publishing a release." >&2
            echo "See docs/development/release.md (publication environments)." >&2
            exit 1
          fi

  build-artifacts:
    name: Build Linux artifacts (${{ matrix.arch }})
    needs: validate-release
    # Fork-PR guard: tag releases on the canonical repository only
    if: github.repository == 'VMAFx/vmafx' && startsWith(github.ref, 'refs/tags/v')
    # Both native architectures use the pinned manylinux / glibc 2.28 stage.
    # ARM runs natively; no cross compiler or emulation enters the release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false
      # No GITHUB_TOKEN: release-build mounts no secret, so the script
      # forwards none for it (scripts/ci/check-dev-container-build-secret.py).
      - name: Build the release-build container stage from the tag (ADR-0819, ADR-1354)
        run: |
          bash scripts/ci/build-dev-container-stage.sh release-build \
            "vmafx-release-build:${GITHUB_SHA}"
      # Build, stage, provenance stamp (ADR-1102) and clean-environment verify
      # all run inside the stage. The checkout is mounted as the runner user so
      # artifacts/ stays writable and uploadable; `--network none` proves the
      # release compile fetches nothing the image build did not already bring,
      # and `--pull never` runs the image this job just built or nothing.
      # The Dev Container PR gate rehearses this exact step on every
      # container-affecting pull request.
      - name: Build, stage, stamp and verify inside the container (ADR-1102, ADR-1346)
        env:
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          docker run --rm \
            --pull never \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env GITHUB_SHA \
            --volume "$PWD:/src" \
            --workdir /src \
            "vmafx-release-build:${GITHUB_SHA}" \
            bash scripts/release/build-native-release-artifacts.sh "$VMAFX_VERSION"
      - name: Enforce the native glibc and libstdc++ floors on the CLI and every staged library
        run: |
          floor="$(sed -n 's/^NATIVE_GLIBC_FLOOR="\(.*\)"$/\1/p' build-config.env)"
          cxx_floor="$(sed -n 's/^NATIVE_GLIBCXX_FLOOR="\(.*\)"$/\1/p' build-config.env)"
          cxxabi_floor="$(sed -n 's/^NATIVE_CXXABI_FLOOR="\(.*\)"$/\1/p' build-config.env)"
          python3 scripts/release/check_glibc_floor.py "$floor" \
            --cxx-floor "$cxx_floor" --cxxabi-floor "$cxxabi_floor" \
            artifacts/vmaf artifacts/lib*.so*
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-artifacts-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: native-artifacts-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  collect-artifacts:
    name: Collect Linux artifacts
    needs: [validate-release, build-artifacts]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: native-artifacts-x86_64, path: artifacts/ }
      - name: Download x86-64 artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: native-artifacts-x86_64, path: artifacts/ }
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: native-artifacts-arm64, path: arm64/ }
      - name: Download arm64 artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: native-artifacts-arm64, path: arm64/ }
      - name: Package arm64 without colliding with the existing x86-64 assets
        run: |
          chmod +x arm64/vmaf
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C arm64 -cf - . | gzip -9n > artifacts/vmafx-linux-arm64.tar.gz
      - name: Compute SHA256 hashes (provenance subjects)
        id: hash
        run: |
          cd artifacts
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  verify-native-artifacts:
    name: Verify Linux runtime
    needs: [validate-release, collect-artifacts]
    # Consumer-side check on an older LTS, after the glibc 2.28 symbol check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: release-artifacts, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: release-artifacts, path: artifacts/ }
      - name: Verify container build provenance (ADR-1102, ADR-1346)
        run: |
          bash scripts/ci/check-container-build.sh --verify artifacts
      # The stamp's git_commit comes from GITHUB_SHA, which build-artifacts
      # already requires to be HEAD. Bind it to the tag checked out here too, so
      # the verified bundle names the commit this release was cut from.
      - name: Bind the provenance stamp to the tagged commit (ADR-1346)
        run: |
          stamped="$(sed -n 's/^git_commit=//p' artifacts/container-build-provenance.txt)"
          tagged="$(git rev-parse HEAD)"
          if [ "$stamped" != "$tagged" ]; then
            echo "::error::provenance stamp names commit '${stamped}', but the tag is ${tagged}" >&2
            exit 1
          fi
      - name: Prove the downloaded CLI resolves its staged SONAME library
        env:
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          # Raw GitHub artifact/release downloads do not encode POSIX mode
          # bits. Restore the documented consumer-side executable bit before
          # exercising the exact downloaded bytes.
          chmod +x artifacts/vmaf
          scripts/release/verify-native-release-artifacts.sh \
            artifacts "$VMAFX_VERSION"
      # The older-floor bundle must also start on the release runtime image
      # (RELEASE_RUNTIME_CC, distroless
      # cc-debian13, glibc 2.41), the base of the published CLI image. That
      # image has no shell or ldd: run the downloaded CLI as its entrypoint,
      # as the image's nonroot user. No LD_LIBRARY_PATH: the CLI must find
      # libvmaf.so.3 next to itself through its RUNPATH `$ORIGIN`, so this
      # step also proves the RUNPATH on the release runtime.
      - name: Prove the downloaded CLI starts on the release runtime image (ADR-1354)
        run: |
          set -a; . ./build-config.env; set +a
          docker run --rm \
            --network none \
            --volume "$PWD/artifacts:/bundle:ro" \
            --entrypoint /bundle/vmaf \
            "$RELEASE_RUNTIME_CC" \
            --version

  verify-native-artifacts-arm64:
    name: Verify Linux arm64 runtime
    needs: [validate-release, collect-artifacts]
    # Consumer-side check on an older LTS, after the glibc 2.28 symbol check.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: release-artifacts, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: release-artifacts, path: artifacts/ }
      - name: Extract the published arm64 bundle
        run: |
          mkdir arm64
          tar -xzf artifacts/vmafx-linux-arm64.tar.gz -C arm64
          rm -r artifacts
          mv arm64 artifacts
      - name: Verify container build provenance (ADR-1102, ADR-1346)
        run: |
          bash scripts/ci/check-container-build.sh --verify artifacts
      # The stamp's git_commit comes from GITHUB_SHA, which build-artifacts
      # already requires to be HEAD. Bind it to the tag checked out here too, so
      # the verified bundle names the commit this release was cut from.
      - name: Bind the provenance stamp to the tagged commit (ADR-1346)
        run: |
          stamped="$(sed -n 's/^git_commit=//p' artifacts/container-build-provenance.txt)"
          tagged="$(git rev-parse HEAD)"
          if [ "$stamped" != "$tagged" ]; then
            echo "::error::provenance stamp names commit '${stamped}', but the tag is ${tagged}" >&2
            exit 1
          fi
      - name: Prove the downloaded CLI resolves its staged SONAME library
        env:
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          # Raw GitHub artifact/release downloads do not encode POSIX mode
          # bits. Restore the documented consumer-side executable bit before
          # exercising the exact downloaded bytes.
          chmod +x artifacts/vmaf
          scripts/release/verify-native-release-artifacts.sh \
            artifacts "$VMAFX_VERSION"
      # The older-floor bundle must also start on the release runtime image
      # (RELEASE_RUNTIME_CC, distroless
      # cc-debian13, glibc 2.41), the base of the published CLI image. That
      # image has no shell or ldd: run the downloaded CLI as its entrypoint,
      # as the image's nonroot user. No LD_LIBRARY_PATH: the CLI must find
      # libvmaf.so.3 next to itself through its RUNPATH `$ORIGIN`, so this
      # step also proves the RUNPATH on the release runtime.
      - name: Prove the downloaded CLI starts on the release runtime image (ADR-1354)
        run: |
          set -a; . ./build-config.env; set +a
          docker run --rm \
            --network none \
            --volume "$PWD/artifacts:/bundle:ro" \
            --entrypoint /bundle/vmaf \
            "$RELEASE_RUNTIME_CC" \
            --version

  sbom:
    name: Generate SBOMs
    needs: [validate-release, collect-artifacts, verify-native-artifacts, verify-native-artifacts-arm64, mcp-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: release-artifacts, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: release-artifacts, path: artifacts/ }
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: mcp-dist, path: mcp-dist/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: mcp-dist, path: mcp-dist/ }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Include arm64 ELF files as well as the published archive in the native SBOM
        run: |
          mkdir artifacts/arm64
          tar -xzf artifacts/vmafx-linux-arm64.tar.gz -C artifacts/arm64
      - name: Prepare native and Python SBOM roots
        env:
          VMAFX_PEP440_VERSION: ${{ needs.validate-release.outputs.pep440_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(mcp-dist/vmaf_mcp-"$VMAFX_PEP440_VERSION"-*.whl)
          sdists=(mcp-dist/vmaf_mcp-"$VMAFX_PEP440_VERSION".tar.gz)
          distributions=(mcp-dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ||
                ${#distributions[@]} -ne 2 ||
                ! -f "${sdists[0]}" ]]; then
            echo "ERROR: expected one version-matched wheel and sdist" >&2
            exit 1
          fi
          mkdir -p sbom mcp-sbom-root/distributions
          python -m pip install --disable-pip-version-check --no-compile \
            --ignore-installed --only-binary=:all: --target mcp-sbom-root \
            --require-hashes -r mcp-server/vmaf-mcp/requirements-runtime-lock.txt
          # The wheel is built earlier in this job, so no published hash exists to pin
          # (Scorecard Pinned-Dependencies). Its dependencies are installed above under
          # --require-hashes; the wheel itself is unpacked, which lays down the same
          # package and .dist-info files as `pip install --no-deps --target` (it leaves
          # out the console scripts and the INSTALLER, REQUESTED and direct_url.json
          # markers, which the SBOM does not read).
          wheel_files=(mcp-dist/vmaf_mcp-*.whl)
          [[ ${#wheel_files[@]} -eq 1 && -f "${wheel_files[0]}" ]] || {
            echo "ERROR: expected exactly one vmaf-mcp wheel" >&2
            exit 1
          }
          python -m zipfile -e "${wheel_files[0]}" mcp-sbom-root
          cp -- "${wheels[0]}" "${sdists[0]}" mcp-sbom-root/distributions/
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_SOURCE_NAME: vmafx
          SYFT_SOURCE_VERSION: ${{ needs.validate-release.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
        with:
          syft-version: v1.51.1
          format: spdx-json
          output-file: sbom/vmafx.spdx.json
          path: artifacts/
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_SOURCE_NAME: vmafx
          SYFT_SOURCE_VERSION: ${{ needs.validate-release.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
        with:
          syft-version: v1.51.1
          format: cyclonedx-json
          output-file: sbom/vmafx.cdx.json
          path: artifacts/
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_SOURCE_NAME: vmaf-mcp
          SYFT_SOURCE_VERSION: ${{ needs.validate-release.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
        with:
          syft-version: v1.51.1
          format: spdx-json
          output-file: sbom/vmaf-mcp.spdx.json
          path: mcp-sbom-root/
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_SOURCE_NAME: vmaf-mcp
          SYFT_SOURCE_VERSION: ${{ needs.validate-release.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
        with:
          syft-version: v1.51.1
          format: cyclonedx-json
          output-file: sbom/vmaf-mcp.cdx.json
          path: mcp-sbom-root/
          upload-artifact: false
          upload-release-assets: false
      - name: Verify SBOM identity, dependency graph, and artifact hashes
        env:
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          jq -e --arg version "$VMAFX_VERSION" '
            .name == "vmafx"
            and any(.packages[]?; .name == "vmafx" and .versionInfo == $version)
          ' sbom/vmafx.spdx.json >/dev/null
          jq -e --arg version "$VMAFX_VERSION" '
            .metadata.component.name == "vmafx"
            and .metadata.component.version == $version
          ' sbom/vmafx.cdx.json >/dev/null
          for f in artifacts/* artifacts/arm64/*; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            sha="$(sha256sum -- "$f" | cut -d" " -f1)"
            jq -e --arg name "$name" --arg sha "$sha" '
              any(.files[]?;
                (((.fileName // "") == $name) or ((.fileName // "") | endswith("/" + $name)))
                and any(.checksums[]?;
                  .algorithm == "SHA256" and .checksumValue == $sha))
            ' sbom/vmafx.spdx.json >/dev/null
            jq -e --arg name "$name" --arg sha "$sha" '
              any(.components[]?;
                .type == "file"
                and (((.name // "") == $name) or ((.name // "") | endswith("/" + $name)))
                and any(.hashes[]?;
                  .alg == "SHA-256" and .content == $sha))
            ' sbom/vmafx.cdx.json >/dev/null
          done
          # SemVer on purpose, not pep440_version (see the script's header). The
          # same script runs on pull requests (release-dry-run.yml).
          bash scripts/release/verify-mcp-sbom.sh "$VMAFX_VERSION" sbom mcp-dist
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  sign:
    name: Sigstore sign artifacts
    needs: [collect-artifacts, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      id-token: write   # Sigstore keyless OIDC
      contents: read
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: release-artifacts, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: release-artifacts, path: artifacts/ }
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: sbom, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: sbom, path: artifacts/ }
      # cosign-installer v4 + cosign v3: sign-blob now emits a Sigstore
      # bundle (single .bundle file containing signature + certificate
      # + Rekor entry) instead of the legacy split .sig/.pem pair.
      # Verify later with: cosign verify-blob --bundle <f>.bundle <f>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with: { cosign-release: "v3.1.4" }
      - name: Sign every artifact (keyless OIDC)
        run: |
          cd artifacts
          mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name '*.bundle' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no release artifacts or SBOMs to sign" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes \
              --bundle "$f.bundle" \
              "$f"
          done
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signatures
          path: artifacts/*.bundle
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: signatures
          path: artifacts/*.bundle
          if-no-files-found: error

  # ADR-1356: GitHub-native build provenance (an in-toto statement with the
  # SLSA v1 provenance predicate, signed through Sigstore and stored with the
  # repository's attestations). It replaces slsa-github-generator, whose
  # reusable workflow calls its own sub-actions by tag: the organisation's
  # sha_pinning_required policy rejects that, so v1.0.0-rc.2's provenance jobs
  # failed at `detect-env` and skipped the attachment and PyPI jobs. Every
  # action below is SHA-pinned, and a plain job can name an environment, so
  # this OIDC + attestation writer sits behind release-publish like `sign`.
  provenance:
    name: Attest libvmaf provenance
    needs: [validate-release, collect-artifacts, verify-native-artifacts, verify-native-artifacts-arm64, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: read
      id-token: write       # Sigstore keyless OIDC
      attestations: write   # store the attestation with the repository
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: release-artifacts, path: artifacts/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: release-artifacts, path: artifacts/ }
      # The subjects are the digests collect-artifacts computed for the
      # build, as the generator's base64-subjects were. The bytes the
      # attachment job publishes must be exactly that set.
      - name: Bind the build job's digests to the downloaded bytes
        id: subjects
        env:
          SUBJECT_HASHES: ${{ needs.collect-artifacts.outputs.hashes }}
        run: |
          set -euo pipefail
          subjects="$RUNNER_TEMP/subjects.sha256"
          base64 --decode <<<"$SUBJECT_HASHES" >"$subjects"
          test -s "$subjects"
          diff <(cd artifacts && sha256sum -- * | sort) <(sort "$subjects")
          echo "checksums=$subjects" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance (GitHub native)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.checksums }}
      # ADR-1503 rule 6 / ADR-1513: the SPDX SBOM of the release files,
      # attested on the same subjects (the SBOM is also a release asset).
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: sbom, path: sbom/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: sbom, path: sbom/ }
      - name: Attest the SPDX SBOM on the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.checksums }}
          sbom-path: sbom/vmafx.spdx.json
      # The consumer recipe in docs/development/release.md, run against every
      # subject before the bundle can reach the release.
      - name: Verify the bundle with the consumer recipe, then stage it
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          staged=provenance/vmafx-build-provenance.sigstore.json
          mkdir -p provenance
          cp -- "$BUNDLE" "$staged"
          jq --compact-output . "$staged" > provenance/vmafx-build-provenance.intoto.jsonl
          test "$(wc -l < provenance/vmafx-build-provenance.intoto.jsonl)" -eq 1
          for f in artifacts/*; do
            gh attestation verify "$f" \
              --bundle "$staged" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners >/dev/null
            echo "OK: $f"
          done
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vmafx-build-provenance
          path: |
            provenance/vmafx-build-provenance.sigstore.json
            provenance/vmafx-build-provenance.intoto.jsonl
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: vmafx-build-provenance
          path: |
            provenance/vmafx-build-provenance.sigstore.json
            provenance/vmafx-build-provenance.intoto.jsonl
          if-no-files-found: error

  # ===== MCP server (vmaf-mcp Python package) =====
  # ADR-0166: ship to PyPI (Trusted Publishing) + GitHub release attachment
  # with the same Sigstore + build-provenance story as the libvmaf artifacts.

  mcp-build:
    name: Build vmaf-mcp wheel + sdist
    needs: validate-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install build deps
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
          -r requirements/locks/package-build.txt
      - name: Build wheel + sdist
        working-directory: mcp-server/vmaf-mcp
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          export PYTHONHASHSEED=0
          python -m build --no-isolation --wheel --sdist --outdir ../../mcp-dist
      - name: Compute SHA256 hashes (provenance subjects)
        id: hash
        env:
          VMAFX_PEP440_VERSION: ${{ needs.validate-release.outputs.pep440_version }}
        run: |
          shopt -s nullglob
          wheels=(mcp-dist/vmaf_mcp-"$VMAFX_PEP440_VERSION"-*.whl)
          sdists=(mcp-dist/vmaf_mcp-"$VMAFX_PEP440_VERSION".tar.gz)
          distributions=(mcp-dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ||
                ${#distributions[@]} -ne 2 ||
                ! -f "${sdists[0]}" ]]; then
            echo "ERROR: expected exactly one version-matched wheel and sdist" >&2
            exit 1
          fi
          cd mcp-dist
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mcp-dist
          path: mcp-dist/
          retention-days: 7
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: mcp-dist
          path: mcp-dist/
          retention-days: 7
          if-no-files-found: error

  mcp-sign:
    name: Sigstore sign vmaf-mcp
    needs: mcp-build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      id-token: write   # Sigstore keyless OIDC
      contents: read
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: mcp-dist, path: mcp-dist/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: mcp-dist, path: mcp-dist/ }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with: { cosign-release: "v3.1.4" }
      - name: Sign every artifact (keyless OIDC)
        run: |
          cd mcp-dist
          mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name '*.bundle' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no vmaf-mcp distributions to sign" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes \
              --bundle "$f.bundle" \
              "$f"
          done
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mcp-signatures
          path: mcp-dist/*.bundle
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: mcp-signatures
          path: mcp-dist/*.bundle
          if-no-files-found: error

  # ADR-1356: the vmaf-mcp twin of `provenance`, with its own subjects and
  # bundle name. PyPI keeps its PEP 740 attestations (mcp-publish-pypi).
  mcp-provenance:
    name: Attest vmaf-mcp provenance
    needs: [validate-release, mcp-build, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: read
      id-token: write       # Sigstore keyless OIDC
      attestations: write   # store the attestation with the repository
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: mcp-dist, path: mcp-dist/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: mcp-dist, path: mcp-dist/ }
      - name: Bind the build job's digests to the downloaded bytes
        id: subjects
        env:
          SUBJECT_HASHES: ${{ needs.mcp-build.outputs.hashes }}
        run: |
          set -euo pipefail
          subjects="$RUNNER_TEMP/subjects.sha256"
          base64 --decode <<<"$SUBJECT_HASHES" >"$subjects"
          test -s "$subjects"
          diff <(cd mcp-dist && sha256sum -- * | sort) <(sort "$subjects")
          echo "checksums=$subjects" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance (GitHub native)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.checksums }}
      # ADR-1513: the SPDX SBOM of the wheel and sdist, attested on them.
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: sbom, path: sbom/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: sbom, path: sbom/ }
      - name: Attest the SPDX SBOM on the wheel and sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.checksums }}
          sbom-path: sbom/vmaf-mcp.spdx.json
      - name: Verify the bundle with the consumer recipe, then stage it
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          staged=provenance/vmaf-mcp-provenance.sigstore.json
          mkdir -p provenance
          cp -- "$BUNDLE" "$staged"
          jq --compact-output . "$staged" > provenance/vmaf-mcp-provenance.intoto.jsonl
          test "$(wc -l < provenance/vmaf-mcp-provenance.intoto.jsonl)" -eq 1
          for f in mcp-dist/*; do
            gh attestation verify "$f" \
              --bundle "$staged" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners >/dev/null
            echo "OK: $f"
          done
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vmaf-mcp-provenance
          path: |
            provenance/vmaf-mcp-provenance.sigstore.json
            provenance/vmaf-mcp-provenance.intoto.jsonl
          if-no-files-found: error
      - name: Upload artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: vmaf-mcp-provenance
          path: |
            provenance/vmaf-mcp-provenance.sigstore.json
            provenance/vmaf-mcp-provenance.intoto.jsonl
          if-no-files-found: error

  crates-verify:
    name: Verify Rust crates
    needs: [validate-release]
    # Final releases only: match the crates-publish guard.
    if: ${{ github.repository == 'VMAFx/vmafx' && github.server_url == 'https://github.com' && !contains(needs.validate-release.outputs.version, '-') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Verify the packaged headers without an installed native library or GPU SDK.
      DOCS_RS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1
      - name: Install libclang for packaged-header verification
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libclang-dev
      - name: Dry-run crate packaging and build verification
        timeout-minutes: 10
        run: |
          cargo publish --dry-run --locked -p vmafx-sys -p vmafx -j4

  crates-publish:
    name: Publish Rust crates
    needs: [validate-release, verify-native-artifacts, sign, provenance, crates-verify]
    # Final releases only (the PyPI rule): an rc tag must not publish the 0.1.0 crates early.
    # The tag comes from validate-release, so the workflow_dispatch recovery path works too.
    if: ${{ github.repository == 'VMAFx/vmafx' && github.server_url == 'https://github.com' && !contains(needs.validate-release.outputs.version, '-') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release-publish
    permissions:
      id-token: write
      contents: read
    env:
      # Verify the packaged headers without an installed native library or GPU SDK.
      DOCS_RS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          persist-credentials: false
      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1
      - name: Check immutable crate versions
        id: crates-state
        timeout-minutes: 3
        run: |
          set -euo pipefail
          publish=false
          for crate in vmafx-sys vmafx; do
            version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' \
              "bindings/rust/$crate/Cargo.toml")"
            http_code="$(curl --silent --show-error --max-time 60 \
              --user-agent 'VMAFx/vmafx release publisher (https://github.com/VMAFx/vmafx)' \
              --output "$RUNNER_TEMP/$crate-version.json" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$http_code" in
              200)
                missing=false
                echo "$crate $version already published; skipping"
                ;;
              404) missing=true; publish=true ;;
              *)
                echo "ERROR: crates.io query for $crate $version returned HTTP $http_code" >&2
                exit 1
                ;;
            esac
            echo "$crate=$missing" >> "$GITHUB_OUTPUT"
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Select initial-publication authentication
        id: crates-bootstrap
        if: steps.crates-state.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        if: steps.crates-state.outputs.publish == 'true' && steps.crates-bootstrap.outputs.present == 'false' && env.GITEA_ACTIONS != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish missing Rust crates in dependency order
        if: steps.crates-state.outputs.publish == 'true'
        timeout-minutes: 10
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
          PUBLISH_SYS: ${{ steps.crates-state.outputs.vmafx-sys }}
          PUBLISH_WRAPPER: ${{ steps.crates-state.outputs.vmafx }}
        # Cargo publishes dependencies first and waits for the registry index.
        # One invocation also verifies unpublished intra-workspace dependencies.
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'ERROR: crates.io publication requires authentication' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import subprocess

          command = ["cargo", "publish", "--locked", "--no-verify", "--registry", "crates-io", "-j4"]
          for crate, selected in (("vmafx-sys", "PUBLISH_SYS"), ("vmafx", "PUBLISH_WRAPPER")):
              if os.environ[selected] == "true":
                  command.extend(["-p", crate])
          subprocess.run(command, check=True, timeout=570)
          PY

  mcp-publish-pypi:
    name: Publish vmaf-mcp PyPI
    needs: [validate-release, mcp-build, mcp-sign, mcp-provenance, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: pypi-publish    # user binds this to PyPI Trusted Publisher
    permissions:
      id-token: write             # OIDC token for Trusted Publishing
      contents: read
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: mcp-dist, path: dist/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { name: mcp-dist, path: dist/ }
      - name: Refuse immutable PyPI filename/hash divergence
        id: pypi-state
        env:
          VMAFX_PEP440_VERSION: ${{ needs.validate-release.outputs.pep440_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/vmaf_mcp-"$VMAFX_PEP440_VERSION"-*.whl)
          sdists=(dist/vmaf_mcp-"$VMAFX_PEP440_VERSION".tar.gz)
          distributions=(dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ||
                ${#distributions[@]} -ne 2 ||
                ! -f "${sdists[0]}" ]]; then
            echo "ERROR: expected one version-matched wheel and sdist" >&2
            exit 1
          fi
          local_files=("${wheels[0]}" "${sdists[0]}")
          response="$RUNNER_TEMP/pypi-release.json"
          http_code="$(curl --retry 3 --max-time 60 --silent --show-error \
            --output "$response" --write-out '%{http_code}' \
            "https://pypi.org/pypi/vmaf-mcp/$VMAFX_PEP440_VERSION/json")"
          publish=false
          case "$http_code" in
            200)
              while IFS= read -r filename; do
                if [[ ! -f "dist/$filename" ]]; then
                  echo "ERROR: PyPI has unexpected file for $VMAFX_PEP440_VERSION: $filename" >&2
                  exit 1
                fi
              done < <(jq -r '.urls[].filename' "$response")
              for f in "${local_files[@]}"; do
                filename="$(basename "$f")"
                local_digest="$(sha256sum -- "$f" | cut -d' ' -f1)"
                remote_count="$(jq --arg filename "$filename" \
                  '[.urls[] | select(.filename == $filename)] | length' \
                  "$response")"
                case "$remote_count" in
                  0)
                    publish=true
                    ;;
                  1)
                    remote_digest="$(jq -r --arg filename "$filename" \
                      '.urls[] | select(.filename == $filename) | .digests.sha256' \
                      "$response")"
                    if [[ "$remote_digest" != "$local_digest" ]]; then
                      echo "ERROR: PyPI already has $filename with a different SHA-256" >&2
                      exit 1
                    fi
                    ;;
                  *)
                    echo "ERROR: PyPI returned duplicate records for $filename" >&2
                    exit 1
                    ;;
                esac
              done
              ;;
            404)
              publish=true
              ;;
            *)
              echo "ERROR: PyPI release query returned HTTP $http_code" >&2
              exit 1
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      # PEP 740 attestations: emit Sigstore-signed provenance the index
      # stores alongside the artifact.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        if: steps.pypi-state.outputs.publish == 'true'
        with:
          attestations: true
          skip-existing: true
      - name: Verify exact immutable PyPI file set after publication
        env:
          PUBLISH_PERFORMED: ${{ steps.pypi-state.outputs.publish }}
          VMAFX_PEP440_VERSION: ${{ needs.validate-release.outputs.pep440_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/vmaf_mcp-"$VMAFX_PEP440_VERSION"-*.whl)
          sdists=(dist/vmaf_mcp-"$VMAFX_PEP440_VERSION".tar.gz)
          distribution_files=(dist/*.whl dist/*.tar.gz)
          all_files=(dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ||
                ${#distribution_files[@]} -ne 2 ||
                ! -f "${sdists[0]}" ]]; then
            echo "ERROR: expected one version-matched wheel and sdist" >&2
            exit 1
          fi
          local_files=("${wheels[0]}" "${sdists[0]}")
          if [[ "$PUBLISH_PERFORMED" == "true" ]]; then
            attestations=(
              "${wheels[0]}.publish.attestation"
              "${sdists[0]}.publish.attestation"
            )
            if [[ ${#all_files[@]} -ne 4 ]]; then
              echo "ERROR: trusted publication did not leave exactly two PEP 740 attestations" >&2
              exit 1
            fi
            for attestation in "${attestations[@]}"; do
              jq -e 'type == "object"' "$attestation" >/dev/null || {
                echo "ERROR: missing or invalid PEP 740 attestation: $attestation" >&2
                exit 1
              }
            done
          elif [[ ${#all_files[@]} -ne 2 ]]; then
            echo "ERROR: unexpected files appeared while publication was skipped" >&2
            exit 1
          fi
          response="$RUNNER_TEMP/pypi-release-after.json"
          http_code=000
          for attempt in {1..12}; do
            http_code="$(curl --retry 3 --max-time 60 --silent --show-error --output "$response" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/vmaf-mcp/$VMAFX_PEP440_VERSION/json")"
            if [[ "$http_code" == "200" &&
                  "$(jq '.urls | length' "$response")" -eq 2 ]]; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "ERROR: PyPI release did not converge to two files (HTTP $http_code)" >&2
              exit 1
            fi
            sleep 5
          done
          if [[ "$(jq '.urls | length' "$response")" -ne 2 ]]; then
            echo "ERROR: PyPI does not contain exactly the expected wheel and sdist" >&2
            exit 1
          fi
          while IFS= read -r filename; do
            if [[ ! -f "dist/$filename" ]]; then
              echo "ERROR: PyPI has unexpected file for $VMAFX_PEP440_VERSION: $filename" >&2
              exit 1
            fi
          done < <(jq -r '.urls[].filename' "$response")
          for f in "${local_files[@]}"; do
            filename="$(basename "$f")"
            local_digest="$(sha256sum -- "$f" | cut -d' ' -f1)"
            remote_count="$(jq --arg filename "$filename" \
              '[.urls[] | select(.filename == $filename)] | length' \
              "$response")"
            remote_digest="$(jq -r --arg filename "$filename" \
              '.urls[] | select(.filename == $filename) | .digests.sha256' \
              "$response")"
            if [[ "$remote_count" -ne 1 || "$remote_digest" != "$local_digest" ]]; then
              echo "ERROR: PyPI file set or SHA-256 diverged for $filename" >&2
              exit 1
            fi
          done

  attach-to-release:
    name: Attach release assets
    needs:
      - validate-release
      - collect-artifacts
      - verify-native-artifacts
      - sbom
      - sign
      - provenance
      - mcp-build
      - mcp-sign
      - mcp-provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write   # upload files to the GitHub Release
    steps:
      - if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { path: dist/ }
      - name: Download artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with: { path: dist/ }
      - name: Require every release asset and matching signature
        run: |
          shopt -s nullglob
          required=(
            dist/release-artifacts/libvmaf.so
            dist/release-artifacts/libvmafx.so
            dist/release-artifacts/vmaf
            dist/release-artifacts/vmafx-linux-arm64.tar.gz
            dist/release-artifacts/models.tar.gz
            dist/release-artifacts/container-build-provenance.txt
            dist/release-artifacts/THIRD_PARTY_NOTICES.txt
            dist/release-artifacts/licenses.tar.gz
            dist/sbom/vmafx.spdx.json
            dist/sbom/vmafx.cdx.json
            dist/sbom/vmaf-mcp.spdx.json
            dist/sbom/vmaf-mcp.cdx.json
            dist/vmafx-build-provenance/vmafx-build-provenance.sigstore.json
            dist/vmafx-build-provenance/vmafx-build-provenance.intoto.jsonl
            dist/vmaf-mcp-provenance/vmaf-mcp-provenance.sigstore.json
            dist/vmaf-mcp-provenance/vmaf-mcp-provenance.intoto.jsonl
          )
          wheels=(dist/mcp-dist/vmaf_mcp-*.whl)
          sdists=(dist/mcp-dist/vmaf_mcp-*.tar.gz)
          mcp_distributions=(dist/mcp-dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ||
                ${#mcp_distributions[@]} -ne 2 ]]; then
            echo "ERROR: expected exactly one vmaf-mcp wheel and one sdist" >&2
            exit 1
          fi
          for f in "${required[@]}" "${wheels[@]}" "${sdists[@]}"; do
            test -s "$f" || {
              echo "ERROR: required release asset is missing or empty: $f" >&2
              exit 1
            }
          done
          for f in dist/release-artifacts/* dist/sbom/*; do
            bundle="dist/signatures/$(basename "$f").bundle"
            test -s "$bundle" || {
              echo "ERROR: signature bundle missing for $f" >&2
              exit 1
            }
          done
          for f in "${wheels[@]}" "${sdists[@]}"; do
            bundle="dist/mcp-signatures/$(basename "$f").bundle"
            test -s "$bundle" || {
              echo "ERROR: signature bundle missing for $f" >&2
              exit 1
            }
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/release-artifacts/*
            dist/sbom/*
            dist/signatures/*
            dist/mcp-dist/*
            dist/mcp-signatures/*
            dist/vmafx-build-provenance/vmafx-build-provenance.sigstore.json
            dist/vmafx-build-provenance/vmafx-build-provenance.intoto.jsonl
            dist/vmaf-mcp-provenance/vmaf-mcp-provenance.sigstore.json
            dist/vmaf-mcp-provenance/vmaf-mcp-provenance.intoto.jsonl

  # #2319 (ledger vmafx-2319-package-channels): after the release assets are
  # attached, open the formula pull request on the Vidiko Homebrew tap. Final
  # versions only; the tap's own checks decide the merge. The release bot app
  # needs an installation on the Vidiko organisation with contents and pull
  # request write on homebrew-tap; until then the token step fails by name.
  homebrew-tap:
    name: Publish Homebrew tap formula
    needs: [validate-release, attach-to-release]
    if: ${{ !contains(needs.validate-release.outputs.version, '-') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Write the tap formula from the release source archive
        timeout-minutes: 5
        env:
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          url="$(python3 scripts/release/distribution.py source-url --version "$VMAFX_VERSION")"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/source.tar.gz" "$url"
          digest="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)"
          python3 scripts/release/distribution.py homebrew --version "$VMAFX_VERSION" \
            --source-sha256 "$digest" --out "$RUNNER_TEMP/tap"
      - name: Mint the release-bot installation token for the tap
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: Vidiko
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Open the tap pull request
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VMAFX_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          python3 scripts/release/publish_homebrew_tap.py --tap Vidiko/homebrew-tap \
            --version "$VMAFX_VERSION" --formula "$RUNNER_TEMP/tap/Formula/vmafx.rb" \
            --signoff "vmafx-release-bot[bot] <340976456+vmafx-release-bot[bot]@users.noreply.github.com>" \
            --apply
