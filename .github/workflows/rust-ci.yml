name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least-privilege default for the whole workflow (ADR-0875).
# Jobs widen only if they need to publish artefacts or push.
permissions:
  contents: read

jobs:
  tier:
    name: CI tier (Rust)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  impact:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Plan Rust impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  rust-vmafx-sys-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # ADR-1297 — required. Builds and installs libvmaf, then runs cargo fmt
    # --check, clippy -D warnings, build, the test suite and the Netflix golden
    # smoke example over the Rust FFI binding. It reported `cancelled` on
    # PR #1518 only because a newer push superseded it; the aggregator's
    # newest-run-per-name filter drops a superseded run, so that is not a
    # structural reason to leave the binding ungated.
    name: vmafx-sys CI work
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          # Drop the hosted runner's pre-provisioned Microsoft/Azure apt
          # sources before updating; they intermittently 403 and fail
          # `apt-get update` with exit 100. See T-CI-APT-MS-REPO-FLAKE.
          # rm -f succeeds when a pattern matches nothing.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure*
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm libssl-dev \
            clang libclang-dev pkg-config
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Build and install libvmaf (CPU only)
        run: |
          # --libdir=lib: meson on Ubuntu defaults to multiarch
          # (/usr/local/lib/x86_64-linux-gnu/), but vmafx-sys/build.rs and the
          # downstream link step search /usr/local/lib directly. Pin the
          # single-arch path so the `.so` lands where the linker looks.
          # ADR-2170: this build prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-ci core \
            -Denable_cuda=false \
            -Denable_sycl=false \
            -Denable_hip=false \
            -Denable_avx512=false \
            --prefix /usr/local \
            --libdir lib \
            $(scripts/ci/werror-args.sh true)
          ninja -C build-ci
          sudo ninja -C build-ci install
          sudo ldconfig

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          # Pinned by commit SHA, so the action cannot infer the toolchain from
          # its git ref — `toolchain` must be given explicitly or setup fails
          # with "'toolchain' is a required input".
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Cargo fmt check (both workspaces)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path core/src/rust/Cargo.toml --all --check

      - name: Cargo clippy (every crate of both workspaces, ADR-1713)
        # --workspace: a crate added to a workspace's `members` is linted
        # without a workflow edit (RC3 hygiene; was `-p vmafx-sys` only). The
        # libvmaf-linked workspace (core/src/rust) sets [workspace.lints] (no
        # unwrap, no expect, SAFETY proofs, length and complexity caps).
        env:
          LIBVMAF_PREFIX: /usr/local
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path core/src/rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Cargo build
        env:
          LIBVMAF_PREFIX: /usr/local
        run: cargo build -p vmafx-sys

      - name: Cargo test (unit + integration, every workspace crate)
        # --workspace: vmafx (the safe binding) and vmafx-tad carry tests too;
        # `-p vmafx-sys` ran none of them (ADR-1528).
        env:
          LIBVMAF_PREFIX: /usr/local
          VMAFX_REPO: ${{ github.workspace }}
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cargo test --workspace --all-features
          cargo test --manifest-path core/src/rust/Cargo.toml --workspace

      - name: The libvmaf-linked workspace builds offline (ADR-1713)
        # Meson's build is `cargo build --offline --locked`: with an empty
        # CARGO_HOME it only succeeds while no crate of core/src/rust pulls
        # an external dependency.
        run: |
          CARGO_HOME="$RUNNER_TEMP/empty-cargo-home" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            cargo build --release --locked --offline -p vmafx-core-rs \
            --manifest-path core/src/rust/Cargo.toml

      - name: Run score example (Netflix golden smoke test)
        env:
          LIBVMAF_PREFIX: /usr/local
          VMAFX_REPO: ${{ github.workspace }}
          LD_LIBRARY_PATH: /usr/local/lib
        run: cargo run --example score

      - name: Rust ABI header is current (cbindgen, ADR-1713)
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          VMAFX_REQUIRE_CBINDGEN=1 scripts/dev/rust-abi-header.sh --check

      - name: Build libvmaf with the Rust extractors (ADR-1713)
        run: |
          meson setup build-rust core \
            -Denable_rust_features=true \
            -Denable_cuda=false \
            -Denable_sycl=false \
            -Denable_hip=false \
            -Denable_avx512=false
          ninja -C build-rust

      - name: Fetch the Netflix and checkerboard fixtures
        run: bash scripts/test/fetch-test-yuvs.sh

      - name: Rust suite and Rust twin harness (ADR-1713)
        # Every registered Rust twin against its C extractor in the same
        # binary: equal doubles on every metric of every frame. The 4K and
        # 10-bit fixtures are not in CI; lanes attach that evidence locally.
        run: |
          python3 scripts/ci/run_meson_test.py -- -C build-rust --suite rust
          python3 scripts/ci/rust_twin_diff.py --vmaf build-rust/tools/vmaf \
            --all-twins --fixtures netflix,checker1,checker10

  cargo-deny-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # ADR-1297 — required. A supply-chain policy nobody has to pass is not a
    # policy.
    name: cargo-deny work
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Runs in parallel with rust-vmafx-sys: pure dependency-graph analysis, no
    # libvmaf build required. Enforces the supply-chain policy in deny.toml
    # (ADR-0917). Fails on: copyleft licenses, banned crates (openssl-sys /
    # native-tls), known RustSec vulnerabilities, unknown crate registries,
    # unknown git sources, wildcard version requirements.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Match the project root's deny.toml location.
          arguments: --all-features

  vmafx-sys-gate:
    needs: [tier, impact, rust-vmafx-sys-work]
    if: always() && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: vmafx-sys CI
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected vmafx-sys work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.rust-vmafx-sys-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid vmafx-sys gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  cargo-deny-gate:
    needs: [tier, impact, cargo-deny-work]
    if: always() && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected cargo-deny work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.cargo-deny-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid cargo-deny gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac
