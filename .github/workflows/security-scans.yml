# Security scans: SAST (semgrep + CodeQL), secret scanning, dependency review.

name: Security
# Security — Semgrep / CodeQL / Gitleaks / Dependency Review.
# The display name is deliberately short: GitHub's badge.svg paints it
# into the README status badge. See ADR-1227.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 — `ready_for_review` lets the per-job draft gate fire
    # CI when a draft PR is promoted to ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"   # weekly Mon 06:00 UTC
  workflow_dispatch:

# Default to least-privilege; jobs that push SARIF to the Security tab
# (semgrep, codeql-*, gitleaks) opt into `security-events: write` per-job.
# dependency-review only needs `contents: read`. Addresses Scorecard
# TokenPermissionsID alert on the previously top-level write scope.
permissions:
  contents: read

concurrency:
  # A weekly schedule and a master push share github.ref. Keep cancellation for
  # superseded runs of the same trigger, but never let one event class cancel
  # CodeQL coverage for the other.
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tier:
    name: CI tier (Security)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  semgrep:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload-sarif to Security tab
    container:
      # returntocorp/semgrep was renamed to semgrep/semgrep upstream. The old
      # image still resolves but ships an EOL semgrep-core that exits 7 when it
      # cannot load current `p/cwe-top-25` / `p/cert-c-strict` rulesets, which
      # uploads an empty SARIF and lights up a "Semgrep OSS is reporting errors"
      # banner on the repo Security tab.
      # Pulled at job setup, before any step could point the daemon at a
      # mirror, so the reference names mirror.gcr.io (Docker Hub's anonymous
      # pull limit failed this job, run 37989639868). Same digest as on
      # Docker Hub; scripts/ci/tests/test_docker_hub_mirror.py refuses a
      # job container, service or docker:// step on Docker Hub.
      image: mirror.gcr.io/semgrep/semgrep:latest@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run semgrep (local rules — gate on ERRORs)
        run: |
          # Local .semgrep.yml only: our custom rules for VMAF-specific
          # patterns (no-system-rand, no-strcpy-strcat-sprintf, etc.). They
          # run without the Semgrep Registry and can't be flaky from an
          # unreachable rule pack.
          # --error exits non-zero on ANY finding from these rules; they are
          # all real defect patterns we've already committed to avoiding.
          semgrep scan \
            --config=.semgrep.yml \
            --error \
            --sarif --output=semgrep-local.sarif
      - name: Run semgrep (registry rule packs — advisory)
        continue-on-error: true
        run: |
          # Registry packs we keep (validated 2026-05-09, Research-0090):
          #   p/cwe-top-25 — CWE Top 25 cross-language coverage.
          #   p/c          — surviving CERT-C consolidation pack (the
          #                  separate `p/cert-c-strict` and `p/cert-cpp-strict`
          #                  packs were retired by Semgrep in 2025; both
          #                  return HTTP 404 from semgrep.dev/c/. The strict
          #                  rules were rolled into `p/c`.)
          #   p/python     — Python security pack (replaces what `cert-cpp-strict`
          #                  used to half-cover for our Python harness).
          # Note: there is no `p/cpp` either — also rolled into `p/c`.
          # We don't gate merges on registry findings; CodeQL's security-and-
          # quality suite is the merge gate (separate job). continue-on-error
          # because the Semgrep Registry occasionally rate-limits
          # unauthenticated fetches, which exits 7 with an empty SARIF.
          semgrep scan \
            --config=p/cwe-top-25 \
            --config=p/c \
            --config=p/python \
            --sarif --output=semgrep-registry.sarif
      - name: Upload local-rules SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: semgrep-local.sarif
          category: semgrep-local
      - name: Archive registry-rules SARIF (advisory)
        if: always() && hashFiles('semgrep-registry.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: semgrep-registry-sarif
          path: semgrep-registry.sarif
          if-no-files-found: error
          retention-days: 14

  # ADR-1297 requires the `Semgrep OSS` code-scanning check created by the
  # github-advanced-security app. ADR-1314 limits that check to the repository-
  # owned `semgrep-local` category above: unpinned registry packs remain useful
  # advisory diagnostics, but their SARIF is a workflow artifact and never
  # enters the blocking code-scanning context.
  # required-aggregator: Semgrep OSS

  # ADR-1297 — `gitleaks` (lowercase) is the code-scanning check the
  # github-advanced-security app creates from the `category: gitleaks` SARIF
  # upload in the `secret-scan` job below; `Gitleaks` (capital G) is that job
  # itself and was already required. Check names are case-sensitive, so the
  # two cannot mask each other and check-aggregator-names.sh's one-job-per-name
  # rule is not violated. Gated for the same reason `CodeQL` is: a
  # secret-scanning verdict on the pull request that nothing blocks on is not
  # a verdict.
  # required-aggregator: gitleaks

  # required-aggregator: CodeQL
  # security-and-quality is a superset of security-extended, so specifying
  # both duplicates queries and trips the CodeQL setup UI's "ambiguous
  # configuration" detector. Pick one suite per job.
  # ADR-3294: every CodeQL language runs on every pull request and push, with
  # no ADR-1140 impact plan. GitHub's `CodeQL` check turns neutral
  # ("configuration not found") when a category master uploads is missing from
  # the head, and the aggregator fails a neutral owed check (ADR-3293).
  codeql-cpp:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: CodeQL (C/C++)
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write   # codeql-action/analyze uploads SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure C/C++ build (outside extraction)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          # Configure Meson before codeql-action/init with build-root outside the
          # source tree (${{ runner.temp }}/build). Running configure outside
          # CodeQL extraction prevents compiler probe snippets (e.g.
          # meson-private/.../testfile.c) from being extracted into the CodeQL DB;
          # placing the build-root outside $GITHUB_WORKSPACE ensures generated
          # build artifacts are not classified as project source (ADR-1222, Alert 1279 / historical 1278).
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup "${{ runner.temp }}/build" core -Denable_cuda=false -Denable_sycl=false \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: cpp
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
      - name: Build
        run: |
          meson compile -C "${{ runner.temp }}/build"
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:cpp"

  codeql-python:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: CodeQL (Python)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:python"

  # CodeQL's Actions-language support landed GA in late 2025. It scans
  # .github/workflows/*.yml for token-permission, injection, and pinning
  # issues. GitHub's default setup was auto-enabling this on the side; make
  # it explicit here so the job history is versioned with the repo.
  # ADR-1389: Make CodeQL (Actions) run unconditionally on every PR and master push
  # so that OSSF Scorecard's SAST check detects a SAST tool run on 100% of commits
  # (including docs-only PRs) cheaply (~15-20s) without weakening any gate.
  codeql-actions:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: CodeQL (Actions)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: actions
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:actions"

  secret-scan:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write   # upload-sarif to Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Run gitleaks CLI directly to avoid the GITLEAKS_LICENSE org-repo
      # requirement introduced in gitleaks-action v2. The CLI itself is
      # Apache-2.0 and free for all use; only the action wrapper charges
      # per-org. SARIF output is uploaded to the Security tab so findings
      # appear there as before.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL --max-time 300 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Scan the history of the checked-out commit only. Without --log-opts
      # gitleaks runs `git log --all`, and fetch-depth: 0 fetches every
      # branch, so one branch's finding (even a force-pushed-away commit
      # still in the fetch) failed every other PR. On a pull request HEAD
      # is the merge commit: master's history plus the PR's commits.
      - name: Run gitleaks (detect secrets)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--full-history HEAD" \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-review:
    needs: tier
    if: needs.tier.outputs.light == 'true' && github.event_name == 'pull_request'
    # required-aggregator
    name: Dependency Review
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # python-slugify depends on text-unidecode, which is dual-licensed under
          # Artistic-1.0-Perl OR GPL-1.0-only OR GPL-2.0-or-later. VMAFx consumes
          # text-unidecode under Artistic-1.0-Perl, but the action's SPDX evaluator
          # flags GPL-2.0-or-later against deny-licenses: GPL-3.0. Dependency Review
          # PURL matching compares package identity package-wide (ignoring versions);
          # allow pkg:pypi/text-unidecode truthfully using explicit package-wide syntax.
          # REUSE is a development-only compliance tool and pulls python-debian,
          # whose GPL-2.0-or-later code is neither imported nor linked into any
          # VMAFx artifact. ADR-1305 section 10 requires reviewed exceptions to
          # use exact package-wide PURLs, matching the text-unidecode precedent.
          allow-dependencies-licenses: pkg:pypi/text-unidecode, pkg:pypi/python-debian

  # ADR-1247: PR source checks cannot supply the full default-branch aggregate.
  # Folded in from scorecard-policy.yml: one workflow less creates one check
  # suite less per pull-request commit, and Scorecard's SAST probe reads only
  # the first 30 suites of a commit.
  scorecard-pr-gate:
    needs: tier
    if: github.event_name == 'pull_request' && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Scorecard PR Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require ready review
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: test "$IS_DRAFT" = false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bind clean local inputs before analysis
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -B scripts/ci/scorecard_gate.py snapshot \
            --sha "$EXPECTED_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --receipt "$RUNNER_TEMP/scorecard-source.json"

      - name: Scan PR files (partial scope; never published)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard-local.json
          results_format: json
          publish_results: false

      - name: Enforce bound local policy
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -B scripts/ci/scorecard_gate.py local \
            --sha "$EXPECTED_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --report scorecard-local.json \
            --snapshot "$RUNNER_TEMP/scorecard-source.json" \
            --receipt "$RUNNER_TEMP/scorecard-local-gate.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve local findings and source receipt
        if: ${{ always() && github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scorecard-local.json
            ${{ runner.temp }}/scorecard-source.json
            ${{ runner.temp }}/scorecard-local-gate.json
          if-no-files-found: error
          retention-days: 14
