name: Docker Image Build
on:
  push:
    branches: [master]
    paths:
      # Path-filter introduced in ADR-0317. Only fire when the Docker
      # build inputs actually change. Doc-only / Python-only PRs do not
      # need a Docker rebuild, and apt-mirror flakes (`apt-get install`
      # exit 100) on the runner produced 10–15 min of red noise on every
      # push during the doc/Python merge train (#409, #411, #412).
      - "Dockerfile"
      - ".dockerignore"
      - "core/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [master]
    # ADR-0331 — `ready_for_review` lets the per-job draft gate
    # below (`github.event.pull_request.draft == false`) fire CI when
    # a draft PR is promoted. Without it, draft → ready transitions
    # would never trigger this workflow.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "core/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # T7-CI-DEDUP / Research-0034 originally demoted this to
    # `continue-on-error: true` because the job only proved the
    # Dockerfile parsed — no image-behavioural guarantee. That
    # masking caused the ADR-0700 `libvmaf/` → `core/` rename on
    # 2026-05-28 to leave the Docker build silently red on every
    # master push for 48 hours (Makefile + Dockerfile paths missed
    # the rename). Flipping back to blocking so a future
    # rename-class regression surfaces immediately at the job level.
    # T7-DOCKER-SMOKE (a real `docker run vmaf vmaf --version` step)
    # is the right next step — tracked separately.
    name: Docker Image Build
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build Docker Image
        run: docker build -t vmaf .
