name: Docker Image Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Plan Docker image impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.docker_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  docker-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # T-DOCKER-SMOKE — promoted to blocking after 3 consecutive green master
    # runs (2026-06-08). The job now smoke-tests the resulting image with a
    # real vmaf --backend cpu score assertion against the 576x324 fixture pair
    # included in testdata/, proving behavioural correctness, not just that the
    # Dockerfile parses. Expected pooled mean ≈ 94.32; tolerance ±0.5 VMAF
    # points to absorb model-version float rounding while still catching gross
    # regressions (e.g., wrong model loaded, binary segfault, wrong pixel format).
    # "Promoted to blocking" above described intent, not configuration: the
    # name was never added to required-aggregator.yml, so for three months the
    # job reported and nothing acted on it. ADR-1297 finishes the promotion.
    # ADR-1102 makes this container the canonical published artifact.
    name: Docker Image Build work
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build Docker Image
        run: docker build -t vmaf .
      - name: Smoke-test image — CPU score assertion
        # Run vmaf inside the image against the 576×324 YUV fixture pair that
        # ships in testdata/. Expected pooled mean VMAF ≈ 94.32 (cpu integer
        # pipeline, vmaf_v0.6.1.json). Tolerance ±0.5 catches wrong model,
        # wrong pixel format, and binary crash while absorbing float rounding.
        #
        # vmaf writes JSON to a bind-mounted output FILE (not /dev/stdout) so
        # the result survives regardless of how the runner captures the
        # container's stdout, and vmaf's stderr is captured to a log printed on
        # any non-zero exit. The previous `... 2>/dev/null | python3` form
        # discarded the one piece of evidence — the loader / runtime error —
        # needed to debug a "produced no output" failure (the image scores
        # 94.3230 locally, so a CI-only no-output failure is otherwise opaque).
        # --backend cpu forces the software path; ubuntu-latest runners have no
        # GPU, so this is also the only path that will succeed without --backend.
        run: |
          set -o pipefail
          out_dir="${{ github.workspace }}/smoke-out"
          mkdir -p "$out_dir"
          rc=0
          docker run --rm \
            --entrypoint /usr/local/bin/vmaf \
            -v "${{ github.workspace }}/testdata:/testdata:ro" \
            -v "${{ github.workspace }}/model:/model:ro" \
            -v "$out_dir:/out" \
            vmaf \
              --reference /testdata/ref_576x324_48f.yuv \
              --distorted /testdata/dis_576x324_48f.yuv \
              --width 576 --height 324 \
              --pixel_format 420 --bitdepth 8 \
              --model path=/model/vmaf_v0.6.1.json \
              --backend cpu \
              --output /out/result.json \
              --json \
            >"$out_dir/stdout.log" 2>"$out_dir/stderr.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::vmaf exited $rc inside the image"
            echo "----- vmaf stdout -----"; cat "$out_dir/stdout.log" || true
            echo "----- vmaf stderr -----"; cat "$out_dir/stderr.log" || true
            exit 1
          fi
          python3 - "$out_dir/result.json" <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as fh:
                  d = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              print(f"FAIL: could not read vmaf output {path}: {exc}", file=sys.stderr)
              sys.exit(1)
          frames = d.get("frames", [])
          if not frames:
              print("FAIL: no frames in vmaf output", file=sys.stderr)
              sys.exit(1)
          scores = [fr["metrics"]["vmaf"] for fr in frames]
          mean_score = sum(scores) / len(scores)
          expected = 94.32
          tol = 0.5
          print(f"Smoke test: mean VMAF = {mean_score:.4f} (expected {expected} ± {tol})")
          if abs(mean_score - expected) > tol:
              print(f"FAIL: score {mean_score:.4f} outside [{expected - tol}, {expected + tol}]", file=sys.stderr)
              sys.exit(1)
          print("PASS")
          PYEOF

  docker:
    needs: [impact, docker-work]
    if: always()
    # required-aggregator
    name: Docker Image Build
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected Docker image work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.docker-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid Docker gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac
