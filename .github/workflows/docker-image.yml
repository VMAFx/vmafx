name: Docker Image Build
on:
  push:
    branches: [master]
    paths:
      # Path-filter introduced in ADR-0317. Only fire when the Docker
      # build inputs actually change. Doc-only / Python-only PRs do not
      # need a Docker rebuild, and apt-mirror flakes (`apt-get install`
      # exit 100) on the runner produced 10–15 min of red noise on every
      # push during the doc/Python merge train (#409, #411, #412).
      - "Dockerfile"
      - ".dockerignore"
      - "core/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [master]
    # ADR-0331 — `ready_for_review` lets the per-job draft gate
    # below (`github.event.pull_request.draft == false`) fire CI when
    # a draft PR is promoted. Without it, draft → ready transitions
    # would never trigger this workflow.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "core/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # T-DOCKER-SMOKE — promoted to blocking after 3 consecutive green master
    # runs (2026-06-08). The job now smoke-tests the resulting image with a
    # real vmaf --backend cpu score assertion against the 576x324 fixture pair
    # included in testdata/, proving behavioural correctness, not just that the
    # Dockerfile parses. Expected pooled mean ≈ 94.32; tolerance ±0.5 VMAF
    # points to absorb model-version float rounding while still catching gross
    # regressions (e.g., wrong model loaded, binary segfault, wrong pixel format).
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Build Docker Image
        run: docker build -t vmaf .
      - name: Smoke-test image — CPU score assertion
        # Run vmaf inside the image against the 576×324 YUV fixture pair that
        # ships in testdata/. Expected pooled mean VMAF ≈ 94.32 (cpu integer
        # pipeline, vmaf_v0.6.1.json). Tolerance ±0.5 catches wrong model,
        # wrong pixel format, and binary crash while absorbing float rounding.
        # Output goes to /dev/stdout so the runner's python3 can parse it via
        # pipe — no shared volume needed for the output file.
        # --backend cpu forces the software path; ubuntu-latest runners have no
        # GPU, so this is also the only path that will succeed without --backend.
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/vmaf \
            -v "${{ github.workspace }}/testdata:/testdata:ro" \
            -v "${{ github.workspace }}/model:/model:ro" \
            vmaf \
              --reference /testdata/ref_576x324_48f.yuv \
              --distorted /testdata/dis_576x324_48f.yuv \
              --width 576 --height 324 \
              --pixel_format 420 --bitdepth 8 \
              --model path=/model/vmaf_v0.6.1.json \
              --backend cpu \
              --output /dev/stdout \
              --json \
          2>/dev/null | python3 - <<'PYEOF'
          import json, sys
          raw = sys.stdin.read()
          if not raw.strip():
              print("FAIL: vmaf produced no output (binary crash or wrong entrypoint?)", file=sys.stderr)
              sys.exit(1)
          d = json.loads(raw)
          frames = d.get("frames", [])
          if not frames:
              print("FAIL: no frames in vmaf output", file=sys.stderr)
              sys.exit(1)
          scores = [fr["metrics"]["vmaf"] for fr in frames]
          mean_score = sum(scores) / len(scores)
          expected = 94.32
          tol = 0.5
          print(f"Smoke test: mean VMAF = {mean_score:.4f} (expected {expected} ± {tol})")
          if abs(mean_score - expected) > tol:
              print(f"FAIL: score {mean_score:.4f} outside [{expected - tol}, {expected + tol}]", file=sys.stderr)
              sys.exit(1)
          print("PASS")
          PYEOF
