name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
        env:
          INSTALL_LINTERS: "1"
      - name: Meson setup (TSan)
        run: |
          cd core
          meson setup ../build-tsan \
            -Db_sanitize=thread \
            -Denable_cuda=false \
            -Denable_sycl=false \
            --buildtype=debugoptimized
      - name: Build
        run: ninja -C build-tsan
      - name: Run tests
        # test_gpu_picture_pool_uaf intentionally forces a ~192 GB allocation
        # failure; without allocator_may_return_null the TSan/ASan runtime
        # hard-aborts (out-of-memory) instead of letting the test see NULL.
        # The required tests-and-quality-gates lane sets the same env.
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: allocator_may_return_null=1
        run: meson test -C build-tsan --print-errorlogs --timeout-multiplier 3

  clang-tidy-full:
    name: Full clang-tidy scan
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Keep this toolchain identical to the required CPU tidy-ratchet
          # lane. Ubuntu runner images do not all publish gcc-15 directly.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build nasm jq
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tidy-22
          sudo pip3 install --break-system-packages --quiet --require-hashes \
            -r requirements/locks/build.txt
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'
      - name: Generate compile_commands.json
        run: |
          CC=gcc-15 CXX=g++-15 meson setup build core \
            -Denable_cuda=false -Denable_sycl=false -Db_lto=false
      - name: Build (generated headers for clang-tidy)
        run: |
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build
      - name: Whole-tree clang-tidy ratchet (ADR-1142, cpu lane, fails on drift)
        run: |
          python3 scripts/ci/tidy-ratchet.py --lane cpu --build-dir build \
            --clang-tidy /usr/bin/clang-tidy-22 --jobs "$(nproc)" \
            --report clang-tidy-full.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: clang-tidy-full-report
          path: clang-tidy-full.log

  netflix-benchmark:
    name: Netflix benchmark suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
      - name: Build
        run: |
          cd core
          meson setup ../build -Denable_cuda=false -Denable_sycl=false --buildtype=release
          ninja -C ../build
      - name: Run benchmark
        env:
          VMAF_BIN: ${{ github.workspace }}/build/tools/vmaf
        run: bash testdata/bench_all.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-benchmark-results
          path: testdata/netflix_benchmark_results.json
