name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history for the merge-base tests of the suite
          # (scripts/ci/tests/test_meson_suite_checkout_history.py).
          fetch-depth: 0
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
        env:
          INSTALL_LINTERS: "1"
      - name: Meson setup (TSan)
        run: |
          cd core
          meson setup ../build-tsan \
            -Db_sanitize=thread \
            -Denable_cuda=false \
            -Denable_sycl=false \
            --buildtype=debugoptimized
      - name: Build
        run: ninja -C build-tsan
      - name: Run tests
        # test_gpu_picture_pool_uaf intentionally forces a ~192 GB allocation
        # failure; without allocator_may_return_null the TSan/ASan runtime
        # hard-aborts (out-of-memory) instead of letting the test see NULL.
        # The required tests-and-quality-gates lane sets the same env.
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: allocator_may_return_null=1
        run: >-
          python3 scripts/ci/run_meson_test.py -- -C build-tsan
          --print-errorlogs --timeout-multiplier 3

  clang-tidy-full:
    name: Full clang-tidy scan
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Keep this toolchain identical to the required CPU tidy-ratchet
          # lane. Ubuntu runner images do not all publish gcc-15 directly.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # libvpl-dev as in the required Tidy Ratchet job: the dev container
          # that writes the baseline has it.
          sudo apt-get install -y gcc-15 g++-15 ninja-build nasm jq libvpl-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tidy-22
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'
      - name: Build the cpu lane (compile_commands.json + generated headers)
        # The lane's one definition is the Makefile's (ADR-1471), which the
        # required Tidy Ratchet job and scripts/dev/tidy-lane.sh run too.
        run: make tidy-ratchet-build LANE=cpu TIDY_RATCHET_BUILD_DIR=build TIDY_RATCHET_JOBS="$(nproc)"
      - name: Whole-tree clang-tidy ratchet (ADR-1142, cpu lane, fails on drift)
        run: |
          make tidy-ratchet LANE=cpu TIDY_RATCHET_BUILD_DIR=build \
            CLANG_TIDY_BIN=/usr/bin/clang-tidy-22 \
            TIDY_RATCHET_ARGS="--jobs $(nproc) --report clang-tidy-full.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: clang-tidy-full-report
          path: clang-tidy-full.log

  netflix-benchmark:
    name: Netflix benchmark suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
      - name: Build
        run: |
          cd core
          meson setup ../build -Denable_cuda=false -Denable_sycl=false --buildtype=release
          ninja -C ../build
      - name: Run benchmark
        env:
          VMAF_BIN: ${{ github.workspace }}/build/tools/vmaf
        run: bash testdata/bench_all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: nightly-benchmark-results
          path: testdata/netflix_benchmark_results.json
