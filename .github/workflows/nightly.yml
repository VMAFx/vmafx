name: nightly

# Jobs in this file:
#   clang-tidy-full  — full tree clang-tidy scan (too slow for per-PR).
#   netflix-benchmark — CPU benchmark suite, result uploaded as artefact.
#
# TSan is NOT here: sanitizers.yml fires TSan on every push to master,
# which is more timely than a nightly cron. See ADR-0793.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-tidy-full:
    name: Full clang-tidy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
        env:
          INSTALL_LINTERS: "1"
      - name: Generate compile_commands.json
        run: |
          cd core
          meson setup ../build -Denable_cuda=false -Denable_sycl=false
      - name: Run clang-tidy on full tree
        run: |
          find core/src core/tools -name '*.c' -o -name '*.cpp' | \
            parallel -j"$(nproc)" --joblog tidy.log \
              'clang-tidy -p build {} 2>&1 || true' | tee clang-tidy-full.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: clang-tidy-full-report
          path: clang-tidy-full.log
          retention-days: 14

  netflix-benchmark:
    name: Netflix benchmark suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
      - name: Build
        run: |
          cd core
          meson setup ../build -Denable_cuda=false -Denable_sycl=false --buildtype=release
          ninja -C ../build
      - name: Run benchmark
        run: bash testdata/bench_all.sh || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-benchmark-results
          path: testdata/netflix_benchmark_results.json
          retention-days: 30
