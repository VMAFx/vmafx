name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history for the merge-base tests of the suite
          # (scripts/ci/tests/test_meson_suite_checkout_history.py).
          fetch-depth: 0
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
        env:
          INSTALL_LINTERS: "1"
      - name: Meson setup (TSan)
        run: |
          cd core
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup ../build-tsan \
            -Db_sanitize=thread \
            -Denable_cuda=false \
            -Denable_sycl=false \
            --buildtype=debugoptimized \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
      - name: Build
        run: ninja -C build-tsan
      - name: Prefetch Go modules for the suite
        # The suite's Go-running tests find their modules in the cache: the
        # download happens here, retried, and fails here when it cannot succeed
        # (scripts/ci/prefetch_go_modules.py, as the user the suite runs as).
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run tests
        # test_gpu_picture_pool_uaf intentionally forces a ~192 GB allocation
        # failure; without allocator_may_return_null the TSan/ASan runtime
        # hard-aborts (out-of-memory) instead of letting the test see NULL.
        # The required tests-and-quality-gates lane sets the same env.
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: allocator_may_return_null=1
        run: >-
          python3 scripts/ci/run_meson_test.py -- -C build-tsan
          --print-errorlogs --timeout-multiplier 3

  clang-tidy-full:
    name: Full clang-tidy scan
    runs-on: ubuntu-26.04
    # Measured max 21.1m (2026-10-23); 60 min unchanged (step caps 20 + 1.25x 21.1m = 47 <= 60).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore apt archives
        id: apt-cache
        # Restore-only; the save below runs only after a successful install.
        # Caches downloaded .deb archives so a slow package mirror does not eat
        # into the apt step's timeout. Keyed on runner OS, arch, job, and the
        # hash of the job's apt package list under .github/apt/clang-tidy-full.txt.
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-clang-tidy-full-${{ hashFiles('.github/apt/clang-tidy-full.txt') }}

      - name: Install dependencies
        id: apt-install
        # llvm.sh steps measured max 5.7m over the jobs that run it (2026-10-23; a
        # Tidy Ratchet run passed 5.2m); 10 min is at least 1.25x the slowest.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          # Keep this toolchain identical to the required CPU tidy-ratchet
          # lane. Ubuntu runner images do not all publish gcc-15 directly.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/clang-tidy-full.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'

      - name: Save apt archives
        # Saves only after the install step succeeded: an install cut off by its
        # timeout leaves the archive directory empty, and an empty entry under
        # this immutable key would be restored as a hit on every later run.
        # Runs even when a later step fails, so the next run skips the download.
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-clang-tidy-full-${{ hashFiles('.github/apt/clang-tidy-full.txt') }}

      - name: Build the cpu lane (compile_commands.json + generated headers)
        # The lane's one definition is the Makefile's (ADR-1471), which the
        # required Tidy Ratchet job and scripts/dev/tidy-lane.sh run too.
        run: make tidy-ratchet-build LANE=cpu TIDY_RATCHET_BUILD_DIR=build TIDY_RATCHET_JOBS="$(nproc)"
      - name: Whole-tree clang-tidy ratchet (ADR-1142, cpu lane, fails on drift)
        run: |
          make tidy-ratchet LANE=cpu TIDY_RATCHET_BUILD_DIR=build \
            CLANG_TIDY_BIN=/usr/bin/clang-tidy-22 \
            TIDY_RATCHET_ARGS="--jobs $(nproc) --report clang-tidy-full.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        with:
          name: clang-tidy-full-report
          path: clang-tidy-full.log
      - name: Upload artifact (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: clang-tidy-full-report
          path: clang-tidy-full.log

  clang-tidy-lanes:
    name: Tidy lane sweep (${{ matrix.lane }})
    # Q-315 / ADR-2796: the nightly full sweep of the device and cross lanes on
    # master, the counterpart of the path-scoped required legs of the Lint
    # workflow (`Tidy Lane (<lane>)`). Unscoped: every lane, every night, so a
    # change the per-pull-request routing cannot see (a shared header, a
    # toolchain bump in the pinned dev container) still shows up. The cpu lane
    # is `clang-tidy-full` above, the metal lane is tidy-metal.yml.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        lane: [cuda, hip, sycl, arm64, clang, integrations, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Measure the lane against its baseline
        uses: ./.github/actions/tidy-lane
        with:
          lane: ${{ matrix.lane }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload measurement and log
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tidy-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/tidy-lane
          if-no-files-found: ignore
      - name: Upload measurement and log (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: tidy-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/tidy-lane
          if-no-files-found: ignore

  tidy-drift:
    name: Report tidy drift
    needs: [clang-tidy-full, clang-tidy-lanes]
    if: always() && (needs.clang-tidy-full.result == 'failure' || needs.clang-tidy-lanes.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the tidy-drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tidy-drift-issue.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"

  netflix-benchmark:
    name: Netflix benchmark suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: bash scripts/setup/ubuntu.sh
      - name: Build
        run: |
          cd core
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup ../build -Denable_cuda=false -Denable_sycl=false --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          ninja -C ../build
      - name: Run benchmark
        env:
          VMAF_BIN: ${{ github.workspace }}/build/tools/vmaf
        run: bash testdata/bench_all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        with:
          name: nightly-benchmark-results
          path: testdata/netflix_benchmark_results.json
      - name: Upload artifact (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: nightly-benchmark-results
          path: testdata/netflix_benchmark_results.json
