# Design notes for this workflow: docs/development/ci-workflow-notes/lint-and-format.md

name: Lint
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 (design notes)
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tier:
    name: CI tier (Lint)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  pre-commit:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Pre-Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Resolve exact Pelorus vendor pin
        id: pelorus-vendor
        shell: bash
        run: |
          pin="$(sed -nE 's/^PELORUS_VENDOR_SHA="([0-9a-f]{40})"$/\1/p' \
            scripts/sync-pelorus-interop.sh)"
          if [[ ! "${pin}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::scripts/sync-pelorus-interop.sh must declare one full Git SHA" >&2
            exit 1
          fi
          echo "sha=${pin}" >> "${GITHUB_OUTPUT}"
      - name: Check out exact Pelorus source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: VMAFx/pelorus
          ref: ${{ steps.pelorus-vendor.outputs.sha }}
          path: .ci/pelorus
          persist-credentials: false
      - name: Verify Pelorus mirror and shared conformance fixture
        run: scripts/sync-pelorus-interop.sh "${GITHUB_WORKSPACE}/.ci/pelorus"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: MSVC-hostile constructs in the changed files
        # ADR-2169, ADR-3279 (design notes)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            pull_request) base="origin/${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="HEAD~1" ;;
          esac
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="HEAD~1"
          fi
          PREFLIGHT_BASE="${base}" bash scripts/dev/preflight.sh --stage msvcism
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py3.14-
      - name: Install pre-commit
        run: python -m pip install --require-hashes -r requirements/locks/pre-commit.txt
      - name: Install jsonschema
        run: python -m pip install --require-hashes -r requirements/locks/jsonschema.txt
      - name: Name the hooks that only run tooling tests
        # ADR-1568 (design notes)
        id: test-hooks
        run: |
          ids="$(python scripts/ci/suite_registry.py precommit-skip)"
          echo "ids=${ids}" >> "${GITHUB_OUTPUT}"
      - name: Run pre-commit on the diff (pull request) or the whole tree
        # ADR-1140, ADR-1568, ADR-1699, ADR-2784 (design notes)
        env:
          SKIP: ffmpeg-patches-apply-check,ffmpeg-input-contract,check-licence-metadata,reuse-lint,${{ steps.test-hooks.outputs.ids }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/precommit_scope.py --event "${EVENT}" --base-sha "${BASE_SHA}"

  clang-tidy:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Tidy Changed
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect C/C++ changes (early skip)
        id: cpp-changes
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" -- '*.c' '*.h' '*.cpp' '*.hpp')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                  -- '*.c' '*.h' '*.cpp' '*.hpp')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp')
            fi
          else
            files="full-tree-scan"  # workflow_dispatch — never skip
          fi
          if [ -z "$files" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No C/C++ deltas — skipping clang-tidy install + build"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore apt archives
        id: apt-cache
        if: steps.cpp-changes.outputs.any == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-changed-${{ hashFiles('.github/apt/tidy-changed.txt') }}

      - name: Install deps
        id: apt-install
        if: steps.cpp-changes.outputs.any == 'true'
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          # ADR-0692, ADR-1230 (design notes)
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          # ADR-0692 (design notes)
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/tidy-changed.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'

      - name: Save apt archives
        if: steps.cpp-changes.outputs.any == 'true' && !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-changed-${{ hashFiles('.github/apt/tidy-changed.txt') }}
      - name: Generate compile_commands.json
        if: steps.cpp-changes.outputs.any == 'true'
        run: |
          # -Db_lto=false: the project default carries b_lto_threads=4
          # (ADR-1172), which meson renders as GCC's -flto=4. gcc accepts it;
          # clang does not ("unsupported argument '4' to option '-flto='"), so
          # clang-tidy — which parses these very compile_commands with clang —
          # errored on EVERY translation unit and this gate failed on every
          # C/C++ PR. This build exists only to produce compile_commands.json
          # and the generated headers, so LTO buys nothing here. The SYCL tidy
          # lane below already configures with -Db_lto=false for its own
          # toolchain reason.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          CC=gcc-15 CXX=g++-15 meson setup build core \
            -Denable_cuda=false -Denable_sycl=false -Db_lto=false \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build
          python3 scripts/ci/gen-mex-compile-commands.py build
      - name: Run clang-tidy on changed files
        if: steps.cpp-changes.outputs.any == 'true'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # ADR-0209, ADR-0239, ADR-1113, ADR-1283 (design notes)
          exclude_untidyable() {
            grep -v \
              -e '^core/src/feature/arm64/' \
              -e '^core/src/metal/objc_handle\.h$' \
              -e '^core/src/feature/ff_math\.h$' \
              -e '^core/src/feature/ciede_ff_math\.h$' \
              -e '^core/src/cuda/' \
              -e '^core/src/feature/cuda/' \
              -e '^core/test/test_cuda_' \
              -e '^core/test/test_gpu_picture_pool\.c$' \
              -e '^core/test/test_adm_small_border\.c$' \
              -e '^core/test/test_adm_wide_rounding\.c$' \
              -e '^core/test/tiny_ai_test_template\.h$' \
              -e '^core/test/vmafx_fixture_util\.h$' \
              -e '^core/src/sycl/' \
              -e '^core/src/feature/sycl/' \
              -e '^core/test/test_sycl' \
              -e '^core/test/test_integer_cambi_sycl\.c$' \
              -e '^core/tools/vmaf_vpl\.c$' \
              -e '^core/src/mcp/' \
              -e '^core/test/test_mcp' \
              -e '^core/src/hip/' \
              -e '^core/src/feature/hip/' \
              -e '^core/test/test_hip' \
              -e '^core/test/fuzz/' \
              -e '^core/src/compat/win32/' \
              -e '^core/tools/test/test_vmaf_windows_utf8_argv\.cpp$' \
              -e '^cmd/vmafx-node/bpf/' \
              -e '^\.config/hiss/testdata/' |
              python3 scripts/ci/pelorus_mirror.py filter
          }
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" \
              -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                  -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
            fi
          else
            files=$(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' \
              | grep -v '^subprojects/' \
              | exclude_untidyable \
              | tr '\n' ' ')
          fi
          [ -z "$files" ] && { echo "no C/C++ changes"; exit 0; }
          routed=$(echo "$files" | tr ' ' '\n' | grep -v '^$' \
            | python3 scripts/ci/tidy_changed_route.py changed --db build/compile_commands.json) \
            || exit 1
          [ -z "$routed" ] && { echo "no changed C/C++ file is linted by this job"; exit 0; }
          echo "$routed" \
            | parallel -j"$(nproc)" "/usr/bin/clang-tidy-22 -p build --quiet {} || touch /tmp/tidy.fail"
          [ -f /tmp/tidy.fail ] && exit 1 || exit 0
  clang-tidy-ratchet:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1142: whole-tree clang-tidy debt ratchet. Measures EVERY translation
    # unit of the CPU build with scripts/ci/tidy-ratchet.py (diagnostics
    # deduplicated by path/line/column/check, plus NOLINTs without an inline
    # ADR citation) and compares per file against the committed baseline
    # scripts/ci/tidy-baseline-cpu.json. Any file above its baseline fails;
    # a file below it fails too until the baseline is tightened in the same
    # PR (`python3 scripts/ci/tidy-ratchet.py --write`); a TU clang-tidy
    # cannot compile fails closed. Aggregator-required (ADR-0313 list).
    # GPU lanes (cuda/sycl/hip) run in nightly.yml until hosted toolchains
    # exist — see docs/development/ci.md "Whole-tree lint ratchet".
    # Always starts (required context); real work is gated on the ADR-1140
    # impact planner's `c_core` selector like every other required job.
    # required-aggregator
    name: Tidy Ratchet
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Tidy Ratchet skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Tidy Ratchet satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-ratchet-${{ hashFiles('.github/apt/tidy-ratchet.txt') }}

      - name: Install deps
        id: apt-install
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          # ADR-1230 (design notes)
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/tidy-ratchet.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'

      - name: Save apt archives
        if: steps.impact.outputs.c_core == 'true' && !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-ratchet-${{ hashFiles('.github/apt/tidy-ratchet.txt') }}
      - name: Build (compile_commands.json + generated headers)
        if: steps.impact.outputs.c_core == 'true'
        run: |
          # ADR-1471 (design notes)
          make tidy-ratchet-build LANE=cpu \
            TIDY_RATCHET_BUILD_DIR="$RUNNER_TEMP/vmafx-tidy-cpu" TIDY_RATCHET_JOBS="$(nproc)"
      - name: Ratchet — whole-tree clang-tidy vs committed baseline
        if: steps.impact.outputs.c_core == 'true'
        run: |
          make tidy-ratchet LANE=cpu TIDY_RATCHET_BUILD_DIR="$RUNNER_TEMP/vmafx-tidy-cpu" \
            CLANG_TIDY_BIN=/usr/bin/clang-tidy-22 \
            TIDY_RATCHET_ARGS="--jobs $(nproc) --report tidy-ratchet-cpu.json"
      - name: Upload measurement (commit it as the new baseline when the ratchet asks)
        if: ${{ ((always()) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tidy-ratchet-cpu
          path: tidy-ratchet-cpu.json
      - name: Upload measurement (commit it as the new baseline when the ratchet asks) (Gitea)
        if: ${{ ((always()) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: tidy-ratchet-cpu
          path: tidy-ratchet-cpu.json


  clang-tidy-lanes:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # Q-315 / ADR-2796: every clang-tidy ratchet lane is a hosted, required
    # check, each routed by its own selector (tidy_<lane> in
    # .github/ci-impact.json, "own_paths_only", ADR-1700): the leg always
    # starts, so the context always reports, and it measures the lane only when
    # a file of that lane changed. The cpu lane is `Tidy Ratchet` above; metal
    # is `Tidy Metal` (tidy-metal.yml, a macOS runner). A leg that did not run
    # prints why and the lane it skipped: a skipped lane is never reported as
    # clean (HISS-18). The toolchains (nvcc, hipcc, icpx, the aarch64 cross
    # compiler, the GStreamer and FFmpeg build dependencies of the integrations
    # lane, #2860; the rust lane installs the pinned Rust toolchain, #2880) come from the dev container, pinned by digest in
    # .github/actions/tidy-lane/action.yml; bump the digest in the pull request
    # that re-measures the baselines after a dev/Containerfile change
    # (docs/development/tidy-ratchet.md, "Hosted lanes").
    # required-aggregator: Tidy Lane (cuda)
    # required-aggregator: Tidy Lane (hip)
    # required-aggregator: Tidy Lane (sycl)
    # required-aggregator: Tidy Lane (arm64)
    # required-aggregator: Tidy Lane (clang)
    # required-aggregator: Tidy Lane (integrations)
    # required-aggregator: Tidy Lane (rust)
    name: Tidy Lane (${{ matrix.lane }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        lane: [cuda, hip, sycl, arm64, clang, integrations, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — lane skipped by plan
        if: steps.impact.outputs[format('tidy_{0}', matrix.lane)] != 'true'
        env:
          LANE: ${{ matrix.lane }}
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: |
          echo "::notice::tidy_$LANE not impacted (mode=$MODE reason=$REASON) — the $LANE lane was NOT measured; its baseline is checked by the nightly sweep (ADR-2796)"
      - name: Measure the lane against its baseline
        if: steps.impact.outputs[format('tidy_{0}', matrix.lane)] == 'true'
        uses: ./.github/actions/tidy-lane
        with:
          lane: ${{ matrix.lane }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload measurement and log
        if: ${{ (always() && steps.impact.outputs[format('tidy_{0}', matrix.lane)] == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tidy-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/tidy-lane
          if-no-files-found: ignore
      - name: Upload measurement and log (Gitea)
        if: ${{ (always() && steps.impact.outputs[format('tidy_{0}', matrix.lane)] == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: tidy-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/tidy-lane
          if-no-files-found: ignore

  gstreamer-element:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-3390 (#2474): the vmafx element built on this commit's library, its
    # installed properties held to core/api/vmafx.toml and its scores to the CLI.
    # The job always starts, so the context always reports; the planner decides
    # whether it builds. GST_VMAFX_STRICT turns a missing fixture or gi module
    # into a failure: a test that skipped here would report a gate that did not run.
    # required-aggregator
    name: GStreamer Element
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — element not built
        if: steps.impact.outputs.gstreamer_element != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: |
          echo "::notice::gstreamer_element not impacted (mode=$MODE reason=$REASON) — the element was NOT built or tested on this commit"
      - name: Setup python
        if: steps.impact.outputs.gstreamer_element == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.9
      - name: Install meson and ninja
        if: steps.impact.outputs.gstreamer_element == 'true'
        run: python -m pip install --require-hashes -r requirements/locks/build.txt
      - name: Install system dependencies
        if: steps.impact.outputs.gstreamer_element == 'true'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install --no-install-recommends \
            nasm xxd pkg-config libglib2.0-dev locales \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            gstreamer1.0-gl libegl-mesa0 libgl1-mesa-dri \
            python3-gi gir1.2-gstreamer-1.0
          # The decimal-comma tests pass trivially when the locale is absent.
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -qix 'de_DE.utf8'
      - name: Fetch the test pairs
        if: steps.impact.outputs.gstreamer_element == 'true'
        run: >-
          bash scripts/test/fetch-test-yuvs.sh
          src01_hrc00_576x324.yuv src01_hrc01_576x324.yuv
          checkerboard_1920_1080_10_3_0_0.yuv checkerboard_1920_1080_10_3_1_0.yuv
          checkerboard_1920_1080_10_3_10_0.yuv
      - name: Build libvmafx
        if: steps.impact.outputs.gstreamer_element == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-cpu core --buildtype release \
            -Denable_dnn=disabled -Db_lto=false -Denable_cuda=false \
            -Denable_sycl=false -Denable_hip=false -Denable_metal=disabled \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
          ninja -C build-cpu -j"$(nproc)"
      # The system interpreter: python3-gi is built for it, not for setup-python's.
      - name: Build the element and run its tests
        if: steps.impact.outputs.gstreamer_element == 'true'
        env:
          GST_VMAFX_STRICT: "1"
          GST_VMAFX_PYTHON: /usr/bin/python3
          GST_VMAFX_JOBS: "4"
          # glupload needs a GL context; the runner has no display, Mesa renders in software.
          EGL_PLATFORM: surfaceless
          GST_GL_PLATFORM: egl
          GST_GL_WINDOW: surfaceless
        run: gstreamer/test/run.sh "$PWD/build-cpu"

  clang-tidy-sycl:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # T7-13(b) / T-SYCL-CLANG-TIDY-DISABLED — icpx-aware clang-tidy lane for
    # SYCL TUs that the main `clang-tidy` job above explicitly excludes (no
    # SYCL TUs in the CPU-only compile_commands.json).
    #
    # The two-step approach that unblocks stock LLVM clang-tidy:
    #  1. scripts/ci/gen-sycl-compile-commands.py parses build.ninja and
    #     synthesises compile_commands.json entries for the SYCL .cpp files
    #     that meson compiles via CUSTOM_COMMAND (icpx -fsycl). The script
    #     replaces icpx with clang++ and drops -fsycl so the entry is
    #     consumable by stock clang-tidy.
    #  2. scripts/ci/clang-tidy-sycl.sh injects -isystem<sycl/sycl.hpp path>
    #     + -extra-arg-before=-std=c++20 + -Wno-unknown-warning-option
    #     + -Wno-unknown-pragmas.
    #
    # ADR-0217 made this lane advisory "until one green master run confirms
    # the wrapper holds across all current SYCL TUs; gate tightens after that".
    # The condition was met and then some: the last six Lint runs on master
    # (2026-09-19T21:20Z through 2026-09-20T15:26Z) all report this job
    # `success`. ADR-1297 tightens the gate — the job is in
    # required-aggregator.yml, `continue-on-error` is gone, and the check name
    # lost its "(advisory)" suffix because it no longer describes the job.
    # ADR-1142 leaves no tier in which SYCL translation units are exempt from
    # clang-tidy. See ADR-0217 for the wrapper design and alternatives matrix.
    # required-aggregator
    name: Tidy SYCL
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed SYCL files
        id: detect
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${GH_BASE_REF}...HEAD" \
              -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' 'core/src/sycl/*.h' \
                 'core/src/feature/sycl/*.cpp' \
                 'core/src/feature/sycl/*.hpp' 'core/src/feature/sycl/*.h' \
                 'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
                 'core/test/test_integer_cambi_sycl.c' \
                 'core/src/sycl/*.c' 'core/test/test_vmafx_import_sycl*.c' \
              | tr '\n' ' ')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$GH_EVENT_BEFORE"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                  -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' 'core/src/sycl/*.h' \
                     'core/src/feature/sycl/*.cpp' \
                     'core/src/feature/sycl/*.hpp' 'core/src/feature/sycl/*.h' \
                     'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
                     'core/test/test_integer_cambi_sycl.c' \
                     'core/src/sycl/*.c' 'core/test/test_vmafx_import_sycl*.c' \
                  | tr '\n' ' ')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' 'core/src/sycl/*.h' \
                   'core/src/feature/sycl/*.cpp' \
                   'core/src/feature/sycl/*.hpp' 'core/src/feature/sycl/*.h' \
                   'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
                   'core/test/test_integer_cambi_sycl.c' \
                   'core/src/sycl/*.c' 'core/test/test_vmafx_import_sycl*.c' \
                | tr '\n' ' ')
            fi
          else
            files=$(git ls-files \
              'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' 'core/src/sycl/*.h' \
              'core/src/feature/sycl/*.cpp' \
              'core/src/feature/sycl/*.hpp' 'core/src/feature/sycl/*.h' \
              'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
              'core/test/test_integer_cambi_sycl.c' \
              'core/src/sycl/*.c' 'core/test/test_vmafx_import_sycl*.c' \
              | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no SYCL files changed — skipping job body"
          fi
      - name: Restore apt archives
        id: apt-cache
        if: steps.detect.outputs.files != ''
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-sycl-${{ hashFiles('.github/apt/tidy-sycl.txt') }}

      - name: Install oneAPI DPC++ compiler + clang-tidy
        id: apt-install
        if: steps.detect.outputs.files != ''
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          wget -qO- \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] \
            https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/tidy-sycl.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'

      - name: Save apt archives
        if: steps.detect.outputs.files != '' && !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tidy-sycl-${{ hashFiles('.github/apt/tidy-sycl.txt') }}
      - name: Generate SYCL compile_commands.json
        if: steps.detect.outputs.files != ''
        run: |
          set +u
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          set -u
          # -Db_lto=false: core/meson.build sets b_lto=true as a project
          # default_option, so the link step runs LTO through the stock
          # ubuntu-24.04 binutils gold plugin (LLVM 17.0.6). That plugin
          # cannot read bitcode emitted by oneAPI DPC++, and every test
          # binary dies with "LLVM gold plugin has failed to create LTO
          # module: Unknown attribute kind (102)". The SYCL legs of
          # libvmaf-build-matrix.yml disable LTO for exactly this reason.
          # This job only needs codegen outputs and compile_commands.json,
          # so it has nothing to gain from LTO anyway.
          # -Dsycl_icpx_aot_targets=: nothing here compiles device code, and
          # gen-sycl-compile-commands.py strips the AOT flags for clang-tidy,
          # so the job does not need the ocloc that AOT configure requires
          # (ADR-1360).
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          CC=icx CXX=icpx meson setup build-sycl core \
            -Denable_sycl=true -Denable_cuda=false -Db_lto=false \
            -Dsycl_icpx_aot_targets= \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
          ninja -C build-sycl include/vcs_version.h
          python3 scripts/ci/write-compile-commands.py --build-dir build-sycl
          python3 scripts/ci/gen-sycl-compile-commands.py build-sycl
      - name: Run clang-tidy-sycl wrapper on changed files
        if: steps.detect.outputs.files != ''
        env:
          SYCL_FILES: ${{ steps.detect.outputs.files }}
        run: |
          set +u
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          set -u
          routed=$(echo "$SYCL_FILES" | tr ' ' '\n' | grep -v '^$' \
            | python3 scripts/ci/tidy_changed_route.py sycl --db build-sycl/compile_commands.json) \
            || exit 1
          echo "$routed" | grep -v '^$' \
            | parallel -j"$(nproc)" \
                "CLANG_TIDY_BIN=/usr/bin/clang-tidy-22 scripts/ci/clang-tidy-sycl.sh -p build-sycl --quiet {} \
                  || touch /tmp/tidy-sycl.fail"
          [ -f /tmp/tidy-sycl.fail ] && exit 1 || exit 0

  cppcheck:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Cppcheck
    # ADR-0359, ADR-3286 (design notes)
    runs-on: ${{ vars.ARC_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runners' || 'ubuntu-26.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Cppcheck (Whole Project) skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Cppcheck (Whole Project) satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-cppcheck-${{ hashFiles('.github/apt/cppcheck.txt') }}

      - name: Install
        id: apt-install
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/cppcheck.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        if: steps.impact.outputs.c_core == 'true' && !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-cppcheck-${{ hashFiles('.github/apt/cppcheck.txt') }}
      - name: Generate compile_commands
        if: steps.impact.outputs.c_core == 'true'
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build core -Denable_cuda=false -Denable_sycl=false \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build --arguments
      - name: Run cppcheck
        if: steps.impact.outputs.c_core == 'true'
        run: |
          python3 scripts/ci/write_cppcheck_posix_model.py \
            --cppcheck cppcheck --output build/cppcheck-posix-vmafx.cfg
          cppcheck --enable=warning,performance,portability \
            --check-level=exhaustive \
            --inline-suppr \
            --library=build/cppcheck-posix-vmafx.cfg \
            --library=scripts/ci/cppcheck-public-entrypoints.cfg \
            --suppressions-list=.cppcheck-suppressions.txt \
            --project=build/compile_commands.json \
            --error-exitcode=1 \
            --xml --output-file=cppcheck-report.xml 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ ((always()) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS != 'true' }}
        with:
          name: cppcheck-report
          path: cppcheck-report.xml
      - name: Upload artifact (Gitea)
        if: ${{ ((always()) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: cppcheck-report
          path: cppcheck-report.xml

  python-lint:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # T7-CI-DEDUP — mypy-only. Ruff/Black already run in the
    # `pre-commit` job above (over `--all-files`), so duplicating them
    # here just doubled the maintenance surface (two pip-pin sources of
    # truth) without catching anything new. Mypy uses the same merge-base
    # delta gate as pre-push: branch-owned findings block while inherited
    # debt stays visible without making unrelated changes unmergeable.
    # Job display name kept verbatim so branch-protection's required-
    # status-checks list doesn't need an admin update in lockstep with
    # this dedup. Body is mypy-only per T7-CI-DEDUP; the rename to
    # "Python Lint (mypy)" lands separately together with the
    # branch-protection change.
    # required-aggregator
    name: Python Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install mypy checker
        run: pip install --require-hashes -r requirements/locks/mypy.txt
      - name: Run merge-base mypy gate
        env:
          VMAFX_MYPY_BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/master' }}
        run: python3 scripts/git-hooks/pre-push-mypy.py

  registry-validate:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # T6-9 / ADR-0209 — schema + cross-file consistency check on
    # model/tiny/registry.json. Runs jsonschema (Draft 2020-12) when
    # available, plus cross-file invariants (sha256 matches, sidecars
    # exist). Fails closed. Required since ADR-1297: it validates shipped
    # model artifacts, and a fail-closed validator nothing blocks on is not
    # fail-closed.
    # required-aggregator
    name: Tiny-Model Registry Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install jsonschema
        run: pip install --require-hashes -r requirements/locks/jsonschema.txt
      - name: Validate model/tiny/registry.json
        run: python3 ai/scripts/validate_model_registry.py

  docs-lint:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # Cheap generator contracts and freshness plus the installed docs toolchain
    # keep both source-owned metadata and rendered documentation required.
    # required-aggregator
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # ADR-2197 (design notes)
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install the documentation checks' imports
        # ADR-2485 (design notes)
        run: pip install --require-hashes -r requirements/locks/docs-check.txt
      - name: Check generated documentation freshness
        run: make docs-fragments-check
      - name: Check the rendered changelog, ADR index and rebase notes (master push)
        # ADR-2197, ADR-3295 (design notes)
        if: github.event_name == 'push'
        run: python3 scripts/ci/check_render_on_master.py
      - name: Install MkDocs Material
        run: |
          pip install --require-hashes -r requirements/locks/package-build.txt
          pip install --no-build-isolation --require-hashes -r docs/requirements-lock.txt
      - name: Check documentation charts against a fresh render
        # ADR-1508 (design notes)
        run: python3 scripts/docs/generate-charts.py --check --require-render
      - name: Build docs (strict — fail on any warning)
        run: mkdocs build --strict
      - name: Check the search index covers user pages only (ADR-1512)
        # ADR-1568 (design notes)
        run: python3 scripts/docs/check_search_scope.py build-docs/site

  check-conflict-markers:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # Fast, pre-commit-independent gate that fails immediately if git conflict
    # markers (<<<<<<< / ======= / >>>>>>>) are found committed in any text
    # file. This is intentionally redundant with pre-commit's check-merge-conflict
    # hook — the hook only fires on local `git commit`, whereas this step fires
    # on every push and PR, catching markers that sneak in via direct pushes,
    # GitHub UI merges, or --no-verify bypasses.
    # Excludes: binary extensions, LICENSES/ vendored texts, and the
    # .pre-commit-config.yaml itself (which references hook IDs that contain
    # the string "conflict").
    # Required since ADR-1297: catching a marker that bypassed the local hook
    # is the job's entire purpose, and a check that cannot block a merge
    # cannot do it.
    # required-aggregator
    name: No Conflict Markers
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if conflict markers are committed
        run: |
          set +e
          hits=$(git grep -In --untracked=false \
            -e '^<<<<<<< ' -e '^=======$' -e '^>>>>>>> ' \
            -- \
            ':(exclude)LICENSES/**' \
            ':(exclude)*.yuv' ':(exclude)*.pkl' ':(exclude)*.onnx' \
            ':(exclude)*.bin' ':(exclude)*.mexa64' ':(exclude)*.mexw64' \
            ':(exclude)*.mexmaci64' ':(exclude)*.npy' \
            ':(exclude)*.so' ':(exclude)*.a' ':(exclude)*.dylib' \
            ':(exclude)*.dll' ':(exclude)*.onnx.data' \
            2>/dev/null)
          if [ -n "$hits" ]; then
            echo "::error::Committed conflict markers found — resolve before merging:"
            echo "$hits"
            exit 1
          fi
          echo "No conflict markers found."

  twin-drift-check:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1135 — .c/.cpp twin-drift + stale-source-reference gate. Fails
    # when (a) either side of a same-directory .c/.cpp twin pair is compiled
    # by NO build file (dead twins drift: output.c vs output.cpp diverged
    # for three months), or (b) any meson.build / setup.py / *.pyx names a
    # source path that does not exist (the mem.c -> mem.cpp and dict.c ->
    # dict.cpp renames broke the Cython + libFuzzer builds for two months
    # because only nightly / opt-in lanes configure those files). Known
    # dead twins are listed WITH a reason each in
    # scripts/ci/twin-drift-allowlist.txt; the gate fails on stale rows.
    # Pure git + awk, no build. The job `name:` is a required check in
    # required-aggregator.yml — rename both in the same commit.
    # required-aggregator
    name: Twin Drift
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run twin-drift gate
        run: bash scripts/ci/twin-drift-check.sh

  licence-provenance:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1474 — every file's licence header against its provenance (ADR-1250).
    # scripts/dev/relicense_fork_files.py --check fails when a fork-authored
    # file arrives with another licence, when a file that reproduces upstream
    # code lacks that code's notice, or when a reviewed provenance entry names
    # a file that is gone. It was run by hand before, and master collected 41
    # pending files in two weeks.
    # The upstream tree it compares against is the Netflix/vmaf commit the
    # repository records as the head it is at parity with (one heading in
    # docs/development/known-upstream-bugs.md, read by
    # scripts/ci/upstream_parity_pin.py), not upstream's moving master: a file
    # Netflix adds must not turn this job red on an unrelated pull request.
    # Full history on both sides: the author veto reads every commit of a
    # candidate file, and the tool refuses a shallow checkout.
    # No path filter and no conditional skip: the job reports on every
    # eligible pull request and master push, so the aggregator lists it in
    # strictMustReport as well. The job `name:` is a required check in
    # required-aggregator.yml — rename both in the same commit.
    # required-aggregator
    name: Licence Provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      # ADR-1568, ADR-1699 (design notes)
      - name: Check the root licence files and package licence fields
        shell: bash
        run: |
          status=0
          python3 scripts/ci/check_licence_metadata.py || status=$?
          if [[ "${status}" -eq 1 ]]; then
            echo "::error::A root licence file or a package's licence field disagrees with the files (ADR-1250, ADR-1699). docs/licensing.md says what each package declares."
          elif [[ "${status}" -ne 0 ]]; then
            echo "::error::check_licence_metadata.py could not run (exit ${status}): a package configuration it does not model, or a git or file error, printed above."
          fi
          exit "${status}"
      - name: Fetch Netflix/vmaf with its full history
        run: git fetch --no-tags --quiet https://github.com/Netflix/vmaf.git master
      - name: Resolve the recorded upstream head
        id: upstream
        shell: bash
        run: |
          sha="$(python3 scripts/ci/upstream_parity_pin.py --within FETCH_HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
      - name: Check licence headers against provenance
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          status=0
          python3 scripts/dev/relicense_fork_files.py --check --upstream-ref "${UPSTREAM_SHA}" || status=$?
          if [[ "${status}" -eq 1 ]]; then
            echo "::error::A licence header disagrees with the file's provenance (ADR-1250, ADR-1474). The lines above name each file and what it needs; docs/development/licence-provenance-check.md says how to fix each kind."
          elif [[ "${status}" -ne 0 ]]; then
            echo "::error::relicense_fork_files.py could not run (exit ${status}): a git, history or provenance-data error, printed above."
          fi
          exit "${status}"

  buf:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-2350 (design notes)
    name: Buf Lint + Breaking
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the pinned buf
        shell: bash
        run: |
          version="$(sed -n 's/^BUF_VERSION="\([0-9.]*\)"$/\1/p' build-config.env)"
          if [[ -z "${version}" ]]; then
            echo "::error::build-config.env has no BUF_VERSION=\"X.Y.Z\" line."
            exit 1
          fi
          GOBIN="${RUNNER_TEMP}/buf-bin" go install "github.com/bufbuild/buf/cmd/buf@v${version}"
          echo "${RUNNER_TEMP}/buf-bin" >> "${GITHUB_PATH}"
      - name: buf lint
        run: buf lint
      - name: buf breaking against the base
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_REF}" || "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="refs/remotes/origin/master"
          fi
          buf breaking --against ".git#ref=${BASE_REF}"

  spectral:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-3331 (design notes)
    name: Spectral OpenAPI Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Spectral
        shell: bash
        run: |
          version="$(sed -n 's/^SPECTRAL_VERSION="\([0-9.]*\)"$/\1/p' build-config.env)"
          sha="$(sed -n 's/^SPECTRAL_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' build-config.env)"
          if [[ -z "${version}" || -z "${sha}" ]]; then
            echo "::error::build-config.env needs SPECTRAL_VERSION and SPECTRAL_SHA256."
            exit 1
          fi
          url="https://github.com/stoplightio/spectral/releases/download/v${version}/spectral-linux-x64"
          mkdir -p "${RUNNER_TEMP}/spectral"
          curl -fsSL --retry 3 --max-time 300 -o "${RUNNER_TEMP}/spectral/spectral" "${url}"
          echo "${sha}  ${RUNNER_TEMP}/spectral/spectral" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/spectral/spectral"
          echo "${RUNNER_TEMP}/spectral" >> "${GITHUB_PATH}"
      - name: Spectral OpenAPI lint
        shell: bash
        run: spectral lint --fail-severity=warn api/openapi/vmafx-server-v1.yaml

  shellcheck:
    needs: [tier, pre-commit]
    if: needs.tier.outputs.light == 'true'
    # T7-CI-DEDUP — body collapsed to a no-op proxy that depends on the
    # `pre-commit` job, which already runs `shellcheck-py v0.11.0.1` +
    # `pre-commit-shfmt v3.13.1-1` with the identical `-i 2 -ci`
    # settings over `--all-files`. The job name is kept verbatim so
    # branch-protection's required-status-checks list keeps validating
    # without an admin update in lockstep with this PR. The standalone
    # apt-install / shfmt-curl steps are dropped — pre-commit covers
    # the same surface in the same PR via the pinned hook revs.
    # required-aggregator
    name: ShellCheck + shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "shellcheck/shfmt covered by pre-commit job above; this is a no-op proxy."

  markdownlint:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-0866 — markdownlint-cli2 gate over the touched markdown delta.
    # Mirrors the clang-tidy job's PR/push/dispatch fan-out so the
    # ~6.2k pre-existing warnings (ADR-0864 tail) don't gate innocent
    # PRs. Reads .markdownlint.json from the repo root (PR #332's tuned
    # config). NO --fix: 7 default rules are unsafe under autofix per
    # ADR-0864.
    # Required since ADR-1297. Every PR in this repository ships documentation
    # (agent hard rules 7 and 9), so the documentation linter is a product
    # gate, not a courtesy. It lints the touched delta only, so the ~6.2k
    # pre-existing warnings still do not gate innocent PRs.
    # required-aggregator
    name: Markdown Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Detect changed markdown files
        id: detect
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -o pipefail
          keep() { grep "$@" || { rc=$?; [ "$rc" -eq 1 ] || return "$rc"; }; }
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" -- '*.md' \
              | keep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
              | keep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | keep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/|docs/rebase-notes\.d/)')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD -- '*.md' \
                  | keep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
                  | keep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | keep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/|docs/rebase-notes\.d/)')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD -- '*.md' \
                | keep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
                | keep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | keep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/|docs/rebase-notes\.d/)')
            fi
          else
            files=$(git ls-files \
              'docs/**/*.md' \
              'README.md' 'CLAUDE.md' 'AGENTS.md' \
              | keep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | keep -vE '^(docs/adr/README\.md|docs/adr/_index_fragments/|docs/rebase-notes\.d/)')
          fi
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no markdown changes — job will short-circuit"
          else
            echo "changed markdown files:"
            echo "$files"
          fi
      - name: Run markdownlint-cli2
        if: steps.detect.outputs.files != ''
        env:
          MD_FILES: ${{ steps.detect.outputs.files }}
        run: |
          # `npx --yes` resolves the package from the npm registry on first
          # run; subsequent runs hit the runner's npx cache. No project-
          # local package.json is needed.
          # shellcheck disable=SC2086
          echo "$MD_FILES" | xargs -r npx --yes markdownlint-cli2

  trivy:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-3330 (design notes)
    name: Trivy Config + FS
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned trivy
        shell: bash
        run: |
          version="$(sed -n 's/^TRIVY_VERSION="\([0-9.]*\)"$/\1/p' build-config.env)"
          expected_sha="$(sed -n 's/^TRIVY_SHA256="\([0-9a-f]*\)"$/\1/p' build-config.env)"
          if [[ -z "${version}" || -z "${expected_sha}" ]]; then
            echo "::error::build-config.env must define TRIVY_VERSION and TRIVY_SHA256."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tarball="trivy_${version}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${version}/${tarball}"
          curl -fsSL --retry 3 --max-time 300 -o "${RUNNER_TEMP}/${tarball}" "${url}"
          echo "${expected_sha}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
      - name: trivy config
        run: |
          trivy config --exit-code 1 --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL --skip-dirs .corpus,.workingdir,build .
      - name: trivy fs
        if: ${{ !cancelled() }}
        run: |
          trivy fs --scanners vuln,secret --exit-code 1 --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL --skip-dirs .corpus,.workingdir,build .
