# Static-analysis gate. Runs in parallel with the libvmaf Build Matrix so a
# lint failure doesn't block discovering build breakage and vice versa.

name: Lint
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 — `ready_for_review` lets the per-job draft gate fire
    # CI when a draft PR is promoted to ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Pre-Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Resolve LFS blobs (e.g. model/tiny/*.onnx) so pre-commit's final
          # "changes made by hooks" diff doesn't report pointer-vs-blob noise
          # against files no hook actually touched.
          lfs: true
          persist-credentials: false
      - name: Resolve exact Pelorus vendor pin
        id: pelorus-vendor
        shell: bash
        run: |
          pin="$(sed -nE 's/^PELORUS_VENDOR_SHA="([0-9a-f]{40})"$/\1/p' \
            scripts/sync-pelorus-interop.sh)"
          if [[ ! "${pin}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::scripts/sync-pelorus-interop.sh must declare one full Git SHA" >&2
            exit 1
          fi
          echo "sha=${pin}" >> "${GITHUB_OUTPUT}"
      - name: Check out exact Pelorus source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: VMAFx/pelorus
          ref: ${{ steps.pelorus-vendor.outputs.sha }}
          path: .ci/pelorus
          persist-credentials: false
      - name: Verify Pelorus mirror and shared conformance fixture
        run: scripts/sync-pelorus-interop.sh "${GITHUB_WORKSPACE}/.ci/pelorus"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.7"
      # pre-commit/action@v3.0.1 is the latest release (Feb 2024) and still
      # pins actions/cache@v4, which trips the Node.js 20 deprecation
      # warning (Node 20 removed from runners 2026-09-16). Inline the
      # three steps it would have run, using actions/cache@v5.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py3.14-
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Verify installed hook lifecycle and stage dispatch
        run: python3 scripts/githooks/tests/test_install.py
      - name: Run pre-commit on all files
        # The independent FFmpeg Patch Stack job owns network replay and
        # ADR-1140 routing; --all-files here would replay on docs-only PRs.
        env:
          SKIP: ffmpeg-patches-apply-check
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  clang-tidy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Tidy Changed
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need history for the push-delta diff on master. fetch-depth: 2
          # is enough for a squash-merge FF (one new commit), but use 0 to
          # tolerate multi-commit FF pushes without a second fetch step.
          fetch-depth: 0
          persist-credentials: false
      # Early file-delta probe — if the PR / push touches no C/C++ files,
      # short-circuit before the apt-install + meson-setup + meson-compile
      # steps (~5 min on a cold runner). Saves doc-only / Python-only PRs
      # from paying the heavy lint setup. The body of `Run clang-tidy on
      # changed files` does its own (more thorough, exclusion-aware) delta
      # later; this step only asks "is there anything plausible?".
      - name: Detect C/C++ changes (early skip)
        id: cpp-changes
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" -- '*.c' '*.h' '*.cpp' '*.hpp' || true)
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' 2>/dev/null || true)
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' || true)
            fi
          else
            files="full-tree-scan"  # workflow_dispatch — never skip
          fi
          if [ -z "$files" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No C/C++ deltas — skipping clang-tidy install + build"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install deps
        if: steps.cpp-changes.outputs.any == 'true'
        run: |
          sudo apt-get update
          # gcc from ubuntu-toolchain-r/test for the same reason clang comes
          # from apt.llvm.org and meson from PyPI: the ubuntu-24.04 image's
          # newest gcc is 14, and the tree targets C23 / C++26 (ADR-0692).
          # Leaving gcc at the distro version while pulling the other two
          # forward was an oversight, not a decision -- and it is not free.
          # gcc supplies the system headers clang-tidy parses, so the ratchet's
          # warning counts depend on it; pinning it a major behind every
          # developer's box makes a ratchet delta unreproducible locally, which
          # is exactly how ADR-1230 came about.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build nasm \
            jq parallel
          # clang-tidy from apt.llvm.org: the ubuntu-24.04 image tops out at
          # clang 18, whose libstdc++ has no std::expected, so it cannot even
          # parse core/src/dict.cpp since ADR-0692 moved the tree to C++26.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tidy-22
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --quiet meson
          # Invoke the versioned binary below. GitHub's Ubuntu image already
          # owns the unversioned alternatives group; adding another entry at
          # the same priority can leave `clang-tidy` resolving to v18, which
          # cannot parse the tree's C++26 `std::expected` use.
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'
      - name: Generate compile_commands.json
        if: steps.cpp-changes.outputs.any == 'true'
        run: |
          # -Db_lto=false: the project default carries b_lto_threads=4
          # (ADR-1172), which meson renders as GCC's -flto=4. gcc accepts it;
          # clang does not ("unsupported argument '4' to option '-flto='"), so
          # clang-tidy — which parses these very compile_commands with clang —
          # errored on EVERY translation unit and this gate failed on every
          # C/C++ PR. This build exists only to produce compile_commands.json
          # and the generated headers, so LTO buys nothing here. The SYCL tidy
          # lane below already configures with -Db_lto=false for its own
          # toolchain reason.
          CC=gcc-15 CXX=g++-15 meson setup build core \
            -Denable_cuda=false -Denable_sycl=false -Db_lto=false
          # Build first so codegen outputs (vcs_version.h, model JSONs → .c)
          # exist on disk before clang-tidy parses the translation units.
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build
      - name: Run clang-tidy on changed files
        if: steps.cpp-changes.outputs.any == 'true'
        # Hardening per Semgrep `yaml.github-actions.security.run-shell-injection`
        # (Research-0090, F2): pull every `${{ github.* }}` interpolation into
        # `env:` and reference the env var with double-quotes in shell. The
        # `before` SHA, `event_name` enum, and `base_ref` branch name are all
        # GitHub-controlled and currently safe, but the env-aliasing pattern
        # forecloses any future case where one of those values gains a shell
        # metacharacter and makes the data-flow explicit for maintainers.
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Collect the delta for both PR and push events so master-post-merge
          # doesn't re-scan every vendored .c/.cpp (e.g. core/src/svm.cpp)
          # and surface pre-existing warnings unrelated to the push.
          #
          # Excluded path families — the shared reason is that the compile
          # commands in `build/compile_commands.json` don't cover these TUs
          # (CPU-only + ARM-only build here), so clang-tidy parses them with
          # default flags and spurious `clang-diagnostic-error` output:
          #   - core/src/feature/arm64/ — NEON / SVE2, needs a cross
          #     toolchain. Measured by the ADR-1283 `arm64` ratchet lane:
          #     `meson setup build-arm64 core --cross-file
          #     build-aux/aarch64-linux-gnu.ini -Denable_cuda=false
          #     -Denable_sycl=false -Db_lto=false` then `make tidy-ratchet
          #     LANE=arm64 TIDY_RATCHET_BUILD_DIR=build-arm64`. Same posture
          #     as the CUDA / HIP families below: excluded here, bounded
          #     there.
          #   - core/src/cuda/ + core/src/feature/cuda/ — require
          #     `-Denable_cuda=true` meson setup to generate compile_commands
          #     (follow-up: add a parallel CUDA clang-tidy job once a
          #     self-hosted CUDA runner lands, backlog T7-3).
          #   - core/test/test_cuda_*.c + test_gpu_picture_pool.c — GPU-gated
          #     tests whose build entries only exist under the CUDA build.
          #     test_gpu_picture_pool.c is the renamed test_ring_buffer.c per
          #     ADR-0239 (still CUDA-only — it pulls in libvmaf_cuda.h).
          #   - core/src/sycl/ + core/src/feature/sycl/ +
          #     core/test/test_sycl* — require `-Denable_sycl=true` and
          #     the `icpx` compiler; no compile_commands in the CPU-only
          #     `build/`. Local lint runs against `core/build-sycl/`.
          #     core/test/test_integer_cambi_sycl.c is the one member of
          #     that family that does not carry the `test_sycl` prefix, so
          #     it needs its own line: it is `#if HAVE_SYCL`-gated like the
          #     rest, meson builds it only under `-Denable_sycl=true`, and
          #     without a compile command clang-tidy parses it with default
          #     flags and dies on `'config.h' file not found`
          #     (clang-diagnostic-error). Bounded by the ADR-1290 `sycl`
          #     ratchet lane, same posture as the rest of the family.
          #   - core/tools/vmaf_vpl.c — VAAPI integration; needs
          #     `va/va.h` from libva-dev plus the CUDA/SYCL link path; no
          #     compile_commands entry in the CPU-only build.
          #   - core/src/mcp/ + core/test/test_mcp_smoke.c —
          #     gated by `-Denable_mcp=true`; the CPU-only lint build
          #     has the umbrella flag off (ADR-0209 audit-first
          #     scaffold, T5-2). Local lint runs against a build
          #     configured with `-Denable_mcp=true -Denable_mcp_sse=true
          #     -Denable_mcp_uds=true -Denable_mcp_stdio=true`.
          # Local lint on these files runs against `core/build-cuda/`.
          # `--diff-filter=d` excludes Deleted entries — clang-tidy can't
          # lint a file that no longer exists on disk; without this filter
          # the script passes a missing path to clang-tidy and fails with
          # `clang-diagnostic-error: no such file or directory`.
          #   - cmd/vmafx-node/bpf/ — eBPF programs. They include `vmlinux.h`,
          #     which is generated from the running kernel's BTF and does not
          #     exist on the runner, so clang-tidy cannot parse them at all
          #     (`clang-diagnostic-error: 'vmlinux.h' file not found`). What it
          #     does report is an artefact of reading an eBPF object as ordinary
          #     C++: libbpf's `SEC()` macro identifiers, and programs and maps
          #     that must keep external linkage for the loader to find them.
          #     Same posture as the CUDA/SYCL/HIP families above.
          #   - Paths in scripts/ci/pelorus-mirror-paths.txt — vendored
          #     verbatim mirror of the Pelorus interop ABI (ADR-1113),
          #     byte-identical to its single source of truth; cannot absorb
          #     fork-local lint fixes without breaking the sync guard. The
          #     shared filter is exact-path based, so an unmanifested
          #     pelorus_*.cpp remains lint-owned. Fix upstream and re-sync.
          #   - core/test/test_adm_small_border.c +
          #     core/test/test_adm_wide_rounding.c — backend-neutral source
          #     names, but meson builds them only as test_cuda_adm_* and
          #     test_hip_adm_*, so the CPU build has no compile command for
          #     them. CI has no GPU tidy lane; lint them against a CUDA or HIP
          #     build with `make tidy-ratchet LANE=cuda` / `LANE=hip`.
          #   - .config/hiss/testdata/ — the HISS rule engine's own fixtures.
          #     Each rule ships a positive/negative/gap triple whose planted
          #     defect *is* the fixture: HISS-08's positive case calls `gets`
          #     and HISS-04's calls a 76-line function, so clang-tidy reports
          #     `use of undeclared identifier 'gets'` and
          #     `readability-function-size` by construction. meson builds none
          #     of them, so they have no compile command either and are parsed
          #     with a command inferred from an unrelated TU. Nothing in the
          #     shipped library is covered by linting them, and cleaning them
          #     would destroy the fixtures the gates in `standards-gate.yml`
          #     replay. `(^|/)testdata/` is already the tree-wide fixture
          #     exclusion in `.pre-commit-config.yaml`; this is the same rule
          #     applied to the changed-files tidy lane.
          #   - compat/python-vmaf/matlab/ — upstream Netflix training-harness
          #     MATLAB MEX sources. They include `mex.h` / `matrix.h` from the
          #     proprietary MATLAB SDK, which does not exist on the runner, so
          #     every one of them dies in the preprocessor
          #     (`'mex.h' file not found`) and the diagnostics that follow are
          #     artefacts of reading a `.c` file as C++ after the include
          #     failed, not findings about the code. Same posture as the
          #     CUDA/SYCL/HIP/eBPF families above, and the same exclusion these
          #     files already carry in every hygiene hook in
          #     `.pre-commit-config.yaml` (see the `check-copyright` entry).
          #     The whole-tree ratchet does not measure them either — they have
          #     no entry in `build/compile_commands.json`.
          #
          # One filter shared by every trigger path below, so adding a family
          # is a single edit.
          exclude_untidyable() {
            grep -v \
              -e '^core/src/feature/arm64/' \
              -e '^core/src/cuda/' \
              -e '^core/src/feature/cuda/' \
              -e '^core/test/test_cuda_' \
              -e '^core/test/test_gpu_picture_pool\.c$' \
              -e '^core/test/test_adm_small_border\.c$' \
              -e '^core/test/test_adm_wide_rounding\.c$' \
              -e '^core/test/tiny_ai_test_template\.h$' \
              -e '^core/src/sycl/' \
              -e '^core/src/feature/sycl/' \
              -e '^core/test/test_sycl' \
              -e '^core/test/test_integer_cambi_sycl\.c$' \
              -e '^core/tools/vmaf_vpl\.c$' \
              -e '^core/src/mcp/' \
              -e '^core/test/test_mcp' \
              -e '^core/src/hip/' \
              -e '^core/src/feature/hip/' \
              -e '^core/test/test_hip' \
              -e '^core/test/fuzz/' \
              -e '^core/src/compat/win32/' \
              -e '^cmd/vmafx-node/bpf/' \
              -e '^\.config/hiss/testdata/' \
              -e '^compat/python-vmaf/matlab/' |
              python3 scripts/ci/pelorus_mirror.py filter
          }
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" \
              -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              # Initial push / new branch: fall back to HEAD~1..HEAD if a
              # parent exists, otherwise skip (no meaningful delta).
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                  -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' \
              | exclude_untidyable \
              | tr '\n' ' ')
            fi
          else
            # workflow_dispatch and other triggers: scan full tree (slow
            # but deliberate — operator asked for it).
            files=$(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' \
              | grep -v '^subprojects/' \
              | exclude_untidyable \
              | tr '\n' ' ')
          fi
          [ -z "$files" ] && { echo "no C/C++ changes"; exit 0; }
          # Drop empty lines — the `tr '\n' ' ' | tr ' ' '\n'` round-trip
          # leaves a trailing blank that parallel would pass to clang-tidy
          # as an empty filename, which clang resolves to the workspace
          # directory and reports as a clang-diagnostic-error.
          echo "$files" | tr ' ' '\n' | grep -v '^$' \
            | parallel -j"$(nproc)" "/usr/bin/clang-tidy-22 -p build --quiet {} || touch /tmp/tidy.fail"
          [ -f /tmp/tidy.fail ] && exit 1 || exit 0
  clang-tidy-ratchet:
    # ADR-1142: whole-tree clang-tidy debt ratchet. Measures EVERY translation
    # unit of the CPU build with scripts/ci/tidy-ratchet.py (diagnostics
    # deduplicated by path/line/column/check, plus NOLINTs without an inline
    # ADR citation) and compares per file against the committed baseline
    # scripts/ci/tidy-baseline-cpu.json. Any file above its baseline fails;
    # a file below it fails too until the baseline is tightened in the same
    # PR (`python3 scripts/ci/tidy-ratchet.py --write`); a TU clang-tidy
    # cannot compile fails closed. Aggregator-required (ADR-0313 list).
    # GPU lanes (cuda/sycl/hip) run in nightly.yml until hosted toolchains
    # exist — see docs/development/ci.md "Whole-tree lint ratchet".
    # Always starts (required context); real work is gated on the ADR-1140
    # impact planner's `c_core` selector like every other required job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Tidy Ratchet
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the ratchet tooling
        # Runs on every PR, not only C ones: the tooling itself lives under
        # scripts/ci/, and the GPU lanes run it only on workstations.
        run: |
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_tidy_ratchet.py'
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_gen_gpu_compile_commands.py'
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The planner is fail-closed: .clang-tidy, scripts/ci/** (ratchet +
          # baselines) and this workflow are CI-authority inputs that force
          # mode=full, so a ratchet or baseline edit always runs the lane.
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Tidy Ratchet skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Tidy Ratchet satisfied without running (ADR-1140)"
      - name: Install deps
        if: steps.impact.outputs.c_core == 'true'
        run: |
          sudo apt-get update
          # See the ADR-1230 note on the changed-files lane above: gcc moves
          # forward with clang and meson rather than staying at the distro's.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build nasm jq
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tidy-22
          sudo pip3 install --break-system-packages --quiet meson
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'
      - name: Build (compile_commands.json + generated headers)
        if: steps.impact.outputs.c_core == 'true'
        run: |
          # -Db_lto=false: the project default carries b_lto_threads=4
          # (ADR-1172), which meson renders as GCC's -flto=4. gcc accepts it;
          # clang does not ("unsupported argument '4' to option '-flto='"), so
          # clang-tidy — which parses these very compile_commands with clang —
          # errored on EVERY translation unit and this gate failed on every
          # C/C++ PR. This build exists only to produce compile_commands.json
          # and the generated headers, so LTO buys nothing here. The SYCL tidy
          # lane below already configures with -Db_lto=false for its own
          # toolchain reason.
          CC=gcc-15 CXX=g++-15 meson setup build core \
            -Denable_cuda=false -Denable_sycl=false -Db_lto=false
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build
      - name: Ratchet — whole-tree clang-tidy vs committed baseline
        if: steps.impact.outputs.c_core == 'true'
        run: |
          python3 scripts/ci/tidy-ratchet.py --lane cpu --build-dir build \
            --clang-tidy /usr/bin/clang-tidy-22 --jobs "$(nproc)" \
            --report tidy-ratchet-cpu.json
      - name: Upload measurement (commit it as the new baseline when the ratchet asks)
        if: ${{ (always()) && steps.impact.outputs.c_core == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tidy-ratchet-cpu
          path: tidy-ratchet-cpu.json


  clang-tidy-sycl:
    # T7-13(b) / T-SYCL-CLANG-TIDY-DISABLED — icpx-aware clang-tidy lane for
    # SYCL TUs that the main `clang-tidy` job above explicitly excludes (no
    # SYCL TUs in the CPU-only compile_commands.json).
    #
    # The two-step approach that unblocks stock LLVM clang-tidy:
    #  1. scripts/ci/gen-sycl-compile-commands.py parses build.ninja and
    #     synthesises compile_commands.json entries for the SYCL .cpp files
    #     that meson compiles via CUSTOM_COMMAND (icpx -fsycl). The script
    #     replaces icpx with clang++ and drops -fsycl so the entry is
    #     consumable by stock clang-tidy.
    #  2. scripts/ci/clang-tidy-sycl.sh injects -isystem<sycl/sycl.hpp path>
    #     + -extra-arg-before=-std=c++20 + -Wno-unknown-warning-option
    #     + -Wno-unknown-pragmas.
    #
    # ADR-0217 made this lane advisory "until one green master run confirms
    # the wrapper holds across all current SYCL TUs; gate tightens after that".
    # The condition was met and then some: the last six Lint runs on master
    # (2026-09-19T21:20Z through 2026-09-20T15:26Z) all report this job
    # `success`. ADR-1297 tightens the gate — the job is in
    # required-aggregator.yml, `continue-on-error` is gone, and the check name
    # lost its "(advisory)" suffix because it no longer describes the job.
    # ADR-1142 leaves no tier in which SYCL translation units are exempt from
    # clang-tidy. See ADR-0217 for the wrapper design and alternatives matrix.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Tidy SYCL
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed SYCL files
        id: detect
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Mirrors the main clang-tidy job's PR/push/dispatch fan-out but
          # keeps only SYCL TUs (the inverse of the exclusion list there).
          # Context values are passed through env vars (not inline expressions)
          # to prevent shell injection (github-actions shell-injection rule).
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${GH_BASE_REF}...HEAD" \
              -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' \
                 'core/src/feature/sycl/*.cpp' \
                 'core/src/feature/sycl/*.hpp' \
                 'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
              | tr '\n' ' ')
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$GH_EVENT_BEFORE"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD \
                  -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' \
                     'core/src/feature/sycl/*.cpp' \
                     'core/src/feature/sycl/*.hpp' \
                     'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
                  | tr '\n' ' ')
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD \
                -- 'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' \
                   'core/src/feature/sycl/*.cpp' \
                   'core/src/feature/sycl/*.hpp' \
                   'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
                | tr '\n' ' ')
            fi
          else
            files=$(git ls-files \
              'core/src/sycl/*.cpp' 'core/src/sycl/*.hpp' \
              'core/src/feature/sycl/*.cpp' \
              'core/src/feature/sycl/*.hpp' \
              'core/test/test_sycl*.c' 'core/test/test_sycl*.cpp' \
              | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no SYCL files changed — skipping job body"
          fi
      - name: Install oneAPI DPC++ compiler + clang-tidy
        if: steps.detect.outputs.files != ''
        run: |
          # Minimal oneAPI install — only the DPC++/C++ compiler component.
          # The full base toolkit (~3 GiB) is unnecessary; we only need
          # <sycl/sycl.hpp> on disk for clang-tidy path resolution.
          wget -qO- \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] \
            https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          # libze-dev is the Level Zero loader *development* package.
          # core/src/meson.build calls cc.find_library('ze_loader'), which
          # emits a literal `-lze_loader`; ld resolves that against the
          # unversioned libze_loader.so symlink ONLY. The runtime SONAME
          # libze_loader.so.1 shipped by libze1 is invisible to -l, so
          # libze1 alone does NOT fix this — do not "simplify" it to libze1.
          # oneAPI does not supply the loader either: this step installs
          # intel-oneapi-compiler-dpcpp-cpp and sources setvars.sh before
          # meson setup, and -lze_loader still fails without libze-dev.
          # Package name is release-specific: `libze-dev` on 24.04 noble
          # (universe, already enabled); `level-zero-dev` does NOT exist there.
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp \
            libze-dev \
            ninja-build nasm jq parallel
          # clang-tidy-22 is NOT in the Ubuntu 24.04 archive — the image tops
          # out at clang-tidy-18 — so it has to come from apt.llvm.org, exactly
          # as the CPU `clang-tidy` and `clang-tidy-ratchet` jobs above already
          # do. Without this the apt install aborts with "Unable to locate
          # package clang-tidy-22" and this job can never execute.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tidy-22
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --quiet meson
          /usr/bin/clang-tidy-22 --version | grep -F 'LLVM version 22.'
      - name: Generate SYCL compile_commands.json
        if: steps.detect.outputs.files != ''
        run: |
          # Source oneAPI env and configure a SYCL build tree. icpx is the
          # required compiler under -Denable_sycl=true.
          set +u
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          set -u
          # -Db_lto=false: core/meson.build sets b_lto=true as a project
          # default_option, so the link step runs LTO through the stock
          # ubuntu-24.04 binutils gold plugin (LLVM 17.0.6). That plugin
          # cannot read bitcode emitted by oneAPI DPC++, and every test
          # binary dies with "LLVM gold plugin has failed to create LTO
          # module: Unknown attribute kind (102)". The SYCL legs of
          # libvmaf-build-matrix.yml disable LTO for exactly this reason.
          # This job only needs codegen outputs and compile_commands.json,
          # so it has nothing to gain from LTO anyway.
          CC=icx CXX=icpx meson setup build-sycl core \
            -Denable_sycl=true -Denable_cuda=false -Db_lto=false
          # Build only the generated version header so include/vcs_version.h
          # exists on disk before clang-tidy parses TUs, without compiling
          # untouched files across the whole tree.
          ninja -C build-sycl include/vcs_version.h
          # Meson 1.12 no longer writes the native database itself. Export
          # only C/C++ compiler rules before appending the custom SYCL TUs.
          python3 scripts/ci/write-compile-commands.py --build-dir build-sycl
          # Synthesise compile_commands.json entries for the SYCL .cpp TUs
          # that meson emits as CUSTOM_COMMAND rules (icpx -fsycl) rather
          # than standard cpp_COMPILER rules. Without these entries clang-tidy
          # falls back to default flags and cannot resolve project headers.
          python3 scripts/ci/gen-sycl-compile-commands.py build-sycl
      - name: Run clang-tidy-sycl wrapper on changed files
        if: steps.detect.outputs.files != ''
        # The file list is PR-controlled (file names), so it reaches the shell
        # through env, never as an inline expression (same rule as the detect
        # step above and the markdown job's MD_FILES).
        env:
          SYCL_FILES: ${{ steps.detect.outputs.files }}
        run: |
          set +u
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          set -u
          echo "$SYCL_FILES" | tr ' ' '\n' | grep -v '^$' \
            | parallel -j"$(nproc)" \
                "CLANG_TIDY_BIN=/usr/bin/clang-tidy-22 scripts/ci/clang-tidy-sycl.sh -p build-sycl --quiet {} \
                  || touch /tmp/tidy-sycl.fail"
          [ -f /tmp/tidy-sycl.fail ] && exit 1 || exit 0

  cppcheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Cppcheck
    # ADR-0359 — pilot job for the ARC self-hosted runner pool.
    # Variable `ARC_RUNNERS_ENABLED=true` flips this job to the in-cluster
    # `arc-runners` scale set; default `false` keeps GitHub-hosted. If the
    # ARC pool is degraded, flip the var off and re-trigger CI.
    runs-on: ${{ vars.ARC_RUNNERS_ENABLED == 'true' && 'arc-runners' || 'ubuntu-26.04' }}
    # Bumped 15→30 min on 2026-05-09: GitHub-hosted runner queue
    # saturation pushed Cppcheck past 15 min on ~all PRs and master.
    # Last green run on master took 5 min; the new ceiling absorbs
    # the slow-runner case without forcing a retry-loop on an already
    # saturated queue.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Cppcheck (Whole Project) skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Cppcheck (Whole Project) satisfied without running (ADR-1140)"
      - name: Install
        if: steps.impact.outputs.c_core == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck ninja-build nasm
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --quiet meson
      - name: Verify cppcheck model, depth and real defect controls
        if: steps.impact.outputs.c_core == 'true'
        run: python3 -m unittest discover -s scripts/ci/tests -p test_cppcheck_posix_model.py
      - name: Generate compile_commands
        if: steps.impact.outputs.c_core == 'true'
        run: |
          meson setup build core -Denable_cuda=false -Denable_sycl=false
          # Build first so codegen outputs (model JSONs → .c) exist on disk.
          # cppcheck parses compile_commands.json literally and errors on
          # any missing translation-unit file.
          meson compile -C build
          python3 scripts/ci/write-compile-commands.py --build-dir build
      - name: Run cppcheck
        if: steps.impact.outputs.c_core == 'true'
        run: |
          python3 scripts/ci/write_cppcheck_posix_model.py \
            --cppcheck cppcheck --output build/cppcheck-posix-vmafx.cfg
          cppcheck --enable=warning,performance,portability \
            --check-level=exhaustive \
            --inline-suppr \
            --library=build/cppcheck-posix-vmafx.cfg \
            --library=scripts/ci/cppcheck-public-entrypoints.cfg \
            --suppressions-list=.cppcheck-suppressions.txt \
            --project=build/compile_commands.json \
            --error-exitcode=1 \
            --xml --output-file=cppcheck-report.xml 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ (always()) && steps.impact.outputs.c_core == 'true' }}
        with:
          name: cppcheck-report
          path: cppcheck-report.xml

  python-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # T7-CI-DEDUP — mypy-only. Ruff/Black already run in the
    # `pre-commit` job above (over `--all-files`), so duplicating them
    # here just doubled the maintenance surface (two pip-pin sources of
    # truth) without catching anything new. mypy stays because no
    # pre-commit hook runs it; advisory exit because numpy/torch stubs
    # are gappy on first run.
    # Job display name kept verbatim so branch-protection's required-
    # status-checks list doesn't need an admin update in lockstep with
    # this dedup. Body is mypy-only per T7-CI-DEDUP; the rename to
    # "Python Lint (mypy)" lands separately together with the
    # branch-protection change.
    # required-aggregator
    name: Python Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install
        run: pip install mypy
      - run: mypy ai/ scripts/ || echo "mypy advisory only on first run"

  registry-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # T6-9 / ADR-0209 — schema + cross-file consistency check on
    # model/tiny/registry.json. Runs jsonschema (Draft 2020-12) when
    # available, plus cross-file invariants (sha256 matches, sidecars
    # exist). Fails closed. Required since ADR-1297: it validates shipped
    # model artifacts, and a fail-closed validator nothing blocks on is not
    # fail-closed.
    # required-aggregator
    name: Tiny-Model Registry Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Resolve LFS blobs so the sha256 cross-check sees real ONNX
          # bytes, not pointer files.
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate model/tiny/registry.json
        run: python3 ai/scripts/validate_model_registry.py

  docs-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cheap generator contracts and freshness plus the installed docs toolchain
    # keep both source-owned metadata and rendered documentation required.
    # required-aggregator
    name: Docs
    runs-on: ubuntu-26.04
    # 20, not 10: `mkdocs build --strict` over this doc tree measured
    # 9m31s, 9m21s and 5m21s on the last three green runs, and on
    # ubuntu-26.04 it crosses 10 minutes, so the job was cancelled at the
    # ceiling mid-build and the aggregator read that as a failure. The
    # build itself passes with zero warnings; locally it takes about
    # 3m20s. Sibling jobs in this file already sit at 25 and 30 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Verify documentation generator contracts
        run: python3 scripts/docs/tests/test_generators.py
      - name: Check generated documentation freshness
        run: make docs-fragments-check
      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt
      - name: Build docs (strict — fail on any warning)
        run: mkdocs build --strict

  check-conflict-markers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Fast, pre-commit-independent gate that fails immediately if git conflict
    # markers (<<<<<<< / ======= / >>>>>>>) are found committed in any text
    # file. This is intentionally redundant with pre-commit's check-merge-conflict
    # hook — the hook only fires on local `git commit`, whereas this step fires
    # on every push and PR, catching markers that sneak in via direct pushes,
    # GitHub UI merges, or --no-verify bypasses.
    # Excludes: binary extensions, LICENSES/ vendored texts, and the
    # .pre-commit-config.yaml itself (which references hook IDs that contain
    # the string "conflict").
    # Required since ADR-1297: catching a marker that bypassed the local hook
    # is the job's entire purpose, and a check that cannot block a merge
    # cannot do it.
    # required-aggregator
    name: No Conflict Markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if conflict markers are committed
        run: |
          set +e
          hits=$(git grep -In --untracked=false \
            -e '^<<<<<<< ' -e '^=======$' -e '^>>>>>>> ' \
            -- \
            ':(exclude)LICENSES/**' \
            ':(exclude)*.yuv' ':(exclude)*.pkl' ':(exclude)*.onnx' \
            ':(exclude)*.bin' ':(exclude)*.mexa64' ':(exclude)*.mexw64' \
            ':(exclude)*.mexmaci64' ':(exclude)*.npy' \
            ':(exclude)*.so' ':(exclude)*.a' ':(exclude)*.dylib' \
            ':(exclude)*.dll' ':(exclude)*.onnx.data' \
            2>/dev/null)
          if [ -n "$hits" ]; then
            echo "::error::Committed conflict markers found — resolve before merging:"
            echo "$hits"
            exit 1
          fi
          echo "No conflict markers found."

  twin-drift-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # ADR-1135 — .c/.cpp twin-drift + stale-source-reference gate. Fails
    # when (a) either side of a same-directory .c/.cpp twin pair is compiled
    # by NO build file (dead twins drift: output.c vs output.cpp diverged
    # for three months), or (b) any meson.build / setup.py / *.pyx names a
    # source path that does not exist (the mem.c -> mem.cpp and dict.c ->
    # dict.cpp renames broke the Cython + libFuzzer builds for two months
    # because only nightly / opt-in lanes configure those files). Known
    # dead twins are listed WITH a reason each in
    # scripts/ci/twin-drift-allowlist.txt; the gate fails on stale rows.
    # Pure git + awk, no build. The job `name:` is a required check in
    # required-aggregator.yml — rename both in the same commit.
    # required-aggregator
    name: Twin Drift
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run twin-drift gate
        run: bash scripts/ci/twin-drift-check.sh

  shellcheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # T7-CI-DEDUP — body collapsed to a no-op proxy that depends on the
    # `pre-commit` job, which already runs `shellcheck-py v0.11.0.1` +
    # `pre-commit-shfmt v3.13.1-1` with the identical `-i 2 -ci`
    # settings over `--all-files`. The job name is kept verbatim so
    # branch-protection's required-status-checks list keeps validating
    # without an admin update in lockstep with this PR. The standalone
    # apt-install / shfmt-curl steps are dropped — pre-commit covers
    # the same surface in the same PR via the pinned hook revs.
    # required-aggregator
    name: ShellCheck + shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: pre-commit
    steps:
      - run: |
          echo "shellcheck/shfmt covered by pre-commit job above; this is a no-op proxy."

  markdownlint:
    # ADR-0866 — markdownlint-cli2 gate over the touched markdown delta.
    # Mirrors the clang-tidy job's PR/push/dispatch fan-out so the
    # ~6.2k pre-existing warnings (ADR-0864 tail) don't gate innocent
    # PRs. Reads .markdownlint.json from the repo root (PR #332's tuned
    # config). NO --fix: 7 default rules are unsafe under autofix per
    # ADR-0864.
    # Required since ADR-1297. Every PR in this repository ships documentation
    # (agent hard rules 7 and 9), so the documentation linter is a product
    # gate, not a courtesy. It lints the touched delta only, so the ~6.2k
    # pre-existing warnings still do not gate innocent PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # required-aggregator
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the push-delta diff against `before` works for
          # multi-commit FF pushes; PR mode uses origin/${base_ref}...HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Detect changed markdown files
        id: detect
        # Hardening per Semgrep `yaml.github-actions.security.run-shell-injection`:
        # pull every `${{ github.* }}` interpolation into `env:` and reference
        # via env vars. Same posture as the clang-tidy job above.
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Restrict to the tracked markdown corpus (docs/ + changelog.d/
          # + top-level *.md). Upstream vendored trees and test fixtures
          # are excluded via the leading filter; the .markdownlintignore
          # path would also work but the explicit corpus is clearer.
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d \
              "origin/${PR_BASE_REF}...HEAD" -- '*.md' \
              | grep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
              | grep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | grep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/)' \
              || true)
          elif [ "$GH_EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=d HEAD~1..HEAD -- '*.md' \
                  | grep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
                  | grep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | grep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/)' \
                  || true)
              else
                files=""
              fi
            else
              files=$(git diff --name-only --diff-filter=d "$before"..HEAD -- '*.md' \
                | grep -E '^(docs/|changelog\.d/|README\.md|CLAUDE\.md|AGENTS\.md)' \
                | grep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | grep -vE '^(docs/adr/README\.md|CHANGELOG\.md|docs/adr/_index_fragments/|changelog\.d/)' \
                || true)
            fi
          else
            # workflow_dispatch — scan the full corpus. Operator-explicit.
            files=$(git ls-files \
              'docs/**/*.md' \
              'README.md' 'CLAUDE.md' 'AGENTS.md' \
              | grep -vE '^(subprojects/|core/test/data/|python/test/resource/|compat/python-vmaf/resource/|compat/python-vmaf/matlab/|model/|testdata/)' \
              | grep -vE '^(docs/adr/README\.md|docs/adr/_index_fragments/)' \
              || true)
          fi
          # Newline-delimit for the next step (one path per line, no IFS surprises).
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "no markdown changes — job will short-circuit"
          else
            echo "changed markdown files:"
            echo "$files"
          fi
      - name: Run markdownlint-cli2
        if: steps.detect.outputs.files != ''
        env:
          MD_FILES: ${{ steps.detect.outputs.files }}
        run: |
          # `npx --yes` resolves the package from the npm registry on first
          # run; subsequent runs hit the runner's npx cache. No project-
          # local package.json is needed.
          # shellcheck disable=SC2086
          echo "$MD_FILES" | xargs -r npx --yes markdownlint-cli2
