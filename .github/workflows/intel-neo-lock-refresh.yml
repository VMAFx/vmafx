name: intel-neo-lock-refresh

# Refresh dev/scripts/intel-neo-lock.json when Renovate updates build-config.env
# on a renovate/** branch (ADR-3555).
#
# Renovate tracks INTEL_NEO_VERSION and LEVEL_ZERO_VERSION in build-config.env
# via the Mend-hosted GitHub App, where postUpgradeTasks commands stay blocked.
# On a push to renovate/** touching build-config.env, this workflow mints an
# installation token for the release-bot App (so any pushed commit triggers PR
# check runs, ADR-1151), runs `fetch-intel-neo.py --write-lock`, and commits and
# pushes dev/scripts/intel-neo-lock.json only when its contents changed. The ref
# refusal, stray-path refusal, release-bot identity, commit and push steps live in
# scripts/ci/lock_refresh_publish.py, shared with python-lock-refresh.yml (ADR-3560).

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - "build-config.env"

permissions:
  contents: read

concurrency:
  group: intel-neo-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lock:
    name: Refresh Intel NEO lock file
    if: github.repository == 'vidiko/vmafx'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Mint the release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Refresh lock and push when changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?}" "${APP_SLUG:?}" "${GITHUB_REPOSITORY:?}" "${GITHUB_REF:?}" "${RUNNER_TEMP:?}"
          python3 scripts/ci/lock_refresh_publish.py refuse-non-renovate \
            --label intel-neo-lock-refresh
          lock="dev/scripts/intel-neo-lock.json"
          # shellcheck source=build-config.env
          . ./build-config.env
          python3 dev/scripts/fetch-intel-neo.py \
            --neo-ver "$INTEL_NEO_VERSION" \
            --level-zero-ver "$LEVEL_ZERO_VERSION" \
            --github-token "$GH_TOKEN" \
            --write-lock "$lock"
          python3 scripts/ci/lock_refresh_publish.py publish \
            --label intel-neo-lock-refresh \
            --subject "chore(deps): refresh Intel NEO and Level Zero asset lock" \
            --body-line "Refresh dev/scripts/intel-neo-lock.json for NEO ${INTEL_NEO_VERSION}" \
            --body-line "and Level Zero ${LEVEL_ZERO_VERSION} (ADR-3555)." \
            --current-message "$lock is already current for NEO $INTEL_NEO_VERSION and Level Zero $LEVEL_ZERO_VERSION" \
            -- "$lock"
