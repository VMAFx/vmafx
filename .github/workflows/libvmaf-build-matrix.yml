# Design notes for this workflow: docs/development/ci-workflow-notes/libvmaf-build-matrix.md
name: Builds
# ADR-1227 (design notes)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 (design notes)
    types: [opened, synchronize, reopened, ready_for_review]
    # ADR-0341, ADR-1140, ADR-2169, ADR-3293 (design notes)
  workflow_dispatch:

permissions:
  contents: read

# ADR-0115 (design notes)
concurrency:
  group: libvmaf-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  tier:
    name: CI tier (Builds)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  # ADR-3279 (design notes)
  impact:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Plan MSVC leg impact
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      msvc-sycl: ${{ steps.impact.outputs.windows_msvc_sycl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  libvmaf-build:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- CPU-only builds ---
          # ADR-1297 — every row below reports a check on every non-draft PR
          # and is named in required-aggregator.yml. Before ADR-1297 only the
          # `+DNN` siblings were gated, so the plain gcc/clang/ARM/static legs
          # could be red while the merge button stayed green.
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            werror: true
            name: Ubuntu gcc
            tier: full
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            werror: true
            zimg: true
            meson_extra: -Denable_zimg=true
            name: Ubuntu gcc zimg
            tier: full
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache clang-22
            CXX: ccache clang++-22
            werror: true
            name: Ubuntu clang
            tier: full
          # required-aggregator
          - os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
            meson_extra: -Denable_metal=disabled
            werror: true
            name: macOS clang
            tier: full
          # required-aggregator
          - os: ubuntu-26.04-arm
            CC: ccache clang-22
            CXX: ccache clang++-22
            werror: true
            name: Ubuntu ARM clang
            tier: full

          # --- DNN-enabled builds (ADR-0120) ---
          # Build with -Denable_dnn=enabled across compiler/OS combinations
          # to ensure the ORT C-API surface compiles on every CPU leg, not
          # only the dedicated `Tiny AI` job. Each leg installs ONNX Runtime
          # (Linux: MS tarball pinned to 1.22.0; macOS: Homebrew) and runs
          # the meson dnn suite. The macOS leg used to carry
          # `experimental: true`; ADR-1297 removed it. `continue-on-error`
          # never neutralised the check-run conclusion anyway (the leg
          # reported `failure` on PR #1518 with the flag set), so the flag
          # only made the workflow claim the leg was advisory while nothing
          # acted on that claim. A Homebrew ORT bump that breaks ABI is a
          # supply-chain pinning problem, not a reason the leg cannot gate.
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            dnn: true
            zimg: true
            meson_extra: -Denable_dnn=enabled -Denable_zimg=true
            werror: true
            name: Ubuntu gcc+DNN
            tier: light
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache clang-22
            CXX: ccache clang++-22
            dnn: true
            zimg: true
            meson_extra: -Denable_dnn=enabled -Denable_zimg=true
            werror: true
            name: Ubuntu clang+DNN
            tier: light
          # required-aggregator
          - os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
            dnn: true
            meson_extra: -Denable_dnn=enabled -Denable_metal=disabled
            werror: true
            name: macOS clang+DNN
            tier: full

          # ADR-0726 (design notes)

          # --- HIP T7-10b runtime (ADR-0212) ---
          # Real HIP runtime build — compiles + links against
          # `amdhip64` from `rocm-hip-runtime-dev`. The package is
          # apt-installed from the official AMD repo at
          # `repo.radeon.com/rocm/apt/<ver>` (~200 MB, +3-5 min per
          # run). No AMD GPU on the runner, so kernel-launch tests are
          # skipped (`vmaf_hip_device_count() == 0` short-circuits the
          # device-resident smoke assertions, mirroring the
          # Vulkan-on-lavapipe-less-CI pattern from ADR-0175). See
          # ADR-0212 §"Status update 2026-05-09: CI lane enabled".
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            hip: true
            meson_extra: -Denable_hip=true
            werror: true
            name: Ubuntu HIP
            tier: full

          # --- Metal backend (ADR-0361 scaffold, ADR-0420 runtime) ---
          # Builds the Metal runtime and every `.metal` kernel with
          # `-Denable_metal=enabled`. macos-latest ships the Metal SDK as part
          # of the system framework set (`/System/Library/Frameworks/
          # Metal.framework` is guaranteed to exist), so the
          # `dependency('Metal', required: false)` /
          # `dependency('MetalKit', required: false)` probes resolve. A hosted
          # runner has no GPU worth scoring on: the tests that need a device
          # skip, the rest check the -ENOSYS / -EINVAL / -ENODEV contracts.
          # Apple Silicon (M1+ / GPU Family Apple 7+) is the runtime
          # target; the lane builds on whichever macos-latest arch GitHub
          # provides today (Apple Silicon as of 2026).
          # required-aggregator
          - os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
            meson_extra: -Denable_metal=enabled
            werror: true
            name: macOS Metal
            tier: full

          # --- Static library builds ---
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            meson_extra: --default-library static
            werror: true
            name: Ubuntu gcc static
            tier: full
          # T7-CI-DEDUP — `Build — Ubuntu SYCL Static` removed. The
          # dynamic-link `Build — Ubuntu SYCL` lane below already
          # proves the icx / icpx + meson contract for the SYCL
          # device-image link path; the static lane was a packaging
          # exercise (no new bug class — every regression class it
          # could catch shows up first on the dynamic lane). The
          # CUDA Static lane stays because it exercises a distinct
          # NVCC-static interaction not covered by the dynamic build.
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            cuda: true
            meson_extra: --default-library static -Denable_cuda=true -Denable_nvcc=true
            werror: true
            name: Ubuntu CUDA static
            tier: full

          # --- SYCL build (icpx for both host + SYCL sources so the device
          #     image is registered at the .so link step; see post-T7-8
          #     SYCL revival in core/src/meson.build) ---
          # required-aggregator
          - os: ubuntu-26.04
            CC: icx
            CXX: icpx
            sycl: true
            meson_extra: -Denable_sycl=true -Db_lto=false
            werror: true
            name: Ubuntu SYCL
            tier: full

          # --- CUDA build (gcc + nvcc) ---
          # required-aggregator
          - os: ubuntu-26.04
            CC: ccache gcc-14
            CXX: ccache g++-14
            cuda: true
            meson_extra: -Denable_cuda=true -Denable_nvcc=true
            werror: true
            name: Ubuntu CUDA
            tier: full

          # --- SYCL + CUDA combined (icpx host so SYCL link works; nvcc
          #     handles the CUDA TUs separately via -Denable_nvcc=true) ---
          # required-aggregator
          - os: ubuntu-26.04
            CC: icx
            CXX: icpx
            sycl: true
            cuda: true
            meson_extra: -Denable_sycl=true -Denable_cuda=true -Denable_nvcc=true -Db_lto=false
            werror: true
            name: Ubuntu SYCL+CUDA
            tier: full

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # ADR-0726, ADR-1297 (design notes)
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
      # ADR-2169 (design notes)
      - name: Decide whether this leg runs in the tier (ADR-2169)
        id: leg
        env:
          LEG_TIER: ${{ matrix.tier }}
          TIER_FULL: ${{ needs.tier.outputs.full }}
        run: |
          if [ "$LEG_TIER" = light ] || [ "$TIER_FULL" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::full-tier leg not run on this pull request (ADR-2169): it runs on the master push; add the label 'ci: full' to run it here"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ steps.leg.outputs.run != 'true' && 1 || 0 }}

      - name: Plan CI impact (ADR-1140)
        id: impact
        if: steps.leg.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — libvmaf build leg skipped by plan
        if: steps.leg.outputs.run == 'true' && steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — libvmaf build leg satisfied without running (ADR-1140)"
      - name: Restore ccache (Linux + macOS)
        if: ${{ (startsWith(matrix.CC, 'ccache ')) && steps.impact.outputs.c_core == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          # ADR-0635 (design notes)
          key: ccache-v2-${{ matrix.os }}-${{ matrix.CC }}-${{ matrix.meson_extra }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ matrix.os }}-${{ matrix.CC }}-${{ matrix.meson_extra }}-
            ccache-v2-${{ matrix.os }}-${{ matrix.CC }}-
            ccache-v2-${{ matrix.os }}-

      - name: Setup python
        if: steps.impact.outputs.c_core == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.10

      - name: Install meson and ninja
        if: steps.impact.outputs.c_core == 'true'
        run: python -m pip install --require-hashes -r requirements/locks/build.txt

      - name: Install dependencies (ubuntu)
        if: ${{ (startsWith(matrix.os, 'ubuntu') && !matrix.sycl && !matrix.cuda && !matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache ninja-build nasm libomp-dev pkg-config
          # ADR-0692 (design notes)
          case "$CC" in
          *gcc-14)   sudo -E apt-get -yq install gcc-14 g++-14 ;;
          *clang-22) wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
                     chmod +x /tmp/llvm.sh
                     sudo /tmp/llvm.sh 22
                     sudo -E apt-get -yq install libclang-rt-22-dev libomp-22-dev ;;
          *gcc)      sudo -E apt-get -yq install gcc g++ ;;
          *clang)    sudo -E apt-get -yq install clang ;;
          esac
          if [ "${{ matrix.zimg }}" = "true" ]; then
            sudo -E apt-get -yq install libzimg-dev
          fi

      - name: Install dependencies (mac)
        if: ${{ (matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3: installing dependencies via brew..."
            if brew install -q ninja nasm ccache llvm pkg-config; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "brew install failed after 3 attempts"
              exit 1
            fi
            echo "Attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
            brew fetch --retry ninja nasm ccache llvm pkg-config || true
          done

      - name: Install Metal compiler toolchain
        if: ${{ (contains(matrix.meson_extra, 'enable_metal=enabled')) && steps.impact.outputs.c_core == 'true' }}
        run: xcodebuild -downloadComponent MetalToolchain

      # ADR-0120 (design notes)
      - name: Install ONNX Runtime (linux, DNN leg)
        if: ${{ (matrix.dnn && startsWith(matrix.os, 'ubuntu')) && steps.impact.outputs.c_core == 'true' }}
        env:
          ORT_VERSION: "1.22.0"
          ORT_SHA256: "8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3"
        run: |
          set -euo pipefail
          ort_name="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ort_archive="${RUNNER_TEMP}/${ort_name}"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_name}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --remove-on-error \
            --output "${ort_archive}" \
            "${ort_url}"
          printf '%s  %s\n' "${ORT_SHA256}" "${ort_archive}" \
            | sha256sum --check --strict
          sudo tar -xzf "${ort_archive}" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          sudo install -d /usr/local/lib/pkgconfig
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          prefix=/opt/onnxruntime
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libonnxruntime
          Description: ONNX Runtime C API
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          sudo sed -i 's/^          //' /usr/local/lib/pkgconfig/libonnxruntime.pc
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      - name: Install ONNX Runtime (macos, DNN leg)
        if: ${{ (matrix.dnn && matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true' }}
        run: |
          brew install -q onnxruntime
          ORT_PREFIX=$(brew --prefix onnxruntime)
          echo "PKG_CONFIG_PATH=${ORT_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Intel oneAPI
        if: ${{ (matrix.sycl) && steps.impact.outputs.c_core == 'true' }}
        env:
          CC: gcc
          CXX: g++
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache ninja-build nasm gcc g++ gpg-agent
          # ADR-1360 (design notes)
          bash scripts/ci/install-intel-ocloc.sh
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          set -a; . ./build-config.env; set +a
          sudo -E apt-get -yq install "${ONEAPI_APT_PACKAGE}" cmake
          # ADR-1231 (design notes)
          set -a; . ./build-config.env; set +a
          git clone --depth=1 --branch "v${LEVEL_ZERO_VERSION}" \
            https://github.com/oneapi-src/level-zero.git /tmp/level-zero
          cmake -S /tmp/level-zero -B /tmp/level-zero/build -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build /tmp/level-zero/build -j"$(nproc)"
          sudo cmake --install /tmp/level-zero/build
          rm -rf /tmp/level-zero
          echo "/opt/intel/oneapi/compiler/latest/bin" >> "$GITHUB_PATH"
          echo "/opt/intel/oneapi/compiler/latest/lib" | sudo tee /etc/ld.so.conf.d/oneapi.conf
          sudo ldconfig

      # ADR-0603, ADR-1223 (design notes)
      - name: Install CUDA toolkit
        if: ${{ (matrix.cuda) && steps.impact.outputs.c_core == 'true' }}
        run: bash scripts/ci/install-cuda-toolkit.sh

      - name: Install nv-codec-headers
        if: ${{ (matrix.cuda) && steps.impact.outputs.c_core == 'true' }}
        run: |
          bash scripts/ci/fetch-nv-codec-headers.sh "$RUNNER_TEMP/nv-codec-headers"
          sudo make -C "$RUNNER_TEMP/nv-codec-headers" install

      - name: Install base deps for CUDA-only builds
        if: ${{ (matrix.cuda && !matrix.sycl) && steps.impact.outputs.c_core == 'true' }}
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache ninja-build nasm gcc g++

      # ADR-1225 (design notes)
      - name: Install ROCm / HIP toolchain
        if: ${{ (matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install --no-install-recommends \
            ccache ninja-build nasm libomp-dev pkg-config gcc g++ jq
          # ADR-1231 (design notes)
          set -a; . ./build-config.env; set +a
          ./scripts/ci/install-rocm-from-image.sh \
            --image "$ROCM_BUILDER" --dest /opt/rocm
          echo "ROCM_PATH=/opt/rocm" | sudo tee -a "$GITHUB_ENV"
          echo "/opt/rocm/bin" | sudo tee -a "$GITHUB_PATH"
          echo "/opt/rocm/lib" | sudo tee /etc/ld.so.conf.d/rocm.conf
          echo "PKG_CONFIG_PATH=/opt/rocm/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            | sudo tee -a "$GITHUB_ENV"
          sudo ldconfig
          /opt/rocm/bin/hipconfig --version || true

      - name: Configure ccache
        if: ${{ (startsWith(matrix.CC, 'ccache ')) && steps.impact.outputs.c_core == 'true' }}
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=400M
          ccache -z

      - name: Configure libvmaf
        if: steps.impact.outputs.c_core == 'true'
        run: |
          if [ "${{ matrix.sycl }}" = "true" ]; then
            source /opt/intel/oneapi/setvars.sh
          fi
          # ADR-2170: a leg that prints no warnings (`werror: true` in its row) makes them errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core core/build --buildtype release \
            --prefix "$PWD/install" \
            -Denable_float=true \
            ${{ matrix.meson_extra }} \
            -Dwerror=true \
            $(scripts/ci/werror-args.sh "${{ matrix.werror }}")

      - name: Build libvmaf
        if: steps.impact.outputs.c_core == 'true'
        run: |
          if [ "${{ matrix.sycl }}" = "true" ]; then
            source /opt/intel/oneapi/setvars.sh
          fi
          sudo -E PATH="$PATH" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
            ninja -vC core/build install

      - name: Report ccache statistics
        if: ${{ (always() && startsWith(matrix.CC, 'ccache ')) && steps.impact.outputs.c_core == 'true' }}
        run: ccache -s

      - name: Verify static pkgconfig
        if: ${{ (contains(matrix.meson_extra, 'static')) && steps.impact.outputs.c_core == 'true' }}
        env:
          # ADR-2828 (design notes)
          CC: ccache gcc-14
          ROW_CC: ${{ matrix.CC }}
        run: |
          if [ "$ROW_CC" != "$CC" ]; then
            echo "::error::static row builds with '$ROW_CC'; update CC of this step to match"
            exit 1
          fi
          export PKG_CONFIG_PATH=$PWD/install/lib/pkgconfig:$PWD/install/lib/x86_64-linux-gnu/pkgconfig
          echo "=== libvmaf.pc ==="
          cat "$PWD/install/lib/pkgconfig/libvmaf.pc" || cat "$PWD/install/lib/x86_64-linux-gnu/pkgconfig/libvmaf.pc"
          echo ""
          echo "=== pkg-config --static --libs libvmaf ==="
          pkg-config --static --libs libvmaf
          pkg-config --static --libs libvmaf | grep -q '\-lpthread\|\-pthread'
          pkg-config --static --libs libvmaf | grep -q '\-lm'
          pkg-config --static --libs libvmaf | grep -q '\-lstdc++\|\-lc++'
          echo "=== static link smoke ==="
          cat > /tmp/pc_static_smoke.c <<'SMOKE'
          #include <libvmaf/libvmaf.h>
          int main(void)
          {
              VmafContext *ctx = 0;
              VmafConfiguration cfg = {0};
              return vmaf_init(&ctx, cfg) == 0 ? 0 : 1;
          }
          SMOKE
          read -ra pc_cflags <<< "$(pkg-config --cflags libvmaf)"
          read -ra pc_libs <<< "$(pkg-config --static --libs libvmaf)"
          $CC -Wall -Wextra -Werror /tmp/pc_static_smoke.c "${pc_cflags[@]}" "${pc_libs[@]}" \
             -o /tmp/pc_static_smoke
          echo "static link OK"

      - name: Run meson dnn suite (DNN leg)
        if: ${{ (matrix.dnn) && steps.impact.outputs.c_core == 'true' }}
        run: >-
          sudo "$(command -v python3)" scripts/ci/run_meson_test.py
          --meson-executable "$(command -v meson)" --
          -C core/build --suite=dnn --print-errorlogs

      - name: Prefetch Go modules for the suite
        if: ${{ (!matrix.sycl && !matrix.cuda && !matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: sudo "$(command -v python3)" scripts/ci/prefetch_go_modules.py

      - name: Run tests
        if: ${{ (!matrix.sycl && !matrix.cuda && !matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: >-
          sudo "$(command -v python3)" scripts/ci/run_meson_test.py
          --meson-executable "$(command -v meson)" -- -C core/build
          --no-rebuild --print-errorlogs

      - name: SSH debug session on test failure
        if: ${{ (failure() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch') && steps.impact.outputs.c_core == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          connect-timeout-seconds: 1800

      # ADR-0726 (design notes)

      - name: Restore Netflix vmaf_resource fixtures
        id: fixtures
        if: ${{ ((startsWith(matrix.os, 'ubuntu') && !matrix.sycl && !matrix.cuda && !matrix.hip) || matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}
          restore-keys: |
            vmaf-fixtures-resource-v1-
            vmaf-fixtures-resource-

      - name: Drop unusable restored fixtures
        if: ${{ ((startsWith(matrix.os, 'ubuntu') && !matrix.sycl && !matrix.cuda && !matrix.hip) || matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true' }}
        run: bash scripts/ci/prune-corrupt-fixtures.sh --restore-tracked python/test/resource

      - name: Run tox tests (ubuntu)
        if: ${{ (startsWith(matrix.os, 'ubuntu') && !matrix.sycl && !matrix.cuda && !matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: |
          mkdir -p ~/.ccache && sudo chown -R "$(whoami)" ~/.ccache
          pip install --require-hashes -r requirements/locks/tox.txt
          tox -c python

      - name: Run tox tests (mac)
        if: ${{ (matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true' }}
        run: |
          mkdir -p ~/.ccache && sudo chown -R "$(whoami)" ~/.ccache
          pip install --require-hashes -r requirements/locks/tox.txt
          PATH=$(brew --prefix)/opt/llvm/bin:$PATH \
          CC=$(brew --prefix)/opt/llvm/bin/clang \
          CXX=$(brew --prefix)/opt/llvm/bin/clang++ \
          tox -c python

      - name: Save Netflix vmaf_resource fixtures
        if: ${{ success() && (((startsWith(matrix.os, 'ubuntu') && !matrix.sycl && !matrix.cuda && !matrix.hip) || matrix.os == 'macos-latest') && steps.impact.outputs.c_core == 'true') && steps.fixtures.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}

      # ADR-1495 (design notes)
      - name: Check the host math library (icx)
        if: ${{ (matrix.sycl) && steps.impact.outputs.c_core == 'true' }}
        run: >-
          sudo "$(command -v python3)" scripts/ci/run_meson_test.py
          --meson-executable "$(command -v meson)" -- -C core/build
          --no-rebuild --print-errorlogs test_icx_system_libm

      - name: Run CPU-only tests (GPU build)
        if: ${{ (matrix.sycl || matrix.cuda) && steps.impact.outputs.c_core == 'true' }}
        run: |
          cd core/build
          for t in test_dict test_ref test_log test_thread_pool test_cpu \
                   test_feature test_cli_parse test_model test_predict \
                   test_ciede test_cambi test_psnr test_luminance_tools \
                   test_feature_collector test_framesync; do
            echo "=== $t ==="
            ./test/$t
          done

      # ADR-0212 (design notes)
      - name: Run HIP smoke test (no GPU)
        if: ${{ (matrix.hip) && steps.impact.outputs.c_core == 'true' }}
        run: |
          cd core/build
          ./test/test_hip_smoke

      - name: Upload vmaf binary
        if: ${{ ((!contains(matrix.meson_extra, 'static')) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.name }}-vmaf
          path: ./install/bin/vmaf
      - name: Upload vmaf binary (Gitea)
        if: ${{ ((!contains(matrix.meson_extra, 'static')) && steps.impact.outputs.c_core == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: ${{ matrix.name }}-vmaf
          path: ./install/bin/vmaf

  # ADR-0115, ADR-0116, ADR-1387 (design notes)
  windows:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # required-aggregator
          - name: Windows UCRT64
            msystem: UCRT64
            MINGW_PACKAGE_PREFIX: mingw-w64-ucrt-x86_64
    env:
      CC: ccache gcc
      CXX: ccache g++
      CFLAGS: -pipe -static -O3 -mtune=generic -D_FILE_OFFSET_BITS=64 -mthreads
      CXXFLAGS: -pipe -static -O3 -mtune=generic -D_FILE_OFFSET_BITS=64 -mthreads
      LDFLAGS: -pipe -static -static-libgcc -static-libstdc++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache ccache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ matrix.msystem }}-0-${{ hashFiles('**/*.c') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.msystem }}-0-
            ${{ runner.os }}-${{ matrix.msystem }}-

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-ccache
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-nasm
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-pkg-config
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-gcc
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-meson
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-ninja
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-python
            ${{ matrix.MINGW_PACKAGE_PREFIX }}-python-yaml
            vim make diffutils
          update: true
          path-type: inherit

      - name: Set ccache dir
        run: echo "CCACHE_DIR=$PWD/.ccache" >> $GITHUB_ENV

      - name: Configure vmaf
        run: |
          # ADR-2170: this leg prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core core/build --buildtype release \
            --default-library static --prefix "$MINGW_PREFIX" \
            -Denable_cuda=false -Denable_sycl=false -Denable_float=true \
            -Dwerror=true \
            $(bash scripts/ci/werror-args.sh true)

      - name: Build vmaf
        run: meson install -C core/build

      # ADR-1254 (design notes)
      - name: Check Win64 stack alignment
        timeout-minutes: 15
        run: python3 scripts/ci/check-win64-stack-alignment.py core/build

      - name: Prefetch Go modules for the suite
        run: python3 scripts/ci/prefetch_go_modules.py

      - name: Test vmaf
        run: >-
          python3 scripts/ci/run_meson_test.py -- -C core/build
          --num-processes $(nproc) --print-errorlogs

      - name: Show binary info and stage artifact
        id: stage
        run: |
          ldd "$MINGW_PREFIX/bin/vmaf.exe" || true
          mkdir -p artifact
          cp "$MINGW_PREFIX/bin/vmaf.exe" artifact/vmaf.exe
          echo "path=$(cygpath -m "$PWD/artifact/vmaf.exe")" >> "$GITHUB_OUTPUT"

      - name: Upload vmaf.exe artifact
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.msystem }}-vmaf
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
      - name: Upload vmaf.exe artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: ${{ matrix.msystem }}-vmaf
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error

  # ADR-0121, ADR-0635, ADR-0664 (design notes)
  windows-gpu-build:
    needs: [tier, impact]
    # ADR-3279 (design notes)
    if: ${{ !cancelled() && (needs.tier.outputs.full == 'true' || needs.impact.result == 'failure' || (needs.impact.result == 'success' && needs.impact.outputs.msvc-sycl == 'true')) }}
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --default-library=static: libvmaf has no __declspec(dllexport)
          # on its public API (upstream is POSIX-shaped), so a vanilla MSVC
          # shared build produces an empty import lib and the tool targets
          # fail with LNK1181. Mirrors the MinGW leg's `--default-library
          # static` at line 387. Also lets the vmaf CLI pick the static
          # archive via core/tools/meson.build:26 without the
          # get_shared_lib() branch.
          # ADR-2170: this leg prints no warnings, so cl.exe, link.exe and nvcc make them
          # errors. The SYCL row (icx-cl) is not at zero yet: docs/development/ci.md.
          # -Db_lto=false: with the project default b_lto=true every one of the
          # about 360 test programs links with /LTCG against the /GL objects of
          # the static libraries, 32 to 52 minutes of a 60-minute job. The
          # Windows bundles build without LTO (build-windows-tester-bundle.py)
          # and ADR-1172 leaves the override to CI.
          # required-aggregator
          - backend: cuda
            meson_extra: --default-library=static -Denable_cuda=true -Denable_nvcc=true -Denable_sycl=false -Db_lto=false
            tier: full
            werror: msvc
            name: Windows MSVC+CUDA
          # required-aggregator
          - backend: sycl
            meson_extra: --default-library=static -Denable_cuda=false -Denable_sycl=true
            tier: light
            werror: msvc
            name: Windows MSVC+SYCL
    steps:
      - name: Decide whether this leg runs in the tier (ADR-2169, ADR-3279)
        id: leg
        shell: bash
        env:
          LEG_TIER: ${{ matrix.tier }}
          TIER_FULL: ${{ needs.tier.outputs.full }}
        run: |
          if [ "$LEG_TIER" = light ] || [ "$TIER_FULL" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::full-tier leg not run on this pull request (ADR-2169): it runs on the master push; add the label 'ci: full' to run it here"
          fi
      # Unconditional: the checkout-ordering gate accepts no checkout behind an
      # `if`. A row the tier does not owe stops after this shallow checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup python
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install meson and ninja
        if: steps.leg.outputs.run == 'true'
        run: python -m pip install --require-hashes -r requirements/locks/build.txt

      # ADR-0635 (design notes)
      - name: Setup MSVC dev environment
        if: steps.leg.outputs.run == 'true'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9  # v4.1.0
        with:
          arch: x64

      # ADR-0603, ADR-1223 (design notes)
      - name: Install CUDA toolkit (windows)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'cuda'
        shell: pwsh
        run: pwsh -File scripts/ci/install-cuda-toolkit.ps1

      - name: Install Intel oneAPI (windows)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'sycl'
        shell: cmd
        env:
          WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/1f18901e-877d-469d-a41a-a10f11b39336/intel-oneapi-base-toolkit-2025.3.0.372_offline.exe
          WINDOWS_DPCPP_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
        run: |
          curl.exe --output %TEMP%\webimage.exe --url %WINDOWS_BASEKIT_URL% --retry 5 --retry-delay 5
          start /b /wait %TEMP%\webimage.exe -s -x -f webimage_extracted --log extract.log
          del %TEMP%\webimage.exe
          webimage_extracted\bootstrapper.exe -s --action install --components=%WINDOWS_DPCPP_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          set installer_exit_code=%ERRORLEVEL%
          rd /s/q "webimage_extracted"
          exit /b %installer_exit_code%

      - name: Install nv-codec-headers (windows)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'cuda'
        shell: bash
        run: |
          headers="$(cygpath -u "$RUNNER_TEMP")/nv-codec-headers"
          bash scripts/ci/fetch-nv-codec-headers.sh "$headers"
          mkdir -p nvcodec-prefix/include
          cp -r "$headers/include/ffnvcodec" nvcodec-prefix/include/
          echo "INCLUDE=$(cygpath -w "$PWD/nvcodec-prefix/include");${INCLUDE-}" >> "$GITHUB_ENV"

      - name: Disable ccache wrap (windows)
        if: steps.leg.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = 'C:\Strawberry\c\bin\ccache.exe'
          if (Test-Path $p) { Rename-Item -Path $p -NewName 'ccache.exe.disabled' }
          Write-Host "ccache binary disabled"

      # ADR-2170 (design notes)
      - name: Warnings-as-errors arguments
        if: steps.leg.outputs.run == 'true'
        id: werror
        shell: bash
        run: |
          args="$(bash scripts/ci/werror-args.sh "${{ matrix.werror }}")"
          echo "werror arguments: ${args:-none}"
          echo "args=${args//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - name: Configure libvmaf (CUDA)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'cuda'
        shell: cmd
        env:
          CFLAGS: /experimental:c11atomics
          CXXFLAGS: /experimental:c11atomics
        run: |
          meson setup core core\build -Dwerror=true --buildtype release ^
            --prefix %CD%\install ^
            -Dc_std=none ^
            -Denable_float=true ^
            ${{ matrix.meson_extra }} ${{ steps.werror.outputs.args }}

      - name: Install Level Zero loader (windows)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'sycl'
        shell: cmd
        run: |
          REM Level Zero pin. This leg runs under cmd and cannot source
          REM build-config.env, so LEVEL_ZERO_VERSION is mirrored here by hand
          REM and checked against the config by
          REM scripts/ci/check-base-image-single-source.sh (ADR-1231).
          git clone --depth=1 --branch v1.34.0 https://github.com/oneapi-src/level-zero level-zero-src
          cmake -S level-zero-src -B level-zero-src\build -DCMAKE_INSTALL_PREFIX=%CD%\level-zero-prefix -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build level-zero-src\build --config Release --target install
          echo INCLUDE=%CD%\level-zero-prefix\include;%INCLUDE%>>%GITHUB_ENV%
          echo LIB=%CD%\level-zero-prefix\lib;%LIB%>>%GITHUB_ENV%

      - name: Configure libvmaf (SYCL)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'sycl'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          set CC=icx-cl
          set CXX=icx-cl
          meson setup core core\build -Dwerror=true --buildtype release ^
            --prefix %CD%\install ^
            -Denable_float=true ^
            -Dcpp_std=c++latest ^
            ${{ matrix.meson_extra }} ${{ steps.werror.outputs.args }}

      - name: Build libvmaf (CUDA)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'cuda'
        shell: cmd
        run: |
          ninja -v -C core\build install

      - name: Build libvmaf (SYCL)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'sycl'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          ninja -v -C core\build install

      - name: Check installed library names (MSVC)
        if: steps.leg.outputs.run == 'true'
        shell: cmd
        run: python scripts\ci\check_msvc_library_names.py --prefix install --meson-log core\build\meson-logs\meson-log.txt

      # ADR-1364 (design notes)
      - name: Check SYCL device-image registration (SYCL leg only)
        if: steps.leg.outputs.run == 'true' && matrix.backend == 'sycl'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          set "PATH=%CD%\level-zero-prefix\bin;%PATH%"
          python scripts\ci\run_meson_test.py -- -C core\build --print-errorlogs test_sycl_kernel_registration test_sycl_coff_anchor

  # ===== Windows on ARM64 (native MSVC ARM64, CPU + NEON) =====
  # Builds libvmaf natively on a Windows 11 Arm64 runner with the
  # ARM64-hosted MSVC toolset and runs the `fast` unit suite, so the
  # NEON kernels under core/src/feature/arm64/ and every
  # `#if ARCH_AARCH64` branch are compiled by cl.exe and executed on
  # ARM64 silicon. Before this lane the arm64 tree was only ever
  # compiled by gcc/clang (Ubuntu ARM clang, macOS) and MSVC only ever
  # saw the x86 tree. CPU only: there is no CUDA-on-WoA leg yet. CUDA
  # 13.4.1 is the first release with windows-arm64 packages and the pin
  # (CUDA_VERSION in build-config.env) is past it, so such a leg is open work,
  # not blocked on the toolkit. ADR-1260 left
  # this lane advisory -- "not in required-aggregator.yml -- until the
  # maintainer promotes it". ADR-1297 is that promotion: the lane is in
  # required-aggregator.yml, and in that file's `strictMustReport` list
  # because the runner label below is a single point of failure and a
  # lane that silently stops registering must not read as a pass.
  #
  # Runner: `windows-11-vs2026-arm` (GA 2026-08-19, runner-images
  # #14592) rather than `windows-11-arm`, which is being migrated to
  # the same Visual Studio 2026 image between 2026-09-21 and
  # 2026-09-30 (runner-images #14602); the explicit label pins one
  # image across that window. Both labels are free for public
  # repositories. The x64 MSVC legs' `windows-2025` label resolves to
  # the VS 2026 image as well, so every MSVC lane runs the same major.
  #
  # Toolchain: TheMrMilchmann/setup-msvc-dev forwards `arch` verbatim
  # to vcvarsall.bat; `arm64` selects the ARM64-hosted native toolset
  # (VC\Auxiliary\Build\vcvarsarm64.bat, VS 2022 17.4+), whereas
  # `amd64_arm64` would pick the x64-hosted cross compiler running
  # under emulation. The image ships no meson and no nasm; nasm is
  # only probed under `cpu_family().startswith('x86')` in
  # core/src/meson.build, so nothing is missing for ARM64.
  windows-arm64:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    # required-aggregator
    name: Windows ARM64 MSVC
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt

      - name: Setup MSVC dev environment (ARM64 native)
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9  # v4.1.0
        with:
          arch: arm64

      - name: Disable ccache wrap (windows)
        shell: pwsh
        run: |
          $p = 'C:\Strawberry\c\bin\ccache.exe'
          if (Test-Path $p) { Rename-Item -Path $p -NewName 'ccache.exe.disabled' }
          Write-Host "ccache binary disabled"

      - name: Show compiler
        shell: cmd
        run: |
          where cl.exe
          cl.exe 2>&1 | findstr /i /C:"for ARM64"

      # ADR-2170 (design notes)
      - name: Warnings-as-errors arguments
        id: werror
        shell: bash
        run: |
          args="$(bash scripts/ci/werror-args.sh msvc)"
          echo "werror arguments: ${args:-none}"
          echo "args=${args//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - name: Configure libvmaf
        shell: cmd
        env:
          CFLAGS: /experimental:c11atomics
          CXXFLAGS: /experimental:c11atomics
        run: |
          meson setup core core\build -Dwerror=true --buildtype release ^
            --prefix %CD%\install ^
            --default-library=static ^
            -Dc_std=none ^
            -Denable_cuda=false -Denable_sycl=false ^
            -Denable_float=true ${{ steps.werror.outputs.args }}

      - name: Build libvmaf
        shell: cmd
        run: ninja -v -C core\build install

      - name: Check installed library names (MSVC)
        shell: cmd
        run: python scripts\ci\check_msvc_library_names.py --prefix install --meson-log core\build\meson-logs\meson-log.txt

      - name: Check vmaf.exe is an ARM64 image
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('install\bin\vmaf.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) {
            throw ("vmaf.exe machine field is 0x{0:X4}, expected 0xAA64 (ARM64)" -f $machine)
          }
          "vmaf.exe machine field 0x{0:X4} (ARM64)" -f $machine

      - name: Prefetch Go modules for the suite
        shell: cmd
        run: python scripts\ci\prefetch_go_modules.py

      - name: Run fast unit suite
        shell: cmd
        run: >-
          python scripts\ci\run_meson_test.py --
          -C core\build --suite fast --print-errorlogs

      - name: Upload vmaf.exe artifact
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-arm64-msvc-vmaf
          path: install\bin\vmaf.exe
          if-no-files-found: error
      - name: Upload vmaf.exe artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: windows-arm64-msvc-vmaf
          path: install\bin\vmaf.exe
          if-no-files-found: error
