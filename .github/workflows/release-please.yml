# release-please — on each push to master, first create a draft release when a
# completed release PR is present; otherwise open or update that release PR.
# Changelog fragments own CHANGELOG.md (ADR-1128). Publishing the draft creates
# the `vMAJOR.MINOR.PATCH` tag and fires release workflows for signing, SBOM,
# SLSA, and container publication (ADR-1127).

name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Prevent duplicate release PRs for the same push. cancel-in-progress: false
# preserves the in-flight run that may already have created or updated the
# release PR; the queue drains naturally.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ADR-1151 — every write is made with the release-bot App installation
    # token minted below, so the job's own `GITHUB_TOKEN` never needs write
    # scope and stays at the workflow's least-privilege default (Scorecard
    # TokenPermissionsID).
    permissions:
      contents: read
    steps:
      # ADR-1151 finding 1. release-please used to authenticate with
      # `secrets.GITHUB_TOKEN`; GitHub suppresses follow-on workflow events
      # for anything that token creates, so the release PR received zero
      # check runs, the sole required context could never report, and the PR
      # sat `BLOCKED` behind an admin bypass. An App installation token is a
      # distinct actor, so pushes and PRs it makes trigger CI normally.
      #
      # The App and its two secrets are a maintainer action (see
      # docs/development/release.md). Until they exist this job fails loudly
      # here rather than silently falling back to `GITHUB_TOKEN` and
      # recreating the un-runnable release PR.
      - name: Require release-bot App credentials
        env:
          RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${RELEASE_BOT_APP_ID}" ]] || missing+=("RELEASE_BOT_APP_ID")
          [[ -n "${RELEASE_BOT_PRIVATE_KEY}" ]] || missing+=("RELEASE_BOT_PRIVATE_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=ADR-1151 release-bot credentials missing::${missing[*]}"
            echo "release-please must run as the release-bot GitHub App, not as" >&2
            echo "GITHUB_TOKEN: PRs opened by GITHUB_TOKEN never receive check" >&2
            echo "runs, so the release PR can never satisfy branch protection." >&2
            echo "" >&2
            echo "Create the App (Contents + Pull requests: read/write, installed" >&2
            echo "on VMAFx/vmafx) and add the repository secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "See docs/development/release.md, section 'Release-bot identity'." >&2
            exit 1
          fi
          echo "release-bot App credentials present."

      - name: Mint the release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Detect an unpublished ordinary-SemVer draft
        id: draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          mapfile -t drafts < <(jq -r '
            .[][]
            | select(.draft == true)
            | select(.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            | .tag_name
          ' "$releases")
          if [[ ${#drafts[@]} -gt 1 ]]; then
            echo "ERROR: multiple ordinary-SemVer draft releases require operator cleanup" >&2
            printf '  %s\n' "${drafts[@]}" >&2
            exit 1
          fi
          if [[ ${#drafts[@]} -eq 1 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=${drafts[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect a hand-finished release PR frozen for merge
        id: cut
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # release-please force-recreates `release-please--branches--...` on
          # every push to master: the branch always carries exactly one commit,
          # authored fresh by the bot. The documented cut procedure
          # (docs/development/release.md) has the operator hand-add two commits
          # to that same branch — `concat --write` and the fragment rollover,
          # which is also what deletes the one-shot `release-as` /
          # `bootstrap-sha` fields. Any later merge to master would silently
          # destroy both. The `autorelease: cut` label freezes the branch: while
          # it is present the PR-update invocation below is skipped, so the
          # finished cut survives until the operator merges it. See ADR-1151.
          prs="$RUNNER_TEMP/open-prs.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > "$prs"
          frozen="$(jq -r '
            [ .[][]
              | select(.head.ref | startswith("release-please--"))
              | select([.labels[].name] | index("autorelease: cut"))
              | .number
            ] | join(",")
          ' "$prs")"
          if [[ -n "$frozen" ]]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "numbers=$frozen" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
            echo "numbers=" >> "$GITHUB_OUTPUT"
          fi

      # release-please 17.6.0 otherwise tries release creation and next-PR
      # creation in one process. With draft releases (and therefore no tag yet),
      # that second phase can fail on an invalid previous_tag. Split the phases:
      # a successful release creation suppresses the PR-only invocation below.
      - name: Create draft release after a completed release PR
        if: steps.draft.outputs.exists != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: true

      - name: Open or update the release PR
        if: >-
          steps.draft.outputs.exists != 'true' &&
          steps.cut.outputs.frozen != 'true' &&
          steps.release.outputs.release_created != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: true

      - name: Dump outputs
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"

      - name: Preserve a frozen release PR
        if: steps.cut.outputs.frozen == 'true'
        run: |
          echo "Release PR(s) ${{ steps.cut.outputs.numbers }} carry 'autorelease: cut'."
          echo "The release branch is frozen so the hand-added changelog-rollover"
          echo "commits are not force-destroyed. Merge the PR, or drop the label to"
          echo "let release-please regenerate the branch from scratch."

      - name: Preserve the authenticated publication gate
        if: steps.draft.outputs.exists == 'true'
        run: |
          echo "Draft ${{ steps.draft.outputs.tag }} is awaiting authenticated publication."
          echo "Release creation and next-PR generation remain paused."
