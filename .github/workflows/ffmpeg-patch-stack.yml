name: FFmpeg Patch Stack

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-patch-stack-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tier:
    name: CI tier (FFmpeg Patch Stack)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  check:
    needs: tier
    if: needs.tier.outputs.light == 'true' && github.event_name != 'schedule'
    # required-aggregator
    name: FFmpeg Patch Stack
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce FFmpeg input contract
        run: make ffmpeg-input-contract

      - name: Install pytest for the zero-copy comparator tests
        run: |
          python3 -m venv "$RUNNER_TEMP/zc-venv"
          "$RUNNER_TEMP/zc-venv/bin/python" -m pip install --require-hashes \
            -r requirements/locks/pytest-timeout.txt
          echo "$RUNNER_TEMP/zc-venv/bin" >> "$GITHUB_PATH"

      - name: Enforce SYCL zero-copy routing and e2e comparator contracts
        run: make sycl-zerocopy-contract

      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      # The replay applies the shared FFmpeg fix series first (ADR-3143). This
      # gate is where its release signature is checked on every change: with
      # cosign installed, FFMPEG_FIX_SERIES_VERIFY=cosign fails closed.
      - name: Install cosign
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Check configured FFmpeg release
        id: replay
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        shell: bash
        env:
          FFMPEG_FIX_SERIES_VERIFY: cosign
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/ffmpeg-patch-check"
          mkdir -p "$output_dir"
          python3 scripts/ci/ffmpeg_patch_stack.py --check --output-dir "$output_dir" \
            2>&1 | tee "$output_dir/workflow-command.log"

      - name: Report no replay needed
        if: steps.impact.outputs.mode != 'full' && steps.impact.outputs.c_core != 'true' && steps.impact.outputs.actions != 'true'
        run: echo 'Patch automation contracts passed; this change does not require FFmpeg replay.'

      - name: Retain replay diagnostics
        if: ${{ (always() && (steps.replay.outcome == 'success' || steps.replay.outcome == 'failure')) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffmpeg-patch-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-patch-check/
          if-no-files-found: error
          retention-days: 14
      - name: Retain replay diagnostics (Gitea)
        if: ${{ (always() && (steps.replay.outcome == 'success' || steps.replay.outcome == 'failure')) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: ffmpeg-patch-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-patch-check/
          if-no-files-found: error
          retention-days: 14

  filter:
    needs: tier
    if: needs.tier.outputs.light == 'true' && github.event_name != 'schedule'
    # required-aggregator
    name: FFmpeg vmafx Filter
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Report no filter build needed
        if: steps.impact.outputs.mode != 'full' && steps.impact.outputs.c_core != 'true' && steps.impact.outputs.actions != 'true'
        run: |
          echo "skip: no C core, FFmpeg patch or workflow change; the FFmpeg Patch Stack job covers the series"
      - name: Load build config
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        run: scripts/ci/load-build-config.sh >> "$GITHUB_ENV"
      - name: Setup python
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.9
      - name: Install build tools
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/locks/build.txt
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build gcc nasm pkg-config
      - name: Fetch the Netflix 576x324 pair
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        run: bash scripts/test/fetch-test-yuvs.sh src01_hrc00_576x324.yuv src01_hrc01_576x324.yuv
      - name: Build libvmafx and the vmaf CLI
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        run: |
          # ADR-2170: this libvmaf build prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core core/build --buildtype release -Denable_metal=disabled \
            -Dwerror=true \
            $(scripts/ci/werror-args.sh true)
          ninja -C core/build
      - name: Install cosign
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Build FFmpeg with the vmafx filter
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        shell: bash
        env:
          FFMPEG_FIX_SERIES_VERIFY: cosign
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/ffmpeg"
          python3 scripts/ci/ffmpeg_patch_stack.py --check --keep-tree "$tree"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/core/build/meson-uninstalled"
          cd "$tree"
          ./configure --enable-version3 --enable-libvmafx \
            --disable-doc --disable-indevs --disable-outdevs
          grep -qE '^#define CONFIG_VMAFX_FILTER 1$' config_components.h
          make -j "$(getconf _NPROCESSORS_ONLN)" ffmpeg
      - name: Check the vmafx filter against the CLI
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A skip (77) is a failure here: every fixture of the golden pair is fetched above.
          for check in parity windows contract provenance; do
            echo "::group::vmafx_filter_check.py $check"
            python3 ffmpeg-patches/test/vmafx_filter_check.py "$check" \
              --ffmpeg "$RUNNER_TEMP/ffmpeg/ffmpeg" --vmaf core/build/tools/vmaf \
              --libdir core/build/src --pairs golden
            echo "::endgroup::"
          done
      - name: Check input colorimetry propagation
        if: steps.impact.outputs.mode == 'full' || steps.impact.outputs.c_core == 'true' || steps.impact.outputs.actions == 'true'
        shell: bash
        env:
          FFMPEG: ${{ runner.temp }}/ffmpeg/ffmpeg
          VMAF_CLI: core/build/tools/vmaf
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/core/build/src:${LD_LIBRARY_PATH:-}"
          bash ffmpeg-patches/test/check-vmafx-input-colorimetry.sh

  refresh:
    if: github.event_name == 'schedule'
    name: FFmpeg Release Refresh
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce FFmpeg input contract
        run: make ffmpeg-input-contract

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Refresh to the latest stable release
        id: refresh
        shell: bash
        env:
          FFMPEG_FIX_SERIES_VERIFY: cosign
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/ffmpeg-patch-refresh"
          mkdir -p "$output_dir"
          python3 scripts/ci/ffmpeg_patch_stack.py --refresh --latest --output-dir "$output_dir" \
            2>&1 | tee "$output_dir/workflow-command.log"

      - name: Record proposed refresh
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/ffmpeg-patch-refresh"
          mkdir -p "$output_dir"
          git diff --binary > "$output_dir/proposed-refresh.patch"
          git status --short > "$output_dir/worktree-status.txt"
          git rev-parse HEAD > "$output_dir/source-revision.txt"

      - name: Retain refresh proposal
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffmpeg-patch-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-patch-refresh/
          if-no-files-found: error
          retention-days: 14
      - name: Retain refresh proposal (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: ffmpeg-patch-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffmpeg-patch-refresh/
          if-no-files-found: error
          retention-days: 14
