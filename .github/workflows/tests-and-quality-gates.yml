# Top-level CI — orchestrates Netflix golden gate (ADR-0024 — must always pass)
# and the cross-backend numerical-correctness check. The pre-existing
# `libvmaf-build-matrix.yml` handles the cross-platform build matrix; this file
# owns the *correctness* gate.

name: Tests
# Tests — Netflix Golden / Sanitizers / Tiny AI / Coverage.
# The display name is deliberately short: GitHub's badge.svg paints it
# into the README status badge. See ADR-1227.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 — `ready_for_review` lets the per-job draft gate fire
    # CI when a draft PR is promoted to ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    # No trigger-level paths-ignore: every required job of this workflow
    # must report on every pull request (ADR-3293), and each job selects
    # its own work through the CI tier and the impact planner (ADR-2169,
    # ADR-1140). ADR-0341's docs-only paths-ignore no longer exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  tier:
    name: CI tier (Tests)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  # ===== Netflix golden-data gate (ADR-0024) =====
  # The 3 Netflix CPU test pairs (1 normal + 2 checkerboard) are the source of
  # truth for VMAF correctness. They MUST pass on every PR. No skips, no excuses.
  netflix-golden:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # D24
    # required-aggregator
    name: Netflix CPU Golden
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Netflix CPU Golden Tests skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Netflix CPU Golden Tests satisfied without running (ADR-1140)"
      - name: Install build deps
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          # pip unpacks every wheel it downloads into $TMPDIR before it
          # installs it, so the staging area — not just the install target —
          # has to be on disk. On the ubuntu-26.04 image /tmp is a RAM-backed
          # tmpfs and systemd v258 puts a per-user quota on it (80% of the
          # mount), which is what produced "[Errno 122] Disk quota exceeded".
          # RUNNER_TEMP is on the runner's disk and is emptied per job.
          TMPDIR: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            python3-pip
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-test-lock.txt

      - name: Build (CPU, release)
        if: steps.impact.outputs.golden_harness == 'true'
        # Build inside core/ so the CLI lands at core/build/tools/vmaf
        # — python/vmaf/__init__.py hardcodes that relative path when no
        # external vmaf binary is configured via vmaf_path() / vmafexec_path().
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Denable_cuda=false -Denable_sycl=false \
            -Denable_float=true -Denable_avx512=true --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build

      - name: Restore Netflix vmaf_resource fixtures
        id: fixtures
        # Restore-only; the save is split out below and gated on success().
        # The combined actions/cache action saves from a post-job step that runs even
        # when the job was CANCELLED or FAILED, and the key is content-hashed over
        # python/test/*_test.py, so any PR touching a Python test gets its own key. A
        # run cancelled part-way through then published a partially-populated
        # python/test/resource tree under that fresh key, and every later run on the
        # branch hit it EXACTLY. download_reactively (compat/python-vmaf/config.py)
        # re-fetches a fixture only when the file is ABSENT, so a short-but-present
        # file is never repaired. See the same split in build.yml.
        if: steps.impact.outputs.golden_harness == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Cache the entire python/test/resource tree — pytest's
          # download_reactively (python/vmaf/config.py) populates it
          # lazily and re-uses any pre-existing files. Sized at ~50 MB.
          path: python/test/resource
          # Bump the version suffix when test files reference new
          # fixture URLs. `restore-keys` lets stale caches partially
          # populate the dir; missing files re-download lazily.
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}
          restore-keys: |
            vmaf-fixtures-resource-v1-
            vmaf-fixtures-resource-

      - name: Drop unusable restored fixtures
        # A restored fixture that is empty, or that holds an HTML error page or
        # a Git-LFS pointer instead of the payload, is worse than a missing one:
        # download_reactively re-fetches only ABSENT files, so the bad copy is
        # never repaired and the test fails with "no frames decoded". The
        # success()-gated save below stops new poisoning; this heals caches
        # already poisoned, which otherwise need a manual cache deletion.
        # --restore-tracked: the cache also carries the files git tracks under
        # python/test/resource in the revision of the run that saved it; a
        # restore-keys hit writes them over this checkout, so they are put
        # back to the commit's (T-CI-FIXTURE-CACHE-STALE-TRACKED-2026-10-06).
        if: steps.impact.outputs.golden_harness == 'true'
        run: bash scripts/ci/prune-corrupt-fixtures.sh --restore-tracked python/test/resource

      - name: Run Netflix golden normal pair
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        timeout-minutes: 22
        run: |
          # The 3 pairs live in python/test/resource/yuv/ — see D24.
          # Hardcoded CPU score assertions live in the python/test/*_test.py files.
          #
          # Run only the D24 normal golden pair. The broader quality/feature
          # suites are covered elsewhere; this gate exists to protect the
          # Netflix CPU golden assertions, not to run every Python assertion.
          timeout --kill-after=30s 21m python3 -m pytest \
            python/test/quality_runner_test.py::QualityRunnerTest::test_run_vmaf_runner \
            -v --tb=short --timeout=1260 --timeout-method=signal

      - name: Run Netflix golden checkerboard pairs
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        timeout-minutes: 20
        run: |
          # The checkerboard test covers the 10-px and 1-px distorted
          # Netflix golden pairs. Keep it isolated so a slow 1080p golden
          # run reports the actual failing surface instead of masking the
          # normal-pair result.
          timeout --kill-after=30s 19m python3 -m pytest \
            python/test/quality_runner_test.py::QualityRunnerTest::test_run_vmaf_runner_checkerboard \
            -v --tb=short --timeout=1020 --timeout-method=signal

      - name: Save Netflix vmaf_resource fixtures
        # success() only: a cancelled or failing run must never publish a
        # partial fixture tree under this key. Placed after both golden pairs.
        if: ${{ success() && (steps.impact.outputs.golden_harness == 'true') && steps.fixtures.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}

  # ADR-0726: vulkan-vif-cross-backend, vulkan-parity-matrix-gate, and
  # vulkan-vif-arc-nightly jobs deleted (Vulkan backend removed).

  # ===== Upstream Consumer ABI Parity Gate (Issue #2473, ADR-3339) =====
  compat-abi-parity:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Compat ABI Parity
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Not impacted — Compat ABI Parity skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Compat ABI Parity satisfied without running (ADR-1140)"

      - name: Install build deps
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config python3-pip
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Restore Netflix vmaf_resource fixtures
        if: steps.impact.outputs.golden_harness == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-golden-fixtures-v3-${{ hashFiles('scripts/test/fetch-test-yuvs.sh') }}

      - name: Fetch Netflix fixtures if missing
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          mkdir -p python/test/resource/yuv
          bash scripts/test/fetch-test-yuvs.sh

      - name: Run Compat ABI Parity Probe
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          RESULTS: ${{ runner.temp }}/compat-abi-parity
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|fma|f16c|bmi)' | tr '\n' ' '
          echo
          gcc -Q --help=target | grep -E '^\s+-march=|^\s+-mfma '
          echo | gcc -dM -E - | grep -E '__(FMA|AVX2)__' || echo 'gcc default: no FMA/AVX2'
          dpkg --print-architecture; dpkg -s libc6 | grep -E '^(Version|Architecture)'
          python3 scripts/dev/upstream_parity.py --unpinned --abi --mode probe --jobs 2 \
            --summary --write-json "$RESULTS"

      - name: Upload Compat ABI Parity results
        if: failure() && steps.impact.outputs.golden_harness == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-abi-parity-results
          path: ${{ runner.temp }}/compat-abi-parity
          retention-days: 7

      - name: Run Compat ABI Planted Defect (Assert Failure)
        if: steps.impact.outputs.golden_harness == 'true'
        # Exit 1 (a difference) is the proof; exit 2 (cannot run) fails the step.
        run: |
          status=0
          python3 scripts/dev/upstream_parity.py --unpinned --abi --plant --mode probe --jobs 2 || status=$?
          test "$status" -eq 1 || { echo "::error::plant: expected exit 1, got $status"; exit 1; }

  # ===== Sanitizer build =====
  # required-aggregator: Sanitizers (address)
  # required-aggregator: Sanitizers (thread)
  # required-aggregator: Sanitizers (undefined)
  sanitizers:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    name: "Sanitizers (${{ matrix.sanitizer }})"
    # ADR-0359 — ARC self-hosted runner pilot (same pattern as cppcheck in
    # lint-and-format.yml). Variable `ARC_RUNNERS_ENABLED=true` routes this
    # job to the in-cluster `arc-runners` scale set; default `false` keeps
    # GitHub-hosted ubuntu-26.04. If the ARC pool is degraded, set the
    # variable to false and re-trigger CI to fall back instantly. A pull
    # request from a fork never reaches the pool (ADR-3286).
    runs-on: ${{ vars.ARC_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runners' || 'ubuntu-26.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Sanitizers skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Sanitizers satisfied without running (ADR-1140)"
      - name: Install deps
        if: steps.impact.outputs.c_core == 'true'
        run: |
          sudo apt-get update
          # lld-22 keeps the linker in the same LLVM major as the
          # apt.llvm.org clang-22 installed below; ld.bfd/gold pulls in
          # a system-wide LLVM 16 gold plugin that can't read clang-22 LTO
          # bitcode (Unknown attribute kind 91 in LLVM 16 reader). Using lld
          # keeps the linker in the same LLVM major as the compiler.
          # libclang-rt-22-dev ships the ASan/UBSan/TSan runtime libraries
          # (libclang_rt.asan.a etc.); without it clang-22 emits instrumented
          # code but lld-22 can't resolve __asan_*/__ubsan_* symbols.
          sudo apt-get install -y ninja-build nasm
          # LLVM 22 from apt.llvm.org: the ubuntu-24.04 image tops out at
          # clang 18.1.3, which accepts -std=c++26 but ships a libstdc++
          # without std::expected, so core/src/dict.cpp fails to build
          # (ADR-0692 moved the tree to C23 + C++26). Take the toolchain
          # forward rather than degrading the standard.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y clang-tools-22 libclang-rt-22-dev lld-22
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
      - name: Build with ${{ matrix.sanitizer }} sanitizer
        if: steps.impact.outputs.c_core == 'true'
        # ADR-0347: under UBSan, suppress the `function` check via
        # `-fno-sanitize=function`. The pre-existing K&R-prototype
        # `static char *test_X()` pattern across ~50 minunit-style
        # harness files (`core/test/test.h` + every `test_*.c`)
        # trips UBSan's function-pointer-type check unconditionally;
        # rewriting all 50 files to `(void)` is a separate T7-5-style
        # sweep PR. The suppression preserves UBSan signal on
        # library code while skipping the harness-only UB.
        working-directory: core
        shell: bash
        env:
          CC: clang-22
          CXX: clang++-22
          LDFLAGS: -fuse-ld=lld-22
        run: |
          if [ "${{ matrix.sanitizer }}" = "undefined" ]; then
            EXTRA_ARGS=( "-Dc_args=-fno-sanitize=function" "-Dcpp_args=-fno-sanitize=function" )
          else
            EXTRA_ARGS=()
          fi
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Db_sanitize=${{ matrix.sanitizer }} \
            -Denable_cuda=false -Denable_sycl=false --buildtype=debug \
            -Db_lto=false -Db_lundef=false "${EXTRA_ARGS[@]}" \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build
      - name: Prefetch Go modules for the suite
        if: steps.impact.outputs.c_core == 'true'
        # The suite's Go-running tests find their modules in the cache: the
        # download happens here, retried, and fails here when it cannot succeed
        # (scripts/ci/prefetch_go_modules.py, as the user the suite runs as).
        shell: bash
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run unit tests under sanitizer
        if: steps.impact.outputs.c_core == 'true'
        # ADR-0347: replace the previous `--suite=unit` invocation
        # (which matched zero tests because no `test()` call in
        # `core/test/meson.build` carries a `suite: 'unit'` tag).
        # We now run the full C unit-test set with a per-sanitizer
        # deselect list — each excluded test corresponds to a real
        # defect tracked in `docs/state.md` and removed from the list
        # when the underlying bug-fix PR lands. Companion research
        # digest: `docs/research/0090-sanitizer-matrix-test-scope.md`.
        # ASAN_OPTIONS / TSAN_OPTIONS allocator_may_return_null=1:
        # ASan's and TSan's malloc interceptors abort by default on
        # allocations they cannot fulfil (e.g. the intentionally-oversized
        # alloc in test_gpu_picture_pool_uaf which exercises the NULL-return
        # failure path of vmaf_gpu_picture_pool_init). With this flag the
        # sanitizer runtime returns NULL instead of aborting, matching the
        # POSIX malloc contract the test relies on.
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: allocator_may_return_null=1
        working-directory: core
        shell: bash
        run: |
          case "${{ matrix.sanitizer }}" in
            address)
              # ASan deselects: test_model (svm.cpp parser
              # alloc-too-big on malformed JSON) — pre-existing
              # ASan/LSan defects revealed by PR #758's introspect-based
              # test enumeration (the prior `meson test --list` parser
              # returned empty in CI's meson 1.3.2 so these tests were
              # never dispatched and the leaks went unnoticed). Tracked
              # in `docs/state.md` as T-SANITIZER-DEFECTS-REVEALED-758.
              # test_float_ms_ssim_min_dim was removed from this list
              # after confirming it passes cleanly under ASAN_OPTIONS=
              # detect_leaks=1 (the invoke_init helper already calls
              # fex->close() + free(priv) on every code path).
              EXCLUDE='test_model$'
              ;;
            undefined)
              # UBSan deselects: test_model (NULL-to-nonnull memcpy
              # in svm.cpp parser — same defect as ASan exclusion
              # surfaced via a different sanitizer angle). Tracked as
              # T-SANITIZER-DEFECTS-REVEALED-758.
              # test_cambi was removed from this list after PR #761
              # (merged 2026-05-11) added a runtime __builtin_cpu_supports
              # AVX2 gate to test_calculate_c_values_scalar_avx2_parity,
              # eliminating the SIGILL on non-AVX2 CI runners; confirmed
              # clean under UBSan on current master.
              EXCLUDE='test_model$'
              ;;
            thread)
              # TSan deselects: test_model (same defect as ASan/UBSan
              # exclusion above).
              # test_framesync was removed from this list after PR #548
              # (merged 2026-05-09) fixed the SAN-FRAMESYNC-MUTEX-DOMAIN
              # mutex-domain mismatch; nightly TSan job was green on
              # 2026-05-09 and 2026-05-10 (state.md entry).
              EXCLUDE='test_model$'
              ;;
            *)
              echo "::error::ADR-0347 deselect list is not defined for sanitizer=${{ matrix.sanitizer }}" >&2
              exit 1
              ;;
          esac
          # `meson test --list` output format varies across meson
          # versions (1.3.x produces empty output for some build
          # configurations; 1.11.x emits one test per line). Use
          # `meson introspect --tests` instead — its JSON output is
          # stable and machine-parseable across all supported meson
          # versions. Each test object has `name` and `suite[]` fields
          # which we join into the canonical `libvmaf:<name>` form
          # that meson test dispatch expects.
          TESTS=$(meson introspect build --tests \
                  | python3 -c 'import json,re,sys; excluded=re.compile(sys.argv[1]); [print("libvmaf:"+t["name"]) for t in json.load(sys.stdin) if excluded.search(t["name"]) is None]' "$EXCLUDE")
          echo "test count: $(echo "$TESTS" | wc -l)"
          echo "first 3: $(echo "$TESTS" | head -3 | tr '\n' ' ')"
          if [ -z "$TESTS" ]; then
            echo "::error::ADR-0347 test enumeration produced empty list for sanitizer=${{ matrix.sanitizer }}" >&2
            exit 1
          fi
          # --timeout-multiplier 3: the suite's timeouts are sized for an
          # uninstrumented build (docs/development/ci.md, "Sanitizer legs").
          # shellcheck disable=SC2086
          python3 ../scripts/ci/run_meson_test.py -- -C build --print-errorlogs \
            --timeout-multiplier 3 $TESTS

  # ===== DNN / tiny-AI gate =====
  # Builds libvmaf with --enable_dnn (ONNX Runtime C API), runs the dnn
  # meson suite, and exercises the ai/ Python package's unit tests. Does
  # NOT require ORT at configure time — stub branch is exercised when the
  # ubuntu runner doesn't have onnxruntime available via pkg-config.
  dnn:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Tiny AI
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Tiny AI skipped by plan
        if: steps.impact.outputs.tiny_ai != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::tiny_ai not impacted (mode=$MODE reason=$REASON) — Tiny AI satisfied without running (ADR-1140)"
      - name: Install build deps
        if: steps.impact.outputs.tiny_ai == 'true'
        run: |
          sudo apt-get update
          # ffmpeg: test_chug_extract_features_smoke.py encodes its clips with
          # it (ADR-1528: it skipped in CI on every run without it).
          sudo apt-get install -y ninja-build nasm pkg-config \
            python3-pip python3-venv ffmpeg
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
      - name: Install ONNX Runtime (CPU)
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          # Pinned to 1.22.0. MS stopped publishing Linux tgz artifacts
          # for patch releases (1.22.1, 1.22.2 are NuGet-only on the
          # releases page), so v1.22.0 is the last 1.22 line with a
          # functioning onnxruntime-linux-x64-${VERSION}.tgz. Bumping to
          # 1.23.x or 1.24.x is a separate decision since the dnn loader
          # is version-sensitive.
          ORT_VERSION: "1.22.0"
          ORT_SHA256: "8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3"
        run: |
          set -euo pipefail
          ort_name="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ort_archive="${RUNNER_TEMP}/${ort_name}"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_name}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --remove-on-error \
            --max-time 600 --output "${ort_archive}" \
            "${ort_url}"
          printf '%s  %s\n' "${ORT_SHA256}" "${ort_archive}" \
            | sha256sum --check --strict
          sudo tar -xzf "${ort_archive}" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          # Install a pkg-config file since the tarball ships none.
          sudo install -d /usr/local/lib/pkgconfig
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          prefix=/opt/onnxruntime
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libonnxruntime
          Description: ONNX Runtime C API
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          # Strip the leading YAML indent that `cat <<EOF` preserved.
          sudo sed -i 's/^          //' /usr/local/lib/pkgconfig/libonnxruntime.pc
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
      - name: Build libvmaf (dnn enabled)
        if: steps.impact.outputs.tiny_ai == 'true'
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Denable_cuda=false -Denable_sycl=false \
            -Denable_dnn=enabled --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build
      - name: Run meson dnn suite
        if: steps.impact.outputs.tiny_ai == 'true'
        working-directory: core
        run: python3 ../scripts/ci/run_meson_test.py -- -C build --suite=dnn --print-errorlogs
      - name: Set up Python + install vmaf-train
        if: steps.impact.outputs.tiny_ai == 'true'
        # Both the venv and pip's staging area live under RUNNER_TEMP, not
        # /tmp. On the ubuntu-26.04 image /tmp is a RAM-backed tmpfs with a
        # per-user quota (systemd v258 enables one on a tmpfs /tmp), and
        # `pip install -e ai` pulls torch, torchvision and the nvidia-*-cu13
        # wheel set — several gigabytes. Moving the venv alone is not enough:
        # pip downloads and unpacks each wheel into $TMPDIR first and only
        # then extracts it into the venv, so with TMPDIR unset the whole
        # wheel set still lands on the tmpfs and pip dies with
        # "[Errno 122] Disk quota exceeded". RUNNER_TEMP is on the runner's
        # disk and is emptied per job.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          venv="${RUNNER_TEMP}/vmaf-train-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --require-hashes \
            -r requirements/locks/package-build.txt
          "${venv}/bin/pip" install --require-hashes -r ai/requirements-dev-lock.txt
          "${venv}/bin/pip" install --no-deps --no-build-isolation -e ai
      - name: Fetch the Netflix golden YUV fixtures
        # test_e2e_frame_to_score.py scores the src01 pair; md5-checked.
        if: steps.impact.outputs.tiny_ai == 'true'
        run: bash scripts/test/fetch-test-yuvs.sh
      - name: Run ai/ pytests
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          # The binary this job built: the e2e and CHUG smoke tests run it
          # instead of skipping (ADR-1528). -rs prints every remaining skip
          # with its reason.
          VMAF_BIN: ${{ github.workspace }}/core/build/tools/vmaf
          VMAF_BIN_FOR_TESTS: ${{ github.workspace }}/core/build/tools/vmaf
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/pytest" ai/tests/ ai/sidecar/tests/ -v -rs --timeout=60 --timeout-method=signal
      # Suite mini-retrain (ADR-1898): the retrain tooling end to end on a generated
      # corpus, with the vmaf CLI this job built. Any skip fails the step.
      - name: Run the mini retrain end to end
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          VMAF_BIN: ${{ github.workspace }}/core/build/tools/vmaf
          VMAFX_CONTAINER_IMAGE_ID: github-hosted-ubuntu-26.04
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/pytest" ai/e2e/ -v -rs \
            --timeout=900 --timeout-method=signal \
            --basetemp="${RUNNER_TEMP}/mini-retrain-runs"
      # ADR-0174 / T5-3b: enforce that every quantised model in the
      # registry stays inside its per-model PLCC drop budget. Skips
      # entries whose `quant_mode == "fp32"` (nothing to gate).
      - name: Run ai-quant-accuracy gate
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          # Same reason as the venv step above: pip stages wheels in $TMPDIR.
          TMPDIR: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/python" ai/scripts/measure_quant_drop.py --all

  # ===== RC1 external tester report package =====
  rc1-tester-report:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1342: this shipped tester surface has no path-filtered or optional
    # branch, so its regression lane must report to the required aggregator.
    # required-aggregator
    name: RC1 Tester Report
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install locked RC1 tester package
        run: |
          python -m pip install --require-hashes \
            -r tools/rc1-tester/requirements-dev-lock.txt
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir dist/rc1-wheel ./tools/rc1-tester
          python -m pip install --no-deps dist/rc1-wheel/*.whl
      - name: Run RC1 tester regressions
        run: python -m pytest tools/rc1-tester/tests/ -q
      - name: Smoke installed tester launcher
        run: |
          python -c "from pathlib import Path; from vmaf_rc1_tester.probe import REPO_ROOT; assert REPO_ROOT == Path.cwd().resolve()"
          vmaf-rc1-report list-tools >/dev/null

  # ===== Test-suite registry + tooling suite (ADR-1528) =====
  # `.github/test-suites.json` maps every tracked test file to one suite and
  # every suite to the required checks that run it. This job fails when a test
  # file lies outside every suite (tools/vmaf-tune/tests and 60 script tests
  # once ran nowhere) and runs the tooling suite: every Python and shell test
  # under scripts/, dev/scripts/, ffmpeg-patches/test/, testdata/ and two tool
  # test directories. The tests read workflows, Dockerfiles and Meson files as
  # well as the scripts under test, so no path routing could prove a change
  # irrelevant: the job always runs.
  tooling-tests:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1528 — required and in strictMustReport: no path filter and no
    # conditional skip.
    # required-aggregator
    name: Tooling Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: check-source-adr-citations.py verifies the commits
          # that its retired-ADR records name (`git cat-file -e`), and
          # test_repository_registry_is_current runs it on this tree. A
          # shallow clone fails that test and skips the silent-revert history
          # test.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Every test file belongs to a suite that a required check runs
        run: python scripts/ci/suite_registry.py check
      - name: Install the tooling test lock and cppcheck
        # package-build first: the docs half of the lock has sdists that build
        # without isolation (the Docs job installs the docs lock the same way).
        # test_cppcheck_posix_model.py drives the distribution's cppcheck, the
        # one the Cppcheck job installs.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          python -m pip install --require-hashes -r requirements/locks/package-build.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r requirements/locks/tooling-tests.txt
      - name: Run the tooling suite
        # The lock installs clang-format at the pre-commit hook's pin; naming it
        # makes the API generator's format test fail instead of skip when the
        # installed binary is another major (hosted images ship older ones).
        env:
          VMAFX_CLANG_FORMAT: clang-format
        run: python scripts/ci/suite_registry.py run tooling

  # ===== Python package suites (ADR-1528) =====
  # One leg per package suite of .github/test-suites.json that no other job
  # runs. Each leg installs the package's manifest-owned hash lock, installs
  # the package itself with --no-deps --no-build-isolation, and runs the
  # suite with -rs, so every remaining skip prints its reason. CI does not
  # call nox (ADR-0914); `nox -s <session>` is the local equivalent.
  # required-aggregator: Python Package Tests (compat)
  # required-aggregator: Python Package Tests (dev-llm)
  # required-aggregator: Python Package Tests (vmaf-roi-score)
  python-package-tests:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1528 — required and in strictMustReport: the impact plan may skip
    # the work, but every leg runs and reports.
    name: Python Package Tests (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compat
            tests: compat/vmaf/tests
          - name: dev-llm
            tests: dev-llm/tests
          - name: vmaf-roi-score
            tests: tools/vmaf-roi-score/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Python package suite skipped by plan
        if: steps.impact.outputs.python != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
          SUITE: ${{ matrix.name }}
        run: echo "::notice::python not impacted (mode=$MODE reason=$REASON) — Python Package Tests ($SUITE) satisfied without running (ADR-1140)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.impact.outputs.python == 'true'
        with:
          python-version: "3.14.8"
      # One install step per leg: the lock checker
      # (scripts/ci/check_python_dependency_locks.py) accepts only literal lock
      # paths that the manifest owns, never a matrix variable.
      - name: Install the build backends
        if: steps.impact.outputs.python == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m pip install --require-hashes -r requirements/locks/package-build.txt
      - name: Install the compat suite's lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'compat'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r python/requirements-test-lock.txt
      - name: Install dev-llm and its lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'dev-llm'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r dev-llm/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e dev-llm
      - name: Install vmaf-roi-score and its lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'vmaf-roi-score'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r tools/vmaf-roi-score/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e tools/vmaf-roi-score
      - name: Run the suite
        if: steps.impact.outputs.python == 'true'
        env:
          TESTS: ${{ matrix.tests }}
        run: python -m pytest "$TESTS" -rs

  # ===== vmaf-tune suite (ADR-1528) =====
  # Ten vmaf-tune tests drive a real `vmaf` (ADR-0543 backend enforcement and
  # V5-1) on the golden pair. Rather than build libvmaf a second time, this job
  # takes the CLI MCP Smoke builds (artifact `vmaf-cli-mcp`, uploaded right
  # after its build, so a failing MCP test does not withhold it).
  vmaf-tune-tests:
    needs: [tier, mcp-smoke]
    if: ${{ !cancelled() && needs.tier.outputs.light == 'true' }}
    # ADR-1528 — required and in strictMustReport; the plan may skip the work.
    # required-aggregator
    name: Python Package Tests (vmaf-tune)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — vmaf-tune suite skipped by plan
        if: steps.impact.outputs.python != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::python not impacted (mode=$MODE reason=$REASON) — Python Package Tests (vmaf-tune) satisfied without running (ADR-1140)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.impact.outputs.python == 'true'
        with:
          python-version: "3.14.8"
      - name: Install vmaf-tune and its lock
        if: steps.impact.outputs.python == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --require-hashes -r requirements/locks/package-build.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r tools/vmaf-tune/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e tools/vmaf-tune
      - name: Download MCP Smoke's vmaf CLI
        if: steps.impact.outputs.python == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli
      - name: Unpack the vmaf CLI
        if: steps.impact.outputs.python == 'true'
        run: |
          tar -C "${RUNNER_TEMP}/vmaf-cli" -xf "${RUNNER_TEMP}/vmaf-cli/vmaf-cli.tar"
          "${RUNNER_TEMP}/vmaf-cli/tools/vmaf" --version
      - name: Install ffmpeg with libx265
        if: steps.impact.outputs.python == 'true'
        # The two real-x265 integration tests (test_codec_adapter_x265.py,
        # test_codec_adapter_x265_two_pass.py; ADR-1565) encode with the
        # distribution ffmpeg, which links libx265 (ffmpeg 8.0.1 on 26.04).
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep -E '^ V.* libx265 '
      - name: Fetch the Netflix golden YUV fixtures
        if: steps.impact.outputs.python == 'true'
        run: bash scripts/test/fetch-test-yuvs.sh
      - name: Run the suite
        if: steps.impact.outputs.python == 'true'
        env:
          VMAF_BIN_FOR_TESTS: ${{ runner.temp }}/vmaf-cli/tools/vmaf
          # Opt in to the real ffmpeg/libx265 tests (ADR-1565).
          VMAF_TUNE_INTEGRATION: "1"
        # The registry names the files (ADR-1568): a file another suite owns
        # runs in that suite's job, not here. A test that skips because it
        # cannot reach the binary or the golden YUVs fails the job: those are
        # this job's inputs, not optional; so are ffmpeg and its libx265.
        run: |
          set -o pipefail
          python scripts/ci/suite_registry.py list vmaf-tune > "${RUNNER_TEMP}/vmaf-tune-files.txt"
          mapfile -t files < "${RUNNER_TEMP}/vmaf-tune-files.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the registry lists no vmaf-tune test files" >&2
            exit 1
          fi
          python -m pytest "${files[@]}" -rs | tee "${RUNNER_TEMP}/vmaf-tune-pytest.log"
          if grep -E '^SKIPPED .*(no vmaf binary reachable|Netflix golden YUV fixtures not available|ffmpeg not on PATH|libx265 unavailable)' \
              "${RUNNER_TEMP}/vmaf-tune-pytest.log"; then
            echo "::error::vmaf-tune tests skipped for a missing vmaf binary or golden YUVs" >&2
            exit 1
          fi

  # ===== MCP smoke gate (T7-MCP-SMOKE-CI / Research-0034 gap #3) =====
  # Builds libvmaf with the full MCP transport matrix (sse + uds + stdio)
  # and exercises both the embedded C-side scaffold smoke (core/test/
  # test_mcp_smoke.c — pins the -ENOSYS contract per ADR-0209) and the
  # Python MCP server pytest suite under mcp-server/vmaf-mcp/tests/.
  #
  # Before this lane existed, only `supply-chain.yml::mcp-build` exercised
  # the MCP surface — and that just builds a wheel without running any
  # tests. The Python `tests/test_*.py` files and the C `test_mcp_smoke`
  # binary were never invoked in CI. This job closes that gap.
  #
  # Local repro:
  #   cd libvmaf && meson setup build-mcp \
  #     -Denable_cuda=false -Denable_sycl=false \
  #     -Denable_mcp=true -Denable_mcp_sse=true \
  #     -Denable_mcp_uds=true -Denable_mcp_stdio=true && \
  #   meson compile -C build-mcp && \
  #   python3 ../scripts/ci/run_meson_test.py -- -C build-mcp test_mcp_smoke --print-errorlogs
  #   cd ../mcp-server/vmaf-mcp && \
  #   python3 -m venv ~/.cache/mcp-venv && \
  #   ~/.cache/mcp-venv/bin/pip install -e .[dev] && \
  #   ~/.cache/mcp-venv/bin/pytest tests/ -v
  mcp-smoke:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1297 — required, and in `strictMustReport`: it builds all four
    # enable_mcp* transports and runs the MCP server suite, a shipped
    # user-discoverable surface, and it has no path filter or conditional
    # skip, so absence is never a legitimate outcome.
    # required-aggregator
    name: MCP Smoke
    runs-on: ubuntu-26.04
    # Most runs take 11 minutes, almost all of it the libvmaf build, so a
    # 12-minute limit cancelled a green run on master (6fd838262). Keep about
    # twice the observed maximum.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          # libav*-dev pulled in for parity with the netflix-golden /
          # vulkan-vif-cross-backend lanes — keeps the libvmaf build
          # graph identical so the MCP smoke exercises the same
          # configuration the rest of the matrix sees.
          sudo apt-get install -y ninja-build nasm pkg-config \
            python3-pip python3-venv \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Build libvmaf (full MCP transport matrix)
        # Mirrors the local-lint configuration documented in
        # lint-and-format.yml (core/build-mcp/ with all four
        # enable_mcp* flags) so this lane sees identical symbol
        # availability. Disabling CUDA / SYCL keeps the build
        # ubuntu-hosted-runner-only — no GPU toolchain required.
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-mcp \
            -Denable_cuda=false -Denable_sycl=false \
            -Denable_mcp=true -Denable_mcp_sse=enabled \
            -Denable_mcp_uds=true -Denable_mcp_stdio=true \
            --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build-mcp

      - name: Pack the vmaf CLI for the vmaf-tune suite
        # tar keeps the executable bit and the RUNPATH layout
        # ($ORIGIN/../src) that an artifact zip would lose (ADR-1528).
        # The SONAME chain only (files and symlinks): a glob would also take
        # Meson's object directory libvmaf.so.<version>.p/.
        working-directory: core/build-mcp
        run: |
          find src -maxdepth 1 \( -name 'libvmaf.so*' -o -name 'libvmafx.so*' \) \( -type f -o -type l \) \
            > "${RUNNER_TEMP}/vmaf-cli.list"
          tar -cf "${RUNNER_TEMP}/vmaf-cli.tar" tools/vmaf -T "${RUNNER_TEMP}/vmaf-cli.list"

      - name: Upload the vmaf CLI for the vmaf-tune suite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli.tar
          retention-days: 1
          if-no-files-found: error

      - name: Run embedded MCP C smoke test
        # ADR-0209 / T5-2: pins the -ENOSYS contract on every public
        # vmaf_mcp_* entry point so a future runtime PR (T5-2b) cannot
        # silently wire a transport without flipping the expectations.
        # The test is registered as `test_mcp_smoke` in core/test/
        # meson.build (no suite tag — it lands in the default suite).
        # The libvmaf compat checks run here too, because only this build
        # has the vmaf_mcp_* compat functions (ADR-2094): their conformance
        # against the engine's bodies and the export list with them.
        working-directory: core
        run: >-
          python3 ../scripts/ci/run_meson_test.py --
          -C build-mcp test_mcp_smoke test_compat_conformance
          check_exported_symbols check_exported_symbols_libvmaf
          --print-errorlogs

      - name: Set up Python venv + install vmaf-mcp[dev]
        # The pyproject ships a `dev` extras group (pytest +
        # pytest-asyncio + ruff + mypy). There is no `[test]` extras —
        # `dev` is the right name. Editable install so test_smoke_e2e.py
        # resolves the repo root via __file__.parents[3].
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # RUNNER_TEMP, not /tmp: see the Tiny AI job's venv step. TMPDIR
          # is redirected there too, because pip stages wheels in $TMPDIR.
          venv="${RUNNER_TEMP}/mcp-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --require-hashes \
            -r requirements/locks/package-build.txt
          "${venv}/bin/pip" install --require-hashes \
            -r mcp-server/vmaf-mcp/requirements-dev-lock.txt
          "${venv}/bin/pip" install --no-deps --no-build-isolation \
            -e mcp-server/vmaf-mcp

      - name: Fetch the Netflix golden YUV fixtures
        # test_server.py, test_smoke_e2e.py and test_score_extras_adr1117.py
        # score the src01 pair; without it they skipped (ADR-1528).
        run: bash scripts/test/fetch-test-yuvs.sh

      - name: Run Python MCP server pytests
        # The MCP server's `_vmaf_binary()` defaults to
        # `<repo-root>/build/tools/vmaf` (`Path(__file__).parents[4]`
        # is the top-level repo root, not `core/`). The CI build
        # lives at `core/build-mcp/tools/vmaf`, so point
        # `VMAF_BIN` there explicitly so
        # test_call_tool_list_backends_includes_cpu's `_list_backends`
        # probe returns `cpu: True`.
        env:
          VMAF_BIN: ${{ github.workspace }}/core/build-mcp/tools/vmaf
        run: |
          test -x "$VMAF_BIN" || {
            echo "vmaf binary missing at $VMAF_BIN" >&2
            ls -la "$(dirname "$VMAF_BIN")" >&2 ||
              echo "::warning::cannot list $(dirname "$VMAF_BIN")" >&2
            exit 1
          }
          "${RUNNER_TEMP}/mcp-venv/bin/pytest" mcp-server/vmaf-mcp/tests/ -v -rs --tb=short \
            --timeout=60 --timeout-method=signal

  # ===== Coverage gate (principles.md §3) =====
  # ≥70% overall line coverage, ≥85% on security-critical files
  # (core/src/dnn/, opt.c, read_json_model.c).
  coverage:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    # ADR-1297 — required, and in `strictMustReport`. This job enforces the
    # principles.md §3 line-coverage floors and the per-PR delta tolerance
    # (ADR-0922). It self-skips in-job via plan-ci-impact.py (ADR-1140)
    # rather than by path filter, so it always reports and `skipped` is never
    # its outcome. Leaving it ungated re-opened, from the other side, the
    # same hole as the `|| true` this branch removed: `Coverage GPU`, the
    # self-hosted sibling that legitimately skips, was gated while this one
    # was not.
    # required-aggregator
    name: Coverage Gate
    runs-on: ubuntu-26.04
    # 75, not 30: the Python suite (four shard steps below, about 33 minutes
    # together on master 777647fc0) and the rest of the job (apt + pip, the
    # gcov build, the meson unit suite, gcovr; ~5.5 minutes) leave room for a
    # runner 1.5x slower than that measurement.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Coverage Gate skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Coverage Gate satisfied without running (ADR-1140)"
      - name: Install deps
        id: coverage_install_deps
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          # The hosted runner ships pre-provisioned Microsoft/Azure apt
          # sources (packages.microsoft.com) that intermittently 403 /
          # "no longer signed", failing `apt-get update` with exit 100
          # (observed on the Coverage Gate 2026-06-13). vmaf needs none of
          # them — drop them before updating. See T-CI-APT-MS-REPO-FLAKE.
          # rm -f succeeds when a pattern matches nothing.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config gcc \
            python3-pip
          # meson from PyPI: Ubuntu 24.04 ships meson 1.3.2, which predates `c23`
          # in c_std (added in meson 1.4.0) and fails configure since ADR-0692.
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          # gcovr replaces lcov: it deduplicates .gcno files belonging to
          # the same source compiled into multiple targets (libvmaf.so +
          # each test_X.p/.._src_X.c.gcda), which lcov sums and yields
          # impossible >100% hit counts (e.g. dnn_api.c — 1176%). gcovr
          # also produces both Cobertura XML for CI tooling and a JSON
          # summary the gate script parses directly. See ADR-0110.
          # setuptools>=77.0.1: the runner image ships 68.1.2 in
          # /usr/lib/python3/dist-packages and `pip install --user` leaves it
          # there, but python/pyproject.toml declares its license as a PEP 639
          # SPDX expression, which only setuptools 77+ parses. Without this the
          # ambient interpreter cannot run `python/setup.py` at all — which is
          # how setup_metadata_test.py failed the first time this lane ran the
          # whole Python suite to completion.
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-coverage-lock.txt
          # The editable install compiles vmaf.core.adm_dwt2_cy, as tox does
          # (python/tox.ini commands_pre); cy_test.py imports it. Without it
          # the suite ignored cy_test.py since #18 (ADR-1528).
          python3 -m pip install --user --no-deps --no-build-isolation -e python
      # Cache the ORT GPU .tgz so we don't re-download ~150 MB from
      # github.com/microsoft/onnxruntime/releases on every Coverage Gate
      # run. Key is purely the ORT version pinned in the env block of the
      # next step — the artifact bytes are immutable per release. See
      # Research-0089 (PR #525) §2 for the wall-clock evidence (Coverage
      # Gate p50 = 13.32 min, the ORT download contributes ~30–60 s of
      # that on a cold runner).
      - name: Cache ONNX Runtime tarball
        if: steps.impact.outputs.golden_harness == 'true'
        id: cache-ort
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ort-cache
          key: ort-tarball-linux-x64-gpu-1.22.0
      - name: Install ONNX Runtime (GPU build, CPU + CUDA EPs)
        id: coverage_install_ort
        if: steps.impact.outputs.golden_harness == 'true'
        # The GPU .tgz bundles CPU + CUDA + TensorRT execution providers in
        # one package. We install it (instead of the smaller CPU-only build)
        # so the coverage gate can also exercise the CUDA EP-attach success
        # arms in ort_backend.c — which on a CPU-only ORT remained
        # unreachable per ADR-0112. CUDA EP attach only requires the CUDA
        # *runtime* library to load (no actual GPU driver), which is why we
        # `apt install libcudart12` below. CreateSession then fails because
        # there's no real GPU on a hosted runner; vmaf_ort_open's two-stage
        # fallback (ADR-0113) catches that and retries with CPU-only
        # session_options, so existing tests stay green while the EP-attach
        # success arm and the new fallback path both execute.
        env:
          ORT_VERSION: "1.22.0"
          ORT_SHA256: "2a19dbfa403672ec27378c3d40a68f793ac7a6327712cd0e8240a86be2b10c55"
        run: |
          set -euo pipefail
          # CUDA 12.x runtime — user-space libs only, no driver. Lets ORT
          # dlopen libonnxruntime_providers_cuda.so → libcudart.so.12.
          sudo apt-get install -y libcudart12 || sudo apt-get install -y nvidia-cuda-toolkit
          # Reuse cached tarball if present (cache hit), otherwise fetch
          # and populate the cache for the next run.
          mkdir -p "${RUNNER_TEMP}/ort-cache"
          tarball="${RUNNER_TEMP}/ort-cache/onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz"
          if [ ! -f "$tarball" ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 600 -o "$tarball" \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz"
          fi
          if ! printf '%s  %s\n' "${ORT_SHA256}" "$tarball" | sha256sum --check --strict; then
            rm -f "$tarball"
            exit 1
          fi
          sudo tar -xzf "$tarball" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-gpu-${ORT_VERSION}" /opt/onnxruntime
          sudo install -d /usr/local/lib/pkgconfig
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          prefix=/opt/onnxruntime
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libonnxruntime
          Description: ONNX Runtime C API
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          sudo sed -i 's/^          //' /usr/local/lib/pkgconfig/libonnxruntime.pc
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
      - name: Build with gcov instrumentation
        id: coverage_build
        if: steps.impact.outputs.golden_harness == 'true'
        # Build inside core/ so python/vmaf/__init__.py finds the CLI at
        # core/build-coverage/tools/vmaf (it hardcodes that relative path).
        working-directory: core
        run: |
          # AVX-512 on so SIMD paths are exercised. enable_dnn=enabled +
          # ORT installed above so dnn/*.c contribute real coverage (not
          # stubs).
          #
          # -fprofile-update=atomic fixes the intra-process race where SIMD
          # inner loops (vif_avx2, motion_avx2, etc.) increment the same
          # 64-bit gcov counter from multiple threads and produce negative
          # values gcovr/geninfo reject. See ADR-0110.
          #
          # The companion fix lives in the test step below: --num-processes 1
          # serialises meson test execution so multiple test binaries don't
          # concurrently merge their counters into the same .gcda files for
          # the shared libvmaf.so. atomic is per-thread, not per-process —
          # the two fixes are complementary.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-coverage --buildtype=debug \
            -Db_coverage=true -Denable_cuda=false -Denable_sycl=false \
            -Denable_float=true -Denable_avx512=true \
            -Denable_dnn=enabled \
            -Dc_args=-fprofile-update=atomic \
            -Dcpp_args=-fprofile-update=atomic \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          ninja -C build-coverage
      - name: Prefetch Go modules for the suite
        id: coverage_prefetch_go
        if: steps.impact.outputs.golden_harness == 'true'
        # The suite's Go-running tests find their modules in the cache: the
        # download happens here, retried, and fails here when it cannot succeed
        # (scripts/ci/prefetch_go_modules.py, as the user the suite runs as).
        run: python3 scripts/ci/prefetch_go_modules.py
      # --timeout-multiplier 3: the suite's timeouts are sized for an
      # uninstrumented build (docs/development/ci.md, "Sanitizer legs").
      - name: Run meson unit suite (with gcov counters)
        id: coverage_meson_suite
        if: steps.impact.outputs.golden_harness == 'true'
        working-directory: core
        run: >-
          python3 ../scripts/ci/run_meson_test.py -- -C build-coverage
          --print-errorlogs --num-processes 1 --timeout-multiplier 3
      - name: Prepare the Python test suite (instrumented libvmaf.so + vmaf CLI)
        id: coverage_prepare_python
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          # python/vmaf/__init__.py hardcodes core/build/tools/vmaf as the
          # CLI path. Symlink build-coverage → build so coverage runs find it.
          ln -sf build-coverage core/build
          echo "${{ github.workspace }}/core/build-coverage/tools" >> "$GITHUB_PATH"
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/pytest-timeout.txt
          # The suite runs as four round-robin shards of one step each
          # (scripts/ci/run_pytest_shard.py): about 890 items took 33 minutes
          # in one step (master 777647fc0, job 117249828983), above praetor's
          # 30-minute bound on a test step. gcov counters in the .gcda files
          # add up across the four processes, so gcovr below sees the whole
          # suite. Every shard keeps the unsharded command line:
          # - --deselect matches nothing and -m "not slow" selects everything:
          #   python/tox.ini makes python/ the rootdir, so node ids read
          #   test/command_line_test.py::…, and no test is marked slow
          #   (measured 2026-09-22, jobs 106740470243 and 106785621316). Both
          #   stay so the suite that runs is the suite that is measured.
          # - --timeout=600 with the thread method aborts the whole session
          #   when one test crosses it. It covers the slowest test measured
          #   (vifks360o97, 142.7 s) times the worst runner inflation seen
          #   (2.30x) with a 1.8x margin.
          # - The outer `timeout` only keeps a wedged vmaf subprocess from
          #   eating the job budget before gcovr runs; a shard took about
          #   9 minutes in the measured job.
      - name: Run Python test suite, shard 1/4
        id: python_coverage_shard_1
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 1/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 2/4
        id: python_coverage_shard_2
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 2/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 3/4
        id: python_coverage_shard_3
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 3/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 4/4
        id: python_coverage_shard_4
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 4/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Gather coverage report (gcovr)
        if: ${{ always() && steps.impact.outputs.golden_harness == 'true' }}
        working-directory: core
        run: |
          # gcovr deduplicates .gcno files belonging to the same source
          # compiled into multiple targets — fixes the lcov over-counting
          # that produced dnn_api.c — 1176%. Output:
          #   - coverage.xml (Cobertura, for downstream tooling)
          #   - coverage.json (machine-readable summary the gate parses)
          #   - coverage.txt (human-readable, surfaced in CI logs)
          # Suspicious/negative hit warnings on hot inner loops (e.g.
          # 4.9 G hits on a 5x5 filter inner loop across
          # an HD frame batch — real, not a gcov bug) are filtered out so
          # the Coverage Gate stays warning-free. Underlying data is still
          # ingested via the .warn settings; only the chatty stderr line is
          # dropped. See ADR-0117.
          ~/.local/bin/gcovr --root .. \
              --filter 'src/.*' \
              --exclude '.*/test/.*' \
              --exclude '.*/tests/.*' \
              --exclude '.*/subprojects/.*' \
              --gcov-ignore-parse-errors=negative_hits.warn \
              --gcov-ignore-parse-errors=suspicious_hits.warn \
              --print-summary \
              --txt build-coverage/coverage.txt \
              --json-summary build-coverage/coverage.json \
              --xml build-coverage/coverage.xml \
              build-coverage \
            2> >(grep -vE 'Ignoring (suspicious|negative) hits' >&2)
          echo "----- Per-file summary -----"
          cat build-coverage/coverage.txt
      - name: Enforce coverage thresholds
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          # docs/principles.md §3 targets: 70% overall, 85% critical (dnn/,
          # opt.c, read_json_model.c). Applies to upstream + fork-added code:
          # we've already linted upstream heavily (clang-tidy cleanup rounds
          # 2-4) and will keep modifying it (SIMD fixes, refactors), so the
          # safety net has to cover everything we might touch.
          #
          # Floor history (ADR-0637):
          #   40% — original floor (meson unit suite + Python feature/CLI tests)
          #   37% — 2026-05-19 merge burst (PRs #1417, #1418, #1424, #1425)
          #          added ~2 200 LOC of new MCP/HIP/DNN/scaffold C that the
          #          existing test suite does not yet reach, diluting overall
          #          coverage from ~39% to 37.7%. The floor tracks the measured
          #          floor, not the aspirational target; ratchet upward as
          #          targeted tests land for those paths.
          scripts/ci/coverage-check.sh core/build-coverage/coverage.json 37 85
      - name: Upload coverage artifact
        if: ${{ (always()) && steps.impact.outputs.golden_harness == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-cpu
          path: |
            core/build-coverage/coverage.xml
            core/build-coverage/coverage.json
            core/build-coverage/coverage.txt
          retention-days: 14
      - name: Assert every Python coverage shard passed
        if: ${{ always() && steps.impact.outputs.golden_harness == 'true' }}
        env:
          SHARD_OUTCOMES: >-
            ${{ steps.python_coverage_shard_1.outcome }}
            ${{ steps.python_coverage_shard_2.outcome }}
            ${{ steps.python_coverage_shard_3.outcome }}
            ${{ steps.python_coverage_shard_4.outcome }}
          # A shard is skipped when a step before it failed; the error names
          # that step (run 39006126494: the meson suite timed out and the
          # shards only reported "skipped").
          EARLIER_OUTCOMES: >-
            Install-deps=${{ steps.coverage_install_deps.outcome }}
            Install-ONNX-Runtime=${{ steps.coverage_install_ort.outcome }}
            Build-with-gcov=${{ steps.coverage_build.outcome }}
            Prefetch-Go-modules=${{ steps.coverage_prefetch_go.outcome }}
            Meson-unit-suite=${{ steps.coverage_meson_suite.outcome }}
            Prepare-Python-suite=${{ steps.coverage_prepare_python.outcome }}
        run: |
          read -r -a outcomes <<< "$SHARD_OUTCOMES"
          if [[ "${#outcomes[@]}" -ne 4 ]]; then
            echo "::error::expected 4 shard outcomes, got '$SHARD_OUTCOMES'" >&2
            exit 1
          fi
          read -r -a earlier <<< "$EARLIER_OUTCOMES"
          cause="no earlier step failed"
          for entry in "${earlier[@]}"; do
            if [[ "${entry#*=}" != "success" ]]; then
              cause="step ${entry%%=*} outcome was ${entry#*=}"
              break
            fi
          done
          failed=0
          for index in "${!outcomes[@]}"; do
            if [[ "${outcomes[index]}" == "skipped" ]]; then
              echo "::error::Python coverage shard $((index + 1))/4 outcome was skipped: $cause" >&2
              failed=1
            elif [[ "${outcomes[index]}" != "success" ]]; then
              echo "::error::Python coverage shard $((index + 1))/4 outcome was ${outcomes[index]}" >&2
              failed=1
            fi
          done
          exit "$failed"

  # ===== GPU coverage admission (hosted) =====
  # ADR-1319: the operator switch is not dispatch authority. Check the live
  # runner inventory on hosted compute first so a stale true variable cannot
  # leave a job queued forever on an impossible label set.
  gpu-full-runner-available:
    needs: tier
    if: needs.tier.outputs.full == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Probe GPU Full Runner
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
      registered: ${{ steps.probe.outputs.registered }}
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check gpu-full runner availability
        id: probe
        env:
          # Existing read-only repository runner token; no new secret or
          # external runner mutation is required by this repository fix.
          GH_TOKEN: ${{ secrets.SYCL_RUNNER_PROBE_TOKEN || github.token }}
          RUNNER_ENABLED: ${{ vars.GPU_COVERAGE_ENABLED }}
          RUNNER_LABELS: "self-hosted linux gpu-full"
          RUNNER_DISPLAY_NAME: "Coverage GPU"
          RUNNER_SWITCH_NAME: "GPU_COVERAGE_ENABLED"
          RUNNER_RUNBOOK: "docs/development/self-hosted-runner.md"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/check-runner-available.sh

  # ===== GPU coverage (self-hosted) =====
  # Exercises fork-added CUDA / SYCL kernels, GPU runtime glue, and
  # AVX-512 SIMD paths that hosted runners can't touch. Runs on a self-hosted
  # runner labeled `gpu-full` (NVIDIA CUDA + Intel Arc SYCL +
  # AVX-512 CPU). See docs/development/self-hosted-runner.md for setup.
  #
  # The two-week stability window closed on 2026-06-02. Keep this required;
  # the promotion was recorded in the changelog, but a later stale merge
  # restored the advisory workflow body.
  coverage-gpu:
    # required-aggregator
    name: Coverage GPU
    needs: [gpu-full-runner-available]
    if: needs.gpu-full-runner-available.outputs.available == 'true'
    runs-on: [self-hosted, linux, gpu-full]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          # Full history for the merge-base tests of the suite
          # (scripts/ci/tests/test_meson_suite_checkout_history.py).
          fetch-depth: 0
      - name: Build with gcov + CUDA + SYCL + AVX-512
        working-directory: core
        env:
          # icpx required for SYCL link — see core/src/meson.build.
          CC: icx
          CXX: icpx
        run: |
          # See CPU coverage job for -fprofile-update=atomic rationale.
          # GPU build also runs SIMD CPU paths, so the same .gcda race applies.
          # b_lto=false: see libvmaf-build-matrix.yml note. Coverage build
          # uses --buildtype=debug which already disables LTO, but make it
          # explicit to avoid a future buildtype change re-introducing the
          # icx + -flto=auto incompatibility.
          bash -e -o pipefail -c '
            source /opt/intel/oneapi/setvars.sh
            # ADR-1360: coverage needs no AOT device images; the self-hosted
            # host has no ocloc, so build the SPIR-V JIT path only.
            meson setup build-coverage-gpu --buildtype=debug \
              -Db_coverage=true -Db_lto=false \
              -Denable_cuda=true -Denable_sycl=true \
              -Dsycl_icpx_aot_targets= \
              -Denable_float=true -Denable_avx512=true \
              -Dc_args=-fprofile-update=atomic \
              -Dcpp_args=-fprofile-update=atomic \
              -Dwerror=true $(../scripts/ci/werror-args.sh true)
            ninja -C build-coverage-gpu
          '
      - name: Prefetch Go modules for the suite
        # The suite's Go-running tests find their modules in the cache: the
        # download happens here, retried, and fails here when it cannot succeed
        # (scripts/ci/prefetch_go_modules.py, as the user the suite runs as).
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run meson unit suite
        working-directory: core
        # See CPU coverage job for --num-processes 1 rationale: serialise
        # to keep multi-process .gcda merges race-free. --timeout-multiplier 3:
        # the suite's timeouts are sized for an uninstrumented build
        # (docs/development/ci.md, "Sanitizer legs").
        run: >-
          python3 ../scripts/ci/run_meson_test.py -- -C build-coverage-gpu
          --print-errorlogs --num-processes 1 --timeout-multiplier 3
      - name: Run Python suite on CUDA + SYCL backends
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage-gpu/src
        run: |
          export PATH="${{ github.workspace }}/core/build-coverage-gpu/tools:$PATH"
          # setuptools>=77.0.1: the runner image ships 68.1.2 in
          # /usr/lib/python3/dist-packages and `pip install --user` leaves it
          # there, but python/pyproject.toml declares its license as a PEP 639
          # SPDX expression, which only setuptools 77+ parses. Without this the
          # ambient interpreter cannot run `python/setup.py` at all — which is
          # how setup_metadata_test.py failed the first time this lane ran the
          # whole Python suite to completion.
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-coverage-lock.txt
          # Scope GPU test runs with VMAF_FORCE_BACKEND away from the Netflix golden assertions
          # (ADR-0024 / AGENTS.md §8) to avoid failing on ULP-relaxed GPU float differences.
          VMAF_FORCE_BACKEND=cuda python3 -m pytest python/test/ -v \
            -c python/tox.ini \
            -m "not slow" --tb=short --ignore=python/test/resource \
            --ignore=python/test/quality_runner_test.py \
            --ignore=python/test/feature_extractor_test.py \
            --ignore=python/test/vmafexec_test.py \
            --ignore=python/test/vmafexec_feature_extractor_test.py \
            --ignore=python/test/result_test.py \
            --timeout=300 --timeout-method=signal
          VMAF_FORCE_BACKEND=sycl python3 -m pytest python/test/ -v \
            -c python/tox.ini \
            -m "not slow" --tb=short --ignore=python/test/resource \
            --ignore=python/test/quality_runner_test.py \
            --ignore=python/test/feature_extractor_test.py \
            --ignore=python/test/vmafexec_test.py \
            --ignore=python/test/vmafexec_feature_extractor_test.py \
            --ignore=python/test/result_test.py \
            --timeout=300 --timeout-method=signal
      - name: Gather coverage report (gcovr)
        working-directory: core
        run: |
          # Same gcovr migration as CPU coverage job (see ADR-0110); same
          # suspicious-hits stderr filter as the CPU job (see ADR-0117).
          python3 -m pip install --user --require-hashes \
            -r ../requirements/locks/gcovr.txt
          ~/.local/bin/gcovr --root .. \
              --filter 'src/.*' \
              --exclude '.*/test/.*' \
              --exclude '.*/tests/.*' \
              --exclude '.*/subprojects/.*' \
              --gcov-ignore-parse-errors=negative_hits.warn \
              --gcov-ignore-parse-errors=suspicious_hits.warn \
              --print-summary \
              --txt build-coverage-gpu/coverage.txt \
              --json-summary build-coverage-gpu/coverage.json \
              --xml build-coverage-gpu/coverage.xml \
              build-coverage-gpu \
            2> >(grep -vE 'Ignoring (suspicious|negative) hits' >&2)
          cat build-coverage-gpu/coverage.txt
      - name: Enforce coverage thresholds (GPU)
        run: |
          scripts/ci/coverage-check.sh core/build-coverage-gpu/coverage.json 70 85
      - name: Upload GPU coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-gpu
          path: |
            core/build-coverage-gpu/coverage.xml
            core/build-coverage-gpu/coverage.json
            core/build-coverage-gpu/coverage.txt
          retention-days: 14

  # ===== Power of 10 rule 5 — assertion density =====
  # Every fork-added (non-trivial) function must contain ≥1 assert().
  assertion-density:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # Power of 10 §5
    # required-aggregator
    name: Assertion Density
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Assertion Density skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Assertion Density satisfied without running (ADR-1140)"
      - name: Run assertion density scanner
        if: steps.impact.outputs.c_core == 'true'
        run: bash scripts/ci/assertion-density.sh
