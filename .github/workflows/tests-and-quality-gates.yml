# ADR-0024 (design notes)
# Design notes for this workflow: docs/development/ci-workflow-notes/tests-and-quality-gates.md

name: Tests
# ADR-1227 (design notes)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ADR-0331 (design notes)
    types: [opened, synchronize, reopened, ready_for_review]
    # ADR-0341, ADR-1140, ADR-2169, ADR-3293 (design notes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  tier:
    name: CI tier (Tests)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  # ADR-0024 (design notes)
  netflix-golden:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # D24
    # required-aggregator
    name: Netflix CPU Golden
    runs-on: ubuntu-26.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Netflix CPU Golden Tests skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Netflix CPU Golden Tests satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-netflix-golden-${{ hashFiles('.github/apt/netflix-golden.txt') }}

      - name: Install build deps
        id: apt-install
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 28
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/netflix-golden.txt
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-test-lock.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-netflix-golden-${{ hashFiles('.github/apt/netflix-golden.txt') }}

      - name: Build (CPU, release)
        if: steps.impact.outputs.golden_harness == 'true'
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Denable_cuda=false -Denable_sycl=false \
            -Denable_float=true -Denable_avx512=true --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build

      - name: Restore Netflix vmaf_resource fixtures
        id: fixtures
        if: steps.impact.outputs.golden_harness == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}
          restore-keys: |
            vmaf-fixtures-resource-v1-
            vmaf-fixtures-resource-

      - name: Drop unusable restored fixtures
        if: steps.impact.outputs.golden_harness == 'true'
        run: bash scripts/ci/prune-corrupt-fixtures.sh --restore-tracked python/test/resource

      - name: Run Netflix golden normal pair
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        timeout-minutes: 22
        run: |
          timeout --kill-after=30s 21m python3 -m pytest \
            python/test/quality_runner_test.py::QualityRunnerTest::test_run_vmaf_runner \
            -v --tb=short --timeout=1260 --timeout-method=signal

      - name: Run Netflix golden checkerboard pairs
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        timeout-minutes: 20
        run: |
          timeout --kill-after=30s 19m python3 -m pytest \
            python/test/quality_runner_test.py::QualityRunnerTest::test_run_vmaf_runner_checkerboard \
            -v --tb=short --timeout=1020 --timeout-method=signal

      - name: Save Netflix vmaf_resource fixtures
        if: ${{ success() && (steps.impact.outputs.golden_harness == 'true') && steps.fixtures.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-fixtures-resource-v1-${{ hashFiles('python/test/*_test.py', 'python/test/resource/test_*.py') }}

  # ADR-0726 (design notes)

  # ADR-3339 (design notes)
  compat-abi-parity:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Compat ABI Parity
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Not impacted — Compat ABI Parity skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Compat ABI Parity satisfied without running (ADR-1140)"

      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-compat-abi-parity-${{ hashFiles('.github/apt/compat-abi-parity.txt') }}

      - name: Install build deps
        id: apt-install
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/compat-abi-parity.txt
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-compat-abi-parity-${{ hashFiles('.github/apt/compat-abi-parity.txt') }}

      - name: Restore Netflix vmaf_resource fixtures
        if: steps.impact.outputs.golden_harness == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: python/test/resource
          key: vmaf-golden-fixtures-v3-${{ hashFiles('scripts/test/fetch-test-yuvs.sh') }}

      - name: Fetch Netflix fixtures if missing
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          mkdir -p python/test/resource/yuv
          bash scripts/test/fetch-test-yuvs.sh

      - name: Run Compat ABI Parity Probe
        if: steps.impact.outputs.golden_harness == 'true'
        env:
          RESULTS: ${{ runner.temp }}/compat-abi-parity
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|fma|f16c|bmi)' | tr '\n' ' '
          echo
          gcc -Q --help=target | grep -E '^\s+-march=|^\s+-mfma '
          echo | gcc -dM -E - | grep -E '__(FMA|AVX2)__' || echo 'gcc default: no FMA/AVX2'
          dpkg --print-architecture; dpkg -s libc6 | grep -E '^(Version|Architecture)'
          python3 scripts/dev/upstream_parity.py --unpinned --abi --mode probe --jobs 2 \
            --summary --write-json "$RESULTS"

      - name: Upload Compat ABI Parity results
        if: ${{ (failure() && steps.impact.outputs.golden_harness == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compat-abi-parity-results
          path: ${{ runner.temp }}/compat-abi-parity
          retention-days: 7
      - name: Upload Compat ABI Parity results (Gitea)
        if: ${{ (failure() && steps.impact.outputs.golden_harness == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: compat-abi-parity-results
          path: ${{ runner.temp }}/compat-abi-parity
          retention-days: 7

      - name: Run Compat ABI Planted Defect (Assert Failure)
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          status=0
          python3 scripts/dev/upstream_parity.py --unpinned --abi --plant --mode probe --jobs 2 || status=$?
          test "$status" -eq 1 || { echo "::error::plant: expected exit 1, got $status"; exit 1; }

  # ===== Sanitizer build =====
  # required-aggregator: Sanitizers (address)
  # required-aggregator: Sanitizers (thread)
  # required-aggregator: Sanitizers (undefined)
  sanitizers:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    name: "Sanitizers (${{ matrix.sanitizer }})"
    # ADR-0359, ADR-3286 (design notes)
    runs-on: ${{ vars.ARC_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runners' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Sanitizers skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Sanitizers satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('.github/apt/sanitizers.txt') }}

      - name: Install deps
        id: apt-install
        if: steps.impact.outputs.c_core == 'true'
        timeout-minutes: 10
        run: |
          bash scripts/ci/apt-install-cached.sh configure
          # ADR-0692 (design notes)
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          bash scripts/ci/apt-install-cached.sh install .github/apt/sanitizers.txt
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('.github/apt/sanitizers.txt') }}
      - name: Build with ${{ matrix.sanitizer }} sanitizer
        if: steps.impact.outputs.c_core == 'true'
        # ADR-0347 (design notes)
        working-directory: core
        shell: bash
        env:
          CC: clang-22
          CXX: clang++-22
          LDFLAGS: -fuse-ld=lld-22
        run: |
          if [ "${{ matrix.sanitizer }}" = "undefined" ]; then
            EXTRA_ARGS=( "-Dc_args=-fno-sanitize=function" "-Dcpp_args=-fno-sanitize=function" )
          else
            EXTRA_ARGS=()
          fi
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Db_sanitize=${{ matrix.sanitizer }} \
            -Denable_cuda=false -Denable_sycl=false --buildtype=debug \
            -Db_lto=false -Db_lundef=false "${EXTRA_ARGS[@]}" \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build
      - name: Prefetch Go modules for the suite
        if: steps.impact.outputs.c_core == 'true'
        shell: bash
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run unit tests under sanitizer
        if: steps.impact.outputs.c_core == 'true'
        # ADR-0347 (design notes)
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
          TSAN_OPTIONS: allocator_may_return_null=1
        working-directory: core
        shell: bash
        run: |
          case "${{ matrix.sanitizer }}" in
            address)
              EXCLUDE='test_model$'
              ;;
            undefined)
              EXCLUDE='test_model$'
              ;;
            thread)
              EXCLUDE='test_model$'
              ;;
            *)
              echo "::error::ADR-0347 deselect list is not defined for sanitizer=${{ matrix.sanitizer }}" >&2
              exit 1
              ;;
          esac
          TESTS=$(meson introspect build --tests \
                  | python3 -c 'import json,re,sys; excluded=re.compile(sys.argv[1]); [print("libvmaf:"+t["name"]) for t in json.load(sys.stdin) if excluded.search(t["name"]) is None]' "$EXCLUDE")
          echo "test count: $(echo "$TESTS" | wc -l)"
          echo "first 3: $(echo "$TESTS" | head -3 | tr '\n' ' ')"
          if [ -z "$TESTS" ]; then
            echo "::error::ADR-0347 test enumeration produced empty list for sanitizer=${{ matrix.sanitizer }}" >&2
            exit 1
          fi
          # --timeout-multiplier 3: the suite's timeouts are sized for an
          # uninstrumented build (docs/development/ci.md, "Sanitizer legs").
          # shellcheck disable=SC2086
          python3 ../scripts/ci/run_meson_test.py -- -C build --print-errorlogs \
            --timeout-multiplier 3 $TESTS

  dnn:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Tiny AI
    runs-on: ubuntu-26.04
    # ADR-3367 (design notes)
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Tiny AI skipped by plan
        if: steps.impact.outputs.tiny_ai != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::tiny_ai not impacted (mode=$MODE reason=$REASON) — Tiny AI satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.tiny_ai == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tiny-ai-${{ hashFiles('.github/apt/tiny-ai.txt') }}

      - name: Install build deps
        id: apt-install
        if: steps.impact.outputs.tiny_ai == 'true'
        timeout-minutes: 20
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/tiny-ai.txt
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tiny-ai-${{ hashFiles('.github/apt/tiny-ai.txt') }}
      - name: Install ONNX Runtime (CPU)
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          ORT_VERSION: "1.22.0"
          ORT_SHA256: "8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3"
        run: |
          set -euo pipefail
          ort_name="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          ort_archive="${RUNNER_TEMP}/${ort_name}"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_name}"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --remove-on-error \
            --max-time 600 --output "${ort_archive}" \
            "${ort_url}"
          printf '%s  %s\n' "${ORT_SHA256}" "${ort_archive}" \
            | sha256sum --check --strict
          sudo tar -xzf "${ort_archive}" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          sudo install -d /usr/local/lib/pkgconfig
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          prefix=/opt/onnxruntime
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libonnxruntime
          Description: ONNX Runtime C API
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          # Strip the leading YAML indent that `cat <<EOF` preserved.
          sudo sed -i 's/^          //' /usr/local/lib/pkgconfig/libonnxruntime.pc
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
      - name: Build libvmaf (dnn enabled)
        if: steps.impact.outputs.tiny_ai == 'true'
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build -Denable_cuda=false -Denable_sycl=false \
            -Denable_dnn=enabled --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build
      - name: Run meson dnn suite
        if: steps.impact.outputs.tiny_ai == 'true'
        working-directory: core
        run: python3 ../scripts/ci/run_meson_test.py -- -C build --suite=dnn --print-errorlogs
      - name: Set up Python + install vmaf-train
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          venv="${RUNNER_TEMP}/vmaf-train-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --require-hashes \
            -r requirements/locks/package-build.txt
          "${venv}/bin/pip" install --require-hashes -r ai/requirements-dev-lock.txt
          "${venv}/bin/pip" install --no-deps --no-build-isolation -e ai
      - name: Fetch the Netflix golden YUV fixtures
        if: steps.impact.outputs.tiny_ai == 'true'
        run: bash scripts/test/fetch-test-yuvs.sh
      - name: Run ai/ pytests
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          # ADR-1528 (design notes)
          VMAF_BIN: ${{ github.workspace }}/core/build/tools/vmaf
          VMAF_BIN_FOR_TESTS: ${{ github.workspace }}/core/build/tools/vmaf
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/pytest" ai/tests/ ai/sidecar/tests/ -v -rs --timeout=60 --timeout-method=signal
      # ADR-1898 (design notes)
      - name: Run the mini retrain end to end
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          VMAF_BIN: ${{ github.workspace }}/core/build/tools/vmaf
          VMAFX_CONTAINER_IMAGE_ID: github-hosted-ubuntu-26.04
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/pytest" ai/e2e/ -v -rs \
            --timeout=900 --timeout-method=signal \
            --basetemp="${RUNNER_TEMP}/mini-retrain-runs"
      # ADR-0174 (design notes)
      - name: Run ai-quant-accuracy gate
        if: steps.impact.outputs.tiny_ai == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/vmaf-train-venv/bin/python" ai/scripts/measure_quant_drop.py --all

  rc1-tester-report:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1342: this shipped tester surface has no path-filtered or optional
    # branch, so its regression lane must report to the required aggregator.
    # required-aggregator
    name: RC1 Tester Report
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Install locked RC1 tester package
        run: |
          python -m pip install --require-hashes \
            -r tools/rc1-tester/requirements-dev-lock.txt
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir dist/rc1-wheel ./tools/rc1-tester
          python -m pip install --no-deps dist/rc1-wheel/*.whl
      - name: Run RC1 tester regressions
        run: python -m pytest tools/rc1-tester/tests/ -q
      - name: Smoke installed tester launcher
        run: |
          python -c "from pathlib import Path; from vmaf_rc1_tester.probe import REPO_ROOT; assert REPO_ROOT == Path.cwd().resolve()"
          vmaf-rc1-report list-tools >/dev/null

  # ADR-1528 (design notes)
  tooling-tests:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1528 — required and in strictMustReport: no path filter and no
    # conditional skip.
    # required-aggregator
    name: Tooling Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Every test file belongs to a suite that a required check runs
        run: python scripts/ci/suite_registry.py check
      - name: Restore apt archives
        id: apt-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tooling-tests-${{ hashFiles('.github/apt/tooling-tests.txt') }}

      - name: Install the tooling test lock and cppcheck
        id: apt-install
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/tooling-tests.txt --no-install-recommends
          python -m pip install --require-hashes -r requirements/locks/package-build.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r requirements/locks/tooling-tests.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-tooling-tests-${{ hashFiles('.github/apt/tooling-tests.txt') }}
      - name: Run the tooling suite
        env:
          VMAFX_CLANG_FORMAT: clang-format
        run: python scripts/ci/suite_registry.py run tooling

  # ===== Python package suites (ADR-1528) =====
  # One leg per package suite of .github/test-suites.json that no other job
  # runs. Each leg installs the package's manifest-owned hash lock, installs
  # the package itself with --no-deps --no-build-isolation, and runs the
  # suite with -rs, so every remaining skip prints its reason. CI does not
  # call nox (ADR-0914); `nox -s <session>` is the local equivalent.
  # required-aggregator: Python Package Tests (compat)
  # required-aggregator: Python Package Tests (dev-llm)
  # required-aggregator: Python Package Tests (vmaf-roi-score)
  python-package-tests:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1528 (design notes)
    name: Python Package Tests (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compat
            tests: compat/vmaf/tests
          - name: dev-llm
            tests: dev-llm/tests
          - name: vmaf-roi-score
            tests: tools/vmaf-roi-score/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Python package suite skipped by plan
        if: steps.impact.outputs.python != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
          SUITE: ${{ matrix.name }}
        run: echo "::notice::python not impacted (mode=$MODE reason=$REASON) — Python Package Tests ($SUITE) satisfied without running (ADR-1140)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.impact.outputs.python == 'true'
        with:
          python-version: "3.14.9"
      - name: Install the build backends
        if: steps.impact.outputs.python == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m pip install --require-hashes -r requirements/locks/package-build.txt
      - name: Install the compat suite's lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'compat'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r python/requirements-test-lock.txt
      - name: Install dev-llm and its lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'dev-llm'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r dev-llm/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e dev-llm
      - name: Install vmaf-roi-score and its lock
        if: steps.impact.outputs.python == 'true' && matrix.name == 'vmaf-roi-score'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --no-build-isolation --require-hashes \
            -r tools/vmaf-roi-score/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e tools/vmaf-roi-score
      - name: Run the suite
        if: steps.impact.outputs.python == 'true'
        env:
          TESTS: ${{ matrix.tests }}
        run: python -m pytest "$TESTS" -rs

  # ADR-0543, ADR-1528 (design notes)
  vmaf-tune-tests:
    needs: [tier, mcp-smoke]
    if: ${{ !cancelled() && needs.tier.outputs.light == 'true' }}
    # ADR-1528 — required and in strictMustReport; the plan may skip the work.
    # required-aggregator
    name: Python Package Tests (vmaf-tune)
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — vmaf-tune suite skipped by plan
        if: steps.impact.outputs.python != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::python not impacted (mode=$MODE reason=$REASON) — Python Package Tests (vmaf-tune) satisfied without running (ADR-1140)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.impact.outputs.python == 'true'
        with:
          python-version: "3.14.9"
      - name: Install vmaf-tune and its lock
        if: steps.impact.outputs.python == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pip install --require-hashes -r requirements/locks/package-build.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r tools/vmaf-tune/requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e tools/vmaf-tune
      - name: Download MCP Smoke's vmaf CLI
        if: ${{ (steps.impact.outputs.python == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli
      - name: Download MCP Smoke's vmaf CLI (Gitea)
        if: ${{ (steps.impact.outputs.python == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli
      - name: Unpack the vmaf CLI
        if: steps.impact.outputs.python == 'true'
        run: |
          tar -C "${RUNNER_TEMP}/vmaf-cli" -xf "${RUNNER_TEMP}/vmaf-cli/vmaf-cli.tar"
          "${RUNNER_TEMP}/vmaf-cli/tools/vmaf" --version
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.python == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-vmaf-tune-tests-${{ hashFiles('.github/apt/vmaf-tune-tests.txt') }}

      - name: Install ffmpeg with libx265
        id: apt-install
        if: steps.impact.outputs.python == 'true'
        timeout-minutes: 20
        # ADR-1565 (design notes)
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/vmaf-tune-tests.txt
          ffmpeg -hide_banner -encoders | grep -E '^ V.* libx265 '

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-vmaf-tune-tests-${{ hashFiles('.github/apt/vmaf-tune-tests.txt') }}
      - name: Fetch the Netflix golden YUV fixtures
        if: steps.impact.outputs.python == 'true'
        run: bash scripts/test/fetch-test-yuvs.sh
      - name: Run the suite
        if: steps.impact.outputs.python == 'true'
        env:
          VMAF_BIN_FOR_TESTS: ${{ runner.temp }}/vmaf-cli/tools/vmaf
          # ADR-1565 (design notes)
          VMAF_TUNE_INTEGRATION: "1"
        # ADR-1568 (design notes)
        run: |
          set -o pipefail
          python scripts/ci/suite_registry.py list vmaf-tune > "${RUNNER_TEMP}/vmaf-tune-files.txt"
          mapfile -t files < "${RUNNER_TEMP}/vmaf-tune-files.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the registry lists no vmaf-tune test files" >&2
            exit 1
          fi
          python -m pytest "${files[@]}" -rs | tee "${RUNNER_TEMP}/vmaf-tune-pytest.log"
          if grep -E '^SKIPPED .*(no vmaf binary reachable|Netflix golden YUV fixtures not available|ffmpeg not on PATH|libx265 unavailable)' \
              "${RUNNER_TEMP}/vmaf-tune-pytest.log"; then
            echo "::error::vmaf-tune tests skipped for a missing vmaf binary or golden YUVs" >&2
            exit 1
          fi

  # ===== MCP smoke gate (T7-MCP-SMOKE-CI / Research-0034 gap #3) =====
  # Builds libvmaf with the full MCP transport matrix (sse + uds + stdio)
  # and exercises both the embedded C-side scaffold smoke (core/test/
  # test_mcp_smoke.c — pins the -ENOSYS contract per ADR-0209) and the
  # Python MCP server pytest suite under mcp-server/vmaf-mcp/tests/.
  #
  # Before this lane existed, only `supply-chain.yml::mcp-build` exercised
  # the MCP surface — and that just builds a wheel without running any
  # tests. The Python `tests/test_*.py` files and the C `test_mcp_smoke`
  # binary were never invoked in CI. This job closes that gap.
  #
  # Local repro:
  #   cd libvmaf && meson setup build-mcp \
  #     -Denable_cuda=false -Denable_sycl=false \
  #     -Denable_mcp=true -Denable_mcp_sse=true \
  #     -Denable_mcp_uds=true -Denable_mcp_stdio=true && \
  #   meson compile -C build-mcp && \
  #   python3 ../scripts/ci/run_meson_test.py -- -C build-mcp test_mcp_smoke --print-errorlogs
  #   cd ../mcp-server/vmaf-mcp && \
  #   python3 -m venv ~/.cache/mcp-venv && \
  #   ~/.cache/mcp-venv/bin/pip install -e .[dev] && \
  #   ~/.cache/mcp-venv/bin/pytest tests/ -v
  mcp-smoke:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # ADR-1297 — required, and in `strictMustReport`: it builds all four
    # enable_mcp* transports and runs the MCP server suite, a shipped
    # user-discoverable surface, and it has no path filter or conditional
    # skip, so absence is never a legitimate outcome.
    # required-aggregator
    name: MCP Smoke
    runs-on: ubuntu-26.04
    # ADR-3367 (design notes)
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Restore apt archives
        id: apt-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-mcp-smoke-${{ hashFiles('.github/apt/mcp-smoke.txt') }}

      - name: Install build deps
        id: apt-install
        timeout-minutes: 20
        run: |
          bash scripts/ci/apt-install-cached.sh install .github/apt/mcp-smoke.txt
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-mcp-smoke-${{ hashFiles('.github/apt/mcp-smoke.txt') }}

      - name: Build libvmaf (full MCP transport matrix)
        working-directory: core
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-mcp \
            -Denable_cuda=false -Denable_sycl=false \
            -Denable_mcp=true -Denable_mcp_sse=enabled \
            -Denable_mcp_uds=true -Denable_mcp_stdio=true \
            --buildtype=release \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          meson compile -C build-mcp

      - name: Pack the vmaf CLI for the vmaf-tune suite
        # ADR-1528 (design notes)
        working-directory: core/build-mcp
        run: |
          find src -maxdepth 1 \( -name 'libvmaf.so*' -o -name 'libvmafx.so*' \) \( -type f -o -type l \) \
            > "${RUNNER_TEMP}/vmaf-cli.list"
          tar -cf "${RUNNER_TEMP}/vmaf-cli.tar" tools/vmaf -T "${RUNNER_TEMP}/vmaf-cli.list"

      - name: Upload the vmaf CLI for the vmaf-tune suite
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli.tar
          retention-days: 1
          if-no-files-found: error
      - name: Upload the vmaf CLI for the vmaf-tune suite (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: vmaf-cli-mcp
          path: ${{ runner.temp }}/vmaf-cli.tar
          retention-days: 1
          if-no-files-found: error

      - name: Run embedded MCP C smoke test
        # ADR-0209, ADR-2094 (design notes)
        working-directory: core
        run: >-
          python3 ../scripts/ci/run_meson_test.py --
          -C build-mcp test_mcp_smoke test_compat_conformance
          check_exported_symbols check_exported_symbols_libvmaf
          --print-errorlogs

      - name: Set up Python venv + install vmaf-mcp[dev]
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          venv="${RUNNER_TEMP}/mcp-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --require-hashes \
            -r requirements/locks/package-build.txt
          "${venv}/bin/pip" install --require-hashes \
            -r mcp-server/vmaf-mcp/requirements-dev-lock.txt
          "${venv}/bin/pip" install --no-deps --no-build-isolation \
            -e mcp-server/vmaf-mcp

      - name: Fetch the Netflix golden YUV fixtures
        # ADR-1528 (design notes)
        run: bash scripts/test/fetch-test-yuvs.sh

      - name: Run Python MCP server pytests
        env:
          VMAF_BIN: ${{ github.workspace }}/core/build-mcp/tools/vmaf
        run: |
          test -x "$VMAF_BIN" || {
            echo "vmaf binary missing at $VMAF_BIN" >&2
            ls -la "$(dirname "$VMAF_BIN")" >&2 ||
              echo "::warning::cannot list $(dirname "$VMAF_BIN")" >&2
            exit 1
          }
          "${RUNNER_TEMP}/mcp-venv/bin/pytest" mcp-server/vmaf-mcp/tests/ -v -rs --tb=short \
            --timeout=60 --timeout-method=signal

  coverage:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    # ADR-1297 — required, and in `strictMustReport`. This job enforces the
    # principles.md §3 line-coverage floors and the per-PR delta tolerance
    # (ADR-0922). It self-skips in-job via plan-ci-impact.py (ADR-1140)
    # rather than by path filter, so it always reports and `skipped` is never
    # its outcome. Leaving it ungated re-opened, from the other side, the
    # same hole as the `|| true` this branch removed: `Coverage GPU`, the
    # self-hosted sibling that legitimately skips, was gated while this one
    # was not.
    # required-aggregator
    name: Coverage Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Coverage Gate skipped by plan
        if: steps.impact.outputs.golden_harness != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::golden_harness not impacted (mode=$MODE reason=$REASON) — Coverage Gate satisfied without running (ADR-1140)"
      - name: Restore apt archives
        id: apt-cache
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('.github/apt/coverage.txt') }}

      - name: Install deps
        id: apt-install
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 35
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure*
          bash scripts/ci/apt-install-cached.sh install .github/apt/coverage.txt
          # ADR-0692 (design notes)
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt
          # ADR-0110 (design notes)
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-coverage-lock.txt
          # ADR-1528 (design notes)
          python3 -m pip install --user --no-deps --no-build-isolation -e python

      - name: Save apt archives
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('.github/apt/coverage.txt') }}

      - name: Cache ONNX Runtime tarball
        if: steps.impact.outputs.golden_harness == 'true'
        id: cache-ort
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ort-cache
          key: ort-tarball-linux-x64-gpu-1.22.0
      - name: Install ONNX Runtime (GPU build, CPU + CUDA EPs)
        id: coverage_install_ort
        if: steps.impact.outputs.golden_harness == 'true'
        timeout-minutes: 10
        # ADR-0112, ADR-0113 (design notes)
        env:
          ORT_VERSION: "1.22.0"
          ORT_SHA256: "2a19dbfa403672ec27378c3d40a68f793ac7a6327712cd0e8240a86be2b10c55"
        run: |
          set -euo pipefail
          dpkg -s libcudart12 >/dev/null 2>&1 || sudo apt-get install -y nvidia-cuda-toolkit
          mkdir -p "${RUNNER_TEMP}/ort-cache"
          tarball="${RUNNER_TEMP}/ort-cache/onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz"
          if [ ! -f "$tarball" ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 600 -o "$tarball" \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz"
          fi
          if ! printf '%s  %s\n' "${ORT_SHA256}" "$tarball" | sha256sum --check --strict; then
            rm -f "$tarball"
            exit 1
          fi
          sudo tar -xzf "$tarball" -C /opt/
          sudo ln -sfn "/opt/onnxruntime-linux-x64-gpu-${ORT_VERSION}" /opt/onnxruntime
          sudo install -d /usr/local/lib/pkgconfig
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/libonnxruntime.pc >/dev/null
          prefix=/opt/onnxruntime
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libonnxruntime
          Description: ONNX Runtime C API
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          sudo sed -i 's/^          //' /usr/local/lib/pkgconfig/libonnxruntime.pc
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
      - name: Build with gcov instrumentation
        id: coverage_build
        if: steps.impact.outputs.golden_harness == 'true'
        working-directory: core
        run: |
          # AVX-512 on so SIMD paths are exercised. enable_dnn=enabled +
          # ORT installed above so dnn/*.c contribute real coverage (not
          # stubs).
          #
          # -fprofile-update=atomic fixes the intra-process race where SIMD
          # inner loops (vif_avx2, motion_avx2, etc.) increment the same
          # 64-bit gcov counter from multiple threads and produce negative
          # values gcovr/geninfo reject. See ADR-0110.
          #
          # The companion fix lives in the test step below: --num-processes 1
          # serialises meson test execution so multiple test binaries don't
          # concurrently merge their counters into the same .gcda files for
          # the shared libvmaf.so. atomic is per-thread, not per-process —
          # the two fixes are complementary.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build-coverage --buildtype=debug \
            -Db_coverage=true -Denable_cuda=false -Denable_sycl=false \
            -Denable_float=true -Denable_avx512=true \
            -Denable_dnn=enabled \
            -Dc_args=-fprofile-update=atomic \
            -Dcpp_args=-fprofile-update=atomic \
            -Dwerror=true $(../scripts/ci/werror-args.sh true)
          ninja -C build-coverage
      - name: Prefetch Go modules for the suite
        id: coverage_prefetch_go
        if: steps.impact.outputs.golden_harness == 'true'
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run meson unit suite (with gcov counters)
        id: coverage_meson_suite
        if: steps.impact.outputs.golden_harness == 'true'
        working-directory: core
        run: >-
          python3 ../scripts/ci/run_meson_test.py -- -C build-coverage
          --print-errorlogs --num-processes 1 --timeout-multiplier 3
      - name: Prepare the Python test suite (instrumented libvmaf.so + vmaf CLI)
        id: coverage_prepare_python
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          ln -sf build-coverage core/build
          echo "${{ github.workspace }}/core/build-coverage/tools" >> "$GITHUB_PATH"
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/pytest-timeout.txt
      - name: Run Python test suite, shard 1/4
        id: python_coverage_shard_1
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 1/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 2/4
        id: python_coverage_shard_2
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 2/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 3/4
        id: python_coverage_shard_3
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 3/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Run Python test suite, shard 4/4
        id: python_coverage_shard_4
        if: steps.impact.outputs.golden_harness == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage/src
        run: |
          timeout --kill-after=30s 30m python3 scripts/ci/run_pytest_shard.py --shard 4/4 -- \
            python/test/ -v -m "not slow" --tb=short \
            --timeout=600 --timeout-method=thread \
            --ignore=python/test/resource \
            --deselect python/test/command_line_test.py::CommandLineTest
      - name: Gather coverage report (gcovr)
        if: ${{ always() && steps.impact.outputs.golden_harness == 'true' }}
        working-directory: core
        run: |
          # ADR-0117 (design notes)
          ~/.local/bin/gcovr --root .. \
              --filter 'src/.*' \
              --exclude '.*/test/.*' \
              --exclude '.*/tests/.*' \
              --exclude '.*/subprojects/.*' \
              --gcov-ignore-parse-errors=negative_hits.warn \
              --gcov-ignore-parse-errors=suspicious_hits.warn \
              --print-summary \
              --txt build-coverage/coverage.txt \
              --json-summary build-coverage/coverage.json \
              --xml build-coverage/coverage.xml \
              build-coverage \
            2> >(grep -vE 'Ignoring (suspicious|negative) hits' >&2)
          echo "----- Per-file summary -----"
          cat build-coverage/coverage.txt
      - name: Enforce coverage thresholds
        if: steps.impact.outputs.golden_harness == 'true'
        run: |
          # ADR-0637 (design notes)
          scripts/ci/coverage-check.sh core/build-coverage/coverage.json 37 85
      - name: Upload coverage artifact
        if: ${{ ((always()) && steps.impact.outputs.golden_harness == 'true') && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-cpu
          path: |
            core/build-coverage/coverage.xml
            core/build-coverage/coverage.json
            core/build-coverage/coverage.txt
          retention-days: 14
      - name: Upload coverage artifact (Gitea)
        if: ${{ ((always()) && steps.impact.outputs.golden_harness == 'true') && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: coverage-cpu
          path: |
            core/build-coverage/coverage.xml
            core/build-coverage/coverage.json
            core/build-coverage/coverage.txt
          retention-days: 14
      - name: Assert every Python coverage shard passed
        if: ${{ always() && steps.impact.outputs.golden_harness == 'true' }}
        env:
          SHARD_OUTCOMES: >-
            ${{ steps.python_coverage_shard_1.outcome }}
            ${{ steps.python_coverage_shard_2.outcome }}
            ${{ steps.python_coverage_shard_3.outcome }}
            ${{ steps.python_coverage_shard_4.outcome }}
          EARLIER_OUTCOMES: >-
            Install-deps=${{ steps.apt-install.outcome }}
            Install-ONNX-Runtime=${{ steps.coverage_install_ort.outcome }}
            Build-with-gcov=${{ steps.coverage_build.outcome }}
            Prefetch-Go-modules=${{ steps.coverage_prefetch_go.outcome }}
            Meson-unit-suite=${{ steps.coverage_meson_suite.outcome }}
            Prepare-Python-suite=${{ steps.coverage_prepare_python.outcome }}
        run: |
          read -r -a outcomes <<< "$SHARD_OUTCOMES"
          if [[ "${#outcomes[@]}" -ne 4 ]]; then
            echo "::error::expected 4 shard outcomes, got '$SHARD_OUTCOMES'" >&2
            exit 1
          fi
          read -r -a earlier <<< "$EARLIER_OUTCOMES"
          cause="no earlier step failed"
          for entry in "${earlier[@]}"; do
            if [[ "${entry#*=}" != "success" ]]; then
              cause="step ${entry%%=*} outcome was ${entry#*=}"
              break
            fi
          done
          failed=0
          for index in "${!outcomes[@]}"; do
            if [[ "${outcomes[index]}" == "skipped" ]]; then
              echo "::error::Python coverage shard $((index + 1))/4 outcome was skipped: $cause" >&2
              failed=1
            elif [[ "${outcomes[index]}" != "success" ]]; then
              echo "::error::Python coverage shard $((index + 1))/4 outcome was ${outcomes[index]}" >&2
              failed=1
            fi
          done
          exit "$failed"

  # ADR-1319 (design notes)
  gpu-full-runner-available:
    needs: tier
    if: needs.tier.outputs.full == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Probe GPU Full Runner
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
      registered: ${{ steps.probe.outputs.registered }}
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check gpu-full runner availability
        id: probe
        env:
          GH_TOKEN: ${{ secrets.SYCL_RUNNER_PROBE_TOKEN || github.token }}
          RUNNER_ENABLED: ${{ vars.GPU_COVERAGE_ENABLED }}
          RUNNER_LABELS: "self-hosted linux gpu-full"
          RUNNER_DISPLAY_NAME: "Coverage GPU"
          RUNNER_SWITCH_NAME: "GPU_COVERAGE_ENABLED"
          RUNNER_RUNBOOK: "docs/development/self-hosted-runner.md"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/check-runner-available.sh

  coverage-gpu:
    # required-aggregator
    name: Coverage GPU
    needs: [gpu-full-runner-available]
    if: needs.gpu-full-runner-available.outputs.available == 'true'
    runs-on: [self-hosted, linux, gpu-full]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build with gcov + CUDA + SYCL + AVX-512
        working-directory: core
        env:
          CC: icx
          CXX: icpx
        run: |
          bash -e -o pipefail -c '
            source /opt/intel/oneapi/setvars.sh
            # ADR-1360 (design notes)
            meson setup build-coverage-gpu --buildtype=debug \
              -Db_coverage=true -Db_lto=false \
              -Denable_cuda=true -Denable_sycl=true \
              -Dsycl_icpx_aot_targets= \
              -Denable_float=true -Denable_avx512=true \
              -Dc_args=-fprofile-update=atomic \
              -Dcpp_args=-fprofile-update=atomic \
              -Dwerror=true $(../scripts/ci/werror-args.sh true)
            ninja -C build-coverage-gpu
          '
      - name: Prefetch Go modules for the suite
        run: python3 scripts/ci/prefetch_go_modules.py
      - name: Run meson unit suite
        working-directory: core
        run: >-
          python3 ../scripts/ci/run_meson_test.py -- -C build-coverage-gpu
          --print-errorlogs --num-processes 1 --timeout-multiplier 3
      - name: Run Python suite on CUDA + SYCL backends
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/build-coverage-gpu/src
        run: |
          export PATH="${{ github.workspace }}/core/build-coverage-gpu/tools:$PATH"
          python3 -m pip install --user --require-hashes \
            -r requirements/locks/package-build.txt
          python3 -m pip install --user --no-build-isolation --require-hashes \
            -r python/requirements-coverage-lock.txt
          # ADR-0024 (design notes)
          VMAF_FORCE_BACKEND=cuda python3 -m pytest python/test/ -v \
            -c python/tox.ini \
            -m "not slow" --tb=short --ignore=python/test/resource \
            --ignore=python/test/quality_runner_test.py \
            --ignore=python/test/feature_extractor_test.py \
            --ignore=python/test/vmafexec_test.py \
            --ignore=python/test/vmafexec_feature_extractor_test.py \
            --ignore=python/test/result_test.py \
            --timeout=300 --timeout-method=signal
          VMAF_FORCE_BACKEND=sycl python3 -m pytest python/test/ -v \
            -c python/tox.ini \
            -m "not slow" --tb=short --ignore=python/test/resource \
            --ignore=python/test/quality_runner_test.py \
            --ignore=python/test/feature_extractor_test.py \
            --ignore=python/test/vmafexec_test.py \
            --ignore=python/test/vmafexec_feature_extractor_test.py \
            --ignore=python/test/result_test.py \
            --timeout=300 --timeout-method=signal
      - name: Gather coverage report (gcovr)
        working-directory: core
        run: |
          # ADR-0110, ADR-0117 (design notes)
          python3 -m pip install --user --require-hashes \
            -r ../requirements/locks/gcovr.txt
          ~/.local/bin/gcovr --root .. \
              --filter 'src/.*' \
              --exclude '.*/test/.*' \
              --exclude '.*/tests/.*' \
              --exclude '.*/subprojects/.*' \
              --gcov-ignore-parse-errors=negative_hits.warn \
              --gcov-ignore-parse-errors=suspicious_hits.warn \
              --print-summary \
              --txt build-coverage-gpu/coverage.txt \
              --json-summary build-coverage-gpu/coverage.json \
              --xml build-coverage-gpu/coverage.xml \
              build-coverage-gpu \
            2> >(grep -vE 'Ignoring (suspicious|negative) hits' >&2)
          cat build-coverage-gpu/coverage.txt
      - name: Enforce coverage thresholds (GPU)
        run: |
          scripts/ci/coverage-check.sh core/build-coverage-gpu/coverage.json 70 85
      - name: Upload GPU coverage artifact
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-gpu
          path: |
            core/build-coverage-gpu/coverage.xml
            core/build-coverage-gpu/coverage.json
            core/build-coverage-gpu/coverage.txt
          retention-days: 14
      - name: Upload GPU coverage artifact (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: coverage-gpu
          path: |
            core/build-coverage-gpu/coverage.xml
            core/build-coverage-gpu/coverage.json
            core/build-coverage-gpu/coverage.txt
          retention-days: 14

  assertion-density:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # Power of 10 §5
    # required-aggregator
    name: Assertion Density
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Not impacted — Assertion Density skipped by plan
        if: steps.impact.outputs.c_core != 'true'
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: echo "::notice::c_core not impacted (mode=$MODE reason=$REASON) — Assertion Density satisfied without running (ADR-1140)"
      - name: Run assertion density scanner
        if: steps.impact.outputs.c_core == 'true'
        run: bash scripts/ci/assertion-density.sh
