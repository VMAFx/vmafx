#
# Branch-only measurement: do the HDR scores differ across architectures once the converted
# pixels are identical? Lives on measure/hdr-pixels-identical and is not meant to land.
name: Measure HDR pixels

on:
  push:
    branches: [measure/hdr-pixels-identical]

permissions:
  contents: read

jobs:
  dump:
    name: x86-64 dump
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.9
      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install nasm pkg-config gcc g++ libzimg-dev zstd
      - name: Build
        run: |
          meson setup core core/build --buildtype release -Denable_float=true -Dwerror=true
          ninja -C core/build tools/vmaf
          # shellcheck disable=SC2046  # pkg-config prints separate words
          cc -shared -fPIC -O2 -Wall -Werror $(pkg-config --cflags zimg) scripts/ci/measure_zdump.c -o zdump.so -ldl
      - name: Fetch the inputs
        env:
          BUNDLE: pq-sollevante-v1.tar.zst
          BUNDLE_SHA256: f7546a16c3190c841e09a5de83d98db86156a06869fb9fbc58ff86307db2f416
          BUNDLE_URL: https://github.com/VMAFx/vmafx/releases/download/fixtures-pq-sollevante-v1
        run: |
          bash scripts/test/fetch-test-yuvs.sh \
            ref_dock-na-HDR_res2160_rate5p0_maxRate100000_bufSize200000_fps59p940_576x324_1frame.yuv \
            dis_dock-na-HDR_res1440_rate15p0_maxRate10000_bufSize20000_fps59p940_576x324_1frame.yuv
          mkdir -p measure
          cp python/test/resource/yuv/*_dock-na-HDR_*.yuv measure/
          curl --max-time 600 -fsSL --retry 3 -o "$BUNDLE" "$BUNDLE_URL/$BUNDLE"
          echo "$BUNDLE_SHA256  $BUNDLE" | sha256sum -c -
          tar --zstd -xf "$BUNDLE" -C measure
      - name: Dump and score
        run: python scripts/ci/measure_hdr_pixels.py dump --cli core/build/tools/vmaf --dir measure --shim ./zdump.so
      - name: Upload the pictures
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hdr-pixels
          path: |
            measure/*.yuv
            measure/x86.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload the pictures (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: hdr-pixels
          path: |
            measure/*.yuv
            measure/x86.json
          retention-days: 1
          if-no-files-found: error

  score:
    name: ${{ matrix.name }}
    needs: dump
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: measure Ubuntu ARM clang
            os: ubuntu-26.04-arm
            CC: clang-22
            CXX: clang++-22
          - name: measure macOS clang
            os: macos-latest
            CC: clang
            CXX: clang++
            meson_extra: -Denable_metal=disabled
          - name: measure macOS clang+DNN
            os: macos-latest
            CC: clang
            CXX: clang++
            dnn: true
            meson_extra: -Denable_dnn=enabled -Denable_metal=disabled
          - name: measure macOS Metal
            os: macos-latest
            CC: clang
            CXX: clang++
            metal: true
            meson_extra: -Denable_metal=enabled
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.14.9
      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt
      - name: Install dependencies (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install nasm libomp-dev pkg-config libzimg-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo -E apt-get -yq install libclang-rt-22-dev libomp-22-dev
      - name: Install dependencies (macos)
        if: startsWith(matrix.os, 'macos')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install -q nasm llvm pkg-config zimg
      - name: Install ONNX Runtime
        if: matrix.dnn
        run: |
          brew install -q onnxruntime
          echo "PKG_CONFIG_PATH=$(brew --prefix onnxruntime)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install the Metal compiler
        if: matrix.metal
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        env:
          MESON_EXTRA: ${{ matrix.meson_extra }}
        run: |
          # shellcheck disable=SC2086  # one option per word, split on purpose
          meson setup core core/build --buildtype release -Denable_float=true -Dwerror=true $MESON_EXTRA
          ninja -C core/build tools/vmaf
          core/build/tools/vmaf --version
          uname -m
          $CC --version | head -1
      - name: Download the pictures
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hdr-pixels
          path: measure

      - name: Download the pictures (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0
        with:
          name: hdr-pixels
          path: measure
      - name: Score and compare
        env:
          LEG: ${{ matrix.name }}
        run: |
          python scripts/ci/measure_hdr_pixels.py score --cli core/build/tools/vmaf --dir measure \
            --leg "$LEG" --out "$RUNNER_TEMP/rows.json"
      - name: Upload the rows
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rows-${{ matrix.name }}
          path: ${{ runner.temp }}/rows.json
          retention-days: 3
          if-no-files-found: error

      - name: Upload the rows (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: rows-${{ matrix.name }}
          path: ${{ runner.temp }}/rows.json
          retention-days: 3
          if-no-files-found: error
