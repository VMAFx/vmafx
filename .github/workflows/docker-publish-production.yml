          path: sbom-oneapi2025.cdx.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # GPU runtime smoke: no device is required for the version-only probe.
  # -----------------------------------------------------------------------
  smoke-gpu:
    name: Smoke-test GPU image entrypoints
    needs:
      - build-cuda13
      - build-rocm7
      - build-oneapi2025
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify signatures before pull
        run: |
          for digest in \
            "${{ needs.build-cuda13.outputs.digest }}" \
            "${{ needs.build-rocm7.outputs.digest }}" \
            "${{ needs.build-oneapi2025.outputs.digest }}"; do
            cosign verify \
              --certificate-identity \
                "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-production.yml@refs/tags/${PUBLISH_TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
          done

      - name: Pull and run each GPU entrypoint
        run: |
          for digest in \
            "${{ needs.build-cuda13.outputs.digest }}" \
            "${{ needs.build-rocm7.outputs.digest }}" \
            "${{ needs.build-oneapi2025.outputs.digest }}"; do
            image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
            docker pull "${image}"
            docker run --rm "${image}" --version
          done

  # (ADR-0726: Vulkan backend removed; build-vulkan job deleted)

