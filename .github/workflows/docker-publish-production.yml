        with:
          context: .
          file: docker/Dockerfile.production-gpu
          target: final-oneapi2025
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
