# docker-publish-production — build, push, sign, and SBOM the VMAFX production image.
#
# Triggers:
#   - publication of a release-please draft (`release.published`)
#   - workflow_dispatch at an existing published tag for recovery
#
# Produces:
#   ghcr.io/vmafx/vmafx:<tag>           (cpu, amd64+arm64)
#   ghcr.io/vmafx/vmafx:latest          (same)
#   ghcr.io/vmafx/vmafx:<tag>-cuda13    (amd64 only — CUDA not portable to arm64)
#   ghcr.io/vmafx/vmafx:<tag>-rocm7     (amd64 only)
#   ghcr.io/vmafx/vmafx:<tag>-oneapi2025 (amd64 only)
#

# Post-push steps: cosign keyless sign + syft SBOM (CycloneDX JSON) via cosign attest.
# ADR-0698: vmafx-production-dockerfile

name: docker-publish-production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published vX.Y.Z tag to recover idempotently"
        required: true

# Workflow-level least-privilege; jobs that push/sign/attest opt in below.
permissions:
  contents: read

# Prevent duplicate signing/push runs for the same tag.
# cancel-in-progress: false — a partial publish (some images built, some not)
# is worse than a queued duplicate run completing after the first finishes.
concurrency:
  group: docker-publish-production-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vmafx/vmafx
  # Validation below proves this tag, GITHUB_REF, GITHUB_SHA, and the published
  # GitHub release all identify the same immutable source commit.
  PUBLISH_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  validate-release:
    name: Validate published ordinary tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - name: Reject source/tag mismatches
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            echo "ERROR: prerelease publication is not supported: $PUBLISH_TAG" >&2
            exit 1
          fi
          expected_ref="refs/tags/$PUBLISH_TAG"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "ERROR: run this workflow at $expected_ref, not $GITHUB_REF" >&2
            exit 1
          fi
          scripts/release/verify-release-version.sh "$PUBLISH_TAG"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "ERROR: workflow source SHA $GITHUB_SHA does not match checked-out tag" >&2
            exit 1
          fi
          release_json="$RUNNER_TEMP/github-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PUBLISH_TAG" > "$release_json"
          if [[ "$(jq -r '.tag_name' "$release_json")" != "$PUBLISH_TAG" || \
                "$(jq -r '.draft' "$release_json")" != "false" || \
                "$(jq -r '.prerelease' "$release_json")" != "false" || \
                "$(jq -r '.published_at != null' "$release_json")" != "true" ]]; then
            echo "ERROR: $PUBLISH_TAG must name a published, non-prerelease release" >&2
            exit 1
          fi
          echo "tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Build + push the CPU (default) multi-arch image
  # -----------------------------------------------------------------------
  build-cpu:
    name: Build + push CPU image (amd64 + arm64)
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
      packages: write    # push to GHCR
      id-token: write    # cosign keyless OIDC
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production
          target: cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VMAF_BUILD_JOBS=4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-cpu.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-cpu.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cpu
          path: sbom-cpu.cdx.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # Smoke-test: pull the just-pushed image and verify --version exits 0
  # -----------------------------------------------------------------------
  smoke-test:
    name: Smoke-test CPU image
    needs: build-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify signature before pull
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-production.yml@refs/tags/${PUBLISH_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-cpu.outputs.digest }}"

      - name: Pull and run --version
        run: |
          docker pull \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-cpu.outputs.digest }}"
          docker run --rm \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-cpu.outputs.digest }}" \
            --version
          echo "Smoke test passed: --version exited 0"

  # -----------------------------------------------------------------------
  # GPU variant: CUDA 13 (amd64 only)
  # -----------------------------------------------------------------------
  build-cuda13:
    name: Build + push CUDA 13 image (amd64)
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (cuda13 tag suffix)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}-cuda13

      - name: Build and push (amd64 only)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production-gpu
          target: final-cuda13
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM + attest
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-cuda13.cdx.json
          cosign attest --yes \
            --predicate sbom-cuda13.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cuda13
          path: sbom-cuda13.cdx.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # GPU variant: ROCm 7 (amd64 only)
  # -----------------------------------------------------------------------
  build-rocm7:
