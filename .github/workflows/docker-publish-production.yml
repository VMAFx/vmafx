          cache-to: type=gha,mode=max

      - name: Install cosign + sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM + attest
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-server.cdx.json
          cosign attest --yes \
            --predicate sbom-server.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-server
          path: sbom-server.cdx.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # Server smoke: verify the signature, Python 3.14 interpreter, and CLI.
  # -----------------------------------------------------------------------
  smoke-server:
    name: Smoke-test MCP server image
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify signature before pull
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-production.yml@refs/tags/${PUBLISH_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-server.outputs.digest }}"

      - name: Pull and verify Python + live vmaf-mcp HTTP server
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-server.outputs.digest }}"
          docker pull "${image}"
          docker run --rm --entrypoint /venv/bin/python "${image}" --version
          docker run --rm --entrypoint /venv/bin/vmaf-mcp "${image}" --help
          smoke_token="$(openssl rand -hex 32)"
          container_id="$(docker run --detach \
            --publish 127.0.0.1:18080:8080 \
            --env "VMAFX_MCP_HTTP_TOKEN=${smoke_token}" \
            "${image}")"
          cleanup() {
            docker logs "${container_id}"
            if docker inspect "${container_id}" >/dev/null 2>&1; then
              docker rm --force "${container_id}"
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --oauth2-bearer "${smoke_token}" \
              http://127.0.0.1:18080/healthz; then
              break
            fi
            if ! docker inspect "${container_id}" >/dev/null 2>&1; then
              echo "server container exited before becoming healthy" >&2
              exit 1
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo "server did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            --oauth2-bearer "${smoke_token}" \
            http://127.0.0.1:18080/readyz \
            | grep --extended-regexp '"status"[[:space:]]*:[[:space:]]*"ready"'

  # -----------------------------------------------------------------------
  # Summary job — depends on all build jobs so CI shows a single status
  # -----------------------------------------------------------------------
  all-images:
    name: All production images published
    if: always()
    needs:
      - build-cpu
      - smoke-test
      - build-cuda13
      - build-rocm7
      - build-oneapi2025
      - smoke-gpu
      - build-server
      - smoke-server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-cpu.result }}" != "success" ]]; then
            echo "build-cpu failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "smoke-test failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-server.result }}" != "success" ]]; then
            echo "smoke-server failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-gpu.result }}" != "success" ]]; then
            echo "smoke-gpu failed"
            exit 1
          fi
          # The GPU + server variants used to be echoed and never gated, so they
          # could fail on every publish without anyone noticing. That is how
          # docker/Dockerfile.production-gpu kept a CUDA 12.0 pin, an
          # intel/oneapi-basekit:2026.0 reference to an image that does not
          # exist, and a ROCm 6.4 runtime against a 7.2.4 build toolchain.
          # They gate now.
          fail=0
          for job in build-cuda13 build-rocm7 build-oneapi2025 build-server; do
            case "$job" in
              build-cuda13)      r="${{ needs.build-cuda13.result }}" ;;
              build-rocm7)       r="${{ needs.build-rocm7.result }}" ;;
              build-oneapi2025)  r="${{ needs.build-oneapi2025.result }}" ;;
              build-server)      r="${{ needs.build-server.result }}" ;;
            esac
            if [[ "$r" != "success" ]]; then
              echo "::error title=image build failed::$job = $r"
              fail=1
            else
              echo "$job = $r"
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1
          echo "all image variants passed"
