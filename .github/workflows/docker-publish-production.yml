# docker-publish-production — build, push, sign, and SBOM the VMAFX production image.
#
# Triggers:
#   - push of a release tag (v*) from release-please
#   - workflow_dispatch for manual runs
#
# Produces:
#   ghcr.io/vmafx/vmafx:<tag>           (cpu, amd64+arm64)
#   ghcr.io/vmafx/vmafx:latest          (same)
#   ghcr.io/vmafx/vmafx:<tag>-cuda13    (amd64 only — CUDA not portable to arm64)
#   ghcr.io/vmafx/vmafx:<tag>-rocm7     (amd64 only)
#   ghcr.io/vmafx/vmafx:<tag>-oneapi2025 (amd64 only)
#

# Post-push steps: cosign keyless sign + syft SBOM (CycloneDX JSON) via cosign attest.
# ADR-0698: vmafx-production-dockerfile

name: docker-publish-production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (defaults to 'dev')"
        required: false
        default: "dev"

# Workflow-level least-privilege; jobs that push/sign/attest opt in below.
permissions:
  contents: read

# Prevent duplicate signing/push runs for the same tag.
# cancel-in-progress: false — a partial publish (some images built, some not)
# is worse than a queued duplicate run completing after the first finishes.
concurrency:
  group: docker-publish-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vmafx/vmafx

jobs:
  # -----------------------------------------------------------------------
  # Build + push the CPU (default) multi-arch image
  # -----------------------------------------------------------------------
  build-cpu:
    name: Build + push CPU image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write    # push to GHCR
      id-token: write    # cosign keyless OIDC
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production
          target: cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VMAF_BUILD_JOBS=4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-cpu.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-cpu.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cpu
          path: sbom-cpu.cdx.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # Smoke-test: pull the just-pushed image and verify --version exits 0
  # -----------------------------------------------------------------------
  smoke-test:
    name: Smoke-test CPU image
    needs: build-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run --version
        run: |
          docker pull \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-cpu.outputs.digest }}"
          docker run --rm \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-cpu.outputs.digest }}" \
            --version
          echo "Smoke test passed: --version exited 0"

  # -----------------------------------------------------------------------
  # GPU variant: CUDA 12 (amd64 only)
  # -----------------------------------------------------------------------
  build-cuda13:
    name: Build + push CUDA 12 image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (cuda13 tag suffix)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-cuda13
            type=raw,value=${{ github.event.inputs.tag || 'dev' }}-cuda13,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (amd64 only)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production-gpu
          target: final-cuda13
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM + attest
        run: |
          pip install --quiet syft || true  # fallback if anchore action unavailable
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-cuda13.cdx.json
          cosign attest --yes \
            --predicate sbom-cuda13.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
        continue-on-error: true   # SBOM is best-effort on GPU builds

  # -----------------------------------------------------------------------
  # GPU variant: ROCm 6 (amd64 only)
  # -----------------------------------------------------------------------
  build-rocm7:
    name: Build + push ROCm 6 image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-rocm7
            type=raw,value=${{ github.event.inputs.tag || 'dev' }}-rocm7,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production-gpu
          target: final-rocm7
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign + sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # -----------------------------------------------------------------------
  # GPU variant: oneAPI 2026 (amd64 only)
  # -----------------------------------------------------------------------
  build-oneapi2025:
    name: Build + push oneAPI 2026 image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-oneapi2025
            type=raw,value=${{ github.event.inputs.tag || 'dev' }}-oneapi2025,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production-gpu
          target: final-oneapi2025
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign + sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # (ADR-0726: Vulkan backend removed; build-vulkan job deleted)

  # -----------------------------------------------------------------------
  # MCP server variant (cpu base, amd64 + arm64)
  # -----------------------------------------------------------------------
  build-server:
    name: Build + push MCP server image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-server
            type=raw,value=${{ github.event.inputs.tag || 'dev' }}-server,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.production
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign + sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM + attest
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-server.cdx.json
          cosign attest --yes \
            --predicate sbom-server.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
        continue-on-error: true

  # -----------------------------------------------------------------------
  # Summary job — depends on all build jobs so CI shows a single status
  # -----------------------------------------------------------------------
  all-images:
    name: All production images published
    if: always()
    needs:
      - build-cpu
      - smoke-test
      - build-cuda13
      - build-rocm7
      - build-oneapi2025
      - build-server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-cpu.result }}" != "success" ]]; then
            echo "build-cpu failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "smoke-test failed"
            exit 1
          fi
          # The GPU + server variants used to be echoed and never gated, so they
          # could fail on every publish without anyone noticing. That is how
          # docker/Dockerfile.production-gpu kept a CUDA 12.0 pin, an
          # intel/oneapi-basekit:2026.0 reference to an image that does not
          # exist, and a ROCm 6.4 runtime against a 7.2.4 build toolchain.
          # They gate now.
          fail=0
          for job in build-cuda13 build-rocm7 build-oneapi2025 build-server; do
            case "$job" in
              build-cuda13)      r="${{ needs.build-cuda13.result }}" ;;
              build-rocm7)       r="${{ needs.build-rocm7.result }}" ;;
              build-oneapi2025)  r="${{ needs.build-oneapi2025.result }}" ;;
              build-server)      r="${{ needs.build-server.result }}" ;;
            esac
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error title=image build failed::$job = $r"
              fail=1
            else
              echo "$job = $r"
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1
          echo "all image variants passed"
