# Derive a `type:*` label from a pull request's Conventional-Commit prefix.
#
# GitHub generates release-note sections BY LABEL (see .github/release.yml), and
# this repository labelled almost nothing: 32 of the last 40 merged PRs carried
# no label at all, so a label-grouped release body would have put ~80% of the
# work under "Other changes". The Conventional-Commit prefix is already
# mandatory here (the commit-msg hook enforces it), so the type is derivable and
# nobody has to remember to label anything. ADR-1233.
#
# Trigger is `pull_request`, not `pull_request_target`: GitHub's default Actions
# event policy blocks `pull_request_target` on public repositories from
# 2026-12-02. A fork pull request gets a read-only token under `pull_request`,
# so the job skips it with a notice naming the label to add by hand.
name: PR type label

on:
  pull_request:
    # ADR-2169: no `synchronize`. The label comes from the pull request title,
    # which a push does not change; `edited` covers a title change.
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR by commit type
    runs-on: ubuntu-26.04
    steps:
      - name: Apply type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # A fork pull request has a read-only token here; name the label instead.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::fork pull request: a maintainer adds the type:* label for the title prefix by hand"
            exit 0
          fi

          # `type(scope)!: subject` -> type, and note the breaking-change bang.
          type="${PR_TITLE%%(*}"
          type="${type%%:*}"
          type="${type%!}"
          type="$(printf '%s' "$type" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          case "$type" in
            feat)     label="type:feature" ;;
            fix)      label="type:bug" ;;
            perf)     label="type:perf" ;;
            refactor) label="type:refactor" ;;
            docs)     label="type:docs" ;;
            test)     label="type:test" ;;
            build)    label="type:build" ;;
            ci)       label="type:ci" ;;
            chore)    label="type:chore" ;;
            revert)   label="type:revert" ;;
            security) label="type:security" ;;
            style)    label="type:style" ;;
            port)     label="type:port" ;;
            sycl)     label="type:sycl" ;;
            cuda)     label="type:cuda" ;;
            simd)     label="type:simd" ;;
            *)
              echo "::notice::'$type' is not a known Conventional-Commit type; no type label applied."
              exit 0
              ;;
          esac

          # Replace any previously-derived type label: the title can be edited,
          # and a PR carrying two type labels would appear twice in the release
          # notes, once under each section.
          if ! current=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                           --json labels --jq '.labels[].name'); then
            echo "::warning::could not read the labels of PR $PR_NUMBER; stale type labels are not removed."
            current=""
          fi
          while IFS= read -r existing; do
            case "$existing" in
              type:*)
                [ "$existing" = "$label" ] && continue
                if ! gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$existing"; then
                  echo "::warning::could not remove label $existing from PR $PR_NUMBER."
                fi
                ;;
            esac
          done <<< "$current"

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$label"
          echo "Applied $label (from '$type')."

          # A `!` before the colon, or a BREAKING CHANGE footer, is the
          # Conventional-Commit breaking marker. It gets its own section.
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
             || printf '%s' "$PR_BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "breaking-change"
            echo "Applied breaking-change."
          fi
