# ADR-1247: PR source checks cannot supply the full default-branch aggregate.
name: Scorecard PR policy
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: scorecard-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    # required-aggregator
    name: Scorecard PR Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Require ready review
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: test "$IS_DRAFT" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test policy and workflow failure controls
        run: |
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_scorecard_*.py' -v
          python3 -B scripts/dev/tests/test_repository_security.py -v
      - name: Bind clean local inputs before analysis
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -B scripts/ci/scorecard_gate.py snapshot \
            --sha "$EXPECTED_SHA" --repository "$EXPECTED_REPOSITORY" \
            --receipt "$RUNNER_TEMP/scorecard-source.json"
      - name: Scan PR files (partial scope; never published)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-local.json
          results_format: json
          publish_results: false
      - name: Enforce bound local policy
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -B scripts/ci/scorecard_gate.py local \
            --sha "$EXPECTED_SHA" --repository "$EXPECTED_REPOSITORY" \
            --report scorecard-local.json \
            --snapshot "$RUNNER_TEMP/scorecard-source.json" \
            --receipt "$RUNNER_TEMP/scorecard-local-gate.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve local findings and source receipt
        if: ${{ always() && github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scorecard-local.json
            ${{ runner.temp }}/scorecard-source.json
            ${{ runner.temp }}/scorecard-local-gate.json
          if-no-files-found: error
          retention-days: 14
