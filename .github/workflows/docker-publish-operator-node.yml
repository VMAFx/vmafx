        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Merge the platform images into one index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, got ${#digests[@]}" >&2
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "${META_JSON}")
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${PUBLISH_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${index}"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-node.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-node.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-node
          path: sbom-node.cdx.json
          retention-days: 90

      - name: Download the source digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: node-source-digest-*
          path: ${{ runner.temp }}/source-digests
          merge-multiple: true

      - name: Read the source digests
        id: source-digests
        working-directory: ${{ runner.temp }}/source-digests
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf 'sha256:%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 source digests, got ${#digests[@]}" >&2
            exit 1
          fi
          echo "digests=${digests[*]}" >> "$GITHUB_OUTPUT"

      # ADR-1503 / ADR-1513: SPDX SBOM per platform attested on its digest, and
      # the platform source images merged into <tag>-source.
      - name: Licence artifacts (SPDX SBOM attestations, source image)
        uses: ./.github/actions/image-licence-artifacts
        with:
          compression: ${{ env.IMAGE_COMPRESSION }}
          image: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          digest: ${{ steps.index.outputs.digest }}
          name: node
          source-tag: ${{ env.PUBLISH_TAG }}-source
          source-digests: ${{ steps.source-digests.outputs.digests }}
          platforms: linux/amd64,linux/arm64

  # -------------------------------------------------------------------------
  # Smoke-test: verify signatures, then pull and exercise all three images
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke-test images
    needs:
      - publish-operator
      - publish-server
      - publish-controller
      - publish-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify signatures before pull
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.publish-operator.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}@${{ needs.publish-controller.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"

      - name: Verify vmafx-server multi-architecture manifest
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                [.manifests[]?.platform
                  | select(.os == "linux")
                  | .architecture]
                | sort
                | unique == ["amd64", "arm64"]
              '

      - name: Smoke-test vmafx-operator runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.publish-operator.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-operator"]'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"

      - name: Smoke-test vmafx-server runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-server"]'
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = \
            '65532:65532'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"
          docker run --rm --entrypoint /usr/local/bin/vmaf "${image}" --version
          # `--version` never loads a model: the first v1.0.0-rc.1 images passed it
          # although their builder lacked xxd and embedded no model. Scoring
          # without --model only works when the default model is compiled in.
          frames="${RUNNER_TEMP}/smoke-frames"
          mkdir -p "${frames}"
          # Two identical 576x324 4:2:0 frames, large enough for the default
          # model's cambi and speed_chroma minimums.
          head -c $((576 * 324 * 3)) /dev/urandom > "${frames}/ref.yuv"
          docker run --rm --entrypoint /usr/local/bin/vmaf \
            -v "${frames}:/frames:ro" "${image}" \
            --reference /frames/ref.yuv --distorted /frames/ref.yuv \
            --width 576 --height 324 --pixel_format 420 --bitdepth 8 \
            --json --output /dev/stdout \
            | jq -e '.pooled_metrics.vmaf.mean'

      - name: Smoke-test vmafx-server HTTP startup
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          name="vmafx-server-release-smoke"
          cleanup() {
            status=$?
            if [[ "${status}" -ne 0 ]] && ! docker logs "${name}" 2>&1; then
              echo "::warning::no container logs for ${name}" >&2
            fi
            if docker inspect "${name}" >/dev/null 2>&1; then
              docker rm --force "${name}" >/dev/null
            fi
          }
          trap cleanup EXIT

          docker run --detach --name "${name}" \
            --publish 127.0.0.1::8080 \
            "${image}"
          http_address="$(docker port "${name}" 8080/tcp)"

          ready=false
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${name}")" != "true" ]]; then
              echo "vmafx-server exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 "http://${http_address}/healthz" >/dev/null \
              && curl --fail --silent --show-error --max-time 5 "http://${http_address}/readyz" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = "true"

      # ADR-1589: entrypoint, nonroot user, --version, and an HTTP start with
      # auth disabled whose SQLite queue lands in the image's /data.
      - name: Smoke-test vmafx-controller runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}@${{ needs.publish-controller.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-controller"]'
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = '65532:65532'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"
          name="vmafx-controller-release-smoke"
          cleanup() {
            status=$?
            if [[ "${status}" -ne 0 ]] && ! docker logs "${name}" 2>&1; then
              echo "::warning::no container logs for ${name}" >&2
            fi
            if docker inspect "${name}" >/dev/null 2>&1; then
              docker rm --force "${name}" >/dev/null
            fi
          }
          trap cleanup EXIT
          docker run --detach --name "${name}" --env VMAFX_AUTH_DISABLED=true \
            --publish 127.0.0.1::8080 "${image}"
          http_address="$(docker port "${name}" 8080/tcp)"
          ready=false
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${name}")" != "true" ]]; then
              echo "vmafx-controller exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 "http://${http_address}/readyz" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = "true"

      - name: Smoke-test vmafx-node runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-node"]'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"
          docker run --rm --entrypoint /usr/local/bin/vmaf "${image}" --version
          # `--version` never loads a model: the first v1.0.0-rc.1 images passed it
          # although their builder lacked xxd and embedded no model. Scoring
          # without --model only works when the default model is compiled in.
          frames="${RUNNER_TEMP}/smoke-frames"
          mkdir -p "${frames}"
          # Two identical 576x324 4:2:0 frames, large enough for the default
          # model's cambi and speed_chroma minimums.
          head -c $((576 * 324 * 3)) /dev/urandom > "${frames}/ref.yuv"
          docker run --rm --entrypoint /usr/local/bin/vmaf \
            -v "${frames}:/frames:ro" "${image}" \
            --reference /frames/ref.yuv --distorted /frames/ref.yuv \
            --width 576 --height 324 --pixel_format 420 --bitdepth 8 \
            --json --output /dev/stdout \
            | jq -e '.pooled_metrics.vmaf.mean'
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "${image}" -version
          # Remote storage inputs run rclone (pkg/storage, ADR-0719).
          docker run --rm --entrypoint /usr/local/bin/rclone "${image}" version
          # Mount mode (ADR-1593): as UID 65532, with only the bounding-set
          # capabilities node.fuse grants, the setuid fusermount3 and the
          # util-linux mount it runs mount an rclone remote; the file reads
          # back through FUSE and unmounts. AppArmor (on the runner) denies
          # mount under Docker's default profile.
          mounted="vmafx-node-mount-smoke"
          docker run --detach --name "${mounted}" --device /dev/fuse \
            --cap-drop ALL --cap-add SYS_ADMIN --cap-add DAC_READ_SEARCH \
            --security-opt apparmor=unconfined --read-only --tmpfs /tmp:mode=1777 \
            -v "${frames}:/frames:ro" --entrypoint /usr/local/bin/rclone "${image}" \
            rcd --rc-no-auth --rc-addr 127.0.0.1:5572
          trap 'docker rm -f "${mounted}" > /dev/null' EXIT
          docker exec "${mounted}" rclone mkdir /tmp/m
          timeout 60 docker exec "${mounted}" \
            rclone mount :local:/frames /tmp/m --daemon --vfs-cache-mode off
          test "$(docker exec "${mounted}" rclone md5sum /tmp/m/ref.yuv | cut -d' ' -f1)" = \
            "$(md5sum "${frames}/ref.yuv" | cut -d' ' -f1)"
          docker exec "${mounted}" /usr/bin/fusermount3 -u /tmp/m

  # -------------------------------------------------------------------------
  # Summary gate — CI shows a single green/red status
  # -------------------------------------------------------------------------
  all-images:
    name: Images published
    if: always() && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    needs:
      - build-operator
      - publish-operator
      - build-server
      - publish-server
      - build-controller
      - publish-controller
      - build-node
      - publish-node
      - smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-operator.result }}" != "success" ]]; then
            echo "build-operator failed"
            exit 1
          fi
          if [[ "${{ needs.publish-operator.result }}" != "success" ]]; then
            echo "publish-operator failed"
            exit 1
          fi
          if [[ "${{ needs.build-server.result }}" != "success" ]]; then
            echo "build-server failed"
            exit 1
          fi
          if [[ "${{ needs.publish-server.result }}" != "success" ]]; then
            echo "publish-server failed"
            exit 1
          fi
          if [[ "${{ needs.build-controller.result }}" != "success" ]]; then
            echo "build-controller failed"
            exit 1
          fi
          if [[ "${{ needs.publish-controller.result }}" != "success" ]]; then
            echo "publish-controller failed"
            exit 1
          fi
          if [[ "${{ needs.build-node.result }}" != "success" ]]; then
            echo "build-node failed"
            exit 1
          fi
          if [[ "${{ needs.publish-node.result }}" != "success" ]]; then
            echo "publish-node failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "smoke-test failed"
            exit 1
          fi
          echo "All images published and smoke-tested."
