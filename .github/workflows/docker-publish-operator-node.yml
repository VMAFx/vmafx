# docker-publish-operator-node — build, push, sign, and SBOM the VMAFX Go
# service images when a release-please draft is published.
#
# Triggers:
#   - publication of a release-please draft (`release.published`)
#   - workflow_dispatch at an existing published tag for recovery
#
# Produces:
#   ghcr.io/vmafx/vmafx-operator:<tag>   (amd64 + arm64)
#   ghcr.io/vmafx/vmafx-operator:latest  (same)
#   ghcr.io/vmafx/vmafx-server:<tag>     (amd64 + arm64, Go HTTP/gRPC server)
#   ghcr.io/vmafx/vmafx-server:latest    (same)
#   ghcr.io/vmafx/vmafx-node:<tag>       (amd64 + arm64, CPU variant)
#   ghcr.io/vmafx/vmafx-node:latest      (same)
#
# Post-push steps: cosign keyless sign + syft SBOM (CycloneDX JSON) via cosign attest.
# GPU node variants (-cuda13, -rocm10, -sycl) are deferred to a follow-on PR.
#
# ADR-0815: operator-node-distroless-dockerfiles
# ADR-0698: distroless base-image policy

name: Publish Operator Node

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published vX.Y.Z tag to recover idempotently"
        required: true

# Workflow-level least-privilege; jobs that push/sign/attest opt in below.
permissions:
  contents: read

# A release tag must fan out only once; never cancel a partially-published set.
concurrency:
  group: docker-publish-operator-node-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: vmafx/vmafx-operator
  SERVER_IMAGE: vmafx/vmafx-server
  NODE_IMAGE: vmafx/vmafx-node
  PUBLISH_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  validate-release:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      is-latest: ${{ steps.release.outputs.is_latest }}
      recovery: ${{ steps.release.outputs.recovery }}
      recipe-sha: ${{ steps.release.outputs.recipe_sha }}
      source-sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - name: Reject source/tag mismatches
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # ADR-1201: release candidates publish too; the tag and the release
          # flag must agree rather than prereleases being refused outright.
          case "$PUBLISH_TAG" in
            *-rc.*) tag_is_rc=true ;;
            *)      tag_is_rc=false ;;
          esac
          # The release's prerelease flag is read from the API below: a
          # workflow_dispatch event carries no release payload.
          expected_ref="refs/tags/$PUBLISH_TAG"
          recovery=false
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            # ADR-1347: only a recovery dispatch on the default branch may run
            # away from the tag; it builds the tag's source with this ref's
            # build recipe (docker/ and Dockerfile.go-server).
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                  "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "ERROR: run this workflow at $expected_ref, not $GITHUB_REF" >&2
              exit 1
            fi
            recovery=true
            echo "::notice::recovery dispatch: $PUBLISH_TAG source, build recipe from $GITHUB_SHA"
          fi
          scripts/release/verify-release-version.sh "$PUBLISH_TAG"
          if [[ "$recovery" == false && "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "ERROR: workflow source SHA $GITHUB_SHA does not match checked-out tag" >&2
            exit 1
          fi
          {
            echo "recovery=$recovery"
            echo "recipe_sha=$GITHUB_SHA"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          release_json="$RUNNER_TEMP/github-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PUBLISH_TAG" > "$release_json"
          if [[ "$(jq -r '.tag_name' "$release_json")" != "$PUBLISH_TAG" || \
                "$(jq -r '.draft' "$release_json")" != "false" || \
                "$(jq -r '.prerelease' "$release_json")" != "$tag_is_rc" || \
                "$(jq -r '.published_at != null' "$release_json")" != "true" ]]; then
            echo "ERROR: $PUBLISH_TAG must name a published, non-prerelease release" >&2
            exit 1
          fi
          echo "tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
          # ADR-1151 — the `latest` moving tag used to be gated on
          # `github.event_name == 'release'`, so the documented recovery
          # dispatch (docs/development/release.md) republished the versioned
          # tag but left `latest` pointing at whatever digest the broken
          # original run had pushed. Resolve it from the repository's actual
          # newest published release instead, which makes the guard identical
          # on both trigger paths.
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)"
          if [[ "$latest_tag" == "$PUBLISH_TAG" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PUBLISH_TAG is not the newest release (${latest_tag:-none}); skipping the 'latest' tag"
          fi

  # -------------------------------------------------------------------------
  # Build + push vmafx-operator (amd64 + arm64)
  # Pure-Go / CGO_ENABLED=0 — uses BuildKit TARGETARCH build-arg for native
  # cross-compilation; no QEMU emulation needed.
  # -------------------------------------------------------------------------
  build-operator:
    name: Publish vmafx-operator
    needs: validate-release
    runs-on: ubuntu-latest
    # A two-platform (amd64 + arm64 under QEMU) Go build; v1.0.0-rc.1's run
    # was cancelled at 30 minutes mid-build. Same limit as vmafx-server.
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
      packages: write    # push to GHCR
      id-token: write    # cosign keyless OIDC
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false  # ADR-1086: drop GITHUB_TOKEN from .git/config

      # ADR-1347: a recovery dispatch builds the tag's source with the build
      # recipe of the default-branch commit it runs from; nothing else moves.
      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server
          git status --short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.operator
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-operator.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-operator.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-operator
          path: sbom-operator.cdx.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Build + push vmafx-server (amd64 + arm64)
  # CGO + libvmaf stages execute natively for each target under QEMU.
  # -------------------------------------------------------------------------
  build-server:
    name: Publish vmafx-server
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false  # ADR-1086: drop GITHUB_TOKEN from .git/config

      # ADR-1347: a recovery dispatch builds the tag's source with the build
      # recipe of the default-branch commit it runs from; nothing else moves.
      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server
          git status --short

      - name: Set up QEMU (arm64 cross-emulation for CGO + libvmaf stages)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go-server
          target: go-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-server.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-server.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-server
          path: sbom-server.cdx.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Build + push vmafx-node CPU variant (amd64 + arm64)
  # CGO + ffmpeg stages require QEMU for arm64 emulation.
  # -------------------------------------------------------------------------
  build-node:
    # ADR-1349: each architecture builds on its own native runner. Under QEMU
    # the arm64 FFmpeg + libvmaf + CGO build ran past the 120-minute limit on
    # every v1.0.0-rc.1 attempt, and a timed-out job never exports its cache.
    # publish-node merges the two digests into the published multi-arch index.
    name: Build vmafx-node (${{ matrix.arch }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false  # ADR-1086: drop GITHUB_TOKEN from .git/config

      # ADR-1347: a recovery dispatch builds the tag's source with the build
      # recipe of the default-branch commit it runs from; nothing else moves.
      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server
          git status --short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.node
          target: node-cpu
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NODE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=node-${{ matrix.arch }}
          cache-to: type=gha,scope=node-${{ matrix.arch }},mode=max
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4

      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-node:
    name: Publish vmafx-node CPU
    needs:
      - validate-release
      - build-node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.index.outputs.digest }}

    steps:
      - name: Download the platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: node-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Merge the platform images into one index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, got ${#digests[@]}" >&2
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "${META_JSON}")
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${PUBLISH_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${index}"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-node.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-node.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-node
          path: sbom-node.cdx.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Smoke-test: verify signatures, then pull and exercise all three images
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke-test images
    needs:
      - build-operator
      - build-server
      - publish-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify signatures before pull
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.build-operator.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.build-server.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"

      - name: Verify vmafx-server multi-architecture manifest
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.build-server.outputs.digest }}"
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                [.manifests[]?.platform
                  | select(.os == "linux")
                  | .architecture]
                | sort
                | unique == ["amd64", "arm64"]
              '

      - name: Smoke-test vmafx-operator runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.build-operator.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-operator"]'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"

      - name: Smoke-test vmafx-server runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.build-server.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-server"]'
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = \
            '65532:65532'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"
          docker run --rm --entrypoint /usr/local/bin/vmaf "${image}" --version
          # `--version` never loads a model: the first v1.0.0-rc.1 images passed it
          # although their builder lacked xxd and embedded no model. Scoring
          # without --model only works when the default model is compiled in.
          frames="${RUNNER_TEMP}/smoke-frames"
          mkdir -p "${frames}"
          # Two identical 576x324 4:2:0 frames, large enough for the default
          # model's cambi and speed_chroma minimums.
          head -c $((576 * 324 * 3)) /dev/urandom > "${frames}/ref.yuv"
          docker run --rm --entrypoint /usr/local/bin/vmaf \
            -v "${frames}:/frames:ro" "${image}" \
            --reference /frames/ref.yuv --distorted /frames/ref.yuv \
            --width 576 --height 324 --pixel_format 420 --bitdepth 8 \
            --json --output /dev/stdout \
            | jq -e '.pooled_metrics.vmaf.mean'

      - name: Smoke-test vmafx-server HTTP startup
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.build-server.outputs.digest }}"
          name="vmafx-server-release-smoke"
          cleanup() {
            status=$?
            if [[ "${status}" -ne 0 ]]; then
              docker logs "${name}" 2>&1 || true
            fi
            docker rm --force "${name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "${name}" \
            --publish 127.0.0.1::8080 \
            "${image}"
          http_address="$(docker port "${name}" 8080/tcp)"

          ready=false
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${name}")" != "true" ]]; then
              echo "vmafx-server exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --show-error "http://${http_address}/healthz" >/dev/null \
              && curl --fail --silent --show-error "http://${http_address}/readyz" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = "true"

      - name: Smoke-test vmafx-node runtime
        run: |
          image="${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${image}")" = \
            '["/usr/local/bin/vmafx-node"]'
          version="$(docker run --rm "${image}" --version)"
          test "${version}" = "${{ env.PUBLISH_TAG }}"
          docker run --rm --entrypoint /usr/local/bin/vmaf "${image}" --version
          # `--version` never loads a model: the first v1.0.0-rc.1 images passed it
          # although their builder lacked xxd and embedded no model. Scoring
          # without --model only works when the default model is compiled in.
          frames="${RUNNER_TEMP}/smoke-frames"
          mkdir -p "${frames}"
          # Two identical 576x324 4:2:0 frames, large enough for the default
          # model's cambi and speed_chroma minimums.
          head -c $((576 * 324 * 3)) /dev/urandom > "${frames}/ref.yuv"
          docker run --rm --entrypoint /usr/local/bin/vmaf \
            -v "${frames}:/frames:ro" "${image}" \
            --reference /frames/ref.yuv --distorted /frames/ref.yuv \
            --width 576 --height 324 --pixel_format 420 --bitdepth 8 \
            --json --output /dev/stdout \
            | jq -e '.pooled_metrics.vmaf.mean'
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "${image}" -version

  # -------------------------------------------------------------------------
  # Summary gate — CI shows a single green/red status
  # -------------------------------------------------------------------------
  all-images:
    name: Images published
    if: always()
    needs:
      - build-operator
      - build-server
      - build-node
      - publish-node
      - smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-operator.result }}" != "success" ]]; then
            echo "build-operator failed"
            exit 1
          fi
          if [[ "${{ needs.build-server.result }}" != "success" ]]; then
            echo "build-server failed"
            exit 1
          fi
          if [[ "${{ needs.build-node.result }}" != "success" ]]; then
            echo "build-node failed"
            exit 1
          fi
          if [[ "${{ needs.publish-node.result }}" != "success" ]]; then
            echo "publish-node failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "smoke-test failed"
            exit 1
          fi
          echo "All images published and smoke-tested."
