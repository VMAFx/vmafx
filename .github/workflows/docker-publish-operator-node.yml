# docker-publish-operator-node — build, push, sign, and SBOM the VMAFX Go
# service images when a release-please draft is published.
#
# Triggers:
#   - publication of a release-please draft (`release.published`)
#   - workflow_dispatch at an existing published tag for recovery
#
# Produces:
#   ghcr.io/vmafx/vmafx-operator:<tag>   (amd64 + arm64)
#   ghcr.io/vmafx/vmafx-operator:latest  (same)
#   ghcr.io/vmafx/vmafx-server:<tag>     (amd64 + arm64, Go HTTP/gRPC server)
#   ghcr.io/vmafx/vmafx-server:latest    (same)
#   ghcr.io/vmafx/vmafx-controller:<tag> (amd64 + arm64, job queue + auth gateway, ADR-1589)
#   ghcr.io/vmafx/vmafx-controller:latest (same)
#   ghcr.io/vmafx/vmafx-node:<tag>       (amd64 + arm64, CPU variant)
#   ghcr.io/vmafx/vmafx-node:latest      (same)
#
# Post-push steps: cosign keyless sign + syft SBOM (CycloneDX JSON) via cosign attest.
# Each image also carries its licence texts and passes a licence check in its
# build; every platform image gets an SPDX SBOM attested with actions/attest,
# and the corresponding source each platform build pushes is merged into
# <image>:<tag>-source (.github/actions/image-licence-artifacts, ADR-1513).
# GPU node variants (-cuda13, -rocm10, -sycl) are deferred to a follow-on PR.
#
# ADR-0815: operator-node-distroless-dockerfiles
# ADR-0698: distroless base-image policy

name: Publish Operator Node

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published vX.Y.Z tag to recover idempotently"
        required: true

# Workflow-level least-privilege; jobs that push/sign/attest opt in below.
permissions:
  contents: read

# A release tag must fan out only once; never cancel a partially-published set.
concurrency:
  group: docker-publish-operator-node-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: vmafx/vmafx-operator
  SERVER_IMAGE: vmafx/vmafx-server
  CONTROLLER_IMAGE: vmafx/vmafx-controller
  NODE_IMAGE: vmafx/vmafx-node
  PUBLISH_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  # Layer compression of every image this workflow pushes (ADR-1594): zstd at
  # BuildKit's strongest level (22 maps to klauspost's best, about zstd 11).
  # force-compression converts every layer that is not zstd yet, base-image and
  # cached layers included; oci-mediatypes because Docker rejects zstd layers under
  # Docker manifest media types. Pulling needs Docker Engine 23.0 or later (Docker
  # Desktop 4.19), containerd 1.5 or later, or Podman; docs/usage/docker.md.
  IMAGE_COMPRESSION: compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true

jobs:
  validate-release:
    name: Validate tag
    # Release events also fire for tester prereleases (tester-*, tester-windows-*);
    # only version tags (v*) belong to this workflow. Dependent jobs skip with it.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      is-latest: ${{ steps.release.outputs.is_latest }}
      recovery: ${{ steps.release.outputs.recovery }}
      recipe-sha: ${{ steps.release.outputs.recipe_sha }}
      source-sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - name: Reject source/tag mismatches
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # ADR-1201: release candidates publish too; the tag and the release
          # flag must agree rather than prereleases being refused outright.
          case "$PUBLISH_TAG" in
            *-rc.*) tag_is_rc=true ;;
            *)      tag_is_rc=false ;;
          esac
          # The release's prerelease flag is read from the API below: a
          # workflow_dispatch event carries no release payload.
          expected_ref="refs/tags/$PUBLISH_TAG"
          recovery=false
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            # ADR-1347: only a recovery dispatch on the default branch may run
            # away from the tag; it builds the tag's source with this ref's
            # build recipe (docker/ and Dockerfile.go-server).
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                  "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "ERROR: run this workflow at $expected_ref, not $GITHUB_REF" >&2
              exit 1
            fi
            recovery=true
            echo "::notice::recovery dispatch: $PUBLISH_TAG source, build recipe from $GITHUB_SHA"
          fi
          scripts/release/verify-release-version.sh "$PUBLISH_TAG"
          if [[ "$recovery" == false && "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "ERROR: workflow source SHA $GITHUB_SHA does not match checked-out tag" >&2
            exit 1
          fi
          {
            echo "recovery=$recovery"
            echo "recipe_sha=$GITHUB_SHA"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          release_json="$RUNNER_TEMP/github-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PUBLISH_TAG" > "$release_json"
          if [[ "$(jq -r '.tag_name' "$release_json")" != "$PUBLISH_TAG" || \
                "$(jq -r '.draft' "$release_json")" != "false" || \
                "$(jq -r '.prerelease' "$release_json")" != "$tag_is_rc" || \
                "$(jq -r '.published_at != null' "$release_json")" != "true" ]]; then
            echo "ERROR: $PUBLISH_TAG must name a published, non-prerelease release" >&2
            exit 1
          fi
          echo "tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
          # ADR-1151 — the `latest` moving tag used to be gated on
          # `github.event_name == 'release'`, so the documented recovery
          # dispatch (docs/development/release.md) republished the versioned
          # tag but left `latest` pointing at whatever digest the broken
          # original run had pushed. Resolve it from the repository's actual
          # newest published release instead, which makes the guard identical
          # on both trigger paths.
          # A repository without a non-prerelease release answers 404: no
          # `latest` yet. Any other failure stops the publish.
          if ! latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name' 2>"$RUNNER_TEMP/latest-release.err")"; then
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest-release.err"; then
              cat "$RUNNER_TEMP/latest-release.err" >&2
              exit 1
            fi
            latest_tag=""
          fi
          if [[ "$latest_tag" == "$PUBLISH_TAG" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PUBLISH_TAG is not the newest release (${latest_tag:-none}); skipping the 'latest' tag"
          fi

  # -------------------------------------------------------------------------
  # Build + push vmafx-operator (amd64 + arm64)
  # Pure-Go / CGO_ENABLED=0 — uses BuildKit TARGETARCH build-arg for native
  # cross-compilation; no QEMU emulation needed.
  # -------------------------------------------------------------------------
  build-operator:
    # ADR-1349: each architecture builds on its own native runner, as
    # vmafx-node does; under QEMU the arm64 Go build took 30-35 minutes.
    # publish-operator merges the two digests into the published index.
    name: Build vmafx-operator (${{ matrix.arch }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false  # ADR-1086: drop GITHUB_TOKEN from .git/config

      # ADR-1347: a recovery dispatch builds the tag's source with the build
      # recipe of the default-branch commit it runs from (ADR-1350: including
      # the patches to the bundled FFmpeg); nothing else moves.
      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server ffmpeg-patches/ \
            tools/rc1-tester/image/ .github/actions/ scripts/ci/record-copied-debian-libs.sh
          git status --short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.operator
          target: operator
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true,${{ env.IMAGE_COMPRESSION }}
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          cache-to: type=gha,scope=operator-${{ matrix.arch }},mode=max
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}

      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: operator-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # ADR-1503 rule 5 / ADR-1513: the corresponding source of this platform
      # image, built from the same stages and pushed by digest; the publish job
      # merges both platforms into <tag>-source.
      - name: Push the source image by digest (${{ matrix.platform }})
        id: push-source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.operator
          target: source-export
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true,${{ env.IMAGE_COMPRESSION }}
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}

      - name: Upload the source digest
        env:
          DIGEST: ${{ steps.push-source.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/source-digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/source-digests/${DIGEST#sha256:}"

      - name: Upload the source digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: operator-source-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/source-digests/*
          if-no-files-found: error
          retention-days: 1

  publish-operator:
    name: Publish vmafx-operator
    needs:
      - validate-release
      - build-operator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.index.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.recipe-sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download the platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: operator-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Merge the platform images into one index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, got ${#digests[@]}" >&2
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "${META_JSON}")
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${PUBLISH_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${index}"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.index.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-operator.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-operator.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-operator
          path: sbom-operator.cdx.json
          retention-days: 90

      - name: Download the source digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: operator-source-digest-*
          path: ${{ runner.temp }}/source-digests
          merge-multiple: true

      - name: Read the source digests
        id: source-digests
        working-directory: ${{ runner.temp }}/source-digests
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf 'sha256:%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 source digests, got ${#digests[@]}" >&2
            exit 1
          fi
          echo "digests=${digests[*]}" >> "$GITHUB_OUTPUT"

      # ADR-1503 / ADR-1513: SPDX SBOM per platform attested on its digest, and
      # the platform source images merged into <tag>-source.
      - name: Licence artifacts (SPDX SBOM attestations, source image)
        uses: ./.github/actions/image-licence-artifacts
        with:
          compression: ${{ env.IMAGE_COMPRESSION }}
          image: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          digest: ${{ steps.index.outputs.digest }}
          name: operator
          source-tag: ${{ env.PUBLISH_TAG }}-source
          source-digests: ${{ steps.source-digests.outputs.digests }}
          platforms: linux/amd64,linux/arm64

  # -------------------------------------------------------------------------
  # Build + push vmafx-server (amd64 + arm64)
  # CGO + libvmaf stages execute natively for each target under QEMU.
  # -------------------------------------------------------------------------
  build-server:
    # ADR-1349: each architecture builds on its own native runner, as
    # vmafx-node does; under QEMU the arm64 libvmaf + CGO build took 46 minutes of its 60.
    # publish-server merges the two digests into the published index.
    name: Build vmafx-server (${{ matrix.arch }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false  # ADR-1086: drop GITHUB_TOKEN from .git/config

      # ADR-1347: a recovery dispatch builds the tag's source with the build
      # recipe of the default-branch commit it runs from (ADR-1350: including
      # the patches to the bundled FFmpeg); nothing else moves.
      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server ffmpeg-patches/ \
            tools/rc1-tester/image/ .github/actions/ scripts/ci/record-copied-debian-libs.sh
          git status --short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go-server
          target: go-server
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true,${{ env.IMAGE_COMPRESSION }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}

      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # ADR-1503 rule 5 / ADR-1513: the corresponding source of this platform
      # image, built from the same stages and pushed by digest; the publish job
      # merges both platforms into <tag>-source.
      - name: Push the source image by digest (${{ matrix.platform }})
        id: push-source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go-server
          target: source-export
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true,${{ env.IMAGE_COMPRESSION }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}

      - name: Upload the source digest
        env:
          DIGEST: ${{ steps.push-source.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/source-digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/source-digests/${DIGEST#sha256:}"

      - name: Upload the source digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: server-source-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/source-digests/*
          if-no-files-found: error
          retention-days: 1

  publish-server:
    name: Publish vmafx-server
    needs:
      - validate-release
      - build-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.index.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.recipe-sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download the platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Merge the platform images into one index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, got ${#digests[@]}" >&2
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "${META_JSON}")
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          index="$(docker buildx imagetools inspect "${IMAGE}:${PUBLISH_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect "${IMAGE}@${index}"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

