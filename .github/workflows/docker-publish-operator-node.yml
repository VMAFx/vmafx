          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }},push-by-digest=true,name-canonical=true,push=true,${{ env.IMAGE_COMPRESSION }}
          cache-from: type=gha,scope=controller-${{ matrix.arch }}
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}

