    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
