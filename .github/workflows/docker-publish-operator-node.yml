          persist-credentials: false

      - name: Download the platform digests
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: node-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Download the platform digests (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        shell: bash
        run: |
          echo '::warning::artifact download skipped on Gitea: v4+ is GitHub-only, v3 lacks merge-multiple, pattern'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.is-latest == 'true' }}

      - name: Merge the platform images into one index
        id: index
        uses: ./.github/actions/merge-platform-index
        with:
          image: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          meta-json: ${{ steps.meta.outputs.json }}
          tag: ${{ env.PUBLISH_TAG }}
          digests-dir: ${{ runner.temp }}/digests

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.4"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-node.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-node.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.index.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-node
          path: sbom-node.cdx.json
          retention-days: 90
      - name: Upload SBOM as workflow artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: sbom-node
          path: sbom-node.cdx.json
          retention-days: 90

      - name: Download the source digests
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: node-source-digest-*
          path: ${{ runner.temp }}/source-digests
          merge-multiple: true
      - name: Download the source digests (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        shell: bash
        run: |
          echo '::warning::artifact download skipped on Gitea: v4+ is GitHub-only, v3 lacks merge-multiple, pattern'

      - name: Read the source digests
        id: source-digests
        working-directory: ${{ runner.temp }}/source-digests
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf 'sha256:%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 source digests, got ${#digests[@]}" >&2
            exit 1
          fi
          echo "digests=${digests[*]}" >> "$GITHUB_OUTPUT"

      # ADR-1503, ADR-1513 (design notes)
      - name: Licence artifacts (SPDX SBOM attestations, source image)
        uses: ./.github/actions/image-licence-artifacts
        with:
          compression: ${{ env.IMAGE_COMPRESSION }}
          image: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          digest: ${{ steps.index.outputs.digest }}
          name: node
          source-tag: ${{ env.PUBLISH_TAG }}-source
          source-digests: ${{ steps.source-digests.outputs.digests }}
          platforms: linux/amd64,linux/arm64

  publish-node-sycl:
    name: Publish vmafx-node SYCL (amd64)
    needs: validate-release
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: release-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Use the recovery dispatch's build recipe
        if: needs.validate-release.outputs.recovery == 'true'
        env:
          RECIPE_SHA: ${{ needs.validate-release.outputs.recipe-sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          git checkout FETCH_HEAD -- docker/ Dockerfile.go-server ffmpeg-patches/ \
            tools/rc1-tester/image/ .github/actions/ scripts/ci/record-copied-debian-libs.sh \
            scripts/ci/build-oneapi-libvmaf.sh
          git status --short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          labels: |
            io.vmafx.build-recipe=${{ needs.validate-release.outputs.recipe-sha }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source-sha }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}-sycl

      - name: Build and push (amd64 only)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.node
          target: node-sycl
          platforms: linux/amd64
          outputs: type=image,push=true,${{ env.IMAGE_COMPRESSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-sycl-amd64
          cache-to: type=gha,scope=node-sycl-amd64,mode=max
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}-sycl
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.4"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.push.outputs.digest }}" \
            --output cyclonedx-json \
            --file sbom-node-sycl.cdx.json

      - name: Attach SBOM via cosign attest
        run: |
          cosign attest --yes \
            --predicate sbom-node-sycl.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM as workflow artifact
        if: ${{ env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-node-sycl
          path: sbom-node-sycl.cdx.json
          retention-days: 90
      - name: Upload SBOM as workflow artifact (Gitea)
        if: ${{ env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: sbom-node-sycl
          path: sbom-node-sycl.cdx.json
          retention-days: 90

      # ADR-1503, ADR-1513, ADR-3371 (design notes)
      - name: Licence artifacts (SPDX SBOM attestation, source image)
        uses: ./.github/actions/image-licence-artifacts
        with:
          compression: ${{ env.IMAGE_COMPRESSION }}
          image: ${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}
          digest: ${{ steps.push.outputs.digest }}
          name: node-sycl
          source-file: docker/Dockerfile.node
          source-target: node-sycl-source-export
          source-tag: ${{ env.PUBLISH_TAG }}-sycl-source
          platforms: linux/amd64
          build-args: |
            VMAFX_VERSION=${{ env.PUBLISH_TAG }}
            VMAF_BUILD_JOBS=4
            VMAFX_SOURCE_COMMIT=${{ needs.validate-release.outputs.source-sha }}
            VMAFX_IMAGE_TAG=${{ env.PUBLISH_TAG }}-sycl

  # -------------------------------------------------------------------------
  # Smoke-test: verify signatures, then pull and exercise all three images
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke-test images
    needs:
      - validate-release
      - publish-operator
      - publish-server
      - publish-controller
      - publish-node
      - publish-node-sycl
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.recipe-sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.4"

      - name: Verify signatures before pull
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.publish-operator.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}@${{ needs.publish-controller.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"
          cosign verify \
            --certificate-identity \
              "https://github.com/VMAFx/vmafx/.github/workflows/docker-publish-operator-node.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node-sycl.outputs.digest }}"

      - name: Verify vmafx-server multi-architecture manifest
        run: |
          image="${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                [.manifests[]?.platform
                  | select(.os == "linux")
                  | .architecture]
                | sort
                | unique == ["amd64", "arm64"]
              '

      - name: Smoke-test vmafx-operator runtime
        run: >-
          bash scripts/release/smoke-published-image.sh
          "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ needs.publish-operator.outputs.digest }}"
          operator "${{ env.PUBLISH_TAG }}"

      - name: Smoke-test vmafx-server runtime
        run: >-
          bash scripts/release/smoke-published-image.sh
          "${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}@${{ needs.publish-server.outputs.digest }}"
          server "${{ env.PUBLISH_TAG }}"

      # ADR-1589 (design notes)
      - name: Smoke-test vmafx-controller runtime
        run: >-
          bash scripts/release/smoke-published-image.sh
          "${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}@${{ needs.publish-controller.outputs.digest }}"
          controller "${{ env.PUBLISH_TAG }}"

      # ADR-0719, ADR-1593 (design notes)
      - name: Smoke-test vmafx-node runtime
        run: >-
          bash scripts/release/smoke-published-image.sh
          "${{ env.REGISTRY }}/${{ env.NODE_IMAGE }}@${{ needs.publish-node.outputs.digest }}"
          node "${{ env.PUBLISH_TAG }}"

  # -------------------------------------------------------------------------
  # Summary gate — CI shows a single green/red status
  # -------------------------------------------------------------------------
  all-images:
    name: Images published
    if: always() && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    needs:
      - build-operator
      - publish-operator
      - build-server
      - publish-server
      - build-controller
      - publish-controller
      - build-node
      - publish-node
      - publish-node-sycl
      - smoke-test
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-operator.result }}" != "success" ]]; then
            echo "build-operator failed"
            exit 1
          fi
          if [[ "${{ needs.publish-operator.result }}" != "success" ]]; then
            echo "publish-operator failed"
            exit 1
          fi
          if [[ "${{ needs.build-server.result }}" != "success" ]]; then
            echo "build-server failed"
            exit 1
          fi
          if [[ "${{ needs.publish-server.result }}" != "success" ]]; then
            echo "publish-server failed"
            exit 1
          fi
          if [[ "${{ needs.build-controller.result }}" != "success" ]]; then
            echo "build-controller failed"
            exit 1
          fi
          if [[ "${{ needs.publish-controller.result }}" != "success" ]]; then
            echo "publish-controller failed"
            exit 1
          fi
          if [[ "${{ needs.build-node.result }}" != "success" ]]; then
            echo "build-node failed"
            exit 1
          fi
          if [[ "${{ needs.publish-node.result }}" != "success" ]]; then
            echo "publish-node failed"
            exit 1
          fi
          if [[ "${{ needs.publish-node-sycl.result }}" != "success" ]]; then
            echo "publish-node-sycl failed"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "smoke-test failed"
            exit 1
          fi
          echo "All images published and smoke-tested."
