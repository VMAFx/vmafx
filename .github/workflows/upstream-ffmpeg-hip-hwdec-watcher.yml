# Active monitoring for FFmpeg adding a ROCm/HIP hwdec context type
# (the unblock for shipping a dedicated libvmaf_hip FFmpeg filter).
# Per ADR-0448. The fork's docs/state.md
# T-FFMPEG-HIP-FILTER-DEFERRED row is deferred behind FFmpeg
# acquiring AV_HWDEVICE_TYPE_HIP (or AV_HWDEVICE_TYPE_ROCM, etc.).
# Polls weekly: reads FFmpeg's GitHub mirror (default branch) for an
# AV_HWDEVICE_TYPE_HIP / _ROCM enum variant in libavutil/hwcontext.h, or
# new hwcontext_hip.{c,h} files under libavutil/.
name: Watcher — FFmpeg HIP hwdec
# Watcher — FFmpeg HIP hwdec — closes T-FFMPEG-HIP-FILTER-DEFERRED.
# The display name is deliberately short: GitHub's badge.svg paints it
# into the README status badge. See ADR-1227.

on:
  schedule:
    # Sundays 06:30 UTC. 15-minute offset from the prior watcher.
    - cron: "30 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-ffmpeg-hip-hwdec-watcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Search FFmpeg for HIP / ROCm hwcontext additions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Two signals:
          # (1) hwcontext_hip.{c,h} appears under libavutil/.
          # (2) an AV_HWDEVICE_TYPE_HIP / _ROCM variant appears in libavutil/hwcontext.h.
          # Read with the contents API of the FFmpeg/FFmpeg mirror, not code
          # search: the code-search endpoint is throttled for the workflow
          # token and failed with 429 on three attempts in run 39160669868.

          FILES_HIT=$(scripts/ci/upstream_watch_count.sh -X GET \
            repos/FFmpeg/FFmpeg/contents/libavutil \
            --jq '[.[] | select(.name | test("^hwcontext_hip\\.[ch]$"))] | length')

          ENUM_HIT=$(scripts/ci/upstream_watch_count.sh -X GET \
            repos/FFmpeg/FFmpeg/contents/libavutil/hwcontext.h \
            --jq '.content | @base64d | [scan("AV_HWDEVICE_TYPE_(HIP|ROCM)\\b")] | length')

          echo "FFmpeg HIP hwdec signals: hwcontext_hip files=${FILES_HIT} enum_hits=${ENUM_HIT}"

          if [ "${FILES_HIT}" -lt 1 ] && [ "${ENUM_HIT}" -lt 1 ]; then
            echo "No HIP-hwdec signal upstream this week."
            exit 0
          fi

          gh label create upstream-merged \
            --color 0E8A16 \
            --description "Upstream change landed that a fork deferral waits on (ADR-0448)" \
            --force

          EXISTING=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label upstream-merged \
            --search "FFmpeg HIP hwdec in:title" \
            --json number -q '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Already tracking via issue #${EXISTING}; nothing to do."
            exit 0
          fi

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FFmpeg HIP hwdec landed upstream — ship libvmaf_hip filter (closes T-FFMPEG-HIP-FILTER-DEFERRED)" \
            --label upstream-merged \
            --body "$(cat <<'EOF'
          FFmpeg has acquired a HIP / ROCm hwdec context (the contents
          API surfaced the enum or files). The fork's
          T-FFMPEG-HIP-FILTER-DEFERRED row in docs/state.md can now
          actively close.

          Action items:

          1. Confirm the upstream landing: `gh api
             repos/FFmpeg/FFmpeg/commits?path=libavutil/hwcontext.h`
             lists the commit. Note the commit SHA + author + date.
          2. Bump the fork's `ffmpeg-patches/series.txt` baseline if
             needed (reviewed release: build-config.env FFMPEG_TAG).
          3. Write `ffmpeg-patches/0014-libvmaf-add-libvmaf-hip-filter.patch`
             mirroring `0006-libvmaf-add-libvmaf-vulkan-filter.patch`
             with HIP-native AVFrame consumption via the new hwcontext.
          4. Wire the configure flag (`--enable-libvmaf-hip-filter`)
             and update `docs/usage/ffmpeg.md`.
          5. Update `docs/state.md` T-FFMPEG-HIP-FILTER-DEFERRED row
             from Deferred to Recently-closed.
          6. Disable this watcher (rename with .disabled suffix or
             delete the workflow).

          See ADR-0448 for the watcher governance rule and ADR-0380
          for the existing HIP backend selector that this filter
          completes.
          EOF
          )"
