name: FFmpeg
# FFmpeg — Linux/macOS x gcc/clang + SYCL + Windows MSVC.
# The display name is deliberately short: GitHub's badge.svg paints it
# into the README status badge. See ADR-1227.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-integration-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DEBIAN_FRONTEND: noninteractive
  LD_LIBRARY_PATH: /usr/local/lib/x86_64-linux-gnu

jobs:
  tier:
    name: CI tier (FFmpeg)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  impact:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    name: Plan FFmpeg impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.c_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  ffmpeg-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR-1297 — both rows are required checks. They build FFmpeg n8.1
          # --enable-libvmaf against the freshly installed library, which is
          # the consumer contract agent hard rule 11 exists to protect. The
          - os: ubuntu-latest
            CC: gcc
            CXX: g++
            check_name: FFmpeg Ubuntu gcc
          - os: macos-latest
            CC: clang
            CXX: clang++
            check_name: FFmpeg macOS clang
    name: ${{ matrix.check_name }} work
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Load build config
        run: scripts/ci/load-build-config.sh >> "$GITHUB_ENV"
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.8
      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt
      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build gcc nasm
      - name: Install dependencies (mac)
        if: matrix.os == 'macos-latest'
        run: brew install -q ninja nasm

      - name: Build vmaf
        run: |
          # ADR-2170: this libvmaf build prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core core/build --buildtype release -Denable_metal=disabled \
            -Dwerror=true \
            $(scripts/ci/werror-args.sh true)
          sudo ninja -vC core/build install

      - name: Build FFmpeg
        run: |
          scripts/ci/checkout-annotated-tag.sh "$FFMPEG_REMOTE" "$FFMPEG_TAG" ffmpeg
          cd ffmpeg
          # This matrix intentionally avoids the fork integration series so it
          # continues to prove compatibility with stock FFmpeg surfaces. It
          # applies only the shared FFmpeg fix series (ADR-3143), whose
          # diagnostics patch makes warnings fatal on the pinned release.
          ../scripts/ci/ffmpeg-shared-series.sh apply --method am .
          # --disable-filter=coreimage AND coreimagesrc: both filters live in
          # libavfilter/vf_coreimage.m, so disabling only the first still built the
          # file and kept all 14 of its warnings. Measured: the run still logged
          # `OBJCC libavfilter/vf_coreimage.o` with coreimagesrc in the enabled list.
          # The file builds against
          # NSOpenGLPFAAccelerated, deprecated in macOS 10.14, and nothing in this
          # integration uses the filter. Scoping it out is consistent with
          # --disable-indevs above and leaves the warning gate meaningful, where
          # -DGL_SILENCE_DEPRECATION would only hide it.
          ./configure --fatal-warnings \
            --enable-version3 --enable-libvmaf --disable-indevs \
            --disable-filter=coreimage --disable-filter=coreimagesrc \
            --disable-securetransport \
            --cc="$CC" --cxx="$CXX" || { less ffbuild/config.log; exit 1; }
          build_jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)
          make -j "$build_jobs" build 2>&1 | tee /tmp/ffmpeg-build.log
          fate_list="$(make -s fate-list)"
          fate_targets=()
          while IFS= read -r target; do
            fate_targets+=("$target")
          done < <(printf '%s\n' "$fate_list" | awk '/^fate-/')
          if (( ${#fate_targets[@]} == 0 )); then
            echo "FATAL: FFmpeg generated no local FATE targets" >&2
            exit 1
          fi
          make -j "$build_jobs" "${fate_targets[@]}" 2>&1 | tee -a /tmp/ffmpeg-build.log
          if grep -Ei '(^|[[:space:]])warning([[:space:]#:])' /tmp/ffmpeg-build.log; then
            echo "FATAL: FFmpeg emitted compiler warnings" >&2
            exit 1
          fi
          sudo make install

  # Build-only: FFmpeg with SYCL patch (no GPU hardware on runners)
  ffmpeg-sycl-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # ADR-1297 — required. Build-only FFmpeg with the SYCL patch applied; no
    # other leg links that patch-stack surface.
    name: FFmpeg SYCL work
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Load build config
        run: scripts/ci/load-build-config.sh >> "$GITHUB_ENV"
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.8
      - name: Install meson, ninja, and dependencies
        run: |
          python -m pip install --require-hashes -r requirements/locks/build.txt
          sudo apt-get update
          # libva-dev travels with libvpl-dev on purpose. --enable-libvpl turns on
          # QSV, and on Linux QSV runs through VAAPI: without libva, FFmpeg
          # compiles hwcontext_qsv.c with every #if CONFIG_VAAPI block dropped,
          # which leaves seven declarations unused (185, 528, 533, 536, 1514,
          # 1515, 2040 in n9.0.2) and trips the warning gate below. It is also a
          # QSV configuration nobody ships. Installing it compiles those paths
          # back in rather than patching FFmpeg to delete the variables.
          sudo -E apt-get -yq install ninja-build gcc g++ nasm gpg-agent libvpl-dev libva-dev

      - name: Install Intel oneAPI
        # oneAPI version comes from ONEAPI_APT_PACKAGE in build-config.env;
        # Level Zero from LEVEL_ZERO_VERSION, ocloc from INTEL_NEO_VERSION.
        # See libvmaf-build-matrix.yml.
        env:
          # Lifts the anonymous GitHub API limit for the NEO release lookup.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ocloc compiles the SYCL ahead-of-time images; the Linux compiler
          # does not ship it and meson setup refuses without it (ADR-1360).
          bash scripts/ci/install-intel-ocloc.sh
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo -E apt-get -yq install "${ONEAPI_APT_PACKAGE}" cmake
          git clone --depth=1 --branch "v${LEVEL_ZERO_VERSION}" \
            https://github.com/oneapi-src/level-zero.git /tmp/level-zero
          cmake -S /tmp/level-zero -B /tmp/level-zero/build -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build /tmp/level-zero/build -j"$(nproc)"
          sudo cmake --install /tmp/level-zero/build
          rm -rf /tmp/level-zero
          echo "/opt/intel/oneapi/compiler/latest/bin" >> "$GITHUB_PATH"
          echo "/opt/intel/oneapi/compiler/latest/lib" | sudo tee /etc/ld.so.conf.d/oneapi.conf
          sudo ldconfig


      - name: Build vmaf with SYCL
        env:
          # Required by core/src/meson.build: enable_sycl=true forces
          # icpx as the project C++ compiler so the .so link step embeds
          # SPIR-V device images via clang-offload-wrapper.
          CC: icx
          CXX: icpx
        run: |
          # setvars.sh is reached through a variable, the same shape the
          # clang-tidy-sycl job in lint-and-format.yml uses. actionlint passes
          # --external-sources to shellcheck, so on a machine that has oneAPI
          # installed the linter inlines setvars.sh. Every top-level
          # branch of that file ends in `return`, and shellcheck models a
          # top-level `return` in an inlined file as terminating the caller
          # rather than handing control back to it, so it reported every
          # command below this line as unreachable (SC2317). bash does hand
          # control back; the finding was false, and it appeared only on
          # machines with oneAPI present, which is why the workflow linted
          # clean in CI and dirty on a SYCL dev box. `builtin` bypasses any
          # function shadowing `source`; `--force` lets setvars.sh re-run if
          # the step is retried in an already-initialised shell.
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          # b_lto=false: see libvmaf-build-matrix.yml note; icx + meson's
          # -flto=auto leaves the static archive without LTO bitcode and
          # breaks the .so link.
          # ADR-2170: this libvmaf build prints no warnings, so they are errors.
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup core core/build --buildtype release \
            -Denable_float=true -Denable_sycl=true -Db_lto=false \
            -Dwerror=true \
            $(scripts/ci/werror-args.sh true)
          sudo -E PATH="$PATH" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
            ninja -vC core/build install

      - name: Build FFmpeg with SYCL patch series
        run: |
          scripts/ci/checkout-annotated-tag.sh "$FFMPEG_REMOTE" "$FFMPEG_TAG" ffmpeg
          cd ffmpeg
          # The shared FFmpeg fix series first (ADR-3143), then the patch
          # series in series.txt order. Patch 0003 (SYCL) depends on fields
          # added by 0001 (tiny-AI), so applying out of order breaks the build.
          ../scripts/ci/ffmpeg-shared-series.sh apply --method am .
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            echo "Applying ffmpeg-patches/$line"
            if ! git apply "../ffmpeg-patches/$line"; then
              echo "FATAL: ffmpeg-patches/$line did not apply against $FFMPEG_TAG" >&2
              exit 1
            fi
          done < ../ffmpeg-patches/series.txt
          # libvmaf-sycl is auto-detected by check_pkg_config in patch 0003;
          # there is no `--enable-libvmaf-sycl` flag to pass.
          PKG_CONFIG_PATH="/usr/local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" \
          ./configure --fatal-warnings --enable-version3 --enable-libvmaf \
            --enable-libvpl --disable-indevs --cc="$CC" --cxx="$CXX" \
            || { tail -50 ffbuild/config.log; exit 1; }
          make -j "$(nproc)" build 2>&1 | tee /tmp/ffmpeg-build.log
          fate_list="$(make -s fate-list)"
          fate_targets=()
          while IFS= read -r target; do
            fate_targets+=("$target")
          done < <(printf '%s\n' "$fate_list" | awk '/^fate-/')
          if (( ${#fate_targets[@]} == 0 )); then
            echo "FATAL: FFmpeg generated no local FATE targets" >&2
            exit 1
          fi
          make -j "$(nproc)" "${fate_targets[@]}" 2>&1 | tee -a /tmp/ffmpeg-build.log
          if grep -Ei '(^|[[:space:]])warning([[:space:]#:])' /tmp/ffmpeg-build.log; then
            echo "FATAL: FFmpeg emitted compiler warnings" >&2
            exit 1
          fi
          sudo make install
          echo "FFmpeg with SYCL support built successfully"

  # ADR-2783 (upstream 3e1385bed, Q-300): the configured FFmpeg release with
  # the whole patch series, compiled by cl.exe through FFmpeg's own configure
  # (--toolchain=msvc) in an MSYS2 shell, linked against vmaf.lib and
  # vmafx.lib from a static MSVC build of this commit (ADR-2752). Upstream
  # builds the same consumer through a Meson port of FFmpeg; this leg keeps
  # FFmpeg's build system, the one the patch series and every distributor use.
  # ffmpeg-patches/test/build-and-run.sh does the work, as on a developer's
  # machine, and compares the filter's scores with the CLI's as exact text.
  ffmpeg-msvc-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: FFmpeg Windows MSVC work
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      # bash reads build-config.env, the scripts, series.txt and the patches:
      # an LF checkout. autocrlf=false alone still writes the native CRLF for
      # `text=auto` files; core.eol=lf does not.
      - name: Check out with LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.8

      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt

      - name: Setup MSVC dev environment (x64)
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9  # v4.1.0
        with:
          arch: x64

      # As on the MSVC legs of libvmaf-build-matrix.yml: a ccache.exe on PATH
      # makes meson wrap the compiler at configure time.
      - name: Disable ccache wrap (windows)
        shell: pwsh
        run: |
          $p = 'C:\Strawberry\c\bin\ccache.exe'
          if (Test-Path $p) { Rename-Item -Path $p -NewName 'ccache.exe.disabled' }
          Write-Host "ccache binary disabled"

      # ADR-2170: the libvmaf build prints no warnings, so they are errors.
      - name: Warnings-as-errors arguments
        id: werror
        shell: bash
        run: |
          args="$(bash scripts/ci/werror-args.sh msvc)"
          echo "werror arguments: ${args:-none}"
          echo "args=${args//$'\n'/ }" >> "$GITHUB_OUTPUT"

      # Static, so the install holds vmaf.lib and vmafx.lib (ADR-2752); the
      # release buildtype compiles with /MD, the runtime the smoke script gives
      # FFmpeg. `/experimental:c11atomics` as on every MSVC leg. No tests: the
      # MSVC legs of libvmaf-build-matrix.yml build and run them; this leg
      # needs the library and the vmaf CLI.
      - name: Build libvmaf (static, MSVC)
        shell: cmd
        env:
          CFLAGS: /experimental:c11atomics
          CXXFLAGS: /experimental:c11atomics
        run: |
          meson setup core core\build -Dwerror=true --buildtype release ^
            --prefix %CD%\install ^
            --default-library=static ^
            -Dc_std=none -Denable_tests=false ^
            -Denable_cuda=false -Denable_sycl=false ^
            ${{ steps.werror.outputs.args }}
          ninja -C core\build install

      - name: Check installed library names (MSVC)
        shell: cmd
        run: python scripts\ci\check_msvc_library_names.py --prefix install --meson-log core\build\meson-logs\meson-log.txt

      # path-type inherit keeps the MSVC environment (cl.exe, INCLUDE, LIB) of
      # the step above; FFmpeg's compat/windows/mslink finds MSVC's link.exe
      # beside cl.exe, ahead of the MSYS2 coreutils `link`. MSYS2's own git
      # takes the POSIX paths and /dev/null the smoke script passes.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            make
            diffutils
            git
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
          update: true
          path-type: inherit

      - name: Build FFmpeg with the patch series against vmaf.lib
        shell: msys2 {0}
        env:
          FFMPEG_TOOLCHAIN: msvc
          VMAF_SCORE_CHECK: '1'
        run: |
          set -euo pipefail
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          export VMAF_PREFIX="$workspace/install"
          export FFMPEG_SRC="$(cygpath -u "$RUNNER_TEMP")/ffmpeg"
          export KEEP_BUILD=1
          bash ffmpeg-patches/test/build-and-run.sh

      - name: Upload FFmpeg logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffmpeg-msvc-logs
          path: |
            ${{ runner.temp }}/ffmpeg/ffbuild/config.log
            ${{ runner.temp }}/ffmpeg/vmafx-build.log
            ${{ runner.temp }}/ffmpeg/vmafx-score/
          if-no-files-found: warn

  ffmpeg-ubuntu-gate:
    needs: [tier, impact, ffmpeg-work]
    if: always() && needs.tier.outputs.full == 'true'
    # required-aggregator
    name: FFmpeg Ubuntu gcc
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/gate_leg_result.py
          sparse-checkout-cone-mode: false
      - name: Require selected FFmpeg matrix work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Judge this leg's own job: the matrix job's aggregate result covers every leg.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" --paginate \
            | python3 scripts/ci/gate_leg_result.py --job "FFmpeg Ubuntu gcc work"

  ffmpeg-macos-gate:
    needs: [tier, impact, ffmpeg-work]
    if: always() && needs.tier.outputs.full == 'true'
    # required-aggregator
    name: FFmpeg macOS clang
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/gate_leg_result.py
          sparse-checkout-cone-mode: false
      - name: Require selected FFmpeg matrix work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Judge this leg's own job: the matrix job's aggregate result covers every leg.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" --paginate \
            | python3 scripts/ci/gate_leg_result.py --job "FFmpeg macOS clang work"

  ffmpeg-sycl-gate:
    needs: [tier, impact, ffmpeg-sycl-work]
    if: always() && needs.tier.outputs.full == 'true'
    # required-aggregator
    name: FFmpeg SYCL
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected FFmpeg SYCL work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.ffmpeg-sycl-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid FFmpeg SYCL gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  ffmpeg-msvc-gate:
    needs: [tier, impact, ffmpeg-msvc-work]
    if: always() && needs.tier.outputs.full == 'true'
    # required-aggregator
    name: FFmpeg Windows MSVC
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected FFmpeg Windows MSVC work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.ffmpeg-msvc-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid FFmpeg Windows MSVC gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  # ffmpeg-vulkan job removed per ADR-0726: the Vulkan backend was dropped from
  # the fork entirely (core/src/vulkan/, feature/vulkan/, libvmaf_vulkan.h all
  # deleted). The meson `enable_vulkan` option no longer exists, so any attempt
  # to pass -Denable_vulkan=enabled to meson setup fails with
  # "Unknown option: enable_vulkan". The patches 0004 + 0006 remain in the
  # series.txt chain as no-op compatibility shims (see series.txt comment and
  # ADR-0860) but produce zero linked code at FFmpeg configure time.
