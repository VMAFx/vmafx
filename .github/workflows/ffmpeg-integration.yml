name: FFmpeg
# FFmpeg — Linux/macOS x gcc/clang + SYCL.
# The display name is deliberately short: GitHub's badge.svg paints it
# into the README status badge. See ADR-1227.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LD_LIBRARY_PATH: /usr/local/lib/x86_64-linux-gnu

jobs:
  impact:
    name: Plan FFmpeg impact
    runs-on: ubuntu-26.04
    outputs:
      selected: ${{ steps.impact.outputs.c_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  ffmpeg-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          # ADR-1297 — both rows are required checks. They build FFmpeg n8.1
          # --enable-libvmaf against the freshly installed library, which is
          # the consumer contract agent hard rule 11 exists to protect. The
          - os: ubuntu-latest
            CC: gcc
            CXX: g++
            check_name: FFmpeg Ubuntu gcc
          - os: macos-latest
            CC: clang
            CXX: clang++
            check_name: FFmpeg macOS clang
    name: ${{ matrix.check_name }} work
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.7
      - name: Install meson and ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson
      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build gcc nasm
      - name: Install dependencies (mac)
        if: matrix.os == 'macos-latest'
        run: brew install -q ninja nasm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Load build config
        run: scripts/ci/load-build-config.sh >> "$GITHUB_ENV"

      - name: Build vmaf
        run: |
          meson setup core core/build --buildtype release -Denable_metal=disabled
          sudo ninja -vC core/build install

      - name: Build FFmpeg
        run: |
          scripts/ci/checkout-annotated-tag.sh "$FFMPEG_REMOTE" "$FFMPEG_TAG" ffmpeg
          cd ffmpeg
          # This matrix intentionally avoids the fork integration series so it
          # continues to prove compatibility with stock FFmpeg surfaces. Apply
          # only the source-level warning hardening needed to make diagnostics
          # fatal on the pinned release.
          if ! git apply ../ffmpeg-patches/0019-ffmpeg-eliminate-gcc-14-build-diagnostics.patch; then
            echo "FATAL: FFmpeg warning-hardening patch did not apply" >&2
            exit 1
          fi
          # --disable-filter=coreimage AND coreimagesrc: both filters live in
          # libavfilter/vf_coreimage.m, so disabling only the first still built the
          # file and kept all 14 of its warnings. Measured: the run still logged
          # `OBJCC libavfilter/vf_coreimage.o` with coreimagesrc in the enabled list.
          # The file builds against
          # NSOpenGLPFAAccelerated, deprecated in macOS 10.14, and nothing in this
          # integration uses the filter. Scoping it out is consistent with
          # --disable-indevs above and leaves the warning gate meaningful, where
          # -DGL_SILENCE_DEPRECATION would only hide it.
          ./configure --fatal-warnings \
            --enable-version3 --enable-libvmaf --disable-indevs \
            --disable-filter=coreimage --disable-filter=coreimagesrc \
            --disable-securetransport \
            --cc="$CC" --cxx="$CXX" || { less ffbuild/config.log; exit 1; }
          build_jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)
          make -j "$build_jobs" build 2>&1 | tee /tmp/ffmpeg-build.log
          fate_list="$(make -s fate-list)"
          fate_targets=()
          while IFS= read -r target; do
            fate_targets+=("$target")
          done < <(printf '%s\n' "$fate_list" | awk '/^fate-/')
          if (( ${#fate_targets[@]} == 0 )); then
            echo "FATAL: FFmpeg generated no local FATE targets" >&2
            exit 1
          fi
          make -j "$build_jobs" "${fate_targets[@]}" 2>&1 | tee -a /tmp/ffmpeg-build.log
          if grep -Ei '(^|[[:space:]])warning([[:space:]#:])' /tmp/ffmpeg-build.log; then
            echo "FATAL: FFmpeg emitted compiler warnings" >&2
            exit 1
          fi
          sudo make install

  # Build-only: FFmpeg with SYCL patch (no GPU hardware on runners)
  ffmpeg-sycl-work:
    needs: impact
    if: needs.impact.outputs.selected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # ADR-1297 — required. Build-only FFmpeg with the SYCL patch applied; no
    # other leg links that patch-stack surface.
    name: FFmpeg SYCL work
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Load build config
        run: scripts/ci/load-build-config.sh >> "$GITHUB_ENV"
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.7
      - name: Install meson, ninja, and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          # libva-dev travels with libvpl-dev on purpose. --enable-libvpl turns on
          # QSV, and on Linux QSV runs through VAAPI: without libva, FFmpeg
          # compiles hwcontext_qsv.c with every #if CONFIG_VAAPI block dropped,
          # which leaves seven declarations unused (185, 528, 533, 536, 1514,
          # 1515, 2040 in n9.0.2) and trips the warning gate below. It is also a
          # QSV configuration nobody ships. Installing it compiles those paths
          # back in rather than patching FFmpeg to delete the variables.
          sudo -E apt-get -yq install ninja-build gcc g++ nasm gpg-agent libvpl-dev libva-dev

      - name: Install Intel oneAPI
        # oneAPI version comes from ONEAPI_APT_PACKAGE in build-config.env;
        # Level Zero from LEVEL_ZERO_VERSION. See libvmaf-build-matrix.yml.
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo -E apt-get -yq install "${ONEAPI_APT_PACKAGE}" cmake
          git clone --depth=1 --branch "v${LEVEL_ZERO_VERSION}" \
            https://github.com/oneapi-src/level-zero.git /tmp/level-zero
          cmake -S /tmp/level-zero -B /tmp/level-zero/build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/level-zero/build -j"$(nproc)"
          sudo cmake --install /tmp/level-zero/build
          rm -rf /tmp/level-zero
          echo "/opt/intel/oneapi/compiler/latest/bin" >> "$GITHUB_PATH"
          echo "/opt/intel/oneapi/compiler/latest/lib" | sudo tee /etc/ld.so.conf.d/oneapi.conf
          sudo ldconfig


      - name: Build vmaf with SYCL
        env:
          # Required by core/src/meson.build: enable_sycl=true forces
          # icpx as the project C++ compiler so the .so link step embeds
          # SPIR-V device images via clang-offload-wrapper.
          CC: icx
          CXX: icpx
        run: |
          # setvars.sh is reached through a variable, the same shape the
          # clang-tidy-sycl job in lint-and-format.yml uses. actionlint passes
          # --external-sources to shellcheck, so on a machine that has oneAPI
          # installed the linter inlines setvars.sh. Every top-level
          # branch of that file ends in `return`, and shellcheck models a
          # top-level `return` in an inlined file as terminating the caller
          # rather than handing control back to it, so it reported every
          # command below this line as unreachable (SC2317). bash does hand
          # control back; the finding was false, and it appeared only on
          # machines with oneAPI present, which is why the workflow linted
          # clean in CI and dirty on a SYCL dev box. `builtin` bypasses any
          # function shadowing `source`; `--force` lets setvars.sh re-run if
          # the step is retried in an already-initialised shell.
          oneapi_setvars=/opt/intel/oneapi/setvars.sh
          builtin source "$oneapi_setvars" --force
          # b_lto=false: see libvmaf-build-matrix.yml note; icx + meson's
          # -flto=auto leaves the static archive without LTO bitcode and
          # breaks the .so link.
          meson setup core core/build --buildtype release \
            -Denable_float=true -Denable_sycl=true -Db_lto=false
          sudo -E PATH="$PATH" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
            ninja -vC core/build install

      - name: Build FFmpeg with SYCL patch series
        run: |
          scripts/ci/checkout-annotated-tag.sh "$FFMPEG_REMOTE" "$FFMPEG_TAG" ffmpeg
          cd ffmpeg
          # Apply the patch series in series.txt order. Patch 0003 (SYCL)
          # depends on fields added by 0001 (tiny-AI), so applying out of
          # order breaks the build.
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            echo "Applying ffmpeg-patches/$line"
            if ! git apply "../ffmpeg-patches/$line"; then
              echo "FATAL: ffmpeg-patches/$line did not apply against $FFMPEG_TAG" >&2
              exit 1
            fi
          done < ../ffmpeg-patches/series.txt
          # libvmaf-sycl is auto-detected by check_pkg_config in patch 0003;
          # there is no `--enable-libvmaf-sycl` flag to pass.
          PKG_CONFIG_PATH="/usr/local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" \
          ./configure --fatal-warnings --enable-version3 --enable-libvmaf \
            --enable-libvpl --disable-indevs --cc="$CC" --cxx="$CXX" \
            || { tail -50 ffbuild/config.log; exit 1; }
          make -j "$(nproc)" build 2>&1 | tee /tmp/ffmpeg-build.log
          fate_list="$(make -s fate-list)"
          fate_targets=()
          while IFS= read -r target; do
            fate_targets+=("$target")
          done < <(printf '%s\n' "$fate_list" | awk '/^fate-/')
          if (( ${#fate_targets[@]} == 0 )); then
            echo "FATAL: FFmpeg generated no local FATE targets" >&2
            exit 1
          fi
          make -j "$(nproc)" "${fate_targets[@]}" 2>&1 | tee -a /tmp/ffmpeg-build.log
          if grep -Ei '(^|[[:space:]])warning([[:space:]#:])' /tmp/ffmpeg-build.log; then
            echo "FATAL: FFmpeg emitted compiler warnings" >&2
            exit 1
          fi
          sudo make install
          echo "FFmpeg with SYCL support built successfully"

  ffmpeg-ubuntu-gate:
    needs: [impact, ffmpeg-work]
    if: always()
    # required-aggregator
    name: FFmpeg Ubuntu gcc
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected FFmpeg matrix work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.ffmpeg-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid FFmpeg matrix gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  ffmpeg-macos-gate:
    needs: [impact, ffmpeg-work]
    if: always()
    # required-aggregator
    name: FFmpeg macOS clang
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected FFmpeg matrix work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.ffmpeg-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid FFmpeg matrix gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  ffmpeg-sycl-gate:
    needs: [impact, ffmpeg-sycl-work]
    if: always()
    # required-aggregator
    name: FFmpeg SYCL
    runs-on: ubuntu-26.04
    steps:
      - name: Require selected FFmpeg SYCL work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          WORK_RESULT: ${{ needs.ffmpeg-sycl-work.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid FFmpeg SYCL gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  # ffmpeg-vulkan job removed per ADR-0726: the Vulkan backend was dropped from
  # the fork entirely (core/src/vulkan/, feature/vulkan/, libvmaf_vulkan.h all
  # deleted). The meson `enable_vulkan` option no longer exists, so any attempt
  # to pass -Denable_vulkan=enabled to meson setup fails with
  # "Unknown option: enable_vulkan". The patches 0004 + 0006 remain in the
  # series.txt chain as no-op compatibility shims (see series.txt comment and
  # ADR-0860) but produce zero linked code at FFmpeg configure time.
