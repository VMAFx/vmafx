#
# dev-container-publish.yml — build, push, and sign the canonical dev container
# image (libvmaf-build stage) to GHCR.
#
# Motivation (ADR-1102, ADR-1178, ADR-1346):
# All canonical build artifacts (release binaries, published images) must be
# produced inside the canonical dev container rather than on the bare runner host.
# This workflow publishes ghcr.io/vmafx/vmafx-dev-mcp on every change to
# dev/Containerfile or dev/scripts/** for transparency and contributor
# convenience. It is not on the release path: supply-chain.yml builds the
# small Debian 13 `release-build` stage from the release tag itself
# (ADR-1346, ADR-1354) and never pulls this image. This is the one workflow build of dev/Containerfile that
# does not go through scripts/ci/build-dev-container-stage.sh, because it
# pushes to a registry; check-dev-container-build-secret.py checks its secret.
#
# Produces:
#   ghcr.io/vmafx/vmafx-dev-mcp:sha-<commit>
#   ghcr.io/vmafx/vmafx-dev-mcp:master
#
# Post-push: cosign keyless sign via Sigstore (OIDC).

name: Dev Container Publish

on:
  push:
    branches: [master]
    paths:
      - "dev/Containerfile"
      - "dev/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, push, and sign dev container (libvmaf-build stage)
    runs-on: ubuntu-latest
    # The uncached stage build takes 28-35 min on a hosted runner (the
    # Dev Container PR gate); pushing ~29.5 GB adds several more.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (libvmaf-build stage)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: dev/Containerfile
          target: libvmaf-build
          push: true
          tags: |
            ghcr.io/vmafx/vmafx-dev-mcp:sha-${{ github.sha }}
            ghcr.io/vmafx/vmafx-dev-mcp:master
          # No GitHub Actions layer cache: exporting every layer of this
          # ~29.5 GB stage (mode=max) into a cache capped at 10 GB per
          # repository never finished, and six of ten master runs were
          # cancelled at the timeout after pushing but before cosign signed
          # the image.
          # BuildKit secret for the NEO release lookup; without it the
          # unauthenticated GitHub API rate limit fails the build.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            "ghcr.io/vmafx/vmafx-dev-mcp@${{ steps.push.outputs.digest }}"
