# macos-tester-bundle -- build, test, attest and publish the macOS arm64 tester bundle.
#
# Triggers:
#   - schedule (weekly, Monday 04:23 UTC): build and verify master's head, no publish.
#     A macOS runner bills at ten times a Linux one, so this is not a per-pull-request
#     gate; the weekly run is the standing check that the bundle still builds, and a
#     failure of it is a defect to open (ADR-1595). Pull requests that change the
#     bundle's inputs are verified here by a dispatch on their merge commit.
#   - workflow_dispatch on master with exactly one of `ref` (a master commit SHA,
#     or `master`) or `tag` (an existing published release tag). The bundle is built from
# that commit's source with this ref's build recipe (ADR-1347 pattern). A bundle is
# evidence for the commit it was built from, not a product release (ADR-1493).
# `publish: false` (default) builds, runs the bundle's own report on the hosted
# runner and uploads a workflow artifact; `publish: true` additionally attests,
# signs and creates a prerelease `tester-<date>-<sha>` with the bundle as an asset.
# That release is a tester bundle, not a product release: GITHUB_TOKEN-created
# releases start no other workflow, and release-please only follows `v*` tags.
#
# ADR-1493: macOS tester bundle (an exception to ADR-1102, see the ADR for its bounds).
# ADR-1503: the bundle carries licenses/ and fails to build when a file has no
# recorded licence; an SPDX SBOM is attested and published next to it.

name: Publish macOS Tester Bundle
# A dispatch names the source it builds in the run's title (ADR-2198): the cut check
# (scripts/release/check-candidate-legs.py) accepts a dispatched run for a candidate only when
# the title carries the candidate's full SHA. Other events keep GitHub's usual title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('macOS tester bundle, source {0}', github.event.inputs.ref || github.event.inputs.tag) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA reachable from master, or `master`, to build the source from (give this or tag)"
        required: false
      tag:
        description: "Existing published vX.Y.Z[-rc.N] tag to build the source from (give this or ref)"
        required: false
      publish:
        description: "Attest, sign and create the tester-* prerelease (false: build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-tester-bundle-${{ github.event.inputs.ref || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  # python-build-standalone 20261001, CPython 3.13.16, stripped install_only archive;
  # the SHA-256 is the one in that release's SHA256SUMS.
  PBS_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-aarch64-apple-darwin-install_only_stripped.tar.gz
  PBS_SHA256: d00669acb53c1b014f1fcf5eaea740d8e45c3aff4b1e0244dc0f8697fb211a82
  # The same release's full archive, read only for its licence texts (python/licenses,
  # PYTHON.json): the install_only archive holds none (ADR-1503). SHA-256 from SHA256SUMS.
  PBS_FULL_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-aarch64-apple-darwin-pgo%2Blto-full.tar.zst
  PBS_FULL_SHA256: 7d58416593597f4ef0226c24cfe53cd09b65d04b5606c1ab8005f5ae1a25ef75
  # Netflix/vmaf_resource commit the fixtures are fetched from.
  VMAF_RESOURCE_COMMIT: c0ab6adbd7e41bb354f14686ed08500530622bc3
  TAG: ${{ github.event.inputs.tag }}
  REF: ${{ github.event.inputs.ref }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.src.outputs.source_sha }}
      describe: ${{ steps.src.outputs.describe }}
      release-tag: ${{ steps.src.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the source and refuse anything not on master
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "ERROR: dispatch this workflow on $DEFAULT_BRANCH, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != schedule ]] && \
             { [[ -n "$TAG" && -n "$REF" ]] || [[ -z "$TAG" && -z "$REF" ]]; }; then
            echo "ERROR: give exactly one of the inputs ref and tag" >&2
            exit 1
          fi
          git fetch --tags --force origin
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # The weekly run: master's head, build and verify only.
            source_sha="$GITHUB_SHA"
          elif [[ -n "$TAG" ]]; then
            git checkout --detach "refs/tags/$TAG"
            scripts/release/verify-release-version.sh "$TAG"
            release_json="$RUNNER_TEMP/github-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json"
            if [[ "$(jq -r '.tag_name' "$release_json")" != "$TAG" || \
                  "$(jq -r '.draft' "$release_json")" != "false" ]]; then
              echo "ERROR: $TAG must name a published release" >&2
              exit 1
            fi
            source_sha="$(git rev-parse HEAD)"
          else
            [[ "$REF" == "$DEFAULT_BRANCH" ]] && REF="origin/$DEFAULT_BRANCH"
            source_sha="$(git rev-parse --verify "$REF^{commit}")"
            if ! git merge-base --is-ancestor "$source_sha" "origin/$DEFAULT_BRANCH"; then
              echo "ERROR: $source_sha is not reachable from $DEFAULT_BRANCH" >&2
              exit 1
            fi
          fi
          # Only v*.*.* tags name a version: the tester prereleases tag master
          # commits as tester-<date>-<sha8>, and an unrestricted describe would
          # pick one of those. No --long (a tagged commit yields the bare tag)
          # and no --always (no reachable tag fails instead of a bare sha).
          if ! describe="$(git describe --tags --match 'v*.*.*' "$source_sha")"; then
            echo "ERROR: no v*.*.* tag is reachable from $source_sha" >&2
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "describe=$describe"
            echo "release_tag=tester-$(date -u +%Y%m%d)-${source_sha:0:8}"
          } >> "$GITHUB_OUTPUT"
          echo "source $source_sha ($describe)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test the bundle (macOS arm64)
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          submodules: recursive
          persist-credentials: false
      - name: Use this ref's build recipe
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- tools/rc1-tester scripts/ci docs/hardware-reports
      - name: Build tools (build time only; none of them is linked into the bundle)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install -q meson ninja nasm pkg-config zstd
      # Xcode 26 no longer bundles the Metal compiler with the base runner
      # image. Metal.framework can be present while `xcrun metal` still fails,
      # so install the separately shipped component before the bundle build
      # compiles its .metal sources. The check right after it makes a missing
      # compiler fail here, with a clear message, instead of mid-build.
      - name: Install Metal compiler toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          if ! xcrun -sdk macosx metal --version; then
            echo "ERROR: the Metal compiler is still missing after xcodebuild -downloadComponent MetalToolchain" >&2
            exit 1
          fi
      - name: Build the bundle
        env:
          VMAFX_SOURCE_COMMIT: ${{ needs.validate.outputs.source-sha }}
          VMAFX_SOURCE_REF: ${{ needs.validate.outputs.describe }}
          VMAFX_RECIPE_COMMIT: ${{ github.sha }}
          VMAFX_IMAGE_TAG: ${{ needs.validate.outputs.describe }}
        run: bash scripts/ci/build-macos-tester-bundle.sh "$RUNNER_TEMP/out"
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.51.1
      - name: SPDX SBOM of the bundle (ADR-1503)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          DESCRIBE: ${{ needs.validate.outputs.describe }}
          # Every file with its SHA-256: Syft recognises few packages in a Mach-O tree.
          SYFT_FILE_METADATA_SELECTION: all
        run: |
          name="vmafx-tester-macos-arm64-${DESCRIBE}"
          "$SYFT" scan "dir:${RUNNER_TEMP}/out/${name}" \
            --source-name vmafx-tester-macos-arm64 --source-version "${DESCRIBE}" \
            -o "spdx-json=${RUNNER_TEMP}/out/${name}.spdx.json"
          jq -e '.spdxVersion and ((.packages | length) > 0)' \
            "${RUNNER_TEMP}/out/${name}.spdx.json" > /dev/null
      - name: Validate the bundle's report against the schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements/locks/jsonschema.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/check-hardware-reports.py \
            --report "$RUNNER_TEMP/out/report.json"
      - name: Summarise what the hosted runner could exercise
        run: |
          python3 - "$RUNNER_TEMP/out/report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("### Bundle report on the hosted macOS runner")
          print(f"- verdict: {r['verdict']}, failed checks: {r['failed_checks']}")
          print(f"- host: {r['host']['cpu_model']} / {r['host']['hw_model']} / macOS {r['host']['os_version']}")
          print(f"- Metal device: {r['host']['metal_device']}")
          print(f"- dispatch equivalence: {r['dispatch_equivalence']['status']}")
          print(f"- metal equivalence: {r['metal_equivalence']['status']}")
          print(f"- unit tests: {r['unit_tests']['passed']} passed, {r['unit_tests']['failed']} failed, {r['unit_tests']['skipped']} skipped")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-tester-bundle
          path: |
            ${{ runner.temp }}/out/*.tar.xz
            ${{ runner.temp }}/out/*.tar.xz.sha256
            ${{ runner.temp }}/out/*.spdx.json
            ${{ runner.temp }}/out/report.json
            ${{ runner.temp }}/out/bundle-files.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish the tester bundle
    needs: [validate, build]
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tester-publish
    permissions:
      contents: write      # create the prerelease and its tag
      id-token: write      # keyless signing and attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: macos-tester-bundle
          path: bundle
      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: bundle/*.tar.xz
      - name: Find the SBOM
        id: sbom
        run: |
          shopt -s nullglob
          sboms=(bundle/*.spdx.json)
          if [[ "${#sboms[@]}" -ne 1 ]]; then
            echo "expected one SBOM, found ${#sboms[@]}" >&2
            exit 1
          fi
          echo "path=${sboms[0]}" >> "$GITHUB_OUTPUT"
      - name: Attest the SBOM (ADR-1503)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: bundle/*.tar.xz
          sbom-path: ${{ steps.sbom.outputs.path }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Sign the bundle (keyless OIDC via Sigstore)
        run: |
          for f in bundle/*.tar.xz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      # Creating the tag of a commit that is behind master (and so may differ
      # in .github/workflows/) is refused for the job token, which cannot hold
      # the `workflows` permission: HTTP 403 on POST /releases. Only this step
      # speaks as the release-bot identity of release-please.yml (App when its
      # secrets exist, else the PAT, else it fails); every other step keeps the
      # job token. Maintainer notes: docs/development/tester-image.md.
      - name: Choose the release-bot identity
        id: creds
        env:
          RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_BOT_APP_ID" && -n "$RELEASE_BOT_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_BOT_TOKEN" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: no release-bot identity: set RELEASE_BOT_APP_ID and" >&2
            echo "RELEASE_BOT_PRIVATE_KEY (preferred) or RELEASE_BOT_TOKEN;" >&2
            echo "see docs/development/release.md, 'Release-bot identity'." >&2
            exit 1
          fi
      - name: Mint the release-bot installation token
        if: steps.creds.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Create the tester prerelease
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
          DESCRIBE: ${{ needs.validate.outputs.describe }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_TOKEN" ]]; then
            GH_TOKEN="$APP_TOKEN"
            identity="release-bot GitHub App installation token"
          elif [[ -n "$PAT" ]]; then
            GH_TOKEN="$PAT"
            identity="RELEASE_BOT_TOKEN (personal access token)"
          else
            echo "ERROR: the identity step passed but no token reached this step" >&2
            exit 1
          fi
          export GH_TOKEN
          echo "creating $RELEASE_TAG as: $identity" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "Tester bundle for macOS on Apple silicon. **Not a product release.**"
            echo
            echo "Built from \`$DESCRIBE\` ($SOURCE_SHA) by the hosted macOS arm64 runner,"
            echo "workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo "Steps for testers: docs/usage/tester-image.md in the repository."
            echo
            echo "Licences: \`licenses/THIRD_PARTY_NOTICES.txt\` inside the archive lists every"
            echo "component with its licence and carries the licence texts (ADR-1503)."
            echo "The SPDX SBOM is the \`.spdx.json\` asset, attested with the archive."
          } > notes.md
          gh release create "$RELEASE_TAG" bundle/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --latest=false \
            --title "Tester bundle $RELEASE_TAG (not a product release)" \
            --notes-file notes.md
          echo "release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
