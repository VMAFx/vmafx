# Tidy Metal -- clang-tidy over the Objective-C++ Metal host code on a hosted macOS runner.
#
# The Linux lanes cannot read core/src/metal/*.mm, core/src/feature/metal/*_metal.mm and the
# Metal-only C tests: they need Apple's SDK. Homebrew's clang-tidy of the Linux lanes' major
# (22) reads them against the Xcode SDK (docs/development/tidy-lanes.md, "The macOS metal
# lane"); the measurement is compared with scripts/ci/tidy-baseline-metal.json.
#
# A macOS runner bills at ten times a Linux one, so the lane measures only when the planner
# selects it (selector `tidy_metal` of .github/ci-impact.json, ADR-2796, Q-315): on a pull
# request or master push that changes a Metal host source, the lane's ratchet or baseline, or
# this workflow; on the nightly schedule and on dispatch, where there is no diff, always.
# The required context `Tidy Metal` is the last job below: it reports on every run of the
# lane tier (not on the release pull request without the cut label, which runs the release
# contract only), and it says when the lane was not measured instead of reporting it
# clean. A scheduled run that finds drift opens or updates the one tidy-drift issue.

name: Tidy Metal

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      fix:
        description: "Apply clang-tidy's own fixes to the selected files and upload them as a patch (no ratchet)"
        type: boolean
        default: false
  pull_request:
    branches: [master]
    # ADR-2169: draft pull requests do not run; promoting one to ready does.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tidy-metal-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tier:
    name: CI tier (Tidy Metal)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  plan:
    name: Plan (Tidy Metal)
    needs: tier
    if: needs.tier.outputs.light == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.impact.outputs.tidy_metal }}
      mode: ${{ steps.impact.outputs.mode }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  clang-tidy-metal:
    needs: [tier, plan]
    if: needs.tier.outputs.light == 'true' && needs.plan.outputs.selected == 'true'
    # RC3 coverage: the Objective-C++ Metal host code and the Metal-only C tests
    # are in no Linux lane's compile database. Homebrew's clang-tidy of the same
    # major as the Linux lanes reads them against the Xcode SDK. The lane
    # measures only those files (--select) and has its own baseline,
    # scripts/ci/tidy-baseline-metal.json. Required through the `Tidy Metal`
    # gate job below (Q-315, ADR-2796).
    # The `.metal` kernels are not read here: clang-tidy has no Metal language
    # mode; they are listed in the lint exception list (follow-up pull request).
    name: Tidy Metal work
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.14.8
      - name: Install meson, ninja, clang-tidy 22 and the Metal toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          python -m pip install --require-hashes -r requirements/locks/build.txt
          brew install -q ninja nasm pkg-config llvm@22
          xcodebuild -downloadComponent MetalToolchain
          "$(brew --prefix llvm@22)/bin/clang-tidy" --version | grep -F 'LLVM version 22.'
      - name: Build (compile_commands.json + generated headers)
        run: |
          # Apple clang, as the macOS Metal build leg. The options are
          # TIDY_RATCHET_SETUP_metal in the Makefile; the lane contract test
          # keeps the two lines identical.
          TIDY_BUILD_DIR="$RUNNER_TEMP/vmafx-tidy-metal"
          CC=clang CXX=clang++ meson setup "$TIDY_BUILD_DIR" core \
            -Denable_metal=enabled -Denable_cuda=false -Denable_sycl=false \
            -Denable_dnn=disabled -Db_lto=false -Dwerror=true
          meson compile -C "$TIDY_BUILD_DIR" --ninja-args=-k0
          python3 scripts/ci/write-compile-commands.py --build-dir "$TIDY_BUILD_DIR"
      - name: Autofix — clang-tidy's own fixes as a patch (dispatch with fix=true)
        if: ${{ inputs.fix }}
        run: |
          # Fixes need the Xcode SDK to parse the Objective-C++, so they are produced here and
          # downloaded as tidy-metal-fixes.patch; review it, apply it, run the ratchet again.
          files=$(git ls-files 'core/src/metal/*.mm' 'core/src/metal/*.c' 'core/src/feature/metal/*.mm' \
            core/test/test_metal_install_header.c core/test/test_metal_kernel_coverage_audit.c \
            core/test/test_metal_kernel_registration.c core/test/test_metal_smoke.c)
          # Fixes cascade (a const fix exposes the next), so run until stable, at most five passes.
          # Headers other than objc_handle.h are not diagnosed here (--header-filter): the Metal
          # shader compiler and the C translation units read them, C++-only fixes (`using`,
          # `std::cmp_*`) break both, and the cpu lane owns them (docs/development/tidy-lanes.md).
          tidy="$(brew --prefix llvm@22)/bin/clang-tidy"
          sdk="$(xcrun --show-sdk-path)"
          : > tidy-metal-fix.log
          for pass in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            "$tidy" -p "$RUNNER_TEMP/vmafx-tidy-metal" --fix --quiet --extra-arg="-isysroot$sdk" \
              --header-filter='(^|/)core/src/metal/objc_handle\.h$' \
              $files >> tidy-metal-fix.log 2>&1 \
              || echo "pass $pass: clang-tidy exited $? (findings it cannot fix are expected)"
            before=$(git diff | shasum | cut -d' ' -f1)
            [ "$before" = "${last:-}" ] && break
            last=$before
          done
          git diff > tidy-metal-fixes.patch
          wc -l tidy-metal-fixes.patch
      - name: Upload the autofix patch
        if: ${{ inputs.fix }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tidy-metal-fixes
          path: |
            tidy-metal-fixes.patch
            tidy-metal-fix.log
            tidy-ratchet-metal.json
            tidy-metal-build.log
      - name: Build the fixed tree (log only; a compile error here means a fix broke the code)
        if: ${{ inputs.fix }}
        continue-on-error: true
        run: |
          meson compile -C "$RUNNER_TEMP/vmafx-tidy-metal" --ninja-args=-k0 > tidy-metal-build.log 2>&1
      - name: Measure after the fixes (report only)
        if: ${{ inputs.fix }}
        continue-on-error: true
        run: |
          python3 scripts/ci/tidy-ratchet.py --lane metal \
            --build-dir "$RUNNER_TEMP/vmafx-tidy-metal" \
            --clang-tidy "$(brew --prefix llvm@22)/bin/clang-tidy" \
            --extra-arg="--header-filter=(^|/)core/src/metal/objc_handle\\.h$" \
            --extra-arg="-isysroot$(xcrun --show-sdk-path)" \
            --select core/src/metal/ --select core/src/feature/metal/ \
            --select core/test/test_metal_install_header.c \
            --select core/test/test_metal_kernel_coverage_audit.c \
            --select core/test/test_metal_kernel_registration.c \
            --select core/test/test_metal_smoke.c \
            --jobs "$(sysctl -n hw.ncpu)" --report tidy-ratchet-metal.json
      - name: Ratchet — Metal host code vs committed baseline
        if: ${{ !inputs.fix }}
        run: |
          # Homebrew's clang-tidy has no implicit SDK: name the Xcode one.
          python3 scripts/ci/tidy-ratchet.py --lane metal \
            --build-dir "$RUNNER_TEMP/vmafx-tidy-metal" \
            --clang-tidy "$(brew --prefix llvm@22)/bin/clang-tidy" \
            --extra-arg="--header-filter=(^|/)core/src/metal/objc_handle\\.h$" \
            --extra-arg="-isysroot$(xcrun --show-sdk-path)" \
            --select core/src/metal/ --select core/src/feature/metal/ \
            --select core/test/test_metal_install_header.c \
            --select core/test/test_metal_kernel_coverage_audit.c \
            --select core/test/test_metal_kernel_registration.c \
            --select core/test/test_metal_smoke.c \
            --jobs "$(sysctl -n hw.ncpu)" --report tidy-ratchet-metal.json
      - name: Upload measurement (commit it as the new baseline when the ratchet asks)
        if: ${{ always() && !inputs.fix }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tidy-ratchet-metal
          path: tidy-ratchet-metal.json

  gate:
    needs: [tier, plan, clang-tidy-metal]
    if: always() && needs.tier.result == 'success' && needs.tier.outputs.light == 'true'
    # required-aggregator
    # The required context. It reports on every tier that runs the lanes;
    # "not selected" is a stated skip, never a clean measurement (HISS-18).
    # The release pull request without the cut label runs the release
    # contract only (.github/ci-tier.json), so the gate stays out of it like
    # every other lane of that tier.
    name: Tidy Metal
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report the lane
        env:
          PLAN: ${{ needs.plan.result }}
          WORK: ${{ needs.clang-tidy-metal.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::the impact plan did not complete ($PLAN); the Metal lane is unknown"
            exit 1
          fi
          if [ "$SELECTED" != "true" ]; then
            echo "::notice::tidy_metal not impacted (mode=$MODE reason=$REASON) - the Metal lane was NOT measured; the nightly run measures it (ADR-2796)"
            exit 0
          fi
          if [ "$WORK" != "success" ]; then
            echo "::error::the Metal lane was selected and its measurement ended $WORK"
            exit 1
          fi
          echo "Metal lane measured against scripts/ci/tidy-baseline-metal.json"

  drift:
    needs: [gate]
    if: always() && github.event_name == 'schedule' && needs.gate.result == 'failure'
    name: Report Metal drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the tidy-drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tidy-drift-issue.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
