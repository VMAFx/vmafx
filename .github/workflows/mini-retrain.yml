name: mini-retrain

# The retrain tooling end to end on a generated corpus (ADR-1898, issue #1246).
# Runs nightly and on demand; pull requests that touch ai/ run the same tests in
# the required Tiny AI job. A red run means a stage of the one-shot retrain would have stopped: extraction,
# feature checks, combination, training, export, validation, registry or gate.

on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC, after the nightly bisect
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-retrain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mini-retrain:
    name: Mini Retrain nightly
    runs-on: ubuntu-26.04
    # Step caps 15 min plus 1.25x the longest measured healthy job (6.8m,
    # 2026-10-23) sums to 24 min <= 40 min; cap kept at 40 min.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Restore apt archives
        id: apt-cache
        # Restore-only; the save below runs only after a successful install.
        # Caches downloaded .deb archives so a slow package mirror does not eat
        # into the apt step's timeout. Keyed on runner OS, arch, job, and the
        # hash of the job's apt package list under .github/apt/mini-retrain.txt.
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-mini-retrain-${{ hashFiles('.github/apt/mini-retrain.txt') }}

      - name: Install build deps
        id: apt-install
        # Measured max 0.4m (2026-10-23); 5 min is at least 1.25x the slowest healthy run.
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-retries >/dev/null
          sudo apt-get update
          mkdir -p "${RUNNER_TEMP}/apt-archives"
          if compgen -G "${RUNNER_TEMP}/apt-archives/*.deb" >/dev/null; then
            sudo cp -f "${RUNNER_TEMP}/apt-archives"/*.deb /var/cache/apt/archives/
          fi
          grep -v '^#' .github/apt/mini-retrain.txt | xargs sudo apt-get install -y
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            sudo cp -f /var/cache/apt/archives/*.deb "${RUNNER_TEMP}/apt-archives/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/apt-archives"
          fi
          sudo pip3 install --break-system-packages --ignore-installed --quiet --require-hashes \
            -r requirements/locks/build.txt

      - name: Save apt archives
        # Saves only after the install step succeeded: an install cut off by its
        # timeout leaves the archive directory empty, and an empty entry under
        # this immutable key would be restored as a hit on every later run.
        # Runs even when a later step fails, so the next run skips the download.
        if: ${{ !cancelled() && steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-mini-retrain-${{ hashFiles('.github/apt/mini-retrain.txt') }}

      - name: Build the vmaf CLI (CPU, no DNN)
        run: |
          # shellcheck disable=SC2046  # the helper prints one option per line, split on purpose
          meson setup build core -Denable_cuda=false -Denable_sycl=false --buildtype=release \
            -Dwerror=true $(scripts/ci/werror-args.sh true)
          ninja -C build tools/vmaf

      - name: Install the training stack (hash-locked)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          venv="${RUNNER_TEMP}/mini-retrain-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --require-hashes -r requirements/locks/package-build.txt
          "${venv}/bin/pip" install --require-hashes -r ai/requirements-dev-lock.txt
          "${venv}/bin/pip" install --no-deps --no-build-isolation -e ai

      - name: Unit tests of the stage runner and the checks
        run: |
          "${RUNNER_TEMP}/mini-retrain-venv/bin/pytest" \
            ai/tests/test_pipeline.py ai/tests/test_retrain_checks.py \
            ai/tests/test_mini_corpus.py -q --timeout=120

      - name: Mini retrain end to end
        env:
          VMAF_BIN: ${{ github.workspace }}/build/tools/vmaf
          VMAFX_CONTAINER_IMAGE_ID: github-hosted-ubuntu-26.04
        run: |
          "${RUNNER_TEMP}/mini-retrain-venv/bin/pytest" ai/e2e -v -rs \
            --timeout=900 --timeout-method=signal \
            --basetemp="${RUNNER_TEMP}/mini-retrain-runs"

      - name: Keep the stage manifests and the gate report
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mini-retrain-manifests
          path: |
            ${{ runner.temp }}/mini-retrain-runs/**/stages/*.json
            ${{ runner.temp }}/mini-retrain-runs/**/reports/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the stage manifests and the gate report (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: mini-retrain-manifests
          path: |
            ${{ runner.temp }}/mini-retrain-runs/**/stages/*.json
            ${{ runner.temp }}/mini-retrain-runs/**/reports/*.json
          if-no-files-found: warn
          retention-days: 14
