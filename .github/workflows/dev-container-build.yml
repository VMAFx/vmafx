#
# dev-container-build.yml — PR-time build gate for the dev/Containerfile.
#
# Motivation (ADR-0819): previously there was no CI gate on dev/Containerfile;
# regressions were only discovered at user runtime after the container fiasco
# where path references went stale post-rename (libvmaf/ → core/).  This
# workflow runs `docker build --target libvmaf-build` on every PR that touches
# dev/Containerfile or dev/scripts/, fails fast on any build error, and
# smoke-tests the resulting image by invoking `vmaf --version`
# and the CPU-backend probe against the bundled test YUVs.
#
# Pull requests push no image — they remain a pure build-verification gate.
# Pushes to master additionally publish the `libvmaf-build` stage to
# ghcr.io/vmafx/vmafx-dev-builder so the release path can build inside it
# (ADR-1186). Publication follows review; a PR must never overwrite the image
# a release consumes.

name: Dev Container Build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dev/Containerfile"
      - "dev/scripts/**"
      - "dev/docker-compose.yml"
      - ".github/workflows/dev-container-build.yml"
  push:
    branches: [master]
    paths:
      - "dev/Containerfile"
      - "dev/scripts/**"
      - "dev/docker-compose.yml"
      - ".github/workflows/dev-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # The build toolchain only (CUDA, oneAPI, ROCm, meson/ninja/nasm) — not the
  # FFmpeg or MCP stages, which a release build never uses. ADR-1186.
  IMAGE_NAME: vmafx/vmafx-dev-builder

# cancel-in-progress only for pull requests: superseding a PR gate run is
# free, but cancelling a master run halfway through a registry push can leave
# :master pointing at one build and :sha-… at another.
concurrency:
  group: dev-container-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-container-build:
    name: Dev Container Build
    # Skip draft PRs — consistent with the other workflow gates.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # GPU SDK downloads (CUDA keyring, oneAPI, ROCm) + multi-stage build can
    # take up to 45 min on a cold runner; set a generous ceiling.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Regression guard for PR #707 / ADR-0529: assert that every /dev/dri
      # bind-mount in docker-compose.yml is writable (read_only: false).
      # The NVIDIA Container Toolkit OCI hook writes symlinks into
      # /dev/dri/by-path at container init; read_only:true breaks any NVIDIA
      # host.  This step runs before the expensive Docker build so the lint
      # fails fast.
      - name: Lint docker-compose.yml — /dev/dri mounts must be writable
        run: bash scripts/ci/check-compose-dri-writable.sh dev/docker-compose.yml

      # ADR-1102 container-only publishing. Two cheap assertions run before the
      # expensive Docker build so a broken gate fails in seconds:
      #   1. the gate's own unit suite, and
      #   2. the gate must REJECT this runner, which is a host. If it ever
      #      accepted a bare runner it would wave a host-built release binary
      #      through, which is exactly the failure the policy exists to stop.
      - name: Container-build gate — unit suite
        run: bash scripts/ci/tests/test-check-container-build.sh

      - name: Container-build gate — must reject the host runner
        run: |
          if bash scripts/ci/check-container-build.sh; then
            echo "::error::check-container-build.sh accepted a bare GitHub runner"
            echo "The gate is supposed to fail outside the vmaf-dev-mcp container."
            exit 1
          fi
          echo "OK: the gate rejects a host build."

      # Build only up to the `libvmaf-build` stage (skips the heavy FFmpeg
      # stage and the final `dev-mcp` assembly) so the gate stays under 45 min
      # on a free-tier runner.  The GPU SDK layers (CUDA, oneAPI, ROCm) are the
      # main regression surface — they're included in `libvmaf-build`.
      # Full multi-stage builds (including FFmpeg) are covered by the
      # release-tag docker-publish-production workflow.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # `load: true` puts the image in the local daemon so the smoke tests below
      # can `docker run` it; `cache-to` writes the layers to the GitHub Actions
      # cache so the publish job below rebuilds from cache in minutes instead of
      # repeating the 45-minute GPU-SDK download (ADR-1186).
      - name: Build dev container (up to libvmaf-build stage)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: dev/Containerfile
          target: libvmaf-build
          push: false
          load: true
          tags: vmaf-dev-mcp-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: verify `vmaf --version` exits 0 and the CPU backend
      # can score the bundled 48-frame fixture YUVs.
      - name: Smoke test — vmaf --version
        run: |
          docker run --rm \
            vmaf-dev-mcp-gate:${{ github.sha }} \
            vmaf --version

      - name: Smoke test — CPU backend probe (48-frame fixture)
        run: |
          docker run --rm \
            vmaf-dev-mcp-gate:${{ github.sha }} \
            vmaf \
              --reference /build/vmaf/testdata/ref_576x324_48f.yuv \
              --distorted  /build/vmaf/testdata/dis_576x324_48f.yuv \
              --width 576 --height 324 --pixel_format 420 --bitdepth 8 \
              --backend cpu \
              --json --output /tmp/probe_cpu.json

      # The other half of the ADR-1102 gate: the built image must be
      # RECOGNISED as the dev container, and a stamp produced inside it must
      # verify on the outside. That stamp/verify pair is the mechanism the
      # release path will use to prove a published artifact is container-built
      # (docs/development/publishing.md § Enforcement), so it is exercised
      # end-to-end here rather than only in the offline unit suite.
      - name: Container-build gate — must accept the built image
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            vmaf-dev-mcp-gate:${{ github.sha }} \
            bash /src/scripts/ci/check-container-build.sh

      - name: Container-build gate — stamp inside, verify outside
        run: |
          mkdir -p provenance
          chmod 0777 provenance
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --volume "$PWD/provenance:/provenance" \
            vmaf-dev-mcp-gate:${{ github.sha }} \
            bash /src/scripts/ci/check-container-build.sh --stamp /provenance
          cat provenance/container-build-provenance.txt
          bash scripts/ci/check-container-build.sh --verify provenance

      - name: Cleanup image
        if: always()
        run: docker rmi vmaf-dev-mcp-gate:${{ github.sha }} || true

  # Publication is a SEPARATE job so `packages: write` is never in scope during a
  # pull-request run: a PR must not be able to overwrite the image a release
  # consumes (ADR-1186). It rebuilds rather than receiving the gate's image
  # because a multi-gigabyte image does not travel through the artifact store —
  # `cache-from: type=gha` makes that rebuild a cache replay of the layers the
  # gate job just wrote.
  publish-builder-image:
    name: Publish builder image
    needs: dev-container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write    # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:master` is the moving tag the release path resolves; `:sha-<short>` is
      # the immutable one, so a release can pin the exact image it built in.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master
            type=sha,prefix=sha-,format=short

      - name: Build and push builder image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: dev/Containerfile
          target: libvmaf-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image only earns its purpose if a build inside it is recognised as
      # container-built. Verify that against the pushed digest, not the local
      # build, so the assertion covers the bytes a release will actually pull.
      - name: Pushed image must satisfy the ADR-1102 container-build gate
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo "verifying $ref"
          docker run --rm --volume "$PWD:/src:ro" "$ref" \
            bash /src/scripts/ci/check-container-build.sh

      - name: Summary
        run: |
          {
            echo "### Builder image published"
            echo
            echo '```'
            echo "tags:   ${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Consumed by the release path per ADR-1186. The package is private;"
            echo "the only reader is a GITHUB_TOKEN-authenticated job in this repo."
          } >> "$GITHUB_STEP_SUMMARY"
