# windows-tester-bundle -- build, test, attest and publish the Windows tester zips.
#
# Triggers:
#   - every pull request (ADR-1687): job `impact` runs scripts/ci/plan-ci-impact.py
#     and the build runs only when selector `windows_tester_zip` of
#     .github/ci-impact.json is set, that is when the diff touches the zip's own
#     inputs (the path list this workflow's triggers carried before ADR-1687); the
#     selector is `own_paths_only`, so a full-mode fallback alone does not set it
#     (ADR-1700). Then the x64 zip is built, run and verified, uploaded as a
#     workflow artifact; nothing is published. The x64 SYCL zip is added when
#     selector `windows_tester_zip_sycl` is set, that is when the diff touches
#     something the SYCL leg reads (ADR-2198). The arm64 and x64 CUDA zips stay with
#     the push run: two more Windows builds of up to 150 minutes each are too much
#     runner time per pull request, and the x64 zip exercises every script and the
#     licence gate they share (ADR-1595)
#   - this lane runs in the light CI tier too (ADR-2198, `own_input_lanes` of
#     .github/ci-tier.json): a pull request from this repository gets the selected
#     legs, and none when nothing they read changed; the other full-tier lanes stay
#     with the master push
#   - every push to master, routed the same way: build and verify every zip and
#     upload them as workflow artifacts; nothing is published
#   - workflow_dispatch on master with exactly one of `ref` (a master commit SHA, or
#     `master`) or `tag` (an existing published release tag). The zips are built from
#     that commit's source with this ref's build recipe (ADR-1347 pattern). A zip is
#     evidence for the commit it was built from, not a product release (ADR-1515).
#     `publish: false` (default) builds and verifies only; `publish: true`
#     additionally attests, signs and creates a prerelease `tester-windows-<date>-<sha>`
#     with the four zips as assets (x64, arm64, the x64 CUDA zip of ADR-1516 and the x64
#     SYCL zip of ADR-1566). That release is a tester package, not a product
#     release: release-please only follows `v*` tags.
#
# Each zip is built natively on a hosted runner of its architecture (windows-2025,
# windows-11-vs2026-arm) with MSVC, links the C runtime statically (/MT) and fails to
# build when a file has no recorded licence (ADR-1503). The SYCL zip is built with
# Intel's icx-cl, whose -fsycl requires the dynamic runtime (/MD): its runtime DLLs,
# Intel's SYCL runtime and the Level Zero loader lie beside every program. The hosted runner runs the
# zip's own report through run.cmd; the report is validated against the schema and an
# SPDX SBOM of each unpacked zip is attested and published next to it.
#
# ADR-1515: Windows tester zip (an exception to ADR-1102 with the bounds of ADR-1493).

name: Publish Windows Tester Bundle
# A dispatch names the source it builds in the run's title (ADR-2198): the cut check
# (scripts/release/check-candidate-legs.py) accepts a dispatched run for a candidate only when
# the title carries the candidate's full SHA. Other events keep GitHub's usual title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Windows tester zips, source {0}', github.event.inputs.ref || github.event.inputs.tag) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  # No paths filter: `Windows Tester Zip` is a required context (ADR-1687), so the
  # workflow starts on every pull request and master push and routes in-job
  # (ADR-1140). The inputs are selector `windows_tester_zip` of .github/ci-impact.json.
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA reachable from master, or `master`, to build the source from (give this or tag)"
        required: false
      tag:
        description: "Existing published vX.Y.Z[-rc.N] tag to build the source from (give this or ref)"
        required: false
      publish:
        description: "Attest, sign and create the tester-windows-* prerelease (false: build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-tester-bundle-${{ github.event.pull_request.number || github.event.inputs.ref || github.event.inputs.tag || github.sha }}
  # A newer push to a pull request replaces its older verify run; a master push or a
  # dispatch (which can publish) is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # python-build-standalone 20261001, CPython 3.13.16 (the macOS bundle's release),
  # stripped install_only archives; SHA-256 values from that release's SHA256SUMS.
  PBS_X64_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-x86_64-pc-windows-msvc-install_only_stripped.tar.gz
  PBS_X64_SHA256: c402eb9a35aba90de319bbc87d23e6d887eca1551a05cfa80775f92dcf3ebc08
  PBS_ARM64_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-aarch64-pc-windows-msvc-install_only_stripped.tar.gz
  PBS_ARM64_SHA256: 0c5f9dedc4302b74600046a905f36a654a0710c1940bed202a4644efcba5e86f
  # The same release's full archives, read only for their licence texts
  # (python/licenses, PYTHON.json): the install_only archives hold none (ADR-1503).
  PBS_X64_FULL_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-x86_64-pc-windows-msvc-pgo-full.tar.zst
  PBS_X64_FULL_SHA256: fbccab8d1487f327874956eb2d0e979612c133f3619b6e86e4ec250cb0191b55
  PBS_ARM64_FULL_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-aarch64-pc-windows-msvc-pgo-full.tar.zst
  PBS_ARM64_FULL_SHA256: d88129f3600d12887a9fee50847d71eac7127b9be20785fa759e4459b9c1bee8
  # Netflix/vmaf_resource commit the fixtures are fetched from.
  VMAF_RESOURCE_COMMIT: c0ab6adbd7e41bb354f14686ed08500530622bc3
  # The SYCL zip's compiler (ADR-1566): only the DPC++/C++ component of the oneAPI
  # installer build-config.env pins (ONEAPI_WINDOWS_VERSION, INTEL_BASEKIT_WINDOWS_*);
  # its required packages bring the runtime, UMF 1.0.2 and TCM 1.4.1.
  BASEKIT_WINDOWS_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
  TAG: ${{ github.event.inputs.tag }}
  REF: ${{ github.event.inputs.ref }}

jobs:
  tier:
    name: CI tier (Publish Windows Tester Bundle)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  impact:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: Plan Windows zip impact
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.impact.outputs.windows_tester_zip }}
      selected-sycl: ${{ steps.impact.outputs.windows_tester_zip_sycl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A dispatch is not a routed event: the planner returns mode=full and the
      # selector is true, so a publish run always builds.
      - name: Plan CI impact (ADR-1140)
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/plan-ci-impact.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  validate:
    # Named apart from the `Validate source` jobs of the tester image and macOS
    # bundle workflows: the aggregator waits on this name while the gate is not yet
    # registered, and it keeps only the newest check run per name.
    name: Validate Windows zip source
    needs: impact
    if: (needs.impact.outputs.selected == 'true' || needs.impact.outputs.selected-sycl == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build-matrix: ${{ steps.src.outputs.build_matrix }}
      verify-matrix: ${{ steps.src.outputs.verify_matrix }}
      source-sha: ${{ steps.src.outputs.source_sha }}
      describe: ${{ steps.src.outputs.describe }}
      release-tag: ${{ steps.src.outputs.release_tag }}
      publish: ${{ steps.src.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the source and refuse anything not on master
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish }}
          SELECTED: ${{ needs.impact.outputs.selected }}
          SELECTED_SYCL: ${{ needs.impact.outputs.selected-sycl }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && \
                "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "ERROR: run this workflow on $DEFAULT_BRANCH, not $GITHUB_REF" >&2
            exit 1
          fi
          git fetch --tags --force origin
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # A push to master or a pull request (its merge commit): build and
            # verify only.
            source_sha="$GITHUB_SHA"
          elif [[ -n "$TAG" && -n "$REF" ]] || [[ -z "$TAG" && -z "$REF" ]]; then
            echo "ERROR: give exactly one of the inputs ref and tag" >&2
            exit 1
          elif [[ -n "$TAG" ]]; then
            git checkout --detach "refs/tags/$TAG"
            scripts/release/verify-release-version.sh "$TAG"
            release_json="$RUNNER_TEMP/github-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json"
            if [[ "$(jq -r '.tag_name' "$release_json")" != "$TAG" || \
                  "$(jq -r '.draft' "$release_json")" != "false" ]]; then
              echo "ERROR: $TAG must name a published release" >&2
              exit 1
            fi
            source_sha="$(git rev-parse HEAD)"
          else
            [[ "$REF" == "$DEFAULT_BRANCH" ]] && REF="origin/$DEFAULT_BRANCH"
            source_sha="$(git rev-parse --verify "$REF^{commit}")"
            if ! git merge-base --is-ancestor "$source_sha" "origin/$DEFAULT_BRANCH"; then
              echo "ERROR: $source_sha is not reachable from $DEFAULT_BRANCH" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_INPUT" == true ]]; then
            publish=true
          fi
          # Only v*.*.* tags name a version: the tester prereleases tag master
          # commits as tester-windows-<date>-<sha8>, and an unrestricted describe
          # would pick one of those. No --long and no --always.
          if ! describe="$(git describe --tags --match 'v*.*.*' "$source_sha")"; then
            echo "ERROR: no v*.*.* tag is reachable from $source_sha" >&2
            exit 1
          fi
          # The zips the build and verify jobs cover: all four on a push or a dispatch,
          # on a pull request the x64 CPU zip when the planner selected it (ADR-1595)
          # and the x64 SYCL zip when it selected that one (ADR-2198). arm64 is the native
          # ARM64 MSVC runner of the `Windows ARM64 MSVC` lane (libvmaf-build-matrix.yml,
          # ADR-1260 / ADR-1297). x64-cuda is the CUDA zip (ADR-1516): the CPU zip's
          # build with the CUDA backend and its device tests; the runner has no GPU, so
          # its report says no_device and the device measurements happen on the
          # tester's PC. x64-sycl is the SYCL zip (ADR-1566): icx-cl, /MD, the SYCL
          # backend and its device tests, with no Intel GPU on the runner either.
          build_matrix='{"include":[{"name":"x64","arch":"x64","gpu":"","runner":"windows-2025"},{"name":"arm64","arch":"arm64","gpu":"","runner":"windows-11-vs2026-arm"},{"name":"x64-cuda","arch":"x64","gpu":"cuda","runner":"windows-2025"},{"name":"x64-sycl","arch":"x64","gpu":"sycl","runner":"windows-2025"}]}'
          verify_matrix='{"name":["x64","arm64","x64-cuda","x64-sycl"]}'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            names='[]'
            [[ "$SELECTED" == true ]] && names="$(jq -c '. + ["x64"]' <<<"$names")"
            [[ "$SELECTED_SYCL" == true ]] && names="$(jq -c '. + ["x64-sycl"]' <<<"$names")"
            build_matrix="$(jq -c --argjson names "$names" '{include: [.include[] | select(.name as $n | $names | index($n))]}' <<<"$build_matrix")"
            verify_matrix="$(jq -c '{name: .}' <<<"$names")"
          fi
          {
            echo "build_matrix=$build_matrix"
            echo "verify_matrix=$verify_matrix"
            echo "source_sha=$source_sha"
            echo "describe=$describe"
            echo "release_tag=tester-windows-$(date -u +%Y%m%d)-${source_sha:0:8}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "source $source_sha ($describe), publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test the zip (Windows ${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # x64 (CPU), arm64, x64-cuda (ADR-1516) and x64-sycl (ADR-1566); the validate job
      # narrows it to x64 on a pull request.
      matrix: ${{ fromJSON(needs.validate.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          submodules: recursive
          persist-credentials: false
      - name: Use this ref's build recipe
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- tools/rc1-tester scripts/ci docs/hardware-reports \
            requirements/locks/windows-tester-zip.txt
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Install meson and ninja
        run: python -m pip install --require-hashes -r requirements/locks/build.txt
      # zopfli writes the zip's Deflate streams (ADR-1594); build time only, it does not ship.
      - name: Install the zip's Deflate encoder
        run: python -m pip install --require-hashes -r requirements/locks/windows-tester-zip.txt
      - name: Setup MSVC dev environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9  # v4.1.0
        with:
          arch: ${{ matrix.arch }}
      # The toolkit at build-config.env's CUDA_VERSION, as the MSVC+CUDA lanes
      # install it; nothing of it ships (ADR-1509, ADR-1516).
      - name: Install CUDA toolkit
        if: matrix.gpu == 'cuda'
        shell: pwsh
        run: pwsh -File scripts/ci/install-cuda-toolkit.ps1
      # The nv-codec-headers commit docker/Dockerfile.tester pins for the Linux CUDA
      # image (one pin): libvmaf compiles their CUDA driver loader in.
      - name: Fetch nv-codec-headers at the pinned commit
        if: matrix.gpu == 'cuda'
        shell: pwsh
        run: |
          $line = Select-String -Path docker/Dockerfile.tester -Pattern '^ARG NV_CODEC_HEADERS_COMMIT=([0-9a-f]{40})$' | Select-Object -First 1
          if (-not $line) { throw 'no NV_CODEC_HEADERS_COMMIT in docker/Dockerfile.tester' }
          $commit = $line.Matches[0].Groups[1].Value
          $dir = Join-Path $env:RUNNER_TEMP 'nv-codec-headers'
          git init -q $dir
          git -C $dir fetch -q --depth=1 https://code.ffmpeg.org/FFmpeg/nv-codec-headers.git $commit
          git -C $dir checkout -q --detach FETCH_HEAD
          if ((git -C $dir rev-parse HEAD) -ne $commit) { throw "nv-codec-headers is not at $commit" }
          "INCLUDE=$dir\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VMAFX_NV_CODEC_HEADERS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "nv-codec-headers $commit"
      # A ccache.exe on PATH makes meson wrap the compiler at configure time
      # (the same step as the MSVC lanes of libvmaf-build-matrix.yml).
      - name: Install Intel oneAPI (pinned offline installer)
        if: matrix.gpu == 'sycl'
        shell: pwsh
        run: |
          $pins = @{}
          foreach ($name in 'ONEAPI_WINDOWS_VERSION', 'INTEL_BASEKIT_WINDOWS_URL', 'INTEL_BASEKIT_WINDOWS_SIZE', 'INTEL_BASEKIT_WINDOWS_SHA256') {
            $line = Select-String -Path build-config.env -Pattern "^$name=`"([^`"]+)`"$" | Select-Object -First 1
            if (-not $line) { throw "no $name in build-config.env" }
            $pins[$name] = $line.Matches[0].Groups[1].Value
          }
          $exe = Join-Path $env:RUNNER_TEMP 'oneapi-basekit.exe'
          curl.exe --fail --location --retry 5 --retry-delay 5 --output $exe --url $pins['INTEL_BASEKIT_WINDOWS_URL']
          if ($LASTEXITCODE -ne 0) { throw "download failed ($LASTEXITCODE)" }
          $size = (Get-Item $exe).Length
          if ($size -ne [int64]$pins['INTEL_BASEKIT_WINDOWS_SIZE']) { throw "installer is $size bytes, not $($pins['INTEL_BASEKIT_WINDOWS_SIZE'])" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($hash -ne $pins['INTEL_BASEKIT_WINDOWS_SHA256']) { throw "installer SHA-256 $hash is not the pinned $($pins['INTEL_BASEKIT_WINDOWS_SHA256'])" }
          $extracted = Join-Path $env:RUNNER_TEMP 'oneapi-extracted'
          $x = Start-Process -FilePath $exe -ArgumentList @('-s', '-x', '-f', $extracted) -Wait -PassThru -NoNewWindow
          if ($x.ExitCode -ne 0) { throw "extracting the oneAPI installer exited $($x.ExitCode)" }
          $boot = Join-Path $extracted 'bootstrapper.exe'
          if (-not (Test-Path $boot)) { throw "$boot is missing after the extraction" }
          # The self-extractor's child (or the runner's virus scan) can hold the 2.5 GB
          # installer for a few seconds after the extraction returned: removing it at
          # once failed run 37271658228 with "being used by another process". The file
          # is only disk space, so a bounded retry, then a visible warning, not a failure.
          $removed = $false
          for ($try = 1; $try -le 10 -and -not $removed; $try++) {
            try { Remove-Item -LiteralPath $exe -ErrorAction Stop; $removed = $true }
            catch { Start-Sleep -Seconds 3 }
          }
          if (-not $removed) { Write-Host "##[warning]could not remove $exe after 10 tries; it stays in RUNNER_TEMP" }
          $p = Start-Process -FilePath $boot -Wait -PassThru -NoNewWindow -ArgumentList @(
            '-s', '--action', 'install', "--components=$env:BASEKIT_WINDOWS_COMPONENTS", '--eula=accept',
            '-p=NEED_VS2017_INTEGRATION=0', '-p=NEED_VS2019_INTEGRATION=0', '-p=NEED_VS2022_INTEGRATION=0',
            "--log-dir=$env:RUNNER_TEMP")
          Remove-Item -Recurse -Force $extracted
          if ($p.ExitCode -ne 0) { throw "the oneAPI installer exited $($p.ExitCode)" }
          $setvars = 'C:\Program Files (x86)\Intel\oneAPI\setvars.bat'
          if (-not (Test-Path $setvars)) { throw "$setvars is missing after the install" }
          "VMAFX_ONEAPI_VERSION=$($pins['ONEAPI_WINDOWS_VERSION'])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "oneAPI $($pins['ONEAPI_WINDOWS_VERSION']) installed"
      # The loader libvmaf links (find_library('ze_loader')) and the zip ships beside
      # every program, from LEVEL_ZERO_VERSION of build-config.env, MSVC's default
      # static runtime; the oneAPI installer carries no ze_loader.lib.
      - name: Build the Level Zero loader (pinned release)
        if: matrix.gpu == 'sycl'
        shell: pwsh
        run: |
          $line = Select-String -Path build-config.env -Pattern '^LEVEL_ZERO_VERSION="([0-9.]+)"$' | Select-Object -First 1
          if (-not $line) { throw 'no LEVEL_ZERO_VERSION in build-config.env' }
          $version = $line.Matches[0].Groups[1].Value
          $src = Join-Path $env:RUNNER_TEMP 'level-zero-src'
          $prefix = Join-Path $env:RUNNER_TEMP 'level-zero-prefix'
          git clone -q --depth=1 --branch "v$version" https://github.com/oneapi-src/level-zero $src
          if ($LASTEXITCODE -ne 0) { throw "cannot fetch level-zero v$version" }
          cmake -S $src -B "$src\build" "-DCMAKE_INSTALL_PREFIX=$prefix" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build "$src\build" --config Release --target install
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }
          if (-not (Test-Path "$prefix\bin\ze_loader.dll")) { throw 'no ze_loader.dll was installed' }
          "INCLUDE=$prefix\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$prefix\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VMAFX_LEVEL_ZERO_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEVEL_ZERO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Level Zero loader $version"
      - name: Disable ccache wrap
        shell: pwsh
        run: |
          $p = 'C:\Strawberry\c\bin\ccache.exe'
          if (Test-Path $p) { Rename-Item -Path $p -NewName 'ccache.exe.disabled' }
      # Fail here, with a message, if a build tool the zip needs is missing: xxd
      # embeds the built-in models (without it vmaf.exe has no default model and no
      # BRISQUE model), nasm assembles the x86 CPU detection.
      - name: Check the build tools
        shell: pwsh
        run: |
          $tools = @('cl.exe', 'meson', 'ninja', 'xxd')
          if ('${{ matrix.arch }}' -eq 'x64') { $tools += 'nasm' }
          if ('${{ matrix.gpu }}' -eq 'cuda') { $tools += 'nvcc' }
          foreach ($t in $tools) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if (-not $c) { throw "build tool $t is not on PATH" }
            "{0,-8} {1}" -f $t, $c.Source
          }
          if (-not $env:VCToolsRedistDir) { throw 'VCToolsRedistDir is not set (vcvarsall)' }
          "VCToolsRedistDir $env:VCToolsRedistDir"
      - name: Build the zip
        if: matrix.gpu != 'sycl'
        shell: pwsh
        env:
          VMAFX_ARCH: ${{ matrix.arch }}
          VMAFX_GPU: ${{ matrix.gpu }}
          VMAFX_SOURCE_COMMIT: ${{ needs.validate.outputs.source-sha }}
          VMAFX_SOURCE_REF: ${{ needs.validate.outputs.describe }}
          VMAFX_RECIPE_COMMIT: ${{ github.sha }}
          VMAFX_IMAGE_TAG: ${{ needs.validate.outputs.describe }}
        run: |
          if ($env:VMAFX_ARCH -eq 'x64') {
            $env:PBS_URL = $env:PBS_X64_URL; $env:PBS_SHA256 = $env:PBS_X64_SHA256
            $env:PBS_FULL_URL = $env:PBS_X64_FULL_URL; $env:PBS_FULL_SHA256 = $env:PBS_X64_FULL_SHA256
          } else {
            $env:PBS_URL = $env:PBS_ARM64_URL; $env:PBS_SHA256 = $env:PBS_ARM64_SHA256
            $env:PBS_FULL_URL = $env:PBS_ARM64_FULL_URL; $env:PBS_FULL_SHA256 = $env:PBS_ARM64_FULL_SHA256
          }
          python scripts/ci/build-windows-tester-bundle.py "$env:RUNNER_TEMP\out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The SYCL zip builds inside oneAPI's environment (icx-cl, ocloc for the AOT
      # targets, ONEAPI_ROOT), as the `Windows MSVC+SYCL` lane does.
      - name: Build the SYCL zip
        if: matrix.gpu == 'sycl'
        shell: cmd
        env:
          VMAFX_ARCH: ${{ matrix.arch }}
          VMAFX_GPU: sycl
          VMAFX_SOURCE_COMMIT: ${{ needs.validate.outputs.source-sha }}
          VMAFX_SOURCE_REF: ${{ needs.validate.outputs.describe }}
          VMAFX_RECIPE_COMMIT: ${{ github.sha }}
          VMAFX_IMAGE_TAG: ${{ needs.validate.outputs.describe }}
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" || exit /b 1
          where icx-cl || exit /b 1
          set "PBS_URL=%PBS_X64_URL%"
          set "PBS_SHA256=%PBS_X64_SHA256%"
          set "PBS_FULL_URL=%PBS_X64_FULL_URL%"
          set "PBS_FULL_SHA256=%PBS_X64_FULL_SHA256%"
          python scripts\ci\build-windows-tester-bundle.py "%RUNNER_TEMP%\out" || exit /b 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-tester-bundle-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/out/*.zip
            ${{ runner.temp }}/out/*.zip.sha256
            ${{ runner.temp }}/out/report.json
            ${{ runner.temp }}/out/bundle-files.txt
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify the zip and write its SBOM (Windows ${{ matrix.name }})
    needs: [validate, build]
    # Each zip is verified when its own build passed, even if another leg failed (a
    # failed leg has no artifact and its verify leg fails at the download). The
    # publish job still needs every build and every verify to pass.
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.verify-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-tester-bundle-${{ matrix.name }}
          path: bundle
      - name: Check the checksum and unpack
        run: |
          set -euo pipefail
          cd bundle
          sha256sum -c ./*.zip.sha256
          mkdir unpacked
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' ./*.zip unpacked
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.51.1
      - name: SPDX SBOM of the zip (ADR-1503)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          DESCRIBE: ${{ needs.validate.outputs.describe }}
          NAME: ${{ matrix.name }}
          # Every file with its SHA-256: Syft recognises few packages in a PE tree.
          SYFT_FILE_METADATA_SELECTION: all
        run: |
          set -euo pipefail
          name="vmafx-tester-windows-${NAME}-${DESCRIBE}"
          mkdir -p sbom
          "$SYFT" scan "dir:bundle/unpacked/${name}" \
            --source-name "vmafx-tester-windows-${NAME}" --source-version "${DESCRIBE}" \
            -o "spdx-json=sbom/${name}.spdx.json"
          jq -e '.spdxVersion and ((.packages | length) > 0)' "sbom/${name}.spdx.json" > /dev/null
      - name: Validate the zip's report against the schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements/locks/jsonschema.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/check-hardware-reports.py \
            --report bundle/report.json
      # The hosted runner has no GPU: the CUDA zip's report must name the missing
      # driver rather than fail or pass without a device (ADR-1516).
      - name: The CUDA zip reports no device on the hosted runner
        if: matrix.name == 'x64-cuda'
        run: |
          jq -e '.gpu.backend == "cuda" and .gpu.status == "no_device" and (.gpu.reason | test("nvcuda.dll"))' \
            bundle/report.json
      # The SYCL zip's own Level Zero loader runs and finds no Intel GPU (ADR-1566).
      - name: The SYCL zip reports no device on the hosted runner
        if: matrix.name == 'x64-sycl'
        run: |
          jq -e '.gpu.backend == "sycl" and .gpu.status == "no_device" and .gpu.access.path == "windows" and (.gpu.reason | test("Level Zero finds no Intel GPU"))' \
            bundle/report.json
      - name: Summarise what the hosted runner could exercise
        env:
          ARCH: ${{ matrix.name }}
        run: |
          python3 - bundle/report.json bundle/bundle-files.txt >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1]))
          sizes = [int(line.split(" ", 1)[0]) for line in open(sys.argv[2]) if line.strip()]
          print(f"### Windows {os.environ['ARCH']} zip: its report on the hosted runner")
          print(f"- verdict: {r['verdict']}, failed checks: {r['failed_checks']}")
          print(f"- host: {r['host']['cpu_model']} / {r['host']['os_version']}")
          print(f"- dispatch flags: {', '.join(r['host']['dispatch_flags'])}")
          print(f"- dispatch equivalence: {r['dispatch_equivalence']['status']}")
          print(f"- reference equivalence: {r['reference_equivalence']['status']}")
          print(f"- unit tests: {r['unit_tests']['passed']} passed, {r['unit_tests']['failed']} failed, {r['unit_tests']['skipped']} skipped")
          print(f"- failures: {', '.join(r['unit_tests']['failures']) or 'none'}")
          print(f"- unpacked: {len(sizes)} files, {sum(sizes) / 1e6:.1f} MB")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-tester-sbom-${{ matrix.name }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 14

  # The required context (ADR-1687). `verify` runs only after `validate` passed and
  # downloads the zip that the last step of `build` uploads, so a leg whose build
  # failed has no artifact and its verify leg fails; `verify` is skipped when the
  # planner selected nothing. Only a selected run whose every verify leg passed, or
  # an unselected run, passes. The publish job never runs on a pull request and is
  # not part of it.
  windows-tester-zip:
    needs: [tier, impact, verify]
    if: always() && needs.tier.outputs.light == 'true'
    # required-aggregator
    name: Windows Tester Zip
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require selected Windows zip work
        env:
          PLAN_RESULT: ${{ needs.impact.result }}
          # The SYCL selector holds every pattern of the x64 one (a test pins it), so
          # either selected means work.
          SELECTED: ${{ (needs.impact.outputs.selected == 'true' || needs.impact.outputs.selected-sycl == 'true') && 'true' || 'false' }}
          WORK_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::impact planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::invalid Windows zip gate state selected=$SELECTED work=$WORK_RESULT"; exit 1 ;;
          esac

  publish:
    name: Attest and publish the tester zips
    needs: [validate, build, verify]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tester-publish
    permissions:
      contents: write      # create the prerelease and its tag
      id-token: write      # keyless signing and attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: windows-tester-*
          path: bundle
          merge-multiple: false
      - name: Collect the release assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir assets
          for name in x64 arm64 x64-cuda x64-sycl; do
            zips=(bundle/"windows-tester-bundle-$name"/*.zip)
            sboms=(bundle/"windows-tester-sbom-$name"/*.spdx.json)
            if [[ "${#zips[@]}" -ne 1 || "${#sboms[@]}" -ne 1 ]]; then
              echo "expected one zip and one SBOM for $name, found ${#zips[@]} and ${#sboms[@]}" >&2
              exit 1
            fi
            cp "${zips[0]}" "${zips[0]}.sha256" "${sboms[0]}" assets/
            cp "bundle/windows-tester-bundle-$name/report.json" "assets/report-$name.json"
            cp "bundle/windows-tester-bundle-$name/bundle-files.txt" "assets/bundle-files-$name.txt"
            key="${name//-/_}"
            echo "zip_$key=assets/$(basename "${zips[0]}")" >> "$GITHUB_OUTPUT"
            echo "sbom_$key=assets/$(basename "${sboms[0]}")" >> "$GITHUB_OUTPUT"
          done
      - name: Attest build provenance (GitHub native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: assets/*.zip
      - name: Attest the x64 SBOM (ADR-1503)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.zip_x64 }}
          sbom-path: ${{ steps.assets.outputs.sbom_x64 }}
      - name: Attest the arm64 SBOM (ADR-1503)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.zip_arm64 }}
          sbom-path: ${{ steps.assets.outputs.sbom_arm64 }}
      - name: Attest the x64 CUDA SBOM (ADR-1503)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.zip_x64_cuda }}
          sbom-path: ${{ steps.assets.outputs.sbom_x64_cuda }}
      - name: Attest the x64 SYCL SBOM (ADR-1503)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.zip_x64_sycl }}
          sbom-path: ${{ steps.assets.outputs.sbom_x64_sycl }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Sign the zips (keyless OIDC via Sigstore)
        run: |
          for f in assets/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      # Creating the tag of a commit that is behind master (and so may differ in
      # .github/workflows/) is refused for the job token, which cannot hold the
      # `workflows` permission. Only the release step speaks as the release-bot
      # identity of release-please.yml (App when its secrets exist, else the PAT,
      # else it fails), as in macos-tester-bundle.yml (#1942).
      - name: Choose the release-bot identity
        id: creds
        env:
          RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_BOT_APP_ID" && -n "$RELEASE_BOT_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_BOT_TOKEN" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: no release-bot identity: set RELEASE_BOT_APP_ID and" >&2
            echo "RELEASE_BOT_PRIVATE_KEY (preferred) or RELEASE_BOT_TOKEN;" >&2
            echo "see docs/development/release.md, 'Release-bot identity'." >&2
            exit 1
          fi
      - name: Mint the release-bot installation token
        if: steps.creds.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Create the tester prerelease
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
          DESCRIBE: ${{ needs.validate.outputs.describe }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_TOKEN" ]]; then
            GH_TOKEN="$APP_TOKEN"
            identity="release-bot GitHub App installation token"
          elif [[ -n "$PAT" ]]; then
            GH_TOKEN="$PAT"
            identity="RELEASE_BOT_TOKEN (personal access token)"
          else
            echo "ERROR: the identity step passed but no token reached this step" >&2
            exit 1
          fi
          export GH_TOKEN
          echo "creating $RELEASE_TAG as: $identity" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "Tester zips for Windows on x64 and on Arm64, the x64 zip with the CUDA"
            echo "backend for NVIDIA GPUs and the x64 zip with the SYCL backend for Intel GPUs."
            echo "**Not a product release.**"
            echo
            echo "Built from \`$DESCRIBE\` ($SOURCE_SHA) by the hosted Windows runners,"
            echo "workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo "Steps for testers: docs/usage/tester-image.md in the repository (section F)."
            echo "The programs are not code-signed: check the zip against its .sha256, its"
            echo "build attestation or its cosign bundle before you run it."
            echo
            echo "Licences: \`licenses/THIRD_PARTY_NOTICES.txt\` inside each zip lists every"
            echo "component with its licence and carries the licence texts (ADR-1503)."
            echo "The SPDX SBOMs are the \`.spdx.json\` assets, each attested with its zip."
          } > notes.md
          gh release create "$RELEASE_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --latest=false \
            --title "Windows tester zips $RELEASE_TAG (not a product release)" \
            --notes-file notes.md
          echo "release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
