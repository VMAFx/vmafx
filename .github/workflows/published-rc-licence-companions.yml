#
# published-rc-licence-companions.yml — notices and corresponding source for
# the images published for v1.0.0-rc.1 and rc.2 before ADR-1513 (ADR-1578).
#
# Those images stay published and unchanged. For each one recorded under
# `keep` in tools/rc1-tester/image/published-rc/artifacts.json this workflow:
#   - refuses to run if the tag no longer names the recorded digest;
#   - unpacks every platform of that digest and writes its notices with
#     licensing.py (the build scan of the release tag is recorded under
#     published-rc/scans/);
#   - fetches the source of every installed Debian / Ubuntu package at its
#     installed version, the recorded source archives of grafted libraries and
#     the copyleft Go modules, into an image pushed as <tag>-source, signed and
#     attested, with an SPDX SBOM attested on the published digest;
#   - attaches THIRD_PARTY_NOTICES-<image>-<platform>.txt and the licence texts
#     to the release page.
# Manual dispatch only. With `publish` false it does all of that except the
# push and the upload, and keeps the result as a workflow artifact.

name: Published RC Licence Companions

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release whose images to complete
        type: choice
        options: [v1.0.0-rc.1, v1.0.0-rc.2]
        required: true
      artifact:
        description: One image of the release, its native files and models.tar.gz (native), or all
        type: choice
        options: [all, native, cpu, server, cuda13, oneapi2025, go-server, operator]
        default: all
      publish:
        description: Push <tag>-source, attest, and attach the notices to the release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: published-rc-licence-companions-${{ inputs.release }}
  cancel-in-progress: false

env:
  # Layer compression of the <tag>-source images this workflow pushes through
  # .github/actions/image-licence-artifacts (ADR-1594); docker-publish-tester.yml
  # explains each option. The published rc images themselves are not rebuilt.
  IMAGE_COMPRESSION: compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true

jobs:
  plan:
    name: Images of ${{ inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          RELEASE: ${{ inputs.release }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          artifacts="$(python3 scripts/release/published_rc_companion.py plan \
            --release "$RELEASE" --artifact "$ARTIFACT")"
          echo "artifacts=${artifacts}" >> "$GITHUB_OUTPUT"

  companion:
    name: ${{ inputs.release }} ${{ matrix.artifact }}
    needs: plan
    if: needs.plan.outputs.artifacts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.plan.outputs.artifacts) }}
    permissions:
      contents: write        # gh release upload
      packages: write        # push <tag>-source
      id-token: write        # cosign keyless, actions/attest
      attestations: write
    env:
      RELEASE: ${{ inputs.release }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      # The runner context is not available in a job-level env, so the work
      # directory is set here. It is under RUNNER_TEMP, never under a `..` of the
      # workspace: actions/upload-artifact refuses a path with a `..` in it.
      - name: Work directory
        run: echo "WORK=${RUNNER_TEMP}/companion" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Go module resolution for the Go images' licences uses the release's
      # own go.mod; the build scans are recorded, so nothing is compiled here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.release }}
          path: release-tree
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: release-tree/go.mod
          cache: false

      - name: Free runner disk for the unpacked images and their sources
        run: |
          df -h /
          docker system prune --all --force
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: image
        run: python3 scripts/release/published_rc_companion.py show --release "$RELEASE" --artifact "$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Check the digest and unpack every platform
        run: |
          mkdir -p "$WORK"
          python3 scripts/release/published_rc_companion.py export \
            --release "$RELEASE" --artifact "$ARTIFACT" --work "$WORK"

      - name: Write the notices and the source list
        run: |
          python3 scripts/release/published_rc_companion.py licence \
            --release "$RELEASE" --artifact "$ARTIFACT" --work "$WORK" \
            --source-tree "$GITHUB_WORKSPACE/release-tree"
          wc -l "$WORK/sources.list"

      # Debian packages from the archive or snapshot.debian.org, Ubuntu packages
      # from Launchpad, each at the exact installed version (licensing.py).
      - name: Fetch the corresponding source
        run: |
          set -euo pipefail
          base="$(sed -n 's/^RELEASE_BUILDER_BASE="\(.*\)".*/\1/p' build-config.env)"
          test -n "$base"
          mkdir -p "$WORK/source-image/sources"
          docker run --rm \
            -v "$WORK:/work" \
            -v "$GITHUB_WORKSPACE/tools/rc1-tester/image:/tool:ro" \
            "$base" bash -euo pipefail -c '
              sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends python3 ca-certificates >/dev/null
              python3 /tool/licensing.py fetch-sources --list /work/sources.list \
                --out /work/source-image/sources'
          sudo chown -R "$(id -u):$(id -g)" "$WORK/source-image"
          du -sh "$WORK/source-image/sources"

      - name: Pack the notices
        run: |
          set -euo pipefail
          cd "$WORK/notices"
          tar -czf "../licenses-${ARTIFACT}.tar.gz" --exclude='THIRD_PARTY_NOTICES-*' .
          cp ../sources.list "sources-${ARTIFACT}.list"
          cp ../source-image/sources/SOURCES.txt "SOURCES-${ARTIFACT}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: published-rc-${{ inputs.release }}-${{ matrix.artifact }}
          path: |
            ${{ env.WORK }}/notices/THIRD_PARTY_NOTICES-*.txt
            ${{ env.WORK }}/notices/sources-*.list
            ${{ env.WORK }}/notices/SOURCES-*.txt
            ${{ env.WORK }}/licenses-*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: inputs.publish

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: inputs.publish
        with:
          cosign-release: "v3.1.3"

      - name: SBOM of the published digest, and the source image
        if: inputs.publish
        uses: ./.github/actions/image-licence-artifacts
        with:
          compression: ${{ env.IMAGE_COMPRESSION }}
          image: ${{ steps.image.outputs.image }}
          digest: ${{ steps.image.outputs.digest }}
          name: ${{ inputs.release }}-${{ matrix.artifact }}
          source-file: docker/Dockerfile.published-source
          source-target: published-source
          source-context: ${{ env.WORK }}/source-image
          source-tag: ${{ steps.image.outputs.tag }}-source
          platforms: ${{ steps.image.outputs.platforms }}

      - name: Attach the notices to the release page
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$WORK"/notices/THIRD_PARTY_NOTICES-*.txt "$WORK/licenses-${ARTIFACT}.tar.gz"

  native:
    name: ${{ inputs.release }} native files and models.tar.gz
    if: inputs.artifact == 'all' || inputs.artifact == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # gh release upload
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Work directory
        run: echo "WORK=${RUNNER_TEMP}/native" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/assets"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$WORK/assets" \
            -p vmaf -p 'libvmaf.so*' -p models.tar.gz -p container-build-provenance.txt

      - name: Write the notices of the release files and of models.tar.gz
        run: |
          set -euo pipefail
          python3 scripts/release/published_rc_companion.py native \
            --release "$RELEASE" --assets "$WORK/assets" --work "$WORK"
          tar -czf "$WORK/licenses-native.tar.gz" -C "$WORK/notices" native models

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: published-rc-${{ inputs.release }}-native
          path: |
            ${{ env.WORK }}/notices/THIRD_PARTY_NOTICES-*.txt
            ${{ env.WORK }}/licenses-native.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Attach the notices to the release page
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$WORK"/notices/THIRD_PARTY_NOTICES-*.txt "$WORK/licenses-native.tar.gz"

  release-note:
    name: Licence section of the ${{ inputs.release }} release page
    needs: [companion, native]
    if: inputs.publish && inputs.artifact == 'all' && !cancelled() && needs.companion.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # gh release edit
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Add or replace the licence section of the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          python3 scripts/release/published_rc_companion.py note --release "$RELEASE" --body body.md > notes.md
          gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
