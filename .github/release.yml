# GitHub-native release notes (ADR-1233).
#
# release-please is configured with `changelog-notes-type: "github"`, so the
# body of every GitHub Release is generated by GitHub from the merged pull
# requests rather than from commit subjects. GitHub groups those PRs BY LABEL,
# which is why .github/workflows/pr-type-label.yml exists: it derives a
# `type:*` label from each PR's Conventional-Commit prefix. Without that, every
# PR lands in the uncategorised bucket -- which is the state this repo was in,
# with 32 of the last 40 merged PRs carrying no label at all.
#
# Order here is the order sections appear in the release body.
changelog:
  exclude:
    labels:
      - autorelease: pending
    authors:
      - github-actions
  categories:
    - title: ⚠ Breaking changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - type:feature
    - title: 🐛 Bug fixes
      labels:
        - type:bug
    - title: 🔒 Security
      labels:
        - type:security
        - security
    - title: ⚡ Performance
      labels:
        - type:perf
        - perf
    - title: 🎮 GPU backends
      labels:
        - type:sycl
        - type:cuda
        - type:simd
    - title: ⬆ Ports from upstream Netflix/vmaf
      labels:
        - type:port
    - title: ♻ Refactors
      labels:
        - type:refactor
    - title: 📚 Documentation
      labels:
        - type:docs
    - title: 🧪 Tests
      labels:
        - type:test
    - title: 🏗 Build system
      labels:
        - type:build
    - title: 🔧 CI / infrastructure
      labels:
        - type:ci
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🧹 Miscellaneous
      labels:
        - type:chore
        - type:style
        - type:revert
    # Catch-all. If this section is ever large, the labeler is not working.
    - title: Other changes
      labels:
        - "*"
