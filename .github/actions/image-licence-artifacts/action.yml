#
# The licence artifacts of one published production image (ADR-1503, ADR-1513):
# an SPDX SBOM (Syft v1.51.1) of every platform image, attested on its digest with
# actions/attest, and the image's corresponding-source companion (the Dockerfile's
# source-export stage) pushed as <tag>-<suffix>, signed and attested. A job that
# built its platform images by digest on native runners passes the source images
# those jobs pushed in `source-digests`; they are merged into one index instead
# of building the source stage here. The calling job has pushed the image,
# installed cosign, logged in to the registry and holds packages/id-token/
# attestations write permissions.
name: Image licence artifacts
description: Attest an SPDX SBOM per platform and publish the corresponding-source image
inputs:
  image:
    description: Image repository, e.g. ghcr.io/vmafx/vmafx
    required: true
  digest:
    description: Digest of the pushed image (an index or a single manifest)
    required: true
  name:
    description: Short name for the SBOM files and artifacts, e.g. cpu
    required: true
  source-file:
    description: Dockerfile that defines the source stage (build mode)
    required: false
    default: ""
  source-target:
    description: Dockerfile target that holds the corresponding source (build mode)
    required: false
    default: ""
  source-context:
    description: Build context of the source stage (build mode); the repository by default
    required: false
    default: "."
  source-digests:
    description: Space-separated sha256 digests of source images already pushed per platform (merge mode)
    required: false
    default: ""
  source-tag:
    description: Tag of the source image, e.g. v1.0.0-source
    required: true
  platforms:
    description: Platforms of the image and of its source image
    required: true
  build-args:
    description: Build arguments of the image build (the source stage shares its cache)
    required: false
    default: ""
  compression:
    description: >-
      Layer compression of the source image the build mode pushes, the calling
      workflow's IMAGE_COMPRESSION (ADR-1594),
      compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true
    required: true
runs:
  using: composite
  steps:
    - name: Install syft
      id: syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      with:
        syft-version: v1.51.1
    - name: SPDX SBOM of each platform image
      id: sbom
      shell: bash
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        NAME: ${{ inputs.name }}
      run: bash "${GITHUB_ACTION_PATH}/sbom.sh"
    - name: Attest the amd64 SBOM
      if: steps.sbom.outputs.amd64 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.sbom.outputs.amd64 }}
        sbom-path: sbom-${{ inputs.name }}-amd64.spdx.json
        push-to-registry: true
    - name: Attest the arm64 SBOM
      if: steps.sbom.outputs.arm64 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.sbom.outputs.arm64 }}
        sbom-path: sbom-${{ inputs.name }}-arm64.spdx.json
        push-to-registry: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: sbom-${{ inputs.name }}-spdx
        path: sbom-${{ inputs.name }}-*.spdx.json
        if-no-files-found: error
        retention-days: 90
    # ADR-1503 rule 5: the corresponding source of the copyleft parts, published
    # at the same place as the image for as long as the image is.
    - name: Build and push the source image
      id: source
      if: inputs.source-digests == ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: ${{ inputs.source-context }}
        file: ${{ inputs.source-file }}
        target: ${{ inputs.source-target }}
        platforms: ${{ inputs.platforms }}
        outputs: type=image,push=true,${{ inputs.compression }}
        tags: ${{ inputs.image }}:${{ inputs.source-tag }}
        cache-from: type=gha
        build-args: ${{ inputs.build-args }}
    - name: Merge the platform source images into one index
      id: merge
      if: inputs.source-digests != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.source-tag }}
        DIGESTS: ${{ inputs.source-digests }}
      run: |
        read -r -a digests <<<"$DIGESTS"
        sources=()
        for digest in "${digests[@]}"; do
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad source digest: $digest" >&2; exit 1; }
          sources+=("${IMAGE}@${digest}")
        done
        docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${sources[@]}"
        index="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
        [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no index digest for ${IMAGE}:${TAG}" >&2; exit 1; }
        echo "digest=${index}" >>"$GITHUB_OUTPUT"
    - name: Sign the source image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.source.outputs.digest || steps.merge.outputs.digest }}
        TAG: ${{ inputs.source-tag }}
      run: |
        cosign sign --yes "${IMAGE}@${DIGEST}"
        echo "source image: ${IMAGE}:${TAG} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"
    - name: Attest the source image's provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.source.outputs.digest || steps.merge.outputs.digest }}
        push-to-registry: true
