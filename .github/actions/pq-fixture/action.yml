name: PQ fixture
description: >-
  Puts a fixture bundle under python/test/resource/yuv and takes it
  out again, so it stays in its own cache entry and out of the shared resource
  cache. A failed download fails the job.

inputs:
  phase:
    description: "'get' before the tests, 'finish' after them."
    required: true
  bundle:
    description: "Fixture bundle name (default: pq-sollevante-v1)."
    required: false
    default: pq-sollevante-v1

runs:
  using: composite
  steps:
    - name: Read the fixture sha
      id: sha
      shell: bash
      run: echo "sha=$(bash scripts/test/fetch-test-yuvs.sh --print-bundle-sha ${{ inputs.bundle }})" >> "$GITHUB_OUTPUT"

    - name: Restore the fixture
      id: restore
      if: inputs.phase == 'get'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: python/test/resource/yuv/${{ inputs.bundle }}
        key: vmaf-${{ inputs.bundle }}-${{ steps.sha.outputs.sha }}

    - name: Remember the cache result for the finish phase
      if: inputs.phase == 'get'
      shell: bash
      run: |
        safe_name=$(echo "${{ inputs.bundle }}" | tr '.-' '__')
        echo "FIXTURE_CACHE_HIT_${safe_name}=${{ steps.restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
        if [ "${{ inputs.bundle }}" = "pq-sollevante-v1" ]; then
          echo "PQ_FIXTURE_CACHE_HIT=${{ steps.restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
        fi

    # The script checks the member hashes on a cache hit too.
    - name: Fetch the fixture if missing
      if: inputs.phase == 'get'
      shell: bash
      run: bash scripts/test/fetch-test-yuvs.sh --bundle ${{ inputs.bundle }}

    - name: Check if cache save needed
      id: check_save
      if: inputs.phase == 'finish'
      shell: bash
      run: |
        safe_name=$(echo "${{ inputs.bundle }}" | tr '.-' '__')
        hit=$(printenv "FIXTURE_CACHE_HIT_${safe_name}" || true)
        if [ "${{ inputs.bundle }}" = "pq-sollevante-v1" ] && [ -n "${PQ_FIXTURE_CACHE_HIT:-}" ]; then
          hit="${PQ_FIXTURE_CACHE_HIT}"
        fi
        if [ "${hit}" = "true" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the fixture
      if: inputs.phase == 'finish' && steps.check_save.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: python/test/resource/yuv/${{ inputs.bundle }}
        key: vmaf-${{ inputs.bundle }}-${{ steps.sha.outputs.sha }}

    - name: Keep the fixture out of the shared resource cache
      if: inputs.phase == 'finish'
      shell: bash
      run: rm -rf python/test/resource/yuv/${{ inputs.bundle }}
