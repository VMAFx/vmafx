// VMAFx controller service (ADR-0711): the client API (SubmitJob, GetJob,
// CancelJob, StreamJobs) used by the CLI, the MCP server and the operator, and
// the node API (RegisterNode, Heartbeat, PullWork, ReportResult) used by
// vmafx-node. It is served on the same gRPC port as the scoring service.

syntax = "proto3";

package vmafx.controller.v1;

option go_package = "github.com/VMAFx/vmafx/gen/go/controller;controllerv1";

// VmafxController queues scoring jobs for callers and hands them to nodes.
service VmafxController {
  // SubmitJob enqueues a new scoring job and returns its ID.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // GetJob retrieves the current state of a job by ID.
  rpc GetJob(GetJobRequest) returns (Job);

  // CancelJob cancels a pending or running job. A running job's node learns of it from its next
  // Heartbeat (cancel_job_ids) and stops the job.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // StreamJobs opens a server-streaming RPC that pushes Job updates to the caller. An empty
  // filter streams all jobs; a non-empty status filter restricts updates to jobs in those
  // states.
  rpc StreamJobs(StreamJobsRequest) returns (stream Job);

  // RegisterNode is called by a vmafx-node on startup to announce its capabilities. Returns an
  // opaque session token the node includes in subsequent calls.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Heartbeat is called by a vmafx-node every ~10 s. A node that misses heartbeats for its
  // session lifetime (60 s by default) loses its session, and its in-flight jobs return to the
  // queue. The response names the node's running jobs that were cancelled.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // PullWork is called by a vmafx-node when it has capacity. Returns the next matching PENDING
  // job (if any), or an empty response if the queue is empty or no job matches the node's
  // capabilities.
  rpc PullWork(PullWorkRequest) returns (PullWorkResponse);

  // ReportResult is called by a vmafx-node when a job finishes (success or failure) or when
  // partial per-frame results are available.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

// JobStatus encodes the job lifecycle state machine: PENDING, then RUNNING, then COMPLETED,
// FAILED or CANCELLED.
enum JobStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELLED = 4;
}

// ScoringParams mirrors the scoring service's ScoreRequest, carried inside a Job.
message ScoringParams {
  // Reference video: an absolute path, an http(s) URL or an rclone remote. It must lie under
  // one of the caller tenant's scoring roots (ADR-1577).
  string reference = 1;

  // Distorted video, under the same rule as reference.
  string distorted = 2;

  // Optional VMAF model name (e.g. "vmaf_v0.6.1"). Defaults to vmaf_v1.0.16_3d0h.
  string model = 3;

  // Optional backend hint: "cuda", "sycl", "hip", "cpu". The scheduler uses this to match a
  // node with the required capability. Empty string means the scheduler may assign any
  // available node.
  string backend = 4;
}

// Job represents a scoring work item managed by the controller.
message Job {
  // Unique job identifier (UUID).
  string id = 1;

  // status is the current lifecycle state of the job.
  JobStatus status = 2;

  // scoring holds the scoring parameters for this job.
  ScoringParams scoring = 3;

  // partial_results accumulates per-frame partial scores streamed by the node.
  repeated double partial_results = 4;

  // assigned_node is the node ID currently executing this job, or empty.
  string assigned_node = 5;

  // error is set when status == FAILED; empty otherwise.
  string error = 6;

  // created_at is a Unix timestamp (seconds) when the job was submitted.
  int64 created_at = 7;

  // updated_at is a Unix timestamp (seconds) of the last status change.
  int64 updated_at = 8;

  // final_score is the aggregate VMAF score written by the controller when the job reaches
  // COMPLETED. The vmafx-operator copies it into the VmafxJob CR status. Zero until the job
  // completes successfully.
  double final_score = 9;

  // scoring_roots are the scoring roots of the job's tenant, set only in a PullWork answer: the
  // node scores the inputs only when they resolve under one of them, and refuses the job when
  // the list is empty (ADR-1577).
  repeated string scoring_roots = 10;
}

// NodeCapability encodes what a vmafx-node instance can run.
message NodeCapability {
  // GPU vendor: "nvidia", "amd", "intel", "cpu".
  string gpu_vendor = 1;

  // Available backends on this node (e.g. ["cuda", "cpu"]).
  repeated string backends = 2;

  // Number of concurrent scoring slots this node can handle.
  int32 concurrency = 3;
}

// SubmitJobRequest is the argument of SubmitJob.
message SubmitJobRequest {
  // The job to queue.
  ScoringParams scoring = 1;
}

// SubmitJobResponse is the answer of SubmitJob.
message SubmitJobResponse {
  // ID of the queued job.
  string job_id = 1;
}

// GetJobRequest is the argument of GetJob.
message GetJobRequest {
  // ID of the job to read.
  string job_id = 1;
}

// CancelJobRequest is the argument of CancelJob.
message CancelJobRequest {
  // ID of the job to cancel.
  string job_id = 1;
}

// CancelJobResponse is the answer of CancelJob.
message CancelJobResponse {
  // ok is true if the job was found and a cancellation was requested.
  bool ok = 1;

  // Human-readable status note.
  string message = 2;
}

// StreamJobsRequest is the argument of StreamJobs.
message StreamJobsRequest {
  // status_filter restricts the stream to jobs in these states. Empty = stream all jobs.
  repeated JobStatus status_filter = 1;
}

// RegisterNodeRequest is the argument of RegisterNode.
message RegisterNodeRequest {
  // Human-readable node name (e.g. hostname).
  string name = 1;

  // What the node can run.
  NodeCapability capability = 2;
}

// RegisterNodeResponse is the answer of RegisterNode.
message RegisterNodeResponse {
  // node_id is the controller-assigned identifier for this node session.
  string node_id = 1;

  // session_token is an opaque bearer token the node includes in all subsequent Node API calls.
  string session_token = 2;
}

// HeartbeatRequest is the argument of Heartbeat.
message HeartbeatRequest {
  // The node's session ID from RegisterNode.
  string node_id = 1;

  // The session token from RegisterNode.
  string session_token = 2;

  // jobs_running is the count of jobs the node is currently executing.
  int32 jobs_running = 3;

  // running_job_ids lists the IDs of the jobs the node is executing now, at most 64 (the node's
  // slot limit); the controller refuses a longer list.
  repeated string running_job_ids = 4;
}

// HeartbeatResponse is the answer of Heartbeat.
message HeartbeatResponse {
  // ok is false if the controller no longer recognises this session. The node should re-
  // register when ok == false.
  bool ok = 1;

  // cancel_job_ids lists the entries of running_job_ids that belong to the caller's tenant and
  // were cancelled (CancelJob) while the node ran them. The node stops each one, which kills
  // its vmaf process, and reports it as failed; the job stays CANCELLED. Empty when ok is
  // false.
  repeated string cancel_job_ids = 2;
}

// PullWorkRequest is the argument of PullWork.
message PullWorkRequest {
  // The node's session ID from RegisterNode.
  string node_id = 1;

  // The session token from RegisterNode.
  string session_token = 2;

  // What the node can run now.
  NodeCapability capability = 3;
}

// PullWorkResponse is the answer of PullWork.
message PullWorkResponse {
  // job is set when a matching job was found; nil when the queue is empty.
  Job job = 1;
}

// ReportResultRequest is the argument of ReportResult.
message ReportResultRequest {
  // The node's session ID from RegisterNode.
  string node_id = 1;

  // The session token from RegisterNode.
  string session_token = 2;

  // ID of the job the result belongs to.
  string job_id = 3;

  // final indicates this is the terminal result (success or failure).
  bool final = 4;

  // score is the aggregate VMAF score (populated when final == true, success).
  double score = 5;

  // features is the per-feature score map (populated when final == true).
  map<string, double> features = 6;

  // partial_scores carries per-frame partial results (populated when final == false).
  repeated double partial_scores = 7;

  // error is set when the job failed.
  string error = 8;
}

// ReportResultResponse is the answer of ReportResult.
message ReportResultResponse {
  // ok is true when the controller recorded the result.
  bool ok = 1;
}
