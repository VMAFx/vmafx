#
# config/rbac/role_vmafxmodeltraining.yaml — minimum ClusterRole for the
# VmafxModelTraining reconciler.
#
# The VmafxModelTraining reconciler reads VmafxModelTraining objects,
# patches their status subresource, and emits Kubernetes events when
# a model checkpoint is written by the sidecar trainer.
#
# ADR-0786: vmafx-operator Stage 2 — per-controller RBAC minimum permissions.
# ADR-0714: vmafx-operator kubebuilder skeleton + CRDs (parent).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmafx-operator-vmafxmodeltraining-role
rules:
  # VmafxModelTraining: read + status patch
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings/status]
    verbs: [get, update, patch]
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings/finalizers]
    verbs: [update]
  # Events — for CheckpointWritten events emitted on each checkpoint
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
