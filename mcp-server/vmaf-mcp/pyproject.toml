[project]
name = "vmaf-mcp"
version = "3.2.1" # x-release-please-version
description = "MCP server exposing VMAF scoring, model listing, and benchmark runs via JSON-RPC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause-Patent" }
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = [
  "mcp>=2.1.1",
  "pydantic>=2.13.5",
  "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-aiohttp>=1.1.1", "ruff>=0.16.5", "mypy>=2.3.1"]
# Optional HTTP operator surface (--transport http). Kept separate so stdio
# clients do not need aiohttp or Prometheus at runtime (ADR-0701).
http = [
  "aiohttp>=3.14.3",
  "prometheus-client>=0.20.0",
]
# Optional: enables `eval_model_on_split` + `compare_models`. Pulls in the
# ONNX / pandas / scipy stack, so it's off by default to keep the base MCP
# install light for callers that only want `vmaf_score`.
eval = [
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "pyarrow>=25.0.1",
  "onnxruntime>=1.29.0",
  "scipy>=1.18.1",
]
# Optional: enables `describe_worst_frames` with vision-language fallback
# (SmolVLM → Moondream2 → metadata-only). Pulls in transformers + torch.
# Heavy install; off by default so the base MCP keeps a light footprint
# (ADR-0172 / T6-6).
vlm = [
  "transformers>=5.16.1",
  "torch>=2.13.0",
  "Pillow>=12.3.0",
  "accelerate>=1.14.0",
]

[project.scripts]
vmaf-mcp = "vmaf_mcp.server:main"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/mcp/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmaf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests >30 s wall (or that exercise real GPUs / containers and may grow
    # past 30 s). Exclude with `pytest -m 'not slow'` for fast iteration.
    # See docs/adr/0908-slow-test-audit-2026-05-30.md.
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length handled by black
  "B008",   # typer.Option / FastAPI Depends pattern — idiomatic
  "RUF001", # ambiguous unicode — em-dashes in strings are intentional
  "RUF002", # ambiguous unicode in docstrings
  "RUF003", # ambiguous unicode in comments
]
