[project]
name = "vmaf-mcp"
version = "1.0.0-rc.3" # x-release-please-version
description = "MCP server exposing VMAF scoring, model listing, and benchmark runs via JSON-RPC."
readme = "README.md"
requires-python = ">=3.10"
license = "EUPL-1.2 AND BSD-2-Clause-Patent"
license-files = ["LICENSES/*"]
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = [
  "mcp>=2.3.0",
  "pydantic>=2.13.5",
  "anyio>=4.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-aiohttp>=1.1.1",
  "prometheus-client>=0.26.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  # The `eval` extra below: without it 16 tests skip (eval_model_on_split,
  # compare_models), so the dev environment carries it.
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pyarrow>=25.0.1",
  "onnxruntime>=1.30.0",
  "scipy>=1.18.1",
  # Tests build tiny ONNX graphs with it (not imported by the server). Below 1.23:
  # 1.23 writes IR version 14, which onnxruntime 1.30 (max IR 13) refuses to load.
  "onnx>=1.22.0,<1.23.0",
]
# Optional HTTP operator surface (--transport http). Kept separate so stdio
# clients do not need aiohttp or Prometheus at runtime (ADR-0701).
http = [
  "aiohttp>=3.14.4",
  "prometheus-client>=0.26.0",
]
# Optional: enables `eval_model_on_split` + `compare_models`. Pulls in the
# ONNX / pandas / scipy stack, so it's off by default to keep the base MCP
# install light for callers that only want `vmaf_score`.
eval = [
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pyarrow>=25.0.1",
  "onnxruntime>=1.30.0",
  "scipy>=1.18.1",
]
# Optional: `describe_worst_frames` descriptions from a local vision-language
# model through ONNX Runtime GenAI; the model directory comes from
# VMAF_MCP_VLM_MODEL (ADR-0172, ADR-1886). Without it the tool returns frame
# metadata. torch must not appear in any group of this package
# (scripts/ci/check-torch-scope.py).
vlm = [
  "onnxruntime-genai>=0.17.1",
]

[project.scripts]
vmaf-mcp = "vmaf_mcp.server:main"
# Deprecated for one release: `vmafx-mcp` is the Go server (cmd/vmafx-mcp). The alias
# warns and hands over to the Go binary when one is on PATH.
vmafx-mcp = "vmaf_mcp.console_alias:deprecated_vmafx_mcp_alias"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.dev/mcp/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmaf_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Tests >30 s wall (or that exercise real GPUs / containers and may grow
    # past 30 s). Exclude with `pytest -m 'not slow'` for fast iteration.
    # See docs/adr/0908-slow-test-audit-2026-05-30.md.
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length handled by black
  "B008",   # typer.Option / FastAPI Depends pattern — idiomatic
  "RUF001", # ambiguous unicode — em-dashes in strings are intentional
  "RUF002", # ambiguous unicode in docstrings
  "RUF003", # ambiguous unicode in comments
]
