# Light-touch pre-commit. The Netflix golden gate is intentionally NOT here
# (see D24) — it runs in CI only because it requires a built binary.
# The format/lint hooks run only on changed files for speed.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The hooks below have broad exclude patterns because the upstream
      # Netflix tree ships MATLAB sources, Python pickles (binary), and
      # precompiled MEX (.mexa64/.mexw64/.mexmaci64) that pre-commit's
      # text-transforming hooks would silently corrupt. Limit to the files
      # we actually author/maintain.
      # NOTE: binary-extension patterns are belt-and-suspenders insurance:
      # ^model/ is the primary directory guard; the extension patterns catch
      # any binary blobs that may be added outside model/ in the future.
      # .onnx.data (ONNX external-data sidecar) is intentionally listed
      # alongside .onnx — they are raw float tensors, never text.
      # praetor writes generated, hash-verified artefacts: the base64 source
      # bundle under .devcontainer/ and the pinned policy catalog under
      # .config/archetypes/. `standardsctl audit` compares them byte-for-byte
      # against recorded digests, so appending a newline breaks the gate.
      - id: trailing-whitespace
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/'
      - id: end-of-file-fixer
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/'
      - id: check-merge-conflict
      - id: check-yaml
        # mkdocs.yml uses `!!python/name:...` tags (Material extensions, pymdownx
        # superfences) which the default SafeLoader can't resolve.
        # Helm templates under deploy/helm/ contain Go template syntax ({{- if ... }})
        # which is not valid YAML; exclude them from the YAML linter.
        # kuttl test files are legitimately multi-document YAML (multiple `---`
        # separators per file); the check-yaml hook's single-document constraint
        # does not apply. Exclude the entire kuttl-tests/ directory.
        exclude: '\.clang-format$|^mkdocs\.yml$|^deploy/helm/.*/templates/|^test/e2e/kuttl-tests/'
      - id: check-json
        # A fuzz corpus is deliberately full of malformed inputs:
        # seed_duplicate_model_key.json and seed_duplicate_rho_row.json exist
        # precisely to carry the duplicate keys this hook rejects, and the
        # whitespace/EOF fixers above must not append a byte to any corpus
        # file either — a fuzz input is only a reproducer while it stays
        # byte-exact. Harness sources and meson.build under core/test/fuzz/
        # are deliberately still checked; only the corpus dirs are exempt.
        exclude: '^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/'
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # Same binary-file exclusions as trailing-whitespace / end-of-file-fixer
        # above — mixed-line-ending's built-in binary detection misfires on
        # some ONNX / .bin payloads and rewrites bytes inside the serialized
        # model, which then fails sha256 pinning in registry.json.
        # .onnx.data added alongside .onnx (external tensor sidecar; raw bytes).
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/'
      - id: detect-private-key
      # forbid-new-submodules: the fork pulls upstream Netflix code via
      # subprojects/ wraps (Meson dependency mechanism) and ffmpeg-patches/
      # (out-of-tree patch series), never via .gitmodules. Any attempt to
      # add a git submodule is almost certainly a mistake or a supply-chain
      # vector; gate it here so it shows up at commit time, not at review
      # time.
      - id: forbid-new-submodules

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        entry: python3 scripts/ci/pelorus_mirror.py clang-format
        types_or: [c, c++, cuda]
        # Pelorus interop sources, headers, and shared conformance fixture are
        # a vendored read-only mirror (ADR-1113). The wrapper exempts only paths
        # in the shared exact-path manifest; an added pelorus_*.cpp stays linted.
        exclude: '^subprojects/|^core/test/data/'

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: '^(python|ai|scripts|tools)/.*\.py$'
        # Upstream Netflix training-harness tree — not authored by us; see
        # pyproject.toml [tool.black] extend-exclude. Black's extend-exclude
        # only filters during directory walks, not explicitly-passed files,
        # so pre-commit needs its own exclude to skip them.
        exclude: '^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        files: '^(python|ai|scripts|tools)/.*\.py$'
        exclude: '^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/'
        args: ["--fix"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      # shfmt-src builds from the Go module proxy (proxy.golang.org) rather
      # than downloading a prebuilt binary from mvdan.cc at wheel-build time.
      # The binary variant ("shfmt") hit HTTP 502 on the mvdan.cc CDN on every
      # CI run because the pre-commit cache key was stale (py3.12 vs py3.14),
      # forcing a re-download on every push. shfmt-src is immune to that CDN
      # and is equally fast once Go is available on the runner (ubuntu-latest
      # ships Go). Cache key is now pinned to py3.14 in lint-and-format.yml.
      - id: shfmt-src
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      # ADR-0866 — wire markdownlint-cli2 into pre-commit. pass_filenames
      # is true (the default) so only staged *.md files are linted; the
      # ~6.2k pre-existing-warning tail (ADR-0864) does not gate
      # innocent PRs. NO --fix arg: ADR-0864 documents 7 default rules
      # that silently change meaning under autofix (MD004 prose
      # conjunctions, MD007 reference-list indent, MD018 PR-number
      # headings, MD027 license-block quoting, MD029 ordered-list
      # renumbering, MD037/MD038 emphasis/code spacing).
      # Exclude upstream / vendored / fixture trees that ship markdown
      # we do not author. The Netflix MATLAB tree has no .md files but
      # is listed for symmetry with check-copyright above.
      - id: markdownlint-cli2
        # Default is true, but call it out explicitly per ADR-0866:
        # the gate's whole shape depends on per-file scope (matches the
        # touched-file rule, CLAUDE.md §12 r12).
        pass_filenames: true
        # Exclusions:
        #   - subprojects/, core/test/data/, *resource/, *matlab/, model/,
        #     testdata/: upstream / vendored / fixture trees we don't author.
        #   - docs/adr/README.md, CHANGELOG.md: auto-generated from
        #     fragments by scripts/docs/concat-adr-index.sh /
        #     scripts/release/concat-changelog-fragments.sh (ADR-0221).
        #   - docs/adr/_index_fragments/, changelog.d/: per-PR fragments
        #     that are concatenated mechanically. Each fragment is a
        #     bare table row or a body-only ## heading section — they
        #     are not standalone documents and will always trip MD013
        #     (long table rows) / MD041 (no first-line H1). Their
        #     rendered output (README.md / CHANGELOG.md, both excluded
        #     above) is what readers see; the fragments themselves are
        #     pipeline input.
        #
        #   The testdata pattern is `(^|/)testdata/`, not `^testdata/`: golden
        #   fixtures also live under pkg/*/testdata/ (the benchmark renderer's
        #   expected Markdown, for one), and those are byte-exact expected
        #   output rather than prose. The root-anchored form missed them, which
        #   only stayed hidden because this hook and `make lint-md` both scope
        #   to changed files.
        exclude: '^subprojects/|^core/test/data/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|^model/|(^|/)testdata/|^docs/adr/README\.md$|^CHANGELOG\.md$|^docs/adr/_index_fragments/|^changelog\.d/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore", "revert", "port", "sycl", "cuda", "simd"]

  - repo: local
    hooks:
      - id: no-conflict-markers
        name: No committed git conflict markers (belt-and-suspenders)
        # Belt-and-suspenders companion to the `check-merge-conflict` hook
        # from pre-commit-hooks above. That hook is Python-based and covers
        # the standard three-way conflict syntax; this shell hook uses
        # `git grep` which is executed by git's own C binary and is
        # essentially free (< 5ms on a typical staged tree). If either fires,
        # the merge wasn't fully resolved. PR #50 shipped conflict markers
        # into 70 docs and source files; this hook would have blocked it.
        entry: scripts/ci/check-conflict-markers.sh
        language: script
        # Always fire — conflict markers can appear in YAML, C, Python,
        # Markdown, etc., regardless of which file types were staged.
        pass_filenames: false
        always_run: true

      - id: agent-worktree-drift-guard
        name: ADR-0332 agent worktree-drift guard
        entry: scripts/ci/check-agent-worktree-drift.sh
        language: script
        # Always runs — does not consume the file list. The guard is
        # about *where* the commit is being authored from, not about
        # which files changed.
        always_run: true
        pass_filenames: false
        # No `stages` override — runs at default `pre-commit` time
        # alongside the formatters. Bypass with `git commit --no-verify`
        # for legitimate main-checkout commits while an agent is active.

      - id: merge-train-guard-contract
        name: Merge-train ownership and validation regressions
        entry: python3 -m unittest discover -s scripts/dev/tests -p test_*merge_train_guard.py
        language: system
        files: '^scripts/dev/((install_)?merge_train_guard\.py|tests/test_(install_)?merge_train_guard\.py)$'
        pass_filenames: false

      - id: test-safe-subprocess-boundary
        name: Bounded process execution and fail-soft consumer regressions
        entry: python3 -m unittest scripts.lib.test_safe_subprocess scripts.lib.test_backlog_tracker scripts.ci.tests.test_agent_eligibility_precheck
        language: system
        files: '^(\.pre-commit-config\.yaml|scripts/(lib/((backlog_tracker|safe_subprocess|test_(backlog_tracker|safe_subprocess))\.py|testdata/current-backlog\.md)|ci/(agent-eligibility-precheck\.py|tests/test_agent_eligibility_precheck\.py)))$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: check-dispatch-registry
        name: Check backend feature extractor dispatch registry wiring
        entry: scripts/ci/check-dispatch-registry.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-default-model-single-source
        name: Default VMAF model is defined in exactly one place
        entry: scripts/ci/check-default-model-single-source.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-base-image-single-source
        name: Container base images come from build-config.env
        entry: scripts/ci/check-base-image-single-source.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-cuda-pin-lockstep
        name: CUDA release is one pin in sixteen places
        entry: scripts/ci/check-cuda-pin-lockstep.py
        language: script
        pass_filenames: false
        always_run: true

      - id: test-base-image-single-source
        name: Base image and toolchain single-source tests
        entry: python3 -m unittest discover -s scripts/ci/tests -p 'test_*single_source.py'
        language: system
        files: '^(Makefile|\.pre-commit-config\.yaml|build-config\.env|pyproject\.toml|dev/Containerfile|renovate\.json|Dockerfile|docker/Dockerfile\.[a-z-]+|\.github/workflows/(build|libvmaf-build-matrix)\.yml|scripts/ci/(check-base-image-single-source\.sh|check-container-image-references\.py|check-cuda-pin-lockstep\.py|check-workflow-versions\.py|tests/test_(base_image|cuda_pin|level_zero|formatter_pins|mypy_python_version)_single_source\.py))$'
        pass_filenames: false

      - id: test-dev-container-build-secret
        name: Dev-container GitHub token uses an optional BuildKit secret
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_dev_container_build_secret.py
        language: system
        files: '^(\.github/workflows/dev-container-build\.yml|\.pre-commit-config\.yaml|dev/(Containerfile|docker-compose\.yml|scripts/fetch-intel-neo\.py)|docs/development/dev-mcp\.md|scripts/ci/(check-dev-container-build-secret\.py|tests/test_dev_container_build_secret\.py))$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: test-envtest-single-source
        name: Envtest installer and Make/CI version ownership
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_envtest_single_source.py
        language: system
        files: '^(Makefile|build-config\.env|scripts/ci/(setup-envtest\.sh|tests/test_envtest_single_source\.py)|\.github/workflows/go-ci\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-configured-lint-driver
        name: Configured native lint scope and failure propagation
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_lint_configured.py
        language: system
        files: '^(Makefile|scripts/ci/(lint-configured\.py|write-compile-commands\.py|write_cppcheck_posix_model\.py|cppcheck-public-entrypoints\.cfg|tests/test_(lint_configured|write_compile_commands|cppcheck_posix_model)\.py)|core/include/libvmaf/[^/]+\.(h|build)|\.github/workflows/(lint-and-format|nightly)\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-compile-commands-export
        name: Explicit Ninja compilation database export
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_write_compile_commands.py
        language: system
        files: '^(Makefile|scripts/ci/(write-compile-commands\.py|tests/test_write_compile_commands\.py)|\.github/workflows/(lint-and-format|nightly)\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-tidy-ratchet-lanes
        # The lane-flag cases lived in tests/test_tidy_ratchet_extra_args.py
        # until #1504/#1507 consolidated ExtraArgForwarding into
        # tests/test_tidy_ratchet.py and deleted the file. Arm64LaneFlags moved
        # with it. Pointing `discover -p` at a deleted file is not a failure
        # anyone sees as one: unittest exits 5 with "NO TESTS RAN", so the hook
        # goes red without naming a defect.
        name: Ratchet lane flags reach clang-tidy (ADR-1142, ADR-1283)
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_tidy_ratchet.py
        language: system
        files: '^(Makefile|scripts/ci/(tidy-ratchet\.py|tidy-baseline-arm64\.json|tests/test_tidy_ratchet\.py)|build-aux/aarch64-linux-gnu\.ini|\.pre-commit-config\.yaml)$'
        pass_filenames: false
      - id: test-tidy-ratchet-sycl-compdb
        name: SYCL tidy lane augments its compilation database
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_tidy_ratchet_sycl_compdb.py
        language: system
        files: '^(Makefile|scripts/ci/(gen-sycl-compile-commands\.py|tidy-ratchet\.py|tests/test_tidy_ratchet_sycl_compdb\.py)|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-sycl-aot-command
        name: SYCL AOT and language-standard command contract
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_sycl_aot_command.py
        language: system
        files: '^(core/(meson\.build|src/meson\.build)|scripts/ci/(gen-sycl-compile-commands\.py|tests/test_sycl_aot_command\.py)|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-sycl-compile-command-generator
        name: SYCL tidy compile commands preserve diagnostic flags
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_gen_sycl_compile_commands.py
        language: system
        files: '^(scripts/ci/(gen-sycl-compile-commands\.py|tests/test_gen_sycl_compile_commands\.py)|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: test-renovate-file-patterns
        name: Renovate custom managers select real inputs
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_renovate_file_patterns.py
        language: system
        files: '^(renovate\.json|scripts/ci/tests/test_renovate_file_patterns\.py)$'
        pass_filenames: false

      - id: check-python-requirements-single-source
        name: Python requirements derive from python/pyproject.toml
        entry: scripts/ci/check-python-requirements-single-source.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: test-git-fixture-isolation
        name: Git fixtures preserve caller repositories
        entry: python3 scripts/ci/test_git_fixture_isolation.py
        language: system
        files: '^(scripts/ci/test_(git_fixture_isolation|ffmpeg_patch_stack|ffmpeg_patch_smoke_safety)\.py|scripts/ci/test-classify-dependency-pr\.sh|scripts/ci/tests/(test_level_zero_single_source\.py|test-sync-pelorus-interop\.sh)|scripts/dev/test-cleanup-agent-state\.sh|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: check-no-tracked-venv
        name: No virtualenv path is tracked (dir or symlink)
        entry: scripts/ci/check-no-tracked-venv.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: check-local-data-contract
        name: Local state, corpus, and public evidence stay separated
        entry: scripts/ci/check-local-data-contract.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: check-state-md-rows
        name: Every docs/state.md bug id appears exactly once (ADR-0165)
        entry: scripts/ci/check-state-md-rows.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-aggregator-names
        name: Check required CI checks aggregator list matches workflows
        entry: scripts/ci/check-aggregator-names.sh
        language: script
        files: '^\.github/workflows/.*\.ya?ml$|^scripts/ci/(tests/test-)?check-aggregator-names\.sh$'
        pass_filenames: false

      - id: hiss-replay-contract
        name: HISS replay evidence remains fail-closed
        entry: python3 -B scripts/ci/tests/test_hiss_replay_contract.py
        language: system
        files: '^(\.config/hiss/|\.github/workflows/(required-aggregator|standards-gate)\.yml|\.pre-commit-config\.yaml|AGENTS\.md|Makefile|README\.md|lefthook\.yml|scripts/ci/tests/test_hiss_replay_contract\.py)$'
        pass_filenames: false
      - id: check-copyright
        name: ADR-0105 copyright header present (C/C++/CUDA)
        entry: scripts/ci/check-copyright.sh
        language: script
        # Exclusions: (a) upstream vendored subprojects, (b) test fixtures,
        # (c) resource directories that ship upstream assets unchanged,
        # (d) core/src/pdjson.{c,h} — vendored 3rd-party JSON parser
        # retaining its own in-file "Vendored 3rd-party" banner,
        # (e) compat/python-vmaf/matlab/ — upstream Netflix training-harness MATLAB
        # MEX C sources, already excluded from other hygiene hooks.
        exclude: '^subprojects/|^core/test/data/|^compat/python-vmaf/resource/|^python/test/resource/|^compat/python-vmaf/matlab/|^core/src/pdjson\.(c|h)$'
        types_or: [c, c++, cuda]

      - id: check-adr-links
        name: ADR links resolve (slug drift, T-DOCS-ADR-LINK-SLUG-DRIFT-2026-09-23)
        entry: python3 scripts/ci/check-adr-links.py
        language: system
        pass_filenames: false
        # Fires on any docs/ Markdown change. ADRs are cited by number but the
        # filename slug is in the link path, so renaming an ADR silently breaks
        # every link written against the old slug. mkdocs --strict does not catch
        # these -- 73 had accumulated across 43 files before anything noticed.
        # `--fix` repoints a stale slug at the file carrying its number; a number
        # with no file at all is never auto-fixed, because only a human knows
        # whether it is a typo or an ADR that was never written.
        files: '^docs/.*\.md$'

      - id: test-check-adr-links
        name: ADR link checker keeps its positive, negative and boundary cases
        entry: python3 scripts/ci/tests/test_check_adr_links.py
        language: system
        pass_filenames: false
        files: '^scripts/ci/(check-adr-links\.py|tests/test_check_adr_links\.py)$'

      - id: check-adr-numbering
        name: ADR-0386 ADR number collision + heading consistency check
        entry: scripts/ci/check-adr-numbering.sh
        language: script
        # Only fires when a docs/adr/NNNN-*.md file is staged.
        # Checks: (1) no other file in the working tree shares the same NNNN,
        #         (2) the '# ADR-NNNN:' heading inside the file matches the filename.
        # The complementary CI gate (rule-enforcement.yml, adr-collision-check) catches
        # cross-branch races this hook cannot see.
        # Use 'scripts/adr/next-free.sh' to claim a collision-free number.
        files: '^docs/adr/[0-9]{4}-.*\.md$'
        pass_filenames: true

      # ----------------------------------------------------------------
      # CI-parity gates — keep the local pre-commit/pre-push experience
      # close to what the lint-and-format / ffmpeg-integration workflows
      # enforce so contributors catch cheap mistakes before a CI round-trip.
      # See docs/development/automated-rule-enforcement.md.
      # ----------------------------------------------------------------

      - id: assertion-density
        name: Power-of-10 §5 assertion density (fork-added C)
        entry: scripts/ci/assertion-density.sh
        language: script
        types_or: [c, c++]
        stages: [pre-push]
        # The script self-discovers fork-added files via the
        # "Copyright * Lusoris" copyright marker; pre-commit must not
        # pass per-file paths or the awk pass aborts mid-stream.
        pass_filenames: false

      - id: twin-drift-check
        name: .c/.cpp twin drift + stale source refs (ADR-1135)
        entry: scripts/ci/twin-drift-check.sh
        language: script
        files: (^|/)(meson\.build|setup\.py)$|\.(pyx|c|cpp)$
        stages: [pre-push]
        # Whole-tree predicate (every twin pair, every build file); per-file
        # paths would only narrow the scan and hide dead twins.
        pass_filenames: false

      - id: mypy-local
        name: mypy (ai/ + scripts/, fork-added Python)
        entry: python3 scripts/git-hooks/pre-push-mypy.py
        language: system
        # The wrapper owns the unchanged ai/scripts *.py policy. Incoming
        # old-tip/new-tip filenames omit owned files after a rebase.
        always_run: true
        pass_filenames: false
        verbose: true
        require_serial: true
        # Pre-push only — running mypy on every commit doubles a
        # 1-line edit's commit time. Check the complete branch-owned set
        # against the master merge base on every push, including rebases.
        # Contributors need `pip install mypy` (system tool, not in
        # pyproject.toml — same posture as CI's lint-and-format job).
        stages: [pre-push]

