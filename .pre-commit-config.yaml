      - id: dedupe-gate-contract
        name: Duplicate implementation scan remains fail-closed
        entry: bash scripts/ci/tests/test-dedupe-gate.sh
        language: system
        files: '^(Makefile|lefthook\.yml|scripts/ci/tests/test-dedupe-gate\.sh|\.github/workflows/(rule-enforcement|standards-gate)\.yml|\.pre-commit-config\.yaml)$'
