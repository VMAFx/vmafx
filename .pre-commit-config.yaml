      - id: mypy-scope-contract
        name: Check pre-push mypy merge-base scope
        entry: python3 scripts/git-hooks/test-pre-push-mypy.py
        language: system
        files: '^(scripts/git-hooks/(pre-push-mypy|test-pre-push-mypy)\.py|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: semgrep-local
        name: semgrep (.semgrep.yml — local rules, error-gated)
        # `--jobs 1` + `require_serial: true` together prevent the
        # io_uring queue-init failure observed on the dev box and in
        # contributor reports (blocked commit on PR #481 / #457 /
        # #484). semgrep-core (the OCaml engine behind `semgrep scan`)
        # uses Eio, which spawns one io_uring submission queue per
        # worker. On `pre-commit run --all-files` pre-commit batches
        # the 1.2k matched targets into chunks and runs the chunks in
        # parallel (one process per CPU by default). Each chunk's
        # OCaml runtime starts its own pool of io_uring queues, and
        # the combined per-process memlock charge exceeds
        # `ulimit -l` (8 MB default on Arch / CachyOS) — semgrep-core
        # dies with `Unix_error: Cannot allocate memory
        # io_uring_queue_init`. The Python wrapper surfaces this as
        # exit 2 — silently, because `--quiet` swallows the stderr
        # trace. The bug blocked PR #481 (ISO header guards) and
        # nuked PR #457 (doxygen) when a blocked commit let a push
        # through. `require_serial: true` collapses pre-commit's
        # parallel batches into a single sequential invocation;
        # `--jobs 1` collapses semgrep-core's intra-process
        # parallelism. Cost on the staged-files commit path is
        # negligible (≈2 s → ≈4 s) and the all-files path goes from
        # "always fails" to "works".
        entry: semgrep scan --config=.semgrep.yml --error --quiet --jobs 1        # `language: python` so pre-commit creates its own isolated
        # venv and pip-installs semgrep there. The CI `pre-commit` job
        # doesn't ship semgrep on PATH; with `language: system` the
        # hook would fail with `Executable 'semgrep' not found` on
        # every CI run.
        language: python
        additional_dependencies: ["semgrep>=1.177.0,<2.0"]
        require_serial: true
        types_or: [c, c++, cuda, python]
        # Paths this hook skips: (a) upstream vendored subprojects,
        # (b) test fixtures, (c) compat/python-vmaf/resource/ +
        # python/test/resource/ assets. All three are data or downloaded
        # build dependencies, not fork-compiled sources.
        # Nothing is skipped for being upstream-authored. The Netflix MATLAB
        # MEX C sources under compat/python-vmaf/matlab/ used to be listed
        # here, on the reasoning that their banned libc calls were "an
        # upstream change, not ours" — the exact origin-based exemption
        # ADR-1142 retired. Their last such call went in bc00da0be and the
        # tree scans clean, so the entry was dropped on 2026-09-21.
        # The vendored JSON code the library links — core/src/pdjson.{c,h}
        # and core/src/mcp/3rdparty/cJSON/ — is likewise NOT skipped
        # (ADR-0683, ADR-1142): this hook is the commit-time guard that
        # stops a re-vendor from bringing banned libc calls back, and the
        # whole-tree Semgrep CI job has always scanned pdjson anyway.
        exclude: '^subprojects/|^core/test/data/|^compat/python-vmaf/resource/|^python/test/resource/'
        # Runs at pre-commit time — fast on a single-file diff and the
        # rules in .semgrep.yml are the project's own, not p/cert-c-strict.
        # `pass_filenames: true` (the default) because semgrep accepts
        # explicit file paths and pre-commit's per-file invocation makes
        # the gate cheap on a single-file diff. For full-tree audits, run
        # `make lint` (which invokes `semgrep scan` against the worktree
        # without an explicit file list, picking up .semgrepignore).

      - id: test-semgrep-vendored-scope
        name: Banned-function guard sees vendored JSON code (planted-defect recall)
        # The hook above is only a guard for the paths it is allowed to see.
        # A rule-level exclude plus a .semgrepignore line once hid vendored
        # cJSON from it, and a re-vendor silently reverted two security fixes.
        # This plants banned calls at the vendored paths and requires both the
        # explicit-file form (this hook) and the whole-tree form (the Semgrep
        # CI job) to report them, then scans the real vendored files.
        # Same isolated semgrep environment and serial execution as above.
        entry: python3 -m unittest discover -s scripts/ci/tests -p test_semgrep_vendored_scope.py
        language: python
        additional_dependencies: ["semgrep>=1.177.0,<2.0"]
        require_serial: true
        files: '^(\.semgrep\.yml|\.semgrepignore|\.pre-commit-config\.yaml|scripts/ci/tests/test_semgrep_vendored_scope\.py|core/src/pdjson\.(c|h)|core/src/mcp/3rdparty/.*)$'
        pass_filenames: false

      # Shell-injection regression tests. Both fixes below were reverted once
      # by a pull request that carried stale copies of the scripts (PR #414
      # undid PR #350). The sycl-bench-env test already existed and would have
      # failed, but nothing ran it; the entrypoint probe had no test at all.
      # Hermetic (mktemp, stub programs, no Docker, no oneAPI), well under 1 s.
      - id: test-sycl-bench-env
        name: sycl-bench-env.sh keeps the oneAPI prefix out of the bash -c body
        entry: bash scripts/ci/test-sycl-bench-env.sh
        language: system
        files: '^(scripts/ci/(sycl-bench-env|test-sycl-bench-env)\.sh|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: test-sync-pelorus-interop
        name: Pelorus mirror guard fails closed without its exact Git pin
        entry: bash scripts/ci/tests/test-sync-pelorus-interop.sh
        language: system
        files: '^(scripts/sync-pelorus-interop\.sh|scripts/ci/pelorus[-_]mirror[^/]*|scripts/ci/tests/(test-sync-pelorus-interop\.sh|test_pelorus_mirror\.py)|\.github/workflows/lint-and-format\.yml|Makefile|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: test-dev-mcp-entrypoint-probe
        name: dev-mcp entrypoint probes run argv, never eval
        entry: bash scripts/ci/tests/test-dev-mcp-entrypoint-probe.sh
        language: system
        files: '^(dev/scripts/dev-mcp-entrypoint\.sh|scripts/ci/tests/test-dev-mcp-entrypoint-probe\.sh|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: ffmpeg-patches-apply-check
        name: FFmpeg patch stack on the configured release
        entry: python3 scripts/ci/ffmpeg_patch_stack.py --refresh --output-dir .workingdir/cache/ffmpeg-patch-stack/hooks
        language: system
        # CI helpers are authority inputs (ADR-1140), including the replay
        # script's config/refresh helpers. Public API/build changes can make
        # a previously clean patch stack stale without editing a patch.
        files: '^(ffmpeg-patches/|scripts/ci/|build-config\.env$|core/include/|(?:core/)?meson(?:_options\.txt|\.build)$|\.github/workflows/ffmpeg-patch-stack\.yml$)'
        stages: [pre-commit, pre-push]
        # Refresh only the configured release. The framework stops the commit
        # or push when regeneration changes tracked files for review/restaging.
        pass_filenames: false

      - id: validate-pr-body
        name: Validate PR body deliverables (ADR-0108 pre-push)
        entry: scripts/git-hooks/pre-push-pr-body-lint.sh
        language: script
        stages: [pre-push]
        # Always runs regardless of which files changed — the check is
        # about the PR description, not the code under review. Skip if
        # no open PR exists. A bounded gh lookup falls back to the public
        # PR page and fails closed if neither source is readable. See
        # docs/development/pr-body-sentinel-guide.md.
        always_run: true
        pass_filenames: false

      - id: test-pr-body-lookup
        name: PR-body metadata lookup fails closed without hanging
        entry: python3 scripts/git-hooks/test-pre-push-pr-body-lint.py
        language: system
        files: '^(scripts/git-hooks/(?:pre-push-pr-body-lint\.sh|test-pre-push-pr-body-lint\.py)|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: test-pr-body-input-selection
        name: PR-body gates classify stdin before reading it
        # `[ ! -t 0 ]` answers "is fd 0 a terminal", not "was a body
        # piped". A closed fd 0 used to deadlock all four gates that
        # read a PR body; /dev/null used to be read as an empty body.
        # Bounded by `timeout`, so a re-regression reports a hang
        # instead of hanging this hook. Every gate that sources
        # pr-body-input.sh belongs in `files:` below — the defect
        # survived its first fix by living in two scripts nobody had
        # listed.
        entry: bash scripts/ci/tests/test-pr-body-input-selection.sh
        language: system
        files: '^(scripts/ci/(?:deliverables-check|validate-pr-body|pr-body-input|ffmpeg-patches-surface-check|state-md-touch-check)\.sh|scripts/ci/tests/test-pr-body-input-selection\.sh|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: mkdocs-strict
        name: Build changed documentation with MkDocs strict validation
        entry: scripts/git-hooks/pre-push-mkdocs-strict.sh
        language: script
        stages: [pre-push]
        files: '^(docs/|mkdocs\.yml)'
        pass_filenames: false

      - id: check-generated-docs
        name: Check generated ADR and changelog freshness
        entry: make docs-fragments-check
        language: system
        stages: [pre-commit]
        files: '^(docs/adr/|changelog\.d/|scripts/docs/|scripts/release/concat-changelog-fragments\.sh$|mkdocs\.yml$|CHANGELOG\.md$|Makefile$)'
        pass_filenames: false
