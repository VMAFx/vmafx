# Light-touch pre-commit. The Netflix golden gate is intentionally NOT here
# (see D24) — it runs in CI only because it requires a built binary.
# The format/lint hooks run only on changed files for speed.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The hooks below have broad exclude patterns because the upstream
      # Netflix tree ships MATLAB sources, Python pickles (binary), and
      # precompiled MEX (.mexa64/.mexw64/.mexmaci64) that pre-commit's
      # text-transforming hooks would silently corrupt. Limit to the files
      # we actually author/maintain.
      # NOTE: binary-extension patterns are belt-and-suspenders insurance:
      # ^model/ is the primary directory guard; the extension patterns catch
      # any binary blobs that may be added outside model/ in the future.
      # .onnx.data (ONNX external-data sidecar) is intentionally listed
      # alongside .onnx — they are raw float tensors, never text.
      # praetor writes generated, hash-verified artefacts: the base64 source
      # bundle under .devcontainer/ and the pinned policy catalog under
      # .config/archetypes/. `standardsctl audit` compares them byte-for-byte
      # against recorded digests, so appending a newline breaks the gate.
      # docs/assets/fonts/ holds vendored upstream licence texts and fonts that
      # scripts/docs/check_vendored_assets.py holds to recorded SHA-256s;
      # docs/assets/charts/ and docs/javascripts/vendor/ hold renders and the
      # Vega bundle that scripts/docs/generate-charts.py compares byte for byte.
      - id: trailing-whitespace
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/|^docs/assets/fonts/|^docs/assets/charts/|^docs/javascripts/vendor/'
      - id: end-of-file-fixer
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/|^docs/assets/fonts/|^docs/assets/charts/|^docs/javascripts/vendor/'
      - id: check-merge-conflict
      - id: check-yaml
        # mkdocs.yml uses `!!python/name:...` tags (Material extensions, pymdownx
        # superfences) which the default SafeLoader can't resolve.
        # Helm templates under deploy/helm/ contain Go template syntax ({{- if ... }})
        # which is not valid YAML; exclude them from the YAML linter.
        # kuttl test files are legitimately multi-document YAML (multiple `---`
        # separators per file); the check-yaml hook's single-document constraint
        # does not apply. Exclude the entire kuttl-tests/ directory.
        exclude: '\.clang-format$|^mkdocs\.yml$|^deploy/helm/.*/templates/|^test/e2e/kuttl-tests/'
      - id: check-json
        # A fuzz corpus is deliberately full of malformed inputs:
        # seed_duplicate_model_key.json and seed_duplicate_rho_row.json exist
        # precisely to carry the duplicate keys this hook rejects, and the
        # whitespace/EOF fixers above must not append a byte to any corpus
        # file either — a fuzz input is only a reproducer while it stays
        # byte-exact. Harness sources and meson.build under core/test/fuzz/
        # are deliberately still checked; only the corpus dirs are exempt.
        exclude: '^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/'
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # ADR-1345: a release's changelog archive is the only remaining copy of
        # the fragments its cut consumed (scripts/release/rollover-changelog-
        # fragments.sh), so it cannot be generated at build time the way
        # ADR-1115 embeds the BRISQUE model. Only top-level .md files under
        # docs/changelog-archive/ are exempt; every other path keeps the limit.
        exclude: '^docs/changelog-archive/[^/]+\.md$'
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # Same binary-file exclusions as trailing-whitespace / end-of-file-fixer
        # above — mixed-line-ending's built-in binary detection misfires on
        # some ONNX / .bin payloads and rewrites bytes inside the serialized
        # model, which then fails sha256 pinning in registry.json.
        # .onnx.data added alongside .onnx (external tensor sidecar; raw bytes).
        exclude: '\.patch$|^subprojects/|^core/test/data/|^model/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|(^|/)testdata/|\.(pkl|mexa64|mexw64|mexmaci64|onnx|onnx\.data|bin|yuv|npy|so|a|dylib|dll)$|^core/test/fuzz/[^/]*(_corpus|_known_crashes)/|^\.devcontainer/praetor-source\.[0-9]+\.b64$|^\.config/archetypes/|^docs/assets/fonts/|^docs/assets/charts/|^docs/javascripts/vendor/'
      - id: detect-private-key
      # forbid-new-submodules: the fork pulls upstream Netflix code via
      # subprojects/ wraps (Meson dependency mechanism) and ffmpeg-patches/
      # (out-of-tree patch series), never via .gitmodules. Any attempt to
      # add a git submodule is almost certainly a mistake or a supply-chain
      # vector; gate it here so it shows up at commit time, not at review
      # time.
      - id: forbid-new-submodules

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        entry: python3 scripts/ci/pelorus_mirror.py clang-format
        types_or: [c, c++, cuda]
        # Pelorus interop sources, headers, and shared conformance fixture are
        # a vendored read-only mirror (ADR-1113). The wrapper exempts only paths
        # in the shared exact-path manifest; an added pelorus_*.cpp stays linted.
        exclude: '^subprojects/|^core/test/data/'
      # `.hip` and `.metal` have no identify tag, so `types_or` above never selects them;
      # this second entry reads them by extension, with the same wrapper, the same
      # `.clang-format` and the same pin. `scripts/ci/exact_twins.d/*.hip` are parity-gate
      # data fragments (ADR-1428) that only borrow the extension. `make format` and
      # `make format-check` read the same set (CLANG_FORMAT_FILES in the Makefile).
      - id: clang-format
        alias: clang-format-hip-metal
        name: clang-format (hip, metal)
        entry: python3 scripts/ci/pelorus_mirror.py clang-format
        types: [file]
        files: '\.(hip|metal)$'
        exclude: '^scripts/ci/exact_twins\.d/'

  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        # Every Python file in the tree (pre-commit's default `types_or`: python, pyi).
        # The only exclusions are the files declared in
        # .config/lint-exceptions.d/black.toml (a reason and an expiry each);
        # scripts/ci/tests/test_python_format_scope.py keeps this regex, the list and
        # pyproject.toml's extend-exclude equal.
        exclude: '^(\.config/hiss/testdata/HISS-02/python/positive/spaced-while-true\.py|tools/figures/mkdocs_hook\.py)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        # Same scope rule as black above; list: .config/lint-exceptions.d/ruff.toml.
        exclude: '^(\.config/hiss/testdata/HISS-04/python/(gap/cyclomatic-high|negative/loc-at-cap-60|positive/loc-def-over-cap)\.py|\.config/hiss/testdata/HISS-08/python/positive/eval-call\.py|\.config/agent/hooks/block_evasion\.py|tools/figures/mkdocs_hook\.py)$'
        args: ["--fix"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      # shfmt-src builds from the Go module proxy (proxy.golang.org) rather
      # than downloading a prebuilt binary from mvdan.cc at wheel-build time.
      # The binary variant ("shfmt") hit HTTP 502 on the mvdan.cc CDN on every
      # CI run because the pre-commit cache key was stale (py3.12 vs py3.14),
      # forcing a re-download on every push. shfmt-src is immune to that CDN
      # and is equally fast once Go is available on the runner (ubuntu-latest
      # ships Go). Cache key is now pinned to py3.14 in lint-and-format.yml.
      - id: shfmt-src
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      # ADR-0866 — wire markdownlint-cli2 into pre-commit. pass_filenames
      # is true (the default) so only staged *.md files are linted; the
      # ~6.2k pre-existing-warning tail (ADR-0864) does not gate
      # innocent PRs. NO --fix arg: ADR-0864 documents 7 default rules
      # that silently change meaning under autofix (MD004 prose
      # conjunctions, MD007 reference-list indent, MD018 PR-number
      # headings, MD027 license-block quoting, MD029 ordered-list
      # renumbering, MD037/MD038 emphasis/code spacing).
      # Exclude upstream / vendored / fixture trees that ship markdown
      # we do not author. The Netflix MATLAB tree has no .md files but
      # is listed for symmetry with check-copyright above.
      - id: markdownlint-cli2
        # Default is true, but call it out explicitly per ADR-0866:
        # the gate's whole shape depends on per-file scope (matches the
        # touched-file rule, CLAUDE.md §12 r12).
        pass_filenames: true
        # Exclusions:
        #   - subprojects/, core/test/data/, *resource/, *matlab/, model/,
        #     testdata/: upstream / vendored / fixture trees we don't author.
        #   - docs/adr/README.md, CHANGELOG.md: auto-generated from
        #     fragments by scripts/docs/concat-adr-index.sh /
        #     scripts/release/concat-changelog-fragments.sh (ADR-0221).
        #   - docs/adr/_index_fragments/, docs/rebase-notes.d/, changelog.d/: per-PR fragments
        #     that are concatenated mechanically. Each fragment is a
        #     bare table row or a body-only ## heading section — they
        #     are not standalone documents and will always trip MD013
        #     (long table rows) / MD041 (no first-line H1). Their
        #     rendered output (README.md / CHANGELOG.md, both excluded
        #     above) is what readers see; the fragments themselves are
        #     pipeline input.
        #
        #   The testdata pattern is `(^|/)testdata/`, not `^testdata/`: golden
        #   fixtures also live under pkg/*/testdata/ (the benchmark renderer's
        #   expected Markdown, for one), and those are byte-exact expected
        #   output rather than prose. The root-anchored form missed them, which
        #   only stayed hidden because this hook and `make lint-md` both scope
        #   to changed files.
        #
        #   tools/figures/ is praetor's figure engine, locked byte for byte by
        #   `standardsctl audit` (ADR-1351, cordanaLLM/praetor#578); praetor's
        #   own `make docs-lint` styles its README under praetor's rules.
        exclude: '^subprojects/|^core/test/data/|^python/test/resource/|^compat/python-vmaf/resource/|^compat/python-vmaf/matlab/|^model/|(^|/)testdata/|^docs/adr/README\.md$|^CHANGELOG\.md$|^docs/adr/_index_fragments/|^docs/rebase-notes\.d/|^changelog\.d/|^tools/figures/'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # ADR-2199: actionlint deadlocks when a `run:` script is larger than the pipe
        # it writes to shellcheck before starting it, which a user holding many
        # pipes makes common. The wrapper runs it under a deadline and fails loudly.
        entry: python3 scripts/ci/run_actionlint.py

  # Composite actions under .github/actions/ are not workflows: actionlint rejects
  # them ("jobs section is missing"). The GitHub action schema is checked here, the
  # structure and the shellcheck of every `run:` block by check_composite_actions.py
  # below (hook `check-composite-actions`).
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-actions

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore", "revert", "port", "sycl", "cuda", "simd"]

  - repo: local
    hooks:
      - id: rc1-tester-report-tests
        name: RC1 tester report unit regressions
        entry: python -m pytest -q tools/rc1-tester/tests
        language: python
        # zopfli: the Windows zip builder's encoder its tests exercise (ADR-1594);
        # keep equal to requirements/locks/windows-tester-zip.in.
        additional_dependencies: [pytest==9.1.1, zopfli==0.4.3]
        files: '^tools/rc1-tester/(src/|tests/|vmaf-rc1-report|pyproject\.toml|README\.md|AGENTS\.md)'
        pass_filenames: false

      - id: no-conflict-markers
        name: No committed git conflict markers (belt-and-suspenders)
        # Belt-and-suspenders companion to the `check-merge-conflict` hook
        # from pre-commit-hooks above. That hook is Python-based and covers
        # the standard three-way conflict syntax; this shell hook uses
        # `git grep` which is executed by git's own C binary and is
        # essentially free (< 5ms on a typical staged tree). If either fires,
        # the merge wasn't fully resolved. PR #50 shipped conflict markers
        # into 70 docs and source files; this hook would have blocked it.
        entry: scripts/ci/check-conflict-markers.sh
        language: script
        # Always fire — conflict markers can appear in YAML, C, Python,
        # Markdown, etc., regardless of which file types were staged.
        pass_filenames: false
        always_run: true

      - id: agent-worktree-drift-guard
        name: ADR-0332 agent worktree-drift guard
        entry: scripts/ci/check-agent-worktree-drift.sh
        language: script
        # Always runs — does not consume the file list. The guard is
        # about *where* the commit is being authored from, not about
        # which files changed.
        always_run: true
        pass_filenames: false
        # No `stages` override — runs at default `pre-commit` time
        # alongside the formatters. Bypass with `git commit --no-verify`
        # for legitimate main-checkout commits while an agent is active.

      - id: test-codex-hook-config
        name: Codex hooks resolve from the active repository worktree
        entry: python3 -B scripts/ci/tests/test_codex_hook_config.py
        language: system
        files: '^(\.codex/hooks(\.json|/.*)|scripts/ci/(AGENTS\.md|AGENTS\.d/codex-hooks\.md|tests/test_codex_hook_config\.py)|docs/development/agent-worktree-discipline\.md|\.pre-commit-config\.yaml)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: inherited-tags-contract
        name: Inherited Netflix tag deletion script and push guard (ADR-1805)
        entry: python3 -B -m unittest scripts/release/tests/test_inherited_tags.py
        language: system
        files: '^(scripts/release/(delete-inherited-upstream-tags\.py|inherited-upstream-tags\.json|tests/test_inherited_tags\.py)|scripts/git-hooks/check-push-tags\.py|lefthook\.yml)$'
        pass_filenames: false

      - id: merge-train-guard-contract
        name: Merge-train ownership and validation regressions
        entry: python3 -m unittest discover -s scripts/dev/tests -p test_*merge_train_guard.py
        language: system
        files: '^scripts/dev/((install_)?merge_train_guard\.py|tests/test_(install_)?merge_train_guard\.py)$'
        pass_filenames: false

      - id: rc3-home-gpu-retest-contract
        name: RC3 home GPU retest kit regressions (ADR-1386)
        entry: python3 -B -m unittest discover -s scripts/dev/tests -p test_rc3_home_gpu_retest.py
        language: system
        files: '^(scripts/dev/(rc3-home-gpu-retest\.sh|rc3_retest_helpers\.py|tests/test_rc3_home_gpu_retest\.py)|docs/state\.md)$'
        pass_filenames: false

      - id: test-safe-subprocess-boundary
        name: Bounded process execution and fail-soft consumer regressions
        entry: python3 -m unittest scripts.lib.test_safe_subprocess scripts.lib.test_backlog_tracker scripts.ci.tests.test_agent_eligibility_precheck
        language: system
        files: '^(\.pre-commit-config\.yaml|scripts/(lib/((backlog_tracker|safe_subprocess|test_(backlog_tracker|safe_subprocess))\.py|testdata/current-backlog\.md)|ci/(agent-eligibility-precheck\.py|tests/test_agent_eligibility_precheck\.py)))$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: tests-use-vmaf-under-test
        name: Python tests run the vmaf under test, never PATH or a host install
        entry: python3 -B -m unittest scripts.lib.test_vmaftest scripts.ci.tests.test_tests_use_vmaf_under_test
        language: system
        files: '\.py$|^\.github/test-suites\.json$'
        pass_filenames: false

      - id: suite-registry
        name: Every test file belongs to a suite a required check runs (ADR-1528)
        entry: python3 scripts/ci/suite_registry.py check
        language: system
        files: '(^|/)(test_[^/]*\.(py|sh|c|cpp|cu)|[^/]*_test\.(py|sh|go|rs)|test-[^/]*\.sh)$|/tests/[^/]*\.rs$|^(\.pre-commit-config\.yaml|\.github/(test-suites\.json|workflows/required-aggregator\.yml)|scripts/ci/suite_registry\.py)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: meson-test-secret-env-contract
        name: Meson parent and test environment sanitization contract
        entry: python3 -m unittest core.test.test_meson_secret_env_sanitization
        language: system
        files: '^(\.pre-commit-config\.yaml|(?:.*/)?(?:GNUmakefile|[Mm]akefile)|(?:.*/)?tox\.ini|[^/]+\.(?:py|sh|ps1|cmd|bat)|core/(?:.*/)?meson\.build|core/test/test_meson_secret_env_sanitization\.py|(?:scripts|dev|tools)/.*\.(?:py|sh|ps1|cmd|bat)|\.github/(?:workflows|actions)/.*\.ya?ml|\.zed/tasks\.json|\.claude/skills/.*\.(?:sh|ps1|cmd|bat))$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: check-dispatch-registry
        name: Check backend feature extractor dispatch registry wiring
        entry: scripts/ci/check-dispatch-registry.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-default-model-single-source
        name: Default VMAF model is defined in exactly one place
        entry: scripts/ci/check-default-model-single-source.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-no-non-header-includes
        name: Guard against non-header includes in core/test
        entry: scripts/ci/check-no-non-header-includes.sh
        language: script
        files: '^core/test/.*\.(c|cpp)$'
        pass_filenames: true

      - id: test-check-no-non-header-includes
        name: Unit test for check-no-non-header-includes.sh
        entry: bash scripts/ci/tests/test-check-no-non-header-includes.sh
        language: system
        files: '^scripts/ci/(check-no-non-header-includes\.sh|tests/test-check-no-non-header-includes\.sh)$'
        pass_filenames: false

      - id: reuse-lint
        name: REUSE 3.3 license and copyright compliance (BUG-003)
        entry: reuse lint
        language: system
        pass_filenames: false
        always_run: true

      - id: test-reuse-compliance
        name: REUSE compliance regression tests (BUG-003)
        entry: python3 -m unittest scripts.ci.tests.test_reuse_compliance
        language: system
        files: '^(REUSE\.toml|scripts/ci/tests/test_reuse_compliance\.py|LICENSES/.*)$'
        pass_filenames: false

      - id: test-relicense-fork-files
        name: Licence provenance tool and reviewed provenance file (ADR-1250, ADR-1474)
        # The whole-tree check needs every file's history and the upstream
        # tree, so it is the required `Licence Provenance` CI job and not a
        # hook. These are its unit tests and the provenance file's contract.
        entry: python3 -B -m unittest scripts/dev/tests/test_relicense_fork_files.py
        language: system
        files: '^scripts/dev/(relicense_fork_files\.py|relicense_provenance\.toml|tests/test_relicense_fork_files\.py)$'
        pass_filenames: false

      - id: check-licence-metadata
        name: Root licence files and package licence fields agree with the files (ADR-1250, ADR-1699)
        # Standard library only and about two seconds, so it runs on every
        # commit: a new file can change the licences a package ships. In CI the
        # Licence Provenance job runs it; the pre-commit job skips this id.
        entry: python3 -B scripts/ci/check_licence_metadata.py
        language: system
        pass_filenames: false
        always_run: true

      - id: test-check-licence-metadata
        name: Licence-metadata gate refuses its planted defects (ADR-1699)
        entry: python3 -B scripts/ci/tests/test_check_licence_metadata.py
        language: system
        files: '^(scripts/ci/(check_licence_metadata\.py|tests/test_check_licence_metadata\.py)|tools/rc1-tester/image/licensing\.(py|json)|LICENSE[^/]*|LICENSES/.*)$'
        pass_filenames: false

      - id: test-master-concurrency-contract
        name: A push to master never cancels an earlier master run (ADR-1673)
        entry: bash -c 'python3 -B scripts/ci/tests/test_master_concurrency_contract.py && python3 -B scripts/ci/test_security_workflow_contract.py'
        language: system
        files: '^(\.github/workflows/.*\.yml|scripts/ci/(tests/test_master_concurrency_contract|test_security_workflow_contract)\.py)$'
        pass_filenames: false

      - id: test-upstream-parity-pin
        name: Recorded upstream head parses and the Licence Provenance job reads it (ADR-1474)
        entry: python3 -B scripts/ci/tests/test_upstream_parity_pin.py
        language: system
        files: '^(docs/development/known-upstream-bugs\.md|scripts/ci/(upstream_parity_pin\.py|tests/test_upstream_parity_pin\.py)|\.github/workflows/(lint-and-format|required-aggregator)\.yml)$'
        pass_filenames: false

      - id: test-upstream-parity-guard
        name: Upstream parity guard compares, attributes and fails as documented (ADR-1487)
        entry: bash -c 'python3 -B scripts/ci/tests/test_upstream_parity_allowlist.py && python3 -B scripts/dev/tests/test_upstream_parity.py'
        language: system
        files: '^(scripts/ci/(upstream_parity_allowlist\.py|upstream_parity\.d/.*|cross_backend_calibration\.py|tests/test_upstream_parity_allowlist\.py)|scripts/dev/(upstream_parity(_matrix)?\.py|tests/test_upstream_parity\.py|tests/fixtures/upstream_parity/.*)|docs/adr/.*\.md)$'
        pass_filenames: false

      - id: check-base-image-single-source
        name: Container base images come from build-config.env
        entry: scripts/ci/check-base-image-single-source.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: check-torch-scope
        name: torch only in the training packages (ADR-1886)
        entry: scripts/ci/check-torch-scope.py
        language: script
        pass_filenames: false
        files: '(^|/)(pyproject\.toml|requirements[^/]*\.(txt|in))$|^scripts/ci/(check-torch-scope\.py|tests/test_check_torch_scope\.py)$'

      - id: check-cuda-pin-lockstep
        name: CUDA release and exact apt metadata stay locked across seven sites
        entry: scripts/ci/check-cuda-pin-lockstep.py
        language: script
        pass_filenames: false
        always_run: true

      - id: check-python-dependency-locks
        name: Check hash-locked Python dependencies and secure pip installs
        entry: python3 scripts/ci/check_python_dependency_locks.py check
        language: system
        files: '^(Makefile|noxfile\.py|requirements/.*|docs/requirements.*|python/requirements.*|ai/requirements.*|mcp-server/.*requirements.*|dev/requirements.*|dev-llm/.*requirements.*|tools/.*requirements.*|\.github/workflows/.*|scripts/setup/.*|Dockerfile.*|dev/Containerfile|docker/.*|scripts/ci/check_python_dependency_locks\.py)$'
        pass_filenames: false

