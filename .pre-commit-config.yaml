        language: system
        files: '^(scripts/ci/test_fail_closed_ci\.py|python/tox\.ini|\.github/workflows/(nightly|required-aggregator|rule-enforcement|sanitizers|security-scans|tests-and-quality-gates)\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false
