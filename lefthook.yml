# Lefthook Configuration (Go 1.27+ & HISS-16 Governance)
# Governance commands fail closed: a failing or missing praetorctl blocks the commit or push.
agent-checkpoint-tool:
  commands:
    checkpoint:
      run: python3 -B .config/lefthook/scripts/checkpoint.py --event tool --json --marker
agent-checkpoint-stop:
  commands:
    checkpoint:
      run: python3 -B .config/lefthook/scripts/checkpoint.py --event stop --json --marker
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    govet:
      glob: "*.go"
      run: go vet ./...
    framework-hooks:
      # ADR-1249: lefthook owns .git/hooks because the praetor audit requires
      # active lefthook hooks, and delegates to the pre-commit framework so this
      # repository's existing hooks (clang-format, ruff, markdownlint, the ADR,
      # state.md and aggregator gates, semgrep, the ADR-0332 worktree-drift
      # guard) keep running unchanged. Superseding note for ADR-0924.
      run: |
        if [ -x .venv/bin/pre-commit ]; then .venv/bin/pre-commit run; \
        elif command -v pre-commit >/dev/null 2>&1; then pre-commit run; \
        else echo "pre-commit is not installed; framework hooks skipped" >&2; fi
    context-check:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl compile-context --verify; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl compile-context --verify; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi
    hiss-audit:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl audit; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl audit; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi

post-commit:
  commands:
    state-sync:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl state sync .; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl state sync .; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi
    dedupe-cadence:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl dedupe cadence --threshold=20 --record .; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl dedupe cadence --threshold=20 --record .; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi

pre-push:
  parallel: false
  commands:
    security:
      run: if command -v govulncheck >/dev/null 2>&1; then govulncheck ./...; else echo govulncheck is not installed, skipping >&2; fi
    flavor-audit:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl flavor audit .; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl flavor audit .; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi
    audit:
      run: if command -v praetorctl >/dev/null 2>&1; then praetorctl audit; elif [ -d ./cmd/standardsctl ]; then go run ./cmd/standardsctl audit; else echo HISS-16 governance hook cannot run because praetorctl is not installed >&2; exit 1; fi
    # The praetor gating pipeline is deliberately NOT run pre-push here. Its
    # race-detector stage runs `go test -race ./...` in a bare isolated worktree,
    # and every Go package in this repository is cgo over libvmaf
    # (-L core/build-cpu/src -lvmaf), so all six binaries fail to build before a
    # single test runs. The stage cannot pass without first building the C library,
    # which the gate has no way to declare. Its other five stages already run
    # above as `audit`, `flavor-audit` and `security`, and anti-direct-merge is
    # enforced by branch protection plus the required aggregator. Filed upstream
    # so the stage can use the repository's declared test command (ADR-1249).
