# VMAFX Rust workspace root
# Copyright 2026 Lusoris
# SPDX-License-Identifier: EUPL-1.2
#
# Members are filled in by per-sweep PRs. The vmafx-sys FFI crate is the
# first member (ADR-0702). Feature-extractor Rust pilots (TAD, ADR-0707)
# and future Rust CLI binaries are added by their respective ADR sweep PRs.

[workspace]
members = [
    "bindings/rust/vmafx-sys",
    "bindings/rust/vmafx",
]
# ADR-1713: the Rust code libvmaf links (the extractor framework, the twins,
# the predictor and the TAD pilot) is its own workspace,
# core/src/rust/Cargo.toml, with a lockfile that holds no external crate, so
# Meson's `cargo build --offline --locked` never needs the registry. Cargo
# resolves a whole workspace even for `-p`, and the bindings above pull in
# bindgen.
exclude = [
    "core/src/rust",
    "core/src/feature/rust/tad",
]
resolver = "2"

# Shared crate metadata. Per-crate manifests opt in via
# `repository.workspace = true` (etc.) so URL drift across the workspace
# is impossible — touch this block once, every member inherits.
# `license` is the licence of the files a crate ships (ADR-1250, ADR-1699):
# scripts/ci/check_licence_metadata.py holds every member that inherits it to
# its files, and a member whose files carry more declares its own.
[workspace.package]
authors = ["Lusoris <lusoris@pm.me>"]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/VMAFx/vmafx"
homepage = "https://github.com/VMAFx/vmafx"
documentation = "https://vmafx.dev/"
readme = "README.md"

[profile.release]
# Optimise for size as well as speed — libvmaf.so is embedded in
# many video pipeline processes where binary size matters.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
