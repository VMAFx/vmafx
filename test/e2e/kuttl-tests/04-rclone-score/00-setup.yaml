#
# test/e2e/kuttl-tests/04-rclone-score/00-setup.yaml
#
# Set up an in-cluster MinIO instance as a stand-in for an S3/rclone remote.
# Upload the tiny YUV fixtures into the bucket so the VmafxJob can fetch them
# via rclone:// URI.  The vmafx-node image bundles rclone; this test exercises
# the full rclone-fetch → vmaf-score path without needing external storage.
#
# ADR-0783 / ADR-0709 / ADR-0713.
---
# MinIO StatefulSet — single-node, ephemeral (no PVC; data resets on restart).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: vmafx-e2e-test
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-04-28T17-53-50Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: vmafx-e2e-test
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
# rclone config Secret — points to the in-cluster MinIO bucket.
apiVersion: v1
kind: Secret
metadata:
  name: rclone-config
  namespace: vmafx-e2e-test
stringData:
  rclone.conf: |
    [e2eminio]
    type = s3
    provider = Minio
    env_auth = false
    access_key_id = minioadmin
    secret_access_key = minioadmin
    endpoint = http://minio.vmafx-e2e-test.svc.cluster.local:9000
    force_path_style = true
