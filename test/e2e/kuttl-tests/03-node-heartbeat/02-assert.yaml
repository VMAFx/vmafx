#
# test/e2e/kuttl-tests/03-node-heartbeat/02-assert.yaml
#
# Assert: VmafxNode lastHeartbeat field is a non-empty timestamp.
# kuttl evaluates the assert document by patching it over the live object;
# any non-empty string value at that path satisfies the assertion.
#
# ADR-0783 / ADR-0713.
---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: verify-heartbeat-timestamp
commands:
  # Use kubectl jsonpath to confirm lastHeartbeat is non-empty.
  - command: >-
      bash -c 'ts=$(kubectl get vmafxnode node-cpu-stub -n vmafx-e2e-test
      -o jsonpath="{.status.lastHeartbeat}") && [ -n "$ts" ] &&
      echo "lastHeartbeat: $ts" || (echo "ERROR: lastHeartbeat not set" && exit 1)'
