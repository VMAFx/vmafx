#
# test/e2e/kuttl-tests/01-operator-installs/00-install.yaml
#
# Apply the operator Deployment + RBAC via helm upgrade --install in a TestStep
# command, then assert readiness. The CRDs are already installed by kind-cluster.sh;
# this step ensures the operator Pod itself reaches Available.
#
# ADR-0783 / ADR-0714.
---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: install-operator
commands:
  - command: >-
      helm upgrade --install vmafx-operator
      ../../deploy/helm/vmafx
      --namespace vmafx-system
      --create-namespace
      --set operator.enabled=true
      --set operator.image.tag=e2e-test
      --set image.tag=e2e-test
      --wait
      --timeout 120s
  - command: kubectl rollout status -n vmafx-system deployment/vmafx-operator --timeout=120s
