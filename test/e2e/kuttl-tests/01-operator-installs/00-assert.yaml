# test/e2e/kuttl-tests/01-operator-installs/00-assert.yaml
#
# Assert: CRDs are established and the operator Deployment is available.
# ADR-0783 / ADR-0714.
---
# CRD: VmafxJob must be Established.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmafxjobs.vmafx.dev
status:
  conditions:
    - type: Established
      status: "True"
    - type: NamesAccepted
      status: "True"
---
# CRD: VmafxNode must be Established.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmafxnodes.vmafx.dev
status:
  conditions:
    - type: Established
      status: "True"
    - type: NamesAccepted
      status: "True"
---
# CRD: VmafxModelTraining must be Established.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmafxmodeltrainings.vmafx.dev
status:
  conditions:
    - type: Established
      status: "True"
    - type: NamesAccepted
      status: "True"
---
# Operator Deployment must reach Available.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmafx-operator
  namespace: vmafx-system
status:
  availableReplicas: 1
  conditions:
    - type: Available
      status: "True"
