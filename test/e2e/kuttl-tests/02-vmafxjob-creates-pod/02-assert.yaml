#
# test/e2e/kuttl-tests/02-vmafxjob-creates-pod/02-assert.yaml
#
# Assert: VmafxJob reaches Succeeded phase and exposes a non-zero score.
# Timeout for this step is deliberately long (120 s) to allow the worker
# to pull the image and run ffmpeg decode + vmaf score.
#
# ADR-0783 / ADR-0714.
---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: wait-job-succeeded
timeout: 120
---
apiVersion: vmafx.dev/v1
kind: VmafxJob
metadata:
  name: job-tiny-cpu
  namespace: vmafx-e2e-test
status:
  phase: Succeeded
