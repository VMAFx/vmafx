# test/e2e/kuttl-tests/02-vmafxjob-creates-pod/00-create.yaml
#
# Create a minimal VmafxJob referencing local testdata YUVs (bundled as a
# ConfigMap-backed volume by the test fixture) using the cpu backend.
# The operator reconciler must create a worker Pod for the job.
#
# ADR-0783 / ADR-0714.
---
# Namespace for this test case.
apiVersion: v1
kind: Namespace
metadata:
  name: vmafx-e2e-test
---
# ConfigMap carrying a tiny synthetic YUV420p 64x64 8-frame clip (ref + dist).
# Generated by test/e2e/fixtures/gen-tiny-yuv.sh and committed as base64.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tiny-yuv-fixtures
  namespace: vmafx-e2e-test
binaryData:
  # These are populated by the CI workflow step "Prepare YUV fixtures".
  # The keys must match the rclone:// URIs used in the VmafxJob spec below.
  ref.yuv: ""
  dist.yuv: ""
---
# VmafxJob — one scoring request over the tiny fixtures.
apiVersion: vmafx.dev/v1
kind: VmafxJob
metadata:
  name: job-tiny-cpu
  namespace: vmafx-e2e-test
spec:
  # file:// URIs resolve inside the worker Pod; the fixtures ConfigMap is
  # mounted at /fixtures/ by the operator (see operator ImagePolicy in ADR-0714).
  reference: "file:///fixtures/ref.yuv"
  distorted: "file:///fixtures/dist.yuv"
  backend: cpu
