# test/e2e/kuttl-tests/05-sidecar-trainer/00-create.yaml
#
# Create a VmafxModelTraining CR that triggers the online sidecar trainer.
# The trainer collects samples from completed VmafxJobs and pushes a
# checkpoint once it has accumulated minSamples feedback entries.
# This test uses minSamples=1 and a short checkpoint interval so CI
# does not have to wait for a large corpus.
#
# ADR-0783 / ADR-0709 / ADR-0714.
---
# OCI registry stub — a local registry in-cluster that accepts pushes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-stub
  namespace: vmafx-e2e-test
  labels:
    app: registry-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-stub
  template:
    metadata:
      labels:
        app: registry-stub
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry-stub
  namespace: vmafx-e2e-test
spec:
  selector:
    app: registry-stub
  ports:
    - port: 5000
      targetPort: 5000
---
# VmafxModelTraining CR — minSamples=1 so the first completed job triggers a
# checkpoint push to the in-cluster registry stub.
apiVersion: vmafx.dev/v1
kind: VmafxModelTraining
metadata:
  name: train-online-e2e
  namespace: vmafx-e2e-test
spec:
  baseModel: vmaf_v0.6.1
  algorithm: online-sgd-ema
  checkpoint:
    interval: "10s"
    minSamples: 1
  outputRegistry: "registry-stub.vmafx-e2e-test.svc.cluster.local:5000/vmafx-models"
