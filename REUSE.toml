    ".dockerignore",
    ".gitattributes",
    ".gitignore",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "README.md",
]
precedence = "override"
SPDX-FileCopyrightText = ["2020 Netflix, Inc.", "2026 Lusoris"]
SPDX-License-Identifier = "BSD-2-Clause-Patent"

