#
# The one Rust toolchain of the repository (ADR-3318). The channel is
# build-config.env's RUST_VERSION; scripts/ci/check-workflow-versions.py refuses
# a different value here, in a crate's rust-version or in a workflow, and
# Renovate moves every copy in one pull request.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
