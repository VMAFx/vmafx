#
# sqlc configuration of the controller store (ADR-2350 D1), from the golusoris
# db/sqlc fragment (tools/sqlc.yaml.fragment). Regenerate with
# `scripts/codegen/sqlc.sh --write`; scripts/codegen/sqlc.sh --check is the
# drift gate. The SQLite engine joins when the standalone profile lands.
version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/postgres"
    schema: "migrations/postgres"
    gen:
      go:
        package: "pgdb"
        out: "pgdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        emit_json_tags: true
        json_tags_case_style: "snake"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
