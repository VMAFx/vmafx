            - "rocm"
          description: "ONNX Runtime execution provider of the tiny model. One of: auto, cpu, cuda, openvino, openvino-npu, openvino-cpu, openvino-gpu, coreml, coreml-ane, coreml-gpu, coreml-cpu, rocm. Unset: auto."
