          description: "Bitmask of GPU operations the extractors must not use."
        device:
          type: "string"
          description: "GPU of the selected backend: auto, or a device index. Needs a GPU backend that selects devices by index (sycl, hip, metal). Unset: auto."
        subsample:
          type: "integer"
          minimum: 1
          format: "int32"
