#
# The encoder registry (ADR-3388): every video encoder VMAFx knows about.
# scripts/codegen/vmafx-api.py reads this file and writes
# pkg/encoderregistry/registry.gen.json, its byte-identical copy in
# tools/vmaf-tune/src/vmaftune/codec_adapters/, and docs/usage/encoder-registry.md.
# An `implemented` row carries an [encoders.adapter] table that the Go
# pkg/encoder and pkg/codecadapter and the Python vmaf-tune adapters read;
# every other row is a gap with its licence class and the date its upstream
# state was checked. Field rules: scripts/codegen/vmafx_api/encoders.py.

format_version = 1

[[encoders]]
id = "av1_amf"
family = "av1"
paradigm = "classic"
class = "delivery"
status = "implemented"
interface = "ffmpeg"
ffmpeg_encoder = "av1_amf"
hardware = "amf"
licence_class = "unknown"
maintenance = "unknown"
upstream = ""
checked = "2026-10-29"
use_cases = ["vod-ladder"]
surfaces = ["go", "python"]

[encoders.adapter]
