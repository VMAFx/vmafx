[project]
name = "vmaf-roi-score"
version = "0.0.1"
description = "Region-of-interest VMAF score (Option C): saliency-weighted full-frame VMAF combo."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-2-Clause-Patent" }
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]
# Saliency mask materialisation needs onnxruntime + numpy at runtime.
# Kept optional so the smoke tests (which mock subprocess + skip ORT) run
# in a minimal environment.
runtime = ["onnxruntime>=1.27.0", "numpy>=2.5.2"]

[project.scripts]
vmaf-roi-score = "vmafroiscore.cli:main"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmafroiscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Tests legitimately compare to literal expected values.
"tests/*.py" = ["PLR2004"]
