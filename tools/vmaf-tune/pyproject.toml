[project]
name = "vmaf-tune"
version = "0.0.2"
description = "Quality-aware encode automation harness for libvmaf (Phase A: x264 grid corpus)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "EUPL-1.2 AND BSD-2-Clause-Patent"
license-files = ["LICENSES/*"]
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = []

[project.optional-dependencies]
# Everything the test suite imports: `pip install -e ".[dev]"` runs
# tests/ with no failure and no skip for a missing package.
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10",
  "optuna>=5.0.0",
  "matplotlib>=3.10.9",
  "onnxruntime>=1.23",
]
# Phase A.5 fast-path (ADR-0276): proxy + Bayesian + GPU-verify
# recommend. Optuna is the TPE sampler driver; gated behind an extra
# so the core install path stays zero-dep.
fast = ["optuna>=5.0.0"]
# Charts in `vmaf-tune report` (ADR-0498); without matplotlib the report
# renders its tables and a placeholder instead of each chart.
report = ["matplotlib>=3.11.2"]
# ONNX inference: the fast-path proxy, the predictor and the saliency
# models (vmaftune.proxy / predictor / saliency).
onnx = ["onnxruntime>=1.30.0"]
# Predictor training moved to the ai/ training package
# (vmaf_train.predictor_train, ADR-1886): no dependency group of this runtime
# package may name torch (scripts/ci/check-torch-scope.py).

[project.scripts]
vmaf-tune = "vmaftune.cli:main"
vmafx-tune = "vmaftune.cli:main"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.dev/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmaftune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    # Tests >30 s wall (or that exercise real GPUs / containers and may grow
    # past 30 s). Exclude with `pytest -m 'not slow'` for fast iteration.
    # See docs/adr/0908-slow-test-audit-2026-05-30.md.
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately compare to literal expected values; PLR2004 is noise here.
"tests/*.py" = ["PLR2004"]

[tool.ruff.lint]
ignore = [
  # --- Rules that began firing with the ruff 0.15.17 -> 0.16.5 bump. ---
  # Deferred, not silenced: the intent is to keep this gate exactly as strict as
  # it was BEFORE the bump, so a version upgrade does not smuggle in a refactor.
  # None of them flags a defect we know of; a follow-up pass can take them.
  "PLR0917", "BLE001", "S110", "TRY004", "SIM102", "SIM103", "SIM117",
  "PLC0206", "PLR0124", "PLW1510", "DTZ011",
]
