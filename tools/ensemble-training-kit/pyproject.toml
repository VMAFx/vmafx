[project]
name = "vmaf-ensemble-training-kit"
version = "0.1.0"
description = "Portable Phase-A + LOSO retrain bundle for fr_regressor_v2 ensemble (ADR-0324)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "BSD-2-Clause-Patent" }
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
# Subset of ai/pyproject.toml: only the packages the LOSO trainer +
# validator + ONNX exporter actually import. The kit deliberately does
# NOT pull in the full ai/ optional-dependency tree (no optuna / ray /
# matplotlib / lightning) — those are not on the Phase-A retrain path.
dependencies = [
  "torch>=2.13.0,<3.0",
  "onnx>=1.21.0,<2.0",
  "onnxruntime>=1.27.0,<2.0",
  "onnx>=1.22.0,<2.0",
  "onnxruntime>=1.27.0,<2.0",
  "numpy>=2.5.0,<3.0",
  "pandas>=3.0.3,<3.1",
  "scipy>=1.18.0",
  "scikit-learn>=1.9.0",
  "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/ai/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
