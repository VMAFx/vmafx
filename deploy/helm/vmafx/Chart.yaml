apiVersion: v2
name: vmafx
description: >
  VMAFX — perceptual video quality assessment engine with multi-vendor GPU
  support (CUDA / HIP / SYCL / Metal).  Provides an HTTP scoring server
  (Deployment), one-shot batch scoring (Job), and an optional stateful MCP
  server (StatefulSet).
type: application
# Chart packaging version - independently versioned on purpose (ADR-1127,
# reaffirmed by ADR-1151) and NOT a release-please marker. Only appVersion
# below carries x-release-please-version; verify-release-version.sh and
# rollover-changelog-fragments.sh both require exactly one marker per file,
# so annotating this line too would hard-fail every release preflight.
version: 0.1.0
appVersion: "3.2.1" # x-release-please-version
home: https://github.com/VMAFx/vmafx
sources:
  - https://github.com/VMAFx/vmafx
keywords:
  - vmaf
  - video-quality
  - perceptual-metrics
  - gpu
  - cuda
  - sycl
  - hip
maintainers:
  - name: Lusoris
    url: https://github.com/lusoris
annotations:
  artifacthub.io/license: BSD-2-Clause-Patent

dependencies:
  # Optional Prometheus Pushgateway — needed when Jobs push metrics to
  # a central Prometheus instance rather than exposing a scrape endpoint.
  # Disable entirely if you use a scraping Prometheus or another sink.
  - name: prometheus-pushgateway
    version: ">=3.8.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: pushgateway.enabled
    alias: pushgateway
