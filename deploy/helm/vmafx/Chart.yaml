apiVersion: v2
name: vmafx
description: >
  VMAFX — perceptual video quality assessment engine with multi-vendor GPU
  support (CUDA / HIP / SYCL / Vulkan).  Provides an HTTP scoring server
  (Deployment), one-shot batch scoring (Job), and an optional stateful MCP
  server (StatefulSet).
type: application
version: 0.1.0
appVersion: "3.0.0"
home: https://github.com/VMAFx/vmafx
sources:
  - https://github.com/VMAFx/vmafx
keywords:
  - vmaf
  - video-quality
  - perceptual-metrics
  - gpu
  - cuda
  - sycl
  - hip
maintainers:
  - name: Lusoris
    url: https://github.com/lusoris
annotations:
  artifacthub.io/license: BSD-3-Clause-Plus-Patent

dependencies:
  # Optional Prometheus Pushgateway — needed when Jobs push metrics to
  # a central Prometheus instance rather than exposing a scrape endpoint.
  # Disable entirely if you use a scraping Prometheus or another sink.
  - name: prometheus-pushgateway
    version: ">=3.6.1"
    repository: https://prometheus-community.github.io/helm-charts
    condition: pushgateway.enabled
    alias: pushgateway
