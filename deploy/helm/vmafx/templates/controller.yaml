{{- /*
SPDX-License-Identifier: EUPL-1.2
Copyright 2026 Lusoris

deploy/helm/vmafx/templates/controller.yaml
The vmafx-controller workload (ADR-1589): its Deployment, its Service with the
HTTP and gRPC ports the nodes, the operator and the clients use, and with the
sqlite store the queue's PersistentVolumeClaim. controller.store.backend
sqlite: one replica, Recreate, the queue on the claim (ADR-1119). postgres:
controller.replicas pods with a rolling update and no claim, the connection
string from a Secret (ADR-2350; the database and the migration Job are in
controller-database.yaml). The auth settings of auth.* configure this workload
only. Its VMAFX_* environment is vmafx.env.controller (_config.gen.tpl,
generated from api/vmafx-platform.toml, ADR-2350 D13).

ADR-0711: vmafx-controller. ADR-0794: auth gateway. ADR-1519: tenant registry.
*/ -}}
{{- if .Values.controller.enabled }}
{{- $fullName := include "vmafx.fullname" . }}
{{- $claim := .Values.controller.persistence.existingClaim | default (printf "%s-controller-data" $fullName) }}
{{- $postgres := eq (include "vmafx.controllerStoreBackend" .) "postgres" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vmafx.controllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    {{- if $postgres }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # One replica on its own queue: a second pod must never run beside it.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "vmafx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "vmafx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Its own account (ADR-1592): the only one that may read VmafxTenants.
      serviceAccountName: {{ include "vmafx.controllerServiceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "vmafx.controllerTopologySpread" . | nindent 6 }}
      containers:
        - name: vmafx-controller
          image: {{ include "vmafx.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controller.grpcPort }}
              protocol: TCP
          env:
            {{- include "vmafx.env.controller" . }}
            {{- range $k, $v := .Values.controller.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if not $postgres }}
        - name: data
          {{- if .Values.controller.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $claim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    {{- include "vmafx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: {{ .Values.controller.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- if and (not $postgres) .Values.controller.persistence.enabled (not .Values.controller.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.controller.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.controller.persistence.size }}
{{- end }}
{{- end }}
