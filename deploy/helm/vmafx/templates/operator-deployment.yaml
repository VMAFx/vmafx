{{- /*
  SPDX-License-Identifier: EUPL-1.2
  Copyright 2026 Lusoris

  deploy/helm/vmafx/templates/operator-deployment.yaml
  Deployment for the vmafx-operator.

  Rendered only when operator.enabled == true (default false until Stage 2 ships
  the full reconciler logic; set to true when installing the operator).

  ADR-0714: vmafx-operator kubebuilder skeleton + CRDs.
*/ -}}
{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vmafx.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vmafx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "vmafx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        kubectl.kubernetes.io/default-container: operator
    spec:
      serviceAccountName: {{ include "vmafx.serviceAccountName" . }}-operator
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "vmafx.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy | default "IfNotPresent" }}
          env:
            {{- include "vmafx.env.operator" . }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml (.Values.operator.resources | default dict) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with include "vmafx.controllerTokenMount" (dict "token" .Values.operator.controllerToken) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with include "vmafx.controllerTokenVolume" (dict "token" .Values.operator.controllerToken) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}
