{{- /*
  SPDX-License-Identifier: EUPL-1.2
  Copyright 2026 Lusoris

  GENERATED by tools/obsgen from pkg/observability/obsgen; do not edit.
  Regenerate: go run ./tools/obsgen -write

  The alert and recording rules of deploy/prometheus/vmafx-rules.yaml as a
  PrometheusRule, with the SLO objectives, burn-rate windows and alert
  thresholds read from .Values.monitoring.slo, .burnRates and .alerts.
  Rendered with the default values its groups equal that file's.
*/}}
{{- if and $.Values.monitoring.enabled $.Values.monitoring.prometheusRule.enabled }}
{{- $windows := uniq (list $.Values.monitoring.burnRates.fast.longWindow $.Values.monitoring.burnRates.fast.shortWindow $.Values.monitoring.burnRates.slow.longWindow $.Values.monitoring.burnRates.slow.shortWindow) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "vmafx.fullname" . }}
  namespace: {{ .Values.monitoring.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: vmafx.recording
      rules:
        {{- range $w := $windows }}
        - record: vmafx:job_failure_ratio:rate{{ $w }}
          expr: sum(rate(vmafx_controller_jobs_failed_total[{{ $w }}])) / (sum(rate(vmafx_controller_jobs_failed_total[{{ $w }}])) + sum(rate(vmafx_controller_jobs_completed_total[{{ $w }}])))
        {{- end }}
        {{- range $w := $windows }}
        - record: vmafx:score_error_ratio:rate{{ $w }}
          expr: sum(rate(vmafx_server_score_errors_total[{{ $w }}])) / sum(rate(vmafx_server_score_requests_total[{{ $w }}]))
        {{- end }}
        {{- range $w := $windows }}
        - record: vmafx:score_slow_ratio:rate{{ $w }}
          expr: 1 - sum(rate(vmafx_server_score_duration_seconds_bucket{le=~"{{ $.Values.monitoring.slo.scoreLatencySeconds }}(\\.0)?"}[{{ $w }}])) / sum(rate(vmafx_server_score_duration_seconds_count[{{ $w }}]))
        {{- end }}
        - record: vmafx:quality_score:p50_1h
          expr: histogram_quantile(0.5, sum by (tenant, model, le) (rate(vmafx_quality_score_bucket[1h])))
        - record: vmafx:quality_score:count_1h
          expr: sum by (tenant, model) (increase(vmafx_quality_score_count[1h]))
        - record: vmafx:slo_events:rate5m
          expr: (sum by (job, instance) (rate(vmafx_controller_jobs_failed_total[5m])) + sum by (job, instance) (rate(vmafx_controller_jobs_completed_total[5m]))) or sum by (job, instance) (rate(vmafx_controller_jobs_completed_total[5m])) or sum by (job, instance) (rate(vmafx_controller_jobs_failed_total[5m]))
          labels:
            slo: job_success
        - record: vmafx:slo_bad_events:rate5m
          expr: sum by (job, instance) (rate(vmafx_controller_jobs_failed_total[5m]))
          labels:
            slo: job_success
        - record: vmafx:slo_events:rate5m
          expr: sum by (job, instance) (rate(vmafx_server_score_requests_total[5m]))
          labels:
            slo: score_success
        - record: vmafx:slo_bad_events:rate5m
          expr: sum by (job, instance) (rate(vmafx_server_score_errors_total[5m]))
          labels:
            slo: score_success
        - record: vmafx:slo_events:rate5m
          expr: sum by (job, instance) (rate(vmafx_server_score_duration_seconds_count[5m]))
          labels:
            slo: score_latency
        - record: vmafx:slo_bad_events:rate5m
          expr: sum by (job, instance) (rate(vmafx_server_score_duration_seconds_count[5m])) - sum by (job, instance) (rate(vmafx_server_score_duration_seconds_bucket{le=~"{{ $.Values.monitoring.slo.scoreLatencySeconds }}(\\.0)?"}[5m]))
          labels:
            slo: score_latency
        - record: vmafx:slo_objective
          expr: max by (job, instance) (vmafx_build_info) * 0 + {{ $.Values.monitoring.slo.jobSuccess }}
          labels:
            slo: job_success
        - record: vmafx:slo_objective
          expr: max by (job, instance) (vmafx_build_info) * 0 + {{ $.Values.monitoring.slo.scoreSuccess }}
          labels:
            slo: score_success
        - record: vmafx:slo_objective
          expr: max by (job, instance) (vmafx_build_info) * 0 + {{ $.Values.monitoring.slo.scoreLatency }}
          labels:
            slo: score_latency
        - record: vmafx:price_job_second
          expr: (max by (job, instance) (vmafx_build_info) * 0 + {{ $.Values.monitoring.cost.perJobSecond }}) > 0
          labels:
            currency: '{{ $.Values.monitoring.cost.currency }}'
        - record: vmafx:price_job
          expr: (max by (job, instance) (vmafx_build_info) * 0 + {{ $.Values.monitoring.cost.perJob }}) > 0
          labels:
            currency: '{{ $.Values.monitoring.cost.currency }}'
    - name: vmafx.alerts
      rules:
        - alert: VMAFxComponentDown
          expr: up == 0 and on (job, instance) max_over_time(vmafx_build_info[1h])
          for: 5m
          labels:
            severity: critical
          annotations:
            description: Prometheus has not scraped {{`{{ $labels.instance }}`}} ({{`{{ $labels.job }}`}}) for 5 minutes; it served vmafx_build_info within the last hour.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-component-down/
            summary: VMAFx target {{`{{ $labels.instance }}`}} of {{`{{ $labels.job }}`}} is down.
        - alert: VMAFxNoLiveNodes
          expr: max(vmafx_controller_nodes_live) == 0 and on () sum(vmafx_controller_jobs_pending) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            description: The controller has pending jobs and no live node for 10 minutes; nothing can run them.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-no-live-nodes/
            summary: Jobs are waiting and no vmafx-node is registered with the controller.
        - alert: VMAFxQueueAging
          expr: max by (tenant) (vmafx_controller_queue_oldest_job_age_seconds) > {{ $.Values.monitoring.alerts.queueAgeSeconds | int }}
          for: 15m
          labels:
            severity: warning
          annotations:
            description: 'The oldest pending job of tenant {{`{{ $labels.tenant }}`}} has waited more than {{ $.Values.monitoring.alerts.queueAgeSeconds | int }} seconds for 15 minutes: no node takes its work.'
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-queue-aging/
            summary: Jobs of tenant {{`{{ $labels.tenant }}`}} wait longer than {{ $.Values.monitoring.alerts.queueAgeSeconds | int }} seconds.
        - alert: VMAFxJobErrorBudgetBurn
          expr: vmafx:job_failure_ratio:rate{{ $.Values.monitoring.burnRates.fast.longWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.jobSuccess }})) and vmafx:job_failure_ratio:rate{{ $.Values.monitoring.burnRates.fast.shortWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.jobSuccess }}))
          for: '{{ $.Values.monitoring.burnRates.fast.for }}'
          labels:
            severity: critical
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.fast.longWindow }} and {{ $.Values.monitoring.burnRates.fast.shortWindow }} the controller job failure ratio exceeded {{ $.Values.monitoring.burnRates.fast.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.jobSuccess }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-job-error-budget-burn/
            summary: Controller job failure is spending the error budget {{ $.Values.monitoring.burnRates.fast.factor }} times faster than the SLO allows.
        - alert: VMAFxJobErrorBudgetBurn
          expr: vmafx:job_failure_ratio:rate{{ $.Values.monitoring.burnRates.slow.longWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.jobSuccess }})) and vmafx:job_failure_ratio:rate{{ $.Values.monitoring.burnRates.slow.shortWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.jobSuccess }}))
          for: '{{ $.Values.monitoring.burnRates.slow.for }}'
          labels:
            severity: warning
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.slow.longWindow }} and {{ $.Values.monitoring.burnRates.slow.shortWindow }} the controller job failure ratio exceeded {{ $.Values.monitoring.burnRates.slow.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.jobSuccess }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-job-error-budget-burn/
            summary: Controller job failure is spending the error budget {{ $.Values.monitoring.burnRates.slow.factor }} times faster than the SLO allows.
        - alert: VMAFxScoreErrorBudgetBurn
          expr: vmafx:score_error_ratio:rate{{ $.Values.monitoring.burnRates.fast.longWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.scoreSuccess }})) and vmafx:score_error_ratio:rate{{ $.Values.monitoring.burnRates.fast.shortWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.scoreSuccess }}))
          for: '{{ $.Values.monitoring.burnRates.fast.for }}'
          labels:
            severity: critical
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.fast.longWindow }} and {{ $.Values.monitoring.burnRates.fast.shortWindow }} the score request error ratio exceeded {{ $.Values.monitoring.burnRates.fast.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.scoreSuccess }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-score-error-budget-burn/
            summary: Score request error is spending the error budget {{ $.Values.monitoring.burnRates.fast.factor }} times faster than the SLO allows.
        - alert: VMAFxScoreErrorBudgetBurn
          expr: vmafx:score_error_ratio:rate{{ $.Values.monitoring.burnRates.slow.longWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.scoreSuccess }})) and vmafx:score_error_ratio:rate{{ $.Values.monitoring.burnRates.slow.shortWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.scoreSuccess }}))
          for: '{{ $.Values.monitoring.burnRates.slow.for }}'
          labels:
            severity: warning
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.slow.longWindow }} and {{ $.Values.monitoring.burnRates.slow.shortWindow }} the score request error ratio exceeded {{ $.Values.monitoring.burnRates.slow.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.scoreSuccess }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-score-error-budget-burn/
            summary: Score request error is spending the error budget {{ $.Values.monitoring.burnRates.slow.factor }} times faster than the SLO allows.
        - alert: VMAFxScoreLatencyBudgetBurn
          expr: vmafx:score_slow_ratio:rate{{ $.Values.monitoring.burnRates.fast.longWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.scoreLatency }})) and vmafx:score_slow_ratio:rate{{ $.Values.monitoring.burnRates.fast.shortWindow }} > ({{ $.Values.monitoring.burnRates.fast.factor }} * (1 - {{ $.Values.monitoring.slo.scoreLatency }}))
          for: '{{ $.Values.monitoring.burnRates.fast.for }}'
          labels:
            severity: critical
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.fast.longWindow }} and {{ $.Values.monitoring.burnRates.fast.shortWindow }} the slow score request ratio exceeded {{ $.Values.monitoring.burnRates.fast.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.scoreLatency }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-score-latency-budget-burn/
            summary: Slow Score request is spending the error budget {{ $.Values.monitoring.burnRates.fast.factor }} times faster than the SLO allows.
        - alert: VMAFxScoreLatencyBudgetBurn
          expr: vmafx:score_slow_ratio:rate{{ $.Values.monitoring.burnRates.slow.longWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.scoreLatency }})) and vmafx:score_slow_ratio:rate{{ $.Values.monitoring.burnRates.slow.shortWindow }} > ({{ $.Values.monitoring.burnRates.slow.factor }} * (1 - {{ $.Values.monitoring.slo.scoreLatency }}))
          for: '{{ $.Values.monitoring.burnRates.slow.for }}'
          labels:
            severity: warning
          annotations:
            description: Over the last {{ $.Values.monitoring.burnRates.slow.longWindow }} and {{ $.Values.monitoring.burnRates.slow.shortWindow }} the slow score request ratio exceeded {{ $.Values.monitoring.burnRates.slow.factor }} times the error budget of the objective {{ $.Values.monitoring.slo.scoreLatency }}.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-score-latency-budget-burn/
            summary: Slow Score request is spending the error budget {{ $.Values.monitoring.burnRates.slow.factor }} times faster than the SLO allows.
        - alert: VMAFxScoreRegression
          expr: vmafx:quality_score:p50_1h < quantile_over_time(0.5, vmafx:quality_score:p50_1h[1d] offset 1h) - {{ $.Values.monitoring.alerts.scoreRegressionPoints }} and vmafx:quality_score:count_1h >= {{ $.Values.monitoring.alerts.scoreRegressionMinScores | int }}
          for: 1h
          labels:
            severity: warning
          annotations:
            description: For an hour the median pooled score of tenant {{`{{ $labels.tenant }}`}} on model {{`{{ $labels.model }}`}} has been more than {{ $.Values.monitoring.alerts.scoreRegressionPoints }} points below the median of the previous day's hourly medians.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-score-regression/
            summary: Median score of {{`{{ $labels.model }}`}} for tenant {{`{{ $labels.tenant }}`}} dropped.
        - alert: VMAFxMetricsReadErrors
          expr: sum by (job, instance, source) (rate(vmafx_metrics_read_errors_total[10m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            description: Every scrape of {{`{{ $labels.instance }}`}} ({{`{{ $labels.job }}`}}) for 15 minutes failed to read {{`{{ $labels.source }}`}}; those series are missing from its /metrics page.
            runbook_url: https://vmafx.dev/observability/runbooks/vmafx-metrics-read-errors/
            summary: '{{`{{ $labels.instance }}`}} cannot read its {{`{{ $labels.source }}`}} metrics.'
{{- end }}
