{{- /*
  SPDX-License-Identifier: EUPL-1.2
  Copyright 2026 Lusoris

  Prometheus operator monitors, one per component that is deployed and
  switched on in monitoring.components: a ServiceMonitor on the server,
  controller and node Services and a PodMonitor on the operator pods (the
  operator has no Service). All share the scrape settings of
  monitoring.serviceMonitor. The server's keeps the release's full name, as
  before the other components had monitors. ADR-2349;
  docs/observability/kubernetes.md.
*/ -}}
{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor }}
{{- $fullName := include "vmafx.fullname" . }}
{{- $on := .Values.monitoring.components }}
{{- if $on.server }}
---
{{ include "vmafx.monitor" (dict "root" . "kind" "ServiceMonitor" "name" $fullName "component" "server" "port" "http") }}
{{- end }}
{{- if and $on.controller .Values.controller.enabled }}
---
{{ include "vmafx.monitor" (dict "root" . "kind" "ServiceMonitor" "name" (printf "%s-controller" $fullName) "component" "controller" "port" "http") }}
{{- end }}
{{- if and $on.node .Values.node.enabled }}
---
{{ include "vmafx.monitor" (dict "root" . "kind" "ServiceMonitor" "name" (printf "%s-node" $fullName) "component" "node" "port" "metrics") }}
{{- end }}
{{- if and $on.operator .Values.operator.enabled }}
---
{{ include "vmafx.monitor" (dict "root" . "kind" "PodMonitor" "name" (printf "%s-operator" $fullName) "component" "operator" "port" "metrics") }}
{{- end }}
{{- end }}
