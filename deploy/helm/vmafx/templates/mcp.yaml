{{- /*
  SPDX-License-Identifier: EUPL-1.2
  Copyright 2026 Lusoris

  deploy/helm/vmafx/templates/mcp.yaml
  Deployment and Service for vmafx-mcp, the MCP server that drives the
  controller's Client API over streamable HTTP.

  Rendered only when mcp.enabled == true (default false). The container runs
  the vmafx-node image (every node variant ships /usr/local/bin/vmafx-mcp)
  with the command vmafx-mcp unless mcp.image.repository names another image.
  templates/mcp-validate.yaml refuses mcp.enabled without auth.
*/ -}}
{{- if .Values.mcp.enabled }}
{{- $fullName := include "vmafx.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "vmafx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "vmafx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
      annotations:
        kubectl.kubernetes.io/default-container: mcp
    spec:
      serviceAccountName: {{ include "vmafx.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          image: {{ include "vmafx.mcpImage" . | quote }}
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy | default "IfNotPresent" }}
          command: ["vmafx-mcp"]
          env:
            {{- include "vmafx.env.mcp" . }}
          ports:
            - name: mcp-http
              containerPort: {{ .Values.mcp.httpPort }}
              protocol: TCP
          # vmafx-mcp serves no health path; a TCP probe checks the listener.
          livenessProbe:
            tcpSocket:
              port: mcp-http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mcp-http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    {{- include "vmafx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  ports:
    - name: mcp-http
      port: {{ .Values.mcp.httpPort }}
      targetPort: mcp-http
      protocol: TCP
{{- end }}
