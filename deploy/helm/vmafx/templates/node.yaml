{{- /*
  templates/node.yaml — vmafx-node worker pool Deployment.

  This template deploys the vmafx-node Go worker pool.  It is independent
  of the main vmafx-controller Deployment (templates/deployment.yaml) and
  is enabled via .Values.node.enabled.

  GPU vendor → Kubernetes resource mapping:
    nvidia  → nvidia.com/gpu          (requires nvidia-device-plugin DaemonSet)
    amd     → amd.com/gpu             (requires amdgpu-device-plugin DaemonSet)
    intel   → gpu.intel.com/i915      (requires intel-gpu-plugin DaemonSet)
    cpu     → (no GPU resource requested)

  ADR-0709: Phase 4b distributed platform umbrella.
  ADR-0713: vmafx-node Go worker binary.
  ADR-0719: rclone integration for remote asset resolution.

  Note: this template superseded the legacy templates/node-deployment.yaml,
  which rendered a duplicate Deployment under the same name and blocked
  `helm install`.  The rclone Secret mount + storage-mode / model-dir env
  vars from that template have been folded in here.  The legacy template
  used VMAFX_NODE_NAME; this one uses VMAFX_NODE_ID per ADR-0713.

  See: docs/development/node.md, docs/development/gpu-scheduling.md.
*/}}
{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vmafx.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  replicas: {{ .Values.node.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vmafx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "vmafx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vmafx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.node.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node.tolerations }}
      tolerations:
        {{- toYaml .Values.node.tolerations | nindent 8 }}
      {{- else if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: vmafx-node
          image: {{ include "vmafx.nodeImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: VMAFX_CONTROLLER_ADDR
              value: {{ include "vmafx.controllerAddr" . | quote }}
            - name: VMAFX_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VMAFX_BACKEND
              value: {{ include "vmafx.backendEnvValue" . | quote }}
            # Storage / scoring env vars folded in from the legacy
            # templates/node-deployment.yaml (ADR-0719 rclone integration).
            - name: VMAFX_STORAGE_MODE
              value: {{ .Values.storage.mode | default "http-serve" | quote }}
            - name: VMAFX_RCLONE_CONFIG
              value: "/etc/vmafx/rclone.conf"
            - name: VMAFX_VMAF_BINARY
              value: "/usr/local/bin/vmaf"
            - name: VMAFX_MODEL_DIR
              value: {{ .Values.persistence.models.mountPath | default "/usr/local/share/vmafx/model" | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range .Values.envFrom }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          resources:
            {{- $nodeResources := .Values.node.resources | default .Values.resources }}
            limits:
              {{- toYaml $nodeResources.limits | nindent 14 }}
              {{- if and .Values.gpu.enabled (ne .Values.gpu.vendor "cpu") }}
              {{- include "vmafx.gpuResourceKey" . | nindent 14 }}: {{ .Values.gpu.count | default 1 }}
              {{- end }}
            requests:
              {{- toYaml $nodeResources.requests | nindent 14 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.rclone.config }}
            - name: rclone-config
              mountPath: /etc/vmafx
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.models.enabled }}
            - name: models
              mountPath: {{ .Values.persistence.models.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.node.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.storage.rclone.config }}
        - name: rclone-config
          secret:
            secretName: {{ include "vmafx.fullname" . }}-rclone-config
            defaultMode: 0400
        {{- end }}
        {{- if .Values.persistence.models.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "vmafx.fullname" . }}-models
            readOnly: true
        {{- end }}
        {{- with .Values.node.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vmafx.fullname" . }}-node-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  type: ClusterIP
  selector:
    {{- include "vmafx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
{{- end }}
