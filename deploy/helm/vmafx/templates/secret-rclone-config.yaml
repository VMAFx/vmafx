{{- if .Values.storage.rclone.config }}
# SPDX-License-Identifier: BSD-3-Clause-Plus-Patent
# Copyright 2026 Lusoris
#
# templates/secret-rclone-config.yaml — rclone configuration Secret.
#
# This Secret is mounted read-only at /etc/vmafx/rclone.conf inside the
# vmafx-node container.  It contains the rclone remote definitions (S3, GCS,
# Azure Blob, SFTP, etc.) with their credentials.
#
# Provide the rclone.conf contents via values.yaml storage.rclone.config.
# Example (values.yaml):
#
#   storage:
#     rclone:
#       config: |
#         [s3-prod]
#         type = s3
#         provider = AWS
#         region = us-east-1
#         access_key_id = AKIAIOSFODNN7EXAMPLE
#         secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#
# For production deployments, pass the config via --set-file or a sealed
# secret; never commit credentials to values files in source control.
#
# ADR-0719: vmafx-node rclone integration.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vmafx.fullname" . }}-rclone-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
  annotations:
    # The Secret contains rclone remote credentials.  Rotate via:
    #   helm upgrade --set-file storage.rclone.config=./new-rclone.conf
    "vmafx.io/secret-type": "rclone-config"
type: Opaque
stringData:
  rclone.conf: |
    {{ .Values.storage.rclone.config | nindent 4 }}
{{- end }}
