{{- /*
  SPDX-License-Identifier: EUPL-1.2
  Copyright 2026 Lusoris

  deploy/helm/vmafx/templates/operator-rbac.yaml
  RBAC resources for the vmafx-operator.

  Rendered only when operator.enabled == true.

  Split into three bindings per the principle of least privilege:
  1. ClusterRole + ClusterRoleBinding — CRD access only (vmafxjobs,
     vmafxnodes, vmafxmodeltrainings; not vmafxtenants, ADR-1592).  CRDs are cluster-scoped
     resources and require a ClusterRole to watch across namespaces.
  2. ClusterRole + ClusterRoleBinding — create and patch events, nothing else
     (ADR-2647).  The operator reconciles its resources in every namespace and
     the API server stores an event in the namespace of the object it is
     about, so event creation must reach every namespace the CRD access does.
  3. Role + RoleBinding (namespace-scoped) — pods and leader-election leases.
     Restricting them to the release namespace prevents the operator from
     touching pods in other namespaces on multi-tenant clusters.

  ADR-0714: vmafx-operator kubebuilder skeleton + CRDs.
  ADR-1058: Helm chart security hardening — RBAC split ClusterRole → Role for
  namespaced resources, VmafxTenant rules added.
  ADR-2647: events move to their own cluster-wide, write-only ClusterRole.
*/ -}}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vmafx.serviceAccountName" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator

# ---------------------------------------------------------------------------
# ClusterRole: CRD access (cluster-scoped resources)
# VmafxJob, VmafxNode and VmafxModelTraining are the CRD objects the operator
# reconciles across all instances (VmafxTenant is the controller's, ADR-1592).
# ---------------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-crds
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # VmafxJob CRD
  - apiGroups: [vmafx.dev]
    resources: [vmafxjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [vmafx.dev]
    resources: [vmafxjobs/status]
    verbs: [get, update, patch]
  - apiGroups: [vmafx.dev]
    resources: [vmafxjobs/finalizers]
    verbs: [update]
  # VmafxNode CRD
  - apiGroups: [vmafx.dev]
    resources: [vmafxnodes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [vmafx.dev]
    resources: [vmafxnodes/status]
    verbs: [get, update, patch]
  - apiGroups: [vmafx.dev]
    resources: [vmafxnodes/finalizers]
    verbs: [update]
  # VmafxModelTraining CRD
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings/status]
    verbs: [get, update, patch]
  - apiGroups: [vmafx.dev]
    resources: [vmafxmodeltrainings/finalizers]
    verbs: [update]
  # No VmafxTenant rule: the operator has no tenant reconciler; only the
  # controller's own service account reads VmafxTenants (ADR-1592, which
  # replaces ADR-1058's tenant rule).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-crds-binding
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vmafx.fullname" . }}-operator-crds
subjects:
  - kind: ServiceAccount
    name: {{ include "vmafx.serviceAccountName" . }}-operator
    namespace: {{ .Release.Namespace }}

# ---------------------------------------------------------------------------
# ClusterRole: events (ADR-2647)
# The VmafxModelTraining reconciler and leader election record events. An event
# lives in the namespace of the object it describes, and the operator
# reconciles objects in every namespace, so the grant is cluster-wide. It is
# write-only: create and patch (client-go's recorder creates an event, then
# patches its count); no get, list, watch, update or delete.
# ---------------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-events
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-events-binding
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vmafx.fullname" . }}-operator-events
subjects:
  - kind: ServiceAccount
    name: {{ include "vmafx.serviceAccountName" . }}-operator
    namespace: {{ .Release.Namespace }}

# ---------------------------------------------------------------------------
# Role: namespaced resources (pods, leader-election leases)
# Scoped to the release namespace — the operator must not create/delete pods
# in other namespaces on a shared cluster.
# ---------------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-ns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # Worker Pods (namespace-scoped)
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]
  # Leader election (namespace-scoped in coordination.k8s.io)
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vmafx.fullname" . }}-operator-ns-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vmafx.fullname" . }}-operator-ns
subjects:
  - kind: ServiceAccount
    name: {{ include "vmafx.serviceAccountName" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
