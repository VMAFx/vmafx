#
# Prometheus of the Compose example: scrapes every VMAFx component and loads
# the rule file the rules service renders from monitoring-values.yaml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/vmafx-rules.yaml

scrape_configs:
  - job_name: vmafx-server
    static_configs:
      - targets: ["vmafx-server:8080"]
  - job_name: vmafx-controller
    static_configs:
      - targets: ["vmafx-controller:8080"]
  - job_name: vmafx-node
    static_configs:
      - targets: ["vmafx-node:9090"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
