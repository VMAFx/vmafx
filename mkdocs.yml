site_name: "VMAFx"
site_url: https://vmafx.github.io/vmafx/
site_description: Perceptual video quality assessment with GPU/SIMD acceleration.
repo_url: https://github.com/VMAFx/vmafx
repo_name: VMAFx/vmafx
edit_uri: edit/master/docs/
copyright: 'Fork-authored files EUPL-1.2, files inherited from Netflix BSD-2-Clause-Patent: each file''s SPDX header decides (ADR-1250). <a href="https://vmafx.github.io/vmafx/licensing/">Licensing</a> · <a href="https://github.com/VMAFx/vmafx/blob/master/LICENSE">LICENSE</a> (EUPL-1.2) · <a href="https://github.com/VMAFx/vmafx/blob/master/NOTICE">NOTICE</a> · <a href="https://github.com/VMAFx/vmafx/tree/master/LICENSES">LICENSES/</a>'

docs_dir: docs
site_dir: build-docs/site

# ADR-0221 fragment files are concatenation source (assembled into
# `docs/adr/README.md` by `scripts/docs/concat-adr-index.sh`) — they are
# never rendered as standalone pages, so exclude them from the site build.
# Same for changelog fragments under `changelog.d/` (which live in repo
# root, not docs/, but listed here defensively if a future reorg moves
# them under docs/). One fragment was placed under docs/changelog.d/ and
# is explicitly excluded here. `/figures/` holds the figure specs that
# tools/figures/ renders (ADR-1508); the specs are sources, not pages. The
# patterns avoid `**`, which tools/figures/build.mjs sources does not parse.
exclude_docs: |
  adr/_index_fragments/*
  /changelog.d/
  /figures/

theme:
  name: material
  # Colours and fonts come from docs/stylesheets/vmafx.css (ADR-1508):
  # `custom` hands the primary and accent colours to the stylesheet, and
  # `font: false` stops the runtime font download from Google Fonts; the
  # stylesheet serves Inter and JetBrains Mono from docs/assets/fonts/.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Applies the front matter of each directory's .meta.yml to its pages;
  # ADR-1512 uses it to keep record bodies out of the search index.
  - material/meta
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list
  - footnotes

validation:
  # Strict gate: `mkdocs build --strict` (run by .github/workflows/docs.yml)
  # fails on any WARNING. The validation table below decides which
  # categories are actionable enough to fail the build vs. which stay at
  # INFO because fixing them is blocked by an existing fork policy.
  #
  # Carve-outs and rationale:
  # - links.not_found: info — Two unfixable populations dominate this class:
  #   (a) intentional pointers from docs to source-tree files
  #   (`../../core/src/...`, `../../scripts/ci/...`,
  #   `../../.github/workflows/...`) that exist for grep-ability and
  #   GitHub-rendered navigation but cannot be resolved by mkdocs because
  #   they sit outside `docs_dir`; (b) cross-references between ADRs whose
  #   target slug has been renamed (ADR bodies are immutable once Accepted
  #   per ADR-0028 / ADR-0106, so the broken side cannot be edited). Until
  #   one of those policies changes, escalating this to `warn` is a
  #   permanent --strict failure that no PR can clear. Tracked at INFO so
  #   the log still surfaces them for opportunistic cleanup in `README.md`
  #   and other non-frozen surfaces.
  # - links.anchors: warn — actionable; in-doc anchor typos.
  # - links.unrecognized_links: info — same population shape as not_found:
  #   the dominant unrecognized form is a relative pointer to a directory
  #   in the source tree (`../../core/src/feature/iqa/`,
  #   `../../tools/vmaf-tune/`, `../../mcp-server/vmaf-mcp/`), kept for
  #   GitHub-rendered navigation and grep-ability. mkdocs cannot resolve
  #   them because they sit outside `docs_dir` and lack an `index.md`.
  #   The non-source-tree subset (bare dir-style links like
  #   `backends/` -> `backends/index.md`) was swept once on the
  #   ADR-0221-strict-gate PR; future occurrences are caught at INFO and
  #   tidied opportunistically.
  # - nav.omitted_files: info — topic pages may use parent-index navigation,
  #   and ADR pages are reached from the ADR and tag indexes (ADR-1510).
  #   ADR coverage is checked separately by make docs-fragments-check.
  # - nav.not_found: warn — catches typos in mkdocs.yml `nav:` entries.
  nav:
    # ADR and ADR tag pages are reached from the ADR index and the tag index,
    # not the sidebar (ADR-1510). Research and topic pages may instead be
    # linked from their parent index; ADR coverage is checked by
    # make docs-fragments-check.
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info

# Renders each `figure` fence from docs/figures/ (tools/figures/, ADR-1508)
# and publishes the figure stylesheet and player; diagrams use no Mermaid.
hooks:
  - tools/figures/mkdocs_hook.py

extra_css:
  - stylesheets/vmafx.css

# Mounts the interactive charts; loads the Vega bundle only on a page with a
# chart (ADR-1508, scripts/docs/generate-charts.py).
extra_javascript:
  - javascripts/charts.js

