[build-system]
requires = ["setuptools", "wheel", "Cython", "numpy"]

[project]
name = "vmaf"
# Version is read dynamically from compat/python-vmaf/__init__.__version__
dynamic = ["version"]
description = "VMAF — Video Multimethod Assessment Fusion (Lusoris fork)"
readme = "README.rst"
license = { text = "BSD-2-Clause-Patent" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scikit-image>=0.26.0",
    "h5py>=3.16.0",
    "sureal>=0.9.0",
    "dill>=0.4.1",
    "PyWavelets>=1.9.0",
    "python-slugify>=8.0.4",
    "libsvm-official>=3.37",
    "defusedxml>=0.7.1",
]
