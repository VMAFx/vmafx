[project.urls]
Homepage = "https://github.com/Netflix/vmaf"

# Moved here from setup.py's `entry_points={"console_scripts": [...]}`.
# setuptools treats a `[project]` table as authoritative: anything setup.py
# passes that `[project]` neither declares nor lists as `dynamic` raises
# `_MissingDynamic`, and on the Coverage Gate runner that is fatal, not a
# warning — `python3 setup.py --version` exited 1 with
# "`authors` defined outside of `pyproject.toml`". Same eight names, same
# targets, so the generated console scripts are unchanged.
[project.scripts]
run_cleaning_cache = "vmaf.script.run_cleaning_cache:main"
run_psnr = "vmaf.script.run_psnr:main"
run_result_assembly = "vmaf.script.run_result_assembly:main"
run_testing = "vmaf.script.run_testing:main"
run_toddnoiseclassifier = "vmaf.script.run_toddnoiseclassifier:main"
run_vmaf = "vmaf.script.run_vmaf:main"
run_vmaf_cross_validation = "vmaf.script.run_vmaf_cross_validation:main"
run_vmaf_training = "vmaf.script.run_vmaf_training:main"

[build-system]
# setuptools>=77.0.1 is a hard floor, not a preference: `[project].license`
# below is a PEP 639 SPDX expression (a bare string). setuptools only
# learned that form in 77.0.0 (yanked; 77.0.1 is the first installable
# release), and every earlier release rejects it outright --
# `configuration error: project.license must be valid exactly by one
# definition` -- so `setup.py` aborts before it can report a version.
# Ubuntu 24.04 still ships setuptools 68.1.2, and `pip install --user`
# does not upgrade it, which is exactly how the Coverage Gate hit this.
# packaging>=24.2 travels with that floor. setuptools>=77 validates the SPDX
# expression through `packaging.licenses`, which only exists from 24.2, and
# when it is missing `dist._finalize_license_expression()` raises
# `ImportError: Cannot import \`packaging.licenses\`` and setup.py exits 1 --
# the same failure the setuptools floor was meant to end, one layer down.
# The floors are now higher for security: setuptools 83.0.0 fixes
# PYSEC-2025-49 and PYSEC-2026-3447, and wheel 0.46.2 fixes PYSEC-2026-2047.
# The hash-locked build inputs already pin setuptools 84.0.0 and wheel 0.48.0.
requires = ["setuptools>=83.0.0", "packaging>=24.2", "wheel>=0.46.2", "Cython", "numpy>=2.5.3"]

[project]
name = "vmaf"
# Version is read dynamically from compat/python-vmaf/__init__.__version__
dynamic = ["version"]
description = "VMAF — Video Multimethod Assessment Fusion (VMAFx fork)"
readme = "README.rst"
authors = [{ name = "Zhi Li", email = "zli@netflix.com" }]
license = "BSD-2-Clause-Patent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "scikit-image>=0.26.0",
    "h5py>=3.16.0",
    "sureal>=0.9.0",
    "dill>=0.4.1",
    "PyWavelets>=1.10.0",
    "python-slugify>=9.1.1",
    "libsvm-official>=3.37",
    "defusedxml>=0.7.1",
]
