[tox]
envlist = py314, coverage


[testenv]
passenv = APPVEYOR*
          CI
          SSL_CERT_FILE
          TEST_MARKER
          TRAVIS*
          PATH
          CC
          CXX
          CFLAGS
          CXXFLAGS
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
skip_install = True
deps =
    --require-hashes
    -r{toxinidir}/requirements-test-lock.txt
commands_pre =
    python -m pip install --no-deps --no-build-isolation -e {toxinidir}
# --ignore=vmaf/resource: pytest --doctest-modules tries to import every .py
# under the rootdir to scan for docstrings. Files under vmaf/resource/ are
# config / parameter-dict data files, not real modules — and several have
# dots in their stems (e.g. vmaf_v7.2_bootstrap.py) that make them
# unimportable as Python modules. None of them carry doctests, so excluding
# the directory is correct rather than a workaround.
commands = pytest {posargs:-vv -m {env:TEST_MARKER:main} --doctest-modules --ignore=vmaf/resource --cov-report term-missing --cov=vmaf/}


[testenv:coverage]
depends = py314
passenv = {[testenv]passenv}
setenv = COVERAGE_FILE={toxworkdir}/.coverage
basepython = python
skip_install = True
deps =
    --require-hashes
    -r{toxinidir}/requirements-coverage-lock.txt
commands = coverage combine
           coverage report -m
           coverage xml -o "{toxworkdir}/coverage.xml"
           coverage html -d "{toxworkdir}/coverage"

# The 'venv*' sections are a handy way of creating a venv for local development (with python3 or python2)
[testenv:venv]
basepython = python3
envdir = .venv
skip_install = True
deps =
    --require-hashes
    -r{toxinidir}/requirements-test-lock.txt
commands_pre =
    python -m pip install --no-deps --no-build-isolation -e {toxinidir}
commands = python --version

# Configuration
[pytest]
cache_dir = .tox/.cache
python_files = *test.py
filterwarnings = error
markers =
    main: Main tests

[coverage:run]
source = vmaf
