#
# Lines a lane brief for this repository must contain before the lane
# launcher starts a job (ADR-3553). The launcher's reader (brief_stage.py in
# the praetor repository) reads this file from the job's worktree:
# - top-level keys: required (every brief), required_by_stage (keyed by
#   impl, fix, review, audit or research) and credential_stub_tests;
# - each list holds at most 32 strings of 1 to 200 characters;
# - a brief's stage comes from the first `task:` line in its first 20
#   lines, mapped through the router's task labels;
# - the match is a plain substring match on the brief text;
# - rc 1 lists each missing line; rc 2 means an invalid file or a brief
#   whose stage cannot be resolved (no `task:` line, unknown label).
# scripts/ci/tests/test_lane_brief_config.py checks the shape and replays
# planted briefs against the reader.
---
required_by_stage:
  # A fix without a mypy command reached the pre-push gate with type errors.
  fix:
    - "mypy --no-site-packages --disable-error-code=import-not-found"
  # A review job that leaves any path in the worktree ends with rc 79 (lane
  # guard in agy-job.sh), so a review brief must forbid worktree output and
  # ask for the report in the final message.
  review:
    - "Write nothing in the worktree"
    - "return: final message only"
    # A review missed tests still matching a changed command literal.
    - "grep the test tree for each changed literal"
    # A review missed a build option's missing header package and unwanted link.
    - "build-option change: meson setup"
