# Declared exceptions to CodeQL's cpp/large-parameter (code-scanning alerts 1545, 1546 and 1547):
# the three definitions that must have the signature of libvmaf's vmaf_picture_wrap(), which takes
# its 80-byte VmafPictureWrapped by value. Format and rules: scripts/ci/lint_exceptions.py.
# ADR-1142 binds every file; an exception names one file and ends. Every other function the rule
# reads takes a large structure by pointer.

[[exception]]
path = "core/src/compat/libvmaf/picture.c"
reason = "vmaf_picture_wrap(VmafPicture *, VmafPictureWrapped) is the public signature of upstream libvmaf (include/libvmaf/picture.h), and libvmaf.so.3 keeps that library's source and binary interface (ADR-2094, HISS-14): a pointer parameter would break every caller. Fix: none while the compat library carries the libvmaf interface; the VMAFx successor, vmafx_frame_wrap_host(), takes pointers."
expires = 2027-06-30

[[exception]]
path = "core/src/picture.c"
reason = "The engine's body of vmaf_picture_wrap() is declared by the same public header as the compat library's and renamed by core/src/vmafx/engine_names_gen.h (ADR-2094), so it has upstream libvmaf's by-value VmafPictureWrapped parameter by construction. Fix: none while the public header declares the engine's bodies."
expires = 2027-06-30

[[exception]]
path = "core/test/compat_conformance_table_gen.c"
reason = "Generated by scripts/codegen/vmafx-api.py: the conformance table holds a thunk of the exact type of each libvmaf function, so the thunk of vmaf_picture_wrap() takes VmafPictureWrapped by value as that function does. Fix: none while vmaf_picture_wrap() is a compat function."
expires = 2027-06-30
