[[exception]]
path = "core/src/feature/metal/float_adm.metal"
reason = "Metal Shading Language kernel. clang-tidy reads the languages the clang front end accepts; clang has no Metal language mode (`clang -x metal` answers \"language not recognized\" on clang 23.1.1, and the -x language list in https://clang.llvm.org/docs/ClangCommandLineReference.html names none; clang-tidy, https://clang.llvm.org/extra/clang-tidy/, runs on that front end). The kernels are compiled by Apple's `metal` compiler (-std=metal3.1) in the macOS Metal build leg and their arithmetic headers are held against the CPU by the device-free host-replay tests. Revisit when upstream clang gains a Metal mode."
expires = 2027-03-31

