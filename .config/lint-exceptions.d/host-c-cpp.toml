# The host C and C++ files that stay in the tree under ADR-2478 (Rust core migration): one
# entry per file, with the owner, the re-evaluation trigger and the category the ADR's
# exception list names. Format and rules: scripts/ci/lint_exceptions.py.

[[exception]]
path = "core/include/libvmaf/pelorus/deband.h"
reason = "Byte-identical ABI mirror of VMAFx/pelorus (ADR-1113), listed in scripts/ci/pelorus-mirror-paths.txt and kept identical by scripts/sync-pelorus-interop.sh; it stays host C until pelorus ships the interop surface as a Rust crate. Owner: pelorus. Category A: the interval is this entry's own, the vmafx 3.0 release; the date below is the list's 400-day cap and is renewed by re-review until 3.0."
owner = "pelorus"
trigger = "pelorus 2.1 releases the interop surface as a Rust crate"
category = "A"
expires = 2027-11-20

