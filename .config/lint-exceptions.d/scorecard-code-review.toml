# Declared exception to OpenSSF Scorecard's Code-Review check (code-scanning alert 1,
# 0 of 18 changesets approved). Format and rules: scripts/ci/lint_exceptions.py. The path
# is the file that owns the review policy; ADR-2126 gives the decision.

[[exception]]
path = ".github/CODEOWNERS"
reason = "Single maintainer: every change lands through the local merge train, whose per-PR gates (deliverables, state-row, silent-revert, praetorctl audit) and the required status checks on the exact head stand in for a human review, and a second approver does not exist (ADR-2126). Fix: a second maintainer joins, then the repository requires and records a human approval; renew only while the reason is true."
expires = 2027-03-31
