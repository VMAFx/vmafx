# Dated fallbacks of the hosted runner label rule (ADR-3251): jobs that name an older
# versioned Ubuntu image. Format and rules: scripts/ci/check_hosted_runner_labels.py and
# scripts/ci/lint_exceptions.py. One entry per job of a workflow file; an entry stops holding
# on `expires` and is removed when its job names ubuntu-26.04 again. Remove the file with
# its last entry.

[[exception]]
path = ".github/workflows/ffmpeg-integration.yml"
job = "ffmpeg-work"
label = "ubuntu-24.04"
reason = "With the gcc of ubuntu-26.04 the FFmpeg build prints warnings in FFmpeg's own sources (-Wstringop-overflow in libavcodec/vvc/intra_template.c, redefined av_popcount in libavutil/x86/intmath.h) and the zero-warning gate stops it (master run 38153817985, job 114512707088); the fixes belong to the shared FFmpeg fix series. Re-reviewed 2026-10-19: no patch of fix series v0.2.0 (pinned) or v0.3.0 (latest) touches libavcodec/vvc/intra_template.c or libavutil/x86/intmath.h, so the warnings stand. Exception category C (10 days). docs/state.md row T-CI-FFMPEG-WARNINGS-UBUNTU-2604-2026-10-11."
expires = 2026-10-29

[[exception]]
path = ".github/workflows/ffmpeg-integration.yml"
job = "ffmpeg-sycl-work"
label = "ubuntu-24.04"
reason = "Same FFmpeg source warnings as ffmpeg-work on ubuntu-26.04 (master run 38153817985, job 114512707033). Re-reviewed 2026-10-19 with ffmpeg-work: neither fix series release fixes them. Exception category C (10 days). docs/state.md row T-CI-FFMPEG-WARNINGS-UBUNTU-2604-2026-10-11."
expires = 2026-10-29
