[package]
name = "vmafx-tad"
version = "0.1.0"
description = "Temporal Absolute Difference (TAD) feature extractor for VMAFX — cbindgen pilot (ADR-0707)"
# Inherits edition / license / authors / repository / homepage /
# documentation / readme from [workspace.package] in the root Cargo.toml
# so URL metadata stays consistent across the Rust workspace.
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[lib]
name = "vmafx_tad"
# staticlib: consumed by Meson as a link_with archive.
# rlib: consumed by Rust unit tests and future intra-workspace dependencies.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
cbindgen = "0.27"
