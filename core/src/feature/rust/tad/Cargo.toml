[package]
name = "vmafx-tad"
# Crate version - independently versioned on purpose (ADR-1127, reaffirmed by
# ADR-1151). The Rust crates are not published from the release pipeline and
# carry no x-release-please-version marker; the fork's 1.0.0 product release
# does not reset them.
version = "0.1.0"
description = "Temporal Absolute Difference (TAD) feature extractor for VMAFX — cbindgen pilot (ADR-0707)"
# Inherits edition / authors / repository / homepage / documentation /
# readme from [workspace.package] in the root Cargo.toml so URL metadata
# stays consistent across the Rust workspace. `license` is its own: the crate
# ships the root README.md (the inherited readme, BSD-2-Clause-Patent in
# REUSE.toml) next to its EUPL-1.2 sources and this manifest
# (scripts/ci/check_licence_metadata.py, ADR-1699).
edition.workspace = true
license = "EUPL-1.2 AND BSD-2-Clause-Patent"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
# Not published to crates.io — internal pilot crate consumed by the libvmaf
# build via Meson + cbindgen (ADR-0707). `publish = false` opts the crate out
# of crates.io publish AND makes `cargo-deny` treat it as private under
# `[licenses.private] ignore = true`.
publish = false
# Member of the libvmaf-linked workspace, core/src/rust/Cargo.toml (ADR-1713),
# which lies outside this directory's ancestry.
workspace = "../../../rust"

[lib]
name = "vmafx_tad"
# rlib only since ADR-1713: libvmaf links exactly one Rust archive,
# `vmafx-core-rs` (core/src/rust/staticlib), which re-exports this crate so
# the `vmafx_tad_*` symbols reach it. The C wrapper tad_rust.c declares them.
crate-type = ["rlib"]

[lints]
workspace = true
