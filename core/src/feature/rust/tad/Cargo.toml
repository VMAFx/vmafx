[package]
name = "vmafx-tad"
version = "0.1.0"
edition = "2021"
description = "Temporal Absolute Difference (TAD) feature extractor for VMAFX — cbindgen pilot (ADR-0707)"
license = "BSD-3-Clause-Plus-Patent"
authors = ["Lusoris <lusoris@pm.me>"]
# Not published to crates.io — internal pilot crate consumed by the libvmaf
# build via Meson + cbindgen (ADR-0707). `publish = false` opts the crate out
# of crates.io publish AND makes `cargo-deny` treat it as private under
# `[licenses.private] ignore = true` (so the non-SPDX-recognised
# `BSD-3-Clause-Plus-Patent` short-id does not flag as `unlicensed`).
publish = false

[lib]
name = "vmafx_tad"
# staticlib: consumed by Meson as a link_with archive.
# rlib: consumed by Rust unit tests and future intra-workspace dependencies.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
cbindgen = "0.27"
