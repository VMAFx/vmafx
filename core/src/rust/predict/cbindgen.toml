#
# cbindgen configuration of core/src/rust/include/vmafx_rs_predict.h (RC4 lane P,
# ADR-1713). Regenerate with scripts/dev/rust-abi-header.sh; never edit the header.

language = "C"
include_guard = "VMAFX_RS_PREDICT_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "c"
style = "both"
header = """/*
 * vmafx_rs_predict.h - C ABI of the Rust model predictor (ADR-1713).
 * Generated by cbindgen from core/src/rust/predict/src/abi.rs; regenerate with
 * scripts/dev/rust-abi-header.sh. DO NOT EDIT.
 *
 * Copyright 2026 Lusoris
 * SPDX-License-Identifier: EUPL-1.2
 */"""

[export]
include = ["VmafxRsModelView", "VmafxRsPredictFail"]

[fn]
args = "horizontal"
