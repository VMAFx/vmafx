#
# cbindgen configuration of core/src/rust/include/vmafx_rs.h (ADR-1713).
# Regenerate with scripts/dev/rust-abi-header.sh; never edit the header.

language = "C"
include_guard = "VMAFX_RS_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "c"
style = "both"
header = """/*
 * vmafx_rs.h - C ABI of the Rust feature-extractor twins (ADR-1713).
 * Generated by cbindgen from core/src/rust/fex/src/abi.rs (and the trailer of
 * core/src/rust/cbindgen.toml); regenerate with scripts/dev/rust-abi-header.sh.
 * DO NOT EDIT.
 *
 * Copyright 2026 Lusoris
 * SPDX-License-Identifier: EUPL-1.2
 */"""

# vmafx_rs_twin_at() lives in core/src/rust/staticlib, which cbindgen does
# not read (constants of a dependency are not exported); its declaration is
# the trailer.
trailer = """
#ifdef __cplusplus
extern "C" {
#endif
/* Twin `i` of the registry (core/src/rust/staticlib); NULL past the end. */
const struct VmafxRsTwin *vmafx_rs_twin_at(size_t i);
#ifdef __cplusplus
}
#endif
"""

[export]
include = ["VmafxRsTwin", "VmafxRsHost", "VmafxRsFrame", "VmafxRsPicture", "VmafxRsPlane", "VmafxRsGeometry", "VmafxRsOption"]

[fn]
args = "horizontal"
