#
# Workspace of the Rust code libvmaf links (ADR-1713): the extractor
# framework, the Rust twins of C extractors, the predictor, the TAD pilot and
# vmafx-core-rs, the one archive Meson links. It is separate from the
# repository-root workspace so that its lockfile holds no external crate:
# Meson runs `cargo build --release --locked --offline -p vmafx-core-rs` and
# cargo resolves a whole workspace even for one package. Adding a dependency
# from outside this workspace breaks that offline build on purpose.

[workspace]
members = [
    "fex",
    "feature/psnr",
    "feature/speed",
    "feature/motion",
    "feature/adm",
    "feature/cambi",
    "predict",
    "staticlib",
    "../feature/rust/tad",
]
resolver = "2"

# `license` is the AND of the licences of the files a crate ships
# (scripts/ci/check_licence_metadata.py, ADR-1250, ADR-1699): EUPL-1.2 for the
# fork-authored sources and manifests, BSD-2-Clause-Patent for the inherited
# root README.md (REUSE.toml), the generated lock file and the statements
# ported from Netflix C files.
[workspace.package]
authors = ["Lusoris <lusoris@pm.me>"]
edition = "2024"
license = "EUPL-1.2 AND BSD-2-Clause-Patent"
repository = "https://github.com/VMAFx/vmafx"
homepage = "https://github.com/VMAFx/vmafx"
documentation = "https://vmafx.github.io/vmafx/"
readme = "../../../README.md"

# Every crate opts in with `[lints] workspace = true`. HISS-07 (no unwrap /
# expect), HISS-09 (SAFETY proofs) and HISS-04 (length, complexity; the
# thresholds are in the repository-root clippy.toml) in clippy form. The
# float-rewrite lints are allowed on purpose: their suggestions (mul_add,
# hypot, midpoint) change the rounding the C reference performs, so they are
# never applied.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
suboptimal_flops = "allow"
imprecise_flops = "allow"
manual_midpoint = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Mandatory: a panic must never unwind into C (ADR-1713, ADR-0707).
panic = "abort"

[profile.dev]
panic = "abort"
