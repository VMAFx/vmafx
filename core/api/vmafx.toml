  { name = "device", type = "VmafxDevice", pass = "in_const" },
  { name = "out", type = "VmafxDeviceInfo", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_device_profile"
header = "vmafx/device.h"
since = "0.1"
returns = "status"
doc = "Kernel timings of a device created with VMAFX_DEVICE_PROFILING, as text. `out` lives until the next call on the device or its release. A device without profiling is VMAFX_E_NOTSUP naming it."
params = [
  { name = "device", type = "VmafxDevice", pass = "in" },
  { name = "out", type = "cstr", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_context_use_device"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Score on `device`: the context picks each feature's twin on its backend and holds a reference to the device until it is destroyed. Call it once, before any feature, model or frame; a device can serve several contexts. A context without a device scores on the CPU."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "device", type = "VmafxDevice", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

# ---------------------------------------------------------------------------
# Host frames (WP2; WP3 adds device imports, pools and fences).

[[functions]]
name = "vmafx_frame_create_host"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "Allocate a host frame on `device` (NULL: the CPU) with zeroed planes; fill them through vmafx_frame_planes() before the first submit. The caller holds one reference."
