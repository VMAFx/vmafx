]

[[functions]]
name = "vmafx_feature_resolve"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Which extractor would compute the CPU extractor `extractor` with `options` (may be NULL) on this context, for frames of `frame` (may be NULL: no geometry check). On a context without a device backend that is the CPU extractor itself. VMAFX_E_NOTFOUND names an unknown extractor; VMAFX_E_NOTSUP names a device backend without a twin, or the option (and `out.unsupported_option`) the twin cannot honour (ADR-1359)."
params = [
  { name = "context", type = "VmafxContext", pass = "in_const" },
  { name = "extractor", type = "cstr", pass = "in" },
  { name = "options", type = "VmafxOptions", pass = "in_const", nullable = true },
  { name = "frame", type = "VmafxFrameDesc", pass = "in", nullable = true },
  { name = "out", type = "VmafxFeatureResolution", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_context_frame_retention"
header = "vmafx/context.h"
since = "0.1"
returns = "u32"
doc = "How many earlier reference frames the context keeps after vmafx_submit() returns: 1 (frame n-1), or 2 when a registered extractor reads frame n-2 (ADR-1478). With worker threads more frames stay in flight until their work finishes: vmafx_context_max_in_flight() gives the bound. 0 for NULL."
params = [
  { name = "context", type = "VmafxContext", pass = "in_const" },
]

[[functions]]
name = "vmafx_submit"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Score frame `index` from `reference` and `distorted`. Consumes one reference of each frame on every path, failures included (the same frame as both inputs needs two); a frame submitted to several contexts needs one reference per submit and is never copied. Indices increase strictly and every frame keeps the first frame's geometry."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "reference", type = "VmafxFrame", pass = "in" },
  { name = "distorted", type = "VmafxFrame", pass = "in" },
  { name = "index", type = "u64", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_flush"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Finish every submitted frame; scores of the last frames (motion) become final. A context is flushed once; a second flush or a submit after it is VMAFX_E_INVALID."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

