[[handles]]
name = "VmafxReportFile"
header = "vmafx/report.h"
since = "0.1"
release = "vmafx_report_close"
doc = "A JSON report read back for verification (vmafx_report_open()). Added in ABI 0.1.5."

# ---------------------------------------------------------------------------
# Callbacks.

[[callbacks]]
name = "VmafxLogCallback"
header = "vmafx/types.h"
returns = "void"
since = "0.1"
doc = "Receives log messages: `level` is a VmafxLogLevel, `message` one line without its newline, valid during the call. Runs on the thread that raised the message, a library worker thread included, and may run on several threads at once: it must be thread-safe and must not call back into the context."
params = [
  { name = "level", type = "u32", pass = "in" },
  { name = "message", type = "cstr", pass = "in" },
  { name = "user", type = "ptr", pass = "in" },
]

[[callbacks]]
name = "VmafxFrameReleaseCallback"
header = "vmafx/frame.h"
returns = "void"
since = "0.1"
doc = "Called once, on any thread, when the library has stopped reading the planes of a wrapped host frame."
params = [
  { name = "user", type = "ptr", pass = "in" },
]

# ---------------------------------------------------------------------------
# Structs.

[[structs]]
name = "VmafxContextConfig"
header = "vmafx/context.h"
since = "0.1"
sized = true
doc = "Context configuration. Initialise with VMAFX_CONTEXT_CONFIG_INIT."
fields = [
  { name = "log_level", type = "u32", enum = "VmafxLogLevel", doc = "Log verbosity." },
  { name = "n_threads", type = "u32", doc = "Worker threads; 0 runs extractors on the calling thread." },
  { name = "n_subsample", type = "u32", doc = "Score every n-th frame; 0 and 1 score every frame." },
  { name = "cpumask", type = "u64", doc = "CPU instruction-set bits to disable." },
  { name = "gpumask", type = "u64", doc = "GPU dispatch bits to disable." },
  { name = "log_callback", type = "VmafxLogCallback", doc = "Receives every message the library raises for this context at or below `log_level`, on the calling thread and on the context's worker threads, and every failure reported without an error out-parameter; nothing of the context then reaches the process log (ADR-1906). NULL: the process log (stderr), whose level the context then sets, as vmaf_init() does. Added in ABI 0.1.1." },
  { name = "log_user", type = "ptr", doc = "Passed to `log_callback`. Added in ABI 0.1.1." },
  { name = "import_retry_wait_ns", type = "u64", doc = "Longest host wait on the acquire fence before the one retry of vmafx_context_import_frame() (the import rule, ADR-1929), in nanoseconds: 1 to 600000000000 (10 minutes); 0, the value of VMAFX_CONTEXT_CONFIG_INIT, is the default of 10 seconds. A larger value is refused with VMAFX_E_RANGE naming `config.import_retry_wait_ns`, not clamped. Added in ABI 0.1.3." },
]

[[structs]]
name = "VmafxProvenance"
header = "vmafx/provenance.h"
since = "0.1"
sized = true
# Emitted as the proto message `Provenance` and its OpenAPI schema (#2155):
# every scoring response carries it. Fields only grow at the end, so the proto
# field numbers (field order) never change.
proto = "Provenance"
doc = "How the scores of a context are made (#2142). Strings live as long as the context."
fields = [
  { name = "abi_major", type = "u32", doc = "ABI major version of the library that ran." },
  { name = "abi_minor", type = "u32", doc = "ABI minor version." },
  { name = "abi_patch", type = "u32", doc = "ABI patch version." },
  { name = "active_backend", type = "u32", enum = "VmafxBackend", doc = "Backend imported into the context." },
  { name = "n_extractors", type = "u32", doc = "Registered feature extractors; see vmafx_context_extractor_info()." },
  { name = "version", type = "cstr", doc = "Build version (git describe)." },
  { name = "commit", type = "cstr", doc = "Commit the library was built from (`git rev-parse HEAD`); `unknown` outside a git checkout. Added in ABI 0.1.5." },
  { name = "build_id", type = "cstr", doc = "`sha256:` and the SHA-256 of the canonical build description (`compiler`, `build_flags`, `fp_policy`, `backends`, `rust_twins`): two builds that differ in any of them have different ids. Added in ABI 0.1.5." },
  { name = "compiler", type = "cstr", doc = "C and C++ compiler ids and versions (`c=gcc 15.2.1 cpp=gcc 15.2.1`). Added in ABI 0.1.5." },
  { name = "build_flags", type = "cstr", doc = "Build type, optimisation level, assertions, LTO and the extra C / C++ arguments of the build. Added in ABI 0.1.5." },
  { name = "fp_policy", type = "cstr", doc = "Strict floating-point arguments of every C and C++ translation unit (ADR-1461). Added in ABI 0.1.5." },
  { name = "backends", type = "cstr", doc = "Backends the library was built with, comma-separated in VmafxBackend order (`cpu,cuda`). Added in ABI 0.1.5." },
  { name = "rust_twins", type = "u32", doc = "1 when the library was built with Rust extractors, else 0. Added in ABI 0.1.5." },
  { name = "simd", type = "cstr", doc = "Highest instruction-set level the CPU extractors dispatch to under the context's cpumask (`avx512icl`, `avx512`, `avx2`, `sse4.1`, `ssse3`, `sse2`, `sve2`, `neon`, `scalar`). Added in ABI 0.1.5." },
  { name = "device_index", type = "i32", doc = "Index of the device the context scores on within its backend; 0 for the CPU, -1 for a device made from external handles. Added in ABI 0.1.5." },
  { name = "device_name", type = "cstr", doc = "Name of that device as its runtime reports it (`cpu` for the CPU). Added in ABI 0.1.5." },
  { name = "device_runtime", type = "cstr", doc = "Runtime and driver of that device (the host architecture for the CPU, `x86_64`); `unknown` when the backend does not report it yet. Added in ABI 0.1.5." },
  { name = "n_threads", type = "u32", doc = "Worker threads of the context. Added in ABI 0.1.5." },
  { name = "n_subsample", type = "u32", doc = "Frame subsampling of the context (1: every frame). Added in ABI 0.1.5." },
  { name = "cpumask", type = "u64", doc = "CPU instruction-set bits the context disabled. Added in ABI 0.1.5." },
  { name = "gpumask", type = "u64", doc = "GPU dispatch bits the context disabled. Added in ABI 0.1.5." },
  { name = "frame_width", type = "u32", doc = "Luma width of the submitted frames; 0 before the first frame. Added in ABI 0.1.5." },
  { name = "frame_height", type = "u32", doc = "Luma height of the submitted frames; 0 before the first frame. Added in ABI 0.1.5." },
  { name = "pix_fmt", type = "u32", enum = "VmafxPixelFormat", doc = "Pixel layout of the submitted frames. Added in ABI 0.1.5." },
  { name = "bpc", type = "u32", doc = "Bits per component of the submitted frames. Added in ABI 0.1.5." },
  { name = "n_frames", type = "u64", doc = "Frames submitted. Added in ABI 0.1.5." },
  { name = "n_models", type = "u32", doc = "Mounted models; see vmafx_context_model_provenance(). Added in ABI 0.1.5." },
  { name = "n_features", type = "u32", doc = "Features with scores; see vmafx_context_feature_provenance(). Added in ABI 0.1.5." },
  { name = "n_annotations", type = "u32", doc = "Caller annotations; see vmafx_context_annotation(). Added in ABI 0.1.5." },
  { name = "encode_record", type = "cstr", doc = "Digest of the encode record of the distorted input (`sha256:` and 64 hex digits, VMAFx/pelorus#81), set with vmafx_context_set_encode_record(); empty when none. Added in ABI 0.1.5." },
  { name = "scores_digest", type = "cstr", doc = "`sha256:` and the SHA-256 of every per-frame score written so far: one line `<feature> <index> <16 hex digits of the IEEE-754 bits>` per score, features in byte order, frames in index order. Added in ABI 0.1.5." },
  { name = "elapsed_ns", type = "u64", doc = "Nanoseconds from the first submitted frame to the flush (to now before it); timing, not covered by `digest`. Added in ABI 0.1.5." },
  { name = "digest", type = "cstr", doc = "`sha256:` and the SHA-256 of the record's canonical JSON (RFC 8785) without `digest` and `elapsed_ns`: models, features and annotations included (vmafx_context_provenance_json() with VMAFX_PROVENANCE_JSON_CANONICAL). Added in ABI 0.1.5." },
]
# Proto-only members (RC4 WP5): the repeated records of the context, numbered
# from 100 so the field-order numbers of the scalar fields above never meet
# them.
proto_repeated = [
  { name = "models", struct = "VmafxModelProvenance", number = 100, doc = "Mounted models." },
  { name = "features", struct = "VmafxFeatureProvenance", number = 101, doc = "Features with scores." },
  { name = "annotations", struct = "VmafxAnnotation", number = 102, doc = "Caller annotations, in the order they were added." },
]

[[structs]]
name = "VmafxModelProvenance"
header = "vmafx/provenance.h"
since = "0.1"
sized = true
proto = "ModelProvenance"
doc = "One mounted model (#2142). Strings live as long as the context. Added in ABI 0.1.5."
fields = [
  { name = "name", type = "cstr", doc = "Name of the model's scores." },
  { name = "version", type = "cstr", doc = "Built-in model version, or the path of the file it was loaded from." },
  { name = "sha256", type = "cstr", doc = "SHA-256 of the model bytes as loaded, 64 lower-case hex digits." },
  { name = "flags", type = "u64", flags = "VmafxModelFlags", doc = "Load flags." },
  { name = "overrides", type = "cstr", doc = "Feature option overloads applied after loading, `<extractor>.<key>=<value>` separated by `:` in the order applied; empty when none." },
]

[[structs]]
name = "VmafxFeatureProvenance"
header = "vmafx/provenance.h"
since = "0.1"
sized = true
proto = "FeatureProvenance"
doc = "How the scores of one feature are made (#2142). Strings live as long as the context. Added in ABI 0.1.5."
fields = [
  { name = "feature", type = "cstr", doc = "Feature name as the scores carry it (option-decorated names included)." },
  { name = "extractor", type = "cstr", doc = "Extractor that wrote the scores; the model's name for a model score; empty for an imported score." },
  { name = "implementation", type = "cstr", doc = "`c` or `rust` (an extractor registered as `<name>_rust`); empty when no extractor wrote the scores." },
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend the extractor runs on (CPU for model and imported scores)." },
  { name = "device", type = "cstr", doc = "Device that ran the extractor (`cpu` for the CPU)." },
  { name = "runtime", type = "cstr", doc = "Runtime and driver of that device (VmafxProvenance.device_runtime of a device extractor, the host architecture for the CPU)." },
  { name = "options", type = "cstr", doc = "Options of the extractor instance, `key=value` separated by `:` in key order; empty when none." },
  { name = "exactness", type = "cstr", doc = "How the scores relate to the CPU extractor's, generated from scripts/ci/exact_twins.d and the parity gate's tables: `cpu-reference`, `exact`, `libm-bounded <bound>`, `tolerance <bound>`, or `unclassified` for a device extractor the tables do not list; empty when no extractor wrote the scores." },
  { name = "source", type = "u32", enum = "VmafxFeatureSource", doc = "Where the scores come from." },
]

[[structs]]
name = "VmafxAnnotation"
header = "vmafx/provenance.h"
since = "0.1"
