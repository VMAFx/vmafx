# ---------------------------------------------------------------------------
# The libvmaf compatibility layer (ADR-1852 design section 2.11, decision D3):
# every function the libvmaf headers export, in header order. libvmaf.so.3
# defines them on exported vmafx_ functions only. `shim` / `glue` bodies are
# generated into core/src/compat/libvmaf/libvmaf_gen.c; `manual` ones are
# hand-written in `file` and call `calls`; `engine` functions keep the
# engine's own definition while their backend (`engine_with`) is built, a
# declared exception that `until` ends. A manual function with `engine_with`
# serves builds without that backend. `when` names a build feature the
# function exists in. core/src/vmafx/engine_names_gen.h renames every engine
# body of a compat function to vmaf_engine_<stem>.

[[compat]]
name = "vmaf_dnn_available"
header = "libvmaf/dnn.h"
kind = "shim"
target = "vmafx_dnn_available"
returns = "int"
params = []
return_expr = "(int)vmafx_dnn_available()"

[[compat]]
name = "vmaf_use_tiny_model"
header = "libvmaf/dnn.h"
kind = "manual"
target = "vmafx_context_use_tiny_model"
returns = "int"
params = [
  { name = "ctx", c = "VmafContext *" },
  { name = "onnx_path", c = "const char *" },
  { name = "cfg", c = "const VmafDnnConfig *" },
]
file = "core/src/compat/libvmaf/dnn.c"
calls = ["vmafx_context_from_libvmaf", "vmafx_context_use_tiny_model"]
note = "VmafDnnConfig -> VmafxDnnConfig"

[[compat]]
name = "vmaf_dnn_set_codec_context"
header = "libvmaf/dnn.h"
kind = "manual"
target = "vmafx_context_set_codec_context"
returns = "int"
params = [
  { name = "ctx", c = "VmafContext *" },
  { name = "codec_name", c = "const char *" },
  { name = "preset", c = "const char *" },
  { name = "crf", c = "int" },
]
file = "core/src/compat/libvmaf/dnn.c"
calls = ["vmafx_context_from_libvmaf", "vmafx_context_set_codec_context"]

[[compat]]
