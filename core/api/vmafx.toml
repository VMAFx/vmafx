since = "0.1"
returns = "status"
doc = "Describe the planes of a frame."
params = [
  { name = "frame", type = "VmafxFrame", pass = "in_const" },
  { name = "out", type = "VmafxFramePlanes", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_ref"
header = "vmafx/frame.h"
since = "0.1"
