# ---------------------------------------------------------------------------
# libvmaf compatibility shims (core/src/vmafx/compat_libvmaf_gen.c). The old
# declarations stay in core/include/libvmaf/*.h unchanged; these entries
# generate their definitions on top of the functions above.

[[compat]]
name = "vmaf_init"
header = "libvmaf/libvmaf.h"
kind = "glue"
target = "vmafx_context_create"
returns = "int"
params = [
  { name = "vmaf", c = "VmafContext **" },
  { name = "cfg", c = "VmafConfiguration" },
]
null_checks = ["vmaf"]
clear = "*vmaf = NULL;"
build = { var = "config", type = "VmafxContextConfig", from = { log_level = "(uint32_t)cfg.log_level", n_threads = "cfg.n_threads", n_subsample = "cfg.n_subsample", cpumask = "cfg.cpumask", gpumask = "cfg.gpumask", log_callback = "NULL", log_user = "NULL" } }
out_handle = { var = "context", type = "VmafxContext" }
