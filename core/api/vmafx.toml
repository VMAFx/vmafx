]

[[functions]]
name = "vmafx_frame_wrap_host"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "A host frame on the caller's planes, without a copy. The planes stay valid and unchanged until `planes.release` is called, once, when the last reference (the caller's or a context's) is gone. On failure `release` is not called."
params = [
  { name = "device", type = "VmafxDevice", pass = "in", nullable = true },
  { name = "desc", type = "VmafxFrameDesc", pass = "in" },
  { name = "planes", type = "VmafxHostPlanes", pass = "in" },
  { name = "out", type = "VmafxFrame", pass = "out_handle" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_planes"
