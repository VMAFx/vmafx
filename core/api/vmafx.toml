since = "0.1"
sized = true
doc = "One score and the extractor that produced it."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the producing extractor (CPU when none is registered)." },
  { name = "index", type = "u64", doc = "Frame index." },
  { name = "value", type = "f64", doc = "Score." },
  { name = "feature", type = "cstr", doc = "Feature name as requested." },
  { name = "extractor", type = "cstr", doc = "Registered extractor that wrote the feature (option-decorated names included, RC4 WP5), or NULL (imported and model scores); vmafx_feature_provenance() describes it." },
]

[[structs]]
name = "VmafxFeatureResolution"
header = "vmafx/context.h"
since = "0.1"
sized = true
doc = "Which extractor computes a feature on a context (ADR-1359). Strings live for the process lifetime."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of `extractor`." },
  { name = "extractor", type = "cstr", doc = "Extractor that computes the feature: the CPU extractor on a context without a device backend, else its device twin." },
  { name = "unsupported_option", type = "cstr", doc = "The option the twin cannot honour when the call returns VMAFX_E_NOTSUP, else NULL." },
]

[[structs]]
name = "VmafxDeviceDesc"
header = "vmafx/device.h"
since = "0.1"
sized = true
doc = "Which device to create. Initialise with VMAFX_DEVICE_DESC_INIT."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the device: CPU in every build, CUDA or HIP in a build with that backend; another backend is VMAFX_E_NOTSUP naming it." },
  { name = "index", type = "i32", doc = "Device index within the backend (see vmafx_device_count()); -1: any device of the backend. Ignored when `external[0]` is set." },
  { name = "flags", type = "u32", flags = "VmafxDeviceFlags", doc = "How to create the device. Added in ABI 0.1.2." },
  { name = "external", type = "uptr", count = 2, doc = "The caller's runtime objects, which stay the caller's and must outlive the device: CUDA context and stream, SYCL queue and 0, HIP stream and 0 (the device is the stream's), Metal device and command queue. 0: the library creates its own. The CPU takes none. Added in ABI 0.1.2." },
]

[[structs]]
name = "VmafxDeviceInfo"
header = "vmafx/device.h"
since = "0.1"
sized = true
doc = "What a device is and what it imports. Grows at the end: the format envelope of each device (largest frame, bit depths, chroma layouts; PR #2185) is appended by the generated capability tables of RC6 / RC7. Strings live for the process lifetime."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the device." },
  { name = "index", type = "i32", doc = "Device index within the backend; -1 for a device made from external handles." },
  { name = "flags", type = "u32", flags = "VmafxDeviceFlags", doc = "Flags the device was created with; 0 for an enumerated device." },
  { name = "memory_kinds", type = "u32", doc = "Bit `1 << k` set for each VmafxMemoryKind `k` vmafx_frame_import() binds on this device." },
  { name = "fence_kinds", type = "u32", doc = "Bit `1 << k` set for each VmafxFenceKind `k` the device waits on and returns as a release fence." },
  { name = "total_memory", type = "u64", doc = "Bytes of device memory; 0 when the backend does not report it (the CPU)." },
  { name = "name", type = "cstr", doc = "Name of the device as its runtime reports it (`cpu` for the CPU)." },
]

[[structs]]
name = "VmafxFence"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "A synchronisation point between the producer of a frame and the library. Passed by pointer; embedded by value in VmafxFrameImport, so it never grows. A fence the library returns (vmafx_fence_create(), vmafx_frame_release_fence()) belongs to the caller, who releases it once with vmafx_fence_destroy(). Initialise with VMAFX_FENCE_INIT."
fields = [
  { name = "kind", type = "u32", enum = "VmafxFenceKind", doc = "What the fence is; the other fields are read as the kind says." },
  { name = "handle", type = "uptr", doc = "Event, shared-event, shared-fence or host-fence object; 0 when the kind has none." },
  { name = "value", type = "u64", doc = "Value a timeline fence (METAL_SHARED_EVENT, WIN32_SHARED) reaches when signalled; 0 otherwise." },
  { name = "fd", type = "i32", doc = "sync_file descriptor for SYNC_FILE; ignored otherwise." },
  { name = "reserved", type = "u32", doc = "0." },
]

[[structs]]
name = "VmafxImportPlane"
header = "vmafx/frame.h"
since = "0.1"
sized = false
doc = "Where one plane of an imported frame lives. Embedded by value in VmafxFrameImport: never grows. Fields a memory kind does not use are ignored."
fields = [
  { name = "handle", type = "uptr", doc = "Address, device pointer, array, surface, texture or shared handle, as VmafxMemoryKind says." },
  { name = "fd", type = "i32", doc = "dma-buf descriptor for DMABUF memory (the library duplicates it); ignored otherwise." },
  { name = "plane_index", type = "u32", doc = "Plane of a multi-plane object (surface, shared texture, dma-buf layer)." },
  { name = "offset", type = "u64", doc = "Bytes from the start of the memory to the plane's first sample." },
  { name = "pitch", type = "u64", doc = "Bytes from one row to the next, at least the bytes of a row." },
  { name = "modifier", type = "u64", doc = "Format modifier of the memory layout; 0 is linear. A modifier the device cannot read is refused naming the plane." },
  { name = "size", type = "u64", doc = "Bytes of the memory object the plane lives in; 0: not given (needed by DMABUF imports). When set, every row of the plane must lie inside it." },
]

[[structs]]
name = "VmafxFrameImport"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "A frame the producer already holds in memory a device reads (design section 2.7). Initialise with VMAFX_FRAME_IMPORT_INIT."
fields = [
  { name = "memory", type = "u32", enum = "VmafxMemoryKind", doc = "What each plane's handle refers to." },
  { name = "pix_fmt", type = "u32", enum = "VmafxPixelFormat", doc = "Layout of the producer's planes; NV12, P010 and P016 are converted to planar on the device (a de-interleave, and for P010 a shift), nothing else." },
  { name = "bpc", type = "u32", doc = "Bits per component: 8 for NV12, 10 for P010, 16 for P016, 8 to 16 for the planar formats." },
  { name = "w", type = "u32", doc = "Luma width in pixels." },
  { name = "h", type = "u32", doc = "Luma height in pixels." },
  { name = "n_planes", type = "u32", doc = "Planes in `plane`: 1 for YUV400P, 2 for NV12 / P010 / P016 (luma, interleaved chroma), else 3." },
  { name = "plane", type = "VmafxImportPlane", count = 3, doc = "Each plane; entries past `n_planes` are ignored." },
  { name = "acquire", type = "VmafxFence", doc = "Signalled when the producer has written the planes. Borrowed for the call: the library takes what it needs (a reference, a duplicated descriptor, a device-side wait). NONE: the planes are written." },
  { name = "flags", type = "u32", flags = "VmafxImportFlags", doc = "0: zero copy only." },
  { name = "release", type = "VmafxFrameReleaseCallback", doc = "Called once, on the thread that drops the frame's last reference, after its release fences were signalled or recorded: a CUDA_EVENT or HIP_EVENT release fence can be waited on from here (a producer makes its stream wait on it before it reuses the planes, with no host wait); NULL: none. Added in ABI 0.1.7." },
  { name = "user", type = "ptr", doc = "Passed to `release`. Added in ABI 0.1.7." },
]

[[structs]]
name = "VmafxModelConfig"
header = "vmafx/model.h"
since = "0.1"
sized = true
doc = "How to load a model. Initialise with VMAFX_MODEL_CONFIG_INIT."
