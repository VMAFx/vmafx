returns = "status"
doc = "Register the extractors of every feature `model` reads and mount the model. The context takes a reference to the model until it is destroyed (ADR-1755); the caller may release its own at once. A model whose name another model of the context already has is refused with VMAFX_E_INVALID naming it: its scores would be the other model's (a model set may share the name)."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "model", type = "VmafxModel", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
