#
# The VMAFx public API definition (ADR-1852). Every surface listed under
# "outputs" in docs/development/api-generation.md is generated from this file
# by scripts/codegen/vmafx-api.py; the generated files are committed and the
# Meson test `test_vmafx_api_generated_current` fails when one of them differs
# from what this file produces.
#
# Prototype slice (RC4): context create / destroy, version and provenance
# queries, one score call, and the libvmaf compat shims for the matching
# functions. The rest of the API follows the design in ADR-1852; the format of
# every table is in docs/development/api-generation.md.
#
# Rules the generator enforces:
# - Every entry names its header (`header`) and the ABI minor that introduced
#   it (`since`); members (fields, enum values, flag bits) inherit their
#   parent's `since` unless they name a later one. A function's `since` picks
#   its linker version node (`VMAFX_<major>.<minor>`); from ABI 1.0 a node that
#   shipped never gains a symbol.
# - `sized = true` structs get `uint32_t struct_size` as their first field and
#   only grow at the end (HISS-14); a struct another struct embeds by value
#   never grows. `scripts/codegen/vmafx-api.py --abi-check` refuses a reorder,
#   removal, retype or renumber against a previous version.
# - Enum-valued and flag fields are `u32` / `u64` with an `enum` / `flags`
#   annotation, so their size never depends on the compiler; no `bool` crosses
#   the ABI.
# - `deprecated = { since, replacement, removal }` names a declared
#   replacement.

[api]
name = "vmafx"
schema = 2
abi_version = "0.1.2"
export_macro = "VMAFX_EXPORT"
# Export / deprecation macros, VmafxStatus and the status codes live here.
base_header = "vmafx/types.h"
# ABI version macros live here.
version_header = "vmafx/version.h"
# false while the vmafx_ functions share libvmaf.so with the libvmaf API: the
# version script then versions vmafx_ symbols and leaves the rest alone. The
# library split (ADR-1852 D3) sets it to true (`local: *;`).
hide_unlisted = false

# Header layout of design section 2.10. `group`: `umbrella` includes every
# `core` header; `optional` headers are never included by it. Each header
# includes the headers whose types its declarations use (computed).
[[headers]]
path = "vmafx/vmafx.h"
group = "umbrella"
guard = "VMAFX_VMAFX_H"
brief = "VMAFx public C API (generated): includes every core header."

[[headers]]
path = "vmafx/version.h"
group = "core"
guard = "VMAFX_VERSION_H"
brief = "ABI version macros and the version of the loaded library."

[[headers]]
path = "vmafx/types.h"
group = "core"
guard = "VMAFX_TYPES_H"
brief = "Status codes, shared enumerations and the export macros."

[[headers]]
path = "vmafx/error.h"
group = "core"
guard = "VMAFX_ERROR_H"
brief = "Errors that name what failed."

[[headers]]
path = "vmafx/context.h"
group = "core"
guard = "VMAFX_CONTEXT_H"
brief = "Contexts: options, feature and model registration, submit, flush, extractor introspection."

[[headers]]
path = "vmafx/device.h"
group = "core"
guard = "VMAFX_DEVICE_H"
brief = "Devices: enumeration, creation from a backend index or external handles, profiling."

[[headers]]
path = "vmafx/frame.h"
group = "core"
guard = "VMAFX_FRAME_H"
brief = "Frames: host frames, device imports, pools, fences, side data."

[[headers]]
path = "vmafx/model.h"
group = "core"
guard = "VMAFX_MODEL_H"
brief = "Models and model sets."

[[headers]]
path = "vmafx/score.h"
group = "core"
guard = "VMAFX_SCORE_H"
brief = "Frame scores, pooled scores and windows."

[[headers]]
path = "vmafx/provenance.h"
group = "core"
guard = "VMAFX_PROVENANCE_H"
brief = "Provenance records: how the scores of a context are made."

[[headers]]
path = "vmafx/report.h"
group = "core"
guard = "VMAFX_REPORT_H"
brief = "Report writer."

[[headers]]
path = "vmafx/dnn.h"
group = "core"
guard = "VMAFX_DNN_H"
brief = "Tiny-AI models."

[[headers]]
path = "vmafx/mcp.h"
group = "core"
guard = "VMAFX_MCP_H"
brief = "Embedded MCP server."

[[headers]]
path = "vmafx/libvmaf_bridge.h"
group = "optional"
guard = "VMAFX_LIBVMAF_BRIDGE_H"
brief = "Bridge between a VmafxContext and the libvmaf handle bound to it, for callers that migrate one call at a time."
includes = ["libvmaf/libvmaf.h"]

# ---------------------------------------------------------------------------
# Status codes. Stable on every platform; `errno` is what the libvmaf compat
# layer returns (negated) when the failure carries no engine errno of its own.

[[status]]
name = "VMAFX_OK"
since = "0.1"
value = 0
errno = "0"
doc = "Success."

[[status]]
name = "VMAFX_PENDING"
since = "0.1"
value = 1
errno = "EAGAIN"
doc = "The requested score is not final yet (libvmaf returned -EAGAIN)."

[[status]]
name = "VMAFX_E_INVALID"
since = "0.1"
value = -1
errno = "EINVAL"
doc = "Invalid argument or state; the error names the parameter."

[[status]]
name = "VMAFX_E_NOMEM"
since = "0.1"
value = -2
errno = "ENOMEM"
doc = "Out of memory."

[[status]]
name = "VMAFX_E_NOTSUP"
since = "0.1"
value = -3
errno = "ENOTSUP"
doc = "Backend, format or option not supported; the error names it."

[[status]]
name = "VMAFX_E_NOTFOUND"
since = "0.1"
value = -4
errno = "ENOENT"
doc = "Unknown feature, model, extractor index or device."

[[status]]
name = "VMAFX_E_BUSY"
since = "0.1"
value = -5
errno = "EBUSY"
doc = "Resource already in use."

[[status]]
name = "VMAFX_E_DEVICE"
since = "0.1"
value = -6
errno = "EIO"
reverse = false
doc = "Backend runtime failure; the error carries the runtime's code."

[[status]]
name = "VMAFX_E_IO"
since = "0.1"
value = -7
errno = "EIO"
doc = "File or stream error."

[[status]]
name = "VMAFX_E_RANGE"
since = "0.1"
value = -8
errno = "ERANGE"
doc = "Value out of range."

[[status]]
name = "VMAFX_E_INTERNAL"
since = "0.1"
value = -9
errno = "EIO"
reverse = false
doc = "Engine error without a more specific status; the error carries the engine's errno."

[[status]]
name = "VMAFX_E_TIMEOUT"
since = "0.1"
value = -10
errno = "ETIMEDOUT"
doc = "A fence was not signalled within the time the caller allowed; the error names the fence (RC4 WP3)."

[[status]]
name = "VMAFX_E_ABI"
since = "0.1"
value = -11
errno = "EINVAL"
reverse = false
doc = "A struct_size below the size the struct had when it was introduced; the error names the struct."

# ---------------------------------------------------------------------------
# Enumerations (values equal the libvmaf ones where libvmaf has the concept).

[[enums]]
name = "VmafxLogLevel"
header = "vmafx/types.h"
since = "0.1"
doc = "Log verbosity (values equal enum VmafLogLevel)."
values = [
  { name = "VMAFX_LOG_LEVEL_NONE", value = 0 },
  { name = "VMAFX_LOG_LEVEL_ERROR", value = 1 },
  { name = "VMAFX_LOG_LEVEL_WARNING", value = 2 },
  { name = "VMAFX_LOG_LEVEL_INFO", value = 3 },
  { name = "VMAFX_LOG_LEVEL_DEBUG", value = 4 },
]

[[enums]]
name = "VmafxBackend"
header = "vmafx/types.h"
since = "0.1"
doc = "Compute backend (values equal enum VmafBackend; 5 stays reserved for the removed backend of ADR-0726)."
values = [
  { name = "VMAFX_BACKEND_CPU", value = 0 },
  { name = "VMAFX_BACKEND_CUDA", value = 1 },
  { name = "VMAFX_BACKEND_SYCL", value = 2 },
  { name = "VMAFX_BACKEND_METAL", value = 3 },
  { name = "VMAFX_BACKEND_HIP", value = 4 },
]

[[enums]]
name = "VmafxPixelFormat"
header = "vmafx/types.h"
since = "0.1"
doc = "Planar pixel layout of a frame (values equal enum VmafPixelFormat)."
values = [
  { name = "VMAFX_PIXEL_FORMAT_UNKNOWN", value = 0, doc = "Not set; refused by every frame constructor." },
  { name = "VMAFX_PIXEL_FORMAT_YUV420P", value = 1, doc = "4:2:0, chroma halved in both directions (rounded up)." },
  { name = "VMAFX_PIXEL_FORMAT_YUV422P", value = 2, doc = "4:2:2, chroma halved horizontally (rounded up)." },
  { name = "VMAFX_PIXEL_FORMAT_YUV444P", value = 3, doc = "4:4:4, no chroma subsampling." },
  { name = "VMAFX_PIXEL_FORMAT_YUV400P", value = 4, doc = "Luma only." },
  { name = "VMAFX_PIXEL_FORMAT_NV12", value = 16, doc = "4:2:0, a luma plane and one plane of interleaved Cb/Cr bytes; vmafx_frame_import() only, the frame it makes is YUV420P at 8 bits. Added in ABI 0.1.2." },
  { name = "VMAFX_PIXEL_FORMAT_P010", value = 17, doc = "NV12 with 16-bit little-endian samples whose 10 bits are the most significant; vmafx_frame_import() only, the frame it makes is YUV420P at 10 bits (each sample shifted down by 6, ADR-1679). Added in ABI 0.1.2." },
  { name = "VMAFX_PIXEL_FORMAT_P016", value = 18, doc = "NV12 with 16-bit little-endian samples; vmafx_frame_import() only, the frame it makes is YUV420P at 16 bits. Added in ABI 0.1.2." },
]

[[enums]]
name = "VmafxPool"
header = "vmafx/types.h"
since = "0.1"
doc = "Pooling method of a pooled score (values equal enum VmafPoolingMethod)."
values = [
  { name = "VMAFX_POOL_NONE", value = 0, doc = "No pooling: a per-frame score." },
  { name = "VMAFX_POOL_MIN", value = 1 },
  { name = "VMAFX_POOL_MAX", value = 2 },
  { name = "VMAFX_POOL_MEAN", value = 3 },
  { name = "VMAFX_POOL_HARMONIC_MEAN", value = 4 },
  { name = "VMAFX_POOL_MEDIAN", value = 5 },
  { name = "VMAFX_POOL_PERC5", value = 6, doc = "5th percentile (linear interpolation)." },
  { name = "VMAFX_POOL_PERC10", value = 7, doc = "10th percentile." },
  { name = "VMAFX_POOL_PERC20", value = 8, doc = "20th percentile." },
]

[[enums]]
name = "VmafxSubjectKind"
header = "vmafx/error.h"
since = "0.1"
doc = "What the subject of a VmafxError names."
values = [
  { name = "VMAFX_SUBJECT_NONE", value = 0, doc = "No subject." },
  { name = "VMAFX_SUBJECT_PARAMETER", value = 1, doc = "A parameter or a struct field (`desc.w`)." },
  { name = "VMAFX_SUBJECT_CONTEXT", value = 2, doc = "The context." },
  { name = "VMAFX_SUBJECT_OPTION", value = 3, doc = "An option key." },
  { name = "VMAFX_SUBJECT_FEATURE", value = 4, doc = "A feature name." },
  { name = "VMAFX_SUBJECT_EXTRACTOR", value = 5, doc = "A feature extractor." },
  { name = "VMAFX_SUBJECT_MODEL", value = 6, doc = "A model name, version or model set." },
  { name = "VMAFX_SUBJECT_FRAME", value = 7, doc = "A frame or a frame index." },
  { name = "VMAFX_SUBJECT_PLANE", value = 8, doc = "A plane of a frame." },
  { name = "VMAFX_SUBJECT_DEVICE", value = 9, doc = "A device." },
  { name = "VMAFX_SUBJECT_BACKEND", value = 10, doc = "A backend." },
  { name = "VMAFX_SUBJECT_PATH", value = 11, doc = "A file path." },
  { name = "VMAFX_SUBJECT_FENCE", value = 12, doc = "A fence." },
]

[[flags]]
name = "VmafxModelFlags"
header = "vmafx/model.h"
type = "u64"
since = "0.1"
doc = "Model load flags (bit values equal enum VmafModelFlags)."
bits = [
  { name = "VMAFX_MODEL_DISABLE_CLIP", bit = 0, doc = "Do not clip the score to the model's range." },
  { name = "VMAFX_MODEL_ENABLE_TRANSFORM", bit = 1, doc = "Apply the model's score transform." },
  { name = "VMAFX_MODEL_DISABLE_TRANSFORM", bit = 2, doc = "Do not apply the model's score transform." },
]

# Device frames and fences (RC4 WP3, ADR-1852 design section 2.7). Every
# kind is declared now so the backend lanes fill in implementations without
# changing the ABI; the CPU device implements HOST memory and NONE / HOST
# fences.

[[enums]]
name = "VmafxMemoryKind"
header = "vmafx/frame.h"
since = "0.1"
doc = "What a VmafxImportPlane handle refers to."
values = [
  { name = "VMAFX_MEMORY_NONE", value = 0, doc = "Not set; refused by vmafx_frame_import()." },
  { name = "VMAFX_MEMORY_HOST", value = 1, doc = "Host memory the CPU reads: `handle` is the address of the plane's allocation, `offset` the bytes to its first sample." },
  { name = "VMAFX_MEMORY_DEVICE_POINTER", value = 2, doc = "A device pointer (CUDA or HIP device pointer, SYCL USM pointer) in the device's context." },
  { name = "VMAFX_MEMORY_DEVICE_ARRAY", value = 3, doc = "A device array (CUDA array) in the device's context." },
  { name = "VMAFX_MEMORY_DMABUF", value = 4, doc = "A Linux dma-buf: `fd`, `offset`, `pitch`, `modifier` and `size` of the object the plane lives in." },
  { name = "VMAFX_MEMORY_METAL_SURFACE", value = 5, doc = "A shared surface: `handle` is the surface, `plane_index` its plane." },
  { name = "VMAFX_MEMORY_METAL_TEXTURE", value = 6, doc = "A Metal texture per plane: `handle` is the texture." },
  { name = "VMAFX_MEMORY_WIN32_SHARED", value = 7, doc = "A Windows shared texture: `handle` is the shared NT handle, `plane_index` its plane." },
]

[[enums]]
name = "VmafxFenceKind"
header = "vmafx/frame.h"
since = "0.1"
doc = "What a VmafxFence is."
values = [
  { name = "VMAFX_FENCE_NONE", value = 0, doc = "No fence: the work it would order is complete." },
  { name = "VMAFX_FENCE_HOST", value = 1, doc = "A host fence of the library (vmafx_fence_create()): `handle` is the library's object." },
  { name = "VMAFX_FENCE_CUDA_EVENT", value = 2, doc = "A CUDA event (`handle`) of the device's context." },
  { name = "VMAFX_FENCE_HIP_EVENT", value = 3, doc = "A HIP event (`handle`) of the device." },
  { name = "VMAFX_FENCE_SYCL_EVENT", value = 4, doc = "A pointer to a SYCL event (`handle`) of the device's context." },
  { name = "VMAFX_FENCE_SYNC_FILE", value = 5, doc = "A Linux sync_file descriptor (`fd`)." },
  { name = "VMAFX_FENCE_METAL_SHARED_EVENT", value = 6, doc = "A Metal shared event (`handle`) and the value it reaches when signalled (`value`)." },
  { name = "VMAFX_FENCE_WIN32_SHARED", value = 7, doc = "A Windows shared fence (`handle`, an NT handle) and the value it reaches when signalled (`value`)." },
]

[[flags]]
name = "VmafxImportFlags"
header = "vmafx/frame.h"
type = "u32"
since = "0.1"
doc = "How vmafx_frame_import() may bind the producer's memory. 0, the value of a zeroed descriptor, requires zero copy: a layout the device cannot bind is refused, never copied (design section 2.7)."
bits = [
  { name = "VMAFX_IMPORT_ALLOW_COPY", bit = 0, doc = "A layout the device cannot bind may be copied on the device; the copy is logged once per context. Never a host copy of device memory." },
]

[[flags]]
name = "VmafxDeviceFlags"
header = "vmafx/device.h"
type = "u32"
since = "0.1"
doc = "How a device is created."
bits = [
  { name = "VMAFX_DEVICE_PROFILING", bit = 0, doc = "Time every kernel the device runs; read with vmafx_device_profile(). Refused by a device without a kernel profiler (the CPU)." },
]

# ---------------------------------------------------------------------------
# Handles (opaque).

[[handles]]
name = "VmafxContext"
header = "vmafx/context.h"
since = "0.1"
release = "vmafx_context_destroy"
doc = "One scoring session."

[[handles]]
name = "VmafxError"
header = "vmafx/error.h"
since = "0.1"
release = "vmafx_error_free"
doc = "A failure: status, message, the named subject and the engine's errno."

[[handles]]
name = "VmafxOptions"
header = "vmafx/types.h"
since = "0.1"
release = "vmafx_options_free"
doc = "Feature options: string keys and values (the libvmaf feature dictionary)."

[[handles]]
name = "VmafxDevice"
header = "vmafx/device.h"
since = "0.1"
release = "vmafx_device_unref"
doc = "A compute device. Refcounted; frames and contexts hold references."

[[handles]]
name = "VmafxModel"
header = "vmafx/model.h"
since = "0.1"
release = "vmafx_model_unref"
doc = "A loaded model. Refcounted; a context that uses it holds a reference (ADR-1755)."

[[handles]]
name = "VmafxModelSet"
header = "vmafx/model.h"
since = "0.1"
release = "vmafx_model_set_unref"
doc = "A bootstrap model set: a lead model and its member models. Refcounted."

[[handles]]
name = "VmafxFrame"
header = "vmafx/frame.h"
since = "0.1"
release = "vmafx_frame_unref"
doc = "Pixels of one picture on a device. Refcounted; one frame may be submitted to several contexts."

[[handles]]
name = "VmafxFramePool"
header = "vmafx/frame.h"
since = "0.1"
release = "vmafx_frame_pool_destroy"
doc = "Frames of one geometry allocated once on a device and reused (RC4 WP3). A frame returns to its pool when its last reference is dropped."

# ---------------------------------------------------------------------------
# Callbacks.

[[callbacks]]
name = "VmafxLogCallback"
header = "vmafx/types.h"
returns = "void"
since = "0.1"
doc = "Receives log messages: `level` is a VmafxLogLevel, `message` one line without its newline, valid during the call. Runs on the thread that raised the message, a library worker thread included, and may run on several threads at once: it must be thread-safe and must not call back into the context."
params = [
  { name = "level", type = "u32", pass = "in" },
  { name = "message", type = "cstr", pass = "in" },
  { name = "user", type = "ptr", pass = "in" },
]

[[callbacks]]
name = "VmafxFrameReleaseCallback"
header = "vmafx/frame.h"
returns = "void"
since = "0.1"
doc = "Called once, on any thread, when the library has stopped reading the planes of a wrapped host frame."
params = [
  { name = "user", type = "ptr", pass = "in" },
]

# ---------------------------------------------------------------------------
# Structs.

[[structs]]
name = "VmafxContextConfig"
header = "vmafx/context.h"
since = "0.1"
sized = true
doc = "Context configuration. Initialise with VMAFX_CONTEXT_CONFIG_INIT."
fields = [
  { name = "log_level", type = "u32", enum = "VmafxLogLevel", doc = "Log verbosity." },
  { name = "n_threads", type = "u32", doc = "Worker threads; 0 runs extractors on the calling thread." },
  { name = "n_subsample", type = "u32", doc = "Score every n-th frame; 0 and 1 score every frame." },
  { name = "cpumask", type = "u64", doc = "CPU instruction-set bits to disable." },
  { name = "gpumask", type = "u64", doc = "GPU dispatch bits to disable." },
  { name = "log_callback", type = "VmafxLogCallback", doc = "Receives every message the library raises for this context at or below `log_level`, on the calling thread and on the context's worker threads, and every failure reported without an error out-parameter; nothing of the context then reaches the process log (ADR-1906). NULL: the process log (stderr), whose level the context then sets, as vmaf_init() does. Added in ABI 0.1.1." },
  { name = "log_user", type = "ptr", doc = "Passed to `log_callback`. Added in ABI 0.1.1." },
]

[[structs]]
name = "VmafxProvenance"
header = "vmafx/provenance.h"
since = "0.1"
sized = true
doc = "How the scores of a context are made (#2142). Strings live as long as the context."
fields = [
  { name = "abi_major", type = "u32", doc = "ABI major version of the library that ran." },
  { name = "abi_minor", type = "u32", doc = "ABI minor version." },
  { name = "abi_patch", type = "u32", doc = "ABI patch version." },
  { name = "active_backend", type = "u32", enum = "VmafxBackend", doc = "Backend imported into the context." },
  { name = "n_extractors", type = "u32", doc = "Registered feature extractors; see vmafx_context_extractor_info()." },
  { name = "version", type = "cstr", doc = "Build version (git describe)." },
]

[[structs]]
name = "VmafxExtractorInfo"
header = "vmafx/context.h"
since = "0.1"
sized = true
doc = "One registered feature extractor."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend the extractor runs on." },
  { name = "name", type = "cstr", doc = "Extractor name (for example `psnr`, `adm_cuda`)." },
]

[[structs]]
name = "VmafxScore"
header = "vmafx/score.h"
since = "0.1"
sized = true
doc = "One score and the extractor that produced it."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the producing extractor (CPU when none is registered)." },
  { name = "index", type = "u64", doc = "Frame index." },
  { name = "value", type = "f64", doc = "Score." },
  { name = "feature", type = "cstr", doc = "Feature name as requested." },
  { name = "extractor", type = "cstr", doc = "Registered extractor that declares the feature, or NULL (imported scores, option-decorated names until WP5)." },
]

[[structs]]
name = "VmafxFeatureResolution"
header = "vmafx/context.h"
since = "0.1"
sized = true
doc = "Which extractor computes a feature on a context (ADR-1359). Strings live for the process lifetime."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of `extractor`." },
  { name = "extractor", type = "cstr", doc = "Extractor that computes the feature: the CPU extractor on a context without a device backend, else its device twin." },
  { name = "unsupported_option", type = "cstr", doc = "The option the twin cannot honour when the call returns VMAFX_E_NOTSUP, else NULL." },
]

[[structs]]
name = "VmafxDeviceDesc"
header = "vmafx/device.h"
since = "0.1"
sized = true
doc = "Which device to create. Initialise with VMAFX_DEVICE_DESC_INIT."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the device; this release creates CPU devices only." },
  { name = "index", type = "i32", doc = "Device index within the backend (see vmafx_device_count()); -1: any device of the backend. Ignored when `external[0]` is set." },
  { name = "flags", type = "u32", flags = "VmafxDeviceFlags", doc = "How to create the device. Added in ABI 0.1.2." },
  { name = "external", type = "uptr", count = 2, doc = "The caller's runtime objects, which stay the caller's and must outlive the device: CUDA context and stream, SYCL queue and 0, HIP device and stream, Metal device and command queue. 0: the library creates its own. The CPU takes none. Added in ABI 0.1.2." },
]

[[structs]]
name = "VmafxDeviceInfo"
header = "vmafx/device.h"
since = "0.1"
sized = true
doc = "What a device is and what it imports. Grows at the end: the format envelope of each device (largest frame, bit depths, chroma layouts; PR #2185) is appended by the generated capability tables of RC6 / RC7. Strings live for the process lifetime."
fields = [
  { name = "backend", type = "u32", enum = "VmafxBackend", doc = "Backend of the device." },
  { name = "index", type = "i32", doc = "Device index within the backend; -1 for a device made from external handles." },
  { name = "flags", type = "u32", flags = "VmafxDeviceFlags", doc = "Flags the device was created with; 0 for an enumerated device." },
  { name = "memory_kinds", type = "u32", doc = "Bit `1 << k` set for each VmafxMemoryKind `k` vmafx_frame_import() binds on this device." },
  { name = "fence_kinds", type = "u32", doc = "Bit `1 << k` set for each VmafxFenceKind `k` the device waits on and returns as a release fence." },
  { name = "total_memory", type = "u64", doc = "Bytes of device memory; 0 when the backend does not report it (the CPU)." },
  { name = "name", type = "cstr", doc = "Name of the device as its runtime reports it (`cpu` for the CPU)." },
]

[[structs]]
name = "VmafxFence"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "A synchronisation point between the producer of a frame and the library. Passed by pointer; embedded by value in VmafxFrameImport, so it never grows. A fence the library returns (vmafx_fence_create(), vmafx_frame_release_fence()) belongs to the caller, who releases it once with vmafx_fence_destroy(). Initialise with VMAFX_FENCE_INIT."
fields = [
  { name = "kind", type = "u32", enum = "VmafxFenceKind", doc = "What the fence is; the other fields are read as the kind says." },
  { name = "handle", type = "uptr", doc = "Event, shared-event, shared-fence or host-fence object; 0 when the kind has none." },
  { name = "value", type = "u64", doc = "Value a timeline fence (METAL_SHARED_EVENT, WIN32_SHARED) reaches when signalled; 0 otherwise." },
  { name = "fd", type = "i32", doc = "sync_file descriptor for SYNC_FILE; ignored otherwise." },
  { name = "reserved", type = "u32", doc = "0." },
]

[[structs]]
name = "VmafxImportPlane"
header = "vmafx/frame.h"
since = "0.1"
sized = false
doc = "Where one plane of an imported frame lives. Embedded by value in VmafxFrameImport: never grows. Fields a memory kind does not use are ignored."
fields = [
  { name = "handle", type = "uptr", doc = "Address, device pointer, array, surface, texture or shared handle, as VmafxMemoryKind says." },
  { name = "fd", type = "i32", doc = "dma-buf descriptor for DMABUF memory (the library duplicates it); ignored otherwise." },
  { name = "plane_index", type = "u32", doc = "Plane of a multi-plane object (surface, shared texture, dma-buf layer)." },
  { name = "offset", type = "u64", doc = "Bytes from the start of the memory to the plane's first sample." },
  { name = "pitch", type = "u64", doc = "Bytes from one row to the next, at least the bytes of a row." },
  { name = "modifier", type = "u64", doc = "Format modifier of the memory layout; 0 is linear. A modifier the device cannot read is refused naming the plane." },
  { name = "size", type = "u64", doc = "Bytes of the memory object the plane lives in; 0: not given (needed by DMABUF imports). When set, every row of the plane must lie inside it." },
]

[[structs]]
name = "VmafxFrameImport"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "A frame the producer already holds in memory a device reads (design section 2.7). Initialise with VMAFX_FRAME_IMPORT_INIT."
fields = [
  { name = "memory", type = "u32", enum = "VmafxMemoryKind", doc = "What each plane's handle refers to." },
  { name = "pix_fmt", type = "u32", enum = "VmafxPixelFormat", doc = "Layout of the producer's planes; NV12, P010 and P016 are converted to planar on the device (a de-interleave, and for P010 a shift), nothing else." },
  { name = "bpc", type = "u32", doc = "Bits per component: 8 for NV12, 10 for P010, 16 for P016, 8 to 16 for the planar formats." },
  { name = "w", type = "u32", doc = "Luma width in pixels." },
  { name = "h", type = "u32", doc = "Luma height in pixels." },
  { name = "n_planes", type = "u32", doc = "Planes in `plane`: 1 for YUV400P, 2 for NV12 / P010 / P016 (luma, interleaved chroma), else 3." },
  { name = "plane", type = "VmafxImportPlane", count = 3, doc = "Each plane; entries past `n_planes` are ignored." },
  { name = "acquire", type = "VmafxFence", doc = "Signalled when the producer has written the planes. Borrowed for the call: the library takes what it needs (a reference, a duplicated descriptor, a device-side wait). NONE: the planes are written." },
  { name = "flags", type = "u32", flags = "VmafxImportFlags", doc = "0: zero copy only." },
]

[[structs]]
name = "VmafxModelConfig"
header = "vmafx/model.h"
since = "0.1"
sized = true
doc = "How to load a model. Initialise with VMAFX_MODEL_CONFIG_INIT."
fields = [
  { name = "name", type = "cstr", doc = "Name of the model's scores (copied); NULL: `vmaf`." },
  { name = "flags", type = "u64", flags = "VmafxModelFlags", doc = "Load flags; 0 keeps the model file's defaults." },
  { name = "log_level", type = "u32", enum = "VmafxLogLevel", doc = "Level of the messages `log_callback` receives." },
  { name = "log_callback", type = "VmafxLogCallback", doc = "Receives the messages raised while loading (a model belongs to no context) at or below `log_level`, and a load failure reported without an error out-parameter; NULL: the process log." },
  { name = "log_user", type = "ptr", doc = "Passed to `log_callback`." },
]

[[structs]]
name = "VmafxFrameDesc"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "Geometry of a frame. Initialise with VMAFX_FRAME_DESC_INIT."
fields = [
  { name = "pix_fmt", type = "u32", enum = "VmafxPixelFormat", doc = "Pixel layout." },
  { name = "bpc", type = "u32", doc = "Bits per component, 8 to 16; above 8 a sample is a little-endian uint16_t." },
  { name = "w", type = "u32", doc = "Luma width in pixels." },
  { name = "h", type = "u32", doc = "Luma height in pixels." },
]

[[structs]]
name = "VmafxHostPlanes"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "Caller-owned host planes a frame borrows. Initialise with VMAFX_HOST_PLANES_INIT."
fields = [
  { name = "data", type = "ptr", count = 3, doc = "First sample of each plane; planes the format does not have are NULL." },
  { name = "stride", type = "u64", count = 3, doc = "Bytes from one row to the next, at least the row's bytes." },
  { name = "release", type = "VmafxFrameReleaseCallback", doc = "Called once when the library no longer reads the planes; NULL: the caller keeps the planes valid until it destroys every context the frame was submitted to." },
  { name = "user", type = "ptr", doc = "Passed to `release`." },
]

[[structs]]
name = "VmafxFramePlanes"
header = "vmafx/frame.h"
since = "0.1"
sized = true
doc = "Where the samples of a frame are. The data pointers live as long as the frame."
fields = [
  { name = "pix_fmt", type = "u32", enum = "VmafxPixelFormat", doc = "Pixel layout." },
  { name = "bpc", type = "u32", doc = "Bits per component." },
  { name = "n_planes", type = "u32", doc = "Planes in use: 1 for YUV400P, else 3." },
  { name = "w", type = "u32", count = 3, doc = "Width of each plane in samples." },
  { name = "h", type = "u32", count = 3, doc = "Height of each plane in rows." },
  { name = "stride", type = "u64", count = 3, doc = "Bytes from one row to the next." },
  { name = "data", type = "ptr", count = 3, doc = "First sample of each plane; NULL past `n_planes`." },
]

[[structs]]
name = "VmafxPooledScore"
header = "vmafx/score.h"
since = "0.1"
sized = true
doc = "A score pooled over a range of frames."
fields = [
  { name = "pool", type = "u32", enum = "VmafxPool", doc = "Pooling method." },
  { name = "first", type = "u64", doc = "First frame index (inclusive)." },
  { name = "last", type = "u64", doc = "Last frame index (inclusive)." },
  { name = "value", type = "f64", doc = "Pooled score." },
  { name = "feature", type = "cstr", doc = "The model's name (lives as long as the model) or the `feature` argument as passed." },
]

[[structs]]
name = "VmafxModelSetScore"
header = "vmafx/score.h"
since = "0.1"
sized = true
doc = "The bootstrap score of a model set at one frame or pooled over frames."
fields = [
  { name = "pool", type = "u32", enum = "VmafxPool", doc = "Pooling method; VMAFX_POOL_NONE for a per-frame score." },
  { name = "first", type = "u64", doc = "First frame index (the frame of a per-frame score)." },
  { name = "last", type = "u64", doc = "Last frame index (inclusive)." },
  { name = "bagging", type = "f64", doc = "Mean of the member models' scores." },
  { name = "stddev", type = "f64", doc = "Standard deviation of the member models' scores." },
  { name = "ci95_lo", type = "f64", doc = "Lower bound of the 95% confidence interval." },
  { name = "ci95_hi", type = "f64", doc = "Upper bound of the 95% confidence interval." },
  { name = "name", type = "cstr", doc = "Name of the model set; lives as long as the set." },
]

