header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Score frame `index` from `reference` and `distorted`. Consumes one reference of each frame on every path, failures included (the same frame as both inputs needs two); a frame submitted to several contexts needs one reference per submit and is never copied. Indices increase strictly and every frame keeps the first frame's geometry."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "reference", type = "VmafxFrame", pass = "in" },
  { name = "distorted", type = "VmafxFrame", pass = "in" },
  { name = "index", type = "u64", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_flush"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Finish every submitted frame; scores of the last frames (motion) become final. A context is flushed once; a second flush or a submit after it is VMAFX_E_INVALID."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

