  { name = "frame", type = "VmafxFrame", pass = "in" },
]

[[functions]]
name = "vmafx_frame_unref"
header = "vmafx/frame.h"
since = "0.1"
returns = "void"
doc = "Drop one reference; the last one, the caller's or a context's, frees the planes or calls the release callback. NULL is a no-op."
