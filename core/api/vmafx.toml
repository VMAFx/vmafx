[[functions]]
name = "vmafx_context_frame_retention"
header = "vmafx/context.h"
since = "0.1"
returns = "u32"
doc = "How many earlier reference frames the context keeps after vmafx_submit() returns: 1 (frame n-1), or 2 when a registered extractor reads frame n-2 (ADR-1478). With worker threads, up to `n_threads` further frames of each input stay in flight until their work finishes. 0 for NULL."
params = [
  { name = "context", type = "VmafxContext", pass = "in_const" },
]

[[functions]]
