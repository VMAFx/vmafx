  { name = "bpc", type = "u32", doc = "Bits per component, 8 to 16; above 8 a sample is a little-endian uint16_t." },
  { name = "w", type = "u32", doc = "Luma width in pixels." },
  { name = "h", type = "u32", doc = "Luma height in pixels." },
]

[[structs]]
