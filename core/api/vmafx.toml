header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Register the extractors of every member of `set` and mount the members. The context takes a reference to the set until it is destroyed. A set whose name another set of the context already has is refused with VMAFX_E_INVALID naming it."
