  { name = "frame", type = "VmafxFrame", pass = "in", nullable = true },
]

# ---------------------------------------------------------------------------
# Device frames, fences, pools and admission (RC4 WP3 common lane, design
# section 2.7, ADR-1829). One frame reference is one count of the engine
# picture's reference counter for imported frames too (ADR-1906 item 4).

[[functions]]
name = "vmafx_frame_import"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "A frame on memory the producer holds, without a host copy. Planar layouts are bound as they are; NV12 / P010 / P016 are converted to planar on the device. A layout the device cannot bind is VMAFX_E_NOTSUP naming the memory kind, pixel format, modifier and plane; an acquire fence the device cannot wait on yet is VMAFX_E_BUSY (vmafx_context_import_frame() waits and retries once). The producer's memory stays valid and unchanged until the frame's release fence is signalled. The caller holds one reference."
params = [
  { name = "device", type = "VmafxDevice", pass = "in" },
  { name = "desc", type = "VmafxFrameImport", pass = "in" },
  { name = "out", type = "VmafxFrame", pass = "out_handle" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_release_fence"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "A fence of `kind` signalled once the last reference of the frame is gone, in every context it was submitted to: from then on the library reads none of its memory and the producer may reuse it. Call it while holding a reference, before the frame is submitted; each call returns a new fence the caller destroys. A kind the frame's device cannot signal is VMAFX_E_NOTSUP naming it."
params = [
  { name = "frame", type = "VmafxFrame", pass = "in" },
  { name = "kind", type = "u32", pass = "in" },
  { name = "out", type = "VmafxFence", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_fence_create"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "A new, unsignalled fence of `kind` on `device` (NULL: the CPU) for a producer to signal, for example a HOST fence a producer thread signals with vmafx_fence_signal() after writing a frame. The caller destroys it."
params = [
  { name = "device", type = "VmafxDevice", pass = "in", nullable = true },
  { name = "kind", type = "u32", pass = "in" },
  { name = "out", type = "VmafxFence", pass = "out" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_fence_signal"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "Signal a fence from the host (HOST; a timeline kind to its `value`). A kind the host cannot signal is VMAFX_E_NOTSUP naming it."
params = [
  { name = "fence", type = "VmafxFence", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_fence_wait"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "Wait on the host until the fence is signalled: VMAFX_OK, or VMAFX_E_TIMEOUT naming the fence after `timeout_ns` nanoseconds (UINT64_MAX waits without a limit). `timeout_ns` 0 polls: an unsignalled fence is VMAFX_PENDING, an answer without an error or a log line. NONE is signalled. A kind this build cannot wait on is VMAFX_E_NOTSUP naming it."
params = [
  { name = "fence", type = "VmafxFence", pass = "in" },
  { name = "timeout_ns", type = "u64", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_fence_destroy"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "Release a fence the library returned: drop its reference to a host fence, destroy an event it created, close a descriptor it opened. Once per fence; NONE is a no-op. A kind this build cannot release is VMAFX_E_NOTSUP naming it."
params = [
  { name = "fence", type = "VmafxFence", pass = "in" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_pool_create"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "Allocate `count` frames of geometry `desc` on `device` (NULL: the CPU) once (the successor of vmaf_preallocate_pictures). Size a pool for a context with vmafx_context_frame_retention()."
params = [
  { name = "device", type = "VmafxDevice", pass = "in", nullable = true },
  { name = "desc", type = "VmafxFrameDesc", pass = "in" },
  { name = "count", type = "u32", pass = "in" },
  { name = "out", type = "VmafxFramePool", pass = "out_handle" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_pool_acquire"
header = "vmafx/frame.h"
since = "0.1"
returns = "status"
doc = "A free frame of the pool, with one reference the caller holds; its planes keep their previous content. VMAFX_E_BUSY when every frame is in use (a transient status: a frame returns when its last reference is dropped)."
params = [
  { name = "pool", type = "VmafxFramePool", pass = "in" },
  { name = "out", type = "VmafxFrame", pass = "out_handle" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_frame_pool_destroy"
header = "vmafx/frame.h"
since = "0.1"
returns = "void"
doc = "Drop the caller's reference to the pool. Frames still in use stay valid; the pool is freed when the last of them returns. NULL is a no-op."
params = [
  { name = "pool", type = "VmafxFramePool", pass = "in", nullable = true },
]

[[functions]]
name = "vmafx_context_admit"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Whether every extractor registered on the context can read `frame` where it lives, without a host copy (ADR-1688 generalised). VMAFX_E_NOTSUP names each refusing extractor and why; vmafx_submit() makes the same check before it counts a frame."
params = [
  { name = "context", type = "VmafxContext", pass = "in_const" },
  { name = "frame", type = "VmafxFrame", pass = "in_const" },
  { name = "error", type = "VmafxError", pass = "error" },
]

[[functions]]
name = "vmafx_context_import_frame"
header = "vmafx/context.h"
since = "0.1"
returns = "status"
doc = "Import a frame for `context` under the import rule (ADR-1852 decision D8): vmafx_frame_import() and vmafx_context_admit(); a transient failure (VMAFX_E_BUSY, VMAFX_E_TIMEOUT) is retried once after a host wait on `desc.acquire`; a second failure or any other one fails naming the backend, device, `input` (for example `main` or `reference`), memory kind, pixel format, modifiers and the refusing extractors. Never falls back to a host copy."
params = [
  { name = "context", type = "VmafxContext", pass = "in" },
  { name = "device", type = "VmafxDevice", pass = "in" },
  { name = "desc", type = "VmafxFrameImport", pass = "in" },
  { name = "input", type = "cstr", pass = "in", nullable = true },
  { name = "out", type = "VmafxFrame", pass = "out_handle" },
  { name = "error", type = "VmafxError", pass = "error" },
]

