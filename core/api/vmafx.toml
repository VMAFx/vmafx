  { name = "VMAFX_PIXEL_FORMAT_YUV422P", value = 2, doc = "4:2:2, chroma halved horizontally (rounded up)." },
  { name = "VMAFX_PIXEL_FORMAT_YUV444P", value = 3, doc = "4:4:4, no chroma subsampling." },
  { name = "VMAFX_PIXEL_FORMAT_YUV400P", value = 4, doc = "Luma only." },
  { name = "VMAFX_PIXEL_FORMAT_NV12", value = 16, doc = "4:2:0, a luma plane and one plane of interleaved Cb/Cr bytes; vmafx_frame_import() only, the frame it makes is YUV420P at 8 bits. Added in ABI 0.1.2." },
  { name = "VMAFX_PIXEL_FORMAT_P010", value = 17, doc = "NV12 with 16-bit little-endian samples whose 10 bits are the most significant; vmafx_frame_import() only, the frame it makes is YUV420P at 10 bits (each sample shifted down by 6, ADR-1679). Added in ABI 0.1.2." },
  { name = "VMAFX_PIXEL_FORMAT_P016", value = 18, doc = "NV12 with 16-bit little-endian samples; vmafx_frame_import() only, the frame it makes is YUV420P at 16 bits. Added in ABI 0.1.2." },
]

[[enums]]
