type = "u64"
since = "0.1"
doc = "Model load flags (bit values equal enum VmafModelFlags)."
bits = [
  { name = "VMAFX_MODEL_DISABLE_CLIP", bit = 0, doc = "Do not clip the score to the model's range." },
  { name = "VMAFX_MODEL_ENABLE_TRANSFORM", bit = 1, doc = "Apply the model's score transform." },
  { name = "VMAFX_MODEL_DISABLE_TRANSFORM", bit = 2, doc = "Do not apply the model's score transform." },
]

# Device frames and fences (RC4 WP3, ADR-1852 design section 2.7). Every
# kind is declared now so the backend lanes fill in implementations without
# changing the ABI; the CPU device implements HOST memory and NONE / HOST
# fences.

[[enums]]
name = "VmafxMemoryKind"
header = "vmafx/frame.h"
since = "0.1"
doc = "What a VmafxImportPlane handle refers to."
values = [
  { name = "VMAFX_MEMORY_NONE", value = 0, doc = "Not set; refused by vmafx_frame_import()." },
  { name = "VMAFX_MEMORY_HOST", value = 1, doc = "Host memory the CPU reads: `handle` is the address of the plane's allocation, `offset` the bytes to its first sample." },
  { name = "VMAFX_MEMORY_DEVICE_POINTER", value = 2, doc = "A device pointer (CUDA or HIP device pointer, SYCL USM pointer) in the device's context." },
  { name = "VMAFX_MEMORY_DEVICE_ARRAY", value = 3, doc = "A device array (CUDA or HIP array) in the device's context." },
  { name = "VMAFX_MEMORY_DMABUF", value = 4, doc = "A Linux dma-buf: `fd`, `offset`, `pitch`, `modifier` and `size` of the object the plane lives in." },
  { name = "VMAFX_MEMORY_METAL_SURFACE", value = 5, doc = "A shared surface: `handle` is the surface, `plane_index` its plane." },
  { name = "VMAFX_MEMORY_METAL_TEXTURE", value = 6, doc = "A Metal texture per plane: `handle` is the texture." },
  { name = "VMAFX_MEMORY_WIN32_SHARED", value = 7, doc = "A Windows shared texture: `handle` is the shared NT handle, `plane_index` its plane." },
  { name = "VMAFX_MEMORY_GL_TEXTURE", value = 8, doc = "An OpenGL 2D texture (`GL_TEXTURE_2D`) of the GL context current on the calling thread: `handle` is the texture name, one texture per plane (NV12: an R8 luma and an RG8 chroma texture). Imported on a device of a backend with GL interop (CUDA; HIP through EGL dma-buf export from an EGL context of the device's GPU, ADR-2132). Added in ABI 0.1.7." },
]

[[enums]]
name = "VmafxFenceKind"
header = "vmafx/frame.h"
since = "0.1"
doc = "What a VmafxFence is."
values = [
  { name = "VMAFX_FENCE_NONE", value = 0, doc = "No fence: the work it would order is complete." },
  { name = "VMAFX_FENCE_HOST", value = 1, doc = "A host fence of the library (vmafx_fence_create()): `handle` is the library's object." },
  { name = "VMAFX_FENCE_CUDA_EVENT", value = 2, doc = "A CUDA event (`handle`) of the device's context." },
  { name = "VMAFX_FENCE_HIP_EVENT", value = 3, doc = "A HIP event (`handle`) of the device." },
  { name = "VMAFX_FENCE_SYCL_EVENT", value = 4, doc = "A pointer to a SYCL event (`handle`) of the device's context." },
  { name = "VMAFX_FENCE_SYNC_FILE", value = 5, doc = "A Linux sync_file descriptor (`fd`), borrowed: an acquire fence a device without a kernel-scheduled queue checks on the host (HIP)." },
  { name = "VMAFX_FENCE_METAL_SHARED_EVENT", value = 6, doc = "A Metal shared event (`handle`) and the value it reaches when signalled (`value`)." },
  { name = "VMAFX_FENCE_WIN32_SHARED", value = 7, doc = "A Windows shared fence (`handle`, an NT handle) and the value it reaches when signalled (`value`)." },
  { name = "VMAFX_FENCE_GL_SYNC", value = 8, doc = "An OpenGL sync object (`handle`, a `GLsync`) of the GL context current on the calling thread, or of a context sharing objects with it; an acquire fence of VMAFX_MEMORY_GL_TEXTURE imports. Added in ABI 0.1.7." },
]

[[flags]]
name = "VmafxImportFlags"
header = "vmafx/frame.h"
type = "u32"
since = "0.1"
doc = "How vmafx_frame_import() may bind the producer's memory. 0, the value of a zeroed descriptor, requires zero copy: a layout the device cannot bind is refused, never copied (design section 2.7)."
bits = [
  { name = "VMAFX_IMPORT_ALLOW_COPY", bit = 0, doc = "A layout the device cannot bind may be copied on the device; the copy is logged once per context. Never a host copy of device memory." },
]

[[flags]]
name = "VmafxDeviceFlags"
header = "vmafx/device.h"
type = "u32"
since = "0.1"
doc = "How a device is created."
bits = [
  { name = "VMAFX_DEVICE_PROFILING", bit = 0, doc = "Time every kernel the device runs; read with vmafx_device_profile(). Refused by a device without a kernel profiler (the CPU)." },
]

# Provenance and reports (RC4 WP5, #2142).

[[enums]]
name = "VmafxFeatureSource"
header = "vmafx/provenance.h"
since = "0.1"
doc = "Where the scores of a feature come from. Added in ABI 0.1.5."
values = [
  { name = "VMAFX_FEATURE_SOURCE_UNKNOWN", value = 0, doc = "Not recorded (a feature written outside an extractor, a model and an import)." },
  { name = "VMAFX_FEATURE_SOURCE_EXTRACTOR", value = 1, doc = "Computed by a registered feature extractor." },
  { name = "VMAFX_FEATURE_SOURCE_IMPORTED", value = 2, doc = "Computed outside the library and recorded with vmafx_context_import_score()." },
  { name = "VMAFX_FEATURE_SOURCE_MODEL", value = 3, doc = "Predicted by a mounted model from other features." },
]

[[enums]]
name = "VmafxReportFormat"
header = "vmafx/report.h"
since = "0.1"
doc = "Format of a report (values equal enum VmafOutputFormat). Added in ABI 0.1.5."
values = [
  { name = "VMAFX_REPORT_FORMAT_XML", value = 1, doc = "XML; carries a `<provenance>` element." },
  { name = "VMAFX_REPORT_FORMAT_JSON", value = 2, doc = "JSON; carries a `provenance` object." },
  { name = "VMAFX_REPORT_FORMAT_CSV", value = 3, doc = "CSV; columns unchanged, provenance in the sidecar when asked." },
  { name = "VMAFX_REPORT_FORMAT_SUB", value = 4, doc = "Subtitles; lines unchanged, provenance in the sidecar when asked." },
]

[[flags]]
name = "VmafxReportFlags"
header = "vmafx/report.h"
type = "u32"
since = "0.1"
doc = "How vmafx_report_write() writes a report. Added in ABI 0.1.5."
bits = [
  { name = "VMAFX_REPORT_PROVENANCE_SIDECAR", bit = 0, doc = "Also write the provenance record to `<path>.provenance.json` (any format; CSV and SUB carry it nowhere else)." },
]

[[flags]]
name = "VmafxProvenanceJsonFlags"
header = "vmafx/provenance.h"
type = "u32"
since = "0.1"
doc = "Which form of the record vmafx_context_provenance_json() returns. Added in ABI 0.1.5."
bits = [
  { name = "VMAFX_PROVENANCE_JSON_CANONICAL", bit = 0, doc = "The bytes the digest covers: the record without `digest` and `elapsed_ns` (RFC 8785 form either way)." },
]

