[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "vmafx"
dynamic = ["version"]
description = "ctypes binding for the VMAFx C API (standard library only)."
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSES/*"]
authors = [{ name = "Lusoris", email = "lusoris@pm.me" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.dev/api/vmafx/bindings/"
Issues = "https://github.com/VMAFx/vmafx/issues"

[tool.hatch.version]
path = "vmafx/_api.py"

[tool.hatch.build.targets.wheel]
packages = ["vmafx"]

[tool.setuptools.packages.find]
include = ["vmafx*"]

[tool.setuptools.package-data]
vmafx = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "vmafx._api.__version__" }
