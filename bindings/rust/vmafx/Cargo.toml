[package]
name = "vmafx"
# Crate version - independently versioned on purpose (ADR-1127, reaffirmed by
# ADR-1151). The Rust crates are not published from the release pipeline and
# carry no x-release-please-version marker; the fork's product releases
# (0.1.0 first, ADR-3292) do not reset them.
version = "0.1.0"
edition.workspace = true
description = "Safe, idiomatic Rust bindings to libvmaf (VMAFX fork) — Phase 1 scaffold (ADR-0929)"
license = "EUPL-1.2"
authors = ["Lusoris <lusoris@pm.me>"]
repository = "https://github.com/VMAFx/vmafx"
keywords = ["video", "vmaf", "quality", "ffmpeg", "ffi"]
categories = ["api-bindings", "multimedia::video"]
readme = "README.md"

[lib]
name = "vmafx"

[dependencies]
vmafx-sys = { path = "../vmafx-sys", version = "0.1.0" }

[dev-dependencies]

[features]
default = []
