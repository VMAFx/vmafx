[package]
name = "vmafx-sys"
# Crate version - independently versioned on purpose (ADR-1127, reaffirmed by
# ADR-1151). The Rust crates are not published from the release pipeline and
# carry no x-release-please-version marker; the fork's 1.0.0 product release
# does not reset them.
version = "0.1.0"
description = "Raw FFI bindings to libvmaf (VMAFX fork)"
# Workspace inheritance keeps repository / homepage / documentation /
# license / authors / edition / readme aligned with the [workspace.package]
# block in the root Cargo.toml. See ADR-0702 (vmafx-sys FFI crate).
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
links = "vmaf"
build = "build.rs"

[lib]
# Doc-tests are disabled for this *-sys crate because the generated
# bindings.rs is produced by bindgen from libvmaf.h C comments verbatim.
# Those comments contain C idioms ("On x86 / x86_64:", backtick-wrapped
# code references) that are not valid Rust doc-test code.  Unit tests and
# integration tests run normally; only doc-tests are suppressed here.
doctest = false

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]

[package.metadata.cargo-machete]
# bindgen is consumed by build.rs to generate FFI bindings against
# libvmaf.h. cargo-machete's --with-metadata mode does not introspect
# build.rs symbol usage and flags it as unused; pin the ignore so
# future audits stay clean. See ADR-0702 (vmafx-sys FFI crate).
ignored = ["bindgen"]
