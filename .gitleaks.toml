title = "VMAF fork gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "VMAF-specific false positives"
# NOTE: gitleaks 8.24.3 evaluates allowlist `paths` regex against the
# scanned file's *absolute* path (e.g. /repo/ai/src/...) when --source
# is an absolute directory, so leading `^` only matches files directly
# at the source root (e.g. `^go\.sum$` works because go.sum is at /).
# Subdirectory patterns must omit the leading `^` to match correctly;
# we keep the trailing `$` where exact-match is desired and use
# unanchored substring matches otherwise.
paths = [
  '''subprojects/''',
  '''python/test/resource/''',
  '''testdata/.*\.(yuv|y4m|mp4|json)$''',
  '''model/.*\.(json|pkl|onnx)$''',
  '''ai/src/vmaf_train/data/manifests/README\.md$''',
  '''/\.git/''',
  '''/build/''',
  '''/builddir.*/''',
  # go.sum / Cargo.lock — package-manager integrity manifests that consist
  # entirely of base64-encoded SHA-256 hashes (go.sum h1: prefix) and
  # hex SHA-256 checksums (Cargo.lock). The high-entropy strings trigger
  # gitleaks' generic-api-key rule as false positives.
  '''/go\.sum$''',
  '''/Cargo\.lock$''',
  # Generated Go protobuf stubs contain long base64-encoded descriptor
  # bytes (google.protobuf.FileDescriptorProto serialised) that trip the
  # generic-api-key entropy gate. The files are auto-generated by protoc
  # and reviewed via proto schema changes, not via the raw binary blobs.
  '''gen/go/.*\.pb\.go$''',
]

regexes = [
  '''0{8,}''',
  '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  '''vmaf_v\d+\.\d+\.\d+''',
  # GHA cache keys for the fixture-cache PR — match
  # `vmaf-fixtures-{yuv,resource}-v\d+` strings the
  # `generic-api-key` rule flags as high-entropy.
  '''vmaf-fixtures-[a-z]+-v\d+''',
  # go.sum integrity hashes — h1:<base64> is a SHA-256 over the zip,
  # not a credential.  The base64 charset without the trailing '=' or
  # with leading 'h1:' is reliably distinguishable.
  '''h1:[A-Za-z0-9+/]{43}={0,2}''',
]

stopwords = [
  "REPLACE_WITH_YOUR",
  "your-api-key",
  "example.com",
  "EXAMPLE",
  # Intel offline installer URL segment — not a credential.
  "IRC_NAS",
  "registrationcenter-download",
  # Go module proxy hash — not a credential.
  "checksum",
  "go.mod",
]

[[rules]]
id = "vmaf-no-cosign-private-key"
description = "A cosign private key must never enter the repo (we use keyless OIDC)."
regex = '''-----BEGIN ENCRYPTED COSIGN PRIVATE KEY-----'''
tags = ["key", "cosign"]
