[project]
name = "vmaf-dev-llm"
version = "1.0.0-rc.3" # x-release-please-version
description = "Local LLM dev helpers for the VMAFx fork (Ollama-first)."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2 AND BSD-2-Clause-Patent"
license-files = ["LICENSES/*"]
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = [
  "typer>=0.27.2",
  "rich>=15.0.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.10", "mypy>=2.4.0"]
# `vmaf-dev-llm modelcard` reads the ONNX graph and, with --features, scores the
# model on a parquet split. Its development lock includes this extra so the
# fact-collector tests run instead of skipping.
modelcard = [
  # onnx 1.23 writes IR version 14 by default; onnxruntime 1.30 loads at most
  # IR 13 (the same cap as tools/ensemble-training-kit).
  "onnx>=1.22.0,<1.23",
  "onnxruntime>=1.30.0",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pyarrow>=25.0.1",
  "scipy>=1.18.1",
]
cloud = [
  "anthropic>=1.11.0",
  "openai>=3.24.0",
]

[project.scripts]
vmaf-dev-llm = "vmaf_dev_llm.cli:app"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.dev/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmaf_dev_llm"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
