[project]
name = "vmaf-dev-llm"
version = "0.1.0"
description = "Local LLM dev helpers for the Lusoris VMAF fork (Ollama-first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause-Patent" }
authors = [
  { name = "Lusoris", email = "lusoris@pm.me" },
]
dependencies = [
  "typer>=0.27.1",
  "rich>=15.0.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.15.18", "mypy>=2.3.1"]
cloud = [
  "anthropic>=1.1.0",
  "openai>=3.5.0",
]

[project.scripts]
vmaf-dev-llm = "vmaf_dev_llm.cli:app"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmaf_dev_llm"]

[tool.hatch.build.targets.wheel.force-include]
"src/vmaf_dev_llm/prompts" = "vmaf_dev_llm/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
