# Centralizes Python linter/formatter config for the fork-added Python tooling
# (ai/, scripts/) and the existing python/ tree. Upstream-authored python/
# tests are formatted but not lint-failed (see [tool.ruff.lint.per-file-ignores]).

[project]
name = "vmaf-fork-tooling"
# Never-published tooling aggregate - independently versioned on purpose
# (ADR-1127, reaffirmed by ADR-1151). It carries no x-release-please-version
# marker; the three real Python distributions (ai/, dev-llm/,
# mcp-server/vmaf-mcp/) are the release-owned ones.
version = "0.0.0"
description = "VMAFx — Python tooling and scripts"
# Keep the tool-only root metadata at minor-series granularity. Dependabot's
# updater image can lag the latest CPython patch while workflows remain patch-pinned.
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | build
  | dist
  | subprojects
  | python/test/resource
  | compat/python-vmaf/resource
  | compat/python-vmaf/matlab
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "build",
  "subprojects",
  "python/test/resource",
  "compat/python-vmaf/resource",
  "compat/python-vmaf/matlab",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pyflakes + pycodestyle
  "I",             # isort
  "B",             # bugbear
  "C4",            # comprehensions
  "PIE",
  "RET",
  "SIM",
  "S",             # bandit (security)
  "PL",            # pylint subset
  "RUF",
  "PTH",           # flake8-use-pathlib: ban os.path.* in favour of pathlib.Path
]
ignore = [
  "E501",          # line length handled by black
  "PLR0913",       # too-many-arguments — VMAF feature kernels naturally take many
  "S101",          # assert is fine in tests

  # --- Rules that began firing with the ruff 0.15.17 -> 0.16.5 bump. ---
  #
  # The bump itself auto-fixed 595 findings across 137 files. These 34 are the
  # tail ruff cannot fix, and they are deferred rather than silenced: the intent
  # is to keep the gate exactly as strict as it was BEFORE the bump, so the
  # version upgrade does not smuggle in a refactor. Each is tracked for a
  # follow-up pass; none of them flags a defect we know of.
  "PLR0917",       # too-many-positional-arguments — the positional-only variant
                   # of PLR0913 above, already ignored for the same reason:
                   # feature kernels and training entry points take many.
  "BLE001",        # blind-except — the batch drivers under ai/scripts/ catch
                   # Exception per item on purpose, so one bad row does not kill
                   # a multi-hour run, and predictor.py does the same to fall
                   # back to the analytical curve when onnxruntime is absent.
                   # That mirrors the Python original's documented behaviour.
  "S110",          # try-except-pass — test cleanup paths only.
  "TRY004",        # raise TypeError for type checks. Changing the exception
                   # type of shipped library functions is a caller-visible API
                   # change; it does not belong in a lint-tool bump.
  "SIM102",        # collapsible-if
  "SIM103",        # return-condition-directly — the av1_videotoolbox probe
                   # keeps its explicit final `return False` as a documented
                   # defensive branch (ADR-0339).
  "SIM117",        # combine-with-statements
  "PLC0206",       # dict-index-missing-items
  "PLR0124",       # comparison-with-itself (NaN checks)
  "PLW1510",       # subprocess-run-without-check
  "DTZ011",        # date.today() without tz — these are report filenames.
]

[tool.ruff.lint.isort]
# Ruff's `I` ruleset is the project's only import sorter; the standalone isort
# hook was retired in ADR-1126 because the two implementations could not be
# made to agree (per-member trailing comments and alias ordering), which
# deadlocked `pre-commit run --all-files`. aiutils lives in ai/src/ (#908).
known-first-party = ["vmaf", "ai", "vmaf_train", "corpus", "aiutils"]

[tool.ruff.lint.per-file-ignores]
# Upstream Netflix Python is not our style canon. Keep F821 (undefined
# name) and real-bug pyflakes catching defects; silence bugbear /
# security / simplify / style families and the hygiene-only F/E codes
# (unused imports, unused vars, bare except) — those represent style
# drift Netflix owns, not regressions we introduced.
"python/**" = [
    "S", "PL", "B", "C4", "PIE", "RET", "SIM", "RUF", "I001", "PTH",
    "F401", "F522", "F541", "F841",
    "E402", "E711", "E722", "E731", "E741",
]
# Ad-hoc developer benchmark + one-off comparison scripts. They are
# manually invoked by humans, not shipped as part of libvmaf, so style
# drift is acceptable and the bandit `S` warnings (subprocess,
# try/except pass) are known-and-accepted in a dev context.
"testdata/**" = [
    "S", "PL", "B", "SIM", "RUF", "I001", "PTH",
    "F401", "F541", "F841",
    "E401", "E402", "E701", "E722", "W291", "W292",
]
# Upstream Netflix Python harness, relocated from python/vmaf/ to
# compat/python-vmaf/ by the VMAFX repo-layout refactor (ADR-0700).
# Same intent as the python/** exception above — Netflix style drift is
# not our canon. Mutable-class-attribute annotations (RUF012), dict()
# literal rewrites (C408), and the broader upstream style families are
# suppressed to keep upstream-parity code free from fork noise.
"compat/python-vmaf/**" = [
    "S", "PL", "B", "C4", "PIE", "RET", "SIM", "RUF", "I001", "PTH",
    "F401", "F522", "F541", "F841",
    "E402", "E711", "E722", "E731", "E741",
]
# Upstream Netflix dataset / model config scripts. Pure data, not
# business logic — they ship as fixtures and are not in our hot path.
# (Resource tree is also in [tool.ruff] extend-exclude; this per-file
# ignore block stays as a belt-and-suspenders guard for any files that
# slip past the directory exclude.)
"compat/python-vmaf/resource/**" = [
    "S", "PL", "B", "SIM", "RUF", "I001", "PTH",
    "F401", "F541", "F841",
    "E401", "E402", "E701", "E711", "E722", "W291", "W292",
]

[tool.pytest.ini_options]
testpaths = ["python/test", "ai/tests", "compat/vmaf/tests"]
addopts = "-ra --strict-markers"
# ai/src/ is the aiutils package root; add it so tests can ``import aiutils``
# without a pip-editable install.  (ai/scripts/ is added by each test file
# that imports a trainer script directly via sys.path.insert.)
# python/ exposes the ``vmaf`` shim package (compat/vmaf → compat/python-vmaf).
pythonpath = ["ai/src", "ai/scripts", "python"]
markers = [
  "netflix_golden: the 3 Netflix CPU golden test pairs (D24) — must always pass",
  "slow: tests that take more than 30s",
  "gpu: requires a GPU backend (CUDA/SYCL)",
]

[tool.mypy]
python_version = "3.10"
strict = true
# ai/src/ is the vmaf_train package source root. Declaring it via mypy_path lets
# mypy resolve `vmaf_train.*` imports in ai/scripts/ and ai/tests/ without the
# package being pip-installed. ai/src/ itself is excluded from the file-scan list
# to prevent the duplicate-module-name error (mypy would otherwise see each module
# twice: once as "ai.src.vmaf_train.X" from the ai/ argument and once as
# "vmaf_train.X" from mypy_path).
mypy_path = "ai/src"
exclude = [
  "build/",
  "subprojects/",
  "python/test/resource/",
  "ai/src/",
]

[[tool.mypy.overrides]]
module = "vmaf.*"
ignore_errors = true   # upstream library — not our type stubs to maintain

[[tool.mypy.overrides]]
# Suppress "Source file found twice" errors for the ai.src.vmaf_train.* namespace.
# This fires when a script imports vmaf_train.X (resolved via mypy_path → ai/src/)
# and mypy also sees the same file in the ai.src namespace via the legacy ai/ scan.
# The ai.src namespace is never used at runtime; only vmaf_train.* is.
module = ["ai.src.*", "ai.src.vmaf_train.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Packages that ship no py.typed marker and have no usable third-party stubs.
# Call sites are already type-safe at the boundary (explicit casts / guards).
module = [
  "onnxruntime",
  "onnxruntime.*",
  "lpips",
  "openvino",
  "openvino.*",
  "jsonschema",
  "sklearn",
  "sklearn.*",
  "tensorflow",
  "tensorflow.*",
  "pyarrow",
  "pyarrow.*",
  "scipy",
  "scipy.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true
