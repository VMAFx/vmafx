# Centralizes Python linter/formatter config for every tracked Python source.
# Source origin, generated status, and historical ownership never exempt a file.

[project]
name = "vmafx-tooling"
# Never-published tooling aggregate - independently versioned on purpose
# (ADR-1127, reaffirmed by ADR-1151). It carries no x-release-please-version
# marker; the three real Python distributions (ai/, dev-llm/,
# mcp-server/vmaf-mcp/) are the release-owned ones.
version = "0.0.0"
description = "VMAFx — Python tooling and scripts"
# Keep the tool-only root metadata at minor-series granularity. Dependabot's
# updater image can lag the latest CPython patch while workflows remain patch-pinned.
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/VMAFx/vmafx"
Repository = "https://github.com/VMAFx/vmafx"
Documentation = "https://vmafx.github.io/vmafx/"
Issues = "https://github.com/VMAFx/vmafx/issues"
Changelog = "https://github.com/VMAFx/vmafx/blob/master/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "build",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pyflakes + pycodestyle
  "I",             # isort
  "B",             # bugbear
  "C4",            # comprehensions
  "PIE",
  "RET",
  "SIM",
  "S",             # bandit (security)
  "PL",            # pylint subset
  "RUF",
  "PTH",           # flake8-use-pathlib: ban os.path.* in favour of pathlib.Path
]
ignore = [
  "E501",          # line length handled by black
  "PLR0913",       # too-many-arguments — VMAF feature kernels naturally take many
  "S101",          # assert is fine in tests

  # --- Rules that began firing with the ruff 0.15.17 -> 0.16.5 bump. ---
  #
  # The bump itself auto-fixed 595 findings across 137 files. These 34 are the
  # tail ruff cannot fix, and they are deferred rather than silenced: the intent
  # is to keep the gate exactly as strict as it was BEFORE the bump, so the
  # version upgrade does not smuggle in a refactor. Each is tracked for a
  # follow-up pass; none of them flags a defect we know of.
  "PLR0917",       # too-many-positional-arguments — the positional-only variant
                   # of PLR0913 above, already ignored for the same reason:
                   # feature kernels and training entry points take many.
  "BLE001",        # blind-except — the batch drivers under ai/scripts/ catch
                   # Exception per item on purpose, so one bad row does not kill
                   # a multi-hour run, and predictor.py does the same to fall
                   # back to the analytical curve when onnxruntime is absent.
                   # That mirrors the Python original's documented behaviour.
  "S110",          # try-except-pass — test cleanup paths only.
  "TRY004",        # raise TypeError for type checks. Changing the exception
                   # type of shipped library functions is a caller-visible API
                   # change; it does not belong in a lint-tool bump.
  "SIM102",        # collapsible-if
  "SIM103",        # return-condition-directly — the av1_videotoolbox probe
                   # keeps its explicit final `return False` as a documented
                   # defensive branch (ADR-0339).
  "SIM117",        # combine-with-statements
  "PLC0206",       # dict-index-missing-items
  "PLR0124",       # comparison-with-itself (NaN checks)
  "PLW1510",       # subprocess-run-without-check
  "DTZ011",        # date.today() without tz — these are report filenames.
]

[tool.ruff.lint.isort]
# Ruff's `I` ruleset is the project's only import sorter; the standalone isort
# hook was retired in ADR-1126 because the two implementations could not be
# made to agree (per-member trailing comments and alias ordering), which
# deadlocked `pre-commit run --all-files`. aiutils lives in ai/src/ (#908).
known-first-party = ["vmaf", "ai", "vmaf_train", "corpus", "aiutils"]

[tool.pytest.ini_options]
testpaths = ["python/test", "ai/tests", "compat/vmaf/tests"]
addopts = "-ra --strict-markers"
# ai/src/ is the aiutils package root; add it so tests can ``import aiutils``
# without a pip-editable install.  (ai/scripts/ is added by each test file
# that imports a trainer script directly via sys.path.insert.)
# python/ exposes the ``vmaf`` shim package (compat/vmaf → compat/python-vmaf).
pythonpath = ["ai/src", "ai/scripts", "python"]
markers = [
  "netflix_golden: the 3 Netflix CPU golden test pairs (D24) — must always pass",
  "slow: tests that take more than 30s",
  "gpu: requires a GPU backend (CUDA/SYCL)",
]

[tool.mypy]
python_version = "3.10"
strict = true
# ai/src/ is the vmaf_train package source root. Explicit package bases keep the
# source tree canonical without hiding the same files behind an excluded alias.
mypy_path = "ai/src"
explicit_package_bases = true
exclude = [
  "build/",
]

[[tool.mypy.overrides]]
# Packages that ship no py.typed marker and have no usable third-party stubs.
# Call sites are already type-safe at the boundary (explicit casts / guards).
module = [
  "onnxruntime",
  "onnxruntime.*",
  "lpips",
  "openvino",
  "openvino.*",
  "jsonschema",
  "sklearn",
  "sklearn.*",
  "tensorflow",
  "tensorflow.*",
  "pyarrow",
  "pyarrow.*",
  "scipy",
  "scipy.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true
