# Custom semantic patterns for the vmaf fork. Standard rule packs (cwe-top-25,
# cert-c, cert-cpp) are pulled in via `semgrep --config p/cert-c-strict
# --config p/cwe-top-25` in CI; this file holds project-specific rules.

rules:
  - id: vmaf-no-double-precision-loss-in-reduction
    pattern-either:
      - pattern: |
          float $ACC = 0;
          ...
          for (...) { ... $ACC += $X * $X * $X; ... }
      - pattern: |
          float $ACC = 0.0f;
          ...
          for (...) { ... $ACC += $X * $X * $X; ... }
    message: >
      Float accumulator for cubed values causes order-dependent drift between
      scalar and SIMD paths. Use double for outer accumulators in reductions
      (see commit 24c88a32 — float ADM csf_den_scale fix).
    languages: [c, cpp]
    severity: ERROR

  - id: vmaf-no-printf-precision-below-17g
    # Only flag printf-family calls where the score/metric variable is the
    # direct argument (name contains score, vmaf, aggregate, or feature).
    # A bare regex on %.<n>(f|g) matched every FPS counter, SVM model
    # serializer, and progress line in the codebase — 30 false positives.
    # Actual score precision is enforced by result_test.py's round-trip
    # assertion; this rule is the belt to that suspender.
    patterns:
      - pattern-either:
          - pattern: fprintf($F, $FMT, $X, ...)
          - pattern: printf($FMT, $X, ...)
          - pattern: snprintf($B, $N, $FMT, $X, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: '.*%\.[0-9]+[fg]\b.*'
      - metavariable-regex:
          metavariable: $X
          regex: '.*(score|vmaf|aggregate|metric)_?.*'
    paths:
      include:
        - /core/src/output.c
        - /core/src/libvmaf.c
        - /core/tools/vmaf.cpp
    message: >
      VMAF score output must be IEEE-754 round-trip lossless (%.17g). Lower
      precision in user-facing output silently truncates score deltas (see D11).
    languages: [c, cpp]
    severity: WARNING

  - id: vmaf-no-system-rand
    pattern-either:
      - pattern: rand()
      - pattern: srand($X)
    paths:
      exclude:
        # Upstream Netflix SVM cross-validation uses rand() for fold shuffling.
        # Tracked as cleanup debt; not gated here.
        - /core/src/svm.cpp
    message: Use a deterministic, seedable RNG (see CERT MSC30-C). VMAF must be reproducible.
    languages: [c, cpp]
    severity: ERROR

  - id: vmaf-no-strcpy-strcat-sprintf
    # This rule carries no `paths:` key, and must not grow one. ADR-1142 puts
    # every file under every standard — upstream-mirror, vendored, GPU, SIMD,
    # tests, tools — so a file is never exempt from a bounds rule because of
    # where it came from.
    #
    # Three origin-based excludes lived here until 2026-09-21. Each was
    # verified to protect nothing before removal:
    #   /core/tools/cli_parse.c — deleted under ADR-1155; the parser is
    #       cli_parse.cpp, which the glob never matched and which contains the
    #       token `sprintf` only inside a comment.
    #   /core/tools/y4m_input.c — the strcpy became a bounded memcpy of a
    #       string literal in bc00da0be.
    #   /matlab/**              — anchored at the repository root, where no
    #       `matlab/` directory exists. The MEX sources live under
    #       compat/python-vmaf/matlab/; their last banned call, a `sprintf`
    #       whose result was handed to mexErrMsgTxt in MEX/innerProd.c, also
    #       went in bc00da0be.
    #
    # Vendored code is NOT excluded (ADR-0683, ADR-1142). An earlier
    # `/core/src/mcp/3rdparty/**` entry here, together with a whole-file
    # `.semgrepignore` line, is why the cJSON 1.7.19 re-vendor could put
    # eleven banned calls back without any gate noticing. A re-vendor that
    # trips this rule re-applies the fork delta described in
    # core/src/mcp/3rdparty/cJSON/AGENTS.md; it does not get an exclusion.
    # scripts/ci/tests/test_semgrep_vendored_scope.py pins all of this.
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
    message: Use strncpy/strncat/snprintf with explicit bound. (CERT STR31-C / Power-of-10 Rule 9.)
    languages: [c, cpp]
    severity: ERROR

  - id: vmaf-no-malloc-without-check
    pattern: |
      $P = malloc(...);
      $P->$F = ...;
    message: Check malloc result before dereferencing. (Power-of-10 Rule 7.)
    languages: [c]
    severity: ERROR

  - id: vmaf-no-tmp-path-hardcoded
    pattern-either:
      - pattern: '"/tmp/..."'
      - pattern: 'fopen("/tmp/...", ...)'
    message: Use mkstemp() or g_get_tmp_dir(); hardcoded /tmp paths are TOCTOU-prone.
    languages: [c, cpp]
    severity: WARNING

  - id: vmaf-no-skip-hooks-in-scripts
    pattern-either:
      - pattern-regex: 'git\s+commit\s+.*--no-verify'
      - pattern-regex: 'git\s+push\s+.*--no-verify'
    paths:
      include:
        - "**/*.sh"
        - /.claude/**
    message: Hooks may not be skipped from scripts. Surface failures, fix root cause.
    languages: [generic]
    severity: ERROR

  - id: vmaf-test-float-identity-via-float-bits
    # CodeQL cpp/equality-on-floats reports `==` / `!=` between two computed
    # floating-point values (alerts 1593-1598). It reads only what its build
    # compiles, so the CUDA / HIP / SYCL twin tests never reached it. This rule
    # reads every test source before the push. Comparisons against a literal,
    # a macro or k-constant, and the `x != x` NaN idiom stay `==`, as CodeQL
    # allows them. The exemption covers a whole operand only (an optional sign
    # and one literal, macro or k-constant): `1.0 + y` or `(double)(y * 2.0)`
    # stays in scope. Literals cover decimal, hexadecimal and suffixed integer
    # forms (`0x10`, `1U`). A test source declares no non-const float with a
    # macro or k-constant name; scripts/ci/tests/test_semgrep_float_identity.py
    # checks that. The NaN idiom covers call-free operands only. Semgrep looks
    # through casts, so any operand cast to an integer type, such as
    # `(uint64_t)expected`, makes an integer comparison and is exempt. Narrowings
    # ported from VMAFx/pelorus commit e5e7c2e.
    # scripts/ci/tests/test_semgrep_float_identity.py plants each case.
    patterns:
      - pattern-either:
          # One typed side is enough: Semgrep infers no type for an
          # arithmetic operand such as `1.0 + y`, so requiring both sides
          # typed missed every comparison with a computed expression.
          - pattern: (double $A) == $B
          - pattern: $A == (double $B)
          - pattern: (double $A) != $B
          - pattern: $A != (double $B)
          - pattern: (float $A) == $B
          - pattern: $A == (float $B)
          - pattern: (float $A) != $B
          - pattern: $A != (float $B)
          # Both sides arithmetic, such as `(x + y) == (u + v)`: neither
          # side carries an inferred type, so a floating-point operand inside
          # each side selects the comparison. One side is not enough:
          # `(i + (int)x) == j` compares integers.
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-pattern:
                  metavariable: $A
                  patterns:
                    - pattern-either:
                        - pattern: (double $V)
                        - pattern: (float $V)
                        - patterns:
                            - pattern: (double * $V)
                            - metavariable-pattern:
                                metavariable: $A
                                pattern-regex: '\*'
                        - patterns:
                            - pattern: (float * $V)
                            - metavariable-pattern:
                                metavariable: $A
                                pattern-regex: '\*'
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
              - metavariable-pattern:
                  metavariable: $B
                  patterns:
                    - pattern-either:
                        - pattern: (double $W)
                        - pattern: (float $W)
                        - patterns:
                            - pattern: (double * $W)
                            - metavariable-pattern:
                                metavariable: $B
                                pattern-regex: '\*'
                        - patterns:
                            - pattern: (float * $W)
                            - metavariable-pattern:
                                metavariable: $B
                                pattern-regex: '\*'
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $X == $X
                - pattern: $X != $X
            # only a call-free operand: `next() == next()` compares two
            # results and stays in scope
            - metavariable-regex:
                metavariable: $X
                regex: '^(?!.*[\w\]\)]\s*\()[\s(]*[a-zA-Z_]\w*(?:\s*(?:\.|\->)\s*[a-zA-Z_]\w*|\s*\[[^()\[\]]+\])*[\s)]*$'
      # Semgrep types an operand through its cast, so `(uint64_t)expected`
      # reads as the double `expected`. An integer cast makes the comparison
      # an integer one when BOTH operands are integer-cast or the other
      # operand is not float-typed.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $X == ($CAST) $Y
                - pattern: ($CAST) $Y == $X
                - pattern: $X != ($CAST) $Y
                - pattern: ($CAST) $Y != $X
            - metavariable-regex:
                metavariable: $CAST
                regex: '^(uint[0-9]+_t|int[0-9]+_t|u?int|unsigned|long|short|char|signed\s+char|unsigned\s+char|unsigned\s+short|unsigned\s+int|unsigned\s+long|long\s+long|unsigned\s+long\s+long|size_t|ssize_t|ptrdiff_t|intptr_t|uintptr_t|bool)$'
            - metavariable-pattern:
                metavariable: $X
                patterns:
                  - pattern-not: (double $_)
                  - pattern-not: (float $_)
      - metavariable-regex:
          metavariable: $A
          regex: '^(?!\s*[-+]?\s*(0[bB][01][01'']*[uUlL]*|[0-9][0-9.'']*([eE][-+]?[0-9'']+)?[fFlLuU]*|0[xX][0-9A-Fa-f][0-9A-Fa-f'']*[uUlL]*|\.[0-9][0-9.'']*([eE][-+]?[0-9'']+)?[fFlL]?|0[xX]([0-9A-Fa-f'']+(\.[0-9A-Fa-f'']*)?|\.[0-9A-Fa-f'']+)[pP][-+]?[0-9'']+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
      - metavariable-regex:
          metavariable: $B
          regex: '^(?!\s*[-+]?\s*(0[bB][01][01'']*[uUlL]*|[0-9][0-9.'']*([eE][-+]?[0-9'']+)?[fFlLuU]*|0[xX][0-9A-Fa-f][0-9A-Fa-f'']*[uUlL]*|\.[0-9][0-9.'']*([eE][-+]?[0-9'']+)?[fFlL]?|0[xX]([0-9A-Fa-f'']+(\.[0-9A-Fa-f'']*)?|\.[0-9A-Fa-f'']+)[pP][-+]?[0-9'']+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
    paths:
      include:
        - /core/test/**
      # Declared exceptions only, one file each:
      # .config/lint-exceptions.d/vmaf-test-float-identity-via-float-bits.toml.
      # The test requires this list to equal the live entries there.
      exclude:
        - /core/test/test_pelorus_interop.c
    message: >
      Two computed floating-point values are compared with == or !=. Use
      vmaf_test_identical_f64() / _f32() from core/test/float_bits.h (negate it
      for "the two differ"); it also tells +0 from -0 (ADR-1502).
    languages: [c, cpp]
    severity: ERROR
