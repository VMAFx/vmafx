# Credits list (ADR-2468). One entry per third-party item VMAFx ships, vendors,
# adapts, learns from or uses. docs/credits.md renders its tables from this file;
# `make docs-fragments-write` rewrites them and `make docs-fragments-check` holds
# the list to the repository. The prose of docs/credits.md says how to add an entry.
#
# license: an SPDX expression exactly as the upstream states it, or one of
#   proprietary (a closed product, service or custom terms used as its provider
#   states them), none (the upstream states no licence) or unknown (not verified).
# Licences of GitHub-hosted projects were read from the repository LICENSE as
# GitHub detects it on 2026-10-08 and, where it could not decide, from the
# LICENSE file or the published package metadata; GNU licences carry -only or
# -or-later only where the upstream states which.
