<metadata id="figure-spec"><![CDATA[{"props":{"layout":{"direction":"column","gap":36,"children":[{"id":"train","label":"ai/","sub":"train, export, register (PyTorch, Lightning)","width":300},{"id":"models","label":"model/tiny/","sub":".onnx + sidecar .json, registry.json","shape":"store","width":300},{"id":"runtime","label":"core/src/dnn/","sub":"vmaf_use_tiny_model(), ONNX Runtime","width":300},{"id":"surfaces","label":"Surfaces","direction":"row","gap":28,"children":[{"id":"cli","label":"vmaf CLI","sub":"--tiny-model"},{"id":"ffmpeg","label":"FFmpeg","sub":"vf_vmafx, vf_vmafx_pre"}]}]},"edges":[{"from":"train","to":"models","label":"export_to_onnx"},{"from":"models","to":"runtime","label":"load"},{"from":"runtime","to":"cli"},{"from":"runtime","to":"ffmpeg"}],"steps":[{"label":"Train and ship","caption":"A model leaves Python as an ONNX file and is scored by the C runtime.","flow":[{"edges":"train->models","say":"ai/ trains the model and exports it to ONNX with its sidecar."},{"edges":"models->runtime","say":"vmaf_use_tiny_model() opens the committed model through ONNX Runtime."},{"edges":["runtime->cli","runtime->ffmpeg"],"say":"The CLI and the FFmpeg filters share that one runtime."}]}]}}]]></metadata>
