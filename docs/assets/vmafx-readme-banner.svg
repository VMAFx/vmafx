<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="VMAFx — perceptual video quality assessment, accelerated">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0a1a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- reference vs distorted: two traces converging, the thing VMAF measures -->
  <g fill="none" stroke-linecap="round">
    <path d="M520 78 C 600 48, 660 96, 740 70 S 880 40, 960 68 S 1080 92, 1160 60"
          stroke="url(#wave)" stroke-width="14"/>
    <path d="M520 78 C 600 48, 660 96, 740 70 S 880 40, 960 68 S 1080 92, 1160 60"
          stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <path d="M520 84 C 600 58, 660 102, 740 78 S 880 50, 960 76 S 1080 98, 1160 68"
          stroke="#7dd3fc" stroke-width="1.6" stroke-dasharray="7 9" opacity="0.6"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">VMAF<tspan fill="url(#accent)">x</tspan></text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="284" y="52">CUDA · SYCL · HIP · Metal</text>
    <text x="284" y="76">AVX2 · AVX-512 · NEON · SVE2</text>
  </g>
</svg>
