<!-- Exact roots whose real callers are absent from one configured
     compile_commands.json:
       - run_tests is called by core/test/test.c in each test executable;
       - OrtGetApiBase is the ORT test interposer consumed by ort_backend.c.
       - adm_dwt2_d is called by the compat Python Cython extension;
       - speed_internal_compute_means is called by the SYCL backend; and
       - vmaf_cambi_init_tvi_and_vlt is called by SYCL, HIP, and Metal.
     These are not public API or private-helper exemptions. Tests pin this
     five-name set and prove the real caller relationships and that unlisted
     dead helpers still fail. -->
<def format="2">
  <entrypoint name="OrtGetApiBase"/>
  <entrypoint name="adm_dwt2_d"/>
  <entrypoint name="run_tests"/>
  <entrypoint name="speed_internal_compute_means"/>
  <entrypoint name="vmaf_cambi_init_tvi_and_vlt"/>
</def>
