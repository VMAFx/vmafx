  # ---------------------------------------------------------------
  - id: "vulkan:0x8086:0x56*"
    label: "Intel Arc Alchemist A-series (Xe-HPG)"
    status: placeholder
    notes: >-
      Self-hosted Arc A380 runner exists (ADR-0220 audit) but has
      not yet emitted a calibration corpus. Tolerances revert to
      gate defaults until measured.
    features: {}

  # ---------------------------------------------------------------
  # Intel Battlemage (B-series, Xe2-HPG). Future hardware.
  # ---------------------------------------------------------------
  - id: "vulkan:0x8086:0xe2*"
    label: "Intel Arc Battlemage B-series (Xe2-HPG)"
    status: placeholder
    notes: >-
      Hardware not yet in fork CI. Entry reserves the shape for
      future calibration.
    features: {}

  # ---------------------------------------------------------------
  # SYCL — Intel Arc A380 / A770 / A750 (DG2-G10 die class).
  # Used when the parity gate is called with
  # ``--gpu-id arc:dg2-g10`` (per Research-0730 §6.3).
  #
  # Status: calibrated for float_ssim.
  # ``float_ssim`` diverges from CPU at places=4 (5e-5) on DG2-G10
  # due to two stacked causes:
  #   (1) The CPU path (float_ssim.c / iqa_ssim) uses the L×C×S
  #       decomposition with a sqrt(var_ref*var_cmp) contrast term,
  #       while the SYCL kernel (integer_ssim_sycl.cpp::float_ssim_sycl)
  #       uses the Wang 2004 Eq.(13) combined formula (2*covar directly).
  #       This is intentional design, not a bug.
  #   (2) DG2-G10 has shaderFloat64=false; fp32 accumulation drift over
  #       177 K pixel SSIM values compounds to ~2.7e-4 at the mean level.
  #       RTX 4090 (native fp64 in SYCL) passes at places=4.
  # Empirical max_abs_diff observed on Arc A380: 2.68e-4.
  # places=3 (5e-4) accommodates both effects; see Research-0985 §3.
  # ---------------------------------------------------------------
  - id: "arc:dg2-g10"
    label: "Intel Arc A380 / A770 / A750 (DG2-G10 die, SYCL)"
    status: calibrated
    notes: >-
      float_ssim tolerance relaxed to 5e-4 (places=3) for DG2-G10
      class Arc devices. Two stacked causes: CPU L×C×S formula vs.
      GPU Wang-2004 combined formula (intentional), plus fp32
      accumulation drift from lack of native fp64 on DG2-G10
      (max_abs_diff=2.68e-4 observed on Arc A380).
      RTX 4090 and lavapipe pass at places=4 (5e-5).
      See Research-0985 §3 and Research-0730 §6.1.
    features:
      float_ssim: 5.0e-4

  # ---------------------------------------------------------------
  # SYCL — Intel Compute Runtime on Arc. The driver_version is the
  # discriminating signal per ADR-0220 (different runtimes on the
  # same silicon emit different residuals).
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # Intel Arc Alchemist DG2/G10 — SYCL (Arc A380 and related).
  # vendorID 0x8086; device IDs 0x56a0–0x56a5 (DG2-G10 slice).
  #
  # Status: placeholder (T-SYCL-ARC-SSIMULACRA2-PARITY-2026-06-03).
  #
  # ssimulacra2 observed max_abs_diff = 8.72e-2 on Arc A380 (DG2-G10)
  # vs CPU scalar. Root cause: fp32-IIR accumulation drift in the
  # 3-pole Charalampidis blur (``ssimulacra2_sycl.cpp::launch_blur``)
  # over up to 329 rows of recurrence state per scale × 6 pyramid
  # scales. Arc A380 lacks native fp64 (ADR-0220); the IIR does not
  # use Kahan compensation. RTX 4090 passes places=2 (5e-3). The same
  # failure mode manifests on the Vulkan backend (max_abs_diff=5.48e-2,
  # Vulkan backend now dropped per ADR-0726).
  #
  # Short-term: this entry sets ssimulacra2 at places=2 (5e-3) as a
  # calibration anchor matching the default gate contract. The
  # observed divergence (8.72e-2) exceeds this threshold — the entry
  # serves as a named placeholder so gate tooling matches Arc A380
  # explicitly rather than falling through to the generic Intel glob.
  # A hardware-validated places=1 (5e-2) value should replace this
  # once Arc A380 hardware testing is possible (see TODO below).
  #
  # Long-term TODO (T-SYCL-ARC-SSIMULACRA2-PARITY-2026-06-03 §b):
  #   Kahan-compensated IIR rewrite in
  #   core/src/feature/sycl/ssimulacra2_sycl.cpp::launch_blur.
  #   The CUDA twin is in core/src/feature/cuda/ssimulacra2/
  #   ssimulacra2_iir_kernel.cu (or inline kernel files there).
  #   Requires Arc A380 hardware access to validate; RTX 4090 passes
  #   without the fix. Blocked on self-hosted Arc runner availability.
  #   Once Kahan-IIR lands and Arc A380 gate passes places=2, promote
  #   this entry to status: calibrated with the measured tolerance.
  # ---------------------------------------------------------------
  - id: "sycl:0x8086:0x56a*"
    label: "Intel Arc Alchemist DG2/G10 (SYCL, Arc A380 class)"
    status: placeholder
    notes: >-
      Arc A380 (DG2-G10) SYCL placeholder per T-SYCL-ARC-SSIMULACRA2-PARITY-2026-06-03.
      ssimulacra2 observed 8.72e-2 divergence vs CPU (fp32-IIR accumulation drift,
      ADR-0220 fp64-free contract). Tolerance anchored at the default places=2 (5e-3);
      replace with hardware-measured value once Arc A380 calibration corpus is available.
      Long-term fix: Kahan-compensated IIR in ssimulacra2_sycl.cpp::launch_blur.
    features:
      ssimulacra2: 5.0e-3

  - id: "sycl:0x8086:*"
    label: "Intel oneAPI SYCL (Arc, generic)"
    status: placeholder
    notes: >-
      Coarse fallback for any SYCL Intel device. Refine with a
      driver_version-pinned entry once ADR-0220's per-runtime
      residual matrix is reproduced under the calibration corpus.
    features: {}
