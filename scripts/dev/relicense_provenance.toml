# Copyright 2026 Lusoris
# SPDX-License-Identifier: EUPL-1.2
#
# Reviewed provenance for scripts/dev/relicense_fork_files.py (ADR-1250).
#
# A fork file that ports, copies or translates someone else's code keeps the
# terms it has and carries that code's copyright notice; it does not move to
# EUPL-1.2. This file records which files those are.
#
# - [sources.*]  An origin: the notices that must travel with its code, and its
#                licence. `notices_from` reads the notices out of the in-tree
#                copy of that code, so they stay verbatim across upstream syncs.
# - [[families]] Files chosen by role: a SIMD or GPU kernel implements the
#                upstream code that defines its metric, whether or not its
#                header says so. First matching family wins.
# - [ports.*]    Individual files reviewed as carrying other code, outside the
#                kernel directories or needing more origins than their family.
# - [not_ports]  Files whose header matched the derivation detector but which
#                were reviewed and carry no one else's code. The value says why.
#
# Precedence: ports, then not_ports, then families. A file the detector flags
# that appears in none of them keeps its terms until someone reviews it.

# ---------------------------------------------------------------------------
# Origins
# ---------------------------------------------------------------------------

[sources.libjxl]
# tools/ssimulacra2.cc in libjxl; the project's LICENSE is BSD-3-Clause.
notices = ["Copyright (c) the JPEG XL Project Authors."]
licences = ["BSD-3-Clause"]

[sources.xiph]
# Two-condition BSD text in the file itself.
notices_from = ["core/src/feature/third_party/xiph/psnr_hvs.c"]
licences = ["BSD-2-Clause"]

[sources.xiph-integer-ssim]
notices_from = ["core/src/feature/integer_ssim.c"]
licences = ["BSD-2-Clause"]

[sources.iqa]
# Three-condition BSD text (with the non-endorsement clause) in the file itself.
notices_from = ["core/src/feature/iqa/convolve.c"]
licences = ["BSD-3-Clause"]

[sources.netflix-integer-adm]
notices_from = ["core/src/feature/integer_adm.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-float-adm]
