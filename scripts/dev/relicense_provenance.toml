[ports."core/src/feature/ms_ssim_decimate.h"]
from = ["netflix-ms-ssim", "iqa"]
[ports."core/src/feature/pu21_ssim.c"]
from = ["iqa", "netflix-float-ssim"]  # "mirrors iqa_ssim() ... step-for-step", zli-nflx clamps
[ports."core/src/feature/speed_gpu_common.h"]
from = ["netflix-speed"]
[ports."core/src/feature/speed_internal.c"]
from = ["netflix-speed"]  # "a self-contained port of the static helpers in speed.c"
[ports."core/src/feature/speed_internal.h"]
from = ["netflix-speed"]
[ports."core/src/feature/speed_matmul.h"]
from = ["netflix-speed"]
[ports."core/src/feature/ssimulacra2.c"]
from = ["libjxl"]  # "scalar C port of the libjxl reference implementation"

# Tests whose scalar oracle is a transcription of upstream code.
[ports."core/src/feature/arm64/ssim_neon.c"]
from = ["iqa"]  # "mirror the scalar reference in iqa/ssim_tools.c byte-for-byte"
[ports."core/src/feature/x86/ssim_avx2.c"]
from = ["iqa"]  # same transcription, AVX2
[ports."core/test/test_adm_dwt2_neon.c"]
from = ["netflix-integer-adm"]  # mirrors dwt2_src_indices_filt()
[ports."core/test/test_adm_dwt2_x86.c"]
from = ["netflix-integer-adm"]  # mirrors dwt2_src_indices_filt(), static in integer_adm.c
[ports."core/test/test_vif_neon.c"]
from = ["netflix-integer-vif"]  # mirrors log_generate(), static in integer_vif.c
[ports."core/test/test_cambi_simd.c"]
from = ["netflix-cambi"]  # verbatim from cambi.c::calculate_c_values_row
[ports."core/test/test_ciede_neon.c"]
from = ["netflix-ciede-host"]  # verbatim copies of the ciede.c fallback loops
[ports."core/test/test_ciede_simd_parity.c"]
from = ["netflix-ciede-host"]  # scalar loop verbatim from the ciede.c fallback
[ports."core/test/test_integer_ssim_simd.c"]
from = ["xiph-integer-ssim"]  # verbatim copy of ssim_accumulate_row()
[ports."core/test/test_motion_avx512_parity.c"]
from = ["netflix-integer-motion"]  # line-for-line mirrors of integer_motion.c statics
[ports."core/test/test_psnr_hvs_avx2.c"]
from = ["xiph"]  # copies od_bin_fdct8x8
[ports."core/test/test_psnr_hvs_neon.c"]
from = ["xiph"]  # scalar reference copy of od_bin_fdct8x8
[ports."core/test/test_psnr_hvs_simd.c"]
from = ["xiph"]  # self-contained copy of calc_psnrhvs
[ports."core/test/test_speed_simd.c"]
from = ["netflix-speed"]  # mirrors compute_cov_kernel_scalar in speed.c

