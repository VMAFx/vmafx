licences = ["BSD-2-Clause-Patent"]

[sources.netflix-integer-vif]
notices_from = ["core/src/feature/integer_vif.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-float-vif]
notices_from = ["core/src/feature/vif_tools.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-nvidia-vif]
notices_from = ["core/src/feature/cuda/integer_vif_cuda.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-integer-motion]
notices_from = ["core/src/feature/integer_motion.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-motion-v2]
notices_from = ["core/src/feature/integer_motion_v2.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-float-motion]
notices_from = ["core/src/feature/float_motion.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-nvidia-motion]
# The .c carries only Netflix's line; NVIDIA's is on the header and the kernel.
notices_from = ["core/src/feature/cuda/integer_motion_cuda.h"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-integer-psnr]
notices_from = ["core/src/feature/integer_psnr.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-float-psnr]
notices_from = ["core/src/feature/float_psnr.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-float-ssim]
notices_from = ["core/src/feature/float_ssim.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-ms-ssim]
notices_from = ["core/src/feature/float_ms_ssim.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-moment]
notices_from = ["core/src/feature/float_moment.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-cambi]
notices_from = ["core/src/feature/cambi.c"]
licences = ["BSD-2-Clause-Patent"]

[sources.netflix-ciede]
# ciede.c carries Joshua Holmer's MIT-licensed CIEDE2000 math beside Netflix's code.
notices_from = ["core/src/feature/ciede.c"]
