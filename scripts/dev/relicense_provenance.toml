[sources.netflix-speed]
notices_from = ["core/src/feature/speed.c"]
licences = ["BSD-2-Clause-Patent"]

# ---------------------------------------------------------------------------
# Families: SIMD and GPU kernels, by the metric they implement
# ---------------------------------------------------------------------------

[[families]]
name = "ssimulacra2"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?ssimulacra2'
from = ["libjxl"]

[[families]]
name = "psnr-hvs"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*psnr_hvs'
from = ["xiph"]

[[families]]
name = "ms-ssim"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*ms_ssim'
from = ["netflix-ms-ssim", "iqa"]

[[families]]
name = "simd-integer-ssim"
match = '^core/src/feature/(x86|arm64)/integer_ssim'
from = ["xiph-integer-ssim"]

[[families]]
name = "metal-float-ssim"
match = '^core/src/feature/metal/float_ssim'
from = ["netflix-float-ssim", "iqa"]

[[families]]
name = "metal-integer-ssim"
match = '^core/src/feature/metal/integer_ssim'
from = ["xiph-integer-ssim"]

[[families]]
# The CUDA, HIP and SYCL SSIM files cross both lineages: ADR-0549 keeps
# upstream-mirror file names that define the float extractor under an integer_
# prefix, and their headers cite float_ssim.c and integer_ssim.c together.
name = "gpu-ssim"
match = '^core/src/feature/(cuda|hip|sycl)/(.+/)?[^/]*ssim'
from = ["netflix-float-ssim", "iqa", "xiph-integer-ssim"]

[[families]]
name = "float-adm"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?float_adm'
from = ["netflix-float-adm"]

[[families]]
name = "integer-adm"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*adm'
from = ["netflix-integer-adm"]

[[families]]
name = "float-vif"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?float_vif'
from = ["netflix-float-vif"]

[[families]]
name = "integer-vif"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*vif'
from = ["netflix-integer-vif"]

[[families]]
name = "motion-v2"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*motion_v2'
from = ["netflix-motion-v2"]

[[families]]
name = "float-motion"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?float_motion'
from = ["netflix-float-motion"]

[[families]]
name = "integer-motion"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*motion'
from = ["netflix-integer-motion"]

[[families]]
name = "float-psnr"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?float_psnr'
from = ["netflix-float-psnr"]

[[families]]
name = "integer-psnr"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*psnr'
from = ["netflix-integer-psnr"]

[[families]]
name = "cambi"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*cambi'
from = ["netflix-cambi"]

[[families]]
# The SIMD ciede kernels are the YUV-to-float preprocessing loops only; the
# CIEDE2000 math stays scalar. The GPU kernels below carry that math.
name = "simd-ciede"
match = '^core/src/feature/(x86|arm64)/ciede'
from = ["netflix-ciede-host"]

[[families]]
name = "ciede"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*ciede'
from = ["netflix-ciede"]

[[families]]
name = "moment"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*moment'
from = ["netflix-moment"]

[[families]]
name = "speed"
match = '^core/src/feature/(x86|arm64|cuda|hip|sycl|metal)/(.+/)?[^/]*speed'
from = ["netflix-speed"]

[[families]]
name = "iqa-convolve"
match = '^core/src/feature/(x86|arm64)/convolve_'
from = ["iqa"]

# ---------------------------------------------------------------------------
# Individually reviewed
# ---------------------------------------------------------------------------

# HIP and Metal files that document porting the NVIDIA-contributed upstream
# CUDA extractors, not only the Netflix CPU reference.
[ports."core/src/feature/hip/integer_adm_hip.c"]
from = ["netflix-nvidia-adm"]
[ports."core/src/feature/hip/integer_adm_hip.h"]
from = ["netflix-nvidia-adm"]
[ports."core/src/feature/metal/integer_adm.metal"]
from = ["netflix-integer-adm", "netflix-nvidia-adm"]
[ports."core/src/feature/metal/integer_adm_metal.mm"]
from = ["netflix-integer-adm", "netflix-nvidia-adm"]
[ports."core/src/feature/hip/integer_motion_hip.c"]
from = ["netflix-nvidia-motion"]
[ports."core/src/feature/hip/integer_motion_hip.h"]
from = ["netflix-nvidia-motion"]
[ports."core/src/feature/hip/integer_motion/motion_score.hip"]
from = ["netflix-nvidia-motion"]
[ports."core/src/feature/hip/integer_vif_hip.h"]
from = ["netflix-nvidia-vif"]

# Feature-directory helpers that carry upstream code or data.
[ports."core/src/feature/adm_angle_flag.h"]
from = ["netflix-integer-adm"]  # "the frozen expression, verbatim" from decouple()
[ports."core/src/feature/cambi_internal.h"]
from = ["netflix-cambi"]  # exposes cambi.c's per-stage helpers
[ports."core/src/feature/delta_e_itp.c"]
from = ["netflix-ciede-host"]  # "Mirrors ciede.c": plane reads, chroma upsampling
[ports."core/src/feature/ms_ssim_decimate.c"]
